<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#F7F2EB;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#0F0F0E;position:relative}
.dots{position:absolute;inset:0;background-image:radial-gradient(circle,#0F0F0E 1.2px,transparent 1.2px);background-size:28px 28px;opacity:.06}
.left{position:absolute;left:72px;top:64px;width:600px}
.brand{display:flex;align-items:center;gap:10px;font-size:30px;font-weight:900;letter-spacing:-.5px}
.brand b{color:#F37E4A}
.chip{display:inline-block;margin-top:40px;background:#FDE6D8;color:#C84516;font-weight:700;font-size:20px;padding:8px 16px;border-radius:8px}
h1{margin-top:22px;font-size:66px;line-height:1.14;font-weight:900;letter-spacing:-1px}
.pillars{display:flex;gap:10px;margin-top:34px}
.p{background:#fff;border:2.5px solid #0F0F0E;border-radius:12px;padding:10px 14px}
.p i{display:block;font-style:normal;font-size:13px;font-weight:900;color:#F37E4A;letter-spacing:2px}
.p span{display:block;font-size:20px;font-weight:700;margin-top:2px;white-space:nowrap}
.shot{position:absolute;left:720px;top:70px;width:600px;height:470px;border:3px solid #0F0F0E;border-radius:18px;overflow:hidden;background:#fff;box-shadow:10px 10px 0 #0F0F0E}
.bar{height:30px;border-bottom:2px solid #EFE7D6;display:flex;gap:7px;align-items:center;padding-left:14px}
.bar s{width:11px;height:11px;border-radius:50%;background:#E8DECC}
.shot img{display:block;width:1080px;margin-left:-385px;margin-top:-55px}
.foot{position:absolute;right:48px;bottom:30px;font-size:18px;font-weight:700;color:#6B6660}
</style></head><body>
<div class="dots"></div>
<div class="left">
  <div class="brand"><svg width="30" height="35" viewBox="0 0 24 28"><path d="M12 2 C 16 8, 22 14, 22 19 A 10 10 0 0 1 2 19 C 2 14, 8 8, 12 2 Z" fill="#F37E4A" stroke="#0F0F0E" stroke-width="2.2" stroke-linejoin="round"/></svg>onBrand <b>Studio</b></div>
  <div class="chip">4A 品牌策略方法 × 每月真實社群數據</div>
  <h1>經過訓練與認證的<br>AI 行銷團隊</h1>
  <div class="pillars">
    <div class="p"><i>01</i><span>懂品牌大腦</span></div>
    <div class="p"><i>02</i><span>擁有任務庫</span></div>
    <div class="p"><i>03</i><span>整合公司的 AI 技能</span></div>
  </div>
</div>
<div class="shot"><div class="bar"><s></s><s></s><s></s></div><img src="../public/static/landing/planner.jpg"></div>
<div class="foot">by SoWork · onbrand.sowork.ai</div>
</body></html>
