<?xml version="1.0" encoding="UTF-8"?>
<!--
  onBrand Studio · OG cover (1200×630)
  Editorial-illustration style matching www.sowork.ai: thick black outlines,
  cream + orange + black palette. Drop into FB / LINE / LinkedIn / Twitter.

  Note: Many social platforms also accept SVG, but for maximum compatibility,
  convert this to PNG via:  https://cloudconvert.com/svg-to-png  (1200×630)
  and replace at /static/covers/og-onbrand-cover.png

  Created 2026-06-12 by Claude as a placeholder until CJ supplies a final asset.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">

  <!-- Background: cream -->
  <rect width="1200" height="630" fill="#F7F2EB"/>

  <!-- Dot grid texture -->
  <defs>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#0F0F0E" opacity="0.06"/>
    </pattern>
    <pattern id="dotsInner" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#0F0F0E" opacity="0.13"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Top-left: brand droplet logo + wordmark -->
  <g transform="translate(70, 60)">
    <!-- Droplet -->
    <path d="M 28 6 C 38 24, 50 38, 50 50 A 22 22 0 0 1 6 50 C 6 38, 18 24, 28 6 Z"
          fill="#E85D2E" stroke="#0F0F0E" stroke-width="3" stroke-linejoin="round"/>
    <!-- Wordmark -->
    <text x="68" y="42" font-family="-apple-system, system-ui, 'Noto Sans CJK TC', sans-serif"
          font-size="32" font-weight="900" fill="#0F0F0E" letter-spacing="-0.5">
      OnBrand<tspan fill="#E85D2E">.ai</tspan>
    </text>
  </g>

  <!-- BETA badge -->
  <g transform="translate(280, 64)">
    <rect x="0" y="0" width="56" height="22" rx="3" fill="#E85D2E"/>
    <text x="28" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="900"
          fill="#FFFFFF" letter-spacing="2.5" text-anchor="middle">BETA</text>
  </g>

  <!-- Pill chip top of headline -->
  <g transform="translate(70, 160)">
    <rect x="0" y="0" width="200" height="34" rx="6" fill="#FDE6D8"/>
    <text x="100" y="22" font-family="-apple-system, system-ui, sans-serif" font-size="14"
          font-weight="700" fill="#C84516" text-anchor="middle">AI 驅動的品牌大腦</text>
  </g>

  <!-- Hero headline (two lines, very heavy) -->
  <text x="70" y="270" font-family="-apple-system, 'PingFang TC', 'Noto Sans CJK TC', sans-serif"
        font-size="72" font-weight="900" fill="#0F0F0E" letter-spacing="-2">
    onBrand Studio
  </text>
  <text x="70" y="346" font-family="-apple-system, 'PingFang TC', 'Noto Sans CJK TC', sans-serif"
        font-size="72" font-weight="900" fill="#0F0F0E" letter-spacing="-2" opacity="0.85">
    品牌 AI 行銷工作室
  </text>

  <!-- Sub-pitch -->
  <text x="70" y="406" font-family="-apple-system, 'PingFang TC', 'Noto Sans CJK TC', sans-serif"
        font-size="22" font-weight="500" fill="#3A3633">
    鎖定一次品牌定位 · 每篇貼文自動 on-brand
  </text>

  <!-- 4 USP chips -->
  <g transform="translate(70, 445)" font-family="-apple-system, system-ui, sans-serif">
    <!-- 01 Brand Brain -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="240" height="48" rx="10" fill="#FFFFFF" stroke="#0F0F0E" stroke-width="2"/>
      <text x="14" y="20" font-size="10" font-weight="900" fill="#E85D2E" letter-spacing="2">01 / 品牌大腦</text>
      <text x="14" y="37" font-size="14" font-weight="700" fill="#0F0F0E">鎖定一次 · 每篇照品牌寫</text>
    </g>
    <!-- 02 Tiers -->
    <g transform="translate(250, 0)">
      <rect x="0" y="0" width="240" height="48" rx="10" fill="#FFFFFF" stroke="#0F0F0E" stroke-width="2"/>
      <text x="14" y="20" font-size="10" font-weight="900" fill="#E85D2E" letter-spacing="2">02 / 三種規格</text>
      <text x="14" y="37" font-size="14" font-weight="700" fill="#0F0F0E">單篇 · 套組 · 企劃</text>
    </g>
  </g>

  <!-- Stats bar at bottom -->
  <g transform="translate(0, 540)">
    <rect x="0" y="0" width="1200" height="90" fill="#0F0F0E"/>
    <g font-family="-apple-system, system-ui, sans-serif" fill="#FFFFFF">
      <!-- 16,113 -->
      <text x="70" y="40" font-size="34" font-weight="900" fill="#E85D2E" letter-spacing="-1">16,113</text>
      <text x="70" y="60" font-size="11" opacity="0.7">個 AI 行銷專家</text>
      <!-- 168 -->
      <text x="240" y="40" font-size="34" font-weight="900" fill="#E85D2E" letter-spacing="-1">168</text>
      <text x="240" y="60" font-size="11" opacity="0.7">個得獎工藝任務</text>
      <!-- 7 -->
      <text x="380" y="40" font-size="34" font-weight="900" fill="#E85D2E" letter-spacing="-1">7</text>
      <text x="380" y="60" font-size="11" opacity="0.7">大全管道</text>
      <!-- 14 -->
      <text x="490" y="40" font-size="34" font-weight="900" fill="#E85D2E" letter-spacing="-1">14</text>
      <text x="490" y="60" font-size="11" opacity="0.7">步建品牌大腦</text>
    </g>
    <!-- SoWork attribution right -->
    <text x="1130" y="50" font-family="-apple-system, system-ui, sans-serif" font-size="13"
          font-weight="700" fill="#FFFFFF" opacity="0.7" text-anchor="end">by SoWork</text>
  </g>

  <!-- ── Right side: editorial Brand Brain illustration ── -->
  <g transform="translate(700, 110)">
    <!-- Outer card frame with offset shadow -->
    <rect x="6" y="8" width="430" height="380" rx="22" fill="#0F0F0E" opacity="0.85"/>
    <rect x="0" y="0" width="430" height="380" rx="22" fill="#FFFFFF" stroke="#0F0F0E" stroke-width="3"/>

    <!-- Dot pattern inside card -->
    <rect x="18" y="18" width="394" height="344" rx="14" fill="url(#dotsInner)"/>

    <!-- Floating card 1: BRAND POSITIONING (radar) -->
    <g transform="translate(28, 36)">
      <rect width="160" height="130" rx="10" fill="#FFFFFF" stroke="#0F0F0E" stroke-width="2.5"/>
      <text x="14" y="24" font-family="system-ui" font-size="11" font-weight="900" fill="#0F0F0E" letter-spacing="0.8">BRAND POSITIONING</text>
      <g transform="translate(80, 80)">
        <polygon points="0,-40 32,-15 28,28 -28,28 -32,-15" fill="#E85D2E" fill-opacity="0.65" stroke="#0F0F0E" stroke-width="1.8"/>
        <polygon points="0,-48 44,-12 30,38 -30,38 -44,-12" fill="none" stroke="#0F0F0E" stroke-width="1" stroke-opacity="0.4"/>
        <line x1="0" y1="0" x2="0" y2="-48" stroke="#0F0F0E" stroke-width="1" stroke-opacity="0.4"/>
        <line x1="0" y1="0" x2="44" y2="-12" stroke="#0F0F0E" stroke-width="1" stroke-opacity="0.4"/>
        <line x1="0" y1="0" x2="30" y2="38" stroke="#0F0F0E" stroke-width="1" stroke-opacity="0.4"/>
        <line x1="0" y1="0" x2="-30" y2="38" stroke="#0F0F0E" stroke-width="1" stroke-opacity="0.4"/>
        <line x1="0" y1="0" x2="-44" y2="-12" stroke="#0F0F0E" stroke-width="1" stroke-opacity="0.4"/>
      </g>
    </g>

    <!-- Floating card 2: ANALYTICS (line chart top right) -->
    <g transform="translate(238, 36)">
      <rect width="160" height="100" rx="10" fill="#FFFFFF" stroke="#0F0F0E" stroke-width="2.5"/>
      <text x="14" y="22" font-family="system-ui" font-size="11" font-weight="900" fill="#0F0F0E" letter-spacing="0.8">ANALYTICS</text>
      <text x="14" y="36" font-family="system-ui" font-size="11" font-weight="900" fill="#0F0F0E" letter-spacing="0.8">+247%</text>
      <polyline points="14,86 36,76 58,80 80,56 102,62 124,38 146,28"
                fill="none" stroke="#E85D2E" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <polygon points="146,28 137,26 142,38" fill="#E85D2E" stroke="#0F0F0E" stroke-width="1"/>
      <circle cx="36" cy="76" r="3" fill="#0F0F0E"/>
      <circle cx="80" cy="56" r="3" fill="#0F0F0E"/>
      <circle cx="124" cy="38" r="3" fill="#0F0F0E"/>
    </g>

    <!-- Central: laptop / brand brain device -->
    <g transform="translate(85, 195)">
      <rect width="260" height="150" rx="8" fill="#FAEBD9" stroke="#0F0F0E" stroke-width="2.5"/>
      <rect x="12" y="12" width="236" height="18" rx="4" fill="#FFFFFF" stroke="#0F0F0E" stroke-width="1.5"/>
      <text x="18" y="25" font-family="system-ui" font-size="9" font-weight="900" fill="#0F0F0E">BRAND BRAIN · 14 STEPS LOCKED ✓</text>

      <!-- Pie chart -->
      <circle cx="48" cy="78" r="24" fill="#FFFFFF" stroke="#0F0F0E" stroke-width="2"/>
      <path d="M 48 78 L 48 54 A 24 24 0 0 1 68 90 Z" fill="#E85D2E"/>
      <path d="M 48 78 L 68 90 A 24 24 0 0 1 32 96 Z" fill="#0F0F0E"/>
      <path d="M 48 78 L 32 96 A 24 24 0 0 1 48 54 Z" fill="#F5B89A"/>

      <!-- Bar chart -->
      <rect x="92" y="92" width="8" height="14" fill="#0F0F0E"/>
      <rect x="104" y="78" width="8" height="28" fill="#E85D2E"/>
      <rect x="116" y="62" width="8" height="44" fill="#0F0F0E"/>
      <rect x="128" y="68" width="8" height="38" fill="#E85D2E"/>
      <rect x="140" y="54" width="8" height="52" fill="#0F0F0E"/>

      <!-- KPI tile -->
      <rect x="160" y="60" width="84" height="42" rx="5" fill="#FFFFFF" stroke="#0F0F0E" stroke-width="2"/>
      <text x="168" y="76" font-family="system-ui" font-size="8" font-weight="800" fill="#0F0F0E" opacity="0.6">REACH</text>
      <text x="168" y="95" font-family="system-ui" font-size="18" font-weight="900" fill="#E85D2E">+247%</text>

      <!-- Progress bar -->
      <rect x="12" y="118" width="236" height="8" rx="4" fill="#FFFFFF" stroke="#0F0F0E" stroke-width="1.5"/>
      <rect x="12" y="118" width="180" height="8" rx="4" fill="#E85D2E"/>
      <text x="12" y="140" font-family="system-ui" font-size="9" font-weight="800" fill="#0F0F0E">Day 5 of 7 · All channels on-brand</text>
    </g>

    <!-- Decorative dots -->
    <circle cx="380" cy="200" r="4" fill="#E85D2E"/>
    <circle cx="40" cy="240" r="3" fill="#0F0F0E"/>
    <path d="M 360 340 L 372 340 M 366 334 L 366 346" stroke="#E85D2E" stroke-width="2.5" stroke-linecap="round"/>
  </g>

</svg>
