name: Admin — Audit nginx timeouts per location block

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            FILE=/etc/nginx/sites-enabled/marketing-os
            echo "════════ All location blocks + their timeout settings ════════"
            sudo awk '
              /^\s*location\s/ { in_loc=1; loc_name=$2; print "── " loc_name " ──"; }
              in_loc && /proxy_read_timeout/ { print "  " $0 }
              in_loc && /proxy_send_timeout/ { print "  " $0 }
              in_loc && /proxy_connect_timeout/ { print "  " $0 }
              in_loc && /proxy_pass/ { print "  " $0 }
              /^\s*}/ && in_loc { in_loc=0; print "" }
            ' $FILE
