name: Admin — Trace /theater LLM activity right now

on:
  workflow_dispatch:

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            LOG_OUT=/home/$(whoami)/.pm2/logs/marketing-os-out.log
            LOG_ERR=/home/$(whoami)/.pm2/logs/marketing-os-error.log
            echo "── last 80 lines of error log ─────"
            tail -80 "$LOG_ERR" 2>/dev/null
            echo
            echo "── invokeLLM cascade events in out log (last 60) ─────"
            tail -3000 "$LOG_OUT" 2>/dev/null | grep -iE "invokeLLM|CoT|cascade|falling back|All LLM providers|empty content|theater|qaPolish" | tail -60
            echo
            echo "── confirm env settings ─────"
            grep -E "^AZURE_FOUNDRY_MODEL=|^AZURE_FOUNDRY_FALLBACK_MODEL=|^LLM_FALLBACK_CHAIN=|^LLM_DEFAULT_PROVIDER=|^ANTHROPIC_MODEL=" /opt/marketing-os/app/skills/ai-talent/.env
