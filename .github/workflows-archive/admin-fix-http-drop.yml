name: Admin — Fix HTTP→HTTPS redirect for drop.sowork.ai

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            set -e

            echo "════════ STEP 1: Show current marketing-os full config ════════"
            sudo cat /etc/nginx/sites-enabled/marketing-os | head -120

            echo ""
            echo "════════ STEP 2: Test from VM what HTTP returns for drop ════════"
            curl -sS -i --max-time 5 -H "Host: drop.sowork.ai" http://localhost/ 2>&1 | head -8

            echo ""
            echo "════════ STEP 3: 看 listen 80 block 的完整 server_name 列 ════════"
            sudo grep -B1 -A2 "listen 80" /etc/nginx/sites-enabled/marketing-os
