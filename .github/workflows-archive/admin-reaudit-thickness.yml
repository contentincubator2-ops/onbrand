name: Admin — Re-audit thickness after upgrades

on:
  workflow_dispatch:
    inputs:
      ids_csv:
        description: 'CSV of agent IDs to audit'
        required: true
        type: string

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 90s
          envs: IDS_CSV
          script: |
            export MYSQL_PWD="mos_secure_2026"
            MYSQLT="mysql -h localhost -u mos_user mos_db -t"
            IDS="${IDS_CSV}"
            THICK="(CHAR_LENGTH(IFNULL(bio,''))+CHAR_LENGTH(IFNULL(specialty,''))+CHAR_LENGTH(IFNULL(methodology,''))+CHAR_LENGTH(IFNULL(experienceDetail,'')))"

            echo "=== Bins ==="
            $MYSQLT -e "
              SELECT
                CASE
                  WHEN total >= 800 THEN 'A. >=800'
                  WHEN total >= 400 THEN 'B. 400-799'
                  WHEN total >= 200 THEN 'C. 200-399'
                  WHEN total >= 100 THEN 'D. 100-199'
                  ELSE                    'E. <100'
                END AS bin, COUNT(*) AS n
              FROM (SELECT id, $THICK AS total FROM agents WHERE id IN ($IDS)) t
              GROUP BY bin ORDER BY bin"

            echo ""
            echo "=== Still under 400 chars (need next round) ==="
            $MYSQLT -e "
              SELECT id, name, title, $THICK AS total
              FROM agents WHERE id IN ($IDS) AND $THICK < 400
              ORDER BY total ASC"
        env:
          IDS_CSV: ${{ inputs.ids_csv }}
