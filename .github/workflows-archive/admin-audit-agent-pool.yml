name: Admin — Audit agent pool (find unique-per-task candidates)

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 120s
          script: |
            export MYSQL_PWD="${LOCAL_DB_PASSWORD}"
            MYSQL="mysql -h localhost -u mos_user mos_db -B -N --silent"
            MYSQLT="mysql -h localhost -u mos_user mos_db -t"

            echo "=== 1. Total agents + persona depth distribution ==="
            $MYSQLT -e "
              SELECT
                COUNT(*) AS total_agents,
                SUM(CASE WHEN CHAR_LENGTH(IFNULL(bio,'')) >= 100 THEN 1 ELSE 0 END) AS bio_100plus,
                SUM(CASE WHEN CHAR_LENGTH(IFNULL(specialty,'')) >= 100 THEN 1 ELSE 0 END) AS specialty_100plus,
                SUM(CASE WHEN CHAR_LENGTH(IFNULL(methodology,'')) >= 100 THEN 1 ELSE 0 END) AS methodology_100plus,
                SUM(CASE WHEN CHAR_LENGTH(IFNULL(experienceDetail,'')) >= 100 THEN 1 ELSE 0 END) AS experience_100plus,
                SUM(CASE WHEN isAvailable=1 THEN 1 ELSE 0 END) AS available
              FROM agents WHERE reviewStatus='approved'"

            echo ""
            echo "=== 2. Average persona char length per platform (by primarySkill prefix) ==="
            $MYSQLT -e "
              SELECT
                CASE
                  WHEN primarySkill LIKE 'fb-%' OR primarySkill LIKE '%facebook%' THEN 'facebook'
                  WHEN primarySkill LIKE 'ig-%' OR primarySkill LIKE '%instagram%' THEN 'instagram'
                  WHEN primarySkill LIKE 'yt-%' OR primarySkill LIKE '%youtube%' THEN 'youtube'
                  WHEN primarySkill LIKE 'tt-%' OR primarySkill LIKE '%tiktok%' THEN 'tiktok'
                  WHEN primarySkill LIKE 'li-%' OR primarySkill LIKE '%linkedin%' THEN 'linkedin'
                  WHEN primarySkill LIKE '%email%' THEN 'email'
                  WHEN primarySkill LIKE '%press%' OR primarySkill LIKE '%pr-%' THEN 'press'
                  ELSE 'other'
                END AS platform,
                COUNT(*) AS agents,
                ROUND(AVG(CHAR_LENGTH(IFNULL(bio,'')) + CHAR_LENGTH(IFNULL(specialty,'')) + CHAR_LENGTH(IFNULL(methodology,'')))) AS avg_persona_chars
              FROM agents WHERE isAvailable=1 AND reviewStatus='approved'
              GROUP BY platform ORDER BY agents DESC"

            echo ""
            echo "=== 3. FB-related agents pool (slug or skill keyword) ==="
            $MYSQLT -e "
              SELECT id, name, title, primarySkill,
                CHAR_LENGTH(IFNULL(bio,'')) AS bio,
                CHAR_LENGTH(IFNULL(specialty,'')) AS sp,
                CHAR_LENGTH(IFNULL(methodology,'')) AS m
              FROM agents
              WHERE isAvailable=1 AND reviewStatus='approved'
                AND (slug LIKE 'fb-%' OR primarySkill LIKE '%facebook%' OR primarySkill LIKE 'fb-%' OR title LIKE '%Facebook%' OR title LIKE '%FB%')
              ORDER BY (CHAR_LENGTH(IFNULL(bio,'')) + CHAR_LENGTH(IFNULL(specialty,'')) + CHAR_LENGTH(IFNULL(methodology,''))) DESC
              LIMIT 40"

            echo ""
            echo "=== 4. IG-related agents pool ==="
            $MYSQLT -e "
              SELECT id, name, title, primarySkill,
                CHAR_LENGTH(IFNULL(bio,'')) AS bio,
                CHAR_LENGTH(IFNULL(specialty,'')) AS sp
              FROM agents
              WHERE isAvailable=1 AND reviewStatus='approved'
                AND (slug LIKE 'ig-%' OR primarySkill LIKE '%instagram%' OR primarySkill LIKE 'ig-%' OR title LIKE '%Instagram%' OR title LIKE '%IG%')
              ORDER BY (CHAR_LENGTH(IFNULL(bio,'')) + CHAR_LENGTH(IFNULL(specialty,'')) + CHAR_LENGTH(IFNULL(methodology,''))) DESC
              LIMIT 30"

            echo ""
            echo "=== 5. YT pool ==="
            $MYSQLT -e "
              SELECT id, name, title, primarySkill,
                CHAR_LENGTH(IFNULL(bio,'')) AS bio,
                CHAR_LENGTH(IFNULL(specialty,'')) AS sp
              FROM agents
              WHERE isAvailable=1 AND reviewStatus='approved'
                AND (slug LIKE 'yt-%' OR slug LIKE '%youtube%' OR primarySkill LIKE '%youtube%' OR title LIKE '%YouTube%')
              ORDER BY (CHAR_LENGTH(IFNULL(bio,'')) + CHAR_LENGTH(IFNULL(specialty,'')) + CHAR_LENGTH(IFNULL(methodology,''))) DESC
              LIMIT 25"

            echo ""
            echo "=== 6. TikTok / Short-video pool ==="
            $MYSQLT -e "
              SELECT id, name, title, primarySkill,
                CHAR_LENGTH(IFNULL(bio,'')) AS bio
              FROM agents
              WHERE isAvailable=1 AND reviewStatus='approved'
                AND (slug LIKE 'tt-%' OR slug LIKE '%tiktok%' OR primarySkill LIKE '%tiktok%' OR title LIKE '%TikTok%' OR primarySkill LIKE '%short-video%')
              ORDER BY (CHAR_LENGTH(IFNULL(bio,'')) + CHAR_LENGTH(IFNULL(specialty,''))) DESC
              LIMIT 25"

            echo ""
            echo "=== 7. LinkedIn / Email / PR pool ==="
            $MYSQLT -e "
              SELECT id, name, title, primarySkill
              FROM agents
              WHERE isAvailable=1 AND reviewStatus='approved'
                AND (primarySkill LIKE '%linkedin%' OR primarySkill LIKE '%email%' OR primarySkill LIKE '%press%' OR primarySkill LIKE '%pr-%' OR primarySkill LIKE '%newsletter%' OR title LIKE '%LinkedIn%' OR title LIKE '%PR%' OR title LIKE '%Email%' OR title LIKE '%Press%')
              ORDER BY id LIMIT 30"

            echo ""
            echo "=== 8. Currently used agent_ids in 30s task templates (will need diversity audit) ==="
            echo "(static list — see quickTaskFB.ts / quickTaskIG.ts / quickTaskYT.ts / quickTaskTikTok.ts)"

            echo ""
            echo "=== 9. Top 5 thickest persona agents per platform (sample what 'rich' looks like) ==="
            $MYSQLT -e "
              SELECT id, name, title, CHAR_LENGTH(bio) bio, CHAR_LENGTH(specialty) sp, CHAR_LENGTH(methodology) m
              FROM agents WHERE isAvailable=1 AND reviewStatus='approved'
              ORDER BY (CHAR_LENGTH(IFNULL(bio,'')) + CHAR_LENGTH(IFNULL(specialty,'')) + CHAR_LENGTH(IFNULL(methodology,''))) DESC
              LIMIT 5"

            echo "=== Audit done ==="
