name: Admin — Audit aiModel distribution across the 170 in-use agents

# Answer CJ's question:
#   1. What aiModel values are pinned across the 170 agents actually used by quickTasks?
#   2. Distribution: how many agents per model?
#   3. Are there role/title patterns (logic-heavy agents → reasoning models?)
#   4. What % of the chain is Anthropic-dependent (i.e. how much breaks when Anthropic dies)?

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            set -e
            cd /opt/marketing-os/app/skills/ai-talent
            export AGENT_IDS=$(grep -ohE 'agent_id:\s*[0-9]+' server/_core/quickTask*.ts | awk '{print $2}' | sort -u | paste -sd,)
            export MYSQL_PWD="mos_secure_2026"
            MYSQLT="mysql -h localhost -u mos_user mos_db -t --default-character-set=utf8mb4"

            echo "════════════════════════════════════════════════════════"
            echo "  Agent aiModel audit (170 in-use)"
            echo "════════════════════════════════════════════════════════"

            echo
            echo "── 1. Distribution by aiModel value ─────"
            $MYSQLT -e "
              SELECT
                IFNULL(aiModel, '(NULL)') AS aiModel,
                COUNT(*) AS agent_count,
                ROUND(COUNT(*) * 100.0 / (SELECT COUNT(*) FROM agents WHERE id IN ($AGENT_IDS)), 1) AS pct
              FROM agents
              WHERE id IN ($AGENT_IDS)
              GROUP BY aiModel
              ORDER BY agent_count DESC;
            "

            echo
            echo "── 2. Anthropic dependency (agents that break when Claude is down) ─────"
            $MYSQLT -e "
              SELECT
                CASE
                  WHEN aiModel IS NULL THEN '(unset)'
                  WHEN aiModel LIKE '%anthropic%' OR aiModel LIKE '%claude%' THEN 'anthropic-dependent'
                  WHEN aiModel LIKE '%openai%'    OR aiModel LIKE '%gpt%'    THEN 'openai-dependent'
                  WHEN aiModel LIKE '%qwen%'                                  THEN 'qwen-dependent'
                  WHEN aiModel LIKE '%deepseek%'                              THEN 'deepseek-dependent'
                  WHEN aiModel LIKE '%gemini%'    OR aiModel LIKE '%google%' THEN 'google-dependent'
                  ELSE 'other'
                END AS vendor,
                COUNT(*) AS agents
              FROM agents
              WHERE id IN ($AGENT_IDS)
              GROUP BY vendor
              ORDER BY agents DESC;
            "

            echo
            echo "── 3. Sample 30 agents — role/title vs model (looking for patterns) ─────"
            $MYSQLT -e "
              SELECT
                id,
                LEFT(name, 14) AS name,
                LEFT(title, 36) AS title,
                IFNULL(LEFT(aiModel, 36), '(NULL)') AS aiModel,
                LEFT(IFNULL(primarySkill, ''), 24) AS skill
              FROM agents
              WHERE id IN ($AGENT_IDS)
              ORDER BY aiModel, title
              LIMIT 30;
            "

            echo
            echo "── 4. Cross-tab: skill family × model ─────"
            $MYSQLT -e "
              SELECT
                CASE
                  WHEN title LIKE '%Strateg%' OR title LIKE '%Planner%' OR title LIKE '%Analy%' OR title LIKE '%Research%' THEN 'strategy/research'
                  WHEN title LIKE '%Writer%'  OR title LIKE '%Copy%'   OR title LIKE '%Editor%' OR title LIKE '%Content%'  THEN 'writer/editor'
                  WHEN title LIKE '%Designer%' OR title LIKE '%Director%' OR title LIKE '%Creative%'                       THEN 'creative/design'
                  WHEN title LIKE '%Engineer%' OR title LIKE '%Developer%' OR title LIKE '%Architect%'                     THEN 'engineering'
                  WHEN title LIKE '%Manager%' OR title LIKE '%Lead%'  OR title LIKE '%Coordin%'                            THEN 'manager/lead'
                  ELSE 'other'
                END AS role_family,
                CASE
                  WHEN aiModel LIKE '%anthropic%' OR aiModel LIKE '%claude%' THEN 'anthropic'
                  WHEN aiModel LIKE '%gpt%' OR aiModel LIKE '%openai%' THEN 'openai'
                  WHEN aiModel LIKE '%qwen%' THEN 'qwen'
                  WHEN aiModel LIKE '%deepseek%' THEN 'deepseek'
                  WHEN aiModel LIKE '%gemini%' OR aiModel LIKE '%google%' THEN 'google'
                  WHEN aiModel IS NULL THEN 'unset'
                  ELSE 'other'
                END AS vendor,
                COUNT(*) AS agents
              FROM agents
              WHERE id IN ($AGENT_IDS)
              GROUP BY role_family, vendor
              ORDER BY role_family, agents DESC;
            "

            echo
            echo "── 5. Specific Anthropic-pinned agents — what kinds of work do they do? ─────"
            $MYSQLT -e "
              SELECT LEFT(title, 40) AS title, COUNT(*) AS n
              FROM agents
              WHERE id IN ($AGENT_IDS)
                AND (aiModel LIKE '%anthropic%' OR aiModel LIKE '%claude%')
              GROUP BY title
              ORDER BY n DESC
              LIMIT 20;
            "

            echo
            echo "── 6. Where in code is agent.aiModel actually CONSUMED? ─────"
            grep -rn "aiModel\|aiModelToProvider" server/_core/quickTaskOrchestra.ts server/_core/llm.ts server/agentContextLoader.ts 2>/dev/null | head -15
