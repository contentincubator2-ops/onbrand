name: Admin — Emergency restore + clean rebuild

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 600s
          script: |
            set -e
            cd /opt/marketing-os/app/skills/ai-talent

            echo "════════ STEP 1: Restore public.bak if public missing ════════"
            if [ ! -d public ] && [ -d public.bak ]; then
              echo "→ Restoring public.bak → public"
              mv public.bak public
              ls public/assets/ | head -3
            fi

            echo ""
            echo "════════ STEP 2: Clean rebuild (vite outputs to ../public) ════════"
            cd client
            npm run build 2>&1 | tail -10
            cd ..

            echo ""
            echo "════════ STEP 3: Verify bundle has new code ════════"
            echo "── ALL bundle files (main is the largest) ──"
            ls -la public/assets/index-*.js
            echo ""
            for BUNDLE in public/assets/index-*.js; do
              SIZE=$(stat -c%s "$BUNDLE")
              echo "── ${BUNDLE} (${SIZE} bytes) ──"
              echo "  proposal-cover: $(grep -c 'proposal-cover' "$BUNDLE" 2>/dev/null || echo 0)"
              echo "  research-doc:   $(grep -c 'research-doc' "$BUNDLE" 2>/dev/null || echo 0)"
              echo "  PROPOSAL · :    $(grep -c 'PROPOSAL ·' "$BUNDLE" 2>/dev/null || echo 0)"
              echo "  fb-30-ad:       $(grep -c 'fb-30-ad' "$BUNDLE" 2>/dev/null || echo 0)"
            done

            echo ""
            echo "════════ STEP 4: Restart pm2 ════════"
            pm2 restart marketing-os --update-env
            sleep 3
            pm2 status | grep marketing-os

            echo ""
            echo "════════ STEP 5: Smoke test ════════"
            echo "── public/index.html ──"
            head -3 public/index.html
            echo "── /api/health ──"
            curl -s http://localhost:3101/api/health 2>&1 | head -2 || echo "(no /api/health)"
