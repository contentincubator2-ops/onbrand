name: Admin — Debug missions schema + LLM provider chain

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 120s
          script: |
            export MYSQL_PWD="mos_secure_2026"
            MYSQL="mysql -h localhost -u mos_user mos_db"

            echo "════════ missions table schema ════════"
            $MYSQL -e "SHOW CREATE TABLE missions \G" | head -40

            echo ""
            echo "════════ Live recordTaskRun.ts (status column literal) ════════"
            cd /opt/marketing-os/app/skills/ai-talent
            grep -n "status" server/_core/recordTaskRun.ts | head -10

            echo ""
            echo "════════ llmRouter — what providers exist + endpoints ════════"
            grep -n "azure-foundry\|anthropic/v1\|claude-haiku\|getAnthropicEndpoint\|key-1" server/_core/llm.ts 2>/dev/null | head -20
            grep -n "anthropic\|azure-foundry" server/_core/llmRouter.ts 2>/dev/null | head -20

            echo ""
            echo "════════ Test direct anthropic API call from VM ════════"
            cd /opt/marketing-os/app/skills/ai-talent
            ANTHROPIC_KEY=$(grep -E "^ANTHROPIC_API_KEY=" .env | head -1 | cut -d'=' -f2-)
            if [ -n "$ANTHROPIC_KEY" ]; then
              curl --max-time 15 -s -w "\nHTTP %{http_code} · time %{time_total}s\n" \
                https://api.anthropic.com/v1/messages \
                -H "x-api-key: $ANTHROPIC_KEY" \
                -H "anthropic-version: 2023-06-01" \
                -H "content-type: application/json" \
                -d '{"model":"claude-haiku-4-5-20251001","max_tokens":50,"messages":[{"role":"user","content":"say hi in 5 words"}]}' 2>&1 | tail -10
            fi

            echo ""
            echo "════════ Test qwen API call ════════"
            QWEN_KEY=$(grep -E "^QWEN_API_KEY=" .env | head -1 | cut -d'=' -f2-)
            if [ -n "$QWEN_KEY" ]; then
              curl --max-time 15 -s -w "\nHTTP %{http_code} · time %{time_total}s\n" \
                https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions \
                -H "Authorization: Bearer $QWEN_KEY" \
                -H "Content-Type: application/json" \
                -d '{"model":"qwen-plus","messages":[{"role":"user","content":"say hi"}]}' 2>&1 | tail -5
            fi
