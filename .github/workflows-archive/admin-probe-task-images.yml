name: Admin — Probe recent task images

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            cd /opt/marketing-os/app/skills/ai-talent
            set -a; . ./.env; set +a
            export MYSQL_PWD="${LOCAL_DB_PASSWORD}"
            MYSQL="mysql -h ${LOCAL_DB_HOST:-localhost} -u ${LOCAL_DB_USER:-mos_user} ${LOCAL_DB_NAME:-mos_db}"

            echo "=== recent mission_outputs (last 15) ==="
            $MYSQL -e "SELECT id, missionId, platform, status, JSON_EXTRACT(metadata, '$.image.url') AS imgUrl, JSON_EXTRACT(metadata, '$.image.status') AS imgStatus, JSON_EXTRACT(metadata, '$.image.errorMsg') AS imgErr, createdAt FROM mission_outputs ORDER BY id DESC LIMIT 15" -t 2>&1 | head -30

            echo ""
            echo "=== mission_outputs sample metadata JSON ==="
            $MYSQL -e "SELECT id, JSON_PRETTY(metadata) FROM mission_outputs ORDER BY id DESC LIMIT 3" -t 2>&1 | head -60

            echo ""
            echo "=== latest mission_outputs by tier ==="
            $MYSQL -e "SELECT JSON_EXTRACT(metadata, '$.tier') AS tier, COUNT(*) AS n, MAX(createdAt) AS latest FROM mission_outputs GROUP BY tier ORDER BY latest DESC LIMIT 10" -t

            echo ""
            echo "=== most recent 60s + 99s/100s outputs ==="
            $MYSQL -e "SELECT id, JSON_EXTRACT(metadata, '$.tier') AS tier, JSON_EXTRACT(metadata, '$.thumbnailUrl') AS thumb, JSON_EXTRACT(metadata, '$.errors') AS errs, createdAt FROM mission_outputs WHERE JSON_EXTRACT(metadata, '$.tier') IN ('60s','99s','100s') ORDER BY id DESC LIMIT 10" -t

            echo ""
            echo "=== piapi-related log lines (last 200 OUT) ==="
            LOG_OUT=/home/$(whoami)/.pm2/logs/marketing-os-out.log
            tail -500 "$LOG_OUT" 2>/dev/null | grep -iE "piapi|flux|genOneImage|dispatchGenerate" | tail -30

            echo ""
            echo "=== runOrchestra image branch (last 500 OUT) ==="
            tail -500 "$LOG_OUT" 2>/dev/null | grep -iE "image|visual" | grep -v "/static/" | tail -30
