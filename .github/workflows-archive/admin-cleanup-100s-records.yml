name: Admin — Cleanup 100s tier records

# CJ「現在應該沒有100S，請清除100S的紀錄」.
# Two-phase:
#  - mode=probe (default): count + list what would be affected, no writes
#  - mode=delete: hard-delete mission_outputs where metadata.tier = '100s'
#  - mode=rename: rename tier '100s' → '99s' in metadata JSON (preserves data)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe (default) | rename | delete"
        required: false
        default: "probe"

jobs:
  cleanup:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 3
    steps:
      - name: Run
        run: |
          set -e
          AI=/opt/marketing-os/app/skills/ai-talent
          set -a; source "$AI/.env" 2>/dev/null; set +a
          export MYSQL_PWD="${LOCAL_DB_PASSWORD}"
          MYSQL="mysql -h ${LOCAL_DB_HOST:-localhost} -u ${LOCAL_DB_USER:-mos_user} ${LOCAL_DB_NAME:-mos_db}"

          MODE="${{ github.event.inputs.mode }}"
          MODE="${MODE:-probe}"
          echo "mode = $MODE"

          echo ""
          echo "=== Count rows with tier='100s' ==="
          $MYSQL -B -N --silent -e "
            SELECT COUNT(*) FROM mission_outputs
             WHERE JSON_UNQUOTE(JSON_EXTRACT(metadata, '\$.tier')) = '100s'
          "

          echo ""
          echo "=== Sample (last 10) ==="
          $MYSQL -e "
            SELECT id, missionId, platform, status,
                   JSON_UNQUOTE(JSON_EXTRACT(metadata, '\$.tier')) AS tier,
                   createdAt
              FROM mission_outputs
             WHERE JSON_UNQUOTE(JSON_EXTRACT(metadata, '\$.tier')) = '100s'
             ORDER BY id DESC LIMIT 10
          " -t

          if [ "$MODE" = "rename" ]; then
            echo ""
            echo "=== RENAME: tier 100s → 99s in metadata ==="
            $MYSQL -e "
              UPDATE mission_outputs
                 SET metadata = JSON_SET(metadata, '\$.tier', '99s')
               WHERE JSON_UNQUOTE(JSON_EXTRACT(metadata, '\$.tier')) = '100s'
            "
            echo "Done."
          elif [ "$MODE" = "delete" ]; then
            echo ""
            echo "=== DELETE: mission_outputs where tier='100s' ==="
            $MYSQL -e "
              DELETE FROM mission_outputs
               WHERE JSON_UNQUOTE(JSON_EXTRACT(metadata, '\$.tier')) = '100s'
            "
            echo "Done."
          else
            echo ""
            echo "Probe mode — no DB writes. Re-run with mode=rename or mode=delete."
          fi

          echo ""
          echo "=== Post-action tier breakdown ==="
          $MYSQL -e "
            SELECT JSON_UNQUOTE(JSON_EXTRACT(metadata, '\$.tier')) AS tier,
                   COUNT(*) AS n
              FROM mission_outputs
             GROUP BY tier
             ORDER BY n DESC
          " -t
