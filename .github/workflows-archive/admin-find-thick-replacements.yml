name: Admin — Find thick replacements (≥400 char persona) per role

on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 90s
          script: |
            export MYSQL_PWD="${LOCAL_DB_PASSWORD}"
            MYSQLT="mysql -h localhost -u mos_user mos_db -t"

            # All currently assigned IDs (we're already using these — exclude from candidates)
            EXCLUDED="(24,25,26,27,28,29,31,32,35,36,38,39,40,60001,60003,60008,60011,60012,60013,60021,60022,60029,60030,60035,60036,60037,60038,60048,60055,60056,60060,60061,60062,60068,60071,60072,60080,90004,90005,90006,90011,90021,90025,90027,180001,180005,180006,180015,180030,180038,180039,180054,180062,180068,180141,180143,180157,180159,180165,180166,180167,180168,180170,180203,180268,180559,180592,180605,180606,180643,180657,180855,210004,210005,210015,210017,210018,210019,210220,210252,220164,220504,220506,220507,220508,220535,220540,220583,220584,220721,220722,220723,220724,220725,220726,220727,220728,220729,220730,220731,220732,220733,220734,220735,220736,220737,220738,220739,220740,220751,220752,220753,220754,220755,220756,220757,220758,220759,220760,220862,220863,220864,220866,220868,220890,220891,220892,220893,220894,220895,220896,220913,220959,229985,232765,239022,239023,239024,239025,239027,239028,239030,239031,239183,239184,239185)"

            # Thickness column expression
            THICK="(CHAR_LENGTH(IFNULL(bio,''))+CHAR_LENGTH(IFNULL(specialty,''))+CHAR_LENGTH(IFNULL(methodology,''))+CHAR_LENGTH(IFNULL(experienceDetail,'')))"

            echo "=== A. Thick FB strategist replacements (for cross-platform diversity) ==="
            $MYSQLT -e "
              SELECT id, name, title,
                $THICK AS total
              FROM agents
              WHERE isAvailable=1 AND reviewStatus='approved'
                AND id NOT IN $EXCLUDED
                AND (LOWER(title) LIKE '%facebook%' OR LOWER(title) LIKE '%social media%' OR LOWER(title) LIKE '%community%')
                AND $THICK >= 400
              ORDER BY $THICK DESC LIMIT 15"

            echo ""
            echo "=== B. Thick IG strategist replacements ==="
            $MYSQLT -e "
              SELECT id, name, title, $THICK AS total
              FROM agents
              WHERE isAvailable=1 AND reviewStatus='approved' AND id NOT IN $EXCLUDED
                AND (LOWER(title) LIKE '%instagram%' OR LOWER(title) LIKE '%creator%' OR LOWER(title) LIKE '%influencer%')
                AND $THICK >= 400
              ORDER BY $THICK DESC LIMIT 15"

            echo ""
            echo "=== C. Thick YT strategist replacements ==="
            $MYSQLT -e "
              SELECT id, name, title, $THICK AS total
              FROM agents
              WHERE isAvailable=1 AND reviewStatus='approved' AND id NOT IN $EXCLUDED
                AND (LOWER(title) LIKE '%youtube%' OR LOWER(title) LIKE '%video%' OR LOWER(title) LIKE '%channel%')
                AND $THICK >= 400
              ORDER BY $THICK DESC LIMIT 15"

            echo ""
            echo "=== D. Thick TikTok strategist replacements ==="
            $MYSQLT -e "
              SELECT id, name, title, $THICK AS total
              FROM agents
              WHERE isAvailable=1 AND reviewStatus='approved' AND id NOT IN $EXCLUDED
                AND (LOWER(title) LIKE '%tiktok%' OR LOWER(title) LIKE '%short%video%' OR LOWER(title) LIKE '%short-form%')
                AND $THICK >= 400
              ORDER BY $THICK DESC LIMIT 15"

            echo ""
            echo "=== E. Thick LinkedIn strategist replacements ==="
            $MYSQLT -e "
              SELECT id, name, title, $THICK AS total
              FROM agents
              WHERE isAvailable=1 AND reviewStatus='approved' AND id NOT IN $EXCLUDED
                AND (LOWER(title) LIKE '%linkedin%' OR LOWER(title) LIKE '%b2b%' OR LOWER(title) LIKE '%thought leader%')
                AND $THICK >= 400
              ORDER BY $THICK DESC LIMIT 15"

            echo ""
            echo "=== F. Thick Email/Newsletter replacements ==="
            $MYSQLT -e "
              SELECT id, name, title, $THICK AS total
              FROM agents
              WHERE isAvailable=1 AND reviewStatus='approved' AND id NOT IN $EXCLUDED
                AND (LOWER(title) LIKE '%email%' OR LOWER(title) LIKE '%newsletter%' OR LOWER(title) LIKE '%CRM%' OR LOWER(title) LIKE '%lifecycle%')
                AND $THICK >= 400
              ORDER BY $THICK DESC LIMIT 15"

            echo ""
            echo "=== G. Thick PR / Communications replacements ==="
            $MYSQLT -e "
              SELECT id, name, title, $THICK AS total
              FROM agents
              WHERE isAvailable=1 AND reviewStatus='approved' AND id NOT IN $EXCLUDED
                AND (LOWER(title) LIKE '%pr %' OR LOWER(title) LIKE '%public relation%' OR LOWER(title) LIKE '%press%' OR LOWER(title) LIKE '%comms%' OR LOWER(title) LIKE '%communication%' OR LOWER(title) LIKE '%spokesperson%')
                AND $THICK >= 400
              ORDER BY $THICK DESC LIMIT 15"

            echo ""
            echo "=== H. Thick visual/design replacements ==="
            $MYSQLT -e "
              SELECT id, name, title, $THICK AS total
              FROM agents
              WHERE isAvailable=1 AND reviewStatus='approved' AND id NOT IN $EXCLUDED
                AND (LOWER(title) LIKE '%design%' OR LOWER(title) LIKE '%visual%' OR LOWER(title) LIKE '%art direct%' OR LOWER(title) LIKE '%illustrator%' OR LOWER(title) LIKE '%creative%')
                AND $THICK >= 600
              ORDER BY $THICK DESC LIMIT 20"

            echo ""
            echo "=== I. Thick crisis/legal/compliance replacements ==="
            $MYSQLT -e "
              SELECT id, name, title, $THICK AS total
              FROM agents
              WHERE isAvailable=1 AND reviewStatus='approved' AND id NOT IN $EXCLUDED
                AND (LOWER(title) LIKE '%legal%' OR LOWER(title) LIKE '%compliance%' OR LOWER(title) LIKE '%crisis%' OR LOWER(title) LIKE '%counsel%' OR LOWER(title) LIKE '%risk%')
                AND $THICK >= 400
              ORDER BY $THICK DESC LIMIT 15"

            echo ""
            echo "=== Done ==="
