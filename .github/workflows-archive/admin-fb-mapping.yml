name: Admin — FB agent/skill mapping for 30s tasks (deep dive)

on:
  workflow_dispatch:

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 90s
          script: |
            export MYSQL_PWD="${LOCAL_DB_PASSWORD}"
            MYSQL="mysql -h localhost -u mos_user mos_db -B -N --silent"

            echo "=== A. Agents whose primarySkill suggests FB / caption / copy / hook / crisis / story ==="
            $MYSQL -e "SELECT id, name, title, primarySkill FROM agents WHERE isAvailable=1 AND (primarySkill LIKE '%fb-%' OR primarySkill LIKE '%hook%' OR primarySkill LIKE '%caption%' OR primarySkill LIKE '%copywriting%' OR primarySkill LIKE '%hashtag%' OR primarySkill LIKE '%crisis%' OR primarySkill LIKE '%comment%' OR primarySkill LIKE '%story%' OR primarySkill LIKE '%pinned%' OR primarySkill LIKE '%countdown%') ORDER BY primarySkill, id LIMIT 60"

            echo ""
            echo "=== B. Agents with FB in slug/name ==="
            $MYSQL -e "SELECT id, slug, name, title, primarySkill FROM agents WHERE isAvailable=1 AND (slug LIKE 'fb-%' OR slug LIKE '%-fb-%' OR title LIKE '%FB%' OR title LIKE '%Facebook%') ORDER BY id LIMIT 30"

            echo ""
            echo "=== C. Skills in skill_catalog matching FB tasks ==="
            $MYSQL -e "SELECT slug, name, category FROM skill_catalog WHERE slug LIKE 'fb-%' OR slug LIKE '%hook%' OR slug LIKE '%caption%' OR slug LIKE '%copywriting%' OR slug LIKE '%hashtag%' OR slug LIKE '%crisis%' OR slug LIKE '%comment%' OR slug LIKE '%pinned%' OR slug LIKE '%countdown%' OR slug LIKE '%story%' OR slug LIKE '%brief%' ORDER BY category, slug LIMIT 60"

            echo ""
            echo "=== D. Skill categories overview ==="
            $MYSQL -e "SELECT category, COUNT(*) AS n FROM skill_catalog WHERE category LIKE 'fb-%' OR category LIKE '%-fb%' OR category LIKE '%facebook%' GROUP BY category ORDER BY n DESC LIMIT 15"

            echo ""
            echo "=== E. Existing FB squads (for 90s tier mapping) ==="
            $MYSQL -e "SELECT id, slug, name, missionType, JSON_LENGTH(steps) AS step_count FROM squads WHERE is_active=1 AND is_approved=1 AND (slug LIKE 'fb-%' OR workspace='[\"facebook\"]' OR workspace='facebook') ORDER BY slug LIMIT 30"

            echo ""
            echo "=== F. Agents whose skills[] (JSON array) contains hook / story / hashtag / countdown / pinned ==="
            $MYSQL -e "SELECT id, slug, name, title, primarySkill FROM agents WHERE isAvailable=1 AND (JSON_SEARCH(skills, 'one', 'hook-writing') IS NOT NULL OR JSON_SEARCH(skills, 'one', 'fb-copywriting') IS NOT NULL OR JSON_SEARCH(skills, 'one', 'social-copy') IS NOT NULL OR JSON_SEARCH(skills, 'one', 'brand-voice-consistency') IS NOT NULL OR JSON_SEARCH(skills, 'one', 'crisis-communication') IS NOT NULL) ORDER BY name LIMIT 30"

            echo ""
            echo "=== G. fb-livestream-prep squad row + its lead agent ==="
            $MYSQL -e "SELECT id, slug, name, lead_agent_id, JSON_LENGTH(steps) AS step_count, is_approved FROM squads WHERE slug = 'fb-livestream-prep' OR slug LIKE '%livestream%' OR slug LIKE '%live-prep%'"
            echo ""
            $MYSQL -e "SELECT a.id, a.slug, a.name, a.title, a.primarySkill FROM squads s JOIN agents a ON a.id = s.lead_agent_id WHERE s.slug = 'fb-livestream-prep' LIMIT 1"

            echo ""
            echo "=== H. fb-countdown-series + fb-carousel + fb-reels-script lead agents ==="
            $MYSQL -e "SELECT s.slug, a.id AS agent_id, a.name, a.title, a.primarySkill FROM squads s JOIN agents a ON a.id = s.lead_agent_id WHERE s.slug IN ('fb-countdown-series','fb-carousel','fb-reels-script','fb-crisis-reply','fb-crisis-comms')"

            echo ""
            echo "=== I. Agents whose name contains 'Story' or whose title contains 'Story / hashtag / pinned / countdown' ==="
            $MYSQL -e "SELECT id, slug, name, title, primarySkill FROM agents WHERE isAvailable=1 AND (title LIKE '%Story%' OR title LIKE '%hashtag%' OR title LIKE '%倒數%' OR title LIKE '%Hashtag%' OR title LIKE '%Pinned%' OR title LIKE '%釘選%' OR title LIKE '%Countdown%') ORDER BY id LIMIT 20"

            echo ""
            echo "=== J. Aiden Hsu's full record (verify skills array) ==="
            $MYSQL -e "SELECT id, slug, name, title, primarySkill, skills FROM agents WHERE slug = 'fb-brief-writer' OR (name = 'Aiden Hsu') LIMIT 5" | head -10

            echo ""
            echo "=== Done ==="
