name: Admin — PiAPI Flux 400 — full response body

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            cd /opt/marketing-os/app/skills/ai-talent
            set -a; . ./.env; set +a

            echo "── 1. Short English prompt (control) ─────"
            curl -s --max-time 15 "https://api.piapi.ai/api/v1/task" \
              -H "x-api-key: $PIAPI_KEY" \
              -H "Content-Type: application/json" \
              -d '{"model":"Qubico/flux1-schnell","task_type":"txt2img","input":{"prompt":"red apple on white plate","width":1024,"height":1024}}' \
              | head -c 500
            echo

            echo
            echo "── 2. Mimicking the app's actual request (multi-line + brand context) ─────"
            PROMPT_BODY=$(cat <<'EOF'
            Brand: 桂冠營養研究室
            Positioning: 65歲以上族群的營養補充權威
            Archetype: 守護者
            Voice: 溫暖、專業、有醫學依據
            Audience: 中年子女關心家中長輩的飲食
            Colour palette: warm cream, soft amber, deep brown
            Channel: FB

            Scene:
            主角 / 場景：你的退休長輩坐在公園長椅曬太陽
            鏡頭：中景，主體稍微偏左、留白給文字。
            光線：自然柔光，從窗戶斜進來的暖色調。
            氛圍：寫實、生活感、不刻意擺拍。
            風格：摹片風（不要過度修圖、不要 3D 渲染感），會自動套用品牌色彩 / 調性。

            Rendering: editorial photography, natural light, no text overlays, no watermarks, clean composition.
            EOF
            )
            JSON=$(python3 -c "import json,sys; print(json.dumps({'model':'Qubico/flux1-schnell','task_type':'txt2img','input':{'prompt':sys.stdin.read(),'width':1024,'height':1024}}))" <<< "$PROMPT_BODY")
            curl -s --max-time 15 "https://api.piapi.ai/api/v1/task" \
              -H "x-api-key: $PIAPI_KEY" \
              -H "Content-Type: application/json" \
              -d "$JSON" \
              | head -c 1000
            echo

            echo
            echo "── 3. PiAPI account status (rate limit / credits) ─────"
            curl -s --max-time 10 "https://api.piapi.ai/api/v1/user/info" \
              -H "x-api-key: $PIAPI_KEY" \
              | head -c 500
            echo
