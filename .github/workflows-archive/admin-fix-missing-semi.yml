name: Admin — Fix missing semicolon in nginx port-80 redirect

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 30s
          script: |
            FILE=/etc/nginx/sites-enabled/marketing-os
            sudo sed -i 's|return 301 https://drop\.sowork\.ai\$request_uri$|return 301 https://drop.sowork.ai$request_uri;|' $FILE
            sudo grep -n "return 301" $FILE
            sudo nginx -t
            sudo nginx -s reload && echo "✓ reloaded"
