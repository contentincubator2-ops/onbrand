name: Admin — Test FB publish via Pipedream (won't actually post unless DEFAULT_FB_PAGE_ID set)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            cd /opt/marketing-os/app/skills/ai-talent
            echo "════════ Pipedream env vars ════════"
            grep -E "^PIPEDREAM_|^DEFAULT_FB_PAGE_ID" .env 2>/dev/null | sed 's/=.*/=<set>/' || echo "(none set)"

            echo ""
            echo "════════ Hit publish.toFacebook with CJ session for output 379 (assume exists) ════════"
            COOKIE='session=eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxOTkiLCJvcGVuSWQiOiJoUGRNTXBNOWpNRDdEUXZBR19QUk9TYi1zRGw4bFRmYyIsImlhdCI6MTc3Nzk0Nzk3MywiZXhwIjoxODA5NDgzOTczfQ.ffZWP9Ajog__s5xC4e8fuFjruX1zm89Trg42Ayw4BCA'
            export MYSQL_PWD="mos_secure_2026"
            OUT_ID=$(mysql -h localhost -u mos_user mos_db -BN -e "SELECT o.id FROM mission_outputs o JOIN missions m ON m.id=o.missionId WHERE m.userId=199 ORDER BY o.id DESC LIMIT 1")
            echo "Latest output for CJ: $OUT_ID"

            BODY=$(printf '{"0":{"outputId":%s,"variantIndex":0}}' "$OUT_ID")
            curl -sS --max-time 30 -X POST \
              "http://localhost:3101/trpc/publish.toFacebook?batch=1" \
              -H "Content-Type: application/json" -H "Cookie: $COOKIE" \
              -d "$BODY" -w "\nHTTP %{http_code} time %{time_total}s\n" | head -c 800
