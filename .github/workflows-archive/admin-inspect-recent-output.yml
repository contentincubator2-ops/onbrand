name: Admin — Inspect 5 most recent mission_outputs

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            export MYSQL_PWD="${LOCAL_DB_PASSWORD}"
            MYSQL="mysql -h localhost -u mos_user mos_db"

            echo "════════ Most recent 5 mission_outputs (id, missionId, platform, hasMetadata, taskId) ════════"
            $MYSQL -e "
              SELECT
                o.id AS output_id,
                o.missionId,
                o.platform,
                o.outputType,
                CHAR_LENGTH(o.metadata) AS meta_len,
                JSON_UNQUOTE(JSON_EXTRACT(o.metadata, '\$.taskId')) AS task_id_in_meta,
                JSON_UNQUOTE(JSON_EXTRACT(o.metadata, '\$.tier'))   AS tier_in_meta,
                LEFT(o.content, 80) AS content_preview,
                o.createdAt
              FROM mission_outputs o
              ORDER BY o.id DESC
              LIMIT 5
            \G"

            echo ""
            echo "════════ Latest output's RAW metadata column ════════"
            $MYSQL -BN -e "SELECT metadata FROM mission_outputs ORDER BY id DESC LIMIT 1" | head -c 2000

            echo ""
            echo "════════ Latest mission row ════════"
            $MYSQL -e "
              SELECT id, userId, brandId, workspace, title, LEFT(description, 100) AS description, status, createdAt
              FROM missions
              ORDER BY id DESC LIMIT 3
            \G"

            echo ""
            echo "════════ pm2 errors since last deploy ════════"
            pm2 logs marketing-os --lines 100 --nostream --raw 2>&1 | grep -iE "ensureMission|recordTaskRun|Data truncated|orchestra|caption|outputId" | tail -20
