name: Admin — Show VM npm audit detail

on:
  workflow_dispatch:

jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            cd /opt/marketing-os/app/skills/ai-talent
            echo "════ Production audit (server) ════"
            npm audit --omit=dev 2>&1 | head -50
            echo ""
            echo "════ Lockfile drizzle-orm version ════"
            grep -A 1 '"drizzle-orm":' package-lock.json 2>/dev/null | head -10
            echo ""
            echo "════ Installed drizzle-orm version ════"
            cat node_modules/drizzle-orm/package.json 2>/dev/null | grep '"version"' | head -2
