name: Admin — Audit assigned agents persona thickness

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 90s
          script: |
            export MYSQL_PWD="mos_secure_2026"
            MYSQLT="mysql -h localhost -u mos_user mos_db -t"

            # The 137 IDs assigned across all task templates
            IDS="24,25,26,27,28,29,31,32,35,36,38,39,40,60001,60003,60008,60011,60012,60013,60021,60022,60029,60030,60035,60036,60037,60038,60048,60055,60056,60060,60061,60062,60068,60071,60072,60080,90004,90005,90006,90011,90021,90025,90027,180001,180005,180006,180015,180030,180038,180039,180054,180062,180068,180141,180143,180157,180159,180165,180166,180167,180168,180170,180203,180268,180559,180592,180605,180606,180643,180657,180855,210004,210005,210015,210017,210018,210019,210220,210252,220164,220504,220506,220507,220508,220535,220540,220583,220584,220721,220722,220723,220724,220725,220726,220727,220728,220729,220730,220731,220732,220733,220734,220735,220736,220737,220738,220739,220740,220751,220752,220753,220754,220755,220756,220757,220758,220759,220760,220751,220862,220863,220864,220866,220868,220890,220891,220892,220893,220894,220895,220896,220913,220959,229985,232765,239022,239023,239024,239025,239027,239028,239030,239031,239183,239184,239185"

            echo "=== Persona thickness — bins ==="
            $MYSQLT -e "
              SELECT
                CASE
                  WHEN total_chars >= 800 THEN 'A. >=800 (very thick)'
                  WHEN total_chars >= 400 THEN 'B. 400-799 (thick)'
                  WHEN total_chars >= 200 THEN 'C. 200-399 (decent)'
                  WHEN total_chars >= 100 THEN 'D. 100-199 (thin)'
                  ELSE                          'E. <100 (very thin)'
                END AS persona_thickness,
                COUNT(*) AS agents
              FROM (
                SELECT id,
                  (CHAR_LENGTH(IFNULL(bio,''))
                  + CHAR_LENGTH(IFNULL(specialty,''))
                  + CHAR_LENGTH(IFNULL(methodology,''))
                  + CHAR_LENGTH(IFNULL(experienceDetail,''))) AS total_chars
                FROM agents WHERE id IN ($IDS)
              ) t
              GROUP BY persona_thickness
              ORDER BY persona_thickness"

            echo ""
            echo "=== Bottom 25 (thinnest personas — these need beefing up) ==="
            $MYSQLT -e "
              SELECT id, name, title,
                CHAR_LENGTH(IFNULL(bio,'')) bio,
                CHAR_LENGTH(IFNULL(specialty,'')) sp,
                CHAR_LENGTH(IFNULL(methodology,'')) m,
                CHAR_LENGTH(IFNULL(experienceDetail,'')) ex,
                (CHAR_LENGTH(IFNULL(bio,''))+CHAR_LENGTH(IFNULL(specialty,''))+CHAR_LENGTH(IFNULL(methodology,''))+CHAR_LENGTH(IFNULL(experienceDetail,''))) total
              FROM agents WHERE id IN ($IDS)
              ORDER BY total ASC
              LIMIT 25"

            echo ""
            echo "=== Top 10 (thickest, sample of best) ==="
            $MYSQLT -e "
              SELECT id, name, title,
                CHAR_LENGTH(IFNULL(bio,''))+CHAR_LENGTH(IFNULL(specialty,''))+CHAR_LENGTH(IFNULL(methodology,''))+CHAR_LENGTH(IFNULL(experienceDetail,'')) total
              FROM agents WHERE id IN ($IDS)
              ORDER BY total DESC
              LIMIT 10"

            echo ""
            echo "=== Any missing IDs (wrong/non-existent in DB)? ==="
            $MYSQLT -e "
              SELECT a.id FROM (SELECT 1 AS x) dummy
              CROSS JOIN (
                SELECT $IDS AS ids
              ) ids
              WHERE 0; -- placeholder; do existence check via unmatched count
              SELECT COUNT(*) AS in_db FROM agents WHERE id IN ($IDS);"
