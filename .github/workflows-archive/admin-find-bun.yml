name: Admin — Check TS runner on VM

on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            echo "── tsx / ts-node ──"
            which tsx ts-node
            cd /opt/marketing-os/app/skills/ai-talent
            ls node_modules/.bin/ | grep -E "tsx|ts-node|bun" | head -5
            echo "── package.json scripts ──"
            cat package.json | grep -A 10 '"scripts"' | head -15
