name: Admin — Debug recordTaskRun + check live code

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            cd /opt/marketing-os/app/skills/ai-talent

            echo "=== Latest deployed code: orchestra recordTaskRun block ==="
            grep -A 8 "hasUsableVariant" server/_core/quickTaskOrchestra.ts | head -20
            echo ""
            echo "=== Recent pm2 logs (looking for recordTaskRun warnings) ==="
            pm2 logs marketing-os --lines 100 --nostream 2>&1 | grep -E "recordTaskRun|outputId|missionId|orchestra|ERROR|Error" | tail -30
            echo ""
            echo "=== Direct DB check — last 3 mission_outputs rows ==="
            export MYSQL_PWD="${LOCAL_DB_PASSWORD}"
            mysql -h localhost -u mos_user mos_db -t -e "
              SELECT id, missionId, platform, outputType, status,
                LEFT(title, 30) AS title,
                createdAt
              FROM mission_outputs
              ORDER BY id DESC LIMIT 5;"
            echo ""
            echo "=== Test recordTaskRun via direct insert (sanity) ==="
            mysql -h localhost -u mos_user mos_db -e "DESCRIBE mission_outputs;" | head -10
