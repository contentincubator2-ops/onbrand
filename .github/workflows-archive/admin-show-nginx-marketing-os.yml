name: Admin — Show nginx marketing-os config

on:
  workflow_dispatch:

jobs:
  show:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 2
    steps:
      - name: Run
        run: |
          set -e
          echo "── full marketing-os config ──"
          sudo cat /etc/nginx/sites-enabled/marketing-os

          echo ""
          echo "── /tmp/idx-pub.html (490-byte onbrand response) ──"
          # We just deleted it, regenerate
          curl -sk -H "Host: onbrand.sowork.ai" "https://localhost/" -o /tmp/idx-pub.html
          cat /tmp/idx-pub.html
