name: Admin — New user E2E (signup → login → run task)

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 120s
          script: |
            BASE='http://localhost:3101'
            EMAIL="trial-test-$(date +%s)@drop.test"
            PASS="TestPass1234!"
            echo "════════ TEST USER: $EMAIL ════════"

            echo ""
            echo "── STEP 1: REGISTER ──"
            REG=$(curl -sS --max-time 15 -X POST -c /tmp/c.jar \
              "$BASE/api/auth/register" \
              -H "Content-Type: application/json" \
              -d "{\"email\":\"$EMAIL\",\"password\":\"$PASS\",\"name\":\"Trial User\"}")
            echo "$REG" | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'  ok={d.get(\"ok\", False)}  userId={d.get(\"user\", {}).get(\"id\", \"?\")}  isActive={d.get(\"user\", {}).get(\"isActive\", \"?\")}')"

            echo ""
            echo "── STEP 2: LOGIN ──"
            LOGIN=$(curl -sS --max-time 15 -X POST -c /tmp/c.jar -b /tmp/c.jar \
              "$BASE/api/auth/login" \
              -H "Content-Type: application/json" \
              -d "{\"email\":\"$EMAIL\",\"password\":\"$PASS\"}")
            TOKEN=$(echo "$LOGIN" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('token', ''))" 2>/dev/null)
            if [ -z "$TOKEN" ]; then
              echo "  ✗ LOGIN FAIL: $(echo $LOGIN | head -c 200)"
              exit 1
            fi
            echo "  ✓ token received (${#TOKEN} chars)"

            echo ""
            echo "── STEP 3: GET /api/auth/me (verify session) ──"
            ME=$(curl -sS --max-time 15 -b /tmp/c.jar \
              "$BASE/api/auth/me" -H "Authorization: Bearer $TOKEN")
            echo "$ME" | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'  user.id={d.get(\"user\", {}).get(\"id\", \"?\")}  email={d.get(\"user\", {}).get(\"email\", \"?\")}')" 2>/dev/null || echo "  ✗ me failed"

            echo ""
            echo "── STEP 4: RUN A TASK (no brand, simplest case) ──"
            BODY='{"0":{"taskId":"fb-30-caption-short","inputs":{"topic":"我是新用戶測試"}}}'
            RUN=$(curl -sS --max-time 90 -X POST -b /tmp/c.jar \
              "$BASE/trpc/quickTask.runOrchestra?batch=1" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $TOKEN" \
              -d "$BODY")
            python3 -c "
            import sys, json
            try:
                d = json.loads('''$RUN''')
                r = d[0].get('result',{}).get('data') or {}
                e = d[0].get('error') or {}
                if e: print(f'  ✗ ERROR: {e.get(\"message\",\"\")[:150]}'); sys.exit(0)
                vs = r.get('variants', [])
                ok = sum(1 for v in vs if (v.get('caption') or '').strip())
                print(f'  ✓ task ran: variants={ok}/{len(vs)}, outputId={r.get(\"outputId\")}, latency={r.get(\"totalLatencyMs\",0)/1000:.1f}s')
            except Exception as ex:
                print(f'  parse error: {ex}')
            "

            echo ""
            echo "════════ E2E DONE ════════"
