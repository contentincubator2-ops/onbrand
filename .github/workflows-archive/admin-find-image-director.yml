name: Admin — Find image_director + live-title caption_writer candidates

on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 90s
          script: |
            export MYSQL_PWD="${LOCAL_DB_PASSWORD}"
            MYSQL="mysql -h localhost -u mos_user mos_db -B -N --silent"

            echo "=== A. Image-direction agents (title / primarySkill / specialty 含視覺類關鍵字) ==="
            $MYSQL -e "SELECT id, slug, name, title, primarySkill FROM agents WHERE isAvailable=1 AND (LOWER(title) LIKE '%art director%' OR LOWER(title) LIKE '%creative director%' OR LOWER(title) LIKE '%visual%' OR LOWER(title) LIKE '%photographer%' OR LOWER(title) LIKE '%designer%' OR LOWER(primarySkill) LIKE '%visual%' OR LOWER(primarySkill) LIKE '%art-direction%' OR LOWER(primarySkill) LIKE '%photo%' OR LOWER(primarySkill) LIKE '%moodboard%' OR LOWER(primarySkill) LIKE '%image-brief%' OR LOWER(primarySkill) LIKE '%style-direction%' OR title LIKE '%視覺%' OR title LIKE '%美術%' OR title LIKE '%設計%') ORDER BY id LIMIT 40"

            echo ""
            echo "=== B. Agents with skills[] including image-related slugs ==="
            $MYSQL -e "SELECT id, slug, name, title, primarySkill FROM agents WHERE isAvailable=1 AND (JSON_SEARCH(skills, 'one', 'art-direction') IS NOT NULL OR JSON_SEARCH(skills, 'one', 'image-brief') IS NOT NULL OR JSON_SEARCH(skills, 'one', 'visual-direction') IS NOT NULL OR JSON_SEARCH(skills, 'one', 'photo-direction') IS NOT NULL OR JSON_SEARCH(skills, 'one', 'moodboard') IS NOT NULL OR JSON_SEARCH(skills, 'one', 'style-guide') IS NOT NULL OR JSON_SEARCH(skills, 'one', 'visual-prompt') IS NOT NULL OR JSON_SEARCH(skills, 'one', 'image-prompt-engineering') IS NOT NULL) ORDER BY name LIMIT 30"

            echo ""
            echo "=== C. Skill catalog — image / visual / art / moodboard slugs ==="
            $MYSQL -e "SELECT slug, name, category FROM skill_catalog WHERE LOWER(slug) LIKE '%visual%' OR LOWER(slug) LIKE '%art-direction%' OR LOWER(slug) LIKE '%image-brief%' OR LOWER(slug) LIKE '%moodboard%' OR LOWER(slug) LIKE '%photo%' OR LOWER(slug) LIKE '%style-guide%' OR LOWER(slug) LIKE '%creative-brief%' OR LOWER(name) LIKE '%視覺%' OR LOWER(name) LIKE '%美術%' ORDER BY category, slug LIMIT 60"

            echo ""
            echo "=== D. Squad lead-agents that already do FB visual / image work ==="
            $MYSQL -e "SELECT s.slug AS squad_slug, a.id AS agent_id, a.name, a.title, a.primarySkill FROM squads s JOIN agents a ON a.id = s.lead_agent_id WHERE s.is_active=1 AND s.is_approved=1 AND (s.slug LIKE '%visual%' OR s.slug LIKE '%image%' OR s.slug LIKE '%art%' OR s.slug LIKE '%photo%' OR s.slug LIKE '%moodboard%') ORDER BY s.slug LIMIT 20"

            echo ""
            echo "=== E. Live-streaming / livestream caption writer candidates (for fb-30-live-title) ==="
            $MYSQL -e "SELECT id, slug, name, title, primarySkill FROM agents WHERE isAvailable=1 AND (LOWER(title) LIKE '%live%' OR LOWER(title) LIKE '%直播%' OR LOWER(primarySkill) LIKE '%live%' OR LOWER(primarySkill) LIKE '%livestream%' OR LOWER(primarySkill) LIKE '%broadcast%' OR LOWER(primarySkill) LIKE '%title-writing%' OR LOWER(primarySkill) LIKE '%headline%') ORDER BY id LIMIT 30"

            echo ""
            echo "=== F. fb-livestream-prep squad lead + step agents ==="
            $MYSQL -e "SELECT id, slug, name, lead_agent_id FROM squads WHERE slug LIKE '%livestream%' OR slug LIKE '%live-prep%' OR slug LIKE 'fb-live%'"
            echo ""
            $MYSQL -e "SELECT a.id, a.slug, a.name, a.title, a.primarySkill FROM squads s JOIN agents a ON a.id = s.lead_agent_id WHERE s.slug LIKE '%livestream%' OR s.slug LIKE '%live-prep%' LIMIT 5"

            echo ""
            echo "=== G. Countdown-related squad agents (for fb-30-countdown-1day) ==="
            $MYSQL -e "SELECT s.slug AS squad_slug, a.id, a.name, a.title, a.primarySkill FROM squads s JOIN agents a ON a.id = s.lead_agent_id WHERE s.slug LIKE '%countdown%' OR s.slug LIKE '%倒數%' LIMIT 10"

            echo ""
            echo "=== Done ==="
