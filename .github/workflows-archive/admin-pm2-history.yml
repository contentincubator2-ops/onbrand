name: Admin — Show pm2 restart history + last crash reason

on:
  workflow_dispatch:

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 30s
          script: |
            echo "════════ pm2 status ════════"
            pm2 status | grep -E "marketing-os|name|----"

            echo ""
            echo "════════ pm2 info marketing-os ════════"
            pm2 info marketing-os 2>&1 | grep -E "uptime|restarts|created at|status|exit code|exec mode|max memory|err log path|out log path"

            echo ""
            echo "════════ pm2 OUT log — last 20 lines ════════"
            OUT=$(pm2 info marketing-os 2>&1 | grep "out log path" | awk '{print $5}')
            [ -f "$OUT" ] && tail -20 "$OUT"

            echo ""
            echo "════════ pm2 ERR log — last 30 lines ════════"
            ERR=$(pm2 info marketing-os 2>&1 | grep "err log path" | awk '{print $5}')
            [ -f "$ERR" ] && tail -30 "$ERR" || echo "(empty)"

            echo ""
            echo "════════ Memory / system ════════"
            free -m | head -3
            uptime
