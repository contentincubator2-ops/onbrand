name: Admin — Query strategy agents from mos_db

on:
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            export MYSQL_PWD="${LOCAL_DB_PASSWORD}"
            MYSQLT="mysql -h localhost -u mos_user mos_db -t"
            MYSQLB="mysql -h localhost -u mos_user mos_db -B --silent"

            echo "=== 1. Total agents snapshot ==="
            $MYSQLT -e "
              SELECT
                COUNT(*) AS total,
                SUM(CASE WHEN isAvailable=1 THEN 1 ELSE 0 END) AS available,
                SUM(CASE WHEN layer='strategy' THEN 1 ELSE 0 END) AS layer_strategy,
                SUM(CASE WHEN layer='execution' THEN 1 ELSE 0 END) AS layer_execution,
                SUM(CASE WHEN layer='training' THEN 1 ELSE 0 END) AS layer_training
              FROM agents"

            echo ""
            echo "=== 2. Agents table columns ==="
            $MYSQLT -e "DESCRIBE agents"

            echo ""
            echo "=== 3. Layer=strategy agents (all, sorted by persona richness) ==="
            $MYSQLT -e "
              SELECT id, name, title, specialty,
                CHAR_LENGTH(IFNULL(bio,'')) AS bio_len,
                CHAR_LENGTH(IFNULL(methodology,'')) AS meth_len
              FROM agents
              WHERE isAvailable=1
                AND (layer='strategy' OR title LIKE '%策略%' OR title LIKE '%Strategy%'
                     OR specialty LIKE '%策略%' OR specialty LIKE '%positioning%'
                     OR specialty LIKE '%定價%' OR specialty LIKE '%pricing%'
                     OR specialty LIKE '%競爭%' OR specialty LIKE '%competitive%')
              ORDER BY (CHAR_LENGTH(IFNULL(bio,'')) + CHAR_LENGTH(IFNULL(specialty,'')) + CHAR_LENGTH(IFNULL(methodology,''))) DESC
              LIMIT 50"

            echo ""
            echo "=== 4. Sample all available agents (name + title + specialty, first 120) ==="
            $MYSQLT -e "
              SELECT id, name, title, specialty, layer
              FROM agents
              WHERE isAvailable=1
              ORDER BY layer, id
              LIMIT 120"

            echo ""
            echo "=== 5. Distinct workspace values ==="
            $MYSQLT -e "
              SELECT workspace, COUNT(*) AS cnt
              FROM agents
              WHERE isAvailable=1
              GROUP BY workspace
              ORDER BY cnt DESC"

            echo "=== Done ==="
