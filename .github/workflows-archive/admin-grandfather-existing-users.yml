name: Admin — Migrate + grandfather all existing users to earlyBird=1

# 2026-05-12 (CJ「老用戶永遠保 900，新用戶才漲 1500」):
# 1. Run migrate to ensure users.earlyBird column exists
# 2. Set earlyBird=1 for ALL existing users (everyone who registered
#    before the rename is grandfathered)
# 3. Print summary

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 180s
          script: |
            set -e
            cd /opt/marketing-os/app/skills/ai-talent
            export MYSQL_PWD="${LOCAL_DB_PASSWORD}"

            echo "── 1. Run migrate to add users.earlyBird ─────"
            npx tsx scripts/migrate.ts 2>&1 | grep -E "earlyBird|lockedPriceTwdMonthly|users\." | head -10

            echo
            echo "── 2. Backfill: mark ALL existing users as earlyBird=1 ─────"
            mysql -h localhost -u mos_user mos_db --default-character-set=utf8mb4 -e "
              UPDATE users SET earlyBird = 1 WHERE earlyBird = 0 OR earlyBird IS NULL;
            "
            echo "  rows affected: queried below"

            echo
            echo "── 3. Summary ─────"
            mysql -h localhost -u mos_user mos_db -t --default-character-set=utf8mb4 -e "
              SELECT
                COUNT(*) AS total_users,
                SUM(earlyBird) AS early_bird,
                SUM(CASE WHEN earlyBird = 0 THEN 1 ELSE 0 END) AS standard_price
              FROM users;
            "
