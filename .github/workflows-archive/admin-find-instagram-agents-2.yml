name: Admin — IG agents supplemental (Live / Threads / Visual)

on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            export MYSQL_PWD="mos_secure_2026"
            MYSQL="mysql -h localhost -u mos_user mos_db -B -N --silent"

            echo "=== Threads / cross-platform repurpose ==="
            $MYSQL -e "SELECT id, slug, name, title, primarySkill FROM agents WHERE isAvailable=1 AND (LOWER(slug) LIKE '%threads%' OR LOWER(title) LIKE '%threads%' OR LOWER(primarySkill) LIKE '%threads%' OR LOWER(slug) LIKE '%cross%' OR LOWER(title) LIKE '%cross-platform%' OR LOWER(primarySkill) LIKE '%repurpose%' OR LOWER(primarySkill) LIKE '%cross-platform%') ORDER BY id LIMIT 20"

            echo ""
            echo "=== IG visual / aesthetic / art direction (need ≠ Mandy 239184) ==="
            $MYSQL -e "SELECT id, slug, name, title, primarySkill FROM agents WHERE isAvailable=1 AND id != 239184 AND ((LOWER(slug) LIKE '%ig-%visual%' OR LOWER(slug) LIKE '%instagram%design%') OR (LOWER(title) LIKE '%instagram%' AND (LOWER(title) LIKE '%design%' OR LOWER(title) LIKE '%visual%' OR LOWER(title) LIKE '%aesthetic%')) OR (LOWER(primarySkill) LIKE '%ig%' AND (LOWER(primarySkill) LIKE '%visual%' OR LOWER(primarySkill) LIKE '%aesthetic%' OR LOWER(primarySkill) LIKE '%moodboard%')) OR (LOWER(slug) LIKE '%anna%' OR LOWER(slug) LIKE '%nancy%') OR id = 180165 OR id = 180170) ORDER BY id LIMIT 20"

            echo ""
            echo "=== IG live / host candidates (任務 11 — 不要再用 Vicky Feng 40 但若沒人就用她) ==="
            $MYSQL -e "SELECT id, slug, name, title, primarySkill FROM agents WHERE isAvailable=1 AND id != 40 AND (LOWER(title) LIKE '%instagram live%' OR LOWER(title) LIKE '%ig live%' OR (LOWER(title) LIKE '%live%' AND LOWER(title) LIKE '%shopping%') OR LOWER(slug) LIKE '%live-shopping%' OR id IN (60072, 60073, 60074, 60075, 220946, 210341, 210342)) ORDER BY id LIMIT 15"

            echo ""
            echo "=== Squad leads tagged 'instagram' workspace ==="
            $MYSQL -e "SELECT s.slug AS squad_slug, a.id, a.name, a.title, a.primarySkill FROM squads s JOIN agents a ON a.id=s.lead_agent_id WHERE s.is_active=1 AND s.is_approved=1 AND (s.slug LIKE 'ig-%' OR s.workspace LIKE '%instagram%') ORDER BY s.slug LIMIT 25"

            echo "=== Done ==="
