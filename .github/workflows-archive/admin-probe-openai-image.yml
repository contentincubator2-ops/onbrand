name: Admin — Probe OpenAI image gen

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 90s
          script: |
            cd /opt/marketing-os/app/skills/ai-talent
            set -a; . ./.env; set +a

            echo "── OPENAI_API_KEY presence ─────"
            if [ -n "$OPENAI_API_KEY" ]; then
              echo "  OPENAI_API_KEY = ${OPENAI_API_KEY:0:8}... (${#OPENAI_API_KEY} chars)"
            else
              echo "  OPENAI_API_KEY = MISSING"
            fi
            echo "  IMAGE_GEN_MODEL_OPENAI = ${IMAGE_GEN_MODEL_OPENAI:-gpt-image-1 (default)}"
            echo "  IMAGE_GEN_PROVIDER_PRIMARY = ${IMAGE_GEN_PROVIDER_PRIMARY:-openai (default)}"

            echo ""
            echo "── ping OpenAI gpt-image-1 ─────"
            curl -s --max-time 60 -X POST "https://api.openai.com/v1/images/generations" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $OPENAI_API_KEY" \
              -d '{"model":"gpt-image-1","prompt":"a red apple","size":"1024x1024","n":1}' \
              -o /tmp/openai-img-test.json \
              -w "  http_code=%{http_code} time=%{time_total}s size=%{size_download}\n"

            echo ""
            echo "── response head (first 600 chars) ─────"
            head -c 600 /tmp/openai-img-test.json
            echo ""

            echo ""
            echo "── recent image.generate trpc errors (last 1000 ERR lines) ─────"
            LOG_ERR=/home/$(whoami)/.pm2/logs/marketing-os-error.log
            tail -1500 "$LOG_ERR" 2>/dev/null | grep -B 1 -A 5 "image\.generate\|generateImage\|OpenAI image gen\|image gen" | tail -60
