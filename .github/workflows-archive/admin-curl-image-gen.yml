name: Admin — Curl image.generate with flux-schnell

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 180s
          script: |
            cd /opt/marketing-os/app/skills/ai-talent
            set -a; . ./.env; set +a
            export MYSQL_PWD="${LOCAL_DB_PASSWORD}"

            # Pick CJ user id 199 and a brand he owns
            BRAND=$(mysql -h localhost -u mos_user mos_db --skip-column-names -e "
              SELECT id FROM brands WHERE userId = 199 ORDER BY id DESC LIMIT 1
            ")
            echo "Using brand: $BRAND"

            JWT=$(node -e "
              const j = require('/opt/marketing-os/app/skills/ai-talent/node_modules/jsonwebtoken');
              console.log(j.sign({id: 199}, process.env.JWT_SECRET, {expiresIn:'10m'}));
            ")

            echo
            echo "── POST /trpc/image.generate with modelChoice=flux-schnell ─────"
            time curl -s --max-time 90 -X POST "http://localhost:3101/trpc/image.generate" \
              -H "Content-Type: application/json" \
              -H "Cookie: authToken=$JWT" \
              -d "{\"brandId\":$BRAND,\"prompt\":\"a wooden bowl with steaming soup on a warm kitchen counter, soft morning light, photorealistic\",\"channel\":\"fb\",\"modelChoice\":\"flux-schnell\"}" \
              | head -c 2000
            echo
