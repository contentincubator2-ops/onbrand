name: Admin — Run migrate (adds brand visual columns)

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 180s
          script: |
            set -e
            cd /opt/marketing-os/app/skills/ai-talent
            export MYSQL_PWD="${LOCAL_DB_PASSWORD}"

            echo "── columns before ─────"
            mysql -h localhost -u mos_user mos_db -t -e "
              SELECT COLUMN_NAME FROM information_schema.COLUMNS
                WHERE TABLE_SCHEMA='mos_db' AND TABLE_NAME='brands'
                  AND COLUMN_NAME IN ('primaryColor','secondaryColor','accentColor','fontFamily','visualGuidelines')
            "

            echo
            echo "── run npx tsx scripts/migrate.ts ─────"
            npx tsx scripts/migrate.ts 2>&1 | grep -E "primaryColor|secondaryColor|accentColor|fontFamily|visualGuidelines|brands\." | head -20

            echo
            echo "── columns after ─────"
            mysql -h localhost -u mos_user mos_db -t -e "
              SELECT COLUMN_NAME, COLUMN_TYPE FROM information_schema.COLUMNS
                WHERE TABLE_SCHEMA='mos_db' AND TABLE_NAME='brands'
                  AND COLUMN_NAME IN ('primaryColor','secondaryColor','accentColor','fontFamily','visualGuidelines')
            "
