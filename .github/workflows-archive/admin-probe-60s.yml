name: Admin — Probe /60s page (asset bundle + headless render check)

# Investigates why /60s shows white page in production.
# Checks:
#   1. nginx serves /60s correctly (200 + index.html)
#   2. main JS chunk loads from manifest
#   3. JS bundle contains tier="60s" code path strings
#   4. Server listFB returns 60s tasks (curl with auth-skipped probe)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 5
    steps:
      - name: HTTP /60s
        run: |
          set +e
          echo "════ curl https://marketing-os.sowork.ai/60s ════"
          STATUS=$(curl -s -o /tmp/60s.html -w '%{http_code}' https://marketing-os.sowork.ai/60s)
          echo "Status: $STATUS"
          echo ""
          echo "════ index.html size + asset refs ════"
          stat -c 'size=%s mtime=%y' /tmp/60s.html
          grep -oE 'index-[A-Za-z0-9]+\.(js|css)' /tmp/60s.html | sort -u | head -10

      - name: Find dist + main JS chunk
        run: |
          set +e
          DIST=/opt/marketing-os/app/skills/ai-talent/client/dist
          if [ ! -d "$DIST" ]; then
            DIST=/opt/marketing-os/app/skills/ai-talent/dist
          fi
          echo "DIST = $DIST"
          ls -la "$DIST/assets" 2>/dev/null | head -10

          MAIN=$(ls -t "$DIST/assets"/index-*.js 2>/dev/null | head -1)
          echo "MAIN = $MAIN"
          [ -z "$MAIN" ] && exit 0

          echo ""
          echo "════ Look for 60s code-path identifiers ════"
          echo "  runOrchestra60 references:  $(grep -c 'runOrchestra60' "$MAIN")"
          echo "  StagePipelineView refs:     $(grep -c 'StagePipelineView' "$MAIN")"
          echo "  tier===\"60s\" patterns:    $(grep -c 'tier==="60s"' "$MAIN")"
          echo "  PRODUCTION PACKAGE chunks:  $(grep -c 'PRODUCTION PACKAGE' "$MAIN")"

          echo ""
          echo "════ Try to find any obvious 'undefined' guards near 60s logic ════"
          grep -oE '.{60}runOrchestra60.{60}' "$MAIN" | head -3

      - name: Server-side listFB sanity
        run: |
          set -e
          AI=/opt/marketing-os/app/skills/ai-talent
          set -a; source "$AI/.env" 2>/dev/null; set +a
          export MYSQL_PWD="${LOCAL_DB_PASSWORD}"
          MYSQL="mysql -h ${LOCAL_DB_HOST:-localhost} -u ${LOCAL_DB_USER:-mos_user} ${LOCAL_DB_NAME:-mos_db} -B -N --silent"
          echo ""
          echo "════ Inline tsx — verify FB60 tasks load + count ════"
          cd "$AI"
          npx tsx -e "
          import { FB_60S_TASKS_V2 } from './server/_core/quickTaskFB60';
          import { IG_60S_TASKS } from './server/_core/quickTaskIG60';
          import { YT_60S_TASKS } from './server/_core/quickTaskYT60';
          console.log('FB_60S_TASKS_V2 length:', FB_60S_TASKS_V2.length);
          console.log('IG_60S_TASKS length:',    IG_60S_TASKS.length);
          console.log('YT_60S_TASKS length:',    YT_60S_TASKS.length);
          console.log('first FB60:', JSON.stringify({id: FB_60S_TASKS_V2[0]?.id, label: FB_60S_TASKS_V2[0]?.label, tier: FB_60S_TASKS_V2[0]?.tier}));
          process.exit(0);
          "

      - name: PM2 latest 50 lines (errors only)
        run: |
          set +e
          ERR=~/.pm2/logs/marketing-os-error.log
          [ -f "$ERR" ] || ERR=/root/.pm2/logs/marketing-os-error.log
          echo "════ Latest error log (50 lines) ════"
          tail -50 "$ERR" 2>/dev/null || echo "(no error log readable)"
