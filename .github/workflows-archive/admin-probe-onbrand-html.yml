name: Admin — Probe onbrand.sowork.ai HTML + bundle

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 2
    steps:
      - name: Run
        run: |
          set -e
          echo "── 1. through nginx (public) — onbrand.sowork.ai ──"
          curl -sk -H "Host: onbrand.sowork.ai" "https://localhost/" -o /tmp/idx-pub.html -w "  http=%{http_code} size=%{size_download} type=%{content_type}\n"
          echo "  --- first 400 chars ---"
          head -c 600 /tmp/idx-pub.html
          echo ""

          echo ""
          echo "── 2. through nginx — bebrand.sowork.ai ──"
          curl -sk -H "Host: bebrand.sowork.ai" "https://localhost/" -o /tmp/idx-be.html -w "  http=%{http_code} size=%{size_download} type=%{content_type}\n"
          echo "  --- first 400 chars ---"
          head -c 600 /tmp/idx-be.html
          echo ""

          echo ""
          echo "── 3. direct to express (bypass nginx) ──"
          curl -s "http://localhost:3000/" -o /tmp/idx-direct.html -w "  http=%{http_code} size=%{size_download} type=%{content_type}\n"
          echo "  --- first 400 chars ---"
          head -c 600 /tmp/idx-direct.html
          echo ""

          echo ""
          echo "── 4. nginx server_name list ──"
          sudo grep -rE "server_name" /etc/nginx/sites-enabled/* 2>/dev/null | head -10

          echo ""
          echo "── 5. nginx access log — last 10 onbrand requests ──"
          sudo grep "onbrand" /var/log/nginx/access.log 2>/dev/null | tail -10

          echo ""
          echo "── 6. nginx error log — last 10 ──"
          sudo tail -10 /var/log/nginx/error.log 2>/dev/null
