name: Admin — Watch video job 6 progress

on:
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            cd /opt/marketing-os/app/skills/ai-talent
            export MYSQL_PWD="mos_secure_2026"

            echo "════════ All recent video jobs ════════"
            mysql -h localhost -u mos_user mos_db -e "
              SELECT id, status, progress, LEFT(errorMessage,200) AS err,
                     LEFT(videoUrl,80) AS video,
                     TIMESTAMPDIFF(SECOND, createdAt, NOW()) AS age_sec
              FROM video_jobs
              ORDER BY id DESC LIMIT 5
            " 2>&1

            echo ""
            echo "════════ pm2 logs filtered for Kling/video activity ════════"
            pm2 logs marketing-os --lines 200 --nostream --raw 2>&1 | grep -iE "kling|piapi|video|hailuo|generateScene|TaskExecuteFailed" | tail -25

            echo ""
            echo "════════ Verify PiAPI key works directly ════════"
            PIAPI=$(grep -E "^PIAPI_API_KEY=" .env | head -1 | cut -d'=' -f2-)
            if [ -n "$PIAPI" ]; then
              curl --max-time 15 -sS -X POST "https://api.piapi.ai/api/v1/task" \
                -H "x-api-key: $PIAPI" \
                -H "Content-Type: application/json" \
                -d '{"model":"kling","task_type":"video_generation","input":{"prompt":"test","duration":5,"version":"2.0-master","mode":"pro","aspect_ratio":"16:9"}}' \
                -w "\nHTTP %{http_code}\n" | head -c 600
            else
              echo "  no PIAPI_API_KEY in .env"
            fi
