name: Admin — Find Email + Press Release agents (combined)

on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 90s
          script: |
            export MYSQL_PWD="${LOCAL_DB_PASSWORD}"
            MYSQL="mysql -h localhost -u mos_user mos_db -B -N --silent"

            EXCLUDED="(239183, 60021, 239185, 30002, 40, 180159, 239184, 180166, 229985, 60029, 35, 60068, 224294, 180168, 30005, 180143, 60056, 60072, 220751, 60022, 180170, 24, 36, 30013, 180268, 60030, 30014, 30004, 180157, 210252, 180186, 210220, 30011, 180167, 60033, 220949, 222392, 60055, 60031, 210310, 180158, 60073, 180165, 30018, 229905, 180172, 180173, 180176, 180197, 180203, 180199, 180009, 220862, 60071)"

            echo "=== A. Email / Newsletter / EDM specialists ==="
            $MYSQL -e "SELECT id, slug, name, title, primarySkill FROM agents WHERE isAvailable=1 AND id NOT IN $EXCLUDED AND (LOWER(slug) LIKE '%email%' OR LOWER(slug) LIKE '%edm%' OR LOWER(slug) LIKE '%newsletter%' OR LOWER(title) LIKE '%email%' OR LOWER(title) LIKE '%edm%' OR LOWER(title) LIKE '%newsletter%' OR LOWER(primarySkill) LIKE '%email%' OR LOWER(primarySkill) LIKE '%edm%' OR LOWER(primarySkill) LIKE '%newsletter%') ORDER BY id LIMIT 40"

            echo ""
            echo "=== B. Subject line / open rate specialists ==="
            $MYSQL -e "SELECT id, slug, name, title, primarySkill FROM agents WHERE isAvailable=1 AND id NOT IN $EXCLUDED AND (LOWER(primarySkill) LIKE '%subject-line%' OR LOWER(primarySkill) LIKE '%open-rate%' OR LOWER(primarySkill) LIKE '%direct-response%') ORDER BY id LIMIT 15"

            echo ""
            echo "=== C. Press release / journalist / media ==="
            $MYSQL -e "SELECT id, slug, name, title, primarySkill FROM agents WHERE isAvailable=1 AND id NOT IN $EXCLUDED AND (LOWER(slug) LIKE '%press%' OR LOWER(slug) LIKE '%pr-%' OR LOWER(title) LIKE '%press%' OR LOWER(title) LIKE '%journalist%' OR LOWER(title) LIKE '%reporter%' OR LOWER(primarySkill) LIKE '%press-release%' OR LOWER(primarySkill) LIKE '%media-relations%' OR LOWER(primarySkill) LIKE '%pr-%') ORDER BY id LIMIT 30"

            echo ""
            echo "=== D. CRM / lifecycle / drip campaign ==="
            $MYSQL -e "SELECT id, slug, name, title, primarySkill FROM agents WHERE isAvailable=1 AND id NOT IN $EXCLUDED AND (LOWER(primarySkill) LIKE '%crm%' OR LOWER(primarySkill) LIKE '%lifecycle%' OR LOWER(primarySkill) LIKE '%drip%' OR LOWER(title) LIKE '%lifecycle%') ORDER BY id LIMIT 20"

            echo ""
            echo "=== E. Spokesperson / quote writer (for PR) ==="
            $MYSQL -e "SELECT id, slug, name, title, primarySkill FROM agents WHERE isAvailable=1 AND id NOT IN $EXCLUDED AND (LOWER(primarySkill) LIKE '%spokesperson%' OR LOWER(primarySkill) LIKE '%quote%' OR LOWER(title) LIKE '%spokesperson%' OR LOWER(title) LIKE '%comms%') ORDER BY id LIMIT 15"

            echo ""
            echo "=== F. Editor / copy chief ==="
            $MYSQL -e "SELECT id, slug, name, title, primarySkill FROM agents WHERE isAvailable=1 AND id NOT IN $EXCLUDED AND (LOWER(title) LIKE '%editor%' OR LOWER(title) LIKE '%copy chief%' OR LOWER(primarySkill) LIKE '%editor%') ORDER BY id LIMIT 20"

            echo "=== Done ==="
