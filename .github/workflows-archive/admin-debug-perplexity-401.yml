name: Admin — Debug Perplexity 401 source

# Diagnoses where on the VM the "LLM invoke failed: 401 Perplexity" error
# originates. Checks LLM_DEFAULT_PROVIDER, scans recent PM2 logs for the
# error stack trace, and prints the first 30 lines of any match so we can
# locate the actual caller.

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 120s
          script: |
            set +e
            AI=/opt/marketing-os/app/skills/ai-talent
            ENV_FILE="$AI/.env"
            LOG=~/.pm2/logs/marketing-os-error.log
            OUT=~/.pm2/logs/marketing-os-out.log

            echo "════════════════════════════════════════"
            echo "  Perplexity 401 source diagnosis"
            echo "  $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "════════════════════════════════════════"

            echo ""
            echo "── 1. LLM_DEFAULT_PROVIDER (the smoking gun) ──"
            grep -E "^LLM_DEFAULT_PROVIDER" "$ENV_FILE" 2>/dev/null \
              || echo "(not set — defaults to 'anthropic')"

            echo ""
            echo "── 2. PERPLEXITY_API_KEY presence ──"
            if grep -qE "^PERPLEXITY_API_KEY=." "$ENV_FILE" 2>/dev/null; then
              KEY_LEN=$(grep -E "^PERPLEXITY_API_KEY=" "$ENV_FILE" | head -1 | cut -d= -f2- | tr -d '\r\n' | wc -c)
              echo "set ($KEY_LEN chars) — every invokeLLM(provider='perplexity') will get 401"
            else
              echo "(not set)"
            fi

            echo ""
            echo "── 3. Recent 401 Perplexity errors in PM2 error log ──"
            tail -2000 "$LOG" 2>/dev/null \
              | grep -B 2 -A 25 "Perplexity\|perplexity.*401\|sonar" \
              | tail -120 \
              || echo "(no matches in last 2000 lines)"

            echo ""
            echo "── 4. Recent 401 Perplexity in stdout log ──"
            tail -2000 "$OUT" 2>/dev/null \
              | grep -B 2 -A 25 "Perplexity\|perplexity.*401\|sonar" \
              | tail -120 \
              || echo "(no matches in last 2000 lines)"

            echo ""
            echo "── 5. Last 3 'LLM invoke failed' stack traces ──"
            tail -5000 "$LOG" 2>/dev/null \
              | grep -B 1 -A 20 "LLM invoke failed" \
              | tail -180 \
              || echo "(no matches in last 5000 lines)"

            echo ""
            echo "════════════════════════════════════════"
            echo "  Done."
            echo "════════════════════════════════════════"
