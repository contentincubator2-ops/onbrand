name: Admin — Inspect output metadata for /run/:id debugging

on:
  workflow_dispatch:
    inputs:
      output_id:
        description: 'mission_outputs.id to inspect'
        required: true
        type: string

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          envs: OUTPUT_ID
          script: |
            export MYSQL_PWD="${LOCAL_DB_PASSWORD}"
            MYSQLT="mysql -h localhost -u mos_user mos_db -t"

            echo "=== mission_outputs row ==="
            $MYSQLT -e "
              SELECT id, missionId, platform, outputType, status, version,
                LEFT(title, 50) AS title,
                LEFT(content, 100) AS content_preview,
                LEFT(metadata, 200) AS metadata_preview
              FROM mission_outputs WHERE id = ${OUTPUT_ID};
            "

            echo ""
            echo "=== full metadata JSON ==="
            mysql -h localhost -u mos_user mos_db -BN -e "SELECT metadata FROM mission_outputs WHERE id = ${OUTPUT_ID};"

            echo ""
            echo "=== Joined mission row ==="
            $MYSQLT -e "
              SELECT m.id, m.userId, m.brandId, m.workspace,
                LEFT(m.title, 40) AS title,
                LEFT(m.description, 60) AS description
              FROM mission_outputs o
              JOIN missions m ON m.id = o.missionId
              WHERE o.id = ${OUTPUT_ID};
            "
        env:
          OUTPUT_ID: ${{ inputs.output_id }}
