name: Admin — Fix workspaces schema + extend CJ trial

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            set -e
            export MYSQL_PWD="${LOCAL_DB_PASSWORD}"
            MYSQLT="mysql -h localhost -u mos_user mos_db -t --default-character-set=utf8mb4"

            echo "── 1. Inspect workspaces schema ─────"
            $MYSQLT -e "DESCRIBE workspaces;" || echo "(table does not exist)"

            echo
            echo "── 2. Patch missing columns ─────"
            # Add columns the router expects (idempotent)
            mysql -h localhost -u mos_user mos_db --default-character-set=utf8mb4 -e "
              CREATE TABLE IF NOT EXISTS workspaces (
                id              INT          NOT NULL AUTO_INCREMENT PRIMARY KEY,
                slug            VARCHAR(64)  NOT NULL UNIQUE,
                name            VARCHAR(160) NOT NULL,
                ownerUserId     INT          NOT NULL,
                planCode        VARCHAR(24)  NOT NULL DEFAULT 'solo',
                planStatus      VARCHAR(16)  NOT NULL DEFAULT 'trial',
                planEndsAt      DATETIME(3)  NULL,
                billingMode     VARCHAR(12)  NOT NULL DEFAULT 'solo',
                whiteLabelLogo  VARCHAR(500) NULL,
                whiteLabelName  VARCHAR(160) NULL,
                createdAt       DATETIME(3)  NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
                updatedAt       DATETIME(3)  NOT NULL DEFAULT CURRENT_TIMESTAMP(3) ON UPDATE CURRENT_TIMESTAMP(3),
                INDEX idx_ws_owner (ownerUserId),
                INDEX idx_ws_plan (planCode, planStatus)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
            "
            # Add any columns that might have been added after initial creation
            for col_def in \
              "slug VARCHAR(64) NULL" \
              "billingMode VARCHAR(12) NOT NULL DEFAULT 'solo'" \
              "whiteLabelLogo VARCHAR(500) NULL" \
              "whiteLabelName VARCHAR(160) NULL"; do
              col_name=$(echo "$col_def" | awk '{print $1}')
              exists=$(mysql -h localhost -u mos_user mos_db --skip-column-names -e "
                SELECT COUNT(*) FROM information_schema.COLUMNS
                WHERE TABLE_SCHEMA='mos_db' AND TABLE_NAME='workspaces' AND COLUMN_NAME='$col_name'
              ")
              if [ "$exists" = "0" ]; then
                echo "  + adding column: $col_def"
                mysql -h localhost -u mos_user mos_db --default-character-set=utf8mb4 -e "ALTER TABLE workspaces ADD COLUMN $col_def;" || true
              else
                echo "  = column $col_name already present"
              fi
            done

            # Backfill slug for any rows that have NULL/empty (after adding column NULL)
            mysql -h localhost -u mos_user mos_db --default-character-set=utf8mb4 -e "
              UPDATE workspaces
              SET slug = CONCAT('ws-', id, '-', SUBSTRING(MD5(RAND()), 1, 6))
              WHERE slug IS NULL OR slug = '';
            "
            # Now make slug NOT NULL UNIQUE if not already
            mysql -h localhost -u mos_user mos_db --default-character-set=utf8mb4 -e "
              ALTER TABLE workspaces MODIFY COLUMN slug VARCHAR(64) NOT NULL;
            " 2>&1 | grep -v "Note 1060" || true

            echo
            echo "── 3. Final schema ─────"
            $MYSQLT -e "DESCRIBE workspaces;"

            echo
            echo "── 4. Bootstrap default workspaces for users who don't have one ─────"
            # Find active users without any workspace_members row → create workspace + add as owner
            ORPHANS=$(mysql -h localhost -u mos_user mos_db --skip-column-names -e "
              SELECT u.id FROM users u
              LEFT JOIN workspace_members m ON m.userId = u.id
              WHERE u.isActive = 1 AND m.userId IS NULL
            ")
            echo "Users without workspace: $(echo "$ORPHANS" | wc -w)"
            for uid in $ORPHANS; do
              mysql -h localhost -u mos_user mos_db --default-character-set=utf8mb4 -e "
                INSERT INTO workspaces (slug, name, ownerUserId, planCode, planStatus, billingMode, planEndsAt)
                VALUES (CONCAT('ws-', $uid, '-', SUBSTRING(MD5(RAND()), 1, 6)),
                        CONCAT('Personal · ', $uid),
                        $uid, 'solo', 'trial', 'solo',
                        DATE_ADD(NOW(), INTERVAL 30 DAY));
                INSERT IGNORE INTO workspace_members (workspaceId, userId, role, joinedAt)
                VALUES (LAST_INSERT_ID(), $uid, 'owner', NOW(3));
              " 2>&1 | tail -1
            done

            echo
            echo "── 5. Extend CJ's trial (userId 199 + 1236870 + biombacj) ─────"
            mysql -h localhost -u mos_user mos_db --default-character-set=utf8mb4 -e "
              UPDATE users
              SET planStatus='trial', planEndsAt = DATE_ADD(NOW(), INTERVAL 90 DAY), isActive=1
              WHERE id IN (199, 1236870)
                 OR email IN ('contentincubator2@gmail.com', 'biomba.cj@gmail.com', 'cj@sowork.ai');
            "
            $MYSQLT -e "
              SELECT id, email, planCode, planStatus, planEndsAt
              FROM users WHERE id IN (199, 1236870)
                            OR email IN ('contentincubator2@gmail.com','biomba.cj@gmail.com','cj@sowork.ai');
            "
