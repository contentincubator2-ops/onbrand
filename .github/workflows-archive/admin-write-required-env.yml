name: Admin — Write required env vars (LOCAL_DB_*, APP_URL, EMAIL_FROM)

# Pre-requisite for B-02 (remove hardcoded DB password fallback in
# db.ts / localDb.ts). Without LOCAL_DB_PASSWORD in .env, the fallback
# '${LOCAL_DB_PASSWORD}' was the only thing keeping the app connected to DB.
# This workflow writes the canonical values into VM's .env so the
# upcoming B-02 commit (removing the fallback) doesn't crash prod.
#
# Idempotent: uses sed to upsert each key — re-running is safe.

on:
  workflow_dispatch:

jobs:
  write-env:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            set -e
            ENV_FILE=/opt/marketing-os/app/skills/ai-talent/.env

            upsert_kv() {
              local k="$1"; local v="$2"
              if grep -qE "^${k}=" "$ENV_FILE" 2>/dev/null; then
                sed -i "s|^${k}=.*|${k}=${v}|" "$ENV_FILE"
                echo "  ✓ updated ${k}"
              else
                echo "${k}=${v}" >> "$ENV_FILE"
                echo "  ✓ appended ${k}"
              fi
            }

            echo "════════════════════════════════════════"
            echo "  Writing required env vars to $ENV_FILE"
            echo "  $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "════════════════════════════════════════"

            # B-02 prerequisite — DB connection vars (match hardcoded defaults
            # currently in db.ts / localDb.ts so the upcoming fallback removal
            # doesn't crash prod).
            upsert_kv "LOCAL_DB_HOST"     "localhost"
            upsert_kv "LOCAL_DB_PORT"     "3306"
            upsert_kv "LOCAL_DB_USER"     "mos_user"
            upsert_kv "LOCAL_DB_PASSWORD" "${LOCAL_DB_PASSWORD}"
            upsert_kv "LOCAL_DB_NAME"     "mos_db"

            # Auth / email base config (currently missing — caused the
            # forgot-password reset email + URL bugs).
            upsert_kv "APP_URL"     "https://marketing-os.sowork.ai"
            upsert_kv "EMAIL_FROM"  "noreply@sowork.ai"

            # CORS origin (S-07) — match the public domain explicitly so
            # the production fallback in code is a redundant safety net.
            upsert_kv "CORS_ORIGIN" "https://marketing-os.sowork.ai"

            # Production NODE_ENV — required for the S-07 prod-aware CORS
            # fallback to activate.
            upsert_kv "NODE_ENV" "production"

            echo ""
            echo "── Verify (without printing secrets) ──"
            for k in LOCAL_DB_HOST LOCAL_DB_PORT LOCAL_DB_USER LOCAL_DB_NAME APP_URL EMAIL_FROM CORS_ORIGIN NODE_ENV; do
              v=$(grep -E "^${k}=" "$ENV_FILE" | head -1 | cut -d= -f2-)
              echo "  $k = $v"
            done
            for k in LOCAL_DB_PASSWORD; do
              if grep -qE "^${k}=." "$ENV_FILE"; then
                len=$(grep -E "^${k}=" "$ENV_FILE" | head -1 | cut -d= -f2- | wc -c)
                echo "  $k = (set, $len chars)"
              fi
            done

            echo ""
            echo "── Restart marketing-os PM2 process to pick up new env ──"
            pm2 restart marketing-os --update-env 2>&1 | tail -5
            sleep 3
            curl -s -o /dev/null -w "Health endpoint after restart: HTTP %{http_code}\n" http://127.0.0.1:3101/health

            echo ""
            echo "════════════════════════════════════════"
            echo "  Done."
            echo "════════════════════════════════════════"
