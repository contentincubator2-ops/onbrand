name: Admin — Fix port 80 redirect for drop.sowork.ai

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            set -e

            sudo cp /etc/nginx/sites-enabled/marketing-os /etc/nginx/sites-available/marketing-os.bak.port80-$(date +%s)

            echo "════════ Replace 'if ($host = marketing-os.sowork.ai) ...' with universal redirect ════════"
            # Use python for reliable multi-line replace
            sudo python3 <<'PYEOF'
            import re
            path = "/etc/nginx/sites-enabled/marketing-os"
            with open(path) as f:
                content = f.read()

            # Replace the certbot-generated narrow if-block + return 404 with
            # a universal redirect to HTTPS for all matching hosts.
            old = re.search(
                r'if \(\$host = marketing-os\.sowork\.ai\)\s*\{[^}]*\}\s*\n\s*listen 80;\s*\n\s*server_name[^;]*;\s*\n\s*return 404;',
                content
            )
            if old:
                replacement = """listen 80;
                server_name drop.sowork.ai marketing-os.sowork.ai;
                return 301 https://drop.sowork.ai$request_uri"""
                content = content.replace(old.group(0), replacement)
                with open(path, 'w') as f:
                    f.write(content)
                print("✓ Replaced port 80 block with universal redirect")
            else:
                print("✗ Pattern not found — manual check needed")
                # Print the last 30 lines for diagnosis
                print(content[-1500:])
            PYEOF

            echo ""
            echo "════════ verify the change ════════"
            sudo grep -A2 "listen 80" /etc/nginx/sites-enabled/marketing-os | head -8

            echo ""
            echo "════════ nginx -t + reload ════════"
            sudo nginx -t
            sudo nginx -s reload && echo "✓ reloaded"

            echo ""
            echo "════════ HTTP smoke test (應該回 301 到 https) ════════"
            curl -sS -i --max-time 10 -H "Host: drop.sowork.ai" http://localhost/ 2>&1 | head -5
