name: Admin — Deep probe Pipedream OAuth (try 4 auth methods)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 90s
          script: |
            set -e
            cd /opt/marketing-os/app/skills/ai-talent
            set -a; . ./.env; set +a

            echo "ENV present:"
            echo "  CLIENT_ID = ${PIPEDREAM_CLIENT_ID:0:6}... (${#PIPEDREAM_CLIENT_ID} chars)"
            echo "  CLIENT_SECRET = ${PIPEDREAM_CLIENT_SECRET:0:6}... (${#PIPEDREAM_CLIENT_SECRET} chars)"
            echo "  WORKSPACE_ID = $PIPEDREAM_WORKSPACE_ID"
            echo "  PROJECT_ID = $PIPEDREAM_PROJECT_ID"
            echo

            echo "── Method 1: JSON body, client_credentials ─────"
            curl -s --max-time 15 -X POST "https://api.pipedream.com/v1/oauth/token" \
              -H "Content-Type: application/json" \
              -d "{\"grant_type\":\"client_credentials\",\"client_id\":\"$PIPEDREAM_CLIENT_ID\",\"client_secret\":\"$PIPEDREAM_CLIENT_SECRET\"}" \
              | head -c 400
            echo
            echo

            echo "── Method 2: form-encoded body, client_credentials ─────"
            curl -s --max-time 15 -X POST "https://api.pipedream.com/v1/oauth/token" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "grant_type=client_credentials" \
              --data-urlencode "client_id=$PIPEDREAM_CLIENT_ID" \
              --data-urlencode "client_secret=$PIPEDREAM_CLIENT_SECRET" \
              | head -c 400
            echo
            echo

            echo "── Method 3: HTTP Basic auth ─────"
            curl -s --max-time 15 -X POST "https://api.pipedream.com/v1/oauth/token" \
              -u "$PIPEDREAM_CLIENT_ID:$PIPEDREAM_CLIENT_SECRET" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "grant_type=client_credentials" \
              | head -c 400
            echo
            echo

            echo "── Method 4: API Key as bearer (alternative path) ─────"
            curl -s --max-time 15 -X GET "https://api.pipedream.com/v1/users/me" \
              -H "Authorization: Bearer $PIPEDREAM_API_KEY" \
              | head -c 400
            echo
            echo

            echo "── Method 5: Connect tokens with API key bearer ─────"
            curl -s --max-time 15 -X POST \
              "https://api.pipedream.com/v1/connect/$PIPEDREAM_PROJECT_ID/tokens" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $PIPEDREAM_API_KEY" \
              -H "X-PD-Environment: production" \
              -d "{\"external_user_id\":\"probe-test\"}" \
              | head -c 400
            echo
            echo

            echo "── Method 6: workspace endpoint check ─────"
            curl -s --max-time 15 -X GET \
              "https://api.pipedream.com/v1/workspaces/$PIPEDREAM_WORKSPACE_ID" \
              -H "Authorization: Bearer $PIPEDREAM_API_KEY" \
              | head -c 400
            echo
