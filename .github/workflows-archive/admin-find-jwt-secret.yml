name: Admin — Find where JWT_SECRET is set

on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            ENV_FILE=/opt/marketing-os/app/skills/ai-talent/.env

            echo "════ JWT_SECRET in .env ════"
            if grep -qE "^JWT_SECRET=" "$ENV_FILE" 2>/dev/null; then
              LEN=$(grep -E "^JWT_SECRET=" "$ENV_FILE" | head -1 | cut -d= -f2- | tr -d '\r\n' | wc -c)
              echo "  YES — set, $LEN chars"
            else
              echo "  NO — JWT_SECRET not in .env"
            fi

            echo ""
            echo "════ JWT_SECRET in user ~/.bashrc / ~/.profile ════"
            grep -lE "JWT_SECRET" ~/.bashrc ~/.profile ~/.bash_profile ~/.zshrc 2>/dev/null || echo "  (not found in user shell rc files)"

            echo ""
            echo "════ JWT_SECRET in /etc/environment ════"
            sudo grep -E "JWT_SECRET" /etc/environment 2>/dev/null && echo "found" || echo "  (not in /etc/environment)"

            echo ""
            echo "════ Currently running PM2 process env (just hashed) ════"
            # Read /proc/<pid>/environ for marketing-os PM2 process
            PID=$(pm2 jlist 2>/dev/null | python3 -c "import sys, json; data = json.loads(sys.stdin.read()); print([p['pid'] for p in data if p['name']=='marketing-os'][0])" 2>/dev/null)
            if [ -n "$PID" ] && [ -r "/proc/$PID/environ" ]; then
              # Has JWT_SECRET in process env? print only key length, never the value.
              if tr '\0' '\n' < "/proc/$PID/environ" | grep -q "^JWT_SECRET="; then
                JWT_VAL=$(tr '\0' '\n' < "/proc/$PID/environ" | grep "^JWT_SECRET=" | head -1 | cut -d= -f2-)
                echo "  YES — JWT_SECRET is in process env ($(echo -n "$JWT_VAL" | wc -c) chars)"
                echo "  SHA-256 fingerprint of value: $(echo -n "$JWT_VAL" | sha256sum | cut -c1-16)..."
              else
                echo "  NO — process env has no JWT_SECRET"
              fi
            else
              echo "  (couldn't read /proc/$PID/environ — pid=$PID)"
            fi

            echo ""
            echo "════ All env keys in .env (just names) ════"
            grep -oE "^[A-Z_][A-Z0-9_]*=" "$ENV_FILE" 2>/dev/null | sort -u
