name: Admin — Update HAILUO_API_KEY (current key invalid 2049)

on:
  workflow_dispatch:
    inputs:
      key:
        description: 'New Hailuo / MiniMax API key (paste full token)'
        required: true

jobs:
  setkey:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          envs: NEW_KEY
          script: |
            cd /opt/marketing-os/app/skills/ai-talent
            sed -i '/^HAILUO_API_KEY=/d' .env
            sed -i '/^MINIMAX_API_KEY=/d' .env
            echo "HAILUO_API_KEY=$NEW_KEY" >> .env
            echo "MINIMAX_API_KEY=$NEW_KEY" >> .env

            echo "── verify written ──"
            grep -E "^(HAILUO|MINIMAX)_API_KEY=" .env | sed 's/=.*/=<set>/'

            pm2 restart marketing-os --update-env
            sleep 3
            pm2 status | grep marketing-os

            echo ""
            echo "── smoke test new key ──"
            curl --max-time 20 -sS -X POST "https://api.minimax.chat/v1/video_generation" \
              -H "Authorization: Bearer $NEW_KEY" \
              -H "Content-Type: application/json" \
              -d '{"model":"T2V-01","prompt":"a quick smoke test, blue sky"}' \
              -w "\nHTTP %{http_code}\n" | head -c 400
        env:
          NEW_KEY: ${{ inputs.key }}
