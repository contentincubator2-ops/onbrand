name: Admin — Cutover marketing-os → drop (drop becomes sole canonical)

on:
  workflow_dispatch:

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 180s
          script: |
            set -e

            echo "════════ STEP 1: Backup current marketing-os nginx config ════════"
            sudo cp /etc/nginx/sites-enabled/marketing-os /etc/nginx/sites-available/marketing-os.pre-cutover-$(date +%s).bak

            echo ""
            echo "════════ STEP 2: 把 marketing-os.sowork.ai 從主 server_name 換成 drop.sowork.ai ════════"
            # In all server_name lines, swap 'marketing-os.sowork.ai' for 'drop.sowork.ai'
            # AND remove drop.sowork.ai duplicates (we already added it earlier)
            sudo awk '
              /server_name/ {
                # remove standalone "drop.sowork.ai" if marketing-os is there too — we are about to swap
                gsub(/[ \t]drop\.sowork\.ai/, "")
                # swap marketing-os → drop
                gsub(/marketing-os\.sowork\.ai/, "drop.sowork.ai")
              }
              { print }
            ' /etc/nginx/sites-enabled/marketing-os > /tmp/marketing-os.new
            sudo mv /tmp/marketing-os.new /etc/nginx/sites-enabled/marketing-os

            echo ""
            echo "── Updated server_name (主 app 已經是 drop) ──"
            sudo grep -n "server_name" /etc/nginx/sites-enabled/marketing-os

            echo ""
            echo "════════ STEP 3: 加一個 marketing-os.sowork.ai → drop.sowork.ai 301 redirect 設定 ════════"
            sudo tee /etc/nginx/sites-available/marketing-os-redirect > /dev/null <<'EOF'
            # 2026-05-10: marketing-os.sowork.ai → drop.sowork.ai (301)
            # 舊書籤、舊 link 都自動轉到新域名。等所有對外連結改完再下架這份。
            server {
                listen 80;
                server_name marketing-os.sowork.ai;
                return 301 https://drop.sowork.ai$request_uri;
            }
            server {
                listen 443 ssl;
                server_name marketing-os.sowork.ai;
                ssl_certificate /etc/letsencrypt/live/marketing-os.sowork.ai/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/marketing-os.sowork.ai/privkey.pem;
                include /etc/letsencrypt/options-ssl-nginx.conf;
                ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
                return 301 https://drop.sowork.ai$request_uri;
            }
            EOF
            sudo ln -sf /etc/nginx/sites-available/marketing-os-redirect /etc/nginx/sites-enabled/marketing-os-redirect

            echo ""
            echo "── sites-enabled 現況 ──"
            sudo ls -la /etc/nginx/sites-enabled/

            echo ""
            echo "════════ STEP 4: nginx -t + reload ════════"
            sudo nginx -t
            sudo nginx -s reload && echo "✓ reloaded"

            echo ""
            echo "════════ STEP 5: smoke test 兩條鏈路 ════════"
            echo "── drop.sowork.ai 應該 200 ──"
            curl -sS -I --max-time 10 https://drop.sowork.ai/ 2>&1 | head -3
            echo ""
            echo "── marketing-os.sowork.ai 應該 301 redirect to drop ──"
            curl -sS -I --max-time 10 https://marketing-os.sowork.ai/ 2>&1 | head -5

            echo ""
            echo "════════ STEP 6: pm2 restart (load updated CORS / CSP from code) ════════"
            pm2 restart marketing-os --update-env 2>&1 | tail -3

            echo ""
            echo "════════ DONE ════════"
            echo "drop.sowork.ai 是新主域名，marketing-os.sowork.ai 自動 redirect 過去"
