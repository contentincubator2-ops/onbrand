name: Admin — Trace live image.generate errors

on:
  workflow_dispatch:

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            LOG_OUT=/home/$(whoami)/.pm2/logs/marketing-os-out.log
            LOG_ERR=/home/$(whoami)/.pm2/logs/marketing-os-error.log

            echo "── recent image.generate tRPC errors ─────"
            tail -400 "$LOG_ERR" 2>/dev/null | grep -B 1 -A 8 "image\.generate\|image-gen\|generateImage" | tail -80

            echo
            echo "── recent image.generate calls in out log ─────"
            tail -2000 "$LOG_OUT" 2>/dev/null | grep -iE "image\.generate|generateImage|piapi|gpt-image|openai.*image|flux|imagen" | tail -40

            echo
            echo "── any payload-too-large / 413 lately ─────"
            tail -800 "$LOG_OUT" 2>/dev/null | grep -iE "PAYLOAD|413|too large|entity too large" | tail -10
            tail -800 "$LOG_ERR" 2>/dev/null | grep -iE "PAYLOAD|413|too large|entity too large" | tail -10
