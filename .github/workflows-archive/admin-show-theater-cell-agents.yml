name: Admin — Show theater-cell agents + aiModel (per platform)

on:
  workflow_dispatch:

jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            export MYSQL_PWD="mos_secure_2026"
            MYSQLT="mysql -h localhost -u mos_user mos_db -t --default-character-set=utf8mb4"

            echo "── theater-cell-{platform} → which agent + what aiModel ─────"
            # Agent IDs read from data/agent-assignments.json:
            #   facebook  → 60056
            #   instagram → 220505
            #   youtube   → 223998
            #   threads   → 220502
            #   line      → 220503
            #   blog      → 220504
            $MYSQLT -e "
              SELECT
                CASE id
                  WHEN 60056  THEN 'facebook'
                  WHEN 220505 THEN 'instagram'
                  WHEN 223998 THEN 'youtube'
                  WHEN 220502 THEN 'threads'
                  WHEN 220503 THEN 'line'
                  WHEN 220504 THEN 'blog'
                END                          AS platform,
                id                           AS agent_id,
                LEFT(name, 16)               AS name,
                LEFT(title, 36)              AS title,
                IFNULL(aiModel, '(NULL)')    AS aiModel
              FROM agents
              WHERE id IN (60056, 220505, 223998, 220502, 220503, 220504)
              ORDER BY FIELD(id, 60056, 220505, 223998, 220502, 220503, 220504);
            "
