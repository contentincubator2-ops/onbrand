name: Admin — Show port 3101 content + path layout

on:
  workflow_dispatch:

jobs:
  show:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 2
    steps:
      - run: |
          set -e
          echo "── full response from localhost:3101 ──"
          curl -s "http://localhost:3101/" -v 2>&1 | head -40

          echo ""
          echo "── pm2 describe marketing-os ──"
          pm2 describe marketing-os 2>/dev/null | head -50

          echo ""
          echo "── /opt/marketing-os/app/skills/ai-talent/public ──"
          ls -la /opt/marketing-os/app/skills/ai-talent/public 2>/dev/null | head -10
          echo ""
          ls -la /opt/marketing-os/app/skills/ai-talent/public/assets 2>/dev/null | head -10

          echo ""
          echo "── /opt/marketing-os/app/skills/ai-talent/client/dist ──"
          ls -la /opt/marketing-os/app/skills/ai-talent/client/dist 2>/dev/null | head -10
          echo ""
          ls -la /opt/marketing-os/app/skills/ai-talent/client/dist/assets 2>/dev/null | head -10

          echo ""
          echo "── what about port 3000 (ai-marketer)? where does it run from? ──"
          pm2 describe ai-marketer 2>/dev/null | head -30

          echo ""
          echo "── direct GET / on 3101 with full HTML ──"
          curl -s "http://localhost:3101/"
