name: Admin — Grant @sowork.tw accounts unlimited (enterprise plan)

on:
  workflow_dispatch:

jobs:
  grant:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            export MYSQL_PWD="${LOCAL_DB_PASSWORD}"

            echo "════════ BEFORE: @sowork.tw users ════════"
            mysql -h localhost -u mos_user mos_db -e "
              SELECT id, email, planCode, planStatus, planEndsAt, isActive
              FROM users WHERE email LIKE '%@sowork.tw' \G"

            echo ""
            echo "════════ STEP 1: 升級為 enterprise (永久 active) ════════"
            mysql -h localhost -u mos_user mos_db -e "
              UPDATE users
              SET planCode    = 'enterprise',
                  planStatus  = 'active',
                  planEndsAt  = '2099-12-31 23:59:59',
                  isActive    = 1
              WHERE email LIKE '%@sowork.tw'
            "

            echo ""
            echo "════════ STEP 2: 補滿 wallet（避免 checkEnoughCredits 卡住） ════════"
            # userCredits 表如果不存在 row，PRE-flight 會吞 error 通過；存在則更新
            mysql -h localhost -u mos_user mos_db -e "
              UPDATE userCredits uc
              JOIN users u ON u.id = uc.userId
              SET uc.planTier    = 'enterprise',
                  uc.planCredits = 999999,
                  uc.usedCredits = 0,
                  uc.extraCredits = 999999,
                  uc.cycleEnd    = '2099-12-31 23:59:59'
              WHERE u.email LIKE '%@sowork.tw'
            "

            echo ""
            echo "════════ AFTER: 確認結果 ════════"
            mysql -h localhost -u mos_user mos_db -e "
              SELECT u.id, u.email, u.planCode, u.planStatus, u.planEndsAt,
                     uc.planTier, uc.planCredits, uc.usedCredits, uc.extraCredits
              FROM users u
              LEFT JOIN userCredits uc ON uc.userId = u.id
              WHERE u.email LIKE '%@sowork.tw' \G"

            echo ""
            echo "════════ STEP 3: pm2 restart (讓 preflight cache 清空) ════════"
            pm2 restart marketing-os --update-env 2>&1 | tail -3

            echo ""
            echo "════════ DONE ════════"
            echo "✅ @sowork.tw 全部帳號已升級為 enterprise plan"
            echo "✅ preflightCostCheck 程式碼層也已加入 enterprise bypass"
            echo "✅ 每日 \$5 cap + 50/hr 任務上限 + 餘額不足 — 全跳過"
