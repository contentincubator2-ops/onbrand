name: Admin — Trace RunPage end-to-end

on:
  workflow_dispatch:
    inputs:
      output_id:
        description: 'output id to trace'
        required: true
        type: string

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 90s
          envs: OUTPUT_ID
          script: |
            cd /opt/marketing-os/app/skills/ai-talent
            export MYSQL_PWD="${LOCAL_DB_PASSWORD}"
            MYSQL="mysql -h localhost -u mos_user mos_db"

            echo "════════ DEPLOY STATE ════════"
            echo "── Latest commit on disk ──"
            cd /opt/marketing-os/app && git log --oneline -3 2>/dev/null || ls -la skills/ai-talent/server/_core/quickTaskOrchestra.ts | awk '{print $6,$7,$8}'
            cd /opt/marketing-os/app/skills/ai-talent
            echo ""
            echo "── pm2 status ──"
            pm2 status | grep marketing-os
            echo ""
            echo "── Bundle hash live ──"
            ls -la public/ 2>/dev/null | grep "index.*js" | head -1
            echo ""

            echo "════════ DB STATE for output ${OUTPUT_ID} ════════"
            $MYSQL mos_db -BN -e "
              SELECT JSON_OBJECT(
                'output_id', o.id,
                'output_platform', o.platform,
                'output_outputType', o.outputType,
                'mission_id', m.id,
                'mission_workspace', m.workspace,
                'mission_description', m.description,
                'metadata_taskId', JSON_UNQUOTE(JSON_EXTRACT(o.metadata, '\$.taskId')),
                'metadata_tier', JSON_UNQUOTE(JSON_EXTRACT(o.metadata, '\$.tier'))
              )
              FROM mission_outputs o
              JOIN missions m ON m.id = o.missionId
              WHERE o.id = ${OUTPUT_ID};
            "
            echo ""

            echo "════════ COMPILED CLIENT BUNDLE ════════"
            echo "── Search bundle for 'idPrefixMap' (proves new code in build) ──"
            ls public/index*.js 2>/dev/null | head -1 | xargs grep -o 'idPrefixMap\|fb-30-ad\|formatFromTaskId\|proposal-cover' 2>/dev/null | sort -u | head -10
            echo ""
            echo "── Search bundle for 'generic:feed' fallback string ──"
            ls public/index*.js 2>/dev/null | head -1 | xargs grep -c "generic:feed" 2>/dev/null

            echo ""
            echo "════════ RuntimeAPI test ════════"
            echo "Calling getById via internal API (bypassing auth — direct localhost)..."
            # We can't call tRPC directly without auth headers. Show the resolver source instead.
            echo ""
            echo "── Live deployed resolver (mission.taskId path) ──"
            grep -A 3 "taskMatch.*description.*match" server/routers/outputRouter.ts 2>/dev/null | head -8
        env:
          OUTPUT_ID: ${{ inputs.output_id }}
