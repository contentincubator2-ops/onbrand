name: Admin — Probe Phase 1 (dedupe + thick agents in real prod task)

# Verify post-Phase-1:
#  1. Agent dedupe: every quickTask template references a unique agent
#  2. Thick agents: loadAgent reads 10 rich fields, persona text > 2000 chars
#  3. Real LLM probe: kick off a 30s task end-to-end against prod DB,
#     confirm the resulting persona context blob actually contains
#     workingPrinciples / experienceDetail content from the agent row

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 300s
          script: |
            set -e
            cd /opt/marketing-os/app/skills/ai-talent
            set -a; . ./.env; set +a
            export MYSQL_PWD="${LOCAL_DB_PASSWORD}"

            echo "════════════════════════════════════════════════════════"
            echo "  PHASE 1 VERIFY — dedupe + thick-agent loadout"
            echo "════════════════════════════════════════════════════════"

            echo
            echo "── 1. Source-code: unique agent_id count ─────"
            grep -ohE 'agent_id:\s*[0-9]+' server/_core/quickTask*.ts | awk '{print $2}' | sort -u | wc -l
            echo "(expect: 170)"

            echo
            echo "── 2. DB: agent total-char distribution for used IDs ─────"
            USED_IDS=$(grep -ohE 'agent_id:\s*[0-9]+' server/_core/quickTask*.ts | awk '{print $2}' | sort -u | paste -sd,)
            MYSQLT="mysql -h localhost -u mos_user mos_db -t --default-character-set=utf8mb4"
            $MYSQLT -e "
              SELECT
                SUM(CASE WHEN tc >= 2000 THEN 1 ELSE 0 END) AS aplus,
                SUM(CASE WHEN tc <  2000 THEN 1 ELSE 0 END) AS sub_aplus,
                MIN(tc) AS min_chars,
                ROUND(AVG(tc)) AS avg_chars,
                MAX(tc) AS max_chars
              FROM (
                SELECT id,
                  (CHAR_LENGTH(IFNULL(bio,''))
                  + CHAR_LENGTH(IFNULL(specialty,''))
                  + CHAR_LENGTH(IFNULL(methodology,''))
                  + CHAR_LENGTH(IFNULL(taskSystemPrompt,''))
                  + CHAR_LENGTH(IFNULL(experienceDetail,''))
                  + CHAR_LENGTH(IFNULL(workingPrinciples,''))
                  + CHAR_LENGTH(IFNULL(specialtySummary,''))
                  + CHAR_LENGTH(IFNULL(tool_instructions,''))
                  + CHAR_LENGTH(IFNULL(bio_zh,''))) AS tc
                FROM agents WHERE id IN ($USED_IDS)
              ) x;
            "

            echo
            echo "── 3. Sample 5 agents: prove the new fields exist ─────"
            $MYSQLT -e "
              SELECT id, LEFT(name,12) AS name,
                CHAR_LENGTH(IFNULL(workingPrinciples,'')) AS wp_chars,
                CHAR_LENGTH(IFNULL(experienceDetail,''))  AS exp_chars,
                CHAR_LENGTH(IFNULL(specialtySummary,'')) AS sum_chars
              FROM agents
              WHERE id IN (221080,238853,239024,222204,220871)
              ORDER BY id;
            "

            echo
            echo "── 4. Probe loadAgent via Node REPL on prod source ─────"
            # Pick a known agent (30001) and load via the same path orchestra uses
            cat > /tmp/probe_loadagent.mjs <<'JSEOF'
            import { createRequire } from "module";
            const require = createRequire(import.meta.url);
            process.chdir("/opt/marketing-os/app/skills/ai-talent");
            const dotenv = require("dotenv");
            dotenv.config({ path: "./.env" });

            const mysql = require("mysql2/promise");
            const pool = await mysql.createPool({
              host: "localhost", user: "mos_user", password: "${LOCAL_DB_PASSWORD}",
              database: "mos_db", connectionLimit: 2,
              charset: "utf8mb4",
            });

            const FIELD_CAPS = {
              bio: 500, specialty: 1500, methodology: 1500,
              experienceDetail: 600, workingPrinciples: 1000,
              specialtySummary: 400, tool_instructions: 800,
              bio_zh: 300, caseStudies: 800, taskSystemPrompt: 2000,
            };

            for (const aid of [30001, 25, 60067, 220870, 221080, 239024]) {
              const [rows] = await pool.execute(
                `SELECT id, name, title, bio, specialty, methodology, taskSystemPrompt,
                        experienceDetail, workingPrinciples, specialtySummary,
                        tool_instructions, bio_zh, caseStudies, aiModel
                 FROM agents WHERE id = ? LIMIT 1`,
                [aid],
              );
              const a = rows[0];
              if (!a) { console.log(`  ${aid}: NOT FOUND`); continue; }
              let total = 0;
              const breakdown = {};
              for (const k of Object.keys(FIELD_CAPS)) {
                const v = a[k];
                const n = v ? String(v).length : 0;
                breakdown[k] = n;
                total += Math.min(n, FIELD_CAPS[k]);
              }
              console.log(`  ${a.id} ${a.name.padEnd(16)} total(capped)=${String(total).padStart(4)} | wp=${breakdown.workingPrinciples} exp=${breakdown.experienceDetail} spec=${breakdown.specialty}`);
            }
            await pool.end();
            JSEOF
            node /tmp/probe_loadagent.mjs

            echo
            echo "── 5. Real 30s task probe via tRPC ─────"
            # Need an active user with a brand for the probe.
            ACTIVE_USER=$(mysql -h localhost -u mos_user mos_db --skip-column-names -e "
              SELECT u.id FROM users u
              JOIN brands b ON b.userId = u.id
              WHERE u.isActive = 1 ORDER BY u.id DESC LIMIT 1
            ")
            ACTIVE_BRAND=$(mysql -h localhost -u mos_user mos_db --skip-column-names -e "
              SELECT id FROM brands WHERE userId = $ACTIVE_USER ORDER BY id DESC LIMIT 1
            ")
            echo "  using userId=$ACTIVE_USER brandId=$ACTIVE_BRAND"

            JWT=$(node -e "
              const j = require('/opt/marketing-os/app/skills/ai-talent/node_modules/jsonwebtoken');
              console.log(j.sign({id: $ACTIVE_USER}, process.env.JWT_SECRET, {expiresIn:'10m'}));
            ")

            echo "  → POST /trpc/quickTask.runOrchestra (task: fb-30-hook-test)"
            curl -s --max-time 45 -X POST "http://localhost:3101/trpc/quickTask.runOrchestra" \
              -H "Content-Type: application/json" \
              -H "Cookie: authToken=$JWT" \
              -d "{\"taskId\":\"fb-30-hook-test\",\"inputs\":{\"context\":\"Phase 1 probe — 母親節節慶貼文\"},\"brandId\":$ACTIVE_BRAND}" \
              | head -c 800
            echo
            echo
            echo "✓ Probe complete"
