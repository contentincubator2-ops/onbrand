name: Admin — cat index.html (port 3101 + port 3000)

on:
  workflow_dispatch:

jobs:
  cat:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 2
    steps:
      - run: |
          set -e
          echo "════════════════ port 3101 (marketing-os, broken) ════════════════"
          curl -s "http://localhost:3101/"

          echo ""
          echo ""
          echo "════════════════ port 3000 (ai-marketer, working) — first 800 chars ════════════════"
          curl -s "http://localhost:3000/" | head -c 800

          echo ""
          echo ""
          echo "════════════════ ai-marketer cwd ════════════════"
          pm2 describe ai-marketer 2>/dev/null | grep -E "exec cwd|script path"
