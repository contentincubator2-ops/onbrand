name: Admin — Inspect brand 2832 (website / socialLinks / brand_brain / knowledge items)

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 30s
          script: |
            export MYSQL_PWD="mos_secure_2026"

            echo "════════ brands row (主要表) ════════"
            mysql -h localhost -u mos_user mos_db -e "
              SELECT id, name, industry, website, socialLinks,
                     LEFT(description, 100) AS description,
                     positioningStatus, LEFT(positioningSummary, 100) AS positioning,
                     tagline
              FROM brands WHERE id = 2832
            \G"

            echo ""
            echo "════════ brand_brain entries (補充屬性) ════════"
            mysql -h localhost -u mos_user mos_db -e "
              SELECT category, title, LEFT(content, 80) AS content_preview, updated_at
              FROM brand_brain WHERE brand_id = 2832
              ORDER BY updated_at DESC LIMIT 20
            "

            echo ""
            echo "════════ brand_knowledge_items 數量 ════════"
            mysql -h localhost -u mos_user mos_db -e "
              SELECT COUNT(*) AS items, MAX(createdAt) AS latest
              FROM brand_knowledge_items WHERE brandId = 2832
            "
