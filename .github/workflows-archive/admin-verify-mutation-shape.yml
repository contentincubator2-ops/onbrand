name: Admin — Verify mutation procedures reject GET
on: { workflow_dispatch: {} }
jobs:
  v:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 2
    steps:
      - run: |
          set +e
          # Mutation procedures probed via GET in smoke test returned non-error.
          # Verify each actually requires POST + auth.
          for p in scope.savePositioning output.updateVariantCaption output.updateVariantImage image.generate quickTask.runOrchestra60 positioningJobs.start support.startConversation support.sendMessage festival.upcoming; do
            echo ""
            echo "── $p (POST without auth) ──"
            RESP=$(curl -s "http://localhost:3101/trpc/$p?batch=1" \
              -X POST -H "Content-Type: application/json" \
              -d '{"0":{"json":{}}}' --max-time 5)
            echo "  $(echo "$RESP" | head -c 280)"
          done
