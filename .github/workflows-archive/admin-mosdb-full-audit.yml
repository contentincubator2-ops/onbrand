name: Admin — mos_db full health audit (field completeness + thickness)

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 90s
          script: |
            export MYSQL_PWD="${LOCAL_DB_PASSWORD}"
            MYSQLT="mysql -h localhost -u mos_user mos_db -t"
            THICK="(CHAR_LENGTH(IFNULL(bio,''))+CHAR_LENGTH(IFNULL(specialty,''))+CHAR_LENGTH(IFNULL(methodology,''))+CHAR_LENGTH(IFNULL(experienceDetail,'')))"

            echo "=== 1. Total agents in mos_db ==="
            $MYSQLT -e "SELECT COUNT(*) total, SUM(CASE WHEN isAvailable=1 THEN 1 ELSE 0 END) avail, SUM(CASE WHEN reviewStatus='approved' THEN 1 ELSE 0 END) approved FROM agents"

            echo ""
            echo "=== 2. Field completeness (each field non-empty) ==="
            $MYSQLT -e "
              SELECT
                SUM(CASE WHEN CHAR_LENGTH(IFNULL(bio,'')) > 0 THEN 1 ELSE 0 END) AS has_bio,
                SUM(CASE WHEN CHAR_LENGTH(IFNULL(specialty,'')) > 0 THEN 1 ELSE 0 END) AS has_specialty,
                SUM(CASE WHEN CHAR_LENGTH(IFNULL(methodology,'')) > 0 THEN 1 ELSE 0 END) AS has_methodology,
                SUM(CASE WHEN CHAR_LENGTH(IFNULL(experienceDetail,'')) > 0 THEN 1 ELSE 0 END) AS has_exp,
                SUM(CASE WHEN CHAR_LENGTH(IFNULL(skills,'')) > 0 THEN 1 ELSE 0 END) AS has_skills
              FROM agents WHERE isAvailable=1 AND reviewStatus='approved'"

            echo ""
            echo "=== 3. ALL 4 fields non-empty + ≥400 char (THE B+ POOL) ==="
            $MYSQLT -e "
              SELECT COUNT(*) AS qualifying_agents
              FROM agents WHERE isAvailable=1 AND reviewStatus='approved'
                AND CHAR_LENGTH(IFNULL(bio,'')) > 0
                AND CHAR_LENGTH(IFNULL(specialty,'')) > 0
                AND CHAR_LENGTH(IFNULL(methodology,'')) > 0
                AND CHAR_LENGTH(IFNULL(experienceDetail,'')) > 0
                AND $THICK >= 400"

            echo ""
            echo "=== 4. ≥400 char (regardless of field completeness) ==="
            $MYSQLT -e "
              SELECT COUNT(*) AS thick_total
              FROM agents WHERE isAvailable=1 AND reviewStatus='approved'
                AND $THICK >= 400"

            echo ""
            echo "=== 5. Distribution by skill area (B+ pool only) ==="
            $MYSQLT -e "
              SELECT
                CASE
                  WHEN LOWER(primarySkill) LIKE '%fb%' OR LOWER(primarySkill) LIKE '%facebook%' THEN '01-FB'
                  WHEN LOWER(primarySkill) LIKE '%ig%' OR LOWER(primarySkill) LIKE '%instagram%' THEN '02-IG'
                  WHEN LOWER(primarySkill) LIKE '%youtube%' OR LOWER(primarySkill) LIKE '%yt%' THEN '03-YT'
                  WHEN LOWER(primarySkill) LIKE '%tiktok%' OR LOWER(primarySkill) LIKE '%short%video%' THEN '04-TT'
                  WHEN LOWER(primarySkill) LIKE '%linkedin%' OR LOWER(primarySkill) LIKE '%b2b%' THEN '05-LI/B2B'
                  WHEN LOWER(primarySkill) LIKE '%email%' OR LOWER(primarySkill) LIKE '%newsletter%' OR LOWER(primarySkill) LIKE '%crm%' THEN '06-Email/CRM'
                  WHEN LOWER(primarySkill) LIKE '%pr%' OR LOWER(primarySkill) LIKE '%press%' OR LOWER(primarySkill) LIKE '%comm%' THEN '07-PR/Comms'
                  WHEN LOWER(primarySkill) LIKE '%design%' OR LOWER(primarySkill) LIKE '%visual%' OR LOWER(primarySkill) LIKE '%art%' OR LOWER(primarySkill) LIKE '%brand-identity%' THEN '08-Design/Visual'
                  WHEN LOWER(primarySkill) LIKE '%research%' OR LOWER(primarySkill) LIKE '%user-research%' OR LOWER(primarySkill) LIKE '%insight%' THEN '09-Research'
                  WHEN LOWER(primarySkill) LIKE '%legal%' OR LOWER(primarySkill) LIKE '%compliance%' THEN '10-Legal'
                  WHEN LOWER(primarySkill) LIKE '%strateg%' OR LOWER(primarySkill) LIKE '%mbb%' OR LOWER(primarySkill) LIKE '%cmo%' THEN '11-Strategy'
                  WHEN LOWER(primarySkill) LIKE '%video%' OR LOWER(primarySkill) LIKE '%motion%' THEN '12-Video'
                  WHEN LOWER(primarySkill) LIKE '%seo%' OR LOWER(primarySkill) LIKE '%content%' THEN '13-SEO/Content'
                  ELSE '99-Other'
                END AS bucket,
                COUNT(*) AS n,
                ROUND(AVG($THICK)) AS avg_thickness
              FROM agents
              WHERE isAvailable=1 AND reviewStatus='approved' AND $THICK >= 400
              GROUP BY bucket
              ORDER BY bucket"

            echo ""
            echo "=== 6. Field-quality bins for the B+ pool ==="
            $MYSQLT -e "
              SELECT
                CASE
                  WHEN num_filled_fields = 4 THEN '4 fields all filled'
                  WHEN num_filled_fields = 3 THEN '3 fields filled'
                  WHEN num_filled_fields = 2 THEN '2 fields filled'
                  WHEN num_filled_fields = 1 THEN '1 field only'
                  ELSE                              'no fields'
                END AS field_completeness,
                COUNT(*) AS agents
              FROM (
                SELECT id,
                  (CASE WHEN CHAR_LENGTH(IFNULL(bio,'')) > 0 THEN 1 ELSE 0 END
                  + CASE WHEN CHAR_LENGTH(IFNULL(specialty,'')) > 0 THEN 1 ELSE 0 END
                  + CASE WHEN CHAR_LENGTH(IFNULL(methodology,'')) > 0 THEN 1 ELSE 0 END
                  + CASE WHEN CHAR_LENGTH(IFNULL(experienceDetail,'')) > 0 THEN 1 ELSE 0 END) AS num_filled_fields
                FROM agents WHERE isAvailable=1 AND reviewStatus='approved' AND $THICK >= 400
              ) t
              GROUP BY field_completeness
              ORDER BY field_completeness DESC"
