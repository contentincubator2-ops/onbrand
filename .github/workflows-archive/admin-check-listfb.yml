name: Admin — Check listFB output (FB 60s sanity)
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            cd /opt/marketing-os/app/skills/ai-talent
            # Run listFB inline by simulating its task aggregation
            npx tsx -e "
            (async () => {
              const fb = await import('./server/_core/quickTaskFB.ts');
              const fb60 = await import('./server/_core/quickTaskFB60.ts');
              const ig = await import('./server/_core/quickTaskIG.ts');
              const ig60 = await import('./server/_core/quickTaskIG60.ts');
              const yt = await import('./server/_core/quickTaskYT.ts');
              const yt60 = await import('./server/_core/quickTaskYT60.ts');
              const m60 = await import('./server/_core/quickTaskMulti60.ts');

              const all = [
                ...fb.listAllFBTasks(),
                ...fb60.FB_60S_TASKS_V2.map((t:any)=>({...t, kind:'fast', platform:'facebook'})),
                ...ig60.IG_60S_TASKS.map((t:any)=>({...t, kind:'fast', platform:'instagram'})),
                ...yt60.YT_60S_TASKS.map((t:any)=>({...t, kind:'fast', platform:'youtube'})),
                ...m60.MULTI_60S_TASKS.map((t:any)=>({...t, kind:'fast'})),
              ];
              // Apply same platform inference as listFB router
              const enriched = all.map((t:any) => {
                const platform = t.platform ?? (
                  t.id?.startsWith('ig-') ? 'instagram' :
                  t.id?.startsWith('yt-') ? 'youtube' :
                  t.id?.startsWith('tt-') ? 'tiktok' :
                  t.id?.startsWith('li-') ? 'linkedin' :
                  t.id?.startsWith('em-') ? 'email' :
                  t.id?.startsWith('pr-') ? 'pr' :
                  t.id?.startsWith('br-') ? 'brand' :
                  t.id?.startsWith('rs-') ? 'audience' :
                  t.id?.startsWith('fb-') ? 'facebook' : 'facebook'
                );
                return { ...t, platform };
              });
              console.log('Total enriched:', enriched.length);
              const fb30 = enriched.filter((t:any)=>t.platform==='facebook' && t.tier==='30s');
              const fb60 = enriched.filter((t:any)=>t.platform==='facebook' && t.tier==='60s');
              console.log('FB 30s:', fb30.length, '(should be 10)');
              console.log('FB 60s:', fb60.length, '(should be 12)');
              if (fb60.length > 0) for (const t of fb60.slice(0,3)) console.log('  60s:', t.id, '|', t.label);
              if (fb30.length > 0) for (const t of fb30.slice(0,3)) console.log('  30s:', t.id, '|', t.label);
            })().catch(e => console.error('error:', e.message, e.stack));
            " 2>&1
