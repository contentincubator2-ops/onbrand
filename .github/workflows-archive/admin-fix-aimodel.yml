name: Admin — Fix aiModel to ONLY confirmed-working models

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 90s
          script: |
            export MYSQL_PWD="${LOCAL_DB_PASSWORD}"
            MYSQL="mysql -h localhost -u mos_user mos_db"

            echo "=== Strategy: only 3 LLM-callable models actually work via invokeLLM ==="
            echo "  qwen3-32b      → qwen provider (workhorse for zh)"
            echo "  Kimi-K2.5      → azure-foundry (secondary)"
            echo "  glm-4-flash    → zhipu (tertiary)"
            echo ""
            echo "All other model strings (claude-*, gpt-*, DeepSeek-*, perplexity/*, Llama, etc.)"
            echo "currently return 404/401/timeout. Map them to one of the 3 above based on"
            echo "agent's specialty pattern."
            echo ""

            echo "=== Before ==="
            $MYSQL -t -e "SELECT IFNULL(NULLIF(aiModel,''),'(empty)') AS m, COUNT(*) AS n FROM agents GROUP BY m ORDER BY n DESC LIMIT 30;"

            # Reset everything to qwen3-32b first (default workhorse)
            $MYSQL -e "UPDATE agents SET aiModel='qwen3-32b';"

            # Then bump small subset (~10%) to azure-foundry/Kimi-K2.5 for variety
            # — agents with English-name + analytical/strategic profiles
            $MYSQL -e "
              UPDATE agents SET aiModel='Kimi-K2.5'
              WHERE id IN (
                SELECT id FROM (
                  SELECT id FROM agents
                  WHERE LOWER(IFNULL(primarySkill,'')) LIKE '%mbb%'
                    OR LOWER(IFNULL(title,'')) LIKE '%strateg%'
                    OR LOWER(IFNULL(title,'')) LIKE '%consultant%'
                    OR LOWER(IFNULL(title,'')) LIKE '%analyst%'
                  ORDER BY RAND() LIMIT 1500
                ) AS t
              );
            "

            # Another small subset → zhipu (glm-4-flash) for diversity
            $MYSQL -e "
              UPDATE agents SET aiModel='glm-4-flash'
              WHERE aiModel = 'qwen3-32b'
              AND id IN (
                SELECT id FROM (
                  SELECT id FROM agents WHERE aiModel='qwen3-32b'
                  ORDER BY RAND() LIMIT 1500
                ) AS t
              );
            "

            echo ""
            echo "=== After ==="
            $MYSQL -t -e "SELECT IFNULL(NULLIF(aiModel,''),'(empty)') AS m, COUNT(*) AS n FROM agents GROUP BY m ORDER BY n DESC;"

            echo ""
            echo "=== Distribution among 506 ASSIGNED agents ==="
            cd /opt/marketing-os/app/skills/ai-talent
            IDS=$(node -e "const d=require('./data/agent-assignments.json'); const ids=new Set(); for(const t of Object.values(d.assignments)) for(const v of Object.values(t)) ids.add(v); console.log([...ids].join(','));")
            $MYSQL -t -e "SELECT aiModel AS m, COUNT(*) AS n FROM agents WHERE id IN ($IDS) GROUP BY m ORDER BY n DESC;"
