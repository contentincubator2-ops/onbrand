name: Admin — Probe caption truncation

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 3
    steps:
      - name: Run
        run: |
          set -e
          AI=/opt/marketing-os/app/skills/ai-talent
          set -a; source "$AI/.env" 2>/dev/null; set +a
          export MYSQL_PWD="${LOCAL_DB_PASSWORD}"
          MYSQL="mysql -h ${LOCAL_DB_HOST:-localhost} -u ${LOCAL_DB_USER:-mos_user} ${LOCAL_DB_NAME:-mos_db}"

          echo "=== Recent 30s Pikmin / Mother's Day outputs ==="
          $MYSQL -e "
            SELECT id, missionId, platform, status,
                   JSON_EXTRACT(metadata, '\$.taskId') AS taskId,
                   JSON_EXTRACT(metadata, '\$.tier') AS tier,
                   createdAt
              FROM mission_outputs
             WHERE createdAt > NOW() - INTERVAL 2 DAY
               AND JSON_EXTRACT(metadata, '\$.tier') = '30s'
             ORDER BY id DESC LIMIT 10
          " -t

          echo ""
          echo "=== Most recent caption content (variant 0) ==="
          $MYSQL -B -N --silent -e "
            SELECT content FROM mission_outputs
             ORDER BY id DESC LIMIT 1
          " | python3 -c "
          import sys, json
          raw = sys.stdin.read()
          try:
            parsed = json.loads(raw)
            if isinstance(parsed, list):
              for i, v in enumerate(parsed[:3]):
                cap = v.get('caption', '')
                print(f'── variant {i} ({len(cap)} chars) ──')
                print(cap)
                print()
                # check for unterminated chinese sentences
                if cap and cap.rstrip()[-1] not in '。！？!?…':
                  print(f'>>> ENDS WITHOUT TERMINATOR: ...{cap[-30:]}')
                print()
          except Exception as e:
            print(f'parse failed: {e}')
            print(raw[:500])
          "
