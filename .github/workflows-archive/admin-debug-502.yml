name: Admin — Debug recent 502 (pm2 errors + restart count)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            echo "════════ pm2 status (uptime + restart count) ════════"
            pm2 status | grep marketing-os

            echo ""
            echo "════════ pm2 last 100 — error / crash / OOM / 502 ════════"
            pm2 logs marketing-os --lines 200 --nostream --raw 2>&1 | grep -iE "error|crash|OOM|killed|restart|exception|sigterm|sigkill|out of memory|aborted" | tail -25

            echo ""
            echo "════════ nginx access log — recent 502s ════════"
            sudo tail -200 /var/log/nginx/access.log 2>&1 | awk '$9 == "502" || $9 == "504" || $9 == "499"' | tail -10

            echo ""
            echo "════════ nginx error log — recent ════════"
            sudo tail -30 /var/log/nginx/error.log 2>&1
