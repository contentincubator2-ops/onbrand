name: Admin — Add drop.sowork.ai to nginx + Let's Encrypt SSL

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 300s
          script: |
            set -e
            echo "════════ STEP 1: VM 公網 IP（你需要在 Cloudflare 加 A record 指到這裡） ════════"
            curl -s ifconfig.me
            echo ""
            echo ""
            echo "════════ STEP 2: 找出現有的 marketing-os nginx 設定 ════════"
            EXISTING=$(sudo grep -rl "marketing-os.sowork.ai" /etc/nginx/sites-available/ /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ 2>/dev/null | head -1)
            if [ -z "$EXISTING" ]; then
              echo "✗ 找不到 marketing-os.sowork.ai 的 nginx 設定。請手動指定路徑。"
              ls -la /etc/nginx/sites-available/ 2>/dev/null
              ls -la /etc/nginx/sites-enabled/ 2>/dev/null
              exit 1
            fi
            echo "找到設定檔：$EXISTING"
            sudo cat "$EXISTING" | head -30

            echo ""
            echo "════════ STEP 3: 把 server_name 從 'marketing-os.sowork.ai' 改成 兩者都收 ════════"
            # 備份
            sudo cp "$EXISTING" "${EXISTING}.bak.$(date +%s)"
            # server_name marketing-os.sowork.ai;  →  server_name marketing-os.sowork.ai drop.sowork.ai;
            # 只改還沒包含 drop.sowork.ai 的行（避免重複跑時連加）
            sudo sed -i '/drop\.sowork\.ai/!s/\(server_name[ \t]*marketing-os\.sowork\.ai\)\([ \t]*;\)/\1 drop.sowork.ai\2/' "$EXISTING"

            echo ""
            echo "── 修改後 server_name 行 ──"
            sudo grep "server_name" "$EXISTING"

            echo ""
            echo "════════ STEP 4: nginx 設定語法檢查 ════════"
            sudo nginx -t

            echo ""
            echo "════════ STEP 5: 申請 Let's Encrypt SSL for drop.sowork.ai ════════"
            # 等 DNS 已經指過來才會成功；如果還沒 propagate，會跳錯，這時你先做 DNS 再重跑這個 workflow。
            if ! command -v certbot &> /dev/null; then
              echo "✗ certbot 沒安裝，跳過 SSL 步驟"
            else
              # --expand 會把 drop.sowork.ai 加進現有的 marketing-os 憑證裡（同一張）
              sudo certbot --nginx --non-interactive --agree-tos \
                --email contentincubator2@gmail.com \
                -d marketing-os.sowork.ai -d drop.sowork.ai \
                --expand 2>&1 | tail -20
            fi

            echo ""
            echo "════════ STEP 6: reload nginx ════════"
            sudo nginx -s reload && echo "✓ nginx reloaded"

            echo ""
            echo "════════ STEP 7: smoke test ════════"
            echo "── HTTP test ──"
            curl -sS -I --max-time 10 -H "Host: drop.sowork.ai" http://localhost/ | head -5
            echo ""
            echo "── HTTPS test (需要 SSL 跟 DNS 都好) ──"
            curl -sS -I --max-time 10 https://drop.sowork.ai/ 2>&1 | head -5 || echo "(若 DNS 還沒 propagate 這個會 fail，正常)"

            echo ""
            echo "════════ DONE ════════"
            echo "如果 STEP 5 失敗（DNS 還沒指過來），先去 Cloudflare 設定 A record 指到上面 STEP 1 的 IP，"
            echo "等 5 分鐘讓 DNS propagate，再重跑這個 workflow。"
