name: Admin — Upgrade Azure Foundry fallback to gpt-5.4-mini

# Probe results 2026-05-12:
#   gpt-5.4-mini  1209ms  "把童年交給木頭，把陪伴留給媽媽"  ← chosen
#   gpt-5.4       1556ms  "把陪伴雕成時光"                  ← reserve for high-stakes
#   gpt-4.1-mini  1235ms  "讓愛在每一塊木頭間細膩發芽"        ← previous default
#
# Code already handles gpt-5*'s max_completion_tokens requirement via
# adaptPayloadForModel() — no source change needed.

on:
  workflow_dispatch:

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 30s
          script: |
            set -e
            ENV=/opt/marketing-os/app/skills/ai-talent/.env
            cp "$ENV" "${ENV}.bak.$(date +%s)"

            upsert() {
              local K="$1"; local V="$2"
              if grep -qE "^${K}=" "$ENV"; then
                sed -i "s|^${K}=.*|${K}=${V}|" "$ENV"
                echo "  ↻ $K = $V"
              else
                echo "${K}=${V}" >> "$ENV"
                echo "  + $K = $V"
              fi
            }

            upsert AZURE_FOUNDRY_FALLBACK_MODEL "gpt-5.4-mini"
            upsert AZURE_FOUNDRY_MODEL          "gpt-5.4-mini"

            pm2 restart marketing-os --update-env 2>&1 | tail -3 || true
            echo "✓ Done"
