name: Admin — Snapshot taxonomy

on:
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 90s
          script: |
            set +e
            export MYSQL_PWD="mos_secure_2026"
            MYSQL="mysql -h localhost -u mos_user mos_db -B -N --silent"

            echo "=== Total counts ==="
            echo "squads (active+approved): $($MYSQL -e 'SELECT COUNT(*) FROM squads WHERE is_active=1 AND is_approved=1')"
            echo "squads (active total):    $($MYSQL -e 'SELECT COUNT(*) FROM squads WHERE is_active=1')"
            echo "squads (all rows):        $($MYSQL -e 'SELECT COUNT(*) FROM squads')"
            echo "agents (available):       $($MYSQL -e 'SELECT COUNT(*) FROM agents WHERE isAvailable=1')"
            echo "agents (all rows):        $($MYSQL -e 'SELECT COUNT(*) FROM agents')"
            echo "skill_catalog rows:       $($MYSQL -e 'SELECT COUNT(*) FROM skill_catalog' 2>/dev/null)"

            echo ""
            echo "=== Squads by workspace ==="
            $MYSQL -e "SELECT workspace, COUNT(*) AS n FROM squads WHERE is_active=1 AND is_approved=1 GROUP BY workspace ORDER BY n DESC LIMIT 20"

            echo ""
            echo "=== Squads by strategy_layer ==="
            $MYSQL -e "SELECT strategy_layer, COUNT(*) AS n FROM squads WHERE is_active=1 AND is_approved=1 GROUP BY strategy_layer ORDER BY n DESC"

            echo ""
            echo "=== Squads by missionType (top 25) ==="
            $MYSQL -e "SELECT missionType, COUNT(*) AS n FROM squads WHERE is_active=1 AND is_approved=1 AND missionType IS NOT NULL GROUP BY missionType ORDER BY n DESC LIMIT 25"

            echo ""
            echo "=== Agents by primarySkill (top 30) ==="
            $MYSQL -e "SELECT primarySkill, COUNT(*) AS n FROM agents WHERE isAvailable=1 AND primarySkill IS NOT NULL GROUP BY primarySkill ORDER BY n DESC LIMIT 30"

            echo ""
            echo "=== Agents by layer ==="
            $MYSQL -e "SELECT layer, COUNT(*) AS n FROM agents WHERE isAvailable=1 GROUP BY layer ORDER BY n DESC"

            echo ""
            echo "=== Skill catalog by category (top 30) ==="
            $MYSQL -e "SELECT category, COUNT(*) AS n FROM skill_catalog WHERE category IS NOT NULL GROUP BY category ORDER BY n DESC LIMIT 30" 2>/dev/null

            echo ""
            echo "=== Most-used squads (last 30 days) ==="
            $MYSQL -e "SELECT s.slug AS slug, COUNT(m.id) AS missions FROM squads s LEFT JOIN missions m ON m.squadSlug = s.slug AND m.createdAt > DATE_SUB(NOW(), INTERVAL 30 DAY) WHERE s.is_active=1 AND s.is_approved=1 GROUP BY s.slug ORDER BY missions DESC LIMIT 25"

            echo ""
            echo "=== Squads NEVER used (zero missions ever) ==="
            $MYSQL -e "SELECT COUNT(*) FROM squads s LEFT JOIN missions m ON m.squadSlug = s.slug WHERE s.is_active=1 AND s.is_approved=1 AND m.id IS NULL"

            echo ""
            echo "=== Done ==="
