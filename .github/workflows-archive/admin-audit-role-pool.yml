name: Admin — Audit role pool (image dirs / strategists / specialty)

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 90s
          script: |
            export MYSQL_PWD="${LOCAL_DB_PASSWORD}"
            MYSQLT="mysql -h localhost -u mos_user mos_db -t"

            echo "=== A. Visual / image director pool (designers, art dirs) ==="
            $MYSQLT -e "
              SELECT id, name, title, primarySkill,
                CHAR_LENGTH(IFNULL(bio,'')) bio
              FROM agents
              WHERE isAvailable=1 AND reviewStatus='approved'
                AND (
                  LOWER(title) LIKE '%design%'
                  OR LOWER(title) LIKE '%art%direct%'
                  OR LOWER(title) LIKE '%visual%'
                  OR LOWER(title) LIKE '%creative direct%'
                  OR LOWER(title) LIKE '%motion graphic%'
                  OR LOWER(title) LIKE '%illustrator%'
                  OR LOWER(primarySkill) LIKE '%visual%'
                  OR LOWER(primarySkill) LIKE '%design%'
                  OR LOWER(primarySkill) LIKE '%brand-identity%'
                )
              ORDER BY (CHAR_LENGTH(IFNULL(bio,'')) + CHAR_LENGTH(IFNULL(specialty,''))) DESC
              LIMIT 40"

            echo ""
            echo "=== B. Strategist pool (planners, strategists, framework experts) ==="
            $MYSQLT -e "
              SELECT id, name, title, primarySkill
              FROM agents
              WHERE isAvailable=1 AND reviewStatus='approved'
                AND (
                  LOWER(title) LIKE '%strateg%'
                  OR LOWER(title) LIKE '%planner%'
                  OR LOWER(title) LIKE '%architect%'
                  OR LOWER(primarySkill) LIKE '%strateg%'
                  OR LOWER(primarySkill) LIKE '%planning%'
                )
                AND id NOT IN (180142, 60007, 220863, 180030, 232765, 90011, 31, 220754, 180006)
              ORDER BY id LIMIT 50"

            echo ""
            echo "=== C. Specialty / domain expert pool (legal / timing / compare reviewers) ==="
            $MYSQLT -e "
              SELECT id, name, title, primarySkill
              FROM agents
              WHERE isAvailable=1 AND reviewStatus='approved'
                AND (
                  LOWER(title) LIKE '%legal%'
                  OR LOWER(title) LIKE '%compliance%'
                  OR LOWER(title) LIKE '%timing%'
                  OR LOWER(title) LIKE '%trend%'
                  OR LOWER(title) LIKE '%benchmark%'
                  OR LOWER(title) LIKE '%review%'
                  OR LOWER(title) LIKE '%qa%'
                  OR LOWER(title) LIKE '%quality%'
                  OR LOWER(primarySkill) LIKE '%legal%'
                  OR LOWER(primarySkill) LIKE '%benchmark%'
                  OR LOWER(primarySkill) LIKE '%compliance%'
                )
                AND id NOT IN (220504, 180855, 220959)
              ORDER BY id LIMIT 30"

            echo "=== Done ==="
