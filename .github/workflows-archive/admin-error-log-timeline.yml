name: Admin — Error log timeline (when did crashes stop?)

on:
  workflow_dispatch:

jobs:
  timeline:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            ERR=~/.pm2/logs/marketing-os-error.log
            OUT=~/.pm2/logs/marketing-os-out.log

            echo "════ Timestamps from error log (sample) ════"
            # PM2 log entries don't have timestamps by default — but we can stat the file
            stat "$ERR" 2>&1 | grep -E "Modify|Size"
            echo ""

            echo "════ Stdout LAST 3 startup events ════"
            # Find the last 3 occurrences of '.env candidate paths checked' (B-03 marker)
            grep -n ".env candidate paths checked" "$OUT" 2>/dev/null | tail -3
            echo ""

            echo "════ Stdout LAST 3 'JWT_SECRET loaded:' events ════"
            grep -n "JWT_SECRET loaded:" "$OUT" 2>/dev/null | tail -3
            echo ""

            echo "════ Total count of B-03 startup events (should = restart count after B-03) ════"
            grep -c ".env candidate paths checked" "$OUT" 2>/dev/null

            echo ""
            echo "════ Recent stdout — last 30 lines ════"
            tail -30 "$OUT" 2>/dev/null

            echo ""
            echo "════ Recent error log — last 20 lines ════"
            tail -20 "$ERR" 2>/dev/null

            echo ""
            echo "════ Current PM2 status ════"
            pm2 jlist 2>/dev/null | python3 -c "
            import sys, json, time
            data = json.loads(sys.stdin.read())
            for p in data:
                if p['name'] == 'marketing-os':
                    age_s = (time.time() * 1000 - p['pm2_env']['pm_uptime']) / 1000
                    print(f'  pid={p[\"pid\"]}  age={age_s:.0f}s  restarts={p[\"pm2_env\"][\"restart_time\"]}')
            " 2>/dev/null
