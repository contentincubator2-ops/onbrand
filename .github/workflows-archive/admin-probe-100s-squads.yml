name: Admin — Probe 18 100s squads with 桂冠 brand
on:
  workflow_dispatch:
    inputs:
      brand_keyword:
        description: "Brand to probe with (default 桂冠)"
        required: false
        type: string
        default: "桂冠"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 120s
          script: |
            export MYSQL_PWD="${LOCAL_DB_PASSWORD}"

            cat > /tmp/probe.sql <<'SQL'
            SELECT '=== 桂冠 brand row ===' AS step;
            SELECT id, name, industry FROM brands WHERE name LIKE '%桂冠%' OR name LIKE '%Laurel%' LIMIT 3;

            SELECT '=== 18 100s squad readiness check ===' AS step;
            SELECT
              s.slug,
              s.is_active,
              IF(JSON_VALID(s.agents), JSON_LENGTH(s.agents), 0) AS agents_count,
              IF(JSON_VALID(s.steps),  JSON_LENGTH(s.steps),  0) AS steps_count,
              a.name AS lead_name,
              a.title AS lead_title,
              CHAR_LENGTH(s.methodology) AS methodology_chars
            FROM squads s
            LEFT JOIN agents a ON a.id = s.lead_agent_id
            WHERE s.slug IN (
              'fb-monthly-calendar-pulizzi','fb-monthly-calendar-product-promo',
              'fb-garyvee-jab-hook','fb-countdown-series','fb-account-reposition',
              'fb-quarterly-strategy','fb-monthly-analytics','fb-deiss-cvo',
              'fb-hormozi-offer-first','fb-kennedy-magnetic','fb-kern-mass-control',
              'ig-monthly-calendar-pulizzi','ig-baer-youtility','ig-chrisdo-visual-story',
              'ig-fanzo-live-first','ig-garyvee-document','ig-hollis-radical-transparency',
              'ig-hormozi-save-worthy'
            )
            ORDER BY s.slug;

            SELECT '=== Step agent resolution per squad (any step missing agentId?) ===' AS step;
            SELECT
              s.slug,
              JSON_LENGTH(s.steps) AS total_steps,
              (SELECT COUNT(*) FROM JSON_TABLE(s.steps, '$[*]' COLUMNS(
                aid INT PATH '$.assignedAgentId'
              )) AS jt WHERE jt.aid IS NULL) AS missing_agent_steps
            FROM squads s
            WHERE s.slug IN (
              'fb-monthly-calendar-pulizzi','fb-monthly-calendar-product-promo',
              'fb-garyvee-jab-hook','fb-countdown-series','fb-account-reposition',
              'fb-quarterly-strategy','fb-monthly-analytics','fb-deiss-cvo',
              'fb-hormozi-offer-first','fb-kennedy-magnetic','fb-kern-mass-control',
              'ig-monthly-calendar-pulizzi','ig-baer-youtility','ig-chrisdo-visual-story',
              'ig-fanzo-live-first','ig-garyvee-document','ig-hollis-radical-transparency',
              'ig-hormozi-save-worthy'
            )
            ORDER BY s.slug;
            SQL
            mysql -h localhost -u mos_user mos_db < /tmp/probe.sql 2>&1

            echo ""
            echo "=== TS-side: try running squad step-1 (mock mission) for each ==="
            cd /opt/marketing-os/app/skills/ai-talent
            set -a
            . ./.env
            set +a

            cat > /opt/marketing-os/app/skills/ai-talent/probe-squads-tmp.ts <<'TS'
            // Probe scout for 桂冠 brand — does real market data come back?
            import localPool from "./server/localDb";
            import { ALL_100S_SQUADS } from "./server/_core/quickTask100Squads";
            import { fetchViralPatterns } from "./server/_core/socialListeningScout";

            (async () => {
              // Find 桂冠 brand id
              const [brandRows]: any = await localPool.execute(
                `SELECT id, name, industry FROM brands WHERE name LIKE '%桂冠%' LIMIT 1`,
              );
              const brand = (brandRows as any[])?.[0];
              console.log("\n--- Brand resolved ---");
              console.log(brand ? `id=${brand.id} name=${brand.name} industry=${brand.industry}` : "❌ 桂冠 brand NOT FOUND");
              if (!brand) process.exit(1);

              console.log("\n--- 18 squads: structural readiness ---");
              let pass = 0, fail = 0;
              const fails: string[] = [];
              for (const entry of ALL_100S_SQUADS) {
                const [rows]: any = await localPool.execute(
                  `SELECT slug, is_active, agents, steps, lead_agent_id, methodology
                     FROM squads WHERE slug = ? LIMIT 1`,
                  [entry.squad_slug],
                );
                const sq = (rows as any[])?.[0];
                if (!sq) { fails.push(`${entry.squad_slug}: NOT FOUND`); fail++; continue; }
                if (!sq.is_active) { fails.push(`${entry.squad_slug}: inactive`); fail++; continue; }
                let agents: any[] = [];
                let steps: any[] = [];
                try { agents = typeof sq.agents === "string" ? JSON.parse(sq.agents) : sq.agents; } catch {}
                try { steps = typeof sq.steps === "string" ? JSON.parse(sq.steps) : sq.steps; } catch {}
                if (!Array.isArray(agents) || agents.length === 0) { fails.push(`${entry.squad_slug}: no agents`); fail++; continue; }
                if (!Array.isArray(steps) || steps.length === 0) { fails.push(`${entry.squad_slug}: no steps`); fail++; continue; }
                if (!sq.lead_agent_id) { fails.push(`${entry.squad_slug}: no lead`); fail++; continue; }
                console.log(`✓ ${entry.squad_slug}  agents=${agents.length} steps=${steps.length} methodology=${sq.methodology ? "yes" : "—"}`);
                pass++;
              }
              console.log(`\n--- Structural: ${pass} pass / ${fail} fail ---`);
              if (fails.length) console.log("Failures:", fails.join("; "));

              console.log("\n--- 市場數據 (real-time scout) — 1 sample fetch ---");
              try {
                const sample = await fetchViralPatterns({
                  channel: "facebook",
                  topic: `${brand.name} 月行事曆 健康冷凍食品`,
                  industry: brand.industry,
                  brandId: brand.id,
                  kind: "festivals",
                });
                if (sample && sample.patterns.length > 0) {
                  console.log(`✓ Scout 抓回 ${sample.patterns.length} 條真實資料：`);
                  for (const p of sample.patterns.slice(0, 3)) {
                    console.log(`  - 【${p.source}】${p.title}`);
                  }
                } else {
                  console.log("⚠ Scout 沒抓到資料（可能 API key 未配置）— squads 仍可跑，但無真實市場數據注入");
                }
              } catch (e: any) {
                console.log(`✗ Scout error: ${e?.message ?? e}`);
              }

              console.log("\n--- ⚠️ 重要：100s squads 跑時是否有 scout 注入？ ---");
              console.log("目前狀態：100s squads 走 squad.stepExecute pipeline（每個 step 一個 LLM call），");
              console.log("並沒有 hook 串到 scout — 跟 60s tier 的 orchestra 不同。");
              console.log("結果：squad 用 LLM 內建知識產出（沒 real-time 市場數據）。");
              console.log("Phase 2 待辦：在 stepExecute step-0 自動跑 scout，把節慶/熱點注入後續 step 的 prompt。");
            })().catch((e) => { console.error("probe crashed:", e?.message ?? e); process.exit(1); });
            TS
            cd /opt/marketing-os/app/skills/ai-talent
            npx tsx ./probe-squads-tmp.ts 2>&1
            rm -f ./probe-squads-tmp.ts
