name: Admin — Fix nginx /trpc proxy_read_timeout (600s)

# Long-running tasks (YT 6-episode production pack, theater 99s, full
# positioning runs) take 90-180s. Default nginx proxy_read_timeout is 60s,
# so the proxy returns HTML 502/504 → frontend shows "伺服器忙碌（502）".
#
# This patches nginx's /trpc/ location block to allow 600s reads.
# Idempotent — skips if already patched.

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            set -e

            SITE=/etc/nginx/sites-enabled/marketing-os
            if [ ! -f "$SITE" ]; then SITE=/etc/nginx/sites-available/marketing-os; fi
            if [ ! -f "$SITE" ]; then
              # Find any nginx config that proxies to marketing-os
              CANDIDATE=$(sudo grep -lrE "proxy_pass.*localhost:3101|proxy_pass.*127.0.0.1:3101" /etc/nginx/ 2>/dev/null | head -1)
              if [ -n "$CANDIDATE" ]; then SITE="$CANDIDATE"; fi
            fi
            if [ ! -f "$SITE" ]; then
              echo "✗ marketing-os nginx site not found"
              sudo ls /etc/nginx/sites-enabled/ /etc/nginx/sites-available/ 2>&1 | head -20
              exit 1
            fi
            echo "Patching: $SITE"

            sudo cp "$SITE" "${SITE}.bak.$(date +%s)"

            echo
            echo "── current /trpc/ block ─────"
            sudo awk '/location \/trpc\/ \{/,/\}/' "$SITE" | head -20

            if sudo grep -q "proxy_read_timeout 600s" "$SITE"; then
              echo
              echo "✓ Already patched, no-op."
              exit 0
            fi

            # Insert timeout directives inside the /trpc/ location block.
            sudo sed -i '/location \/trpc\/ {/a\        proxy_read_timeout 600s;\n        proxy_send_timeout 600s;\n        proxy_connect_timeout 60s;\n        client_max_body_size 50m;' "$SITE"

            echo
            echo "── after patch ─────"
            sudo awk '/location \/trpc\/ \{/,/\}/' "$SITE" | head -20

            echo
            sudo nginx -t 2>&1 | tail -5
            sudo systemctl reload nginx
            echo "✓ nginx reloaded with 600s timeout"
