name: Admin — Check what listens on ports

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 2
    steps:
      - run: |
          set -e
          echo "── Listening TCP ports ──"
          sudo ss -tlnp 2>/dev/null | grep -E ":(3000|3001|3100|3101|3200) " || ss -tln | head -20

          echo ""
          echo "── pm2 list ──"
          pm2 list

          echo ""
          echo "── localhost:3000 / ──"
          curl -s "http://localhost:3000/" -w "  http=%{http_code} size=%{size_download}\n" -o /dev/null

          echo ""
          echo "── localhost:3101 / ──"
          curl -s "http://localhost:3101/" -w "  http=%{http_code} size=%{size_download}\n" -o /dev/null
