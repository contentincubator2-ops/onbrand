name: Admin — DB Migrate Steps (Phase A.2)

# Phase A.2: Migrate steps data from squad_template to squads
# + Fill Dunford 10-step canonical workflow

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type MIGRATE to proceed'
        required: true
        type: string

jobs:
  migrate:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'MIGRATE'
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e
            MOS_USER="mos_user"
            MOS_PASS="mos_secure_2026"
            MOS_DB="mos_db"

            echo "=== Step 1: Check current state ==="
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
              SELECT 'Total squads' as metric, COUNT(*) as value FROM squads
              UNION ALL
              SELECT 'squads with steps already', COUNT(*) FROM squads WHERE steps IS NOT NULL AND JSON_LENGTH(steps) > 0
              UNION ALL
              SELECT 'squad_template rows', COUNT(*) FROM squad_template
              UNION ALL
              SELECT 'squad_template with steps', COUNT(*) FROM squad_template WHERE steps IS NOT NULL;
            " 2>&1

            echo ""
            echo "=== Step 2: Migrate steps from squad_template to squads ==="
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
              UPDATE squads s
              INNER JOIN squad_template t ON t.taskType = s.missionType AND t.isActive = 1
              SET s.steps = t.steps
              WHERE (s.steps IS NULL OR JSON_LENGTH(s.steps) = 0);
            " 2>&1
            echo "✅ Steps migrated from squad_template to squads"

            echo ""
            echo "=== Step 3: Verify migration ==="
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
              SELECT JSON_LENGTH(steps) as step_count, COUNT(*) as squads
              FROM squads
              WHERE steps IS NOT NULL
              GROUP BY JSON_LENGTH(steps)
              ORDER BY step_count;
            " 2>&1

            echo ""
            echo "=== Step 4: Backfill Dunford 10-step canonical workflow ==="

            # Write Dunford 10 steps JSON
            cat > /tmp/dunford_10.json << 'JSONEOF'
            [{"order":1,"name":"理解熱愛你產品的客戶","description":"深度訪談 5-8 位最愛這產品的客戶，找出他們真正選擇的原因 — 這些是定位的真實錨點。","outputType":"customer_love_insights","requiredSkills":["brand-dna","market-research-agent"],"assignedAgentId":26,"assignedAgentSlug":"pm-meta-ads-expert","assignedAgentName":"吳佳穎"},{"order":2,"name":"組建定位團隊","description":"組建跨部門定位團隊（Product、Marketing、Sales、CS），確保多元觀點融合、避免行銷部門孤立決策。","outputType":"positioning_team_roster","requiredSkills":["mbb-strategist","brand-dna"],"assignedAgentId":25,"assignedAgentSlug":"pm-seo-ecommerce","assignedAgentName":"李承翰"},{"order":3,"name":"對齊願景、揭露偏見","description":"與團隊對齊品牌願景，揭露內部偏見（如『我們是更便宜的 X』），清空既定認知以便重新定位。","outputType":"vision_bias_audit","requiredSkills":["mbb-strategist","brand-dna"],"assignedAgentId":25,"assignedAgentSlug":"pm-seo-ecommerce","assignedAgentName":"李承翰"},{"order":4,"name":"盤點競爭替代選項","description":"找出客戶在沒有你產品時會用什麼 — 這些是真實競爭替代品（含人工執行、Excel、其他工具），不只是同類產品。","outputType":"competitive_audit","requiredSkills":["brand-dna","mbb-strategist"],"assignedAgentId":25,"assignedAgentSlug":"pm-seo-ecommerce","assignedAgentName":"李承翰"},{"order":5,"name":"識別獨特屬性","description":"列出真正獨特的屬性（不是功能）。這些屬性必須是競爭替代品缺乏、且為客戶在意的能力。","outputType":"unique_attributes","requiredSkills":["market-research-agent","marketing-analytics"],"assignedAgentId":26,"assignedAgentSlug":"pm-meta-ads-expert","assignedAgentName":"吳佳穎"},{"order":6,"name":"映射屬性到顧客價值","description":"將每個獨特屬性映射到可驗證的客戶價值，並指出這個價值對誰最重要。","outputType":"value_mapping","requiredSkills":["market-research-agent","marketing-analytics"],"assignedAgentId":26,"assignedAgentSlug":"pm-meta-ads-expert","assignedAgentName":"吳佳穎"},{"order":7,"name":"定義最佳契合客戶","description":"精確刻畫最佳契合客戶的特徵（ICP），使他們一眼認出你是為他們設計。用 MEDDIC 驗證。","outputType":"ideal_customer_profile","requiredSkills":["market-research-agent","brand-dna"],"assignedAgentId":26,"assignedAgentSlug":"pm-meta-ads-expert","assignedAgentName":"吳佳穎"},{"order":8,"name":"釘牢市場分類","description":"選擇最能凸顯價值的市場分類（避免紅海陷阱，必要時創造新品類）。分類決定客戶如何理解你。","outputType":"market_category","requiredSkills":["copywriting-pro","hook-copywriter"],"assignedAgentId":29,"assignedAgentSlug":"pm-pr-saas","assignedAgentName":"蘇雅玲"},{"order":9,"name":"疊加趨勢加分","description":"疊加相關宏觀趨勢（AI 浪潮、遠端工作、永續），讓定位乘風而起。可選但強化共鳴。","outputType":"trend_overlay","requiredSkills":["content-marketing","social-media-marketing"],"assignedAgentId":32,"assignedAgentSlug":"exec-copywriter-senior","assignedAgentName":"許雅芳"},{"order":10,"name":"定位宣言與組織固化","description":"撰寫精準定位宣言（For/Who/Is/That/Unlike/Our Product），制定視覺識別、Sales Enablement、內容策略。","outputType":"positioning_statement_and_gtm","requiredSkills":["copywriting-pro","brand-identity","visual-content-creator"],"assignedAgentId":29,"assignedAgentSlug":"pm-pr-saas","assignedAgentName":"蘇雅玲"}]
            JSONEOF

            # Use stdin to avoid shell escape issues
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" << MYSQLEOF
            SET @steps_json = LOAD_FILE('/tmp/dunford_10.json');
            UPDATE squads SET steps = (SELECT CAST(LOAD_FILE('/tmp/dunford_10.json') AS CHAR))
            WHERE slug = 'brand-dunford-positioning';
            MYSQLEOF

            # Fallback: if LOAD_FILE returns NULL (no FILE privilege), use direct JSON
            DUNFORD_STEPS=$(cat /tmp/dunford_10.json)
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
              UPDATE squads SET steps = '$DUNFORD_STEPS'
              WHERE slug = 'brand-dunford-positioning' AND (steps IS NULL OR JSON_LENGTH(steps) < 10);
            " 2>&1

            echo ""
            echo "=== Step 5: Verify Dunford ==="
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
              SELECT slug, JSON_LENGTH(steps) as step_count
              FROM squads
              WHERE slug='brand-dunford-positioning';
            " 2>&1

            echo ""
            echo "✅ Phase A.2 Data migration complete"
