name: Admin — Verify VM state

# Run after consolidation to confirm:
# - Only ONE PM2 process running (marketing-os from /opt/marketing-os/app)
# - Site responds correctly
# - Old split repos are no longer serving traffic

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            APP=/opt/marketing-os/app
            AI=$APP/skills/ai-talent

            echo "===== PM2 processes (should be exactly 1: marketing-os) ====="
            pm2 list

            echo ""
            echo "===== Active version info ====="
            echo "Commit: $(cd $APP && git log --oneline -1 2>/dev/null || echo 'NOT FOUND')"
            echo "Frontend build: $(stat -c '%y' $AI/public/index.html 2>/dev/null || echo 'NOT FOUND')"
            echo "Backend process CWD: $(pm2 info marketing-os 2>/dev/null | grep 'exec cwd' | head -1 || echo 'unknown')"

            echo ""
            echo "===== Health check ====="
            curl -s -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:3101/health

            echo ""
            echo "===== Port 3101 listener ====="
            ss -tlnp | grep 3101

            echo ""
            echo "===== Old split repos still exist? (should be yes, not yet deleted) ====="
            ls /opt/marketing-os/ 2>/dev/null
