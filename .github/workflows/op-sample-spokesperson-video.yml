name: "Op — Build ONE sample spokesperson TikTok video (2 paths, compare quality)"

on:
  workflow_dispatch:
    inputs:
      brand_id:
        description: "Brand id to build the sample for (2964 = 媽爹講故事)"
        required: true
        default: "2964"
        type: string
      topic:
        description: "TikTok topic / angle (leave blank to let AI pick from positioning)"
        required: false
        type: string

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Generate sample spokesperson video on VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          SAMPLE_BRAND_ID: ${{ inputs.brand_id }}
          SAMPLE_TOPIC: ${{ inputs.topic }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 27m
          envs: SAMPLE_BRAND_ID,SAMPLE_TOPIC
          script: |
            set -e
            cd /opt/onbrand/app/skills/ai-talent

            cat > tmp-sample-video.ts <<'SCRIPT_EOF'
            import { writeFileSync } from "fs";
            import { join } from "path";
            import localPool from "./server/localDb";
            import { invokeLLM } from "./server/_core/llm";

            const COVERS_DIR = process.env.COVERS_DIR ?? "/opt/onbrand/covers";
            const PUBLIC_BASE = "https://onbrand.sowork.ai";
            const BRAND_ID = Number(process.env.SAMPLE_BRAND_ID ?? 2964);
            const TOPIC = (process.env.SAMPLE_TOPIC ?? "").trim();
            const PIAPI_KEY = process.env.PIAPI_KEY ?? process.env.PIAPI_API_KEY ?? "";
            const GEMINI_KEY = process.env.GEMINI_API_KEY ?? process.env.GOOGLE_AI_API_KEY ?? process.env.GOOGLE_API_KEY ?? "";
            const PIAPI_BASE = "https://api.piapi.ai/api/v1";

            function saveBuf(buf: Buffer, ext: string): string {
              const id = `sample-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
              writeFileSync(join(COVERS_DIR, `media-${id}.${ext}`), buf);
              return `${PUBLIC_BASE}/static/covers/media-${id}.${ext}`;
            }
            async function rehost(url: string, ext: string): Promise<string> {
              const r = await fetch(url);
              if (!r.ok) throw new Error(`rehost ${r.status}`);
              return saveBuf(Buffer.from(await r.arrayBuffer()), ext);
            }
            async function piapiSubmit(model: string, task_type: string, input: any): Promise<string> {
              const r = await fetch(`${PIAPI_BASE}/task`, {
                method: "POST",
                headers: { "x-api-key": PIAPI_KEY, "Content-Type": "application/json" },
                body: JSON.stringify({ model, task_type, input }),
              });
              const t = await r.text();
              console.log(`[submit ${model}/${task_type}] HTTP ${r.status}: ${t.slice(0, 400)}`);
              if (!r.ok) throw new Error(`piapi submit ${r.status}: ${t.slice(0, 300)}`);
              const d = JSON.parse(t);
              const id = d?.data?.task_id ?? d?.task_id;
              if (!id) throw new Error(`no task_id: ${t.slice(0, 300)}`);
              return id;
            }
            async function piapiPoll(taskId: string, maxMs: number, tag: string): Promise<any> {
              const start = Date.now();
              while (Date.now() - start < maxMs) {
                await new Promise((r) => setTimeout(r, 12_000));
                const r = await fetch(`${PIAPI_BASE}/task/${taskId}`, { headers: { "x-api-key": PIAPI_KEY } });
                const d: any = await r.json();
                const st = d?.data?.status ?? d?.status;
                console.log(`  [${tag}] ${st} (${Math.round((Date.now() - start) / 1000)}s)`);
                if (st === "completed" || st === "success") return d?.data ?? d;
                if (st === "failed" || st === "error") throw new Error(`${tag} failed: ${JSON.stringify(d).slice(0, 400)}`);
              }
              throw new Error(`${tag} poll timeout`);
            }
            function pcmToWav(pcm: Buffer, sampleRate = 24000, channels = 1, bits = 16): Buffer {
              const hdr = Buffer.alloc(44);
              hdr.write("RIFF", 0);
              hdr.writeUInt32LE(36 + pcm.length, 4);
              hdr.write("WAVE", 8);
              hdr.write("fmt ", 12);
              hdr.writeUInt32LE(16, 16);
              hdr.writeUInt16LE(1, 20);
              hdr.writeUInt16LE(channels, 22);
              hdr.writeUInt32LE(sampleRate, 24);
              hdr.writeUInt32LE((sampleRate * channels * bits) / 8, 28);
              hdr.writeUInt16LE((channels * bits) / 8, 32);
              hdr.writeUInt16LE(bits, 34);
              hdr.write("data", 36);
              hdr.writeUInt32LE(pcm.length, 40);
              return Buffer.concat([hdr, pcm]);
            }

            (async () => {
              console.log("=========== STEP 0: keys ===========");
              console.log("PIAPI_KEY:", PIAPI_KEY ? "present" : "MISSING");
              console.log("GEMINI_API_KEY:", GEMINI_KEY ? "present" : "MISSING");
              if (!PIAPI_KEY || !GEMINI_KEY) throw new Error("required keys missing");

              console.log("=========== STEP 1: brand positioning ===========");
              const [rows]: any = await localPool.execute(
                "SELECT name, industry, targetAudience, tagline, positioning FROM brands WHERE id = ? LIMIT 1",
                [BRAND_ID],
              );
              const brand = (rows as any[])[0];
              if (!brand) throw new Error(`brand ${BRAND_ID} not found`);
              let pos: any = brand.positioning;
              if (typeof pos === "string") { try { pos = JSON.parse(pos); } catch { pos = {}; } }
              pos = pos ?? {};
              console.log("brand:", brand.name, "| tagline:", brand.tagline);

              const ground = [
                `品牌：${brand.name}`,
                `產業：${brand.industry ?? ""}`,
                `標語：${brand.tagline ?? pos?.tagline?.zhTagline ?? ""}`,
                `主受眾：${String(pos?.audience?.primary ?? brand.targetAudience ?? "").slice(0, 400)}`,
                `差異化：${String(pos?.differentiation?.summary ?? "").slice(0, 300)}`,
                `黃金圈 WHY：${String(pos?.goldenCircle?.why ?? "").slice(0, 300)}`,
              ].join("\n");

              console.log("=========== STEP 2: LLM script (the P0 fix) ===========");
              const sys = [
                "你是 TikTok 短影音編劇，繁體中文台灣用語。產出一支「品牌代言人對鏡頭說話」的短影音腳本。只輸出 JSON，第一字元就是 {。",
                "",
                "規則：",
                "- 全片只有一個人對鏡頭講話，沒有換場。",
                "- 第一句就要抓住人，不要用「大家好」「今天要跟大家分享」這種開場。",
                "- shortVO 必須是 38-45 個中文字（唸出來約 9-10 秒）。這是完整可獨立成立的一支廣告：一句鉤子 + 一句價值 + 品牌名。",
                "- 必須貼合下面的品牌定位，不可發明定位書沒有的主張。",
                "- spokespersonPrompt 用英文描述代言人外觀（給 AI 生圖用）：正面、直視鏡頭、清晰臉部、直式人像。",
                "",
                "輸出 JSON：",
                '{"hook":"第一句（≤15字）","shortVO":"38-45字的完整口播稿，會被直接唸出來，不要有任何標記、括號或旁白說明","subtitleLines":["字幕行（每行6-12字）"],"spokespersonPrompt":"English description of the on-camera presenter"}',
                "subtitleLines 4-6 行，合起來等於 shortVO。",
              ].join("\n");

              const userMsg = TOPIC ? `${ground}\n\n這次要講的題目：${TOPIC}` : `${ground}\n\n請自己從定位裡挑一個最適合 TikTok 的切角。`;
              const llm = await invokeLLM({
                messages: [{ role: "system", content: sys }, { role: "user", content: userMsg }],
                maxTokens: 1000,
              });
              const raw = String(llm.choices[0]?.message?.content ?? "");
              const m = raw.match(/```(?:json)?\s*([\s\S]*?)```/);
              const jt = m ? m[1]!.trim() : raw.trim();
              let script: any;
              try { script = JSON.parse(jt); } catch { script = JSON.parse(jt.slice(jt.indexOf("{"))); }
              console.log(JSON.stringify(script, null, 2));
              if (!script?.shortVO) throw new Error("script parse failed");
              console.log("VO length (chars):", String(script.shortVO).length);

              console.log("=========== STEP 3: spokesperson portrait (Flux, synthetic) ===========");
              const imgTask = await piapiSubmit("Qubico/flux1-dev", "txt2img", {
                prompt: `${script.spokespersonPrompt}. Vertical portrait, facing camera directly, centered face, mouth clearly visible, natural warm lighting, photorealistic, 50mm, clean simple background, no text, no watermark`.slice(0, 800),
                negative_prompt: "text, watermark, logo, caption, subtitles, letters, multiple people, side profile, looking away, blurry face, distorted face, hands covering face",
                width: 768,
                height: 1344,
              });
              const imgData = await piapiPoll(imgTask, 6 * 60_000, "flux");
              const rawImg = imgData?.output?.image_url ?? imgData?.output?.image_urls?.[0] ?? imgData?.output?.url;
              if (!rawImg) throw new Error(`no image url: ${JSON.stringify(imgData).slice(0, 400)}`);
              const imageUrl = await rehost(rawImg, "png");
              console.log("PORTRAIT:", imageUrl);

              console.log("=========== STEP 4: Gemini TTS ===========");
              const gres = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${GEMINI_KEY}`,
                {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({
                    contents: [{ parts: [{ text: `請用溫暖、真誠、像爸爸在跟孩子說話的語氣，念出這段話：\n\n${script.shortVO}` }] }],
                    generationConfig: {
                      responseModalities: ["AUDIO"],
                      speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Charon" } } },
                    },
                  }),
                },
              );
              if (!gres.ok) throw new Error(`Gemini TTS ${gres.status}: ${(await gres.text()).slice(0, 300)}`);
              const gjson: any = await gres.json();
              const b64 = gjson?.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
              if (!b64) throw new Error(`Gemini TTS no audio: ${JSON.stringify(gjson).slice(0, 300)}`);
              const audioUrl = saveBuf(pcmToWav(Buffer.from(b64, "base64")), "wav");
              console.log("VOICEOVER:", audioUrl);

              console.log("=========== STEP 5: two paths in parallel ===========");

              const pathA = (async () => {
                const i2v = await piapiSubmit("kling", "video_generation", {
                  prompt: "The person is talking to the camera, speaking naturally with clear mouth movement, subtle head motion, warm sincere expression. Static camera, no scene change.",
                  negative_prompt: "text, subtitles, watermark, scene change, multiple people",
                  image_url: imageUrl,
                  duration: 10,
                  aspect_ratio: "9:16",
                  version: "1.6",
                  mode: "std",
                });
                const i2vData = await piapiPoll(i2v, 12 * 60_000, "kling-i2v");
                const baseVid = i2vData?.output?.video_url ?? i2vData?.output?.url;
                console.log("  [A] base video:", baseVid);

                const ls = await piapiSubmit("kling", "lip_sync", {
                  origin_task_id: i2v,
                  local_dubbing_url: audioUrl,
                  tts_text: "",
                  tts_speed: 1,
                });
                const lsData = await piapiPoll(ls, 10 * 60_000, "kling-lipsync");
                const outVid = lsData?.output?.video_url ?? lsData?.output?.url;
                if (!outVid) throw new Error(`no lipsync url: ${JSON.stringify(lsData).slice(0, 400)}`);
                return await rehost(outVid, "mp4");
              })();

              const pathB = (async () => {
                const veoPrompt = [
                  `A warm, sincere Taiwanese father in his early 30s speaks directly to the camera in a cozy home at night.`,
                  `Vertical 9:16 framing, medium close-up, soft warm lamp light, shallow depth of field, photorealistic.`,
                  `He says in Traditional Chinese Mandarin (Taiwan accent): "${script.shortVO}"`,
                  `Natural lip movement synced to his speech, gentle expression, subtle head movement. Static camera.`,
                  `No subtitles, no on-screen text, no captions, no watermark.`,
                ].join(" ");
                const vres = await fetch(
                  `https://generativelanguage.googleapis.com/v1beta/models/veo-3.0-generate-001:predictLongRunning?key=${GEMINI_KEY}`,
                  {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                      instances: [{ prompt: veoPrompt }],
                      parameters: { aspectRatio: "9:16" },
                    }),
                  },
                );
                if (!vres.ok) throw new Error(`Veo submit ${vres.status}: ${(await vres.text()).slice(0, 300)}`);
                const opName = (await vres.json() as any)?.name;
                console.log("  [B] veo op:", opName);
                const start = Date.now();
                while (Date.now() - start < 12 * 60_000) {
                  await new Promise((r) => setTimeout(r, 15_000));
                  const pr = await fetch(`https://generativelanguage.googleapis.com/v1beta/${opName}?key=${GEMINI_KEY}`);
                  const pd: any = await pr.json();
                  console.log(`  [veo] done=${!!pd?.done} (${Math.round((Date.now() - start) / 1000)}s)`);
                  if (pd?.error) throw new Error(`Veo error: ${JSON.stringify(pd.error).slice(0, 300)}`);
                  if (pd?.done) {
                    const uri =
                      pd?.response?.generateVideoResponse?.generatedSamples?.[0]?.video?.uri ??
                      pd?.response?.generatedSamples?.[0]?.video?.uri ??
                      pd?.response?.videos?.[0]?.uri;
                    if (!uri) throw new Error(`Veo no uri: ${JSON.stringify(pd).slice(0, 500)}`);
                    const dl = await fetch(`${uri}${uri.includes("?") ? "&" : "?"}key=${GEMINI_KEY}`);
                    if (!dl.ok) throw new Error(`Veo download ${dl.status}`);
                    return saveBuf(Buffer.from(await dl.arrayBuffer()), "mp4");
                  }
                }
                throw new Error("Veo timeout");
              })();

              const [ra, rb] = await Promise.allSettled([pathA, pathB]);

              console.log("");
              console.log("############################################");
              console.log("SAMPLE RESULTS —", brand.name);
              console.log("  hook  :", script.hook);
              console.log("  VO    :", script.shortVO);
              console.log("  字幕  :", JSON.stringify(script.subtitleLines));
              console.log("  portrait:", imageUrl);
              console.log("  audio   :", audioUrl);
              console.log("");
              console.log("  PATH A (Flux portrait + Kling i2v + Kling lip_sync, our own TTS):");
              console.log("   ", ra.status === "fulfilled" ? ra.value : `FAILED — ${(ra as any).reason?.message}`);
              console.log("");
              console.log("  PATH B (Veo 3, native synced dialogue, one shot):");
              console.log("   ", rb.status === "fulfilled" ? rb.value : `FAILED — ${(rb as any).reason?.message}`);
              console.log("############################################");
              process.exit(0);
            })().catch((e) => {
              console.error("SAMPLE FAILED:", e?.message ?? e);
              process.exit(1);
            });
            SCRIPT_EOF

            set -a
            source /opt/onbrand/app/skills/ai-talent/.env 2>/dev/null || true
            set +a
            export SAMPLE_BRAND_ID SAMPLE_TOPIC

            node --import tsx tmp-sample-video.ts
            RC=$?
            rm -f tmp-sample-video.ts
            exit $RC
