name: Admin — Switch onbrand pm2 to cluster mode (2 workers)
# 2026-05-14: 100-user trial scale. Single fork-mode node can only use 1 core
# and its event loop becomes the choke point under burst LLM traffic, causing
# nginx 502s. Switch to cluster mode with 2 workers so node can use 2 cores
# and one slow LLM call doesn't block all users.
#
# Caveats (acceptable for trial scale):
#   · In-memory rate limiters (supportRouter, authRouter forgot-password)
#     become per-worker, so effective rate = N × original. Still bounded.
#   · positioningJobRunner.activeJobs dedupe is per-worker — at worst two
#     workers run the same job in parallel (wasteful, not corrupting; DB is
#     the source of truth).
#   · Slack OAuth in-memory CSRF state is per-worker. Slack OAuth login is
#     rare; if a user hits the wrong worker on callback they see "Invalid
#     state — please try again" and retry succeeds. Real fix is signed
#     state cookie or DB-backed state — deferred.
#
# Rolls back to fork mode on failure (saved .bak).
on: { workflow_dispatch: {} }
jobs:
  cluster:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 5
    steps:
      - name: Locate ecosystem + back up
        run: |
          set -e
          ECO=/opt/onbrand/app/skills/ai-talent/ecosystem.config.cjs
          [ -f "$ECO" ] || { echo "missing $ECO"; exit 1; }
          cp "$ECO" "${ECO}.bak.$(date +%s)"
          echo "── current ──"
          cat "$ECO"

      - name: Rewrite ecosystem for cluster mode
        run: |
          set -e
          ECO=/opt/onbrand/app/skills/ai-talent/ecosystem.config.cjs
          # Python is more robust for in-place replacement than sed for this.
          python3 <<'PY'
          import re, pathlib
          p = pathlib.Path("/opt/onbrand/app/skills/ai-talent/ecosystem.config.cjs")
          s = p.read_text()
          s = re.sub(r"instances:\s*\d+", "instances: 2", s)
          s = re.sub(r"exec_mode:\s*'fork'", "exec_mode: 'cluster'", s)
          # Bump memory ceiling — cluster mode workers can hit 512M faster
          s = re.sub(r"max_memory_restart:\s*'\d+M'", "max_memory_restart: '768M'", s)
          p.write_text(s)
          print(s)
          PY

      - name: Reload pm2 (graceful, zero-downtime)
        run: |
          set -e
          # pm2 reload performs rolling restart across cluster workers.
          # If the app isn't already in cluster mode (single fork), 'reload'
          # falls back to restart but doesn't re-read ecosystem changes
          # to mode — so we delete + start fresh.
          pm2 delete onbrand 2>/dev/null || true
          cd /opt/onbrand/app/skills/ai-talent
          pm2 start ecosystem.config.cjs
          pm2 save
          sleep 2
          pm2 list

      - name: Smoke
        run: |
          set +e
          for i in 1 2 3 4 5; do
            code=$(curl -sk -o /dev/null -w "%{http_code}" https://marketing-os.sowork.ai/api/healthz 2>/dev/null)
            echo "try $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          echo "health checks failed"
          pm2 logs onbrand --lines 30 --nostream
          exit 1
