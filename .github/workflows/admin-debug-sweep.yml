name: Admin — Debug sweep (post-fixes verification)

# Single workflow that verifies all the recent fixes landed:
#  1. Bundle contains the new press-release identifiers + ErrorBoundary
#  2. /60s page actually returns HTML (not 404 / not white-page nginx)
#  3. PM2 error log: clear → re-tail (clean state, surfaces only NEW errors)
#  4. theater.runStart on seeded brand still HEALTHY
#  5. listFB returns 60s tasks server-side

on:
  workflow_dispatch:

jobs:
  sweep:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 5
    steps:
      - name: Bundle contents — verify recent commits landed
        run: |
          set +e
          DIST=/opt/marketing-os/app/skills/ai-talent/public
          MAIN=$(ls -t "$DIST/assets"/index-*.js 2>/dev/null | head -1)
          [ -z "$MAIN" ] && { echo "no main bundle"; exit 1; }
          echo "MAIN: $MAIN ($(stat -c %s "$MAIN") bytes, mtime $(stat -c %y "$MAIN"))"

          echo ""
          echo "════ Press redesign (commit 43e2a1e) ════"
          echo "  PRESS RELEASE big text:    $(grep -c 'PRESS RELEASE' "$MAIN")"
          echo "  MEDIA CONTACT column:       $(grep -c 'MEDIA CONTACT' "$MAIN")"
          echo "  Cream paper #EBE7D7:        $(grep -c '#EBE7D7' "$MAIN")"
          echo "  splitCaption helper:        $(grep -c 'splitCaption\|hasExplicitSubhead' "$MAIN")"

          echo ""
          echo "════ Inner ErrorBoundary (commit c133aec) ════"
          echo "  TierPageErrorBoundary:     $(grep -c 'TierPageErrorBoundary\|render error\|頁面載入失敗' "$MAIN")"
          echo "  重試渲染 button:            $(grep -c '重試渲染' "$MAIN")"

          echo ""
          echo "════ Squads-style header (commit 558efbc) ════"
          echo "  SoWork eyebrow:             $(grep -c 'Marketing OS' "$MAIN")"
          echo "  EntityStats import:         $(grep -c 'entity\.stats\|entity_stats' "$MAIN")"
          echo "  3 tier hero titles:         $(grep -c '今天，要寫\|今天，要做' "$MAIN")"

          echo ""
          echo "════ 100s isDisabled fix (commit c133aec) ════"
          # The bad pattern was: isDisabled={running||(activeTask.kind==="squad")}
          # Should now be just: isDisabled={running}
          echo "  Old broken pattern still in bundle?:  $(grep -oE 'kind==="squad"' "$MAIN" | head -3 | wc -l)"

          echo ""
          echo "════ ShellLayout listByBrand fix ════"
          echo "  Old broken endpoint refs:   $(grep -c 'product\.listByBrand\|product_listByBrand' "$MAIN")"
          echo "  Correct endpoint refs:      $(grep -c 'product\.list[^B]\|product_list[^B]' "$MAIN")"

      - name: HTTP probe — does /60s actually serve?
        run: |
          set +e
          for path in /30s /60s /100s /theater /squads; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "https://marketing-os.sowork.ai$path")
            SIZE=$(curl -s "https://marketing-os.sowork.ai$path" | wc -c)
            echo "  $path → status=$STATUS body=${SIZE}B"
          done

      - name: Verify HTML references current main JS
        run: |
          set +e
          DIST=/opt/marketing-os/app/skills/ai-talent/public
          MAIN_BASENAME=$(basename $(ls -t "$DIST/assets"/index-*.js 2>/dev/null | head -1) 2>/dev/null)
          echo "Disk main JS basename: $MAIN_BASENAME"

          REFERENCED=$(curl -s https://marketing-os.sowork.ai/60s | grep -oE 'index-[A-Za-z0-9_-]+\.js' | head -1)
          echo "HTML references:       $REFERENCED"
          if [ "$MAIN_BASENAME" = "$REFERENCED" ]; then
            echo "  ✓ HTML in sync with disk dist"
          else
            echo "  ✗ MISMATCH — html not pointing at latest bundle"
          fi

      - name: PM2 error log — last 80 lines (no truncation)
        run: |
          set +e
          ERR=$HOME/.pm2/logs/marketing-os-error.log
          [ -f "$ERR" ] || ERR=/root/.pm2/logs/marketing-os-error.log
          if [ -f "$ERR" ]; then
            echo "Tail of $ERR ($(stat -c %s "$ERR")B total):"
            tail -80 "$ERR"
          else
            echo "(no error log readable)"
          fi

      - name: PM2 status snapshot
        run: |
          set +e
          pm2 jlist 2>/dev/null | python3 -c "
          import sys, json, time
          data = json.loads(sys.stdin.read())
          for p in data:
              if p['name'] == 'marketing-os':
                  age_s = (time.time() * 1000 - p['pm2_env']['pm_uptime']) / 1000
                  print(f'  pid={p[\"pid\"]}  age={age_s:.0f}s  status={p[\"pm2_env\"][\"status\"]}  restarts={p[\"pm2_env\"][\"restart_time\"]}')" 2>/dev/null

      - name: Theater health — runStart on seeded brand
        run: |
          set -e
          AI=/opt/marketing-os/app/skills/ai-talent
          set -a; source "$AI/.env" 2>/dev/null; set +a
          export MYSQL_PWD="${LOCAL_DB_PASSWORD}"
          BID=2821
          OWNER=$(mysql -h ${LOCAL_DB_HOST:-localhost} -u ${LOCAL_DB_USER:-mos_user} ${LOCAL_DB_NAME:-mos_db} -B -N --silent -e "SELECT userId FROM brands WHERE id=$BID")
          cd "$AI"
          npx tsx -e "
          import { getBrandPositioningById } from './server/positioningBridge';
          (async () => {
            const pos = await getBrandPositioningById($BID, $OWNER);
            const ok = (pos?.differentiators?.length ?? 0) >= 3;
            console.log('Theater positioning health (brand $BID):', ok ? '✓ HEALTHY' : '✗ FAIL');
            console.log('  USPs:', pos?.differentiators?.length ?? 0);
            console.log('  Tagline:', pos?.tagline);
            process.exit(ok ? 0 : 1);
          })();
          "

      - name: Server-side listFB sanity (60s tasks reachable?)
        run: |
          set +e
          AI=/opt/marketing-os/app/skills/ai-talent
          set -a; source "$AI/.env" 2>/dev/null; set +a
          cd "$AI"
          npx tsx -e "
          import { FB_60S_TASKS_V2 } from './server/_core/quickTaskFB60';
          import { IG_60S_TASKS } from './server/_core/quickTaskIG60';
          import { YT_60S_TASKS } from './server/_core/quickTaskYT60';
          import { ALL_100S_SQUADS } from './server/_core/quickTask100Squads';
          console.log('60s task pools:');
          console.log('  FB_60S_TASKS_V2:', FB_60S_TASKS_V2.length);
          console.log('  IG_60S_TASKS:   ', IG_60S_TASKS.length);
          console.log('  YT_60S_TASKS:   ', YT_60S_TASKS.length);
          console.log('  Total 60s:       ', FB_60S_TASKS_V2.length + IG_60S_TASKS.length + YT_60S_TASKS.length);
          console.log('100s squads:', ALL_100S_SQUADS.length);
          process.exit(0);
          " 2>&1 | tail -10
