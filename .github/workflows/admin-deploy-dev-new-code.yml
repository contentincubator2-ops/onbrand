name: Admin — Deploy new code to /opt production

# SSH to VM, cd to each /opt repo, pull latest, run deploy-dev.sh for
# backend and frontend. Both use pm2 so restart is zero-downtime.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to deploy both repos'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm == 'DEPLOY' }}
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 600s
          script: |
            set -e
            BE=/opt/marketing-os/marketing-os-backend
            FE=/opt/marketing-os/marketing-os-frontend

            echo "========== BACKEND DEPLOY =========="
            cd "$BE"
            echo "[BE] Git pull..."
            git fetch origin main
            git reset --hard origin/main
            echo "[BE] HEAD: $(git log --oneline -1)"
            echo ""
            echo "[BE] npm install..."
            npm install --no-audit --no-fund 2>&1 | tail -5

            echo "[BE] Running deploy-dev.sh..."
            bash ./deploy-dev.sh 2>&1 | tail -30

            echo ""
            echo "========== FRONTEND DEPLOY =========="
            cd "$FE"
            echo "[FE] Git pull..."
            git fetch origin main
            git reset --hard origin/main
            echo "[FE] HEAD: $(git log --oneline -1)"

            if [ -f "./deploy-dev.sh" ]; then
              echo "[FE] Running deploy-dev.sh..."
              bash ./deploy-dev.sh 2>&1 | tail -30
            else
              echo "[FE] No deploy-dev.sh — running npm install + build:ai-talent + pm2 restart"
              npm install --no-audit --no-fund 2>&1 | tail -5
              cd ai-talent-client
              npm install --no-audit --no-fund 2>&1 | tail -5
              cd ..
              npm run build:ai-talent 2>&1 | tail -10
              pm2 restart marketing-os-client-dev 2>&1 | tail -10
            fi

            echo ""
            echo "========== Final pm2 status =========="
            pm2 list | head -20

            echo ""
            echo "========== Check URLs =========="
            curl -s -o /dev/null -w "Backend /health: HTTP %{http_code}\n" http://127.0.0.1:3101/health || echo "(backend direct port failed)"
            curl -s -o /dev/null -w "Frontend :5173: HTTP %{http_code}\n" http://127.0.0.1:5173/ || echo "(frontend dev port failed)"
