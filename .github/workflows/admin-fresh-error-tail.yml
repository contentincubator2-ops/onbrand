name: Admin — Tail FRESH error log + force fresh start

on:
  workflow_dispatch:

jobs:
  fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 90s
          script: |
            set +e
            ERR=~/.pm2/logs/marketing-os-error.log
            OUT=~/.pm2/logs/marketing-os-out.log

            echo "════ Truncating logs to capture FRESH crash ════"
            : > "$ERR"
            : > "$OUT"
            echo "Logs cleared."

            echo "════ Force pm2 restart ════"
            pm2 restart marketing-os --update-env 2>&1 | tail -3
            sleep 6

            echo "════ FRESH ERROR LOG (post-restart) ════"
            cat "$ERR" 2>/dev/null

            echo ""
            echo "════ FRESH STDOUT (post-restart) ════"
            cat "$OUT" 2>/dev/null

            echo ""
            echo "════ Process state ════"
            pm2 jlist 2>/dev/null | python3 -c "
            import sys, json, time
            data = json.loads(sys.stdin.read())
            for p in data:
                if p['name'] == 'marketing-os':
                    age_s = (time.time() * 1000 - p['pm2_env']['pm_uptime']) / 1000
                    print(f'  pid={p[\"pid\"]}  age={age_s:.1f}s  status={p[\"pm2_env\"][\"status\"]}  restarts={p[\"pm2_env\"][\"restart_time\"]}  exit_code={p[\"pm2_env\"].get(\"exit_code\",\"n/a\")}')" 2>/dev/null
