name: Admin — Set up onbrand.sowork.ai nginx + HTTPS cert

# 2026-05-12 (CJ「我現在剛剛設定好 onbrand.sowork.ai 了」):
# DNS is set up by CJ. This workflow:
#   1. Adds onbrand.sowork.ai to the existing nginx server_name (alongside
#      drop.sowork.ai which is being retired).
#   2. Runs certbot to extend the SSL cert to include onbrand.
#   3. Reloads nginx.
#
# Once verified, the drop.sowork.ai server_name will be removed in a
# follow-up workflow (drop is already pulled from DNS per CJ).

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 300s
          script: |
            set -e

            SITE=/etc/nginx/sites-enabled/marketing-os
            if [ ! -f "$SITE" ]; then SITE=/etc/nginx/sites-available/marketing-os; fi
            if [ ! -f "$SITE" ]; then
              echo "✗ nginx site not found"
              sudo ls /etc/nginx/sites-enabled/
              exit 1
            fi
            echo "Editing: $SITE"

            echo
            echo "── current server_name lines ─────"
            sudo grep -n "server_name" "$SITE" || true

            echo
            echo "── add onbrand.sowork.ai if missing ─────"
            if sudo grep -q "onbrand.sowork.ai" "$SITE"; then
              echo "✓ onbrand.sowork.ai already present"
            else
              sudo cp "$SITE" "${SITE}.bak.$(date +%s)"
              # Add onbrand.sowork.ai next to drop.sowork.ai in EVERY server_name directive
              sudo sed -i 's/server_name \([^;]*drop\.sowork\.ai[^;]*\);/server_name \1 onbrand.sowork.ai;/g' "$SITE"
              echo "✓ patched server_name to include onbrand.sowork.ai"
            fi

            echo
            echo "── nginx -t ─────"
            sudo nginx -t 2>&1 | tail -3

            echo
            echo "── reload nginx (so HTTP-01 challenge can hit /well-known) ─────"
            sudo systemctl reload nginx

            echo
            echo "── certbot expand cert to include onbrand.sowork.ai ─────"
            # --expand re-issues the cert covering both old+new domains.
            # If a cert already exists for drop.sowork.ai, this adds onbrand to it.
            sudo certbot --nginx -d drop.sowork.ai -d onbrand.sowork.ai \
              --non-interactive --agree-tos --email sowork@sowork.tw \
              --expand --redirect 2>&1 | tail -20 || \
              sudo certbot --nginx -d onbrand.sowork.ai \
                --non-interactive --agree-tos --email sowork@sowork.tw \
                --redirect 2>&1 | tail -20

            echo
            echo "── final server_name + cert paths ─────"
            sudo grep -n "server_name\|ssl_certificate" "$SITE" | head -10

            echo
            echo "── test https://onbrand.sowork.ai/health ─────"
            curl -sk -o /dev/null -w "HTTP %{http_code} · cert: %{ssl_verify_result}\n" \
              https://onbrand.sowork.ai/health || echo "(curl test failed — manual check needed)"
