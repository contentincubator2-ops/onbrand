name: Admin — Test L1 Squad Quality

# Read-only test of L1 squads: check member-skill alignment,
# workflow step quality, and API fetchability.

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            cd /home/azureuser/marketing-os/skills/ai-talent
            DB_USER=$(grep -E '^DB_USER=' .env | cut -d= -f2- | tr -d '"' | tr -d "'")
            DB_PASS=$(grep -E '^DB_PASSWORD=' .env | cut -d= -f2- | tr -d '"' | tr -d "'")
            DB_NAME=$(grep -E '^DB_NAME=' .env | cut -d= -f2- | tr -d '"' | tr -d "'")

            mysql --host=127.0.0.1 --user="${DB_USER}" --password="${DB_PASS}" --default-character-set=utf8mb4 "${DB_NAME}" <<'SQL'
            SELECT '========== TEST 1: Lead primarySkill alignment ==========' AS t;
            SELECT s.slug, s.methodology, a.primarySkill AS lead_skill, a.name AS lead_name,
                   CASE
                     WHEN a.primarySkill LIKE CONCAT('%', REPLACE(s.methodology, '-', '%'), '%')
                       OR s.methodology LIKE CONCAT('%', REPLACE(a.primarySkill, '-strategist', ''), '%')
                       THEN '✓ aligned'
                     ELSE '✗ review'
                   END AS alignment
            FROM agent_squads s,
              JSON_TABLE(s.agents, '$[*]' COLUMNS (
                agent_id INT PATH '$.agent_id',
                is_lead BOOLEAN PATH '$.is_lead'
              )) AS m
            LEFT JOIN agents a ON a.id = m.agent_id
            WHERE s.strategy_layer='L1_brand' AND s.tier='core' AND m.is_lead = 1
            ORDER BY s.id;

            SELECT '========== TEST 2: Workflow step count ==========' AS t;
            SELECT s.slug,
                   JSON_LENGTH(s.agents) AS members,
                   JSON_LENGTH(t.steps) AS steps,
                   CASE WHEN JSON_LENGTH(t.steps) >= 4 THEN '✓' ELSE '✗' END AS workflow_ok
            FROM agent_squads s
            LEFT JOIN squad_workflow_templates t ON t.taskType = s.slug
            WHERE s.strategy_layer='L1_brand' AND s.tier='core'
            ORDER BY s.id;

            SELECT '========== TEST 3: All step has assignedAgentId ==========' AS t;
            SELECT s.slug,
                   JSON_LENGTH(t.steps) AS total_steps,
                   SUM(CASE WHEN JSON_EXTRACT(step.value, '$.assignedAgentId') IS NOT NULL
                                AND JSON_EXTRACT(step.value, '$.assignedAgentId') > 0
                            THEN 1 ELSE 0 END) AS valid_assigned
            FROM agent_squads s
            LEFT JOIN squad_workflow_templates t ON t.taskType = s.slug,
              JSON_TABLE(t.steps, '$[*]' COLUMNS (value JSON PATH '$')) AS step
            WHERE s.strategy_layer='L1_brand' AND s.tier='core'
            GROUP BY s.slug
            ORDER BY s.id;

            SELECT '========== TEST 4: unique lead agents (should = 10) ==========' AS t;
            SELECT COUNT(DISTINCT m.agent_id) AS unique_leads
            FROM agent_squads s,
              JSON_TABLE(s.agents, '$[*]' COLUMNS (
                agent_id INT PATH '$.agent_id',
                is_lead BOOLEAN PATH '$.is_lead'
              )) AS m
            WHERE s.strategy_layer='L1_brand' AND s.tier='core' AND m.is_lead = 1;
            SQL

            echo ""
            echo "========== TEST 5: /api/agent_squads endpoint returns L1 squads =========="
            # VM api is on 3101 per diagnostic, but through nginx it's on marketing-os.sowork.ai
            # Try the direct internal endpoint
            curl -s -o /tmp/squads-api.json -w "HTTP %{http_code}\n" http://127.0.0.1:3101/api/squads 2>/dev/null || echo "(direct endpoint not reachable)"
            if [ -f /tmp/squads-api.json ]; then
              echo "Response size: $(wc -c < /tmp/squads-api.json) bytes"
              # Show first 500 chars if < 2000 bytes; else count of brand-positioning
              if [ "$(wc -c < /tmp/squads-api.json)" -lt 2000 ]; then
                head -c 500 /tmp/squads-api.json
                echo ""
              fi
              rm /tmp/squads-api.json
            fi
