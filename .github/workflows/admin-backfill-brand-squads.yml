name: Admin — Backfill Brand Squads (name_en + industry_focus + deliverable_format)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type FILL to execute backfill'
        required: true
        type: string

jobs:
  backfill:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'FILL'
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -e
            MOS_USER="mos_user"
            MOS_PASS="mos_secure_2026"
            MOS_DB="mos_db"

            echo "=== Backfill name_en, industry_focus, deliverable_format ==="
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" << 'SQLEOF'
            -- Per-squad backfill (10 brand-workspace squads)
            UPDATE squads SET
              name_en = 'SoWork Brand Positioning',
              industry_focus = 'saas-b2b',
              deliverable_format = '品牌定位書 + 標語 + 視覺指南 + Sales Enablement'
            WHERE slug='sowork-brand-positioning';

            UPDATE squads SET
              name_en = 'Benefit-Based Positioning Squad',
              industry_focus = 'all',
              deliverable_format = '功能利益階梯 + 情感利益 Map + 品牌承諾'
            WHERE slug='benefit-based-positioning';

            UPDATE squads SET
              name_en = 'Differentiation Positioning Squad (April Dunford Method)',
              industry_focus = 'saas-b2b',
              deliverable_format = '差異化屬性 + 定位宣言（For/Who/Unlike）+ 市場分類'
            WHERE slug='differentiation-positioning';

            UPDATE squads SET
              name_en = 'Value Proposition Mapping Squad',
              industry_focus = 'saas-b2b',
              deliverable_format = 'Value Proposition Canvas + 痛點/收益 Map + VP 宣言'
            WHERE slug='value-proposition-mapping';

            UPDATE squads SET
              name_en = 'Segmentation-Based Positioning Squad',
              industry_focus = 'consumer',
              deliverable_format = '市場區隔報告 + ICP Profile + 區隔策略'
            WHERE slug='segmentation-based-positioning';

            UPDATE squads SET
              name_en = 'Competitive Perceptual Mapping Squad',
              industry_focus = 'all',
              deliverable_format = '知覺地圖 + 競品定位分析 + 差異化空間'
            WHERE slug='competitive-perceptual-mapping';

            UPDATE squads SET
              name_en = 'Category Design Positioning Squad',
              industry_focus = 'saas-b2b',
              deliverable_format = '新品類定義 + Point-of-View + Go-To-Market'
            WHERE slug='category-design-positioning';

            UPDATE squads SET
              name_en = 'Mind Positioning Squad (Ries & Trout)',
              industry_focus = 'consumer',
              deliverable_format = '心智定位 + One-Word Positioning + 訊息階層'
            WHERE slug='mind-positioning';

            UPDATE squads SET
              name_en = 'JTBD Positioning Squad (Jobs-to-be-Done)',
              industry_focus = 'all',
              deliverable_format = 'Job Map + JTBD Statement + 用戶情境'
            WHERE slug='jtbd-positioning';

            UPDATE squads SET
              name_en = 'Purpose-Driven Positioning Squad (Sinek Golden Circle)',
              industry_focus = 'all',
              deliverable_format = 'Golden Circle (Why/How/What) + 使命宣言 + 品牌故事'
            WHERE slug='purpose-driven-positioning';
            SQLEOF
            echo "✅ Backfilled 10 brand-workspace squads"

            echo ""
            echo "=== 驗證 ==="
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
              SELECT slug, name_en, industry_focus, LEFT(deliverable_format, 40) as deliverable
              FROM squads WHERE is_active=1 AND workspace LIKE '%brand%'
              ORDER BY id;
            " 2>&1
