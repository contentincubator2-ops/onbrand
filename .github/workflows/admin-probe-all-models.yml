name: Admin — Probe ALL 6 model variants directly

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 180s
          script: |
            cd /opt/marketing-os/app/skills/ai-talent
            set -a; source .env; set +a

            test_model() {
              local label="$1" url="$2" key="$3" header="$4" payload="$5"
              local code
              code=$(curl -s -o /tmp/p.txt -w "%{http_code}" --max-time 20 \
                -H "Content-Type: application/json" \
                -H "$header: $key" \
                ${header:+-H "anthropic-version: 2023-06-01"} \
                -X POST "$url" -d "$payload" || echo "000")
              local result=$([ "$code" = "200" ] && echo "✅ WORKS" || echo "❌ FAIL")
              echo "$label : HTTP $code $result"
              [ "$code" != "200" ] && head -c 200 /tmp/p.txt
              echo
            }

            echo "════════════ Probing each agent.aiModel value ════════════"
            POS_EP="${AZURE_POSITION_ENDPOINT%/}"
            NC_EP="${AZURE_NORTHCENTRAL_ENDPOINT%/}"
            FND_EP="${AZURE_FOUNDRY_ENDPOINT%/}"

            # qwen3-32b → qwen
            test_model "qwen-plus (qwen)" \
              "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions" \
              "$DASHSCOPE_API_KEY" "Authorization: Bearer" \
              '{"model":"qwen-plus","messages":[{"role":"user","content":"hi"}],"max_tokens":10}'

            # glm-4-flash → zhipu
            test_model "glm-4-flash (zhipu)" \
              "https://open.bigmodel.cn/api/paas/v4/chat/completions" \
              "$ZHIPU_API_KEY" "Authorization: Bearer" \
              '{"model":"glm-4-flash","messages":[{"role":"user","content":"hi"}],"max_tokens":10}'

            # Kimi-K2.5 → azure-foundry
            test_model "Kimi-K2.5 (azure-foundry)" \
              "$FND_EP/openai/v1/chat/completions" \
              "$AZURE_FOUNDRY_API_KEY" "api-key" \
              '{"model":"Kimi-K2.5","messages":[{"role":"user","content":"hi"}],"max_tokens":10}'

            # claude-haiku-4-5 → azure-position
            test_model "claude-haiku-4-5 (azure-position)" \
              "$POS_EP/anthropic/v1/messages" \
              "$AZURE_POSITION_API_KEY" "x-api-key" \
              '{"model":"claude-haiku-4-5","max_tokens":10,"messages":[{"role":"user","content":"hi"}]}'

            # claude-sonnet-4-6 → azure-position
            test_model "claude-sonnet-4-6 (azure-position)" \
              "$POS_EP/anthropic/v1/messages" \
              "$AZURE_POSITION_API_KEY" "x-api-key" \
              '{"model":"claude-sonnet-4-6","max_tokens":10,"messages":[{"role":"user","content":"hi"}]}'

            # DeepSeek-V3.2 → azure-northcentral
            test_model "DeepSeek-V3.2 (azure-northcentral)" \
              "$NC_EP/openai/deployments/DeepSeek-V3.2/chat/completions?api-version=2024-10-21" \
              "$AZURE_NORTHCENTRAL_API_KEY" "api-key" \
              '{"messages":[{"role":"user","content":"hi"}],"max_tokens":10}'
