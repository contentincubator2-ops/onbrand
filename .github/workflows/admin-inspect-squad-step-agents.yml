name: Admin — Inspect Squad Step Agent Assignments

# Lists each step's assigned agent (ID, name, primarySkill, aiModel) for any squad.
# Uses inline MySQL with proper JSON_TABLE escaping.

on:
  workflow_dispatch:
    inputs:
      squad_slug:
        description: 'Squad slug to inspect (e.g. brand-archetype-positioning)'
        required: true
        default: 'brand-archetype-positioning'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            MOS_USER="mos_user"
            MOS_PASS="mos_secure_2026"
            MOS_DB="mos_db"
            SLUG="${{ github.event.inputs.squad_slug }}"

            echo "======================================================"
            echo "Squad Step Agent Inspection: $SLUG"
            echo "======================================================"

            echo ""
            echo "=== 1. Squad overview ==="
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
              SELECT id, slug, name, missionType,
                     JSON_LENGTH(agents) as agent_count,
                     JSON_LENGTH(steps)  as step_count
              FROM squads
              WHERE slug = '$SLUG' AND is_active = 1
              LIMIT 1;
            " 2>&1

            echo ""
            echo "=== 2. Squad members (agent_id, is_lead, role, name, primarySkill, aiModel) ==="
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
              SELECT
                m.agent_id,
                m.is_lead,
                m.role,
                m.ord,
                a.name,
                a.primarySkill,
                a.aiModel
              FROM squads s,
                JSON_TABLE(s.agents, '\$[*]' COLUMNS (
                  agent_id  INT          PATH '\$.agent_id',
                  is_lead   TINYINT      PATH '\$.is_lead',
                  role      VARCHAR(100) PATH '\$.role',
                  ord       INT          PATH '\$.order'
                )) AS m
              JOIN agents a ON a.id = m.agent_id
              WHERE s.slug = '$SLUG' AND s.is_active = 1
              ORDER BY m.ord;
            " 2>&1

            echo ""
            echo "=== 3. Step → Agent assignments ==="
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
              SELECT
                st.step_order,
                LEFT(st.step_name, 30)                AS step_name,
                st.assigned_agent_id,
                COALESCE(a.name,         '(UNASSIGNED)') AS agent_name,
                COALESCE(a.primarySkill, '—')            AS primary_skill,
                COALESCE(a.aiModel,      '—')            AS ai_model,
                LEFT(st.req_skills, 60)               AS req_skills
              FROM squads s,
                JSON_TABLE(s.steps, '\$[*]' COLUMNS (
                  step_order        INT          PATH '\$.order',
                  step_name         VARCHAR(200) PATH '\$.name',
                  assigned_agent_id INT          PATH '\$.assignedAgentId',
                  req_skills        VARCHAR(300) PATH '\$.requiredSkills'
                )) AS st
              LEFT JOIN agents a ON a.id = st.assigned_agent_id
              WHERE s.slug = '$SLUG' AND s.is_active = 1
              ORDER BY st.step_order;
            " 2>&1

            echo ""
            echo "=== 4. Unassigned steps count ==="
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
              SELECT COUNT(*) AS unassigned_steps
              FROM squads s,
                JSON_TABLE(s.steps, '\$[*]' COLUMNS (
                  assigned_agent_id INT PATH '\$.assignedAgentId'
                )) AS st
              WHERE s.slug = '$SLUG' AND s.is_active = 1
                AND st.assigned_agent_id IS NULL;
            " 2>&1

            echo ""
            echo "======================================================"
            echo "Done."
            echo "======================================================"
