name: Admin — Inspect & Fix Squad Step Agent Assignments

# Lists each step's assigned agent (ID, name, primarySkill, aiModel) for any squad.
# Runs the Node.js inspect-squad-agents.ts script on the VM.

on:
  workflow_dispatch:
    inputs:
      squad_slug:
        description: 'Squad slug to inspect (e.g. brand-archetype-positioning)'
        required: true
        default: 'brand-archetype-positioning'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e
            SLUG="${{ github.event.inputs.squad_slug }}"
            APP_DIR="/home/azureuser/A2A-Marketing-Claw"

            echo "======================================================"
            echo "Inspecting squad: $SLUG"
            echo "======================================================"

            cd "$APP_DIR"

            # Pull latest scripts
            git pull --ff-only origin main 2>&1 || echo "[warn] git pull failed, using current files"

            # Run the Node.js inspect script
            npx tsx scripts/inspect-squad-agents.ts "$SLUG" 2>&1

            echo ""
            echo "======================================================"
            echo "Done."
            echo "======================================================"
