name: Admin — Audit Workflow Completeness

# Reports how many of the active squads have a qualified
# execution workflow (steps[] with assignedAgentId on every step).
# Read-only — no DB writes.

on:
  workflow_dispatch:
    inputs:
      write_csv:
        description: "Also dump scripts/audit-workflow-results.csv"
        required: false
        default: "false"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WRITE_CSV: ${{ inputs.write_csv }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 600s
          envs: GH_TOKEN,WRITE_CSV
          script: |
            set -e
            APP=/opt/marketing-os/app
            AI=$APP/skills/ai-talent

            echo "===== Step 1: Pull latest main ====="
            REPO="https://x-access-token:${GH_TOKEN}@github.com/contentincubator2-ops/Marketing-OS.git"
            cd "$APP"
            git remote set-url origin "$REPO"
            git fetch origin main
            git reset --hard origin/main
            echo "Commit: $(git log --oneline -1)"

            echo ""
            echo "===== Step 2: Run audit ====="
            cd "$AI"
            FLAGS=""
            if [ "$WRITE_CSV" = "true" ]; then FLAGS="--write-csv"; fi
            npx tsx scripts/audit-workflow-completeness.ts $FLAGS 2>&1 | tail -400

            if [ "$WRITE_CSV" = "true" ]; then
              echo ""
              echo "===== CSV head ====="
              head -40 scripts/audit-workflow-results.csv || true
            fi

            echo ""
            echo "===== Done ====="
