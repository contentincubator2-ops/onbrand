name: Admin — Generate skill covers (Azure gpt-image-2)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Type "true" to preview prompts only'
        required: false
        default: 'false'
      reuse:
        description: 'Type "true" to skip skills already with cover_image_url'
        required: false
        default: 'true'
      limit:
        description: 'Limit (blank = all)'
        required: false
      task_type:
        description: 'Filter by task_type (text|image|code|search|audio|video|multimodal|embedding) — blank = all'
        required: false
      slug:
        description: 'Only this skill slug'
        required: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY:    ${{ github.event.inputs.dry_run }}
          REUSE:  ${{ github.event.inputs.reuse }}
          LIMIT:  ${{ github.event.inputs.limit }}
          TT:     ${{ github.event.inputs.task_type }}
          SLUG:   ${{ github.event.inputs.slug }}
          AZURE_IMAGE_API_KEY:  ${{ secrets.GPT }}
          AZURE_IMAGE_ENDPOINT: "https://proj-claude-sweden-resource.cognitiveservices.azure.com"
          AZURE_IMAGE_DEPLOYMENT: "gpt-image-2"
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 21600s   # 6h cap; full 2,471 skills ≈ 5–6h sequential
          envs: GH_TOKEN,DRY,REUSE,LIMIT,TT,SLUG,AZURE_IMAGE_API_KEY,AZURE_IMAGE_ENDPOINT,AZURE_IMAGE_DEPLOYMENT
          script: |
            set -e
            APP=/opt/marketing-os/app
            cd "$APP"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/contentincubator2-ops/Marketing-OS.git"
            git fetch origin main && git reset --hard origin/main

            ENV_FILE=$APP/skills/ai-talent/.env
            set -a; source "$ENV_FILE"; set +a
            cd $APP/skills/ai-talent
            mkdir -p /opt/marketing-os/covers || true

            ARGS=""
            [ "$DRY" = "true" ]   && ARGS="$ARGS --dry-run"
            [ "$REUSE" = "true" ] && ARGS="$ARGS --reuse"
            [ -n "$LIMIT" ]       && ARGS="$ARGS --limit=$LIMIT"
            [ -n "$TT" ]          && ARGS="$ARGS --task-type=$TT"
            [ -n "$SLUG" ]        && ARGS="$ARGS --slug=$SLUG"

            ./node_modules/.bin/tsx scripts/generateSkillCovers.ts $ARGS
