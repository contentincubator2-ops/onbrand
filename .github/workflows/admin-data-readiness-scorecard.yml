name: Admin — Data readiness scorecard

# Single-shot end-to-end audit for the three product surfaces:
#   A) Task templates (squads.methodology / description / strategy_layer / tier)
#   B) Boardroom (6 layers × tier=core lead × aiModel provider diversity)
#   C) /ai 30-sec run (every active squad has steps + each step.assignedAgentId resolvable)
#   D) Agent pool depth (16k agents — primarySkill, skills JSON, aiModel diversity)
#
# Output: human-readable scorecard with PASS / WARN / FAIL per criterion.

on:
  workflow_dispatch:

jobs:
  scorecard:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 120s
          script: |
            set +e
            cd /opt/marketing-os/app/skills/ai-talent
            DBE=$(grep -E '^DB_' .env | sed 's/^/export /')
            eval "$DBE"
            DB_HOST_V=${DB_HOST:-127.0.0.1}
            DB_USER_V=${DB_USER:-root}
            DB_NAME_V=${DB_NAME:-mos_db}
            run_sql() { MYSQL_PWD="$DB_PASSWORD" mysql -h"$DB_HOST_V" -u"$DB_USER_V" "$DB_NAME_V" -t -e "$1" 2>&1; }
            run_raw() { MYSQL_PWD="$DB_PASSWORD" mysql -h"$DB_HOST_V" -u"$DB_USER_V" "$DB_NAME_V" -N -B -e "$1" 2>&1; }

            echo "════════════════════════════════════════════════════════════════"
            echo "  📋  DATA READINESS SCORECARD"
            echo "  $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "════════════════════════════════════════════════════════════════"

            # ─── A. TASK TEMPLATE READINESS (squads) ─────────────────────────
            echo ""
            echo "▼ A. 任務範本 — squads.methodology / description / layer / tier"
            echo "──────────────────────────────────────────────────────────────"
            run_sql "SELECT
              COUNT(*)                                                      AS total_active,
              SUM(methodology IS NOT NULL AND methodology <> '')            AS has_methodology,
              SUM(description  IS NOT NULL AND description  <> '')          AS has_description,
              SUM(strategy_layer IS NOT NULL)                                AS has_layer,
              SUM(tier IS NOT NULL)                                          AS has_tier,
              SUM(lead_agent_id IS NOT NULL)                                 AS has_lead
              FROM squads WHERE is_active = 1;"

            echo ""
            echo "  ↳ 拆分到每層："
            run_sql "SELECT
              COALESCE(strategy_layer,'(unset)')                  AS layer,
              COUNT(*)                                            AS n,
              SUM(methodology IS NOT NULL AND methodology<>'')    AS m_ok,
              SUM(description  IS NOT NULL AND description<>'')   AS d_ok,
              SUM(tier='core')                                    AS core_count
              FROM squads WHERE is_active=1
              GROUP BY layer ORDER BY layer;"

            # ─── B. BOARDROOM READINESS ──────────────────────────────────────
            echo ""
            echo "▼ B. Boardroom — 6 層各有 tier=core lead，aiModel provider 多元"
            echo "──────────────────────────────────────────────────────────────"
            run_sql "SELECT
              s.strategy_layer                                   AS layer,
              COUNT(DISTINCT s.id)                               AS core_squads,
              COUNT(DISTINCT s.lead_agent_id)                    AS distinct_leads,
              COUNT(DISTINCT a.aiModel)                          AS distinct_aiModels
              FROM squads s LEFT JOIN agents a ON s.lead_agent_id=a.id
              WHERE s.is_active=1 AND s.tier='core' AND s.strategy_layer IS NOT NULL
              GROUP BY s.strategy_layer ORDER BY s.strategy_layer;"

            echo ""
            echo "  ↳ 全部 core lead 的 aiModel → provider bucket（依 mapAiModelToProvider 規則）："
            run_sql "SELECT
              CASE
                WHEN a.aiModel LIKE '%claude%' OR a.aiModel LIKE '%anthropic%'                 THEN 'anthropic'
                WHEN a.aiModel LIKE '%gpt-4o%' OR a.aiModel LIKE 'gpt-4.1%' OR a.aiModel LIKE 'gpt-5%' OR a.aiModel LIKE 'o3%' OR a.aiModel LIKE 'o4%' OR a.aiModel LIKE '%Phi-%' OR a.aiModel LIKE '%Llama%' OR a.aiModel LIKE '%DeepSeek%' OR a.aiModel LIKE '%Kimi%' OR a.aiModel LIKE '%MAI-%' OR a.aiModel LIKE '%mistral%' OR a.aiModel LIKE '%gemma%' OR a.aiModel LIKE 'gpt-%' THEN 'azure-foundry'
                WHEN a.aiModel LIKE '%qwen%'                                                    THEN 'qwen'
                WHEN a.aiModel LIKE '%glm%' OR a.aiModel LIKE '%zhipu%'                         THEN 'zhipu'
                WHEN a.aiModel LIKE '%perplex%' OR a.aiModel LIKE 'sonar%'                      THEN 'perplexity'
                WHEN a.aiModel LIKE '%gemini%'                                                  THEN 'gemini'
                WHEN a.aiModel LIKE '%grok%'                                                    THEN 'grok'
                ELSE 'other' END                                AS provider_bucket,
              COUNT(*)                                          AS leads
              FROM squads s JOIN agents a ON s.lead_agent_id=a.id
              WHERE s.is_active=1 AND s.tier='core'
              GROUP BY provider_bucket ORDER BY leads DESC;"

            # ─── C. /AI 30-SEC RUN READINESS — workflow steps ────────────────
            echo ""
            echo "▼ C. /ai 30-sec run — squads.steps + 每 step 有可解析的 assignedAgentId"
            echo "──────────────────────────────────────────────────────────────"
            run_sql "SELECT
              COUNT(*)                                                         AS total_active,
              SUM(steps IS NOT NULL AND JSON_LENGTH(steps) > 0)                AS has_steps,
              SUM(steps IS NULL OR JSON_LENGTH(steps) = 0)                     AS no_steps,
              ROUND(AVG(JSON_LENGTH(steps)),2)                                 AS avg_steps_per_squad
              FROM squads WHERE is_active=1;"

            echo ""
            echo "  ↳ Step-level 健檢（展開所有 step）："
            run_sql "WITH step_rows AS (
                SELECT s.id, s.slug, j.idx, j.step_obj
                FROM squads s
                JOIN JSON_TABLE(
                  s.steps, '$[*]' COLUMNS (
                    idx FOR ORDINALITY,
                    step_obj JSON PATH '$'
                  )
                ) j
                WHERE s.is_active=1 AND s.steps IS NOT NULL AND JSON_LENGTH(s.steps)>0
              )
              SELECT
                COUNT(*)                                                          AS total_steps,
                SUM(JSON_EXTRACT(step_obj,'\$.assignedAgentId') IS NOT NULL)      AS has_assigned_agent,
                SUM(JSON_EXTRACT(step_obj,'\$.assignedAgentId') IS NULL
                    AND JSON_EXTRACT(step_obj,'\$.owner') IS NOT NULL)            AS legacy_owner_only,
                SUM(JSON_EXTRACT(step_obj,'\$.tool') IS NOT NULL)                 AS has_tool,
                SUM(JSON_EXTRACT(step_obj,'\$.outputType') IS NOT NULL)           AS has_outputType
              FROM step_rows;"

            echo ""
            echo "  ↳ 哪些 squad 的 step 還沒有 assignedAgentId（前 20 個 — 這些 /ai 跑不動）："
            run_sql "WITH step_rows AS (
                SELECT s.id, s.slug, s.strategy_layer, j.step_obj
                FROM squads s
                JOIN JSON_TABLE(
                  s.steps, '$[*]' COLUMNS (step_obj JSON PATH '$')
                ) j
                WHERE s.is_active=1 AND s.steps IS NOT NULL AND JSON_LENGTH(s.steps)>0
              )
              SELECT id, slug, strategy_layer
              FROM step_rows
              WHERE JSON_EXTRACT(step_obj,'\$.assignedAgentId') IS NULL
              GROUP BY id, slug, strategy_layer
              LIMIT 20;"

            echo ""
            echo "  ↳ /ai 30-sec runnable squads（同時通過：方法論+lead+steps+所有 step 有 assignedAgentId）："
            run_sql "WITH step_check AS (
                SELECT s.id,
                  SUM(JSON_EXTRACT(j.step_obj,'\$.assignedAgentId') IS NULL) AS missing
                FROM squads s
                JOIN JSON_TABLE(s.steps,'$[*]' COLUMNS(step_obj JSON PATH '$')) j
                WHERE s.is_active=1 AND s.steps IS NOT NULL AND JSON_LENGTH(s.steps)>0
                GROUP BY s.id
              )
              SELECT
                (SELECT COUNT(*) FROM squads WHERE is_active=1) AS total_active,
                COUNT(*)                                         AS runnable_now,
                SUM(missing=0)                                   AS fully_runnable,
                SUM(missing>0)                                   AS partial_steps_missing
              FROM step_check;"

            # ─── D. AGENT POOL DEPTH ─────────────────────────────────────────
            echo ""
            echo "▼ D. Agent 池深度（16k agents）"
            echo "──────────────────────────────────────────────────────────────"
            run_sql "SELECT
              COUNT(*)                                                          AS total_agents,
              SUM(primarySkill IS NOT NULL AND primarySkill<>'')                AS has_primary_skill,
              SUM(aiModel IS NOT NULL AND aiModel<>'')                          AS has_ai_model,
              COUNT(DISTINCT primarySkill)                                      AS distinct_primary_skills,
              COUNT(DISTINCT aiModel)                                           AS distinct_ai_models,
              SUM(skills IS NOT NULL AND JSON_VALID(skills) AND JSON_LENGTH(skills)>0) AS has_skills_array,
              ROUND(AVG(IF(JSON_VALID(skills), JSON_LENGTH(skills), 0)),2)      AS avg_skills_per_agent
              FROM agents;"

            echo ""
            echo "  ↳ Agent 是 squad lead 還是 squad member 還是孤兒？"
            run_sql "SELECT
              (SELECT COUNT(DISTINCT lead_agent_id) FROM squads WHERE is_active=1 AND lead_agent_id IS NOT NULL) AS distinct_leads,
              (SELECT COUNT(DISTINCT a.id) FROM agents a
                JOIN squads s ON s.is_active=1 AND s.steps IS NOT NULL
                JOIN JSON_TABLE(s.steps,'$[*]' COLUMNS(aid INT PATH '\$.assignedAgentId')) j
                  ON j.aid=a.id
              ) AS in_some_step,
              (SELECT COUNT(*) FROM agents) AS total_agents;"

            # ─── E. SUMMARY VERDICT ──────────────────────────────────────────
            echo ""
            echo "════════════════════════════════════════════════════════════════"
            echo "  ✅ Verdict thresholds"
            echo "  • 任務範本：methodology+description+layer 覆蓋率 ≥95%"
            echo "  • Boardroom：6 層全部有 tier=core，core lead provider buckets ≥3"
            echo "  • /ai run：fully_runnable / total_active ≥80%"
            echo "  • Agent 池：distinct_primary_skills ≥50, distinct_ai_models ≥10"
            echo "════════════════════════════════════════════════════════════════"
