name: Admin — Set Azure Foundry LLM env

# One-shot: write/update AZURE_FOUNDRY_* + LLM_DEFAULT_PROVIDER in the VM .env
# so the backend routes LLM calls to Azure AI Foundry instead of OpenRouter.
#
# The API key is passed as a workflow_dispatch input (masked by GitHub) so it
# never lands in git. After running, redeploy via admin-deploy.yml.

on:
  workflow_dispatch:
    inputs:
      azureApiKey:
        description: 'Azure Foundry API key (will be masked in logs)'
        required: true
        type: string
      azureEndpoint:
        description: 'Azure Foundry project endpoint'
        required: true
        type: string
        default: 'https://sowork-app-production-resource.services.ai.azure.com/api/projects/sowork-app-production'
      defaultProvider:
        description: 'Default LLM provider'
        required: true
        type: choice
        default: azure-foundry
        options:
          - azure-foundry
          - openrouter

jobs:
  set-env:
    runs-on: ubuntu-latest
    steps:
      - name: Mask API key in logs
        run: echo "::add-mask::${{ inputs.azureApiKey }}"

      - uses: appleboy/ssh-action@v1.0.3
        env:
          AZ_KEY: ${{ inputs.azureApiKey }}
          AZ_ENDPOINT: ${{ inputs.azureEndpoint }}
          DEFAULT_PROVIDER: ${{ inputs.defaultProvider }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          envs: AZ_KEY,AZ_ENDPOINT,DEFAULT_PROVIDER
          script: |
            set -e
            ENV_FILE=/opt/marketing-os/app/skills/ai-talent/.env
            test -f "$ENV_FILE" || { echo ".env not found at $ENV_FILE"; exit 1; }

            # Backup once per day
            cp "$ENV_FILE" "$ENV_FILE.bak.$(date +%Y%m%d)" 2>/dev/null || true

            upsert() {
              local key="$1" val="$2"
              if grep -q "^${key}=" "$ENV_FILE"; then
                # Use | delimiter to avoid conflict with URLs
                sed -i "s|^${key}=.*|${key}=${val}|" "$ENV_FILE"
                echo "updated ${key}"
              else
                echo "${key}=${val}" >> "$ENV_FILE"
                echo "added ${key}"
              fi
            }

            upsert AZURE_FOUNDRY_API_KEY "$AZ_KEY"
            upsert AZURE_FOUNDRY_PROJECT_ENDPOINT "$AZ_ENDPOINT"
            upsert LLM_DEFAULT_PROVIDER "$DEFAULT_PROVIDER"

            echo ""
            echo "===== Verification (key value masked) ====="
            grep -E '^(AZURE_FOUNDRY_PROJECT_ENDPOINT|LLM_DEFAULT_PROVIDER|AZURE_FOUNDRY_API_KEY)=' "$ENV_FILE" \
              | sed 's/\(AZURE_FOUNDRY_API_KEY=\).*/\1***REDACTED***/'

            echo ""
            echo "Restarting PM2 to pick up env changes…"
            cd /opt/marketing-os/app/skills/ai-talent
            pm2 restart marketing-os --update-env 2>&1 | tail -10 || true
            sleep 2
            pm2 status | head -10

            echo ""
            echo "Done. Smoke-test by clicking an agent chip in the UI."
