name: Ops — Verify critical prod secrets are present
# 2026-05-14 (P1): confirm key env vars exist on the VM without leaking
# any values. Returns presence boolean per critical key.
on: { workflow_dispatch: {} }
jobs:
  verify:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 1
    steps:
      - run: |
          set +e
          ENV=/opt/onbrand/app/skills/ai-talent/.env
          if [ ! -f "$ENV" ]; then
            echo "❌ $ENV not found"; exit 1
          fi
          echo "── critical env presence (values masked) ──"
          for key in JWT_SECRET LOCAL_DB_PASSWORD RESEND_API_KEY STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_PUBLISHABLE_KEY AZURE_FOUNDRY_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY GOOGLE_AI_KEY PIAPI_KEY; do
            if grep -q "^${key}=" "$ENV"; then
              # Get value length without revealing the value
              len=$(grep "^${key}=" "$ENV" | head -1 | sed "s/^${key}=//" | wc -c)
              echo "  ✓ $key (${len} chars)"
            else
              echo "  ❌ $key MISSING"
            fi
          done
          echo ""
          echo "── runtime check via /health ──"
          curl -sk https://onbrand.sowork.ai/health | python3 -m json.tool 2>/dev/null || curl -sk https://onbrand.sowork.ai/health
