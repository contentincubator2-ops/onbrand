name: Admin — Check sowork-ai-v2 repo info

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 30s
          script: |
            V2=/opt/sowork-ai-v2

            echo "===== git remote ====="
            cd $V2 && git remote -v 2>/dev/null || echo "not a git repo"

            echo ""
            echo "===== git log -3 ====="
            cd $V2 && git log --oneline -3 2>/dev/null

            echo ""
            echo "===== src/App.tsx route list ====="
            grep -n 'path=\|component=' $V2/client/src/App.tsx 2>/dev/null | head -40

            echo ""
            echo "===== DashboardLayout nav items ====="
            grep -n 'path.*:\|labelKey\|consultant\|策略' $V2/client/src/components/DashboardLayout.tsx 2>/dev/null | head -30

            echo ""
            echo "===== server router index ====="
            grep -n 'import\|Router\|router' $V2/server/routes/index.ts 2>/dev/null | head -30
            grep -n 'import\|Router\|router' $V2/server/index.ts 2>/dev/null | head -20
