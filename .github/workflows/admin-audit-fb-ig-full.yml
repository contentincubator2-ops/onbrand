name: Admin — full audit (agent fit + mockup fit) FB & IG

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 1200s
          envs: GH_TOKEN
          script: |
            set +e
            APP=/opt/marketing-os/app
            AI=$APP/skills/ai-talent
            cd "$APP"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/contentincubator2-ops/Marketing-OS.git"
            git fetch origin main 2>&1 | tail -3
            git reset --hard origin/main 2>&1 | tail -3
            cd "$AI"
            set -a; [ -f "$AI/.env" ] && . "$AI/.env"; set +a

            echo "===== 1. Agent-fit audit (FB + IG) ====="
            timeout 600 npx tsx scripts/audit-agent-fit.ts 2>&1 | tail -10

            echo ""
            echo "===== 2. Mockup-fit audit (FB + IG) ====="
            timeout 600 npx tsx scripts/audit-mockup-fit.ts 2>&1 | tail -10

            echo ""
            echo "===== Agent-fit report ====="
            cat /tmp/agent-fit-audit.md 2>/dev/null

            echo ""
            echo "===== Mockup-fit report ====="
            cat /tmp/mockup-fit-audit.md 2>/dev/null

            echo ""
            echo "===== 3. Coverage report (squad/agent/task three-way) ====="
            timeout 120 npx tsx scripts/audit-coverage-report.ts 2>&1 | tail -10

            echo ""
            echo "===== Coverage report ====="
            cat /tmp/coverage-report.md 2>/dev/null
