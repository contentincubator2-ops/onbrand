name: Admin — Force clean rebuild + verify

# CJ「整個網站是空白頁」: public/index.html got out of sync with assets/
# (HTML pointed to stale bundle hash). Force a clean build and verify.

on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 10
    steps:
      - run: |
          set -e
          AI=/opt/marketing-os/app/skills/ai-talent
          cd "$AI"

          echo "── before: public/index.html script tag ──"
          grep -oE 'index-[A-Za-z0-9_-]+\.js' public/index.html | head -3 || true
          echo "── before: assets/ listing ──"
          ls public/assets | grep -E 'index-.*\.js$' | head -3

          echo ""
          echo "── wipe public/ + client/dist/ ──"
          rm -rf public client/dist

          echo ""
          echo "── client install + build ──"
          cd client
          npm install --no-audit --no-fund 2>&1 | tail -5
          npm run build 2>&1 | tail -20

          echo ""
          echo "── copy dist → ../public ──"
          cd "$AI"
          cp -r client/dist public
          ls -la public | head -10
          echo "  assets count: $(ls public/assets | wc -l)"

          echo ""
          echo "── after: public/index.html script tag ──"
          grep -oE 'index-[A-Za-z0-9_-]+\.js' public/index.html | head -3

          echo ""
          echo "── verify: bundle file mentioned in HTML exists ──"
          BUNDLE=$(grep -oE 'index-[A-Za-z0-9_-]+\.js' public/index.html | head -1)
          if [ -f "public/assets/$BUNDLE" ]; then
            echo "  ✓ public/assets/$BUNDLE EXISTS ($(stat -c%s public/assets/$BUNDLE) bytes)"
          else
            echo "  ❌ public/assets/$BUNDLE MISSING"
            exit 1
          fi

          echo ""
          echo "── restart pm2 marketing-os ──"
          pm2 restart marketing-os --update-env

          sleep 3
          echo ""
          echo "── verify localhost:3101 ──"
          curl -s -o /tmp/v.html -w "  http=%{http_code} size=%{size_download}\n" "http://localhost:3101/"
          HTML_BUNDLE=$(grep -oE 'index-[A-Za-z0-9_-]+\.js' /tmp/v.html | head -1)
          echo "  HTML references: $HTML_BUNDLE"

          echo ""
          echo "── verify the bundle URL returns 200 ──"
          curl -s -o /dev/null -w "  /assets/$HTML_BUNDLE → %{http_code} %{size_download} bytes\n" "http://localhost:3101/assets/$HTML_BUNDLE"
