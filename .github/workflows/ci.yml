name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: skills/ai-talent/package-lock.json
      - run: npm ci --prefix skills/ai-talent
      - run: npm run lint --prefix skills/ai-talent
      - run: npm run test --prefix skills/ai-talent
