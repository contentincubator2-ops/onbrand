name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Legacy DB_* (kept for back-compat with older tests)
      DB_HOST: localhost
      DB_USER: test
      DB_PASSWORD: test
      DB_NAME: test
      # LOCAL_DB_* — the actual env vars db.ts / localDb.ts read.
      # Required after B-02 removed the hardcoded DB-password fallback.
      LOCAL_DB_HOST: localhost
      LOCAL_DB_PORT: "3306"
      LOCAL_DB_USER: test
      LOCAL_DB_PASSWORD: test
      LOCAL_DB_NAME: test
      JWT_SECRET: ci-test-secret-at-least-32-chars-long
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install server dependencies
        run: npm install --prefix skills/ai-talent
      - name: Install client dependencies
        run: npm install --prefix skills/ai-talent/client
      - name: Type check — server
        run: npm run typecheck --prefix skills/ai-talent
      - name: Type check — client
        run: cd skills/ai-talent/client && npx tsc --noEmit
      - name: Boundary guard — client/server
        run: ./scripts/check-client-server-boundary.sh
      - name: Run tests
        run: npm run test --prefix skills/ai-talent

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # 2026-07-07: two pushes 14s apart ran `npm install` concurrently on the
    # VM and corrupted client/node_modules (ENOTEMPTY). Serialize deploys —
    # a superseded pending deploy is safe to drop because each deploy does
    # `git reset --hard origin/main` (always ships the newest commit).
    concurrency:
      group: deploy-vm
      cancel-in-progress: false
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 1500s
          envs: GH_TOKEN
          script: |
            set -e
            APP=/opt/onbrand/app
            AI=$APP/skills/ai-talent

            echo "===== Pull latest code ====="
            cd "$APP"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/contentincubator2-ops/onbrand.git"
            git fetch origin main && git reset --hard origin/main
            echo "Latest commit: $(git log --oneline -1)"

            echo "===== Install backend ====="
            cd "$AI"
            npm install --legacy-peer-deps 2>&1 | tail -3

            echo "===== Run DB migrations ====="
            # Idempotent: each ALTER/CREATE checks information_schema first.
            # Failure does NOT abort deploy — schema fixes can be retried via
            # admin-run-migrations workflow if something goes wrong.
            set -a; source "$AI/.env" 2>/dev/null; set +a
            (cd "$AI" && npx tsx scripts/migrate.ts 2>&1 | tail -30) || {
              echo "⚠️  migrations had issues — deploy continues, fix via admin-run-migrations workflow"
            }

            echo "===== Install frontend (force clean + include devDeps) ====="
            cd "$AI/client"
            rm -rf node_modules .tsbuildinfo tsconfig.tsbuildinfo 2>/dev/null || true
            # VM exports NODE_ENV=production globally → npm skips
            # devDependencies (vite, @vitejs/plugin-react etc). Override
            # with --include=dev so the build toolchain installs.
            NODE_ENV=development npm install --legacy-peer-deps --include=dev 2>&1 | tail -10

            echo "===== Verify critical deps ====="
            ls node_modules/@vitejs/plugin-react/package.json 2>&1 || echo "✗ @vitejs/plugin-react MISSING"
            ls node_modules/vite/package.json 2>&1 || echo "✗ vite MISSING"

            echo "===== Build frontend (atomic) ====="
            # Build into a temp dir. The live public/ is never touched until
            # the build succeeds — a timeout or TS error keeps old bundle intact.
            BUILD_TMP="$AI/public_build_tmp"
            rm -rf "$BUILD_TMP"

            # Full build = tsc + vite. Now that devDeps install correctly
            # (NODE_ENV=development override above), @types/react resolves
            # and tsc finds JSX intrinsics.
            npm run build -- --outDir "$BUILD_TMP" --emptyOutDir 2>&1 | tail -30

            NEW_HASH=$(grep -oE 'index-[A-Za-z0-9_-]+\.js' "$BUILD_TMP/index.html" 2>/dev/null | head -1)
            if [ -z "$NEW_HASH" ]; then
              echo "❌ Build failed — index.html not produced. Keeping old public/ intact."
              rm -rf "$BUILD_TMP"
              exit 1
            fi
            echo "✓ Built: $NEW_HASH"

            # Atomic swap: only now do we touch the live public/
            rm -rf "$AI/public/assets" "$AI/public/index.html"
            cp -a "$BUILD_TMP/." "$AI/public/"
            rm -rf "$BUILD_TMP"
            echo "✓ public/ swapped"

            echo "===== Clear compiled artifacts (stale dist/ can shadow .ts source) ====="
            rm -rf "$AI/dist" 2>/dev/null || true

            echo "===== Verify imageRouter enum includes gpt-image-2 ====="
            grep -c "gpt-image-2" "$AI/server/routers/imageRouter.ts" && echo "✓ gpt-image-2 present in imageRouter.ts" || echo "✗ gpt-image-2 MISSING from imageRouter.ts"

            echo "===== Restart PM2 ====="
            set -a
            source "$AI/.env"
            set +a
            echo "JWT_SECRET present: $([ -n "$JWT_SECRET" ] && echo YES || echo NO)"

            cd "$AI"
            pm2 startOrReload ecosystem.config.cjs --update-env

            echo "===== Verify PM2 guardrails ====="
            PM2_JLIST="$(pm2 jlist)" node <<'NODE'
            const processes = JSON.parse(process.env.PM2_JLIST || '[]');
            const onbrand = processes.filter((process) => process.name === 'onbrand');
            const failures = [];

            if (onbrand.length !== 1) {
              failures.push(`expected exactly one onbrand process, found ${onbrand.length}`);
            }

            if (onbrand.length > 0) {
              const env = onbrand[0].pm2_env || {};
              const nodeArgs = Array.isArray(env.node_args)
                ? env.node_args
                : String(env.node_args || '').trim().split(/\s+/).filter(Boolean);
              const expectedMemory = 3 * 1024 * 1024 * 1024;

              if (Number(env.max_memory_restart) !== expectedMemory) {
                failures.push(`max_memory_restart=${env.max_memory_restart}; expected ${expectedMemory} bytes (3G)`);
              }
              if (nodeArgs.length !== 1 || nodeArgs[0] !== '--max-old-space-size=2048') {
                failures.push(`node_args=${JSON.stringify(env.node_args)}; expected --max-old-space-size=2048`);
              }
              if (env.exec_mode !== 'fork_mode') {
                failures.push(`exec_mode=${env.exec_mode}; expected fork_mode`);
              }
              if (Number(env.instances) !== 1) {
                failures.push(`instances=${env.instances}; expected 1`);
              }
              if (env.status !== 'online') {
                failures.push(`status=${env.status}; expected online`);
              }
            }

            if (failures.length > 0) {
              console.error('❌ PM2 guardrail verification failed:');
              failures.forEach((failure) => console.error(`  - ${failure}`));
              process.exit(1);
            }

            console.log('✓ onbrand: 3G RSS restart, 2048MB old-space, fork mode, one online instance');
            NODE
            pm2 save --force

            echo "===== Health check ====="
            sleep 5
            pm2 list | head -5
            curl -s -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:3101/health || true

            echo "===== PM2 error log (last 20 lines) ====="
            tail -20 ~/.pm2/logs/onbrand-error.log 2>/dev/null || true
