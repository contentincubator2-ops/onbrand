name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Legacy DB_* (kept for back-compat with older tests)
      DB_HOST: localhost
      DB_USER: test
      DB_PASSWORD: test
      DB_NAME: test
      # LOCAL_DB_* — the actual env vars db.ts / localDb.ts read.
      # Required after B-02 removed the hardcoded "mos_secure_2026" fallback.
      LOCAL_DB_HOST: localhost
      LOCAL_DB_PORT: "3306"
      LOCAL_DB_USER: test
      LOCAL_DB_PASSWORD: test
      LOCAL_DB_NAME: test
      JWT_SECRET: ci-test-secret-at-least-32-chars-long
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install server dependencies
        run: npm install --prefix skills/ai-talent
      - name: Install client dependencies
        run: npm install --prefix skills/ai-talent/client
      - name: Type check — server
        run: npm run lint --prefix skills/ai-talent
      - name: Type check — client
        run: cd skills/ai-talent/client && npx tsc --noEmit
      - name: Run tests
        run: npm run test --prefix skills/ai-talent

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 660s
          envs: GH_TOKEN
          script: |
            set -e
            APP=/opt/marketing-os/app
            AI=$APP/skills/ai-talent

            echo "===== Pull latest code ====="
            cd "$APP"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/contentincubator2-ops/Marketing-OS.git"
            git fetch origin main && git reset --hard origin/main
            echo "Latest commit: $(git log --oneline -1)"

            echo "===== Install backend ====="
            cd "$AI"
            npm install --legacy-peer-deps 2>&1 | tail -3

            echo "===== Run DB migrations ====="
            # Idempotent: each ALTER/CREATE checks information_schema first.
            # Failure does NOT abort deploy — schema fixes can be retried via
            # admin-run-migrations workflow if something goes wrong.
            set -a; source "$AI/.env" 2>/dev/null; set +a
            (cd "$AI" && npx tsx scripts/migrate.ts 2>&1 | tail -30) || {
              echo "⚠️  migrations had issues — deploy continues, fix via admin-run-migrations workflow"
            }

            echo "===== Install frontend ====="
            cd "$AI/client"
            # Clear any TS incremental cache that may be out of sync with
            # current source tree (was causing JSX.IntrinsicElements
            # resolution failures on SquadLabPage despite local tsc passing).
            rm -rf node_modules/.cache .tsbuildinfo tsconfig.tsbuildinfo 2>/dev/null || true
            npm install --legacy-peer-deps 2>&1 | tail -3

            echo "===== Build frontend (atomic) ====="
            # Build into a temp dir. The live public/ is never touched until
            # the build succeeds — a timeout or TS error keeps old bundle intact.
            BUILD_TMP="$AI/public_build_tmp"
            rm -rf "$BUILD_TMP"

            # Use build:fast (vite-only, skip tsc). The 'test' job above
            # already runs full tsc on both server + client and blocks the
            # deploy if type-checks fail. Running tsc again on the VM
            # caused intermittent TS7026 errors due to peer-dep resolution
            # drift (@types/react). Vite's swc transform is enough for
            # production builds — type errors are caught earlier.
            npm run build:fast -- --outDir "$BUILD_TMP" --emptyOutDir 2>&1 | tail -20

            NEW_HASH=$(grep -oE 'index-[A-Za-z0-9_-]+\.js' "$BUILD_TMP/index.html" 2>/dev/null | head -1)
            if [ -z "$NEW_HASH" ]; then
              echo "❌ Build failed — index.html not produced. Keeping old public/ intact."
              rm -rf "$BUILD_TMP"
              exit 1
            fi
            echo "✓ Built: $NEW_HASH"

            # Atomic swap: only now do we touch the live public/
            rm -rf "$AI/public/assets" "$AI/public/index.html"
            cp -a "$BUILD_TMP/." "$AI/public/"
            rm -rf "$BUILD_TMP"
            echo "✓ public/ swapped"

            echo "===== Restart PM2 ====="
            TSX=$AI/node_modules/.bin/tsx
            set -a
            source "$AI/.env"
            set +a
            echo "JWT_SECRET present: $([ -n "$JWT_SECRET" ] && echo YES || echo NO)"

            pm2 delete marketing-os 2>/dev/null || true
            pm2 start "$TSX" --name marketing-os --cwd "$AI" --update-env -- server/index.ts
            pm2 save --force

            echo "===== Health check ====="
            sleep 5
            pm2 list | head -5
            curl -s -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:3101/health || true

            echo "===== PM2 error log (last 20 lines) ====="
            tail -20 ~/.pm2/logs/marketing-os-error.log 2>/dev/null || true
