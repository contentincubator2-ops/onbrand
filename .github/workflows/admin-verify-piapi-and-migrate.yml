name: Admin — verify PiAPI + migrate preferredModelTags

# One-shot VERIFY job. Runs on the VM:
#   1. npx tsx scripts/migrate.ts            (adds agents.preferredModelTags + squads.preferredModelTags)
#   2. PIAPI_KEY=... verify-piapi.ts         (Ideogram image + Kling v2 video round-trip)
#   3. Reports back which piapi/* models actually work, so we know whether
#      to flip any to status="soon" or fix PIAPI_MAP task_types.
#
# Trigger via:  gh workflow run "Admin — verify PiAPI + migrate preferredModelTags"

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          PIAPI_KEY: ${{ secrets.PI_API_KEY }}
          ATLAS_CLOUD_API: ${{ secrets.ATLAS_CLOUD_API }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 600s
          envs: PIAPI_KEY,ATLAS_CLOUD_API
          script: |
            set +e
            cd /opt/marketing-os/app/skills/ai-talent || cd /opt/marketing-os/skills/ai-talent

            echo "===== 0. Pull latest ====="
            cd /opt/marketing-os && git pull --ff-only 2>&1 | tail -5
            cd /opt/marketing-os/app/skills/ai-talent 2>/dev/null || cd /opt/marketing-os/skills/ai-talent

            echo ""
            echo "===== 1. Run migrate.ts ====="
            # Load .env so DB_* vars are present
            set -a
            [ -f .env ] && . .env
            [ -f /opt/marketing-os/app/skills/ai-talent/.env ] && . /opt/marketing-os/app/skills/ai-talent/.env
            [ -f /opt/marketing-os/skills/ai-talent/.env ] && . /opt/marketing-os/skills/ai-talent/.env
            set +a
            npx tsx scripts/migrate.ts 2>&1 | tail -50

            echo ""
            echo "===== 2. DDL audit — preferredModelTags columns ====="
            DB_HOST_V=${DB_HOST:-127.0.0.1}
            DB_USER_V=${DB_USER:-root}
            DB_NAME_V=${DB_NAME:-mos_db}
            MYSQL_PWD="$DB_PASSWORD" mysql -h"$DB_HOST_V" -u"$DB_USER_V" "$DB_NAME_V" -t -e "
              SELECT TABLE_NAME, COLUMN_NAME, DATA_TYPE
                FROM information_schema.COLUMNS
               WHERE TABLE_SCHEMA = DATABASE()
                 AND COLUMN_NAME = 'preferredModelTags';
            " 2>&1

            echo ""
            echo "===== 3. Persist PIAPI_KEY + ATLAS_CLOUD_API to VM .env ====="
            # The keys come in via the SSH action's `envs:` passthrough.
            # We write them to BOTH common .env locations so the running server
            # picks them up after the next restart, and the verify script below
            # can read them inline.
            for envfile in /opt/marketing-os/.env /opt/marketing-os/app/skills/ai-talent/.env /opt/marketing-os/skills/ai-talent/.env; do
              [ -d "$(dirname $envfile)" ] || continue
              # Idempotent upsert: remove existing line, append fresh value
              if [ -n "$PIAPI_KEY" ]; then
                sudo sed -i '/^PIAPI_KEY=/d;/^PI_API_KEY=/d' "$envfile" 2>/dev/null
                echo "PIAPI_KEY=$PIAPI_KEY" | sudo tee -a "$envfile" >/dev/null
              fi
              if [ -n "$ATLAS_CLOUD_API" ]; then
                sudo sed -i '/^ATLAS_CLOUD_API=/d;/^ATLAS_CLOUD_API_KEY=/d' "$envfile" 2>/dev/null
                echo "ATLAS_CLOUD_API=$ATLAS_CLOUD_API" | sudo tee -a "$envfile" >/dev/null
              fi
              echo "  upserted into $envfile"
            done
            # Restart server so the new keys are picked up
            sudo systemctl restart marketing-os 2>&1 | head -3 || \
              pm2 restart marketing-os 2>&1 | head -3 || \
              echo "  (no systemd / pm2 service found — manual restart may be needed)"

            echo ""
            echo "===== 4. PIAPI_KEY presence check ====="
            if [ -z "$PIAPI_KEY" ]; then
              echo "✗ PIAPI_KEY (from secret PI_API_KEY) is empty. Verify GitHub secret is set."
              exit 0
            fi
            echo "✓ PIAPI_KEY present (length=${#PIAPI_KEY})"
            echo "✓ ATLAS_CLOUD_API present (length=${#ATLAS_CLOUD_API})"

            echo ""
            echo "===== 5. Run verify-piapi.ts ====="
            # 8-min cap — Kling video can take 3-4 min
            timeout 480 env PIAPI_KEY="$PIAPI_KEY" npx tsx scripts/verify-piapi.ts 2>&1 | tail -80

            echo ""
            echo "===== 6. Output files ====="
            ls -lh /tmp/piapi-*.* 2>&1 | head -10

            echo ""
            echo "===== Done ====="
