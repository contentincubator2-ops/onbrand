name: Admin — Nullify old agent avatars

on:
  workflow_dispatch:

jobs:
  nullify-avatars:
    runs-on: ubuntu-latest
    steps:
      - name: Run nullify-old-avatars on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 120s
          script: |
            AI=/opt/marketing-os/app/skills/ai-talent
            cd "$AI"
            set -a
            source "$AI/.env"
            set +a
            echo "── Running nullify-old-avatars ──"
            npx tsx server/scripts/nullify-old-avatars.ts
            echo "── Done ──"
