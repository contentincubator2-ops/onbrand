name: Admin — Backfill agent DiceBear notionists avatars

on:
  workflow_dispatch:

jobs:
  backfill-avatars:
    runs-on: ubuntu-latest
    steps:
      - name: Run backfill-agent-avatars on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 300s
          script: |
            AI=/opt/marketing-os/app/skills/ai-talent
            cd "$AI"
            set -a
            source "$AI/.env"
            set +a
            echo "── Running backfill-agent-avatars ──"
            npx tsx server/scripts/backfill-agent-avatars.ts
            echo "── Done ──"
