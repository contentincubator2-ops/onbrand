name: Admin — Cleanup Legacy Squads (IDs 1-46)

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: SSH & deactivate legacy squads
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            set -e
            cd /home/azureuser/marketing-os
            npm run db:cleanup-legacy --prefix skills/ai-talent
