name: Admin — Rebuild Archetype Squad Agent Profiles

# Full rebuild of primarySkill + specialty + aiModel for all 6 agents
# Based on revised plan: step-name-aligned skills + output-specific specialties
#
# Changes:
#   180797 Mary Allen  → primarySkill: brand-archetype-positioning (Lead / Intake+Synthesis)
#   30003  王志豪      → primarySkill: brand-personality-audit      + model: DeepSeek-R1-0528
#   180299 陳怡君      → primarySkill: archetype-selection          (keep DeepSeek-R1-0528)
#   220839 陳哲宇      → primarySkill: brand-voice-guide            (keep claude-sonnet-4-6)
#   229484 余佳穎      → primarySkill: visual-experience-direction  (keep qwen/qwen-vl-max)
#   39     徐俊偉      → primarySkill: omnichannel-consistency-audit + model: claude-sonnet-4-6

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'AUDIT = show current vs target | APPLY = write to DB'
        required: true
        default: 'AUDIT'

jobs:
  rebuild-profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            MOS_USER="mos_user"
            MOS_PASS="mos_secure_2026"
            MOS_DB="mos_db"
            MODE="${{ github.event.inputs.mode }}"

            echo "======================================================"
            echo "Archetype Squad — Agent Profile Rebuild ($MODE)"
            echo "======================================================"

            echo ""
            echo "=== Current state (before changes) ==="
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
              SELECT id, name, aiModel, primarySkill, LEFT(specialty,80) AS specialty_preview
              FROM agents
              WHERE id IN (180797, 30003, 180299, 220839, 229484, 39)
              ORDER BY FIELD(id, 180797, 30003, 180299, 220839, 229484, 39);
            " 2>&1

            echo ""
            echo "=== Target profile mapping ==="
            echo "  180797 Mary Allen  → [KEEP model: MAI-DS-R1]"
            echo "                       primarySkill: brand-archetype-positioning"
            echo "                       specialty: intake-synthesis, archetype-framework, jungian-12-archetypes,"
            echo "                                  brand-strategy, brand-identity, brand-positioning,"
            echo "                                  squad-coordination, client-briefing, final-synthesis,"
            echo "                                  archetype-rationale, strategic-oversight"
            echo ""
            echo "  30003  王志豪      → [UPGRADE model: Meta-Llama-3.1-70B → DeepSeek-R1-0528]"
            echo "                       primarySkill: brand-personality-audit"
            echo "                       specialty: brand-personality-audit, voice-spectrum-analysis (4-axis),"
            echo "                                  archetype-scoring (12 archetypes 1-10),"
            echo "                                  formal-informal-spectrum, serious-playful-spectrum,"
            echo "                                  respectful-irreverent-spectrum, simple-technical-spectrum,"
            echo "                                  sentiment-classification, internal-external-gap-analysis,"
            echo "                                  evidence-citation, octolens-integration, json-schema-output"
            echo ""
            echo "  180299 陳怡君      → [KEEP model: DeepSeek-R1-0528]"
            echo "                       primarySkill: archetype-selection"
            echo "                       specialty: archetype-selection, jungian-12-archetypes,"
            echo "                                  primary-secondary-archetype, aspirational-vs-current,"
            echo "                                  competitive-archetype-mapping, archetype-rationale,"
            echo "                                  brand-dna, emotional-branding, audience-psychology,"
            echo "                                  archetype-positioning, brand-identity, brand-strategy"
            echo ""
            echo "  220839 陳哲宇      → [KEEP model: claude-sonnet-4-6]"
            echo "                       primarySkill: brand-voice-guide"
            echo "                       specialty: brand-voice-guide, tone-of-voice, 5-copy-principles,"
            echo "                                  this-but-not-that, do-dont-guidelines, platform-playbooks,"
            echo "                                  mailchimp-copy-structure, slack-messaging-style,"
            echo "                                  channel-specific-tone, vocabulary-dos-donts,"
            echo "                                  slogan-creation, brand-naming, copywriting"
            echo ""
            echo "  229484 余佳穎      → [KEEP model: qwen/qwen-vl-max]"
            echo "                       primarySkill: visual-experience-direction"
            echo "                       specialty: visual-experience-direction, visual-identity,"
            echo "                                  competitor-visual-analysis, color-system-design,"
            echo "                                  typography-personality, photography-style-guide,"
            echo "                                  layout-preference, ux-design-principles,"
            echo "                                  moodboard-direction, visual-brief-writing,"
            echo "                                  image-understanding, reference-image-analysis,"
            echo "                                  creative-direction, brand-design"
            echo ""
            echo "  39     徐俊偉      → [UPGRADE model: Llama-3.2-11B-Vision → claude-sonnet-4-6]"
            echo "                       primarySkill: omnichannel-consistency-audit"
            echo "                       specialty: omnichannel-consistency-audit, consistency-scorecard,"
            echo "                                  brand-guideline-compliance, channel-analysis (website/email/linkedin/fb/ig),"
            echo "                                  violation-detection, p0-p1-p2-prioritization,"
            echo "                                  visual-consistency, voice-consistency, archetype-alignment-scoring,"
            echo "                                  facebook-pages-integration, brand-book-analysis,"
            echo "                                  long-context-analysis, multi-modal-analysis,"
            echo "                                  quarterly-audit-automation, slack-trigger-integration"

            if [ "$MODE" = "APPLY" ]; then
              echo ""
              echo "======================================================"
              echo "APPLYING all profile updates..."
              echo "======================================================"

              # ── 180797 Mary Allen — Lead: Intake + Synthesis ──────────────
              # Model: keep MAI-DS-R1 (no change)
              mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
                UPDATE agents SET
                  primarySkill = 'brand-archetype-positioning',
                  specialty    = 'brand-archetype-positioning, intake-synthesis, archetype-framework, jungian-12-archetypes, brand-strategy, brand-identity, brand-positioning, squad-coordination, client-briefing, final-synthesis, archetype-rationale, strategic-oversight, brand-personality, brand-archetype'
                WHERE id = 180797;
              " 2>&1
              echo "✅ 180797 Mary Allen — primarySkill: brand-archetype-positioning (MAI-DS-R1 unchanged)"

              # ── 30003 王志豪 — Step 1: 現有品牌人格診斷 ──────────────────
              # UPGRADE: Meta-Llama-3.1-70B-Instruct-4 → DeepSeek-R1-0528
              mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
                UPDATE agents SET
                  aiModel      = 'DeepSeek-R1-0528',
                  primarySkill = 'brand-personality-audit',
                  specialty    = 'brand-personality-audit, voice-spectrum-analysis, archetype-scoring, sentiment-classification, formal-informal-spectrum, serious-playful-spectrum, respectful-irreverent-spectrum, simple-technical-spectrum, evidence-citation, internal-external-gap-analysis, octolens-integration, json-schema-output, brand-communication-audit, competitive-analysis, consumer-insights, audience-analysis, brand-perception, market-research'
                WHERE id = 30003;
              " 2>&1
              echo "✅ 30003  王志豪  — primarySkill: brand-personality-audit (Llama→DeepSeek-R1-0528)"

              # ── 180299 陳怡君 — Step 2: 原型選擇與組合 ───────────────────
              # Model: keep DeepSeek-R1-0528
              mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
                UPDATE agents SET
                  primarySkill = 'archetype-selection',
                  specialty    = 'archetype-selection, jungian-12-archetypes, primary-secondary-archetype, aspirational-vs-current, competitive-archetype-mapping, archetype-rationale, brand-dna, emotional-branding, audience-psychology, archetype-positioning, brand-identity, brand-strategy, brand-archetype, archetype-selection-rationale'
                WHERE id = 180299;
              " 2>&1
              echo "✅ 180299 陳怡君  — primarySkill: archetype-selection (DeepSeek-R1-0528 unchanged)"

              # ── 220839 陳哲宇 — Step 3: 品牌聲音指南 ────────────────────
              # Model: keep claude-sonnet-4-6
              mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
                UPDATE agents SET
                  primarySkill = 'brand-voice-guide',
                  specialty    = 'brand-voice-guide, tone-of-voice, 5-copy-principles, this-but-not-that, do-dont-guidelines, platform-playbooks, mailchimp-copy-structure, slack-messaging-style, channel-specific-tone, vocabulary-dos-donts, slogan-creation, brand-naming, copywriting, brand-narrative, content-strategy, brand-voice, messaging'
                WHERE id = 220839;
              " 2>&1
              echo "✅ 220839 陳哲宇  — primarySkill: brand-voice-guide (claude-sonnet-4-6 unchanged)"

              # ── 229484 余佳穎 — Step 4: 視覺與體驗方向 ──────────────────
              # Model: keep qwen/qwen-vl-max
              mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
                UPDATE agents SET
                  primarySkill = 'visual-experience-direction',
                  specialty    = 'visual-experience-direction, visual-identity, competitor-visual-analysis, color-system-design, typography-personality, photography-style-guide, layout-preference, ux-design-principles, moodboard-direction, visual-brief-writing, image-understanding, reference-image-analysis, creative-direction, brand-design, design-strategy, visual-identity-director'
                WHERE id = 229484;
              " 2>&1
              echo "✅ 229484 余佳穎  — primarySkill: visual-experience-direction (qwen/qwen-vl-max unchanged)"

              # ── 39 徐俊偉 — Step 5: 全通路原型一致性稽核 ────────────────
              # UPGRADE: Llama-3.2-11B-Vision-Instruct-2 → claude-sonnet-4-6
              mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
                UPDATE agents SET
                  aiModel      = 'claude-sonnet-4-6',
                  primarySkill = 'omnichannel-consistency-audit',
                  specialty    = 'omnichannel-consistency-audit, consistency-scorecard, brand-guideline-compliance, channel-analysis, violation-detection, p0-p1-p2-prioritization, visual-consistency, voice-consistency, archetype-alignment-scoring, facebook-pages-integration, linkedin-audit, website-analysis, email-template-audit, long-context-analysis, multi-modal-analysis, quarterly-audit-automation, slack-trigger-integration, brand-book-analysis, brand-strategy, brand-identity, brand-audit'
                WHERE id = 39;
              " 2>&1
              echo "✅ 39     徐俊偉  — primarySkill: omnichannel-consistency-audit (Llama-Vision→claude-sonnet-4-6)"

              echo ""
              echo "=== Verification: all 6 agents after rebuild ==="
              mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
                SELECT id, name, aiModel, primarySkill, LEFT(specialty, 90) AS specialty_preview
                FROM agents
                WHERE id IN (180797, 30003, 180299, 220839, 229484, 39)
                ORDER BY FIELD(id, 180797, 30003, 180299, 220839, 229484, 39);
              " 2>&1

              echo ""
              echo "======================================================"
              echo "✅ All 6 agent profiles rebuilt."
              echo ""
              echo "Model changes applied:"
              echo "  30003  王志豪 : Meta-Llama-3.1-70B-Instruct-4  → DeepSeek-R1-0528"
              echo "  39     徐俊偉 : Llama-3.2-11B-Vision-Instruct-2 → claude-sonnet-4-6"
              echo ""
              echo "primarySkill now matches step name:"
              echo "  180797 → brand-archetype-positioning (Lead)"
              echo "  30003  → brand-personality-audit     (Step 1: 現有品牌人格診斷)"
              echo "  180299 → archetype-selection         (Step 2: 原型選擇與組合)"
              echo "  220839 → brand-voice-guide           (Step 3: 品牌聲音指南)"
              echo "  229484 → visual-experience-direction (Step 4: 視覺與體驗方向)"
              echo "  39     → omnichannel-consistency-audit (Step 5: 全通路原型一致性稽核)"
              echo "======================================================"

            else
              echo ""
              echo "AUDIT complete."
              echo "Run with mode=APPLY to write all changes to DB."
              echo "======================================================"
            fi
