name: Admin — Rebalance squad lead aiModel (RELAXED)

# Phase-2 rebalance for the 483 "no candidate" squads. Adds three fallback
# strategies in order: (1) promote an existing squad member with a target-
# family aiModel, (2) skill-token overlap, (3) skills-JSON contains.
# Author-locked squads still skipped.
#
# Default = dry-run.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Show planned swaps only"
        type: boolean
        default: true
      layer:
        description: "Limit to one layer (L1_brand / ... / blank=all)"
        type: string
        default: ""
      apply_cap:
        description: "Hard cap on number of swaps"
        type: string
        default: "500"

jobs:
  rebalance:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          LAYER: ${{ inputs.layer }}
          CAP: ${{ inputs.apply_cap }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 600s
          envs: GH_TOKEN,DRY_RUN,LAYER,CAP
          script: |
            set -e
            APP=/opt/marketing-os/app
            REPO="https://x-access-token:${GH_TOKEN}@github.com/contentincubator2-ops/Marketing-OS.git"
            cd "$APP"
            git remote set-url origin "$REPO"
            git fetch origin main
            git reset --hard origin/main
            cd "$APP/skills/ai-talent"
            if [ ! -d node_modules ]; then npm install --legacy-peer-deps --no-audit --no-fund 2>&1 | tail -5; fi
            ARGS=""
            if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
            if [ -n "$LAYER" ]; then ARGS="$ARGS --layer=$LAYER"; fi
            if [ -n "$CAP" ]; then ARGS="$ARGS --apply-cap=$CAP"; fi
            echo "════════════════════════════════════════════════════════════════"
            echo "  ⚖️  RELAXED Rebalance squad lead aiModel  (args: $ARGS)"
            echo "════════════════════════════════════════════════════════════════"
            npx tsx scripts/rebalance-lead-aimodel-relaxed.ts $ARGS
