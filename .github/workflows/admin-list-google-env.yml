name: Admin — List Google/Gemini/Vertex env keys

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 30s
          script: |
            cd /opt/marketing-os/app/skills/ai-talent
            echo "▼ Keys matching GOOGLE / GEMINI / VERTEX / GCP / GCLOUD in .env:"
            grep -E '^(GOOGLE|GEMINI|VERTEX|GCP|GCLOUD)' .env 2>/dev/null | sed 's/=.*/=<set>/' || echo "(none)"
            echo ""
            echo "▼ All distinct env key prefixes in .env:"
            grep -E '^[A-Z_]+=' .env 2>/dev/null | cut -d= -f1 | sort -u
