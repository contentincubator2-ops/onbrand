name: Admin — Simulate user's exact HTTP runOrchestra request

on:
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 180s
          script: |
            cd /opt/marketing-os/app/skills/ai-talent

            COOKIE='mos_session=eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxOTkiLCJvcGVuSWQiOiJoUGRNTXBNOWpNRDdEUXZBR19QUk9TYi1zRGw4bFRmYyIsImlhdCI6MTc3Nzk0Nzk3MywiZXhwIjoxODA5NDgzOTczfQ.ffZWP9Ajog__s5xC4e8fuFjruX1zm89Trg42Ayw4BCA'

            echo "════════ Mark log boundary BEFORE request ════════"
            BEFORE=$(date '+%Y-%m-%d %H:%M:%S')
            echo "BEFORE=$BEFORE"

            echo ""
            echo "════════ POST /trpc/quickTask.runOrchestra (fb-30-caption-short) ════════"
            BODY='{"0":{"json":{"taskId":"fb-30-caption-short","inputs":{"topic":"粉紅健走 5/9 花博公園 健力湯試喝"},"brandId":2832}}}'

            curl -sS --max-time 120 \
              -X POST \
              "http://localhost:3101/trpc/quickTask.runOrchestra?batch=1" \
              -H "Content-Type: application/json" \
              -H "Cookie: $COOKIE" \
              -d "$BODY" \
              -w "\n\n══ HTTP %{http_code} time %{time_total}s ══\n" \
              2>&1 | tee /tmp/orchestra-resp.txt | head -c 3000
            echo ""
            echo "(response truncated to 3000 bytes)"

            echo ""
            echo "════════ pm2 log lines AFTER mark ════════"
            pm2 logs marketing-os --lines 200 --nostream --raw 2>&1 | tail -120 | grep -E "$BEFORE|2026-05-09T1[6-9]:|caption|orchestra|anthropic|llmRouter|invokeLLM|multiModelRouter|provider|失敗|aborted|error|Anthropic|HTTP|model|outputId|recordTaskRun" | tail -60

            echo ""
            echo "════════ If response had outputId, query the row ════════"
            export MYSQL_PWD="mos_secure_2026"
            OUT_ID=$(grep -oE '"outputId":[0-9]+' /tmp/orchestra-resp.txt | head -1 | cut -d: -f2)
            if [ -n "$OUT_ID" ]; then
              echo "outputId=$OUT_ID — querying:"
              mysql -h localhost -u mos_user mos_db -e "
                SELECT id, platform, outputType,
                  JSON_UNQUOTE(JSON_EXTRACT(metadata, '\$.taskId')) AS taskId,
                  CHAR_LENGTH(content) AS content_len
                FROM mission_outputs WHERE id=$OUT_ID
              "
            else
              echo "No outputId in response — failure path"
            fi
