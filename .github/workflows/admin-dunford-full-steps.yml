name: Admin — View Dunford Full Steps

on:
  workflow_dispatch:

jobs:
  view:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            MOS_USER="mos_user"
            MOS_PASS="mos_secure_2026"
            MOS_DB="mos_db"

            echo "=== Dunford 5-step full content ==="
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -N -e "
              SELECT steps FROM squad_workflow_templates
              WHERE taskType = 'brand-dunford-positioning' LIMIT 1;
            " | python3 -m json.tool 2>&1 | head -80

            echo ""
            echo "=== Agents assigned to Dunford squad ==="
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
              SELECT agents FROM squads WHERE slug='brand-dunford-positioning'
            " 2>&1 | python3 -m json.tool 2>&1 | head -30 || true
