name: "Ops — Gusheng preflight (read-only)"

# 2026-09-02 (CJ「在 sowork@sowork.tw 帳號下建立盛全工業品牌 + 客製任務卡」
# 以及「請從 mos_db 當中，選擇適合的 agent」):
# 建品牌與寫 brandPack 之前的唯讀盤點。
#
# Round 1：owner userId=1237889 存在、全站沒有同名的盛全、16116 位 agent 裡
#          taskSystemPrompt >= 2200 字的是 0 位。
# Round 2：全庫只有 10 位寫了 taskSystemPrompt，最長 1965 字；pool 裡沒有任何
#          製造／紡織／OEM 屬性的 agent，B2B 命中的全是 SaaS 與電商。
# Round 3（本次）：要為 8 位 agent 補人設到 2200 字，先看現有那 10 份的寫法
#          與語言慣例，新寫的才不會跟既有的長成兩種東西。
#
# 純 SELECT，沒有任何寫入。

on:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Dump an existing persona to learn the house convention
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 120s
          script: |
            set -e
            cd /opt/onbrand/app/skills/ai-talent
            set -a; source .env 2>/dev/null; set +a
            node -e "
              const mysql = require('mysql2/promise');
              (async () => {
                const conn = await mysql.createConnection({
                  host: process.env.LOCAL_DB_HOST || '127.0.0.1',
                  port: Number(process.env.LOCAL_DB_PORT || 3306),
                  user: process.env.LOCAL_DB_USER || 'mos_user',
                  password: process.env.LOCAL_DB_PASSWORD,
                  database: process.env.LOCAL_DB_NAME || 'mos_db',
                });

                const [full] = await conn.execute(
                  'SELECT id, name, title, taskSystemPrompt FROM agents WHERE id = 239194'
                );
                console.log('===== K. FULL PERSONA OF AGENT 239194 (house convention) =====');
                console.log(full[0]?.taskSystemPrompt || '(empty)');

                const targets = [30002, 210266, 180143, 180162, 60005, 180173, 221080, 31];
                const [t] = await conn.query(
                  'SELECT id, name, englishName, title, layer, LEFT(COALESCE(bio,\'\'),200) AS bio, LEFT(COALESCE(specialty,\'\'),200) AS specialty, LEFT(COALESCE(methodology,\'\'),200) AS methodology, CHAR_LENGTH(COALESCE(taskSystemPrompt,\'\')) AS promptLen FROM agents WHERE id IN (?) ORDER BY FIELD(id, 30002,210266,180143,180162,60005,180173,221080,31)',
                  [targets],
                );
                console.log('');
                console.log('===== L. THE 8 AGENTS TO BE GIVEN PERSONAS =====');
                for (const r of t) console.log(JSON.stringify(r));

                const [used] = await conn.query(
                  'SELECT agentId, COUNT(*) AS runs FROM mission_outputs WHERE agentId IN (?) GROUP BY agentId',
                  [targets],
                ).catch(() => [[]]);
                console.log('');
                console.log('===== M. HOW MUCH THESE AGENTS ARE ALREADY USED =====');
                for (const r of used) console.log(JSON.stringify(r));

                await conn.end();
              })().catch(e => { console.error('FAILED:', e); process.exit(1); });
            "
