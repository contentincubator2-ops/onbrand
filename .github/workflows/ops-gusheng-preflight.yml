name: "Ops — Gusheng preflight (read-only)"

# 2026-09-02 (CJ「在 sowork@sowork.tw 帳號下建立盛全工業品牌 + 客製任務卡」):
# 唯讀盤點，一輪一輪推進。
#
# Round 1：owner userId=1237889 存在、全站沒有同名的盛全、agent pool 16116 位
#          但 taskSystemPrompt >= 2200 字的是 0 位。
# Round 2：全庫只有 10 位寫了 taskSystemPrompt，最長 1965 字；pool 裡沒有任何
#          製造／紡織／OEM 屬性的 agent。
# Round 3：看現有人設的寫法與語言慣例，新寫的才不會長成兩種東西。
# Round 4（本次）：pack 上線後的收尾驗證 —— 品牌 2988 的目錄是否「完全」由
#          pack 決定（全域 207 張一張都不該出現），gs- 卡是否對其他品牌隱形，
#          以及八位 agent 的人設是否真的落地。
#
# 純 SELECT 與純函式呼叫，沒有任何寫入。

on:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: [self-hosted, linux, vm-onbrand]
    timeout-minutes: 10
    steps:
      - name: Verify pack exclusivity + persona landing
        run: |
          set -e
          cd /opt/onbrand/app/skills/ai-talent
          set -a; source .env 2>/dev/null; set +a
          node --import tsx -e "
            Promise.all([
              import('./server/_core/brandPacks/index.ts'),
              import('./server/_core/taskCatalogIndex.ts'),
              import('./server/_core/brandMarket.ts'),
              import('mysql2/promise'),
            ]).then(async ([packs, catalog, market, mysqlMod]) => {
              const mysql = mysqlMod.default ?? mysqlMod;
              const { resolveBrandPack, expandPackCards, packNavForBrand, isPackTaskId, packCardId } = packs;
              const { buildTaskCatalogIndex } = catalog;

              const globalTasks = buildTaskCatalogIndex();
              const globalById = new Map(globalTasks.map((t) => [t.id, t]));
              console.log('global catalog size: ' + globalTasks.length);

              // ── A. 品牌 2988 看到什麼 ──────────────────────────────────
              const pack = resolveBrandPack({ brandId: 2988 });
              console.log('');
              console.log('===== A. BRAND 2988 RESOLVES TO PACK =====');
              console.log('pack key: ' + (pack ? pack.key : 'NONE'));
              if (!pack) { console.error('FAIL: brand 2988 resolved to no pack'); process.exit(1); }

              const cards = expandPackCards(pack, globalById);
              console.log('cards the brand sees: ' + cards.length);
              const leaked = cards.filter((c) => globalById.has(c.id));
              console.log('of which come from the global catalog: ' + leaked.length +
                (leaked.length ? ' -> ' + leaked.map((c) => c.id).join(',') : ' (exclusive, as intended)'));
              if (leaked.length) { console.error('FAIL: global cards leaked into the pack'); process.exit(1); }

              const nav = packNavForBrand({ brandId: 2988 });
              console.log('channels: ' + nav.channels.map((c) => c.key + '(' + c.formats.length + ')').join(' '));

              // ── B. gs- 卡對其他品牌隱形 ────────────────────────────────
              console.log('');
              console.log('===== B. GS CARDS ARE INVISIBLE TO OTHER BRANDS =====');
              const gsIds = pack.cards.map(packCardId);
              const notHidden = gsIds.filter((id) => !isPackTaskId(id));
              console.log('gs cards: ' + gsIds.length + ' / flagged as pack-exclusive: ' + (gsIds.length - notHidden.length));
              if (notHidden.length) {
                console.error('FAIL: these would show up in other brands catalogues: ' + notHidden.join(','));
                process.exit(1);
              }
              const otherBrand = resolveBrandPack({ brandId: 2984 });
              console.log('brand 2984 (正美集團) resolves to: ' + (otherBrand ? otherBrand.key : 'no pack -> global catalogue, unchanged'));

              // ── C. 市場設定 ────────────────────────────────────────────
              console.log('');
              console.log('===== C. MARKET RESOLUTION =====');
              const m = await market.getBrandMarket(2988);
              console.log(JSON.stringify(m));
              if (m.isZhTW) { console.error('FAIL: brand 2988 should not be on the zh-TW path'); process.exit(1); }

              // ── D. 人設是否真的落地 ────────────────────────────────────
              const conn = await mysql.createConnection({
                host: process.env.LOCAL_DB_HOST || '127.0.0.1',
                port: Number(process.env.LOCAL_DB_PORT || 3306),
                user: process.env.LOCAL_DB_USER || 'mos_user',
                password: process.env.LOCAL_DB_PASSWORD,
                database: process.env.LOCAL_DB_NAME || 'mos_db',
              });
              const agentIds = [...new Set(pack.cards.filter((c) => c.kind === 'custom').map((c) => c.template.agent_id))];
              const [rows] = await conn.query(
                'SELECT id, name, title, CHAR_LENGTH(COALESCE(taskSystemPrompt,\'\')) AS promptLen FROM agents WHERE id IN (?) ORDER BY promptLen DESC',
                [agentIds],
              );
              console.log('');
              console.log('===== D. AGENTS BOUND BY THE PACK =====');
              for (const r of rows) console.log('  ' + JSON.stringify(r));
              const thick = rows.filter((r) => r.promptLen >= 2200).length;
              console.log('agents bound: ' + rows.length + ' / with a >=2200 char persona: ' + thick);

              // ── E. 產品 picker 有東西可選 ──────────────────────────────
              const [prods] = await conn.execute(
                'SELECT COUNT(*) AS n FROM products WHERE brandId = 2988', []);
              console.log('');
              console.log('===== E. PRODUCTS AVAILABLE IN THE PER-TASK PICKER =====');
              console.log('products under brand 2988: ' + prods[0].n);
              if (Number(prods[0].n) === 0) { console.error('FAIL: the product picker would be empty'); process.exit(1); }

              await conn.end();
              console.log('');
              console.log('=== ALL CHECKS PASS ===');
              // Explicit exit: importing the server modules starts pools and
              // timers that keep the event loop alive, so without this the run
              // sits at 'ALL CHECKS PASS' until the step timeout cancels it —
              // a green result reported as a failure.
              process.exit(0);
            }).catch((e) => { console.error('FAILED:', e); process.exit(1); });
          "
