name: "Ops — Debug IG caption corruption"

# 2026-07-20 (CJ QA「IG 單篇完整貼文 產出文案有斷字/漏字」): read-only dump
# of the affected output row + the brand's term-substitution rules so we can
# identify which deterministic transform mangled the text.

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Dump caption + brand rules
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 90s
          script: |
            set +e
            source /opt/onbrand/app/skills/ai-talent/.env 2>/dev/null || true
            H="${LOCAL_DB_HOST:-127.0.0.1}"; U="${LOCAL_DB_USER:-mos_user}"
            P="${LOCAL_DB_PASSWORD}"; D="${LOCAL_DB_NAME:-mos_db}"
            Q() { mysql -h"$H" -u"$U" -p"$P" "$D" -e "$1"; }

            echo "===== A0. missions columns ====="
            Q "DESCRIBE missions;" | head -20

            echo "===== A. affected outputs (媽媽們都是) — no join ====="
            Q "SELECT mo.id, mo.missionId, mo.status, mo.createdAt,
                      LEFT(mo.content, 900) AS content
               FROM mission_outputs mo
               WHERE mo.content LIKE '%媽媽們都是%'
               ORDER BY mo.id DESC LIMIT 2\G"

            echo "===== A2. latest outputs with ig task metadata ====="
            Q "SELECT mo.id, mo.status, mo.createdAt,
                      LEFT(mo.metadata, 160) AS meta,
                      LEFT(mo.content, 200) AS content
               FROM mission_outputs mo
               WHERE mo.metadata LIKE '%ig-60%'
               ORDER BY mo.id DESC LIMIT 4\G"

            echo "===== A3. outputs mentioning 肚子不太舒服 / 媽媽們 — no join ====="
            Q "SELECT mo.id, mo.status, mo.createdAt, LEFT(mo.content, 900) AS content
               FROM mission_outputs mo
               WHERE mo.content LIKE '%肚子不太舒服%' OR mo.content LIKE '%媽媽們%'
               ORDER BY mo.id DESC LIMIT 3\G"

            echo "===== A5. metadata (archivedVariants) mentioning the text ====="
            Q "SELECT mo.id, mo.status, mo.createdAt,
                      LEFT(mo.metadata, 500) AS meta
               FROM mission_outputs mo
               WHERE mo.metadata LIKE '%肚子不太舒服%' OR mo.metadata LIKE '%媽媽們都是%'
               ORDER BY mo.id DESC LIMIT 3\G"

            echo "===== A6. absolute latest outputs (id/status/first chars) ====="
            Q "SELECT id, status, createdAt, LEFT(content, 80) c
               FROM mission_outputs ORDER BY id DESC LIMIT 10;"

            echo "===== A4. sanity: known output 3321 + latest missions ====="
            Q "SELECT mo.id, mo.missionId, mo.status, LEFT(mo.content,120) c
               FROM mission_outputs mo WHERE mo.id IN (2886, 3321)\G"
            Q "SELECT id, taskId, brandId, createdAt FROM missions
               ORDER BY id DESC LIMIT 8;"
            Q "SELECT mo.id, m.taskId, mo.createdAt FROM mission_outputs mo
               JOIN missions m ON m.id = mo.missionId
               ORDER BY mo.id DESC LIMIT 8;"

            echo "===== B. brand caption rules for those brands ====="
            Q "SELECT id, brandId, rule, scope, active FROM brand_caption_rules
               ORDER BY id DESC LIMIT 10\G" 2>/dev/null || echo "(no brand_caption_rules table)"

            echo "===== C. 小安素 brands' forbidden/substitution (positioning voice) ====="
            Q "SELECT id, name,
                      LEFT(JSON_UNQUOTE(JSON_EXTRACT(positioning,'\$.voice')), 500) AS voice
               FROM brands WHERE name LIKE '%小安素%' ORDER BY id DESC LIMIT 4\G"
            exit 0
