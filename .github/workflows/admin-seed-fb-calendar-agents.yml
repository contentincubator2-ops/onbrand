name: Admin - seed FB calendar squad agents
on:
  workflow_dispatch:
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 600s
          script: |
            set -a
            [ -f /opt/marketing-os/.env ] && . /opt/marketing-os/.env
            [ -f /opt/marketing-os/app/skills/ai-talent/.env ] && . /opt/marketing-os/app/skills/ai-talent/.env
            set +a
            cd /opt/marketing-os/app/skills/ai-talent 2>/dev/null || cd /opt/marketing-os/skills/ai-talent

            echo "=== Pre-flight checks ==="
            if [ -z "$OPENAI_API_KEY" ]; then
              echo "✗ OPENAI_API_KEY missing in env"
              exit 1
            fi
            echo "✓ OPENAI_API_KEY present (length=${#OPENAI_API_KEY})"
            echo "✓ DB_HOST=${DB_HOST:-127.0.0.1}"
            echo "node version: $(node -v)"
            echo "sharp installed: $(node -e 'try{require("sharp");console.log("yes")}catch{console.log("no")}' 2>/dev/null || echo unknown)"
            echo "convert installed: $(which convert 2>/dev/null || echo no)"

            echo ""
            echo "=== Run seed script ==="
            timeout 540 npx tsx scripts/seed-fb-calendar-agents.ts 2>&1

            echo ""
            echo "=== Resulting agents in DB ==="
            DB_HOST_V=${DB_HOST:-127.0.0.1}
            DB_USER_V=${DB_USER:-root}
            DB_NAME_V=${DB_NAME:-mos_db}
            MYSQL_PWD="$DB_PASSWORD" mysql -h"$DB_HOST_V" -u"$DB_USER_V" "$DB_NAME_V" -t -e "
              SELECT id, slug, name, englishName, layer, aiModel, avatarUrl
                FROM agents
               WHERE slug IN ('audience-insight-lead','content-pillar-architect','editorial-calendar-architect','fb-brief-writer','fb-visual-director')
               ORDER BY id;"

            echo ""
            echo "=== Avatar files on disk ==="
            COVERS=${COVERS_DIR:-/opt/marketing-os/covers}
            ls -lh "$COVERS"/agent-{audience-insight-lead,content-pillar-architect,editorial-calendar-architect,fb-brief-writer,fb-visual-director}*.png 2>&1 | head -40

            echo "Done"
