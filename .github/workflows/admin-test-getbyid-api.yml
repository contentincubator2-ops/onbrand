name: Admin — Hit getById tRPC endpoint to see actual response

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 90s
          script: |
            cd /opt/marketing-os/app/skills/ai-talent
            cat > scripts/probe-getbyid.ts <<'EOF'
            import mysql from "mysql2/promise";
            const conn = await mysql.createConnection({
              host: "localhost", user: "mos_user", password: "mos_secure_2026", database: "mos_db",
              decimalNumbers: true,
            });
            for (const id of [60, 61, 62]) {
              const [rows]: any = await conn.execute(
                `SELECT o.*, m.id AS mission_id, m.workspace AS mission_workspace,
                  JSON_UNQUOTE(JSON_EXTRACT(o.metadata, '$.taskId')) AS extracted_task_id,
                  JSON_UNQUOTE(JSON_EXTRACT(o.metadata, '$.tier')) AS extracted_tier
                FROM mission_outputs o
                LEFT JOIN missions m ON m.id = o.missionId
                WHERE o.id = ?
                LIMIT 1`, [id]
              );
              const r = (rows as any[])[0];
              console.log(`── output ${id} ──`);
              if (!r) { console.log("  (not found)"); continue; }
              console.log("  row.id:                  ", r.id);
              console.log("  row.platform:            ", r.platform);
              console.log("  row.outputType:          ", r.outputType);
              console.log("  row.extracted_task_id:   ", r.extracted_task_id);
              console.log("  row.extracted_tier:      ", r.extracted_tier);
              console.log("  row.metadata typeof:     ", typeof r.metadata);
              if (typeof r.metadata === "string") {
                console.log("  row.metadata.slice(0,80):", r.metadata.slice(0, 80));
              } else if (r.metadata) {
                console.log("  row.metadata.taskId:     ", r.metadata.taskId);
              }
              console.log("  row.mission_id:          ", r.mission_id);
              console.log("  row.mission_workspace:   ", r.mission_workspace);
            }
            await conn.end();
            EOF
            cd client && npx tsx ../scripts/probe-getbyid.ts 2>&1 | tail -50
            cd ..
            rm -f scripts/probe-getbyid.ts
