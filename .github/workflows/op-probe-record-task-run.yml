name: Ops — Probe recordTaskRun failures (Album/Carousel diagnosis)

# 2026-05-14 — Bug #2 follow-up: user reports tasks 3/4 (FB Album / Carousel)
# still showing「結果沒順利存下來」on /60s. The error fires when the mutation
# returns without outputId AND without errors. Means orchestra reached
# checkpoint but recordTaskRun failed to write the partial row.
#
# This probe checks:
#  1. pm2 logs for [recordTaskRun] FAILED entries (last 30 min)
#  2. mission_outputs.progress distribution (any 'caption_ready' stuck?)
#  3. Recent error_log entries from outputRouter / recordTaskRun
#  4. mission_outputs schema sanity (progress, content, title sizes)
#  5. Recent INSERT failures in the JSONL DLQ file

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 3
    steps:
      - name: 1. recent recordTaskRun failures in pm2 logs
        run: |
          set +e
          LOG=$HOME/.pm2/logs/onbrand-error.log
          if [ ! -f "$LOG" ]; then LOG=$HOME/.pm2/logs/onbrand-out.log; fi

          echo "════ recordTaskRun warnings (last 200 lines, filtered) ════"
          tail -2000 "$LOG" 2>&1 | grep -iE "recordTaskRun|finaliseTaskRun|ensureMission|INSERT.*FAILED|outputId.*null" | tail -40 || echo "(no matches in last 2000 lines)"

      - name: 2. progress distribution
        run: |
          set -e
          ENV=/opt/onbrand/app/skills/ai-talent/.env
          set -a; source "$ENV"; set +a
          export MYSQL_PWD="$LOCAL_DB_PASSWORD"
          MYSQL="mysql -h localhost -u mos_user mos_db -B -t"

          echo "════ progress distribution (all-time) ════"
          $MYSQL -e "SELECT progress, COUNT(*) AS n FROM mission_outputs GROUP BY progress ORDER BY n DESC;"

          echo ""
          echo "════ recent caption_ready rows (might be stuck) ════"
          $MYSQL -e "
            SELECT mo.id, mo.missionId, mo.progress, mo.progressDetail,
                   LEFT(mo.title, 40) AS title,
                   LENGTH(mo.content) AS content_bytes,
                   LENGTH(mo.metadata) AS meta_bytes,
                   mo.createdAt, mo.updatedAt
              FROM mission_outputs mo
             WHERE mo.progress IN ('caption_ready','failed')
                OR mo.createdAt >= NOW() - INTERVAL 30 MINUTE
             ORDER BY mo.id DESC LIMIT 20;
          "

      - name: 3. Recent error_log entries (server-side errors)
        run: |
          set -e
          ENV=/opt/onbrand/app/skills/ai-talent/.env
          set -a; source "$ENV"; set +a
          export MYSQL_PWD="$LOCAL_DB_PASSWORD"
          MYSQL="mysql -h localhost -u mos_user mos_db -B -t"

          echo "════ error_log last 30 min (route or recordTaskRun related) ════"
          $MYSQL -e "
            SELECT id, ts, level, source, route,
                   LEFT(message, 100) AS message
              FROM error_log
             WHERE ts >= NOW() - INTERVAL 30 MINUTE
               AND (source LIKE '%record%'
                    OR source LIKE '%orchestra%'
                    OR source LIKE '%output%'
                    OR message LIKE '%recordTaskRun%'
                    OR message LIKE '%mission_outputs%'
                    OR message LIKE '%caption_ready%')
             ORDER BY id DESC LIMIT 20;
          " 2>&1 || echo "(error_log query failed)"

      - name: 4. mission_outputs schema sanity
        run: |
          set -e
          ENV=/opt/onbrand/app/skills/ai-talent/.env
          set -a; source "$ENV"; set +a
          export MYSQL_PWD="$LOCAL_DB_PASSWORD"
          MYSQL="mysql -h localhost -u mos_user mos_db -B -t"

          echo "════ mission_outputs columns ════"
          $MYSQL -e "
            SELECT COLUMN_NAME, COLUMN_TYPE, IS_NULLABLE, COLUMN_DEFAULT
              FROM information_schema.COLUMNS
             WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'mission_outputs'
             ORDER BY ORDINAL_POSITION;
          "

      - name: 5. DLQ — task-runs-failed.jsonl
        run: |
          set +e
          DLQ=$HOME/.pm2/logs/task-runs-failed.jsonl
          if [ -f "$DLQ" ]; then
            echo "════ DLQ entries (last 10) ════"
            tail -10 "$DLQ" | head -c 5000
          else
            echo "(no DLQ file — good sign or DLQ never written)"
          fi
