name: Admin — Reset stuck positioning jobs

# CJ「復華投信顯示分析中 13/14，但內容沒有產出」.
# Recent deploys restarted pm2 mid-run, leaving positioning_jobs rows at
# status='running' with no active process. The frontend polls getStatus
# and sees stale 'running' forever.
#
# Stuck = status='running' AND startedAt older than 5 min (jobs normally
# finish in 60-120s; 5min is generous).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe (default) | reset"
        required: false
        default: "probe"

jobs:
  reset:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 3
    steps:
      - name: Run
        run: |
          set -e
          AI=/opt/marketing-os/app/skills/ai-talent
          set -a; source "$AI/.env" 2>/dev/null; set +a
          export MYSQL_PWD="${LOCAL_DB_PASSWORD}"
          MYSQL="mysql -h ${LOCAL_DB_HOST:-localhost} -u ${LOCAL_DB_USER:-mos_user} ${LOCAL_DB_NAME:-mos_db}"

          MODE="${{ github.event.inputs.mode }}"
          MODE="${MODE:-probe}"

          echo "=== Stuck running jobs (startedAt > 5 min ago) ==="
          $MYSQL -e "
            SELECT id, entityKind, entityId, userId, currentStep, totalSteps, status,
                   startedAt, TIMESTAMPDIFF(MINUTE, startedAt, NOW()) AS minsAgo
              FROM positioning_jobs
             WHERE status = 'running'
               AND startedAt < NOW() - INTERVAL 5 MINUTE
             ORDER BY id DESC
          " -t

          echo ""
          echo "=== All running jobs (any age) ==="
          $MYSQL -e "
            SELECT id, entityKind, entityId, userId, currentStep, totalSteps, startedAt
              FROM positioning_jobs
             WHERE status = 'running'
             ORDER BY id DESC LIMIT 20
          " -t

          if [ "$MODE" = "reset" ]; then
            echo ""
            echo "=== RESET: mark stuck running as failed ==="
            $MYSQL -e "
              UPDATE positioning_jobs
                 SET status = 'failed',
                     lastError = COALESCE(lastError, 'reset by admin: server restarted mid-run'),
                     finishedAt = NOW()
               WHERE status = 'running'
                 AND startedAt < NOW() - INTERVAL 5 MINUTE
            "
            echo "Done."
            echo ""
            echo "=== Post-reset status counts ==="
            $MYSQL -e "
              SELECT status, COUNT(*) AS n
                FROM positioning_jobs
               GROUP BY status
               ORDER BY n DESC
            " -t
          else
            echo ""
            echo "Probe mode — no writes. Re-run with mode=reset."
          fi
