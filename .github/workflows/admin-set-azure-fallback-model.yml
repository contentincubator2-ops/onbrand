name: Admin — Set Azure Foundry fallback model to gpt-4.1-mini

# Kimi-K2.5 is a reasoning model that returns output in `reasoning_content`
# field (not `content`), so the OpenAI-shape extractor in invokeLLM returns
# empty string. Probe confirmed gpt-4.1-mini and gpt-4o-mini work cleanly
# (return `content` field, fast, handles zh well).

on:
  workflow_dispatch:

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 30s
          script: |
            set -e
            ENV=/opt/marketing-os/app/skills/ai-talent/.env
            cp "$ENV" "${ENV}.bak.$(date +%s)"

            upsert() {
              local K="$1"; local V="$2"
              if grep -qE "^${K}=" "$ENV"; then
                sed -i "s|^${K}=.*|${K}=${V}|" "$ENV"
                echo "  ↻ $K = $V"
              else
                echo "${K}=${V}" >> "$ENV"
                echo "  + $K = $V"
              fi
            }

            upsert AZURE_FOUNDRY_FALLBACK_MODEL "gpt-4.1-mini"
            upsert AZURE_FOUNDRY_MODEL          "gpt-4.1-mini"

            pm2 restart marketing-os --update-env 2>&1 | tail -3 || true
            echo "✓ Done"
