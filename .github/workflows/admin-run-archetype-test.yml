name: Admin - Run Archetype Test

on:
  workflow_dispatch:
    inputs:
      brand_name:
        description: 'Brand name to analyze'
        required: true
        default: 'SoWork AI'
      brand_desc:
        description: 'Brand description'
        required: true
        default: 'AI marketing OS for enterprise teams'

jobs:
  run-test:
    runs-on: ubuntu-latest
    steps:
      - name: Run archetype test via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 25m
          script: |
            set -e
            cd /home/azureuser/marketing-os
            git fetch origin main && git reset --hard origin/main

            BRAND="${{ github.event.inputs.brand_name }}"
            DESC="${{ github.event.inputs.brand_desc }}"
            PORT=3001
            MOS_USER="mos_user"
            MOS_PASS="mos_secure_2026"
            MOS_DB="mos_db"

            echo "=============================="
            echo "Archetype Full Output Test"
            echo "Brand: $BRAND"
            echo "=============================="

            export JWT_SECRET=$(pm2 jlist 2>/dev/null | node -e "
              let d=''; process.stdin.on('data',c=>d+=c);
              process.stdin.on('end',()=>{
                try{ const p=JSON.parse(d).find(x=>x.pm2_env&&x.pm2_env.JWT_SECRET);
                  if(p) process.stdout.write(p.pm2_env.JWT_SECRET); }catch(e){}
              });
            " 2>/dev/null)
            if [ -z "$JWT_SECRET" ]; then
              export JWT_SECRET=$(grep -E '^JWT_SECRET=' skills/ai-talent/.env | head -1 | cut -d= -f2-)
            fi
            echo "JWT_SECRET len=${#JWT_SECRET}"

            MISSION_ID=$(mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -sN -e "SELECT m.id FROM missions m WHERE m.brandId IS NOT NULL ORDER BY m.updatedAt DESC LIMIT 1;" 2>/dev/null)
            if [ -z "$MISSION_ID" ]; then echo "No mission found"; exit 1; fi

            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "UPDATE missions SET squadSlug='brand-archetype-positioning' WHERE id=$MISSION_ID;" 2>/dev/null
            echo "Mission #$MISSION_ID set"

            set +e
            TOKEN=$(python3 -c "
import hmac,hashlib,base64,json,time,os
s=os.environ.get('JWT_SECRET','')
n=int(time.time())
h=base64.urlsafe_b64encode(json.dumps({'alg':'HS256','typ':'JWT'}).encode()).rstrip(b'=')
p=base64.urlsafe_b64encode(json.dumps({'sub':'199','iat':n,'exp':n+14400}).encode()).rstrip(b'=')
m=h+b'.'+p
g=base64.urlsafe_b64encode(hmac.new(s.encode(),m,hashlib.sha256).digest()).rstrip(b'=')
print((m+b'.'+g).decode(),end='')
" 2>/dev/null)
            set -e
            if [ -z "$TOKEN" ]; then echo "JWT failed"; exit 1; fi
            echo "JWT len=${#TOKEN}"

            curl -sk -X POST "https://localhost:$PORT/api/chat/reset-squad-session" -H "Content-Type: application/json" -H "Authorization: Bearer $TOKEN" -d "{\"missionId\":$MISSION_ID}" >/dev/null 2>&1 || true
            sleep 2

            do_turn() {
              local LBL="$1" MSG="$2"
              echo ""; echo "=== $LBL ==="; echo ""
              BODY=$(python3 -c "import json,sys; print(json.dumps({'userMessage':sys.argv[1],'conversationHistory':[],'missionId':$MISSION_ID,'squadSlug':'brand-archetype-positioning'}),end='')" "$MSG")
              curl -sk -X POST "https://localhost:$PORT/api/chat" -H "Content-Type: application/json" -H "Authorization: Bearer $TOKEN" -H "Accept: text/event-stream" -d "$BODY" --max-time 180 2>/dev/null | node -e "
                let buf='',agent='',model='',content='',ev='';
                process.stdin.on('data',c=>{buf+=c;const ls=buf.split('\n');buf=ls.pop()||'';for(const l of ls){if(l.startsWith('event: ')){ev=l.slice(7).trim();}else if(l.startsWith('data: ')){try{const d=JSON.parse(l.slice(6));if(ev==='relay_step'&&d.status==='running'){agent=d.agentName||agent;model=d.agentModel||model;}else if(ev==='delta'&&d.text){content+=d.text;}}catch{}}}});
                process.stdin.on('end',()=>{console.log('Agent:',agent,'Model:',model,'Len:',content.length);console.log('');console.log('--- OUTPUT ---');console.log(content||'(empty)');console.log('--- END ---');});
              "
            }

            INTAKE="${BRAND}，${DESC}請用品牌原型定位法開始分析。"
            do_turn "Turn 1 Squad Lead Intake" "$INTAKE"
            sleep 3
            do_turn "Turn 2 Step 1 Brand Personality Audit" "繼續"
            sleep 3
            do_turn "Turn 3 Step 2 Archetype Selection" "繼續"
            sleep 3
            do_turn "Turn 4 Step 3 Brand Voice Guide" "繼續"
            sleep 3
            do_turn "Turn 5 Step 4 Visual Experience" "繼續"
            sleep 3
            do_turn "Turn 6 Step 5 Omnichannel Audit" "繼續"

            echo ""; echo "=============================="
            echo "Test complete"
            echo "=============================="
