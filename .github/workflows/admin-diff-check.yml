name: Admin — Diff check (VM app vs old backend)

# Compares /opt/marketing-os/app (monorepo) vs /opt/marketing-os/marketing-os-backend
# to find any files guo.chen changed in the split repo that are NOT yet in our monorepo.
# Run AFTER admin-consolidate-vm so both folders exist.

on:
  workflow_dispatch:

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 120s
          script: |
            APP=/opt/marketing-os/app/skills/ai-talent
            OLD=/opt/marketing-os/marketing-os-backend

            echo "===== GitHub (monorepo) latest commit ====="
            cd /opt/marketing-os/app && git log --oneline -3

            echo ""
            echo "===== guo.chen backend latest commit ====="
            cd "$OLD" && git log --oneline -3

            echo ""
            echo "===== KEY FILE DIFFS (server side) ====="

            for f in \
              "ai-talent-server/auth/authRouter.ts:server/auth/authRouter.ts" \
              "ai-talent-server/auth/emailService.ts:server/auth/emailService.ts" \
              "ai-talent-server/routes/missionChatRouter.ts:server/routes/missionChatRouter.ts" \
              "ai-talent-server/routes/missionSquadRoute.ts:server/routes/missionSquadRoute.ts" \
              "ai-talent-server/routers/index.ts:server/routers/index.ts" \
              "ai-talent-server/routers/reportRouter.ts:server/routers/reportRouter.ts" \
              "ai-talent-server/_core/reportPersistence.ts:server/_core/reportPersistence.ts" \
              "package.json:package.json"
            do
              OLD_FILE="${f%%:*}"
              NEW_FILE="${f##*:}"
              OLD_PATH="$OLD/$OLD_FILE"
              NEW_PATH="$APP/$NEW_FILE"
              if [ -f "$OLD_PATH" ] && [ -f "$NEW_PATH" ]; then
                DIFF=$(diff "$OLD_PATH" "$NEW_PATH" 2>/dev/null | wc -l)
                if [ "$DIFF" -gt "0" ]; then
                  echo "⚠️  DIFFERS ($DIFF lines): $NEW_FILE"
                  diff "$OLD_PATH" "$NEW_PATH" | head -30
                  echo "---"
                else
                  echo "✅ SAME: $NEW_FILE"
                fi
              elif [ -f "$OLD_PATH" ] && [ ! -f "$NEW_PATH" ]; then
                echo "❌ MISSING in monorepo: $NEW_FILE"
              fi
            done

            echo ""
            echo "===== KEY FILE DIFFS (client side) ====="
            OLD_FE=/opt/marketing-os/marketing-os-frontend

            for f in \
              "ai-talent-client/src/lib/trpc.ts:client/src/lib/trpc.ts" \
              "ai-talent-client/src/App.tsx:client/src/App.tsx" \
              "ai-talent-client/src/pages/auth/LoginPage.tsx:client/src/pages/auth/LoginPage.tsx" \
              "ai-talent-client/src/pages/Login.tsx:client/src/pages/Login.tsx" \
              "ai-talent-client/tsconfig.json:client/tsconfig.json" \
              "ai-talent-client/vite.config.ts:client/vite.config.ts"
            do
              OLD_FILE="${f%%:*}"
              NEW_FILE="${f##*:}"
              OLD_PATH="$OLD_FE/$OLD_FILE"
              NEW_PATH="$APP/$NEW_FILE"
              if [ -f "$OLD_PATH" ] && [ -f "$NEW_PATH" ]; then
                DIFF=$(diff "$OLD_PATH" "$NEW_PATH" 2>/dev/null | wc -l)
                if [ "$DIFF" -gt "0" ]; then
                  echo "⚠️  DIFFERS ($DIFF lines): $NEW_FILE"
                  diff "$OLD_PATH" "$NEW_PATH" | head -30
                  echo "---"
                else
                  echo "✅ SAME: $NEW_FILE"
                fi
              elif [ -f "$OLD_PATH" ] && [ ! -f "$NEW_PATH" ]; then
                echo "❌ MISSING in monorepo: $NEW_FILE"
              fi
            done

            echo ""
            echo "===== Files in old backend NOT in monorepo ====="
            # Check for guo.chen-only files (auth folder)
            find "$OLD/ai-talent-server/auth" -name "*.ts" 2>/dev/null | while read f; do
              base=$(basename "$f")
              if [ ! -f "$APP/server/auth/$base" ]; then
                echo "❌ NOT IN MONOREPO: server/auth/$base"
              else
                echo "✅ EXISTS: server/auth/$base"
              fi
            done
