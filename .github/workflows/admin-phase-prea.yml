name: Admin — Phase PreA Data Consolidation

# Execute Phase PreA on mos_vm:
# 1. Compare data between sowork_db (Azure) and mos_db (Local VM)
# 2. Migrate missing data from sowork_db to mos_db
# 3. Validate data integrity

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (only show diff, do not migrate)'
        required: false
        type: boolean
        default: true

jobs:
  phase-prea:
    runs-on: ubuntu-latest
    steps:
      - name: Execute Phase PreA on mos_vm
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            echo "🚀 Phase PreA: Data Consolidation"
            echo "Dry run: ${{ github.event.inputs.dry_run }}"
            echo ""

            cd /home/azureuser/marketing-os

            # Pull latest code (includes new scripts)
            echo "📥 Pulling latest code from main..."
            git fetch origin main
            git reset --hard origin/main

            cd skills/ai-talent
            echo ""

            # Install dependencies if needed
            if [ ! -d node_modules ]; then
              echo "📦 Installing dependencies..."
              npm install
            fi

            echo ""
            echo "=== Step 1: Diagnostic (comparing sowork_db vs mos_db) ==="
            npx tsx scripts/diagnose-db-migration.ts || echo "⚠️ Diagnostic completed with warnings"

            echo ""
            if [ "${{ github.event.inputs.dry_run }}" = "false" ]; then
              echo "=== Step 2: Execute Phase PreA Migration ==="
              npx tsx scripts/execute-phase-prea.ts

              echo ""
              echo "=== Step 3: Validate data integrity ==="
              npx tsx scripts/validate-squads.ts || echo "⚠️ Validation found issues"

              echo ""
              echo "✅ Phase PreA migration complete"
            else
              echo "⏸️  Dry run mode: migration skipped. Run again with dry_run=false to execute."
            fi
