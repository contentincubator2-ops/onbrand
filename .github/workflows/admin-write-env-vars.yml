name: Admin — Write env vars

# Write one or more KEY=VALUE pairs to the VM .env and restart pm2.
# Usage: Run workflow, enter pairs like:
#   PIAPI_KEY=b7af2639ee9f1f605775176605ae9b621a49074ebcb530cdaf5ab5711dfcf08e
# Multiple vars: one per line.

on:
  workflow_dispatch:
    inputs:
      env_vars:
        description: "KEY=VALUE pairs to write (one per line)"
        required: true
        default: ""

jobs:
  write-env:
    runs-on: ubuntu-latest
    steps:
      - name: Write env vars to VM .env and restart
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_VARS_INPUT: ${{ inputs.env_vars }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 90s
          envs: ENV_VARS_INPUT
          script: |
            set -e
            ENV_FILE=/opt/onbrand/app/skills/ai-talent/.env

            if [ ! -f "$ENV_FILE" ]; then
              echo "x .env not found at $ENV_FILE"; exit 1
            fi

            printf '%s\n' "$ENV_VARS_INPUT" | while IFS= read -r line; do
              case "$line" in ''|\#*) continue ;; esac
              KEY="${line%%=*}"
              VAL="${line#*=}"
              [ -z "$KEY" ] && echo "skipping: $line" && continue
              if grep -qE "^${KEY}=" "$ENV_FILE"; then
                awk -v k="$KEY" -v v="$VAL" 'BEGIN{FS=OFS="="} $1==k{$2=v} {print}' \
                  "$ENV_FILE" > "${ENV_FILE}.tmp" && mv "${ENV_FILE}.tmp" "$ENV_FILE"
                echo "updated $KEY"
              else
                printf '%s=%s\n' "$KEY" "$VAL" >> "$ENV_FILE"
                echo "appended $KEY"
              fi
            done

            echo ""
            echo "Restarting onbrand..."
            pm2 restart onbrand --update-env 2>&1 | tail -3
            sleep 3
            curl -s -o /dev/null -w "Health: HTTP %{http_code}\n" http://127.0.0.1:3101/health || true
            echo "Done."
