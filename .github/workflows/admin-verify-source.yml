name: Admin — Verify VM source matches latest commit

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            cd /opt/marketing-os/app/skills/ai-talent

            echo "════════ RunPage.tsx — does it have outputTypeToFormat? ════════"
            grep -n "outputTypeToFormat\|此 run 缺少\|3-layer fallback" client/src/v2/pages/RunPage.tsx | head -10

            echo ""
            echo "════════ outputRouter.ts — does it have JSON_EXTRACT extracted_task_id? ════════"
            grep -n "extracted_task_id\|JSON_UNQUOTE" server/routers/outputRouter.ts | head -10

            echo ""
            echo "════════ multiModelRouter.ts — anthropic enabled? ════════"
            grep -n "anthropic.*ANTHROPIC_API_KEY\|qwen.*key invalid\|claude-haiku-4-5-20251001" server/_core/multiModelRouter.ts | head -10

            echo ""
            echo "════════ quickTaskOrchestra.ts — HARD_BUDGET 35? ════════"
            grep -n "HARD_BUDGET_MS\s*=\s*\d" server/_core/quickTaskOrchestra.ts | head -5

            echo ""
            echo "════════ Bundle hash + grep for surviving strings ════════"
            for B in public/assets/index-*.js; do
              S=$(stat -c%s "$B")
              if [ $S -gt 1000000 ]; then
                echo "── $B ($S bytes, modified $(stat -c%y "$B" | cut -d. -f1)) ──"
                # Strings that survive minification (literal values inside dicts):
                echo "  proposal-cover:    $(grep -c 'proposal-cover' "$B")"
                echo "  research-doc:      $(grep -c 'research-doc' "$B")"
                echo "  此 run 缺少:        $(grep -c '此 run 缺少' "$B")"
                echo "  ad_copy:           $(grep -c 'ad_copy' "$B")"
                echo "  email_html:        $(grep -c 'email_html' "$B")"
              fi
            done
