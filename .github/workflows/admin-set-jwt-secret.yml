name: Admin — Generate + persist JWT_SECRET

# Adds a JWT_SECRET to .env if missing. Generates a random 64-byte hex
# secret (256 bits of entropy). Idempotent — leaves an existing secret
# untouched.
#
# Side effect: if a NEW secret has to be generated, all currently-issued
# JWT tokens become invalid (existing users have to log in again). Since
# sessions are clearly already broken (PM2 has been crash-looping), this
# is acceptable — we trade a forced re-login for a stable server.

on:
  workflow_dispatch:

jobs:
  set-jwt:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            set -e
            ENV_FILE=/opt/marketing-os/app/skills/ai-talent/.env

            echo "════════════ JWT_SECRET upsert ════════════"
            if grep -qE "^JWT_SECRET=." "$ENV_FILE" 2>/dev/null; then
              EXISTING=$(grep -E "^JWT_SECRET=" "$ENV_FILE" | head -1 | cut -d= -f2- | tr -d '\r\n')
              if [ ${#EXISTING} -ge 32 ]; then
                echo "  ✓ JWT_SECRET already set (${#EXISTING} chars) — leaving alone"
                exit 0
              else
                echo "  ⚠ JWT_SECRET present but only ${#EXISTING} chars — replacing"
              fi
            else
              echo "  JWT_SECRET missing — generating fresh"
            fi

            # 128 hex chars = 512 bits of entropy. WAY more than zod's min(32) requires.
            NEW_SECRET=$(openssl rand -hex 64)

            if grep -qE "^JWT_SECRET=" "$ENV_FILE" 2>/dev/null; then
              sed -i "s|^JWT_SECRET=.*|JWT_SECRET=${NEW_SECRET}|" "$ENV_FILE"
              echo "  ✓ replaced JWT_SECRET in $ENV_FILE"
            else
              echo "JWT_SECRET=${NEW_SECRET}" >> "$ENV_FILE"
              echo "  ✓ appended JWT_SECRET to $ENV_FILE"
            fi

            # Verify (length only, never echo value)
            FINAL_LEN=$(grep -E "^JWT_SECRET=" "$ENV_FILE" | head -1 | cut -d= -f2- | tr -d '\r\n' | wc -c)
            echo "  Final length in .env: $FINAL_LEN chars"

            echo ""
            echo "════════════ Restart marketing-os ════════════"
            pm2 restart marketing-os --update-env 2>&1 | tail -3
            sleep 5
            curl -s -o /dev/null -w "Health: HTTP %{http_code}\n" http://127.0.0.1:3101/health

            echo ""
            echo "════════════ Process state ════════════"
            pm2 jlist 2>/dev/null | python3 -c "
            import sys, json, time
            data = json.loads(sys.stdin.read())
            for p in data:
                if p['name'] == 'marketing-os':
                    age_s = (time.time() * 1000 - p['pm2_env']['pm_uptime']) / 1000
                    print(f'  pid={p[\"pid\"]}  age={age_s:.1f}s  status={p[\"pm2_env\"][\"status\"]}  restarts={p[\"pm2_env\"][\"restart_time\"]}')" 2>/dev/null
