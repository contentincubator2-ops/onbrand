name: Admin — Test 401 with a freshly-signed token

# Generates a fresh token directly from VM (using same signing key as auth flow)
# Calls /api/chat with it. If 401 — JWT verification is genuinely broken on server.
# If 200/403/etc. — the issue is client-side (token in localStorage is stale/malformed).

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            BE=/opt/marketing-os/marketing-os-backend
            cd "$BE"

            echo "===== Step 1: Generate a fresh JWT for userId=1 using server's own code ====="
            # Use Node + jose to mint a token with same secret as server
            cat > /tmp/mint.mjs <<'EOF'
            import { SignJWT } from 'jose';
            import { readFileSync } from 'fs';
            const env = readFileSync('/opt/marketing-os/marketing-os-backend/.env', 'utf8');
            const secret = env.split('\n').find(l => l.startsWith('JWT_SECRET=')).slice('JWT_SECRET='.length).replace(/['"]/g, '').trim();
            const token = await new SignJWT({ sub: '1', openId: 'test' })
              .setProtectedHeader({ alg: 'HS256' })
              .setIssuedAt()
              .setExpirationTime('365d')
              .sign(new TextEncoder().encode(secret));
            console.log(token);
            EOF
            TOKEN=$(cd "$BE" && node --experimental-vm-modules /tmp/mint.mjs 2>&1 | tail -1)
            echo "[token first 20 chars]: ${TOKEN:0:20}..."

            echo ""
            echo "===== Step 2: Hit /api/chat with fresh token ====="
            curl -s -o /tmp/chat_resp.txt -w "HTTP %{http_code}\n" -X POST \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $TOKEN" \
              -d '{"userMessage":"hello","missionId":1}' \
              --max-time 8 \
              http://127.0.0.1:3101/api/chat
            echo ""
            echo "Response body (first 500 chars):"
            head -c 500 /tmp/chat_resp.txt
            echo ""

            echo ""
            echo "===== Step 3: Hit /api/auth/me (POST) with fresh token ====="
            curl -s -o /tmp/me_resp.txt -w "HTTP %{http_code}\n" -X POST \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $TOKEN" \
              http://127.0.0.1:3101/api/auth/me
            echo ""
            echo "Response body:"
            cat /tmp/me_resp.txt

            echo ""
            echo "===== Step 4: Check access log for recent 401s ====="
            pm2 logs marketing-os-backend-dev --lines 100 --nostream 2>&1 | grep -E "401|chat|auth" | tail -20

            rm -f /tmp/mint.mjs /tmp/chat_resp.txt /tmp/me_resp.txt
