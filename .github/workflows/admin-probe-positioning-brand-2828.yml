name: Admin — Probe positioning for 復華投信 (2828)

# CJ「復華顯示定位完成，但很多內容都沒有填寫」: positioning_jobs says
# done but brands.soworkAnalysis has only 1/N steps populated.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 5
    steps:
      - name: Run
        run: |
          set -e
          AI=/opt/marketing-os/app/skills/ai-talent
          set -a; source "$AI/.env" 2>/dev/null; set +a
          export MYSQL_PWD="${LOCAL_DB_PASSWORD}"
          MYSQL="mysql -h ${LOCAL_DB_HOST:-localhost} -u ${LOCAL_DB_USER:-mos_user} ${LOCAL_DB_NAME:-mos_db}"

          echo "=== positioning_jobs history for brand 2828 ==="
          $MYSQL -e "
            SELECT id, status, currentStep, totalSteps, retryCount,
                   LEFT(lastError, 120) AS err,
                   startedAt, finishedAt,
                   TIMESTAMPDIFF(SECOND, startedAt, finishedAt) AS durationSec
              FROM positioning_jobs
             WHERE entityKind='brand' AND entityId=2828
             ORDER BY id DESC LIMIT 10
          " -t

          echo ""
          echo "=== brands.soworkAnalysis JSON keys ==="
          $MYSQL -B -N --silent -e "
            SELECT JSON_KEYS(soworkAnalysis) FROM brands WHERE id=2828
          "

          echo ""
          echo "=== Inner shape of each step's result ==="
          $MYSQL -e "
            SELECT JSON_PRETTY(JSON_EXTRACT(soworkAnalysis, '\$.brandOrigin')) AS brandOrigin FROM brands WHERE id=2828
          " 2>&1 | head -30
          echo ""
          $MYSQL -e "
            SELECT JSON_PRETTY(JSON_EXTRACT(soworkAnalysis, '\$.brandValues')) AS brandValues FROM brands WHERE id=2828
          " 2>&1 | head -30
          echo ""
          $MYSQL -e "
            SELECT JSON_PRETTY(JSON_EXTRACT(soworkAnalysis, '\$.targetAudience')) AS targetAudience FROM brands WHERE id=2828
          " 2>&1 | head -30
          echo ""
          $MYSQL -e "
            SELECT JSON_PRETTY(JSON_EXTRACT(soworkAnalysis, '\$.goldenCircleRefined')) AS goldenCircle FROM brands WHERE id=2828
          " 2>&1 | head -30
          echo ""
          $MYSQL -e "
            SELECT JSON_PRETTY(JSON_EXTRACT(soworkAnalysis, '\$.taglineCandidates')) AS tagline FROM brands WHERE id=2828
          " 2>&1 | head -30

          echo ""
          echo "=== Top-level keys + null/empty check ==="
          $MYSQL -e "
            SELECT
              JSON_EXTRACT(soworkAnalysis, '\$.goldenCircle') IS NULL AS missing_goldenCircle,
              JSON_LENGTH(JSON_EXTRACT(soworkAnalysis, '\$.taglineCandidates')) AS tagline_count,
              JSON_EXTRACT(soworkAnalysis, '\$.taglineScore') IS NULL AS missing_taglineScore,
              JSON_EXTRACT(soworkAnalysis, '\$.origin') IS NOT NULL AS has_origin,
              JSON_EXTRACT(soworkAnalysis, '\$.coreValues') IS NULL AS missing_coreValues,
              JSON_EXTRACT(soworkAnalysis, '\$.audience') IS NULL AS missing_audience,
              JSON_EXTRACT(soworkAnalysis, '\$.market') IS NULL AS missing_market
              FROM brands WHERE id=2828
          " -t

          echo ""
          echo "=== usage_log for the last finished brand 2828 run ==="
          $MYSQL -e "
            SELECT kind, model, inputTokens, outputTokens,
                   ROUND(costUsd, 4) AS cost,
                   ts
              FROM usage_log
             WHERE entityKind='brand' AND entityId=2828
               AND ts > NOW() - INTERVAL 12 HOUR
             ORDER BY ts ASC
          " -t 2>&1 | head -40

          echo ""
          echo "=== Last 200 OUT lines mentioning brand 2828 / positioning ==="
          LOG_OUT=/home/$(whoami)/.pm2/logs/marketing-os-out.log
          LOG_ERR=/home/$(whoami)/.pm2/logs/marketing-os-error.log
          tail -1500 "$LOG_OUT" 2>/dev/null | grep -E "2828|positioningJob|positioning_step|positioningSteps" | tail -30

          echo ""
          echo "=== Last 100 ERR lines mentioning positioning ==="
          tail -1500 "$LOG_ERR" 2>/dev/null | grep -E "positioning|2828" | tail -30
