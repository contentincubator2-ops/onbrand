name: Admin — Probe theater runStart diversity output

on:
  workflow_dispatch:
    inputs:
      brand_id:
        description: "Brand ID to probe (default 2821 SoWorkai)"
        default: "2821"
      platforms:
        description: "Comma-sep platforms (default facebook,instagram,youtube)"
        default: "facebook,instagram,youtube"

jobs:
  probe:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 5
    steps:
      - name: Pull main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APP=/opt/marketing-os/app
          cd "$APP"
          REPO="https://x-access-token:${GH_TOKEN}@github.com/contentincubator2-ops/Marketing-OS.git"
          git remote set-url origin "$REPO"
          git fetch origin main
          git reset --hard origin/main

      - name: Inline runStart probe
        run: |
          set -e
          AI=/opt/marketing-os/app/skills/ai-talent
          set -a; source "$AI/.env" 2>/dev/null; set +a
          export MYSQL_PWD="${LOCAL_DB_PASSWORD}"
          BID="${{ github.event.inputs.brand_id }}"
          BID="${BID:-2821}"
          PLATS="${{ github.event.inputs.platforms }}"
          PLATS="${PLATS:-facebook,instagram,youtube}"
          OWNER=$(mysql -h ${LOCAL_DB_HOST:-localhost} -u ${LOCAL_DB_USER:-mos_user} ${LOCAL_DB_NAME:-mos_db} -B -N --silent -e "SELECT userId FROM brands WHERE id=$BID")
          echo "brand=$BID owner=$OWNER platforms=$PLATS"
          cd "$AI"

          # Build a 7-day list starting today
          DATES_JS="const today=new Date(); const d=Array.from({length:7}).map((_,i)=>{const x=new Date(today); x.setDate(today.getDate()+i); return x.toISOString().slice(0,10);});"

          npx tsx -e "
          import { appRouter } from './server/routers';
          $DATES_JS
          (async () => {
            const ctx: any = { user: { id: $OWNER } };
            const caller = appRouter.createCaller(ctx);
            const result = await caller.theater.runStart({
              brandId: $BID,
              platforms: '$PLATS'.split(',') as any,
              importantDates: [],
              dates: d,
            });
            console.log('=== chiefOpening ===');
            console.log(result.chiefOpening?.slice(0, 200));
            console.log('');
            console.log('=== leadThoughts keys ===', Object.keys(result.leadThoughts ?? {}));
            console.log('');
            console.log('=== usps[0..3] ===', result.usps?.slice(0, 3));
            console.log('');
            console.log('=== hookPlan size ===', Object.keys(result.hookPlan ?? {}).length);
            console.log('=== hookPlan sample (first 9) ===');
            const hp = Object.entries(result.hookPlan ?? {}).slice(0, 9);
            for (const [k, v] of hp) console.log('  ', k, '=>', v);
            console.log('');
            console.log('=== ctaPlan size ===', Object.keys(result.ctaPlan ?? {}).length);
            const cp = Object.entries(result.ctaPlan ?? {}).slice(0, 9);
            for (const [k, v] of cp) console.log('  ', k, '=>', v);
            console.log('');
            console.log('=== scoutByPlatform sizes ===');
            for (const [p, list] of Object.entries(result.scoutByPlatform ?? {})) {
              console.log('  ', p, '→', (list as any[]).length, 'patterns');
              const items = (list as string[]).slice(0, 1);
              for (const it of items) console.log('     · ', it.slice(0, 120));
            }
            console.log('=== scoutIndustry ===', result.scoutIndustry);
            process.exit(0);
          })().catch((e) => { console.error('PROBE FAILED:', e); process.exit(1); });
          "
