name: Admin — FB cleanup final (heroes + mockup audit + re-audit fit)

# One-shot final cleanup pass for FB tasks. Runs after
# admin-seed-fb-missing-agents has populated the new specialists.
#
# Steps:
#   1. Generate squad hero images for the 5 active-bound squads
#      (only fills missing — idempotent).
#   2. Audit mockup coverage — confirm 0 steps missing mockupVariant.
#   3. Re-run agent-fit audit — should drop ✗ count compared to
#      the 5-mismatch baseline from 2026-05-01.

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 1200s   # 20 min — hero gen takes ~10s × 5 = ~1min, fit audit ~30s
          envs: GH_TOKEN
          script: |
            set +e
            APP=/opt/marketing-os/app
            AI=$APP/skills/ai-talent
            cd "$APP"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/contentincubator2-ops/Marketing-OS.git"
            git fetch origin main 2>&1 | tail -3
            git reset --hard origin/main 2>&1 | tail -3
            cd "$AI"
            set -a; [ -f "$AI/.env" ] && . "$AI/.env"; set +a

            echo "===== 1. Generate squad hero images for bound squads ====="
            timeout 600 npx tsx scripts/generate-squad-hero-images.ts \
              --slugs=fb-monthly-calendar-pulizzi,fb-garyvee-jab-hook,fb-countdown-series,fb-account-reposition,fb-quarterly-strategy,fb-monthly-analytics \
              2>&1 | tail -50

            echo ""
            echo "===== 2. Audit mockup coverage ====="
            npx tsx scripts/audit-mockup-coverage.ts 2>&1 | tail -40

            echo ""
            echo "===== 3. Re-run agent-fit audit (LLM judge) ====="
            timeout 600 npx tsx scripts/audit-agent-fit.ts 2>&1 | tail -10

            echo ""
            echo "===== Mockup coverage report ====="
            cat /tmp/mockup-coverage.md 2>/dev/null

            echo ""
            echo "===== Agent-fit summary ====="
            grep -E "summary|good|marginal|mismatch" /tmp/agent-fit-audit.md 2>/dev/null | tail -10
