name: Admin — Probe recent task images

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            cd /opt/marketing-os/app/skills/ai-talent
            set -a; . ./.env; set +a
            export MYSQL_PWD="${LOCAL_DB_PASSWORD}"
            MYSQL="mysql -h ${LOCAL_DB_HOST:-localhost} -u ${LOCAL_DB_USER:-mos_user} ${LOCAL_DB_NAME:-mos_db}"

            echo "=== recent mission_outputs (last 15) ==="
            $MYSQL -e "SELECT id, userId, tier, status, imageUrl IS NOT NULL AS hasImg, LEFT(errorMsg, 80) AS err, createdAt FROM mission_outputs ORDER BY id DESC LIMIT 15" -t 2>&1 | head -25

            echo ""
            echo "=== variant-level imageUrl from latest task_run_variants ==="
            $MYSQL -e "SELECT id, taskRunId, platform, imageStatus, LEFT(imageUrl, 60) AS url, LEFT(imageErrorMsg, 80) AS err FROM task_run_variants ORDER BY id DESC LIMIT 15" -t 2>&1 | head -25

            echo ""
            echo "=== piapi-related log lines (last 200 OUT) ==="
            LOG_OUT=/home/$(whoami)/.pm2/logs/marketing-os-out.log
            tail -500 "$LOG_OUT" 2>/dev/null | grep -iE "piapi|flux|genOneImage|dispatchGenerate" | tail -30

            echo ""
            echo "=== runOrchestra image branch (last 500 OUT) ==="
            tail -500 "$LOG_OUT" 2>/dev/null | grep -iE "image|visual" | grep -v "/static/" | tail -30
