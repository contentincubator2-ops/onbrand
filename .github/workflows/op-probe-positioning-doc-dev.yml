name: "Op — Probe 定位文件上傳 on DEV (真實資料，會自我還原)"

# 2026-09-01。typecheck 與單元測試證明不了的三件事，只有真的在 DEV VM 上跑
# 才知道：
#   1. dev VM 有沒有 python3 + lxml（抽取器整條路徑靠它）
#   2. HTTP 層（express.raw / JWT / 品牌權限）接不接得起來
#   3. 產品／活動定位的 canonical 修正，套在真的資料上有沒有效
#
# 會寫入 positioning，所以 probe 自己在開頭快照整欄、finally 還原，並逐字元
# 比對確認還原成功。跑在真實品牌上，不是測試資料。

# dev 分支上沒有 workflow_dispatch（那只在預設分支可用），所以跟
# dev-tail-logs.yml 一樣：改觸發檔再 push。要指定品牌就把 id 寫進
# ops/probe-positioning/brand（留空 = 自動挑最新一個有定位的）。
on:
  push:
    branches: [dev]
    paths:
      - "ops/probe-positioning/**"

permissions:
  contents: read

concurrency:
  group: probe-positioning-doc
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    environment: dev
    steps:
      - name: Probe on the DEV VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            AI=/opt/onbrand/current/skills/ai-talent
            cd "$AI"

            echo "host: $(hostname)"
            echo "release: $(readlink -f /opt/onbrand/current)"
            echo

            # lxml 是抽取器唯一的非 stdlib 相依。粉絲團月報那支 parse_template.py
            # 也用它，所以理論上早就在了 —— 但「理論上」正是這支 probe 要消滅的東西。
            if ! python3 -c "import lxml" 2>/dev/null; then
              echo "!! python3 缺 lxml —— 嘗試安裝"
              (python3 -m pip install --quiet lxml || sudo apt-get install -y python3-lxml) || true
            fi

            # 觸發檔跟著 release 一起上機，所以品牌 id 直接從那份讀。
            # 只認「整行就是數字」的那一行。原本用 tr -cd '0-9' 把整份檔案的
            # 數字都吸進來，註解裡的 "trigger 2" 就變成了品牌 id 2。
            TRIG=/opt/onbrand/current/ops/probe-positioning/brand
            BRAND_ID="$(grep -oE '^[0-9]+$' "$TRIG" 2>/dev/null | head -1 || true)"
            echo "brand id from trigger file: ${BRAND_ID:-(auto)}"

            ./node_modules/.bin/tsx scripts/probe-positioning-doc.ts $BRAND_ID
