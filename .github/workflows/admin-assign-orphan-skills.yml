name: Admin — Assign skills to orphan agents

# For every agent NOT referenced by any squad (lead_agent_id or
# step.assignedAgentId), pick up to N skill_catalog entries that are
# provider-compatible with the agent's aiModel family, scored by token
# overlap with the agent's primarySkill+title. Insert into
# agent_skill_assignments (UNIQUE on agentId+skillSlug, idempotent).
#
# Prerequisites:
#   - admin-migrate-modelstack.yml (creates agent_skill_assignments)
#   - admin-load-skill-catalog.yml (populates skill_catalog)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Show stats only (no INSERT)"
        type: boolean
        default: true
      max_skills:
        description: "Max skills per orphan agent"
        type: string
        default: "5"
      limit:
        description: "Limit orphans processed (0 = all)"
        type: string
        default: "0"

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          MAX_SKILLS: ${{ inputs.max_skills }}
          LIMIT_N: ${{ inputs.limit }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 1200s
          envs: GH_TOKEN,DRY_RUN,MAX_SKILLS,LIMIT_N
          script: |
            set -e
            APP=/opt/marketing-os/app
            REPO="https://x-access-token:${GH_TOKEN}@github.com/contentincubator2-ops/Marketing-OS.git"
            cd "$APP"
            git remote set-url origin "$REPO"
            git fetch origin main
            git reset --hard origin/main
            cd "$APP/skills/ai-talent"
            if [ ! -d node_modules ]; then npm install --legacy-peer-deps --no-audit --no-fund 2>&1 | tail -5; fi
            ARGS=""
            if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
            if [ -n "$MAX_SKILLS" ] && [ "$MAX_SKILLS" != "5" ]; then ARGS="$ARGS --max-skills=$MAX_SKILLS"; fi
            if [ -n "$LIMIT_N" ] && [ "$LIMIT_N" != "0" ]; then ARGS="$ARGS --limit=$LIMIT_N"; fi
            echo "════════════════════════════════════════════════════════════════"
            echo "  🎯 Assign orphan skills (args: $ARGS)"
            echo "════════════════════════════════════════════════════════════════"
            npx tsx scripts/assign-orphan-skills.ts $ARGS
