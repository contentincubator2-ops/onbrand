name: Admin — Fix VM remote URL + scan guo.chen login files

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            echo "===== Fix /home/azureuser/marketing-os remote URL ====="
            cd /home/azureuser/marketing-os
            git remote set-url origin https://github.com/contentincubator2-ops/Marketing-OS.git
            git remote -v
            git fetch origin main && git reset --hard origin/main
            echo "Latest commit: $(git log --oneline -1)"

            echo ""
            echo "===== What PM2 is currently running ====="
            pm2 list

            echo ""
            echo "===== Scan guo.chen login files in /opt/marketing-os-backend ====="
            BE=/opt/marketing-os/marketing-os-backend
            FE=/opt/marketing-os/marketing-os-frontend

            echo "--- Backend git log (last 20 commits) ---"
            cd "$BE" && git log --oneline -20

            echo ""
            echo "--- Frontend git log (last 20 commits) ---"
            cd "$FE" && git log --oneline -20

            echo ""
            echo "--- Files changed in backend vs main branch ---"
            cd "$BE" && git diff --name-only HEAD~10 HEAD 2>/dev/null | head -40

            echo ""
            echo "--- Files changed in frontend vs main branch ---"
            cd "$FE" && git diff --name-only HEAD~10 HEAD 2>/dev/null | head -40

            echo ""
            echo "--- LoginPage files in frontend ---"
            find "$FE" -name "Login*" -o -name "login*" 2>/dev/null | grep -v node_modules | grep -v ".git"

            echo ""
            echo "--- Auth/session files in backend ---"
            find "$BE" -name "*.ts" 2>/dev/null | xargs grep -l "session\|cookie\|LoginPage" 2>/dev/null | grep -v node_modules | grep -v ".git" | head -20

            echo ""
            echo "--- Backend .env exists? ---"
            ls -la "$BE/.env" 2>/dev/null || echo "no .env"

            echo ""
            echo "--- Nginx config ---"
            cat /etc/nginx/sites-enabled/marketing-os 2>/dev/null || cat /etc/nginx/sites-enabled/default 2>/dev/null | head -40
