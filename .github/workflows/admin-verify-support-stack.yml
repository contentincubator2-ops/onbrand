name: Admin — Verify support stack end-to-end

# Self-verification after the 5-layer support deploy. Checks:
#   1. DB tables created (migration ran)
#   2. supportRouter mounted (trpc call returns auth challenge, not 404)
#   3. /changelog.md served as text/markdown
#   4. /admin/support and /changelog routes return the SPA shell (200)
#   5. Client bundle includes SupportDrawer + AdminSupportPage + ChangelogPage
#   6. pm2 onbrand healthy, no crash
#   7. Direct LLM smoke test (Mia would respond)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 5
    steps:
      - name: 1 · DB tables exist
        run: |
          set -e
          AI=/opt/onbrand/app/skills/ai-talent
          set -a; source "$AI/.env" 2>/dev/null; set +a
          export MYSQL_PWD="${LOCAL_DB_PASSWORD}"
          MYSQL="mysql -h ${LOCAL_DB_HOST:-localhost} -u ${LOCAL_DB_USER:-mos_user} ${LOCAL_DB_NAME:-mos_db} -B -N --silent"

          for tbl in support_conversations support_messages support_tickets; do
            cnt=$($MYSQL -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name='$tbl'")
            if [ "$cnt" = "1" ]; then echo "  ✓ $tbl"; else echo "  ❌ $tbl MISSING"; exit 1; fi
          done

      - name: 2 · supportRouter is mounted
        run: |
          set -e
          # Unauth call should return 401 UNAUTHORIZED (router exists), not 404
          RESP=$(curl -s -o /tmp/r.json -w "%{http_code}" \
            -X POST "http://localhost:3101/trpc/support.startConversation?batch=1" \
            -H "Content-Type: application/json" \
            -d '{"0":{"json":{}}}')
          echo "  POST /trpc/support.startConversation → $RESP"
          BODY=$(head -c 300 /tmp/r.json)
          echo "  body: $BODY"
          if echo "$BODY" | grep -q "UNAUTHORIZED\|UNAUTHENTICATED\|cookie"; then
            echo "  ✓ router responding with auth challenge"
          elif echo "$BODY" | grep -qi "no procedure\|not found"; then
            echo "  ❌ router NOT mounted"; exit 1
          else
            echo "  ⚠ unexpected (might still be OK if shape differs)"
          fi

      - name: 3 · changelog.md served
        run: |
          set -e
          curl -s -o /tmp/cl.md -w "  http=%{http_code} size=%{size_download} type=%{content_type}\n" \
            "http://localhost:3101/static/changelog.md"
          head -c 200 /tmp/cl.md
          echo ""
          if grep -q "OnBrand AI · 更新日誌" /tmp/cl.md; then
            echo "  ✓ markdown loaded"
          else
            echo "  ❌ markdown content unexpected"; exit 1
          fi

      - name: 4 · SPA routes return shell
        run: |
          set -e
          for route in "/admin/support" "/changelog"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3101$route")
            if [ "$STATUS" = "200" ]; then echo "  ✓ $route → 200"; else echo "  ❌ $route → $STATUS"; exit 1; fi
          done

      - name: 5 · client bundle includes the new components
        run: |
          set -e
          AI=/opt/onbrand/app/skills/ai-talent
          # Pick the LARGEST bundle (main app code; minor chunks are small)
          BUNDLE=$(ls -S "$AI/public/assets/index-"*.js | head -1)
          echo "  bundle: $BUNDLE  ($(stat -c%s $BUNDLE) bytes)"
          # Component class names get minified; only check user-visible UTF-8 strings
          # that survive minification (DiceBear seed + Chinese UI labels).
          for sym in "mia-cs-onbrand" "客戶成功" "更新日誌" "我要找真人"; do
            if grep -q "$sym" "$BUNDLE"; then echo "  ✓ $sym"
            else echo "  ❌ $sym missing from bundle"; exit 1; fi
          done

      - name: 6 · pm2 onbrand healthy
        run: |
          set -e
          STATUS=$(pm2 jlist 2>/dev/null | jq -r '.[] | select(.name=="onbrand") | .pm2_env.status')
          UPTIME=$(pm2 jlist 2>/dev/null | jq -r '.[] | select(.name=="onbrand") | (.pm2_env.pm_uptime / 1000 | floor)')
          NOW=$(date +%s)
          AGE=$((NOW - UPTIME))
          RESTARTS=$(pm2 jlist 2>/dev/null | jq -r '.[] | select(.name=="onbrand") | .pm2_env.restart_time')
          echo "  status=$STATUS  uptime=${AGE}s  restart_time=$RESTARTS"
          if [ "$STATUS" = "online" ] && [ "$AGE" -gt 5 ]; then
            echo "  ✓ healthy"
          else
            echo "  ❌ unhealthy"; exit 1
          fi

      - name: 7 · LLM smoke test (Mia would respond)
        run: |
          set -e
          AI=/opt/onbrand/app/skills/ai-talent
          set -a; source "$AI/.env" 2>/dev/null; set +a
          cd "$AI"
          npx tsx -e "
            import { callModel } from './server/_core/multiModelRouter';
            (async () => {
              const r = await callModel([
                { role: 'system', content: '你是 Mia · OnBrand AI 客戶成功經理。回覆繁中，最多 2 句話。' },
                { role: 'user', content: '我跑 30s 任務但圖沒出來怎麼辦' },
              ], 'general');
              console.log('provider:', r.provider, 'model:', r.model);
              console.log('reply:', r.content);
            })().catch(e => { console.error('LLM FAIL:', e?.message); process.exit(1); });
          " 2>&1 | tail -20

      - name: 8 · recent ERROR log (any crashes?)
        run: |
          set -e
          tail -50 ~/.pm2/logs/onbrand-error.log 2>/dev/null | grep -iE "ENOENT|TypeError|Cannot read|SyntaxError|crash|killed" | tail -10 || echo "  ✓ no fatal errors in last 50 ERR lines"
