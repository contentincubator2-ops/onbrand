name: Admin — regenerate Notion-style avatars

# Modes:
#   bound_to_active (default) — only agents on active task_catalog rows.
#                                ~10-20 agents, safe.
#   all                       — every agent in DB (~14k). Set
#                                I_KNOW_THE_COST=1 to actually run.
#                                Otherwise script aborts.
#   ids:1,2,3                 — specific agent IDs.
#
# FORCE=1 regenerates even if file exists.
# LIMIT=N caps the run (good for previewing 5 first).

on:
  workflow_dispatch:
    inputs:
      agents_mode:
        description: "AGENTS env: bound_to_active | all | ids:1,2,3"
        required: false
        default: "bound_to_active"
      force:
        description: "Regenerate even if file exists (1 = yes)"
        required: false
        default: "0"
      limit:
        description: "Cap N agents (0 = unlimited)"
        required: false
        default: "0"
      i_know_the_cost:
        description: "Set 1 only when AGENTS=all (acknowledges $$$)"
        required: false
        default: "0"

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          AGENTS: ${{ github.event.inputs.agents_mode }}
          FORCE: ${{ github.event.inputs.force }}
          LIMIT: ${{ github.event.inputs.limit }}
          I_KNOW_THE_COST: ${{ github.event.inputs.i_know_the_cost }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 1800s   # 30 min — could be long if many agents
          envs: AGENTS,FORCE,LIMIT,I_KNOW_THE_COST,GH_TOKEN
          script: |
            set +e
            APP=/opt/marketing-os/app
            AI=$APP/skills/ai-talent
            cd "$APP"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/contentincubator2-ops/Marketing-OS.git"
            git fetch origin main 2>&1 | tail -3
            git reset --hard origin/main 2>&1 | tail -3
            cd "$AI"
            set -a; [ -f "$AI/.env" ] && . "$AI/.env"; set +a

            echo "===== Regenerate Notion avatars (AGENTS=$AGENTS FORCE=$FORCE LIMIT=$LIMIT) ====="
            timeout 1700 env AGENTS="$AGENTS" FORCE="$FORCE" \
              ${LIMIT:+LIMIT="$LIMIT"} \
              ${I_KNOW_THE_COST:+I_KNOW_THE_COST="$I_KNOW_THE_COST"} \
              npx tsx scripts/regenerate-notion-avatars.ts 2>&1 | tail -200
