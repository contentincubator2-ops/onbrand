name: Admin — Set OpenAI API key

# One-shot: write/update OPENAI_API_KEY in the VM .env.
# The key is passed via workflow_dispatch input (masked by GitHub) so it
# never lands in git. After running, the change takes effect on next pm2
# reload — this workflow restarts ai-marketer at the end.

on:
  workflow_dispatch:
    inputs:
      openaiApiKey:
        description: 'OpenAI API key (sk-... or sk-proj-...) — will be masked in logs'
        required: true
        type: string

jobs:
  set-env:
    runs-on: ubuntu-latest
    steps:
      - name: Mask API key in logs
        run: echo "::add-mask::${{ inputs.openaiApiKey }}"

      - uses: appleboy/ssh-action@v1.0.3
        env:
          OAI_KEY: ${{ inputs.openaiApiKey }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 120s
          envs: OAI_KEY
          script: |
            set -e
            ENV_FILE=/opt/marketing-os/app/skills/ai-talent/.env
            test -f "$ENV_FILE" || { echo ".env not found at $ENV_FILE"; exit 1; }

            # Backup once per day
            cp "$ENV_FILE" "$ENV_FILE.bak.$(date +%Y%m%d)" 2>/dev/null || true

            upsert() {
              local key="$1" val="$2"
              if grep -q "^${key}=" "$ENV_FILE"; then
                sed -i "s|^${key}=.*|${key}=${val}|" "$ENV_FILE"
                echo "[updated] $key"
              else
                printf '\n%s=%s\n' "$key" "$val" >> "$ENV_FILE"
                echo "[appended] $key"
              fi
            }

            upsert OPENAI_API_KEY "$OAI_KEY"

            echo ""
            echo "===== Verifying ====="
            grep -c "^OPENAI_API_KEY=" "$ENV_FILE" || echo "(missing!)"

            echo ""
            echo "===== Smoke test: hit OpenAI from VM ====="
            STATUS=$(curl -sS -o /tmp/oai-test.json -w "%{http_code}" \
              https://api.openai.com/v1/chat/completions \
              -H "Authorization: Bearer $OAI_KEY" \
              -H "Content-Type: application/json" \
              -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"reply with exactly: ok"}],"max_tokens":5}')
            echo "HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "[OK] OpenAI key is live"
            else
              echo "[FAIL] OpenAI rejected the key — response below"
              cat /tmp/oai-test.json
              exit 1
            fi

            echo ""
            echo "===== Restart pm2 ====="
            pm2 restart ai-marketer --update-env 2>&1 | tail -10
            sleep 3
            pm2 status ai-marketer 2>&1 | tail -5
