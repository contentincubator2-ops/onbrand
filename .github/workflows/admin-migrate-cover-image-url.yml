name: Admin — Add skills.cover_image_url

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          script: |
            set -e
            ENV_FILE=/opt/marketing-os/app/skills/ai-talent/.env
            set -a; source "$ENV_FILE"; set +a
            DB_HOST="${DB_HOST:-127.0.0.1}"; DB_USER="${DB_USER:-root}"; DB_NAME="${DB_NAME:-mos_db}"

            run_sql() { MYSQL_PWD="$DB_PASSWORD" mysql -h"$DB_HOST" -u"$DB_USER" "$DB_NAME" -e "$1"; }

            HAS=$(MYSQL_PWD="$DB_PASSWORD" mysql -h"$DB_HOST" -u"$DB_USER" -N -B -e \
              "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='$DB_NAME' AND table_name='skills' AND column_name='cover_image_url'" "$DB_NAME")
            if [ "$HAS" = "0" ]; then
              run_sql "ALTER TABLE skills ADD COLUMN cover_image_url VARCHAR(512) NULL;"
              echo "+ added cover_image_url"
            else
              echo "= cover_image_url exists"
            fi

            run_sql "DESCRIBE skills" | grep cover_image_url
