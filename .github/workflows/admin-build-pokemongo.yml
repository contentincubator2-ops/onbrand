name: "Admin — Build Pokémon GO brand assets (lucas.lai@sowork.tw)"

# 2026-07-29 (CJ: 新建 Pokémon GO 品牌＋未來兩個月活動定位＋嚴格視覺規範).
# Brand already exists (id 2869, built by a parallel track) — this fills:
# description/brand_colors grounding, FB+IG AI 指令庫 (with hard IP-safety
# constraints for image generation), and 6 real researched Aug–Sep 2026
# events each with full 11-segment positioning. Idempotent — safe to re-run.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full = 建品牌資產+6活動；season-patch = 只補10週年雙Logo規則"
        type: choice
        default: "full"
        options: ["full", "season-patch"]

jobs:
  build:
    runs-on: [self-hosted, linux, vm-onbrand]
    timeout-minutes: 35
    steps:
      - name: Build Pokémon GO brand assets + events
        run: |
          set -e
          cd /opt/onbrand/app/skills/ai-talent
          set -a; source .env; set +a
          if [ "${{ github.event.inputs.mode }}" = "season-patch" ]; then
            npx tsx scripts/admin-patch-pokemongo-season.ts
          else
            npx tsx scripts/admin-build-pokemongo.ts
          fi
