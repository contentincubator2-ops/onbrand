name: Admin — Set EMAIL_FROM in prod .env

# 2026-05-08 + 2026-05-14 (CJ「客服信箱統一 sowork@sowork.ai」)
#
# Quick toggle for the EMAIL_FROM env var without touching anything else.
#
# ⚠️ Pre-flight checklist before running this with a sowork.ai address:
#   1. Resend Dashboard → Domains → sowork.ai must show "Verified"
#      (DKIM + SPF + Return-Path DNS records all green)
#   2. If you switch to an unverified domain, Resend rejects sends with
#      HTTP 403 — registration / forgot-password emails silently fail
#      (the auth flow falls through to best-effort).
#
# Common values:
#   - sowork@sowork.ai          ← current target (unified customer-service inbox)
#   - noreply@sowork.ai         ← classic no-reply sender, harder to look spammy
#   - onboarding@resend.dev     ← Resend's pre-verified fallback (use only if DNS broken)
#
# Safe to re-run.

on:
  workflow_dispatch:
    inputs:
      email_from:
        description: "EMAIL_FROM value (Resend sender). Verify domain in Resend first."
        required: true
        default: "sowork@sowork.ai"
      test_to:
        description: "Optional: send a test email to this address after the switch (leave blank to skip)"
        required: false
        default: ""

jobs:
  set-email-from:
    runs-on: ubuntu-latest
    steps:
      - name: Update .env on VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          NEW_VAL: ${{ inputs.email_from }}
          TEST_TO: ${{ inputs.test_to }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 90s
          envs: NEW_VAL,TEST_TO
          script: |
            set -e
            ENV_FILE=/opt/marketing-os/app/skills/ai-talent/.env

            if [ ! -f "$ENV_FILE" ]; then
              echo "❌ .env not found at $ENV_FILE"; exit 1
            fi

            # Basic email-shape check
            case "$NEW_VAL" in
              *@*.*) ;;
              *) echo "❌ value '$NEW_VAL' doesn't look like an email"; exit 1 ;;
            esac

            if grep -qE "^EMAIL_FROM=" "$ENV_FILE"; then
              awk -v val="$NEW_VAL" '
                /^EMAIL_FROM=/ { print "EMAIL_FROM=" val; next }
                { print }
              ' "$ENV_FILE" > "${ENV_FILE}.tmp" && mv "${ENV_FILE}.tmp" "$ENV_FILE"
              echo "  ✓ updated EMAIL_FROM"
            else
              echo "EMAIL_FROM=$NEW_VAL" >> "$ENV_FILE"
              echo "  ✓ appended EMAIL_FROM"
            fi

            v=$(grep -E "^EMAIL_FROM=" "$ENV_FILE" | head -1 | cut -d= -f2-)
            echo "  EMAIL_FROM = $v"

            echo ""
            echo "── Restarting marketing-os ──"
            pm2 restart marketing-os --update-env 2>&1 | tail -3
            sleep 3
            curl -s -o /dev/null -w "Health: HTTP %{http_code}\n" http://127.0.0.1:3101/health || true
            echo ""
            echo "✓ Done."

            # ── Optional smoke test: send a real email via Resend ─────
            if [ -n "$TEST_TO" ]; then
              echo ""
              echo "── Sending test email to $TEST_TO ──"
              set -a; source "$ENV_FILE" 2>/dev/null; set +a
              if [ -z "$RESEND_API_KEY" ]; then
                echo "⚠ RESEND_API_KEY not set — skipping test send"
              else
                http_code=$(curl -s -o /tmp/resend.out -w "%{http_code}" \
                  -X POST https://api.resend.com/emails \
                  -H "Authorization: Bearer $RESEND_API_KEY" \
                  -H "Content-Type: application/json" \
                  --data "{\"from\":\"$NEW_VAL\",\"to\":[\"$TEST_TO\"],\"subject\":\"OnBrand EMAIL_FROM probe\",\"text\":\"This is a probe send confirming EMAIL_FROM=$NEW_VAL works end-to-end. If you got this, the Resend sender domain is verified.\"}")
                echo "  HTTP $http_code"
                head -c 600 /tmp/resend.out; echo
                if [ "$http_code" = "200" ]; then
                  echo "  ✓ Resend accepted the send — check $TEST_TO inbox in <1min."
                else
                  echo "  ✗ Resend rejected — most common cause: sender domain not verified."
                  echo "    Fix: Resend Dashboard → Domains → sowork.ai → add DNS records → wait for Verified."
                fi
              fi
            fi
