name: Admin — Force rebuild + restart on VM (rsync, no VM git)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest source
        uses: actions/checkout@v4

      - name: Set up SSH for rsync
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync source to VM
        run: |
          # Sync skills/ai-talent/ source (server + client + scripts + drizzle)
          # Exclude node_modules, public (built artifact), .env (server-managed)
          rsync -avz --delete \
            --exclude='node_modules' \
            --exclude='public' \
            --exclude='public.bak' \
            --exclude='.env' \
            --exclude='dist' \
            --exclude='.git' \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            ./skills/ai-talent/ \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/opt/onbrand/app/skills/ai-talent/

      - name: Build + restart on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 600s
          script: |
            set -e
            cd /opt/onbrand/app/skills/ai-talent

            echo "════════ BACKUP public ════════"
            rm -rf public.bak 2>/dev/null
            [ -d public ] && cp -r public public.bak

            echo ""
            echo "════════ REBUILD CLIENT (vite writes to ../public) ════════"
            cd client
            npm install --no-audit --no-fund --silent 2>&1 | tail -5
            npm run build 2>&1 | tail -20
            cd ..
            echo "── public/ after build ──"
            ls -la public/assets/ | grep "index.*js" | head -3

            echo ""
            echo "════════ RESTART pm2 ════════"
            pm2 restart onbrand --update-env
            sleep 3
            pm2 status | grep onbrand

            echo ""
            echo "════════ VERIFY new code in main bundle ════════"
            for B in public/assets/index-*.js; do
              S=$(stat -c%s "$B")
              if [ $S -gt 1000000 ]; then
                echo "── $B ($S bytes) ──"
                echo "  outputTypeToFormat (3-layer fallback): $(grep -c 'outputTypeToFormat' "$B" 2>/dev/null || echo 0)"
                echo "  no-task chip (should be 1):             $(grep -c 'no-task' "$B" 2>/dev/null || echo 0)"
                echo "  L1 brand+research check:                $(grep -c 'proposal-cover' "$B" 2>/dev/null || echo 0)"
              fi
            done
