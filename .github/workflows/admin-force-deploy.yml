name: Admin — Force rebuild + restart on VM

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 600s
          script: |
            set -e
            cd /opt/marketing-os/app/skills/ai-talent

            echo "════════ BEFORE ════════"
            echo "── pm2 ──"
            pm2 status | grep marketing-os || echo "(no marketing-os)"
            echo "── public bundle hash ──"
            ls -la public/ 2>/dev/null | grep -E "index.*js" | head -3 || echo "(public/ empty or missing)"
            echo ""
            echo "── client/ folder check ──"
            ls -la client/ 2>/dev/null | head -5
            echo ""

            echo "════════ BACKUP public ════════"
            rm -rf public.bak 2>/dev/null
            [ -d public ] && cp -r public public.bak

            echo ""
            echo "════════ REBUILD CLIENT (vite writes to ../public) ════════"
            cd client
            echo "── npm install (production deps) ──"
            npm install --no-audit --no-fund --silent 2>&1 | tail -5
            echo "── git pull origin main (sync source) ──"
            cd /opt/marketing-os/app && git pull origin main 2>&1 | tail -5
            cd /opt/marketing-os/app/skills/ai-talent/client
            echo "── vite build ──"
            npm run build 2>&1 | tail -20
            cd ..
            echo "── public/ after build ──"
            ls -la public/ | grep "index.*js" | head -3

            echo ""
            echo "════════ RESTART pm2 ════════"
            pm2 restart marketing-os --update-env
            sleep 3
            pm2 status | grep marketing-os

            echo ""
            echo "════════ VERIFY new code in bundle ════════"
            for B in public/assets/index-*.js; do
              echo "── $B ($(stat -c%s "$B") bytes) ──"
              echo "  metadata.taskId 缺失:    $(grep -c 'metadata.taskId' "$B" 2>/dev/null || echo 0)"
              echo "  乾淨一條路:              $(grep -c '乾淨一條路' "$B" 2>/dev/null || echo 0)"
              echo "  此 run 缺少 taskId:      $(grep -c '此 run 缺少 taskId' "$B" 2>/dev/null || echo 0)"
            done
