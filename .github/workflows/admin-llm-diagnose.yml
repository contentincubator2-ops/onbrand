name: Admin — Diagnose LLM provider

# One-shot: tail PM2 logs for LLM errors + list Azure Foundry deployments
# so we can see what model names the provider actually has.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 90s
          script: |
            set +e
            ENV_FILE=/opt/marketing-os/app/skills/ai-talent/.env

            echo "===== Env summary (key masked) ====="
            grep -E '^(AZURE_FOUNDRY_PROJECT_ENDPOINT|LLM_DEFAULT_PROVIDER|AZURE_FOUNDRY_API_KEY|OPENROUTER_API_KEY)=' "$ENV_FILE" \
              | sed -E 's/(_API_KEY=).{8,}/\1***REDACTED***/'

            echo ""
            echo "===== Recent PM2 error logs (last 120 lines, filtered) ====="
            # PM2 log location varies; try both common paths
            for f in \
              $(pm2 info marketing-os 2>/dev/null | grep "error log path" | awk '{print $NF}') \
              /root/.pm2/logs/marketing-os-error.log \
              /home/*/.pm2/logs/marketing-os-error.log
            do
              if [ -f "$f" ]; then
                echo "--- $f ---"
                tail -200 "$f" | grep -iE "llm|azure|foundry|openrouter|provider|DeploymentNotFound|402|404|401|invokeLLM" | tail -40
              fi
            done

            echo ""
            echo "===== Live probe: call Azure Foundry /openai/v1/models ====="
            # shellcheck disable=SC1090
            set -a; source "$ENV_FILE"; set +a
            if [ -n "$AZURE_FOUNDRY_PROJECT_ENDPOINT" ] && [ -n "$AZURE_FOUNDRY_API_KEY" ]; then
              BASE="${AZURE_FOUNDRY_PROJECT_ENDPOINT%/}/openai/v1"
              echo "GET $BASE/models"
              curl -sS -w "\nHTTP %{http_code}\n" \
                -H "api-key: $AZURE_FOUNDRY_API_KEY" \
                "$BASE/models" | head -60
            else
              echo "AZURE_FOUNDRY_* env vars missing"
            fi

            echo ""
            echo "===== Live probe: chat/completions with gpt-4o-mini ====="
            if [ -n "$BASE" ]; then
              curl -sS -w "\nHTTP %{http_code}\n" \
                -H "api-key: $AZURE_FOUNDRY_API_KEY" \
                -H "content-type: application/json" \
                -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"hi"}],"max_tokens":10}' \
                "$BASE/chat/completions" | head -40
            fi

            echo ""
            echo "Done."
