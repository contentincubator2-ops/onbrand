name: Admin - reseed FB monthly calendar squad
on:
  workflow_dispatch:
jobs:
  reseed:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 120s
          script: |
            set -a
            [ -f /opt/marketing-os/.env ] && . /opt/marketing-os/.env
            [ -f /opt/marketing-os/app/skills/ai-talent/.env ] && . /opt/marketing-os/app/skills/ai-talent/.env
            set +a
            cd /opt/marketing-os/app/skills/ai-talent 2>/dev/null || cd /opt/marketing-os/skills/ai-talent
            DB_HOST_V=${DB_HOST:-127.0.0.1}
            DB_USER_V=${DB_USER:-root}
            DB_NAME_V=${DB_NAME:-mos_db}

            echo "STEP 1: delete existing draft squad (is_approved=0 only — refuse if approved)"
            MYSQL_PWD="$DB_PASSWORD" mysql -h"$DB_HOST_V" -u"$DB_USER_V" "$DB_NAME_V" -t -e "
              DELETE FROM squads
               WHERE slug = 'fb-monthly-calendar-pulizzi'
                 AND is_approved = 0;"

            echo ""
            echo "STEP 2: re-run seed script with new schema"
            timeout 60 npx tsx scripts/seed-fb-monthly-calendar-squad.ts 2>&1

            echo ""
            echo "STEP 3: verify new steps"
            MYSQL_PWD="$DB_PASSWORD" mysql -h"$DB_HOST_V" -u"$DB_USER_V" "$DB_NAME_V" -t -e "
              SELECT id, slug, is_approved, JSON_LENGTH(steps) AS step_count
                FROM squads WHERE slug = 'fb-monthly-calendar-pulizzi';"
            MYSQL_PWD="$DB_PASSWORD" mysql -h"$DB_HOST_V" -u"$DB_USER_V" "$DB_NAME_V" -t -e "
              SELECT
                JSON_UNQUOTE(JSON_EXTRACT(steps, '\$[1].name')) AS step1_name,
                JSON_LENGTH(JSON_EXTRACT(steps, '\$[1].userInputFields')) AS step1_input_field_count,
                JSON_UNQUOTE(JSON_EXTRACT(steps, '\$[1].userInputFields[0].key')) AS first_field
                FROM squads WHERE slug = 'fb-monthly-calendar-pulizzi';"

            echo "Done"
