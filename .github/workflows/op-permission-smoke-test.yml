name: Ops — Permission smoke test
# 2026-08-21: minimal manual-dispatch workflow used to verify that pushes to
# main and workflow_dispatch runs both work. Safe to delete once confirmed.
on:
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note echoed into the run log"
        required: false
        default: "permission smoke test"
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Echo run context
        run: |
          echo "✅ workflow_dispatch reached a runner"
          echo "note:       ${{ inputs.note }}"
          echo "actor:      ${{ github.actor }}"
          echo "ref:        ${{ github.ref }}"
          echo "sha:        ${{ github.sha }}"
          echo "repository: ${{ github.repository }}"
