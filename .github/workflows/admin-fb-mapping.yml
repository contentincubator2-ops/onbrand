name: Admin — FB agent/skill mapping for 30s tasks

on:
  workflow_dispatch:

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 90s
          script: |
            export MYSQL_PWD="mos_secure_2026"
            MYSQL="mysql -h localhost -u mos_user mos_db -B -N --silent"

            echo "=== A. Agents whose primarySkill suggests FB / caption / copy / hook / crisis / story ==="
            $MYSQL -e "SELECT id, name, title, primarySkill FROM agents WHERE isAvailable=1 AND (primarySkill LIKE '%fb-%' OR primarySkill LIKE '%hook%' OR primarySkill LIKE '%caption%' OR primarySkill LIKE '%copywriting%' OR primarySkill LIKE '%hashtag%' OR primarySkill LIKE '%crisis%' OR primarySkill LIKE '%comment%' OR primarySkill LIKE '%story%' OR primarySkill LIKE '%pinned%' OR primarySkill LIKE '%countdown%') ORDER BY primarySkill, id LIMIT 60"

            echo ""
            echo "=== B. Agents with FB in slug/name ==="
            $MYSQL -e "SELECT id, slug, name, title, primarySkill FROM agents WHERE isAvailable=1 AND (slug LIKE 'fb-%' OR slug LIKE '%-fb-%' OR title LIKE '%FB%' OR title LIKE '%Facebook%') ORDER BY id LIMIT 30"

            echo ""
            echo "=== C. Skills in skill_catalog matching FB tasks ==="
            $MYSQL -e "SELECT slug, name, category FROM skill_catalog WHERE slug LIKE 'fb-%' OR slug LIKE '%hook%' OR slug LIKE '%caption%' OR slug LIKE '%copywriting%' OR slug LIKE '%hashtag%' OR slug LIKE '%crisis%' OR slug LIKE '%comment%' OR slug LIKE '%pinned%' OR slug LIKE '%countdown%' OR slug LIKE '%story%' OR slug LIKE '%brief%' ORDER BY category, slug LIMIT 60"

            echo ""
            echo "=== D. Skill categories overview ==="
            $MYSQL -e "SELECT category, COUNT(*) AS n FROM skill_catalog WHERE category LIKE 'fb-%' OR category LIKE '%-fb%' OR category LIKE '%facebook%' GROUP BY category ORDER BY n DESC LIMIT 15"

            echo ""
            echo "=== E. Existing FB squads (for 90s tier mapping) ==="
            $MYSQL -e "SELECT id, slug, name, missionType, JSON_LENGTH(steps) AS step_count FROM squads WHERE is_active=1 AND is_approved=1 AND (slug LIKE 'fb-%' OR workspace='[\"facebook\"]' OR workspace='facebook') ORDER BY slug LIMIT 30"

            echo ""
            echo "=== Done ==="
