name: Admin — Apply L1-v2 (upgrade 5 legacy squads to Golden Standard)

# UPSERT 5 L1 squads to golden standard format (preserves existing id
# because upsertSquad uses slug as key). Creates 5 new VP lead agents.
# Result: all 15 L1/core squads at golden standard.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY to run'
        required: true
        type: string

jobs:
  apply:
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm == 'APPLY' }}
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 240s
          script: |
            set -e
            cd /home/azureuser/marketing-os
            echo "[vm] pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            cd skills/ai-talent
            if [ ! -d node_modules ]; then
              npm install
            fi

            echo ""
            echo "===== STEP A: build-L1-v2 (upsert 5 legacy L1 squads) ====="
            npm run db:build-L1-v2

            DB_USER=$(grep -E '^DB_USER=' .env | cut -d= -f2- | tr -d '"' | tr -d "'")
            DB_PASS=$(grep -E '^DB_PASSWORD=' .env | cut -d= -f2- | tr -d '"' | tr -d "'")
            DB_NAME=$(grep -E '^DB_NAME=' .env | cut -d= -f2- | tr -d '"' | tr -d "'")

            echo ""
            echo "===== STEP B: apply aiModel=claude-opus-4-6 + metadata to all 25 leads ====="
            npm run db:upgrade-lead-fields -- --apply

            echo ""
            echo "===== STEP B2: set aiModel=claude-opus-4-6 on 5 new L1-v2 leads ====="
            mysql --host=127.0.0.1 --user="${DB_USER}" --password="${DB_PASS}" --default-character-set=utf8mb4 "${DB_NAME}" \
              -e "UPDATE agents
                  SET aiModel = 'claude-opus-4-6'
                  WHERE id IN (238863, 238864, 238865, 238866, 238867);
                  SELECT ROW_COUNT() AS updated;"

            echo ""
            echo "===== STEP C: Verify all 15 L1/core are golden standard ====="
            mysql --host=127.0.0.1 --user="${DB_USER}" --password="${DB_PASS}" --default-character-set=utf8mb4 "${DB_NAME}" \
              -e "SELECT id, slug, name,
                         JSON_LENGTH(agents) AS members,
                         JSON_LENGTH(steps) AS steps,
                         JSON_LENGTH(use_cases) AS uc,
                         JSON_LENGTH(output_formats) AS ofmt,
                         JSON_LENGTH(showcases) AS sc,
                         industry_key,
                         token
                  FROM squads
                  WHERE strategy_layer='L1_brand' AND tier='core' AND is_active=1
                  ORDER BY id;"

            echo ""
            echo "===== STEP D: Golden standard compliance (all 15 should be 0) ====="
            mysql --host=127.0.0.1 --user="${DB_USER}" --password="${DB_PASS}" --default-character-set=utf8mb4 "${DB_NAME}" \
              -e "SELECT
                    SUM(CASE WHEN JSON_LENGTH(agents) < 6 THEN 1 ELSE 0 END) AS members_too_few,
                    SUM(CASE WHEN JSON_LENGTH(steps) < 5 THEN 1 ELSE 0 END) AS steps_too_few,
                    SUM(CASE WHEN JSON_LENGTH(use_cases) < 2 THEN 1 ELSE 0 END) AS uc_too_few,
                    SUM(CASE WHEN JSON_LENGTH(output_formats) < 4 THEN 1 ELSE 0 END) AS ofmt_too_few,
                    SUM(CASE WHEN JSON_LENGTH(showcases) < 1 THEN 1 ELSE 0 END) AS sc_too_few,
                    SUM(CASE WHEN industry_key IS NULL OR industry_key='' THEN 1 ELSE 0 END) AS ik_null,
                    SUM(CASE WHEN token < 55000 THEN 1 ELSE 0 END) AS token_low
                  FROM squads
                  WHERE strategy_layer='L1_brand' AND tier='core' AND is_active=1;"

            echo ""
            echo "===== STEP E: Lead agent aiModel distribution (should be all claude-opus-4-6) ====="
            mysql --host=127.0.0.1 --user="${DB_USER}" --password="${DB_PASS}" --default-character-set=utf8mb4 "${DB_NAME}" \
              -e "SELECT a.aiModel, COUNT(DISTINCT a.id) AS lead_count
                  FROM squads s,
                    JSON_TABLE(s.agents, '\$[*]' COLUMNS (
                      agent_id INT PATH '\$.agent_id',
                      is_lead BOOLEAN PATH '\$.is_lead'
                    )) AS m
                  LEFT JOIN agents a ON a.id = m.agent_id
                  WHERE s.strategy_layer='L1_brand' AND s.tier='core' AND s.is_active=1
                    AND m.is_lead = 1
                  GROUP BY a.aiModel
                  ORDER BY lead_count DESC;"
