name: Admin — Diagnose missing task save (fb-60-serial-3)
# User reported: 文案寫出來了但沒存進資料庫. The 3-tier fallback should
# have caught this — check pm2 error log, DLQ JSONL, and DB mission rows.
on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'taskId to search for (e.g. fb-60-serial-3)'
        required: true
        default: 'fb-60-serial-3'
jobs:
  diag:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 3
    steps:
      - name: pm2 error log — last 200 lines mentioning recordTaskRun or the task
        run: |
          set +e
          TID="${{ github.event.inputs.task_id }}"
          echo "── task = $TID ──"
          tail -1500 /home/azureuser/.pm2/logs/onbrand-error.log 2>&1 | grep -iE "recordTaskRun|${TID}|INSERT mission_outputs|ensureMission|tier=" | tail -40 || echo "  (no matches in error log)"
          echo ""
          echo "── pm2 out log — last 400 lines mentioning task ──"
          tail -1500 /home/azureuser/.pm2/logs/onbrand-out.log 2>&1 | grep -iE "${TID}|fb-60|quickTask|runOrchestra" | tail -30 || echo "  (no matches in out log)"

      - name: DLQ JSONL state
        run: |
          set +e
          DLQ=/home/azureuser/.pm2/logs/task-runs-failed.jsonl
          if [ ! -f "$DLQ" ]; then
            echo "DLQ file does not exist — no captured failures."
          else
            echo "── DLQ line count ──"
            wc -l "$DLQ"
            echo "── all entries (last 200 chars each) ──"
            awk 'NR <= 100' "$DLQ" | while read line; do
              echo "${line:0:200}..."
            done
          fi

      - name: DB — missions matching this task + their outputs
        run: |
          set +e
          AI=/opt/onbrand/app/skills/ai-talent
          set -a; source "$AI/.env" 2>/dev/null; set +a
          export MYSQL_PWD="${LOCAL_DB_PASSWORD}"
          MYSQL="mysql -h ${LOCAL_DB_HOST:-localhost} -u ${LOCAL_DB_USER:-mos_user} ${LOCAL_DB_NAME:-mos_db}"
          TID="${{ github.event.inputs.task_id }}"

          echo "── matching mission rows ──"
          $MYSQL -t -e "
            SELECT id, userId, brandId, workspace, title, status,
                   LEFT(description, 80) AS desc_head, createdAt, updatedAt
              FROM missions
             WHERE description LIKE '%${TID}%'
             ORDER BY id DESC LIMIT 10"

          echo ""
          echo "── their mission_outputs (if any) ──"
          $MYSQL -t -e "
            SELECT mo.id, mo.missionId, mo.platform, mo.outputType,
                   LEFT(mo.title, 60) AS title_head,
                   CHAR_LENGTH(mo.content) AS content_len,
                   mo.status, mo.version, mo.createdAt
              FROM mission_outputs mo
              JOIN missions m ON m.id = mo.missionId
             WHERE m.description LIKE '%${TID}%'
             ORDER BY mo.id DESC LIMIT 10"

          echo ""
          echo "── orphan missions (no outputs) for this task ──"
          $MYSQL -t -e "
            SELECT m.id, m.userId, m.brandId, m.title, m.createdAt
              FROM missions m
             WHERE m.description LIKE '%${TID}%'
               AND NOT EXISTS (SELECT 1 FROM mission_outputs mo WHERE mo.missionId = m.id)
             ORDER BY m.id DESC LIMIT 10"
