name: "Ops — Create IRIS brand under vmdirisfamily (prod)"
# 2026-08-19 (CJ): real-customer onboarding — create the IRIS main-line brand
# under vmdirisfamily@gmail.com on PROD, grounded on the official 品牌手冊
# digest (iris.com.tw is a 91APP JS storefront the crawler can't read).
# Mirrors scripts/admin-create-iris-brands.ts (7/27 training build) but:
#   - owner = the customer account, not sowork@sowork.tw
#   - IRIS main line only (no Iris Girls)
# Idempotent: reuses an existing "IRIS" brand under this user and re-kicks
# positioning instead of duplicating.
on:
  push:
    branches: [ops/iris-vmd-brand]
jobs:
  create:
    runs-on: [self-hosted, linux, vm-onbrand]
    timeout-minutes: 40
    steps:
      - name: Write one-off script into app checkout
        run: |
          cat > /opt/onbrand/app/skills/ai-talent/scripts/_tmp-iris-vmd.ts <<'TSEOF'
          import * as dotenv from "dotenv";
          dotenv.config();
          import localPool from "../server/localDb";
          import { startPositioningJob } from "../server/_core/positioningJobRunner";
          import { buildBrandPositioningSteps } from "../server/_core/positioningSteps";
          import { enqueueProductDiscovery, looksLikeNonProduct } from "../server/_core/productDiscovery";

          const OWNER_EMAIL = "vmdirisfamily@gmail.com";
          const WEBSITE = "https://www.iris.com.tw/";
          const PRODUCTS_URL = "https://www.iris.com.tw/v2/official/SalePageCategory/582194?sortMode=Curator";

          const spec = {
            name: "IRIS",
            slugBase: "iris",
            industry: "服飾",
            tagline: "優雅，不只是穿著，而是一種從容生活的態度。",
            targetAudience:
              "心理年齡 30–40 歲女性，流行意識心態，崇尚皇家經典品味，追求優雅時尚，充滿知性與感性的流行女性化族群",
            socialLinks: {
              facebook: "https://www.facebook.com/irisroyalfamily",
              instagram: "https://www.instagram.com/iris_la_mode/",
            },
            description: [
              "IRIS 艾莉詩，1987 年創立的台灣專櫃女裝品牌（艾莉詩服飾股份有限公司）。",
              "品牌名取自希臘神話彩虹女神 Iris 與法國國花鳶尾花——春天最早綻放的花，象徵豐富而敏銳的藝術感受力；設計團隊的共同使命是創造令人有彩虹般好心情的衣裳，「帶給女性裝扮的喜悅與感動」。",
              "秉持進口素材與優雅時尚的完美結合，40 年來持續吸收日本、韓國、歐洲流行資訊與素材，注重每一件衣服的設計、打版、縫製細節；只做能修飾女性身形並顯瘦的服飾，讓顧客顯現優雅迷人的氣質。",
              "目標客群：心理年齡 30–40 歲、流行意識心態、崇尚皇家經典品味、追求優雅時尚、充滿知性與感性的女性。",
              "品牌關鍵字：Elegant 優雅、Refined 精緻、Feminine 女性化。",
              "品牌態度：「優雅，不只是穿著，而是一種從容生活的態度。」",
              "通路：全台百貨專櫃 27 間、直營門市 12 間、加盟門市 7 間。",
            ].join("\n"),
          };

          const sleep = (ms: number) => new Promise((r) => setTimeout(r, ms));

          async function main() {
            const [uRows]: any = await localPool.execute(
              `SELECT id, email FROM users WHERE email = ?`, [OWNER_EMAIL]);
            const users = uRows as Array<{ id: number; email: string }>;
            if (users.length !== 1) {
              console.error(`ABORT: found ${users.length} users for ${OWNER_EMAIL} (need exactly 1)`);
              // Probe: list similar accounts so we can tell which email the
              // customer actually registered with (admin-owned platform).
              const [simRows]: any = await localPool.execute(
                `SELECT id, email, name, createdAt FROM users
                  WHERE email LIKE '%iris%' OR email LIKE '%vmd%' OR name LIKE '%iris%'
                  ORDER BY id DESC LIMIT 20`);
              console.log("SIMILAR ACCOUNTS:", JSON.stringify(simRows));
              process.exit(1);
            }
            const userId = users[0].id;
            console.log(`Owner: ${OWNER_EMAIL} -> userId ${userId}`);

            const [exRows]: any = await localPool.execute(
              `SELECT id, positioningStatus FROM brands WHERE userId = ? AND name = ? LIMIT 1`,
              [userId, spec.name]);
            const existing = (exRows as any[])[0];
            let brandId: number;

            if (existing) {
              brandId = existing.id;
              console.log(`REUSE: brand "${spec.name}" (id ${brandId}, positioning=${existing.positioningStatus}) — re-kicking positioning`);
            } else {
              const slug = `${spec.slugBase}-${Math.random().toString(36).slice(2, 7)}`;
              const [res]: any = await localPool.execute(
                `INSERT INTO brands
                   (userId, createdBy, slug, name, website, industry, tagline,
                    targetAudience, description, socialLinks, soworkAnalysis,
                    targetCountry, outputLanguage, dataSource, isDefault, positioningStatus)
                 VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, 'manual', 0, 'pending')`,
                [userId, userId, slug, spec.name, WEBSITE, spec.industry, spec.tagline,
                 spec.targetAudience, spec.description,
                 JSON.stringify(spec.socialLinks),
                 JSON.stringify({ competitors: null, targetMarket: "Taiwan", contentLanguage: "zh-TW" }),
                 "TW", "zh-TW"]);
              brandId = (res as any).insertId;
              console.log(`CREATED: brand "${spec.name}" -> id ${brandId} (slug ${slug})`);
              try {
                await localPool.execute(
                  `INSERT INTO brand_members (brandId, userId, role, addedBy) VALUES (?, ?, 'owner', ?)`,
                  [brandId, userId, userId]);
              } catch (e: any) {
                console.warn(`brand_members seed failed (non-fatal): ${e?.message}`);
              }
            }

            const [pRows]: any = await localPool.execute(
              `SELECT id, name FROM products WHERE brandId = ?`, [brandId]);
            const junkIds = (pRows as Array<{ id: number; name: string }>)
              .filter((p) => looksLikeNonProduct(String(p.name ?? ""))).map((p) => p.id);
            if (junkIds.length > 0) {
              await localPool.execute(
                `DELETE FROM products WHERE brandId = ? AND id IN (${junkIds.map(() => "?").join(",")})`,
                [brandId, ...junkIds]);
              console.log(`CLEANED: ${junkIds.length} non-product rows`);
            }
            await enqueueProductDiscovery(brandId, userId, PRODUCTS_URL);

            await localPool.execute(
              `UPDATE brands SET positioningStatus = 'in_progress' WHERE id = ?`, [brandId]);
            startPositioningJob({
              userId,
              entityKind: "brand",
              entityId: brandId,
              brandName: spec.name,
              industry: spec.industry,
              description: spec.description,
              steps: buildBrandPositioningSteps({ lang: "zh-TW", outputLanguage: "zh-TW" }),
            });
            console.log(`KICKED: positioning pipeline for "${spec.name}" (id ${brandId})`);

            const deadline = Date.now() + 25 * 60 * 1000;
            while (Date.now() < deadline) {
              await sleep(15_000);
              const [rows]: any = await localPool.execute(
                `SELECT b.positioningStatus,
                        (SELECT CONCAT(pj.status, ' ', pj.currentStep, '/', pj.totalSteps)
                           FROM positioning_jobs pj
                          WHERE pj.entityKind = 'brand' AND pj.entityId = b.id
                          ORDER BY pj.id DESC LIMIT 1) AS job
                   FROM brands b WHERE b.id = ?`, [brandId]);
              const s = (rows as any[])[0];
              console.log(`IRIS: ${s.positioningStatus} (job ${s.job ?? "—"})`);
              if (s.positioningStatus === "completed" || String(s.job ?? "").startsWith("failed")) break;
            }

            const [fin]: any = await localPool.execute(
              `SELECT id, userId, name, website, industry, targetCountry, outputLanguage,
                      positioningStatus, JSON_LENGTH(positioning) AS posKeys
                 FROM brands WHERE id = ?`, [brandId]);
            console.log("FINAL brand row:", JSON.stringify((fin as any[])[0]));
            const [pc]: any = await localPool.execute(
              `SELECT COUNT(*) AS n FROM products WHERE brandId = ?`, [brandId]);
            console.log(`FINAL products: ${(pc as any[])[0].n}`);
            process.exit(0);
          }
          main().catch((e) => { console.error("FATAL:", e); process.exit(1); });
          TSEOF
          echo "script written"

      - name: Run (create + discovery + positioning, polls until done)
        run: |
          cd /opt/onbrand/app/skills/ai-talent
          # ESM imports hoist above dotenv.config(), so localDb's env check
          # fires before dotenv loads — export the .env at the shell level.
          set -a; source .env 2>/dev/null || true; set +a
          if [ -z "$LOCAL_DB_PASSWORD" ]; then
            echo "::error::LOCAL_DB_PASSWORD still missing after sourcing .env"
            ls -la .env* 2>&1 || true
            exit 1
          fi
          npx tsx scripts/_tmp-iris-vmd.ts

      - name: Cleanup temp script
        if: always()
        run: rm -f /opt/onbrand/app/skills/ai-talent/scripts/_tmp-iris-vmd.ts
