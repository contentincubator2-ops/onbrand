name: Ops — tail pm2 logs (last 80 lines)

on:
  workflow_dispatch:

jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            echo "===== pm2 list ====="
            pm2 list | head -10
            echo ""
            echo "===== onbrand-error.log (last 80) ====="
            tail -80 ~/.pm2/logs/onbrand-error.log 2>/dev/null
            echo ""
            echo "===== onbrand-out.log (last 40) ====="
            tail -40 ~/.pm2/logs/onbrand-out.log 2>/dev/null
            echo ""
            echo "===== Built bundle (current index.html script tag) ====="
            grep -oE 'index-[A-Za-z0-9_-]+\.js' /opt/onbrand/app/skills/ai-talent/public/index.html 2>/dev/null | head -1
