name: Admin — LLM-upgrade all sub-A+ in CURRENT 170-used set

# Phase 1 fix: my earlier upgrade only touched the originally-identified 19
# agents. Post-dedupe the used-set changed; 45 agents in the actual 170 set
# are still sub-A+. This workflow:
#   1. Discovers the current used-set from source code (170 ids)
#   2. Finds rows where total_chars < 2000
#   3. Generates workingPrinciples + experienceDetail (whichever is thin)
#   4. Re-audits and reports final A+ count

on:
  workflow_dispatch:

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 1500s
          script: |
            set -e
            cd /opt/marketing-os/app/skills/ai-talent
            set -a; . ./.env; set +a
            if [ -z "$ANTHROPIC_API_KEY" ]; then echo "ANTHROPIC_API_KEY missing"; exit 1; fi
            export MYSQL_PWD="mos_secure_2026"

            # Derive used-set from source
            export AGENT_IDS=$(grep -ohE 'agent_id:\s*[0-9]+' server/_core/quickTask*.ts | awk '{print $2}' | sort -u | paste -sd,)
            echo "Total used: $(echo $AGENT_IDS | tr ',' '\n' | wc -l)"

            python3 - <<'PYEOF'
            import os, json, subprocess, time, urllib.request, urllib.error
            KEY = os.environ["ANTHROPIC_API_KEY"]
            ALL_IDS = os.environ["AGENT_IDS"].split(",")

            def mysql(sql):
                env = os.environ.copy(); env["MYSQL_PWD"] = "mos_secure_2026"
                r = subprocess.run(
                    ["mysql","-h","localhost","-u","mos_user","mos_db",
                     "--batch","--raw","--skip-column-names","--default-character-set=utf8mb4",
                     "-e", sql],
                    capture_output=True, text=True, env=env, timeout=30,
                )
                if r.returncode != 0: raise RuntimeError(r.stderr)
                return r.stdout

            def call_anthropic(prompt, max_tokens=900):
                body = json.dumps({
                    "model":"claude-haiku-4-5","max_tokens":max_tokens,
                    "messages":[{"role":"user","content":prompt}]}).encode()
                req = urllib.request.Request(
                    "https://api.anthropic.com/v1/messages", data=body,
                    headers={"x-api-key":KEY,"anthropic-version":"2023-06-01","content-type":"application/json"},
                    method="POST")
                with urllib.request.urlopen(req, timeout=90) as r:
                    return json.loads(r.read())["content"][0]["text"].strip()

            # 1. Find sub-A+ in used-set
            id_csv = ",".join(ALL_IDS)
            rows = mysql(
              "SELECT id, IFNULL(name,''), IFNULL(title,''), IFNULL(bio,''), "
              "IFNULL(specialty,''), IFNULL(methodology,''), "
              "CHAR_LENGTH(IFNULL(workingPrinciples,'')), "
              "CHAR_LENGTH(IFNULL(experienceDetail,'')), "
              "(CHAR_LENGTH(IFNULL(bio,''))"
              "+CHAR_LENGTH(IFNULL(specialty,''))"
              "+CHAR_LENGTH(IFNULL(methodology,''))"
              "+CHAR_LENGTH(IFNULL(taskSystemPrompt,''))"
              "+CHAR_LENGTH(IFNULL(experienceDetail,''))"
              "+CHAR_LENGTH(IFNULL(workingPrinciples,''))"
              "+CHAR_LENGTH(IFNULL(specialtySummary,''))"
              "+CHAR_LENGTH(IFNULL(tool_instructions,''))"
              "+CHAR_LENGTH(IFNULL(bio_zh,''))) AS total "
              f"FROM agents WHERE id IN ({id_csv}) HAVING total < 2000 ORDER BY total ASC"
            ).strip()
            if not rows:
                print("All 170 in-use agents already A+ ≥ 2000.")
                exit(0)

            targets = []
            for line in rows.split("\n"):
                p = line.split("\t")
                targets.append({
                    "id": int(p[0]), "name": p[1], "title": p[2],
                    "bio": p[3][:400], "specialty": p[4][:600], "methodology": p[5][:600],
                    "wp_len": int(p[6] or 0), "exp_len": int(p[7] or 0), "total": int(p[8] or 0),
                })
            print(f"Found {len(targets)} sub-A+ agents to upgrade")

            def make_wp_prompt(a):
                return ("Write a workingPrinciples section (Traditional Chinese, 700-850 字) for this professional:\n"
                        f"- Name: {a['name']}\n- Title: {a['title']}\n- Bio: {a['bio']}\n- Specialty: {a['specialty']}\n- Methodology: {a['methodology']}\n\n"
                        "5-7 first-person principles this person follows when taking on a task. Concrete, anti-cliché, tied to specialty/methodology. Output ONLY principles text, no preamble.")

            def make_exp_prompt(a):
                return ("Write an experienceDetail section (Traditional Chinese, 650-800 字) for this professional:\n"
                        f"- Name: {a['name']}\n- Title: {a['title']}\n- Bio: {a['bio']}\n- Specialty: {a['specialty']}\n- Methodology: {a['methodology']}\n\n"
                        "3-4 concrete career milestones / signature projects matching bio + specialty. Each: title line + 2-3 sentences (situation, what they did, measurable result). Specific industry context. Output ONLY milestones text, no preamble.")

            up, sk, fail = 0, 0, 0
            for a in targets:
                try:
                    # Pick the shorter field to fill
                    needed = 2200 - a["total"]
                    fill_wp = a["wp_len"] < 600
                    fill_exp = a["exp_len"] < 600
                    if fill_wp and not fill_exp:
                        txt = call_anthropic(make_wp_prompt(a))
                        col = "workingPrinciples"
                    elif fill_exp and not fill_wp:
                        txt = call_anthropic(make_exp_prompt(a))
                        col = "experienceDetail"
                    elif fill_wp and fill_exp:
                        # Both thin; fill experienceDetail (usually more useful)
                        txt = call_anthropic(make_exp_prompt(a))
                        col = "experienceDetail"
                    else:
                        # Both already > 600 but total still < 2000 — fill the shorter
                        if a["wp_len"] < a["exp_len"]:
                            txt = call_anthropic(make_wp_prompt(a))
                            col = "workingPrinciples"
                        else:
                            txt = call_anthropic(make_exp_prompt(a))
                            col = "experienceDetail"
                    safe = txt.replace("\\","\\\\").replace("'","''")
                    mysql(f"UPDATE agents SET {col}='{safe}' WHERE id={a['id']}")
                    print(f"  OK {a['id']} {a['name'][:14]:<14}  {col} +{len(txt)} (was total={a['total']})")
                    up += 1
                    time.sleep(0.4)
                except urllib.error.HTTPError as e:
                    print(f"  FAIL {a['id']}: HTTP {e.code} {e.read()[:150]}"); fail += 1
                except Exception as e:
                    print(f"  FAIL {a['id']}: {type(e).__name__} {e}"); fail += 1

            print()
            print(f"Summary: {up} updated, {sk} skipped, {fail} failed")
            PYEOF

            echo
            echo "── Final audit of 170-used set ─────"
            MYSQLT="mysql -h localhost -u mos_user mos_db -t --default-character-set=utf8mb4"
            $MYSQLT -e "
              SELECT
                COUNT(*) AS total,
                SUM(CASE WHEN tc >= 2000 THEN 1 ELSE 0 END) AS aplus,
                SUM(CASE WHEN tc <  2000 THEN 1 ELSE 0 END) AS sub_aplus,
                MIN(tc) AS min_chars, ROUND(AVG(tc)) AS avg_chars, MAX(tc) AS max_chars
              FROM (
                SELECT id,
                  (CHAR_LENGTH(IFNULL(bio,''))
                  + CHAR_LENGTH(IFNULL(specialty,''))
                  + CHAR_LENGTH(IFNULL(methodology,''))
                  + CHAR_LENGTH(IFNULL(taskSystemPrompt,''))
                  + CHAR_LENGTH(IFNULL(experienceDetail,''))
                  + CHAR_LENGTH(IFNULL(workingPrinciples,''))
                  + CHAR_LENGTH(IFNULL(specialtySummary,''))
                  + CHAR_LENGTH(IFNULL(tool_instructions,''))
                  + CHAR_LENGTH(IFNULL(bio_zh,''))) AS tc
                FROM agents WHERE id IN ($AGENT_IDS)
              ) x;
            "
