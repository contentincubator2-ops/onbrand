name: Admin — Diagnose mos_db state

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: SSH — check mos_db tables + pm2 logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            MOS="mysql -h localhost -u mos_user -pmos_secure_2026 mos_db"

            echo "=== mos_db: ALL TABLES ==="
            $MOS -e "SHOW TABLES;" 2>&1

            echo ""
            echo "=== user_workspaces exists? ==="
            $MOS -e "DESCRIBE user_workspaces;" 2>&1 || echo "NOT FOUND"

            echo ""
            echo "=== missions: key columns ==="
            $MOS -e "SELECT COLUMN_NAME FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA='mos_db' AND TABLE_NAME='missions' ORDER BY ORDINAL_POSITION;" 2>&1

            echo ""
            echo "=== brands: key columns ==="
            $MOS -e "SELECT COLUMN_NAME FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA='mos_db' AND TABLE_NAME='brands' ORDER BY ORDINAL_POSITION;" 2>&1

            echo ""
            echo "=== users table ==="
            $MOS -e "DESCRIBE users;" 2>&1 || echo "NOT FOUND"

            echo ""
            echo "=== pm2 list ==="
            pm2 list 2>&1

            echo ""
            echo "=== pm2 logs (last 50 lines) ==="
            pm2 logs --lines 50 --nostream 2>&1 | tail -60

            echo ""
            echo "=== drizzle-kit version ==="
            cd /home/azureuser/marketing-os/skills/ai-talent
            npx drizzle-kit --version 2>&1 || echo "drizzle-kit not available"

            echo ""
            echo "=== .env DB vars ==="
            cd /home/azureuser/marketing-os/skills/ai-talent
            grep -E "^(DB_|LOCAL_DB_)" .env 2>/dev/null | sed 's/PASSWORD=.*/PASSWORD=***/' || echo "(.env not found or no DB_ vars)"
