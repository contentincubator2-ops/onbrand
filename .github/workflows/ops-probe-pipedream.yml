name: Ops — Probe Pipedream Connect API

# Verify that the PIPEDREAM_CLIENT_ID + PIPEDREAM_CLIENT_SECRET on the VM
# can successfully call the Pipedream Connect /tokens endpoint.
# Run after admin-write-pipedream-env.yml to confirm everything is wired.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 3
    steps:
      - name: Probe Pipedream Connect credentials
        run: |
          set -e
          AI=/opt/onbrand/app/skills/ai-talent
          ENV=$AI/.env
          set -a; source "$ENV" 2>/dev/null; set +a

          echo "========================================================"
          echo "  1. Env check"
          echo "========================================================"

          if [ -z "$PIPEDREAM_CLIENT_ID" ]; then
            echo "PIPEDREAM_CLIENT_ID is empty in .env"; exit 1
          fi
          if [ -z "$PIPEDREAM_CLIENT_SECRET" ]; then
            echo "PIPEDREAM_CLIENT_SECRET is empty in .env"; exit 1
          fi
          if [ -z "$PIPEDREAM_PROJECT_ID" ]; then
            echo "PIPEDREAM_PROJECT_ID is empty in .env"; exit 1
          fi

          echo "  PIPEDREAM_CLIENT_ID    : ${PIPEDREAM_CLIENT_ID:0:10}... (${#PIPEDREAM_CLIENT_ID} chars)"
          echo "  PIPEDREAM_CLIENT_SECRET: ${PIPEDREAM_CLIENT_SECRET:0:6}... (${#PIPEDREAM_CLIENT_SECRET} chars)"
          echo "  PIPEDREAM_PROJECT_ID   : $PIPEDREAM_PROJECT_ID"

          echo ""

          echo "========================================================"
          echo "  2. Step 1 - Exchange OAuth credentials for token"
          echo "========================================================"

          OAUTH_RESP=$(curl -s -o /tmp/pd_oauth.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{\"grant_type\":\"client_credentials\",\"client_id\":\"$PIPEDREAM_CLIENT_ID\",\"client_secret\":\"$PIPEDREAM_CLIENT_SECRET\"}" \
            "https://api.pipedream.com/v1/oauth/token" \
          )

          echo "  OAuth HTTP: $OAUTH_RESP"
          cat /tmp/pd_oauth.json | python3 -m json.tool 2>/dev/null || cat /tmp/pd_oauth.json
          echo ""

          if [ "$OAUTH_RESP" != "200" ]; then
            echo "OAuth token exchange failed HTTP $OAUTH_RESP"; exit 1
          fi

          ACCESS_TOKEN=$(python3 -c "import json; print(json.load(open('/tmp/pd_oauth.json'))['access_token'])")
          echo "  Got access token: ${ACCESS_TOKEN:0:10}... (${#ACCESS_TOKEN} chars)"
          echo ""

          echo "========================================================"
          echo "  3. Step 2 - Mint a Connect user token"
          echo "========================================================"

          PD_ENV="${PIPEDREAM_PROJECT_ENV:-production}"
          HTTP_CODE=$(curl -s -o /tmp/pd_resp.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-PD-Environment: $PD_ENV" \
            -d "{\"external_user_id\":\"probe-test-001\"}" \
            "https://api.pipedream.com/v1/connect/$PIPEDREAM_PROJECT_ID/tokens" \
          )

          echo "  Connect /tokens HTTP: $HTTP_CODE"
          cat /tmp/pd_resp.json | python3 -m json.tool 2>/dev/null || cat /tmp/pd_resp.json
          echo ""

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
            echo "✅ Pipedream Connect API: fully operational"
            echo "   Both OAuth token exchange and Connect token mint succeeded."
          elif [ "$HTTP_CODE" = "401" ]; then
            echo "401 on Connect /tokens - access_token rejected"; exit 1
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "404 - PIPEDREAM_PROJECT_ID not found"; exit 1
          else
            echo "Unexpected HTTP $HTTP_CODE on Connect /tokens"; exit 1
          fi
