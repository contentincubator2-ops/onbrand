name: Ops — Probe Pipedream Connect API

# Verify Pipedream Connect two-step OAuth flow on the VM:
#   Step 1: POST /v1/oauth/token  (OAuth App CLIENT_ID:CLIENT_SECRET → Bearer token)
#   Step 2: POST /v1/connect/tokens  (Bearer token → Connect user token)
# Run after admin-write-pipedream-env.yml to confirm everything is wired.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, linux, vm-onbrand]
    timeout-minutes: 3
    steps:
      - name: Probe Pipedream Connect two-step OAuth flow
        run: |
          set -e
          AI=/opt/onbrand/app/skills/ai-talent
          ENV=$AI/.env
          set -a; source "$ENV" 2>/dev/null; set +a

          echo "════════════════════════════════════════════════════"
          echo "  1. Env check"
          echo "════════════════════════════════════════════════════"

          if [ -z "$PIPEDREAM_CLIENT_ID" ]; then
            echo "❌ PIPEDREAM_CLIENT_ID is empty in .env"; exit 1
          fi
          if [ -z "$PIPEDREAM_CLIENT_SECRET" ]; then
            echo "❌ PIPEDREAM_CLIENT_SECRET is empty in .env"; exit 1
          fi
          if [ -z "$PIPEDREAM_PROJECT_ID" ]; then
            echo "❌ PIPEDREAM_PROJECT_ID is empty in .env"; exit 1
          fi

          echo "  PIPEDREAM_CLIENT_ID    : ${PIPEDREAM_CLIENT_ID:0:10}... (${#PIPEDREAM_CLIENT_ID} chars)"
          echo "  PIPEDREAM_CLIENT_SECRET: ${PIPEDREAM_CLIENT_SECRET:0:6}... (${#PIPEDREAM_CLIENT_SECRET} chars)"
          echo "  PIPEDREAM_PROJECT_ID   : $PIPEDREAM_PROJECT_ID"

          echo ""
          echo "════════════════════════════════════════════════════"
          echo "  2. Step 1 — OAuth token exchange (/v1/oauth/token)"
          echo "════════════════════════════════════════════════════"

          BASIC=$(echo -n "${PIPEDREAM_CLIENT_ID}:${PIPEDREAM_CLIENT_SECRET}" | base64 -w0)

          HTTP_CODE=$(curl -s -o /tmp/pd_token.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Basic $BASIC" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials" \
            "https://api.pipedream.com/v1/oauth/token" \
          )

          echo "  HTTP status: $HTTP_CODE"
          cat /tmp/pd_token.json | python3 -m json.tool 2>/dev/null || cat /tmp/pd_token.json
          echo ""

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ OAuth token exchange failed (HTTP $HTTP_CODE)"
            echo "   Check PIPEDREAM_CLIENT_ID and PIPEDREAM_CLIENT_SECRET."
            exit 1
          fi

          ACCESS_TOKEN=$(python3 -c "import json; d=json.load(open('/tmp/pd_token.json')); print(d.get('access_token',''))")
          TOKEN_LEN=${#ACCESS_TOKEN}
          echo "  ✅ access_token: ${ACCESS_TOKEN:0:12}... (${TOKEN_LEN} chars)"

          echo ""
          echo "════════════════════════════════════════════════════"
          echo "  3. Step 2 — Mint Connect token (/v1/connect/tokens)"
          echo "════════════════════════════════════════════════════"

          PD_ENV="${PIPEDREAM_PROJECT_ENV:-production}"

          HTTP_CODE=$(curl -s -o /tmp/pd_resp.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-PD-Environment: $PD_ENV" \
            -d "{\"external_user_id\":\"probe-test-001\",\"project_id\":\"${PIPEDREAM_PROJECT_ID}\"}" \
            "https://api.pipedream.com/v1/connect/tokens" \
          )

          echo "  HTTP status: $HTTP_CODE"
          cat /tmp/pd_resp.json | python3 -m json.tool 2>/dev/null || cat /tmp/pd_resp.json
          echo ""

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
            echo "✅ Pipedream Connect API: fully operational"
            echo "   Both steps succeeded — Facebook authorization flow should work."
          elif [ "$HTTP_CODE" = "401" ]; then
            echo "❌ 401 on /connect/tokens — Bearer token rejected."
            exit 1
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "❌ 404 — PIPEDREAM_PROJECT_ID ($PIPEDREAM_PROJECT_ID) not found."
            exit 1
          else
            echo "❌ Unexpected HTTP $HTTP_CODE"
            exit 1
          fi
