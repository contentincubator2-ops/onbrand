name: Ops — DB backup (mysqldump, daily)

# 2026-05-16 (CJ「DB 備份：有真實付費客戶後，沒備份 = 一次意外全毀」)
#
# Daily mysqldump → gzip → /opt/onbrand/backups, 14-day retention on the
# VM disk. Runs on the self-hosted VM runner (same box as the DB).
# Also dispatchable manually before risky migrations.
#
# RESTORE (manual, deliberate):
#   gunzip -c /opt/onbrand/backups/mos_db-YYYYMMDD-HHMM.sql.gz \
#     | mysql -h localhost -u mos_user mos_db
#   (stop pm2 onbrand first; verify on a scratch DB before prod restore)
#
# NOTE: this is on-box backup (protects against app/data corruption &
# bad migrations, NOT full-VM loss). Off-site copy = follow-up; see the
# final echo for the rsync/object-storage hook point.

on:
  schedule:
    - cron: "0 18 * * *"      # 02:00 Asia/Taipei (UTC+8)
  workflow_dispatch:

jobs:
  backup:
    runs-on: [self-hosted, linux, vm-onbrand]
    timeout-minutes: 10
    steps:
      - run: |
          set -e
          ENV=/opt/onbrand/app/skills/ai-talent/.env
          set -a; source "$ENV"; set +a
          export MYSQL_PWD="$LOCAL_DB_PASSWORD"
          DIR=/opt/onbrand/backups
          mkdir -p "$DIR"
          STAMP=$(date +%Y%m%d-%H%M)
          OUT="$DIR/mos_db-$STAMP.sql.gz"

          echo "── Dumping mos_db → $OUT ──"
          mysqldump -h localhost -u mos_user \
            --single-transaction --quick --routines --triggers \
            --default-character-set=utf8mb4 \
            mos_db | gzip -c > "$OUT"

          SIZE=$(stat -c%s "$OUT")
          echo "  size = $SIZE bytes"
          if [ "$SIZE" -lt 50000 ]; then
            echo "❌ backup suspiciously small (<50KB) — dump likely failed"
            head -c 300 <(gunzip -c "$OUT") || true
            exit 1
          fi

          # Integrity: gzip must decompress cleanly
          gunzip -t "$OUT" && echo "  ✓ gzip integrity OK"

          echo "── Pruning backups older than 14 days ──"
          find "$DIR" -name 'mos_db-*.sql.gz' -mtime +14 -print -delete || true

          echo "── Current backups ──"
          ls -lh "$DIR" | tail -8
          echo ""
          echo "✅ Backup done: $OUT"

          # ── Off-site backup (optional but strongly recommended) ────────────
          # To enable: set BACKUP_RCLONE_REMOTE in the .env file.
          # Example setup (Backblaze B2 — free up to 10GB/month):
          #   1. Create account at backblaze.com
          #   2. Create bucket: onbrand-backups
          #   3. Generate Application Key (s3-compatible)
          #   4. apt install rclone && rclone config  (add B2 or S3-compatible remote)
          #   5. Add to .env:  BACKUP_RCLONE_REMOTE=b2:onbrand-backups
          #
          # Alternative (SSH rsync to secondary server):
          #   BACKUP_RSYNC_TARGET=user@server2:/backups/onbrand
          # ────────────────────────────────────────────────────────────────────
          if [ -n "$BACKUP_RCLONE_REMOTE" ]; then
            echo "── Uploading to off-site: $BACKUP_RCLONE_REMOTE ──"
            if command -v rclone &>/dev/null; then
              rclone copy "$OUT" "$BACKUP_RCLONE_REMOTE/" \
                --transfers=1 --stats=30s 2>&1
              echo "✅ Off-site upload complete"
              # Prune remote backups older than 30 days
              rclone delete "$BACKUP_RCLONE_REMOTE/" \
                --min-age=30d --include='mos_db-*.sql.gz' 2>/dev/null || true
            else
              echo "⚠ rclone not installed — skipping off-site upload"
              echo "  Install: sudo apt install rclone && rclone config"
            fi
          elif [ -n "$BACKUP_RSYNC_TARGET" ]; then
            echo "── rsyncing to $BACKUP_RSYNC_TARGET ──"
            rsync -az --remove-source-files "$OUT" "$BACKUP_RSYNC_TARGET/" 2>&1 \
              && echo "✅ rsync complete" \
              || echo "⚠ rsync failed (non-fatal — local backup still valid)"
          else
            echo "ℹ️ Off-site backup not configured."
            echo "   Set BACKUP_RCLONE_REMOTE=b2:onbrand-backups in .env to enable."
          fi
