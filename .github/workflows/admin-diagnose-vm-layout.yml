name: Admin — Diagnose VM Layout

# Read-only diagnostic: what's on the VM, where is traffic routed,
# what pm2 is running, what /opt/A2A-Marketing-Claw-* looks like.
# Output is visible only to repo members in the workflow log.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: SSH & diagnose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 120s
          script: |
            echo "===== PM2 processes ====="
            pm2 list || echo "(pm2 not found or not running)"

            echo ""
            echo "===== Nginx routing (proxy_pass / root / server_name) ====="
            sudo nginx -T 2>/dev/null | grep -E "proxy_pass|root |server_name " | grep -v "^#" | sort -u || echo "(sudo nginx -T failed)"

            echo ""
            echo "===== Listening ports ====="
            sudo ss -tlnp 2>/dev/null | grep -v "^State" | head -20 || netstat -tlnp 2>/dev/null | head -20

            echo ""
            echo "===== /home/azureuser/marketing-os ====="
            if [ -d /home/azureuser/marketing-os ]; then
              cd /home/azureuser/marketing-os
              echo "-- git remote --"
              git remote -v 2>/dev/null
              echo "-- last commit --"
              git log --oneline -1 2>/dev/null
              echo "-- public dir --"
              ls -lh skills/ai-talent/public/ 2>/dev/null | head -5
              echo "-- public index.html timestamp --"
              stat -c '%y %n' skills/ai-talent/public/index.html 2>/dev/null
            else
              echo "(not found)"
            fi

            echo ""
            echo "===== /opt/A2A-Marketing-Claw-Backend ====="
            if [ -d /opt/A2A-Marketing-Claw-Backend ]; then
              cd /opt/A2A-Marketing-Claw-Backend
              echo "-- ls top-level --"
              ls -la | head -20
              echo "-- git remote --"
              git remote -v 2>/dev/null || echo "(no .git)"
              echo "-- last commit --"
              git log --oneline -1 2>/dev/null || echo "(no git history)"
              echo "-- deploy-dev.sh --"
              cat deploy-dev.sh 2>/dev/null || echo "(no deploy-dev.sh)"
            else
              echo "(not found)"
            fi

            echo ""
            echo "===== /opt/A2A-Marketing-Claw-Frontend ====="
            if [ -d /opt/A2A-Marketing-Claw-Frontend ]; then
              cd /opt/A2A-Marketing-Claw-Frontend
              echo "-- ls top-level --"
              ls -la | head -20
              echo "-- git remote --"
              git remote -v 2>/dev/null || echo "(no .git)"
              echo "-- last commit --"
              git log --oneline -1 2>/dev/null || echo "(no git history)"
              echo "-- dist dir --"
              ls -lh dist/ 2>/dev/null | head -5 || echo "(no dist)"
              echo "-- dist index.html timestamp --"
              stat -c '%y %n' dist/index.html 2>/dev/null || echo "(no dist/index.html)"
              echo "-- deploy-dev.sh --"
              cat deploy-dev.sh 2>/dev/null || echo "(no deploy-dev.sh)"
            else
              echo "(not found)"
            fi

            echo ""
            echo "===== Process tree of node/pm2 ====="
            ps aux | grep -E "node|pm2" | grep -v grep | head -10

            echo ""
            echo "===== Active DB connections from which processes? ====="
            sudo ss -tnp 2>/dev/null | grep 3306 | head -10 || echo "(no 3306 activity or ss unavailable)"
