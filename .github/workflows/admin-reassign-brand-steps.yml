name: Admin — Audit & Reassign Brand Squad Steps

# Phase H: Brand-type squads step-agent skills audit and reassignment
# Mode: type AUDIT to view report, APPLY to reassign agents

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Type AUDIT to view report only, or APPLY to reassign agents'
        required: true
        type: string

jobs:
  reassign:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -e
            MOS_USER="mos_user"
            MOS_PASS="mos_secure_2026"
            MOS_DB="mos_db"
            MODE=$(echo "${{ github.event.inputs.mode }}" | tr '[:upper:]' '[:lower:]')

            echo "======================================================"
            echo "Mode: $MODE"
            echo "======================================================"

            echo ""
            echo "=== 1. All Active Agents + Specialty/Skills (strategy layer first) ==="
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
              SELECT
                id,
                slug,
                name,
                title,
                layer,
                LEFT(COALESCE(specialty,'—'), 100) AS specialty_preview,
                skills
              FROM agents
              WHERE is_active = 1
              ORDER BY FIELD(layer,'strategy','execution','training'), id;
            " 2>&1

            echo ""
            echo "=== 2. Brand Squads — Current Step Agent Assignments ==="
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
              SELECT
                s.slug AS squad_slug,
                JSON_UNQUOTE(JSON_EXTRACT(jt.step_val, '\$.order'))             AS step_no,
                LEFT(JSON_UNQUOTE(JSON_EXTRACT(jt.step_val, '\$.name')), 30)    AS step_name,
                JSON_UNQUOTE(JSON_EXTRACT(jt.step_val, '\$.assignedAgentSlug')) AS current_agent,
                JSON_UNQUOTE(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'))    AS required_skills
              FROM squads s,
                JSON_TABLE(s.steps, '\$[*]' COLUMNS (step_val JSON PATH '\$')) AS jt
              WHERE s.workspace LIKE '%brand%'
                AND s.is_active = 1
                AND s.steps IS NOT NULL
                AND JSON_LENGTH(s.steps) > 0
              ORDER BY s.id, CAST(JSON_EXTRACT(jt.step_val, '\$.order') AS UNSIGNED);
            " 2>&1

            echo ""
            echo "=== 3. Required Skills Frequency in Brand Squads ==="
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
              SELECT skill_val, COUNT(*) AS occurrences
              FROM squads s,
                JSON_TABLE(s.steps, '\$[*]' COLUMNS (step_val JSON PATH '\$')) AS jt,
                JSON_TABLE(
                  JSON_EXTRACT(jt.step_val, '\$.requiredSkills'),
                  '\$[*]' COLUMNS (skill_val VARCHAR(80) PATH '\$')
                ) AS sk
              WHERE s.workspace LIKE '%brand%'
                AND s.is_active = 1
                AND s.steps IS NOT NULL
                AND JSON_LENGTH(s.steps) > 0
              GROUP BY skill_val
              ORDER BY occurrences DESC;
            " 2>&1

            if [ "$MODE" = "apply" ]; then
              echo ""
              echo "======================================================"
              echo "APPLY MODE: Reassigning brand squad steps to matched agents"
              echo "======================================================"

              echo ""
              echo "--- Finding best-match agents by specialty ---"

              mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
                SELECT
                  'brand-strategy' AS skill_key,
                  id, slug, name, LEFT(specialty,80) AS specialty
                FROM agents
                WHERE is_active=1
                  AND (specialty LIKE '%品牌策略%' OR specialty LIKE '%品牌定位%'
                    OR specialty LIKE '%品牌顧問%' OR title LIKE '%品牌策略%')
                ORDER BY (specialty LIKE '%品牌策略%') DESC, layer='strategy' DESC, rating DESC
                LIMIT 1;

                SELECT
                  'market-research' AS skill_key,
                  id, slug, name, LEFT(specialty,80) AS specialty
                FROM agents
                WHERE is_active=1
                  AND (specialty LIKE '%市場研究%' OR specialty LIKE '%市場調查%'
                    OR specialty LIKE '%消費者研究%' OR title LIKE '%市場研究%')
                ORDER BY (specialty LIKE '%市場研究%') DESC, layer='strategy' DESC, rating DESC
                LIMIT 1;

                SELECT
                  'copywriting' AS skill_key,
                  id, slug, name, LEFT(specialty,80) AS specialty
                FROM agents
                WHERE is_active=1
                  AND (specialty LIKE '%文案%' OR specialty LIKE '%Copywriting%'
                    OR specialty LIKE '%品牌文字%' OR title LIKE '%文案%')
                ORDER BY (specialty LIKE '%品牌文案%') DESC, (specialty LIKE '%文案%') DESC, rating DESC
                LIMIT 1;

                SELECT
                  'content-marketing' AS skill_key,
                  id, slug, name, LEFT(specialty,80) AS specialty
                FROM agents
                WHERE is_active=1
                  AND (specialty LIKE '%內容行銷%' OR specialty LIKE '%社群行銷%'
                    OR specialty LIKE '%內容策略%' OR title LIKE '%內容行銷%')
                ORDER BY (specialty LIKE '%內容行銷%') DESC, layer='strategy' DESC, rating DESC
                LIMIT 1;

                SELECT
                  'brand-identity' AS skill_key,
                  id, slug, name, LEFT(specialty,80) AS specialty
                FROM agents
                WHERE is_active=1
                  AND (specialty LIKE '%品牌識別%' OR specialty LIKE '%視覺設計%'
                    OR specialty LIKE '%視覺識別%' OR title LIKE '%設計%')
                ORDER BY (specialty LIKE '%品牌識別%') DESC, rating DESC
                LIMIT 1;
              " 2>&1

              echo ""
              echo "--- Applying reassignment to brand squad steps ---"

              mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
                UPDATE squads sq
                SET sq.steps = (
                  SELECT JSON_ARRAYAGG(
                    CASE
                      WHEN JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"brand-dna\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"mbb-strategist\"')
                      THEN JSON_SET(jt.step_val,
                        '\$.assignedAgentId',
                          (SELECT id FROM agents WHERE is_active=1
                            AND (specialty LIKE '%品牌策略%' OR specialty LIKE '%品牌定位%' OR specialty LIKE '%品牌顧問%' OR title LIKE '%品牌策略%')
                            ORDER BY (specialty LIKE '%品牌策略%') DESC, layer='strategy' DESC, rating DESC LIMIT 1),
                        '\$.assignedAgentSlug',
                          (SELECT slug FROM agents WHERE is_active=1
                            AND (specialty LIKE '%品牌策略%' OR specialty LIKE '%品牌定位%' OR specialty LIKE '%品牌顧問%' OR title LIKE '%品牌策略%')
                            ORDER BY (specialty LIKE '%品牌策略%') DESC, layer='strategy' DESC, rating DESC LIMIT 1),
                        '\$.assignedAgentName',
                          (SELECT name FROM agents WHERE is_active=1
                            AND (specialty LIKE '%品牌策略%' OR specialty LIKE '%品牌定位%' OR specialty LIKE '%品牌顧問%' OR title LIKE '%品牌策略%')
                            ORDER BY (specialty LIKE '%品牌策略%') DESC, layer='strategy' DESC, rating DESC LIMIT 1)
                      )
                      WHEN JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"market-research-agent\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"marketing-analytics\"')
                      THEN JSON_SET(jt.step_val,
                        '\$.assignedAgentId',
                          (SELECT id FROM agents WHERE is_active=1
                            AND (specialty LIKE '%市場研究%' OR specialty LIKE '%市場調查%' OR specialty LIKE '%消費者研究%' OR title LIKE '%市場研究%')
                            ORDER BY (specialty LIKE '%市場研究%') DESC, layer='strategy' DESC, rating DESC LIMIT 1),
                        '\$.assignedAgentSlug',
                          (SELECT slug FROM agents WHERE is_active=1
                            AND (specialty LIKE '%市場研究%' OR specialty LIKE '%市場調查%' OR specialty LIKE '%消費者研究%' OR title LIKE '%市場研究%')
                            ORDER BY (specialty LIKE '%市場研究%') DESC, layer='strategy' DESC, rating DESC LIMIT 1),
                        '\$.assignedAgentName',
                          (SELECT name FROM agents WHERE is_active=1
                            AND (specialty LIKE '%市場研究%' OR specialty LIKE '%市場調查%' OR specialty LIKE '%消費者研究%' OR title LIKE '%市場研究%')
                            ORDER BY (specialty LIKE '%市場研究%') DESC, layer='strategy' DESC, rating DESC LIMIT 1)
                      )
                      WHEN JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"copywriting-pro\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"hook-copywriter\"')
                      THEN JSON_SET(jt.step_val,
                        '\$.assignedAgentId',
                          (SELECT id FROM agents WHERE is_active=1
                            AND (specialty LIKE '%文案%' OR specialty LIKE '%Copywriting%' OR specialty LIKE '%品牌文字%' OR title LIKE '%文案%')
                            ORDER BY (specialty LIKE '%品牌文案%') DESC, (specialty LIKE '%文案%') DESC, rating DESC LIMIT 1),
                        '\$.assignedAgentSlug',
                          (SELECT slug FROM agents WHERE is_active=1
                            AND (specialty LIKE '%文案%' OR specialty LIKE '%Copywriting%' OR specialty LIKE '%品牌文字%' OR title LIKE '%文案%')
                            ORDER BY (specialty LIKE '%品牌文案%') DESC, (specialty LIKE '%文案%') DESC, rating DESC LIMIT 1),
                        '\$.assignedAgentName',
                          (SELECT name FROM agents WHERE is_active=1
                            AND (specialty LIKE '%文案%' OR specialty LIKE '%Copywriting%' OR specialty LIKE '%品牌文字%' OR title LIKE '%文案%')
                            ORDER BY (specialty LIKE '%品牌文案%') DESC, (specialty LIKE '%文案%') DESC, rating DESC LIMIT 1)
                      )
                      WHEN JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"content-marketing\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"social-media-marketing\"')
                      THEN JSON_SET(jt.step_val,
                        '\$.assignedAgentId',
                          (SELECT id FROM agents WHERE is_active=1
                            AND (specialty LIKE '%內容行銷%' OR specialty LIKE '%社群行銷%' OR specialty LIKE '%內容策略%' OR title LIKE '%內容行銷%')
                            ORDER BY (specialty LIKE '%內容行銷%') DESC, layer='strategy' DESC, rating DESC LIMIT 1),
                        '\$.assignedAgentSlug',
                          (SELECT slug FROM agents WHERE is_active=1
                            AND (specialty LIKE '%內容行銷%' OR specialty LIKE '%社群行銷%' OR specialty LIKE '%內容策略%' OR title LIKE '%內容行銷%')
                            ORDER BY (specialty LIKE '%內容行銷%') DESC, layer='strategy' DESC, rating DESC LIMIT 1),
                        '\$.assignedAgentName',
                          (SELECT name FROM agents WHERE is_active=1
                            AND (specialty LIKE '%內容行銷%' OR specialty LIKE '%社群行銷%' OR specialty LIKE '%內容策略%' OR title LIKE '%內容行銷%')
                            ORDER BY (specialty LIKE '%內容行銷%') DESC, layer='strategy' DESC, rating DESC LIMIT 1)
                      )
                      WHEN JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"brand-identity\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"visual-content-creator\"')
                      THEN JSON_SET(jt.step_val,
                        '\$.assignedAgentId',
                          (SELECT id FROM agents WHERE is_active=1
                            AND (specialty LIKE '%品牌識別%' OR specialty LIKE '%視覺設計%' OR specialty LIKE '%視覺識別%' OR title LIKE '%設計%')
                            ORDER BY (specialty LIKE '%品牌識別%') DESC, rating DESC LIMIT 1),
                        '\$.assignedAgentSlug',
                          (SELECT slug FROM agents WHERE is_active=1
                            AND (specialty LIKE '%品牌識別%' OR specialty LIKE '%視覺設計%' OR specialty LIKE '%視覺識別%' OR title LIKE '%設計%')
                            ORDER BY (specialty LIKE '%品牌識別%') DESC, rating DESC LIMIT 1),
                        '\$.assignedAgentName',
                          (SELECT name FROM agents WHERE is_active=1
                            AND (specialty LIKE '%品牌識別%' OR specialty LIKE '%視覺設計%' OR specialty LIKE '%視覺識別%' OR title LIKE '%設計%')
                            ORDER BY (specialty LIKE '%品牌識別%') DESC, rating DESC LIMIT 1)
                      )
                      ELSE jt.step_val
                    END
                    ORDER BY CAST(JSON_EXTRACT(jt.step_val, '\$.order') AS UNSIGNED)
                  )
                  FROM JSON_TABLE(sq.steps, '\$[*]' COLUMNS (step_val JSON PATH '\$')) AS jt
                )
                WHERE sq.workspace LIKE '%brand%'
                  AND sq.is_active = 1
                  AND sq.steps IS NOT NULL
                  AND JSON_LENGTH(sq.steps) > 0;
              " 2>&1

              echo ""
              echo "=== Verification: Updated brand squad step assignments ==="
              mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
                SELECT
                  s.slug AS squad_slug,
                  JSON_UNQUOTE(JSON_EXTRACT(jt.step_val, '\$.order'))             AS step_no,
                  LEFT(JSON_UNQUOTE(JSON_EXTRACT(jt.step_val, '\$.name')), 28)    AS step_name,
                  JSON_UNQUOTE(JSON_EXTRACT(jt.step_val, '\$.assignedAgentSlug')) AS new_agent,
                  JSON_UNQUOTE(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'))    AS skills
                FROM squads s,
                  JSON_TABLE(s.steps, '\$[*]' COLUMNS (step_val JSON PATH '\$')) AS jt
                WHERE s.workspace LIKE '%brand%'
                  AND s.is_active = 1
                  AND s.steps IS NOT NULL
                ORDER BY s.id, CAST(JSON_EXTRACT(jt.step_val, '\$.order') AS UNSIGNED);
              " 2>&1

              echo ""
              echo "✅ Brand squad steps reassigned successfully"
            else
              echo ""
              echo "✅ Audit complete. Review the report above, then run APPLY mode to reassign."
            fi
