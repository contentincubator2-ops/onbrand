name: Admin — Audit & Reassign Brand Squad Steps

# Phase H: Brand-type squads step-agent skills audit and reassignment
# Audit reveals real requiredSkills: positioning, brand-strategy, market-research,
# competitive-analysis, copywriting, brand-voice, messaging, pmm, gtm, etc.
#
# Mode: type AUDIT to view agents + current assignments
#       type APPLY to reassign steps to best-match agents

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Type AUDIT to view report only, or APPLY to reassign agents'
        required: true
        type: string

jobs:
  reassign:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -e
            MOS_USER="mos_user"
            MOS_PASS="mos_secure_2026"
            MOS_DB="mos_db"
            MODE=$(echo "${{ github.event.inputs.mode }}" | tr '[:upper:]' '[:lower:]')

            echo "======================================================"
            echo "Mode: $MODE"
            echo "======================================================"

            echo ""
            echo "=== 1. Brand Squads — Current Step Assignments ==="
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
              SELECT
                s.slug AS squad_slug,
                JSON_UNQUOTE(JSON_EXTRACT(jt.step_val, '\$.order'))             AS step_no,
                LEFT(JSON_UNQUOTE(JSON_EXTRACT(jt.step_val, '\$.name')), 30)    AS step_name,
                JSON_UNQUOTE(JSON_EXTRACT(jt.step_val, '\$.assignedAgentSlug')) AS current_agent,
                JSON_UNQUOTE(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'))    AS required_skills
              FROM squads s,
                JSON_TABLE(s.steps, '\$[*]' COLUMNS (step_val JSON PATH '\$')) AS jt
              WHERE s.workspace LIKE '%brand%'
                AND s.is_active = 1
                AND s.steps IS NOT NULL
                AND JSON_LENGTH(s.steps) > 0
              ORDER BY s.id, CAST(JSON_EXTRACT(jt.step_val, '\$.order') AS UNSIGNED);
            " 2>&1

            echo ""
            echo "=== 2. Required Skills Frequency ==="
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
              SELECT skill_val, COUNT(*) AS occurrences
              FROM squads s,
                JSON_TABLE(s.steps, '\$[*]' COLUMNS (step_val JSON PATH '\$')) AS jt,
                JSON_TABLE(
                  JSON_EXTRACT(jt.step_val, '\$.requiredSkills'),
                  '\$[*]' COLUMNS (skill_val VARCHAR(80) PATH '\$')
                ) AS sk
              WHERE s.workspace LIKE '%brand%'
                AND s.is_active = 1
                AND s.steps IS NOT NULL
                AND JSON_LENGTH(s.steps) > 0
              GROUP BY skill_val
              ORDER BY occurrences DESC;
            " 2>&1

            if [ "$MODE" = "apply" ]; then
              echo ""
              echo "======================================================"
              echo "APPLY MODE: Reassigning brand squad steps"
              echo "======================================================"
              echo ""
              echo "Agent mapping:"
              echo "  positioning / brand-strategy / brand-voice  → sarah-brand (30002 劉品妤)"
              echo "  market-research / competitive-analysis        → ai-head-of-brand-insights-kantar (90052)"
              echo "  copywriting / messaging / storytelling        → pm-pr-saas (29 蘇雅玲)"
              echo "  pmm / gtm / sales-enablement / b2b            → cmo-vivian-shen (60001)"
              echo "  content-strategy / brand-narrative            → david-hubspot (180005 David Lee)"
              echo "  jtbd / customer-research / consumer-insights  → david-data (30003 王志豪)"
              echo "  competitive-intelligence / competitive-anal   → ai-head-of-brand-insights-kantar (90052)"
              echo ""

              mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
                UPDATE squads sq
                SET sq.steps = (
                  SELECT JSON_ARRAYAGG(
                    CASE
                      -- positioning / brand-strategy / brand-voice / messaging / brand-purpose
                      -- → sarah-brand (30002 劉品妤) 品牌定位、品牌敘事、情感行銷
                      WHEN JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"positioning\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"brand-strategy\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"brand-voice\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"brand-purpose\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"emotional-branding\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"brand-narrative\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"brand-positioning\"')
                      THEN JSON_SET(jt.step_val,
                        '\$.assignedAgentId',   30002,
                        '\$.assignedAgentSlug', 'sarah-brand',
                        '\$.assignedAgentName', '劉品妤'
                      )
                      -- market-research / competitive-analysis / competitive-intelligence
                      -- → ai-head-of-brand-insights-kantar (90052) Brand Strategy, Market Research, Competitive Analysis
                      WHEN JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"market-research\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"competitive-analysis\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"competitive-intelligence\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"competitor-intelligence\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"competitor-analysis\"')
                      THEN JSON_SET(jt.step_val,
                        '\$.assignedAgentId',   90052,
                        '\$.assignedAgentSlug', 'ai-head-of-brand-insights-kantar',
                        '\$.assignedAgentName', '[AI] Head of Brand Insights'
                      )
                      -- copywriting / messaging / storytelling / conversion-copywriting
                      -- → pm-pr-saas (29 蘇雅玲) 新聞稿、b2b、pmm
                      WHEN JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"copywriting\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"messaging\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"storytelling\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"conversion-copywriting\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"thought-leadership\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"brand-narrative\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"narrative\"')
                      THEN JSON_SET(jt.step_val,
                        '\$.assignedAgentId',   29,
                        '\$.assignedAgentSlug', 'pm-pr-saas',
                        '\$.assignedAgentName', '蘇雅玲'
                      )
                      -- pmm / gtm / sales-enablement / b2b / product-marketing / battlecard / demand-gen
                      -- → cmo-vivian-shen (60001) 全通路整合行銷策略, pmm, gtm, sales-enablement
                      WHEN JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"pmm\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"gtm\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"go-to-market\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"sales-enablement\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"b2b\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"battlecard\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"demand-gen\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"sales-deck\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"product-marketing\"')
                      THEN JSON_SET(jt.step_val,
                        '\$.assignedAgentId',   60001,
                        '\$.assignedAgentSlug', 'cmo-vivian-shen',
                        '\$.assignedAgentName', '沈奕蓁'
                      )
                      -- content-strategy / campaign-strategy / ad-strategy / media-planning / channel-strategy
                      -- → david-hubspot (180005 David Lee) 內容策略規劃, 品牌故事敘述, 跨平台內容整合
                      WHEN JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"content-strategy\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"campaign-strategy\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"ad-strategy\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"media-planning\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"channel-strategy\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"omnichannel\"')
                      THEN JSON_SET(jt.step_val,
                        '\$.assignedAgentId',   180005,
                        '\$.assignedAgentSlug', 'david-hubspot',
                        '\$.assignedAgentName', 'David Lee'
                      )
                      -- jtbd / customer-research / consumer-insights / qualitative-research / quantitative-research
                      -- segmentation / icp / persona / behavioral-analysis / user-research
                      -- → david-data (30003 王志豪) analytics, consumer-insights, segmentation, research
                      WHEN JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"jtbd\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"customer-research\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"consumer-insights\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"qualitative-research\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"quantitative-research\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"segmentation\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"icp\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"persona\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"behavioral-analysis\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"user-research\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"jobs-to-be-done\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"survey-analysis\"')
                        OR JSON_CONTAINS(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'), '\"audience-analysis\"')
                      THEN JSON_SET(jt.step_val,
                        '\$.assignedAgentId',   30003,
                        '\$.assignedAgentSlug', 'david-data',
                        '\$.assignedAgentName', '王志豪'
                      )
                      -- Default: keep as-is
                      ELSE jt.step_val
                    END
                    ORDER BY CAST(JSON_EXTRACT(jt.step_val, '\$.order') AS UNSIGNED)
                  )
                  FROM JSON_TABLE(sq.steps, '\$[*]' COLUMNS (step_val JSON PATH '\$')) AS jt
                )
                WHERE sq.workspace LIKE '%brand%'
                  AND sq.is_active = 1
                  AND sq.steps IS NOT NULL
                  AND JSON_LENGTH(sq.steps) > 0;
              " 2>&1

              echo ""
              echo "=== Verification: Updated Brand Squad Step Assignments ==="
              mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
                SELECT
                  s.slug AS squad_slug,
                  JSON_UNQUOTE(JSON_EXTRACT(jt.step_val, '\$.order'))             AS step_no,
                  LEFT(JSON_UNQUOTE(JSON_EXTRACT(jt.step_val, '\$.name')), 28)    AS step_name,
                  JSON_UNQUOTE(JSON_EXTRACT(jt.step_val, '\$.assignedAgentSlug')) AS new_agent,
                  JSON_UNQUOTE(JSON_EXTRACT(jt.step_val, '\$.requiredSkills'))    AS skills
                FROM squads s,
                  JSON_TABLE(s.steps, '\$[*]' COLUMNS (step_val JSON PATH '\$')) AS jt
                WHERE s.workspace LIKE '%brand%'
                  AND s.is_active = 1
                  AND s.steps IS NOT NULL
                ORDER BY s.id, CAST(JSON_EXTRACT(jt.step_val, '\$.order') AS UNSIGNED);
              " 2>&1

              echo ""
              echo "✅ Brand squad steps reassigned successfully"
            else
              echo ""
              echo "✅ Audit complete. Run APPLY mode to reassign agents to correct roles."
            fi
