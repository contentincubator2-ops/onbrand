name: Admin — Upgrade 20 lead agents' UI + metadata fields

# Fills NULL fields on L1/L2 lead agents (incl. Mary Allen id=180797):
#   avatarUrl, coverUrl, bio_en, specialty_en, workspace, workspace_tags,
#   methodology, workingPrinciples, aiModelSource, aiModelFallback,
#   aiModelFallbackSource
#
# Values derived from squad specs (L1-brand.ts + L2-product.ts) +
# hand-crafted Mary Allen patch. Idempotent.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY to UPDATE; AUDIT for dry-run'
        required: true
        type: string
        default: 'AUDIT'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 120s
          script: |
            set -e
            cd /home/azureuser/marketing-os
            echo "[vm] pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            cd skills/ai-talent
            CONFIRM="${{ inputs.confirm }}"

            if [ "${CONFIRM}" = "APPLY" ]; then
              echo "===== RUN with --apply ====="
              npm run db:upgrade-lead-fields -- --apply
            else
              echo "===== DRY RUN (audit) ====="
              npm run db:upgrade-lead-fields
            fi

            echo ""
            echo "===== Verify: 20 lead agents field status ====="
            DB_USER=$(grep -E '^DB_USER=' .env | cut -d= -f2- | tr -d '"' | tr -d "'")
            DB_PASS=$(grep -E '^DB_PASSWORD=' .env | cut -d= -f2- | tr -d '"' | tr -d "'")
            DB_NAME=$(grep -E '^DB_NAME=' .env | cut -d= -f2- | tr -d '"' | tr -d "'")
            IDS="180797,238844,238845,238846,238847,238848,238849,238850,238851,238852,238853,238854,238855,238856,238857,238858,238859,238860,238861,238862"

            mysql --host=127.0.0.1 --user="${DB_USER}" --password="${DB_PASS}" --default-character-set=utf8mb4 "${DB_NAME}" \
              -e "SELECT id, name, aiModel,
                         CASE WHEN avatarUrl IS NULL OR avatarUrl='' THEN '(null)' ELSE SUBSTRING(avatarUrl, 1, 50) END AS avatar,
                         workspace,
                         JSON_LENGTH(workspace_tags) AS ws_tags_n,
                         CASE WHEN bio_en IS NULL THEN '(null)' ELSE 'filled' END AS bio_en,
                         aiModelFallback
                  FROM agents WHERE id IN (${IDS}) ORDER BY id;"

            echo ""
            echo "===== NULL audit across the 20 leads (should all be 0) ====="
            mysql --host=127.0.0.1 --user="${DB_USER}" --password="${DB_PASS}" --default-character-set=utf8mb4 "${DB_NAME}" \
              -e "SELECT
                    SUM(CASE WHEN avatarUrl IS NULL OR avatarUrl='' THEN 1 ELSE 0 END) AS null_avatar,
                    SUM(CASE WHEN coverUrl IS NULL OR coverUrl='' THEN 1 ELSE 0 END) AS null_cover,
                    SUM(CASE WHEN bio_en IS NULL OR bio_en='' THEN 1 ELSE 0 END) AS null_bio_en,
                    SUM(CASE WHEN specialty_en IS NULL OR specialty_en='' THEN 1 ELSE 0 END) AS null_spec_en,
                    SUM(CASE WHEN workspace IS NULL OR workspace='' THEN 1 ELSE 0 END) AS null_workspace,
                    SUM(CASE WHEN JSON_LENGTH(workspace_tags) IS NULL OR JSON_LENGTH(workspace_tags)=0 THEN 1 ELSE 0 END) AS null_ws_tags,
                    SUM(CASE WHEN methodology IS NULL OR methodology='' THEN 1 ELSE 0 END) AS null_methodology,
                    SUM(CASE WHEN workingPrinciples IS NULL OR workingPrinciples='' THEN 1 ELSE 0 END) AS null_principles,
                    SUM(CASE WHEN aiModelFallback IS NULL OR aiModelFallback='' THEN 1 ELSE 0 END) AS null_fallback
                  FROM agents WHERE id IN (${IDS});"
