name: "Admin — DB Source Audit (mos_db vs pm2 DB)"

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: SSH audit
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            MOS="mysql -u mos_user -pmos_secure_2026 mos_db"
            echo "=== mos_db tables ==="
            $MOS -e "SHOW TABLES;" 2>&1
            echo "=== mos_db missions columns ==="
            $MOS -e "DESCRIBE missions;" 2>&1 || echo "(no missions table)"
            echo "=== mos_db brands columns ==="
            $MOS -e "DESCRIBE brands;" 2>&1 || echo "(no brands table)"
            echo "=== mos_db recent missions (last 5) ==="
            $MOS -e "SELECT id, LEFT(title,30) AS title, userId, brandId, LEFT(squadSlug,20) AS squad FROM missions ORDER BY id DESC LIMIT 5;" 2>&1 || echo "(query failed)"

            eval "$(pm2 jlist 2>/dev/null | node -e "
              let d=''; process.stdin.on('data',c=>d+=c);
              process.stdin.on('end',()=>{
                try{
                  const procs=JSON.parse(d);
                  const p=procs.find(x=>x.pm2_env&&x.pm2_env.DB_HOST);
                  if(!p) { console.log('echo NO_PM2_DB'); process.exit(0); }
                  const e=p.pm2_env;
                  console.log('export PM2_DB_HOST=' + JSON.stringify(e.DB_HOST));
                  console.log('export PM2_DB_USER=' + JSON.stringify(e.DB_USER));
                  console.log('export PM2_DB_PASS=' + JSON.stringify(e.DB_PASSWORD));
                  console.log('export PM2_DB_NAME=' + JSON.stringify(e.DB_NAME));
                }catch(e){ console.log('echo PM2_PARSE_ERROR'); }
              });
            ")"
            echo "=== pm2 DB: $PM2_DB_HOST / $PM2_DB_NAME ==="
            if [ -n "$PM2_DB_HOST" ] && [ "$PM2_DB_HOST" != "localhost" ] && [ "$PM2_DB_HOST" != "127.0.0.1" ]; then
              PM2="mysql --ssl-mode=REQUIRED -h $PM2_DB_HOST -u $PM2_DB_USER -p$PM2_DB_PASS $PM2_DB_NAME"
            else
              PM2="mysql -u $PM2_DB_USER -p$PM2_DB_PASS $PM2_DB_NAME"
            fi
            echo "=== pm2 DB tables ==="
            $PM2 -e "SHOW TABLES;" 2>&1
            echo "=== pm2 DB missions columns ==="
            $PM2 -e "DESCRIBE missions;" 2>&1 || echo "(no missions table)"
            echo "=== pm2 DB brands columns ==="
            $PM2 -e "DESCRIBE brands;" 2>&1 || echo "(no brands table)"
            echo "=== pm2 DB recent missions (last 5) ==="
            $PM2 -e "SELECT id, LEFT(title,30) AS title, userId, brandId, LEFT(squadSlug,20) AS squad FROM missions ORDER BY id DESC LIMIT 5;" 2>&1 || echo "(query failed)"

            echo "=== pm2 process DB_HOST summary ==="
            pm2 jlist 2>/dev/null | node -e "
              let d=''; process.stdin.on('data',c=>d+=c);
              process.stdin.on('end',()=>{
                try{
                  const procs=JSON.parse(d);
                  procs.forEach(p=>{
                    const h=p.pm2_env?.DB_HOST||'(none)';
                    const n=p.pm2_env?.DB_NAME||'(none)';
                    console.log(p.name+' -> DB_HOST='+h+' DB_NAME='+n);
                  });
                }catch(e){ console.log('parse error'); }
              });
            " 2>&1
            echo "=== audit done ==="
