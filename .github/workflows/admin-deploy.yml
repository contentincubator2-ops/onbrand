name: Admin — Deploy to VM (git pull + build + restart)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Checkout code on the Actions runner
      - uses: actions/checkout@v4

      # 2. Write SSH key to file for rsync
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      # 3. Rsync repo to VM (replaces git fetch/reset)
      - name: Sync code to VM
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='skills/ai-talent/client/node_modules' \
            --exclude='skills/ai-talent/public' \
            --exclude='skills/ai-talent/.env' \
            ./ "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/opt/marketing-os/app/"

      # 4. Install deps, build frontend, restart PM2
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 600s
          script: |
            set -e
            APP=/opt/marketing-os/app
            AI=$APP/skills/ai-talent

            echo "===== 1. Code already synced by rsync ====="
            cd "$APP"
            echo "Tip: $(ls -1 | head -5)"

            echo ""
            echo "===== 2. Install backend dependencies ====="
            cd "$AI"
            npm install --legacy-peer-deps 2>&1 | tail -5

            echo ""
            echo "===== 3. Build frontend ====="
            cd "$AI/client"
            npm install --legacy-peer-deps 2>&1 | tail -5
            npm run build 2>&1 | tail -15
            echo "Build output:"
            stat -c '%y %s bytes' "$AI/public/index.html"

            echo ""
            echo "===== 4. Restart PM2 ====="
            cd "$AI"
            pm2 restart marketing-os 2>/dev/null || \
              pm2 start "node_modules/.bin/tsx server/index.ts" \
                --name marketing-os --cwd "$AI"
            pm2 save --force

            echo ""
            echo "===== 5. Health check ====="
            sleep 5
            curl -s -o /dev/null -w "Backend HTTP %{http_code}\n" http://127.0.0.1:3101/health
            pm2 list | grep marketing-os
            echo "===== Deploy complete ====="
