name: Admin — Deploy to VM (git pull + build + restart)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 600s
          envs: GH_PAT
          script: |
            set -e
            APP=/opt/marketing-os/app
            AI=$APP/skills/ai-talent

            echo "===== 1. Pull latest code ====="
            cd "$APP"
            # Inject token for this fetch only (not stored permanently)
            git -c "url.https://x-access-token:${GH_PAT}@github.com/.insteadOf=https://github.com/" \
              fetch origin main
            git reset --hard origin/main
            echo "Commit: $(git log --oneline -1)"

            echo ""
            echo "===== 2. Install backend dependencies ====="
            cd "$AI"
            npm install --legacy-peer-deps 2>&1 | tail -5

            echo ""
            echo "===== 3. Build frontend ====="
            cd "$AI/client"
            npm install --legacy-peer-deps 2>&1 | tail -5
            npm run build 2>&1 | tail -15
            echo "Build output:"
            stat -c '%y %s bytes' "$AI/public/index.html"

            echo ""
            echo "===== 4. Restart PM2 ====="
            cd "$AI"
            pm2 restart marketing-os 2>/dev/null || \
              pm2 start "node_modules/.bin/tsx server/index.ts" \
                --name marketing-os --cwd "$AI"
            pm2 save --force

            echo ""
            echo "===== 5. Health check ====="
            sleep 5
            curl -s -o /dev/null -w "Backend HTTP %{http_code}\n" http://127.0.0.1:3101/health
            pm2 list | grep marketing-os
            echo "===== Deploy complete ====="
