name: Admin — Deploy to VM (standard)

# Standard deploy after consolidation.
# Pulls latest Marketing-OS from GitHub, rebuilds frontend, restarts backend.
# Run this for every future code change.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm == 'DEPLOY' }}
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 300s
          script: |
            set -e
            APP=/opt/marketing-os/app
            AI=$APP/skills/ai-talent

            echo "===== Pull latest code ====="
            cd "$APP"
            git fetch origin main && git reset --hard origin/main
            echo "Latest commit: $(git log --oneline -1)"

            echo ""
            echo "===== Install & build ====="
            cd "$AI"
            npm install --legacy-peer-deps 2>&1 | tail -3
            cd "$AI/client"
            npm install --legacy-peer-deps 2>&1 | tail -3
            npm run build 2>&1 | tail -5

            echo ""
            echo "===== Restart backend ====="
            pm2 restart marketing-os

            echo ""
            echo "===== Health check ====="
            sleep 3
            pm2 list | head -5
            curl -s -o /dev/null -w "Backend /health: HTTP %{http_code}\n" http://127.0.0.1:3101/health
            stat -c 'Frontend build: %y' "$AI/public/index.html"
