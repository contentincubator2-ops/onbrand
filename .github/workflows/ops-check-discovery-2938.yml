name: "Ops — Check discovery jobs brand 2938 (SSH)"

# 2026-07-07: debug the SPA alt-fallback — latest re-scan of brand 2938
# (lativ.com.tw) completed without creating new products. Dump the last
# discovery jobs' phase/errorLog + current products + pm2 log tail.
# Read-only.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Dump discovery jobs + products + logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 90s
          script: |
            set +e
            source /opt/onbrand/app/skills/ai-talent/.env 2>/dev/null || true
            H="${LOCAL_DB_HOST:-127.0.0.1}"; U="${LOCAL_DB_USER:-mos_user}"
            P="${LOCAL_DB_PASSWORD}"; D="${LOCAL_DB_NAME:-mos_db}"

            echo "=== Discovery jobs for brand 2938 (latest 5) ==="
            mysql -h"$H" -u"$U" -p"$P" "$D" -e \
              "SELECT id, status, phase, totalFound, totalPositioned, websiteUrl,
                      LEFT(IFNULL(errorLog,'ok'),4000) AS errors, createdAt, completedAt
               FROM product_discovery_jobs WHERE brandId=2938 ORDER BY id DESC LIMIT 5\G"

            echo "=== Products for brand 2938 ==="
            mysql -h"$H" -u"$U" -p"$P" "$D" -e \
              "SELECT id, name,
                      JSON_UNQUOTE(JSON_EXTRACT(positioning,'$.imageUrl')) AS imageUrl,
                      createdAt
               FROM products WHERE brandId=2938 ORDER BY id DESC LIMIT 40;"

            echo "=== pm2 out log — productDiscovery lines (last 60) ==="
            grep -E "productDiscovery" ~/.pm2/logs/onbrand-out.log 2>/dev/null | tail -60
            echo "=== pm2 error log — productDiscovery lines (last 30) ==="
            grep -E "productDiscovery" ~/.pm2/logs/onbrand-error.log 2>/dev/null | tail -30
            exit 0
