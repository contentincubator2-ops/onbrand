name: Ops — Recover LOCAL_DB_PASSWORD from backups

# Searches .env backups and pm2 dump backup for LOCAL_DB_PASSWORD.
# If found, writes it to .env and restarts pm2.
# Values are masked in logs so they never appear in plain text.

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: [self-hosted, linux, vm-onbrand]
    timeout-minutes: 3
    steps:
      - name: Search backups for LOCAL_DB_PASSWORD
        run: |
          set +e
          ENV=/opt/onbrand/app/skills/ai-talent/.env
          FOUND=""

          echo "════════════════════════════════════════════"
          echo "  Searching for LOCAL_DB_PASSWORD in backups"
          echo "════════════════════════════════════════════"

          # 1. Search .env backup files (most likely source)
          echo ""
          echo "── .env backup files ──"
          for bak in "${ENV}.bak."* /opt/onbrand/app/skills/ai-talent/.env.bak.* /opt/marketing-os/app/skills/ai-talent/.env.bak.*; do
            [ -f "$bak" ] || continue
            val=$(grep "^LOCAL_DB_PASSWORD=" "$bak" 2>/dev/null | head -1 | sed 's/^LOCAL_DB_PASSWORD=//')
            if [ -n "$val" ]; then
              echo "  ✓ Found in: $bak (${#val} chars)"
              FOUND="$val"
              break
            else
              echo "  ○ Not in: $(basename $bak)"
            fi
          done

          # 2. Search pm2 dump backup (created by pm2 save --force)
          if [ -z "$FOUND" ]; then
            echo ""
            echo "── pm2 dump backup ──"
            for dump in ~/.pm2/dump.pm2.bak ~/.pm2/dump.pm2; do
              [ -f "$dump" ] || continue
              val=$(python3 -c "
          import json, sys
          try:
            data = json.load(open('$dump'))
            for p in data:
              env = p.get('env', {}) or {}
              v = env.get('LOCAL_DB_PASSWORD', '')
              if v:
                print(v)
                break
          except: pass
          " 2>/dev/null)
              if [ -n "$val" ]; then
                echo "  ✓ Found in: $dump (${#val} chars)"
                FOUND="$val"
                break
              else
                echo "  ○ Not in: $(basename $dump)"
              fi
            done
          fi

          # 3. Search any other .env files on the system
          if [ -z "$FOUND" ]; then
            echo ""
            echo "── Searching other .env locations ──"
            for f in /opt/marketing-os/app/skills/ai-talent/.env /home/azureuser/app/skills/ai-talent/.env; do
              [ -f "$f" ] || continue
              val=$(grep "^LOCAL_DB_PASSWORD=" "$f" 2>/dev/null | head -1 | sed 's/^LOCAL_DB_PASSWORD=//')
              if [ -n "$val" ]; then
                echo "  ✓ Found in: $f (${#val} chars)"
                FOUND="$val"
                break
              else
                echo "  ○ Not in: $f"
              fi
            done
          fi

          if [ -z "$FOUND" ]; then
            echo ""
            echo "❌ LOCAL_DB_PASSWORD not found in any backup."
            echo "   You need to set it manually:"
            echo "   1. Go to repo Settings → Secrets → Actions"
            echo "   2. Add secret: LOCAL_DB_PASSWORD = (your MySQL password for mos_user)"
            echo "   3. Re-run ops-fix-missing-critical-env.yml"
            exit 1
          fi

          # Mask the value in further log output
          echo "::add-mask::${FOUND}"

          # Write to .env
          echo ""
          echo "── Writing to .env ──"
          if grep -qE "^LOCAL_DB_PASSWORD=" "$ENV" 2>/dev/null; then
            sed -i "s|^LOCAL_DB_PASSWORD=.*|LOCAL_DB_PASSWORD=${FOUND}|" "$ENV"
            echo "  ↻ LOCAL_DB_PASSWORD updated"
          else
            echo "LOCAL_DB_PASSWORD=${FOUND}" >> "$ENV"
            echo "  + LOCAL_DB_PASSWORD added"
          fi

          echo ""
          echo "── Restarting pm2 ──"
          pm2 restart onbrand --update-env 2>&1 | tail -3
          sleep 4
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3101/health || echo "000")
          echo "  /health → $HTTP"
          if [ "$HTTP" = "200" ]; then
            echo "✅ Server is up!"
            curl -s http://localhost:3101/health
          else
            echo "❌ Still down. Error log:"
            tail -10 ~/.pm2/logs/onbrand-error.log 2>/dev/null || true
          fi
