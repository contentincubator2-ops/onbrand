name: Admin — Fix brand-archetype-positioning Step Agents

# Inspect and hard-assign the 5 step agents for brand-archetype-positioning squad.
# Uses the known curated agent roster (IDs verified from admin-reassign-brand-steps.yml).
#
# Step assignment logic:
#   Step 1 (現有品牌人格診斷 — competitive-analysis, brand-perception)
#     → agent 90052: [AI] Head of Brand Insights (brand strategy, market research, competitive analysis)
#
#   Step 2 (原型選擇與組合 — brand-archetype, brand-strategy, jungian)
#     → Lead agent (resolved from squads.agents where is_lead=1)
#
#   Step 3 (品牌聲音指南 — brand-voice, tone-of-voice, copywriting)
#     → agent 29: 蘇雅玲 (pm-pr-saas) — copywriting, brand narrative, messaging
#
#   Step 4 (視覺與體驗方向 — visual-identity, creative-direction, brand-design)
#     → agent 180005: David Lee (david-hubspot) — brand storytelling, visual brand direction
#
#   Step 5 (全通路原型一致性稽核 — brand-strategy, omnichannel, content-strategy)
#     → agent 60001: 沈奕蓁 (cmo-vivian-shen) — omnichannel, pmm, full-funnel brand audit

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'AUDIT = inspect only, APPLY = write assignments to DB'
        required: true
        default: 'AUDIT'

jobs:
  fix-archetype-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e
            MOS_USER="mos_user"
            MOS_PASS="mos_secure_2026"
            MOS_DB="mos_db"
            MODE="${{ github.event.inputs.mode }}"

            SLUG="brand-archetype-positioning"

            echo "======================================================"
            echo "brand-archetype-positioning — Step Agent $MODE"
            echo "======================================================"

            # ── 1. Squad overview ───────────────────────────────────────
            echo ""
            echo "=== 1. Squad row ==="
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
              SELECT id, slug, name, missionType,
                     JSON_LENGTH(agents) AS agent_count,
                     JSON_LENGTH(steps)  AS step_count
              FROM squads
              WHERE slug = '$SLUG' AND is_active = 1
              LIMIT 1;
            " 2>&1

            # ── 2. Current squad agents (with skills + model) ───────────
            echo ""
            echo "=== 2. Squad members (current) ==="
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
              SELECT
                m.agent_id,
                m.is_lead,
                m.role,
                m.ord,
                a.name,
                a.primarySkill,
                a.aiModel
              FROM squads s,
                JSON_TABLE(s.agents, '\$[*]' COLUMNS (
                  agent_id  INT          PATH '\$.agent_id',
                  is_lead   TINYINT      PATH '\$.is_lead',
                  role      VARCHAR(100) PATH '\$.role',
                  ord       INT          PATH '\$.order'
                )) AS m
              JOIN agents a ON a.id = m.agent_id
              WHERE s.slug = '$SLUG' AND s.is_active = 1
              ORDER BY m.ord;
            " 2>&1

            # ── 3. Current step assignments ─────────────────────────────
            echo ""
            echo "=== 3. Current step → agent assignment ==="
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
              SELECT
                st.step_order,
                LEFT(st.step_name, 30) AS step_name,
                st.assigned_agent_id,
                COALESCE(a.name, '(UNASSIGNED)') AS agent_name,
                COALESCE(a.primarySkill, '—')     AS primary_skill,
                COALESCE(a.aiModel, '—')          AS ai_model
              FROM squads s,
                JSON_TABLE(s.steps, '\$[*]' COLUMNS (
                  step_order        INT          PATH '\$.order',
                  step_name         VARCHAR(200) PATH '\$.name',
                  assigned_agent_id INT          PATH '\$.assignedAgentId'
                )) AS st
              LEFT JOIN agents a ON a.id = st.assigned_agent_id
              WHERE s.slug = '$SLUG' AND s.is_active = 1
              ORDER BY st.step_order;
            " 2>&1

            # ── 4. Curated target agents (verify they exist) ────────────
            echo ""
            echo "=== 4. Target agents for assignment ==="
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
              SELECT id, name, slug, primarySkill, aiModel
              FROM agents
              WHERE id IN (
                /* Step 1: brand perception / competitive-analysis */
                90052,
                /* Step 3: brand-voice / copywriting */
                29,
                /* Step 4: visual-identity / creative-direction */
                180005,
                /* Step 5: omnichannel / brand-strategy */
                60001
              )
              ORDER BY id;
            " 2>&1

            # ── 5. Lead agent (Steps 2 + Synthesis) ────────────────────
            echo ""
            echo "=== 5. Lead agent ==="
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
              SELECT a.id, a.name, a.primarySkill, a.aiModel,
                     JSON_UNQUOTE(JSON_EXTRACT(m.agent_val, '\$.role')) AS squad_role
              FROM squads s,
                JSON_TABLE(s.agents, '\$[*]' COLUMNS (
                  agent_id  INT  PATH '\$.agent_id',
                  is_lead   TINYINT PATH '\$.is_lead',
                  agent_val JSON PATH '\$'
                )) AS m
              JOIN agents a ON a.id = m.agent_id
              WHERE s.slug = '$SLUG' AND s.is_active = 1 AND m.is_lead = 1
              LIMIT 1;
            " 2>&1

            # ── 6. APPLY mode: patch step assignments ───────────────────
            if [ "$MODE" = "APPLY" ]; then
              echo ""
              echo "======================================================"
              echo "APPLYING step agent assignments..."
              echo "======================================================"

              # Get lead agent_id
              LEAD_ID=$(mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -sN -e "
                SELECT m.agent_id
                FROM squads s,
                  JSON_TABLE(s.agents, '\$[*]' COLUMNS (
                    agent_id INT     PATH '\$.agent_id',
                    is_lead  TINYINT PATH '\$.is_lead'
                  )) AS m
                WHERE s.slug = '$SLUG' AND s.is_active = 1 AND m.is_lead = 1
                LIMIT 1;
              " 2>&1)

              LEAD_NAME=$(mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -sN -e "
                SELECT a.name FROM agents a WHERE a.id = $LEAD_ID LIMIT 1;
              " 2>&1)

              LEAD_SLUG=$(mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -sN -e "
                SELECT a.slug FROM agents a WHERE a.id = $LEAD_ID LIMIT 1;
              " 2>&1)

              echo "Lead: id=$LEAD_ID name=$LEAD_NAME slug=$LEAD_SLUG"
              echo ""
              echo "Target assignments:"
              echo "  Step 1 → agent 90052 ([AI] Head of Brand Insights — brand-perception, competitive-analysis)"
              echo "  Step 2 → Lead ($LEAD_ID $LEAD_NAME — brand-archetype, brand-strategy)"
              echo "  Step 3 → agent 29 (蘇雅玲 — brand-voice, copywriting)"
              echo "  Step 4 → agent 180005 (David Lee — visual brand direction, brand storytelling)"
              echo "  Step 5 → agent 60001 (沈奕蓁 — omnichannel, brand-strategy audit)"
              echo ""

              mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
                UPDATE squads sq
                SET sq.steps = (
                  SELECT JSON_ARRAYAGG(
                    CASE
                      -- Step 1: 現有品牌人格診斷 → 90052 (Brand Insights Head)
                      WHEN CAST(JSON_EXTRACT(jt.step_val, '\$.order') AS UNSIGNED) = 1
                      THEN JSON_SET(jt.step_val,
                        '\$.assignedAgentId',   90052,
                        '\$.assignedAgentSlug', 'ai-head-of-brand-insights-kantar',
                        '\$.assignedAgentName', '[AI] Head of Brand Insights'
                      )
                      -- Step 2: 原型選擇與組合 → Lead
                      WHEN CAST(JSON_EXTRACT(jt.step_val, '\$.order') AS UNSIGNED) = 2
                      THEN JSON_SET(jt.step_val,
                        '\$.assignedAgentId',   $LEAD_ID,
                        '\$.assignedAgentSlug', '$LEAD_SLUG',
                        '\$.assignedAgentName', '$LEAD_NAME'
                      )
                      -- Step 3: 品牌聲音指南 → 29 蘇雅玲
                      WHEN CAST(JSON_EXTRACT(jt.step_val, '\$.order') AS UNSIGNED) = 3
                      THEN JSON_SET(jt.step_val,
                        '\$.assignedAgentId',   29,
                        '\$.assignedAgentSlug', 'pm-pr-saas',
                        '\$.assignedAgentName', '蘇雅玲'
                      )
                      -- Step 4: 視覺與體驗方向 → 180005 David Lee
                      WHEN CAST(JSON_EXTRACT(jt.step_val, '\$.order') AS UNSIGNED) = 4
                      THEN JSON_SET(jt.step_val,
                        '\$.assignedAgentId',   180005,
                        '\$.assignedAgentSlug', 'david-hubspot',
                        '\$.assignedAgentName', 'David Lee'
                      )
                      -- Step 5: 全通路原型一致性稽核 → 60001 沈奕蓁
                      WHEN CAST(JSON_EXTRACT(jt.step_val, '\$.order') AS UNSIGNED) = 5
                      THEN JSON_SET(jt.step_val,
                        '\$.assignedAgentId',   60001,
                        '\$.assignedAgentSlug', 'cmo-vivian-shen',
                        '\$.assignedAgentName', '沈奕蓁'
                      )
                      ELSE jt.step_val
                    END
                  )
                  FROM JSON_TABLE(sq.steps, '\$[*]' COLUMNS (step_val JSON PATH '\$')) AS jt
                )
                WHERE sq.slug = '$SLUG' AND sq.is_active = 1;
              " 2>&1

              echo ""
              echo "=== Verification: final assignments ==="
              mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
                SELECT
                  st.step_order,
                  LEFT(st.step_name, 28) AS step_name,
                  st.assigned_agent_id,
                  COALESCE(a.name, '(UNASSIGNED)') AS agent_name,
                  COALESCE(a.primarySkill, '—')     AS primary_skill,
                  COALESCE(a.aiModel, '—')          AS ai_model
                FROM squads s,
                  JSON_TABLE(s.steps, '\$[*]' COLUMNS (
                    step_order        INT          PATH '\$.order',
                    step_name         VARCHAR(200) PATH '\$.name',
                    assigned_agent_id INT          PATH '\$.assignedAgentId'
                  )) AS st
                LEFT JOIN agents a ON a.id = st.assigned_agent_id
                WHERE s.slug = '$SLUG' AND s.is_active = 1
                ORDER BY st.step_order;
              " 2>&1

              echo ""
              echo "✅ brand-archetype-positioning step agents patched."
              echo "   Next: clear squad_chat_sessions for this squad if needed:"
              echo "   DELETE FROM squad_chat_sessions WHERE squadSlug='$SLUG';"
            else
              echo ""
              echo "✅ AUDIT complete. Run APPLY to write assignments."
            fi

            echo "======================================================"
