name: Admin — Clear User Mission Messages

on:
  workflow_dispatch:
    inputs:
      user_email:
        description: 'Email or name fragment to search (e.g. cjwang@sowork.tw)'
        required: true
        default: 'cjwang@sowork.tw'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Run clear script on server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/azureuser/marketing-os
            npx tsx skills/ai-talent/scripts/clear-user-mission-messages.ts "${{ github.event.inputs.user_email }}"
