name: Admin — Live sweep progress (pm2 + DB)

on:
  workflow_dispatch:

jobs:
  progress:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 30s
          script: |
            export MYSQL_PWD="mos_secure_2026"
            echo "════════ Sweep-created outputs in last 30 minutes (count by taskId) ════════"
            mysql -h localhost -u mos_user mos_db -e "
              SELECT
                JSON_UNQUOTE(JSON_EXTRACT(metadata, '\$.taskId')) AS taskId,
                JSON_UNQUOTE(JSON_EXTRACT(metadata, '\$.tier')) AS tier,
                COUNT(*) AS n,
                MAX(createdAt) AS latest
              FROM mission_outputs
              WHERE createdAt > NOW() - INTERVAL 30 MINUTE
              GROUP BY taskId, tier
              ORDER BY latest DESC
              LIMIT 50
            "

            echo ""
            echo "════════ pm2 process status ════════"
            pm2 status | grep marketing-os

            echo ""
            echo "════════ Last 30 caption errors / completions ════════"
            pm2 logs marketing-os --lines 200 --nostream --raw 2>&1 | grep -E "兩次嘗試都失敗|outputId|recordTaskRun|callOneVariant.*L3|fail" | tail -20
