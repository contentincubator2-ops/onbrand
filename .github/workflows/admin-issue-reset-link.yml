name: Admin — Issue password reset link

# Workaround for the broken forgot-password email flow.
#
# What this does:
#   1. Confirms whether SENDGRID_API_KEY / RESEND_API_KEY is set on the VM
#      (this is why the email never arrived)
#   2. Generates a fresh reset token directly in the DB for the given email
#   3. Prints the reset URL — the user clicks it to set a new password
#
# Security:
#   - I (Claude) NEVER see or set the password — only the user does, via the
#     same /reset-password page the email link would have opened
#   - Token expires in 1 hour, same as normal flow
#   - URL is printed to GitHub Actions logs (only repo admins see them)

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Account email to issue reset link for"
        required: true
        default: "cjwang@sowork.tw"

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          envs: TARGET_EMAIL
          script: |
            set +e
            AI=/opt/marketing-os/app/skills/ai-talent
            ENV_FILE="$AI/.env"
            EMAIL="${{ github.event.inputs.email }}"

            echo "════════════════════════════════════════"
            echo "  Issue reset link for: $EMAIL"
            echo "  $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "════════════════════════════════════════"

            # ── 1. Why didn't the email arrive? ─────────────────────────────
            echo ""
            echo "── 1. Mail provider config ──"
            for k in SENDGRID_API_KEY RESEND_API_KEY EMAIL_FROM APP_URL; do
              if grep -qE "^${k}=." "$ENV_FILE" 2>/dev/null; then
                LEN=$(grep -E "^${k}=" "$ENV_FILE" | head -1 | cut -d= -f2- | tr -d '\r\n' | wc -c)
                if [ "$k" = "EMAIL_FROM" ] || [ "$k" = "APP_URL" ]; then
                  VAL=$(grep -E "^${k}=" "$ENV_FILE" | head -1 | cut -d= -f2-)
                  echo "  $k = $VAL"
                else
                  echo "  $k = (set, $LEN chars)"
                fi
              else
                echo "  $k = (NOT SET)"
              fi
            done

            echo ""
            echo "── 2. Recent mail errors in PM2 log ──"
            tail -2000 ~/.pm2/logs/marketing-os-error.log 2>/dev/null \
              | grep -iE "Failed to send email|sendgrid|resend|sgMail|password reset" \
              | tail -20 \
              || echo "(no recent mail errors)"

            # ── 3. Issue reset token directly in DB ─────────────────────────
            set -a
            source "$ENV_FILE" 2>/dev/null
            set +a

            # The app uses LOCAL_DB_* var names (see env.ts comment:
            # "Actual connection uses LOCAL_DB_*"). Legacy DB_* are unused.
            echo ""
            echo "── 3. DB env var probe ──"
            for v in LOCAL_DB_HOST LOCAL_DB_PORT LOCAL_DB_USER LOCAL_DB_NAME DB_HOST DB_USER DB_NAME; do
              VAL=$(eval "echo \${$v:-}")
              [ -n "$VAL" ] && echo "  $v = $VAL"
            done
            for v in LOCAL_DB_PASSWORD DB_PASSWORD; do
              VAL=$(eval "echo \${$v:-}")
              [ -n "$VAL" ] && echo "  $v = (set, ${#VAL} chars)"
            done

            # Fallbacks match the hardcoded defaults in db.ts / localDb.ts
            # so this works even when .env doesn't override (which is the case
            # on this VM as of 2026-05-04).
            MYSQL_USER_ARG="${LOCAL_DB_USER:-${DB_USER:-mos_user}}"
            MYSQL_HOST_ARG="${LOCAL_DB_HOST:-${DB_HOST:-localhost}}"
            MYSQL_DB_ARG="${LOCAL_DB_NAME:-${DB_NAME:-mos_db}}"
            MYSQL_PORT_ARG="${LOCAL_DB_PORT:-${DB_PORT:-3306}}"
            MYSQL_PWD_ARG="${LOCAL_DB_PASSWORD:-${DB_PASSWORD:-mos_secure_2026}}"

            export MYSQL_PWD="$MYSQL_PWD_ARG"
            MYSQL="mysql -h $MYSQL_HOST_ARG -P $MYSQL_PORT_ARG -u $MYSQL_USER_ARG $MYSQL_DB_ARG -B -N --silent"

            echo ""
            echo "── 4. Look up user ──"
            USER_ROW=$($MYSQL -e "SELECT id, email, COALESCE(name,'(no name)') FROM users WHERE email = '${EMAIL}' LIMIT 1" 2>&1)
            RC=$?
            echo "$USER_ROW"
            if [ $RC -ne 0 ] || [ -z "$USER_ROW" ] || echo "$USER_ROW" | grep -qi "ERROR\|Access denied"; then
              echo ""
              echo "❌ MySQL connection failed — fix DB credentials before retrying"
              exit 1
            fi
            USER_ID=$(echo "$USER_ROW" | awk -F'\t' '{print $1}')
            USER_NAME=$(echo "$USER_ROW" | awk -F'\t' '{print $3}')
            echo "✓ User id=$USER_ID name=$USER_NAME"

            echo ""
            echo "── 5. Generate fresh reset token ──"
            TOKEN=$(openssl rand -hex 32)
            EXPIRES=$(date -u -d "+1 hour" '+%Y-%m-%d %H:%M:%S')

            # Try the camelCase column names (matches drizzle schema for users)
            UPDATE_OUT=$($MYSQL -e "UPDATE users
                          SET passwordResetToken = '${TOKEN}',
                              passwordResetExpires = '${EXPIRES}'
                        WHERE id = ${USER_ID}" 2>&1)
            UPDATE_RC=$?
            if [ $UPDATE_RC -ne 0 ]; then
              echo "Got error: $UPDATE_OUT"
              echo "Trying snake_case column names..."
              UPDATE_OUT=$($MYSQL -e "UPDATE users
                            SET password_reset_token = '${TOKEN}',
                                password_reset_expires = '${EXPIRES}'
                          WHERE id = ${USER_ID}" 2>&1)
              UPDATE_RC=$?
              if [ $UPDATE_RC -ne 0 ]; then
                echo "❌ Both column-naming conventions failed:"
                echo "$UPDATE_OUT"
                echo ""
                echo "── columns in users table ──"
                $MYSQL -e "DESCRIBE users" 2>&1 | head -30
                exit 1
              fi
            fi

            # Verify the token was persisted — try both column conventions
            # but only fail if BOTH are missing (DESCRIBE-driven would be
            # nicer but this is simpler).
            VERIFY_CAMEL=$($MYSQL -e "SELECT 'OK' FROM users WHERE id = ${USER_ID} AND passwordResetToken = '${TOKEN}'" 2>/dev/null)
            VERIFY_SNAKE=$($MYSQL -e "SELECT 'OK' FROM users WHERE id = ${USER_ID} AND password_reset_token = '${TOKEN}'" 2>/dev/null)
            if [ "$VERIFY_CAMEL" != "OK" ] && [ "$VERIFY_SNAKE" != "OK" ]; then
              echo "❌ Token not persisted under either column name"
              echo "── columns in users table ──"
              $MYSQL -e "DESCRIBE users" 2>&1 | head -30
              exit 1
            fi
            echo "✓ Token confirmed in DB ($([ "$VERIFY_CAMEL" = "OK" ] && echo "passwordResetToken" || echo "password_reset_token") column)"

            APP_URL_VAL="${APP_URL:-https://marketing-os.sowork.ai}"
            # SPA route is /auth/reset-password (see App.tsx + AppV2.tsx)
            RESET_URL="${APP_URL_VAL}/auth/reset-password?token=${TOKEN}"

            echo "✓ Token verified in DB (expires $EXPIRES UTC)"
            echo ""
            echo "════════════════════════════════════════"
            echo "  RESET URL — open in incognito to set new password:"
            echo "  $RESET_URL"
            echo "════════════════════════════════════════"
