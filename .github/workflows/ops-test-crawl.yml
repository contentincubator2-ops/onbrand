name: "Ops — Test product discovery crawl (brand 2916)"
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: [self-hosted, linux, vm-onbrand]
    steps:
      - name: Reset old failed jobs + trigger fresh discovery
        run: |
          source /opt/onbrand/app/skills/ai-talent/.env 2>/dev/null || true
          H="${LOCAL_DB_HOST:-127.0.0.1}"; U="${LOCAL_DB_USER:-mos_user}"
          P="${LOCAL_DB_PASSWORD:-mos_secure_2026}"; D="${LOCAL_DB_NAME:-mos_db}"
          # Mark old done jobs as archived so enqueue doesn't skip
          mysql -h"$H" -u"$U" -p"$P" "$D" -e \
            "UPDATE product_discovery_jobs SET status='archived' WHERE brandId=2916 AND status='done';"
          echo "Cleared old jobs"
          # Test the URL normalization manually
          node -e "
            const url = 'https://www.laurel.com.tw/index.php';
            let s = url.trim().replace(/\/\$/, '');
            s = s.replace(/\/(index|default|home)\.(php|html|htm|asp|aspx)\$/i, '');
            console.log('Normalized URL:', s);
            const suffixes = ['', '/products', '/product', '/menu', '/services', '/service', '/shop', '/about'];
            suffixes.forEach(sfx => console.log('  Would crawl:', s + sfx));
          " 2>&1
      - name: Wait 35s for worker to pick up job
        run: sleep 35
      - name: Check discovery result
        run: |
          source /opt/onbrand/app/skills/ai-talent/.env 2>/dev/null || true
          H="${LOCAL_DB_HOST:-127.0.0.1}"; U="${LOCAL_DB_USER:-mos_user}"
          P="${LOCAL_DB_PASSWORD:-mos_secure_2026}"; D="${LOCAL_DB_NAME:-mos_db}"
          echo "=== Latest discovery jobs ==="
          mysql -h"$H" -u"$U" -p"$P" "$D" -e \
            "SELECT id, status, phase, totalFound, totalPositioned, websiteUrl, LEFT(errorLog,500) AS errors, createdAt
             FROM product_discovery_jobs WHERE brandId=2916 ORDER BY createdAt DESC LIMIT 3;"
          echo "=== Products found ==="
          mysql -h"$H" -u"$U" -p"$P" "$D" -e \
            "SELECT id, name, slug FROM products WHERE brandId=2916 ORDER BY createdAt DESC LIMIT 20;"
