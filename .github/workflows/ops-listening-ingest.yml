name: Ops — Listening mention ingest (daily)

# 2026-08-06 (CJ「仿造 OpView 自己累積數據庫」Phase 1): runs the 4 輿情
# scopes per active brand and appends dedup'd mentions into
# listening_mentions, so history accumulates for later trend/spike/sentiment
# views. Default scope = sowork@sowork.tw brands (the only account the
# market-intel workspace is open to). Manual dispatch accepts a single
# brand or --all.
#
# NOTE: schedule triggers only fire from the DEFAULT branch (main), so this
# starts accumulating once promoted to main. Until then, run it by hand via
# workflow_dispatch from whichever branch has the code.

on:
  schedule:
    - cron: "0 19 * * *"     # 03:00 Asia/Taipei (UTC+8) daily
  workflow_dispatch:
    inputs:
      brand:
        description: "single brand id (blank = sowork@sowork.tw brands)"
        required: false
        default: ""
      all:
        description: "ingest ALL completed brands (overrides brand)"
        type: boolean
        default: false

jobs:
  ingest:
    runs-on: [self-hosted, linux, vm-onbrand]
    timeout-minutes: 40
    steps:
      - name: Run listening ingest
        run: |
          set -e
          cd /opt/onbrand/app/skills/ai-talent
          set -a; source .env; set +a
          ARGS=""
          if [ "${{ github.event.inputs.all }}" = "true" ]; then
            ARGS="--all"
          elif [ -n "${{ github.event.inputs.brand }}" ]; then
            ARGS="--brand=${{ github.event.inputs.brand }}"
          fi
          echo "Running: npx tsx scripts/ingest-listening-mentions.ts $ARGS"
          npx tsx scripts/ingest-listening-mentions.ts $ARGS
