name: Admin — Probe frontend dist + nginx

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 300s
          script: |
            set +e
            APP=/opt/onbrand/app
            AI=$APP/skills/ai-talent

            echo "════ index.html locations ════"
            for d in $AI/public $AI/client/dist $AI/dist $APP/public $APP/dist; do
              if [ -f "$d/index.html" ]; then
                echo "[FOUND] $d/index.html"
                stat -c '  mtime=%y size=%s' "$d/index.html"
                grep -oE 'index-[A-Za-z0-9]+\.(js|css)' "$d/index.html" | head -4
                echo "  assets dir contents:"
                ls -la "$d/assets" 2>/dev/null | head -8
              fi
            done

            echo ""
            echo "════ nginx config root ════"
            sudo nginx -T 2>/dev/null | grep -E "root|server_name|try_files" | grep -v "#" | head -30

            echo ""
            echo "════ nginx site for OnBrand ════"
            for f in /etc/nginx/sites-enabled/*; do
              if grep -l "onbrand" "$f" 2>/dev/null; then
                echo "[FILE] $f"
                cat "$f"
              fi
            done

            echo ""
            echo "════ pm2 status ════"
            pm2 list | head -10
