name: Admin — Setup Hermes API on VM

# Copies ANTHROPIC_API_KEY from existing Marketing OS .env into ~/.hermes/.env,
# restarts the hermes-api systemd service, then runs a smoke test.
# Safe to re-run — uses sed to upsert the key rather than appending duplicates.

on:
  workflow_dispatch:

jobs:
  setup-hermes:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            set -e
            MOS_ENV=/opt/marketing-os/app/skills/ai-talent/.env
            HERMES_ENV="$HOME/.hermes/.env"

            echo "════════════════════════════════════════════"
            echo "  Hermes API Setup — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "════════════════════════════════════════════"

            # ── 1. Read ANTHROPIC_API_KEY from Marketing OS .env ──────────────
            ANTHROPIC_KEY=$(grep -E "^ANTHROPIC_API_KEY=" "$MOS_ENV" 2>/dev/null \
              | head -1 | cut -d= -f2- | tr -d '\r\n')

            if [ -z "$ANTHROPIC_KEY" ]; then
              echo "❌ ANTHROPIC_API_KEY not found in $MOS_ENV"
              exit 1
            fi
            echo "✓ ANTHROPIC_API_KEY found (${#ANTHROPIC_KEY} chars)"

            # ── 2. Upsert into ~/.hermes/.env ─────────────────────────────────
            mkdir -p "$HOME/.hermes"
            touch "$HERMES_ENV"

            if grep -q "^ANTHROPIC_API_KEY=" "$HERMES_ENV" 2>/dev/null; then
              # Key already present — update in place
              sed -i "s|^ANTHROPIC_API_KEY=.*|ANTHROPIC_API_KEY=${ANTHROPIC_KEY}|" "$HERMES_ENV"
              echo "✓ Updated existing ANTHROPIC_API_KEY in $HERMES_ENV"
            else
              echo "ANTHROPIC_API_KEY=${ANTHROPIC_KEY}" >> "$HERMES_ENV"
              echo "✓ Appended ANTHROPIC_API_KEY to $HERMES_ENV"
            fi

            # ── 3. Restart hermes-api service ─────────────────────────────────
            if systemctl is-enabled hermes-api &>/dev/null; then
              sudo systemctl restart hermes-api
              sleep 3
              STATUS=$(systemctl is-active hermes-api 2>/dev/null || echo "unknown")
              echo "✓ hermes-api service: $STATUS"
            else
              echo "⚠️  hermes-api service not found — trying direct process check"
              pgrep -f "hermes_api_server" && echo "  process running" || echo "  process NOT running"
            fi

            # ── 4. Smoke test ─────────────────────────────────────────────────
            echo ""
            echo "── Smoke test (POST /chat) ──────────────────"
            sleep 2

            HTTP=$(curl -s -o /tmp/hermes_test.txt -w "%{http_code}" \
              -X POST http://127.0.0.1:8765/chat \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${{ secrets.HERMES_API_KEY }}" \
              --max-time 30 \
              -d '{"message": "用一句話介紹你自己"}' \
              2>/dev/null || echo "000")

            echo "HTTP status: $HTTP"
            if [ "$HTTP" = "200" ]; then
              echo "✅ Hermes API is UP and responding"
              echo ""
              echo "Response preview:"
              cat /tmp/hermes_test.txt | head -c 300
            else
              echo "❌ Unexpected status $HTTP"
              echo "Response:"
              cat /tmp/hermes_test.txt 2>/dev/null || true
            fi

            # ── 5. Also test OpenAI-compat endpoint ───────────────────────────
            echo ""
            echo "── OpenAI-compat test (POST /v1/chat/completions) ───────────"
            HTTP2=$(curl -s -o /tmp/hermes_oai.txt -w "%{http_code}" \
              -X POST http://127.0.0.1:8765/v1/chat/completions \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${{ secrets.HERMES_API_KEY }}" \
              --max-time 30 \
              -d '{"model":"hermes","messages":[{"role":"user","content":"hello"}],"max_tokens":20}' \
              2>/dev/null || echo "000")

            echo "HTTP status: $HTTP2"
            if [ "$HTTP2" = "200" ]; then
              echo "✅ OpenAI-compat endpoint working"
            else
              echo "⚠️  Status $HTTP2"
              cat /tmp/hermes_oai.txt 2>/dev/null | head -c 200 || true
            fi

            echo ""
            echo "════════════════════════════════════════════"
            echo "  Done."
            echo "════════════════════════════════════════════"
