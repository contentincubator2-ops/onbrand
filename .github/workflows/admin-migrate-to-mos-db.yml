name: Admin — Migrate to mos_db (remove sowork_db dependency)

# Two-step admin workflow:
#
#   STEP 1 — Prepare mos_db
#     • Ensures missions table in mos_db has tagline / subTagline / savedSquadFlow columns
#     • Ensures brands table has brandVoice / positioningSummary columns
#
#   STEP 2 — Clean up sowork_db (Azure)
#     • Deletes all missions rows from sowork_db so the old Azure DB is empty
#     • (Schema stays; only data is deleted)
#
# Safe to re-run: all ALTER TABLE statements use idempotency checks.
# Must type MIGRATE to apply; anything else = DRY_RUN (inspect only).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type MIGRATE to apply. Anything else = DRY_RUN.'
        required: true
        default: 'DRY_RUN'

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: SSH — prepare mos_db + clean sowork_db
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /home/azureuser/marketing-os

            CONFIRM="${{ github.event.inputs.confirm }}"

            # ──────────────────────────────────────────────────────────────────
            # mos_db connection (localhost, hardcoded defaults)
            # ──────────────────────────────────────────────────────────────────
            MOS_HOST="localhost"
            MOS_USER="mos_user"
            MOS_PASS="mos_secure_2026"
            MOS_DB="mos_db"
            MOS="mysql -h $MOS_HOST -u $MOS_USER -p$MOS_PASS $MOS_DB"

            # ──────────────────────────────────────────────────────────────────
            # sowork_db (Azure) — read creds from pm2 env
            # ──────────────────────────────────────────────────────────────────
            eval "$(pm2 jlist 2>/dev/null | node -e "
              let d=''; process.stdin.on('data',c=>d+=c);
              process.stdin.on('end',()=>{
                try{
                  const procs=JSON.parse(d);
                  const p=procs.find(x=>x.pm2_env&&x.pm2_env.DB_HOST&&x.pm2_env.DB_HOST!=='localhost');
                  if(!p){ console.log('export SOWORK_DB_HOST='); process.exit(0); }
                  const e=p.pm2_env;
                  console.log('export SOWORK_DB_HOST=' + JSON.stringify(e.DB_HOST));
                  console.log('export SOWORK_DB_USER=' + JSON.stringify(e.DB_USER));
                  console.log('export SOWORK_DB_PASS=' + JSON.stringify(e.DB_PASSWORD));
                  console.log('export SOWORK_DB_NAME=' + JSON.stringify(e.DB_NAME));
                }catch(e){ console.log('export SOWORK_DB_HOST='); }
              });
            ")"

            if [ -n "$SOWORK_DB_HOST" ]; then
              SOWORK="mysql --ssl-mode=REQUIRED -h $SOWORK_DB_HOST -u $SOWORK_DB_USER -p$SOWORK_DB_PASS $SOWORK_DB_NAME"
            else
              SOWORK=""
              echo "[warn] Could not detect sowork_db credentials from pm2 — Azure clean-up will be skipped."
            fi

            echo "======================================================"
            echo "  mos_db migration (mode=$CONFIRM)"
            echo "  mos_db   : $MOS_HOST / $MOS_DB"
            echo "  sowork_db: ${SOWORK_DB_HOST:-N/A} / ${SOWORK_DB_NAME:-N/A}"
            echo "======================================================"

            # ── Inspect mos_db ────────────────────────────────────────────────
            echo ""
            echo "=== mos_db missions schema ==="
            $MOS -e "DESCRIBE missions;" 2>&1 || echo "(missions table not found)"

            echo ""
            echo "=== mos_db brands schema ==="
            $MOS -e "DESCRIBE brands;" 2>&1 || echo "(brands table not found)"

            echo ""
            echo "=== mos_db missions count ==="
            $MOS -e "SELECT COUNT(*) AS mission_count FROM missions;" 2>&1 || echo "(failed)"

            if [ -n "$SOWORK" ]; then
              echo ""
              echo "=== sowork_db missions count ==="
              $SOWORK -e "SELECT COUNT(*) AS mission_count FROM missions;" 2>&1 || echo "(failed)"
            fi

            if [ "$CONFIRM" = "MIGRATE" ]; then
              echo ""
              echo "======================================================"
              echo "STEP 1: Prepare mos_db columns"
              echo "======================================================"

              # missions: tagline
              HAS=$($MOS -N -B -e "SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA='$MOS_DB' AND TABLE_NAME='missions' AND COLUMN_NAME='tagline';" 2>/dev/null)
              if [ "$HAS" = "0" ]; then
                $MOS -e "ALTER TABLE missions ADD COLUMN tagline VARCHAR(255) DEFAULT NULL COMMENT '品牌定位標語';"
                echo "  + missions.tagline added"
              else
                echo "  = missions.tagline already exists"
              fi

              # missions: subTagline
              HAS=$($MOS -N -B -e "SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA='$MOS_DB' AND TABLE_NAME='missions' AND COLUMN_NAME='subTagline';" 2>/dev/null)
              if [ "$HAS" = "0" ]; then
                $MOS -e "ALTER TABLE missions ADD COLUMN subTagline VARCHAR(255) DEFAULT NULL COMMENT '品牌定位副標語';"
                echo "  + missions.subTagline added"
              else
                echo "  = missions.subTagline already exists"
              fi

              # missions: savedSquadFlow
              HAS=$($MOS -N -B -e "SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA='$MOS_DB' AND TABLE_NAME='missions' AND COLUMN_NAME='savedSquadFlow';" 2>/dev/null)
              if [ "$HAS" = "0" ]; then
                $MOS -e "ALTER TABLE missions ADD COLUMN savedSquadFlow TEXT DEFAULT NULL COMMENT 'User-customized squad steps JSON';"
                echo "  + missions.savedSquadFlow added"
              else
                echo "  = missions.savedSquadFlow already exists"
              fi

              # missions: squadSlug
              HAS=$($MOS -N -B -e "SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA='$MOS_DB' AND TABLE_NAME='missions' AND COLUMN_NAME='squadSlug';" 2>/dev/null)
              if [ "$HAS" = "0" ]; then
                $MOS -e "ALTER TABLE missions ADD COLUMN squadSlug VARCHAR(100) DEFAULT NULL COMMENT 'Assigned squad slug';"
                echo "  + missions.squadSlug added"
              else
                echo "  = missions.squadSlug already exists"
              fi

              # brands: brandVoice
              HAS=$($MOS -N -B -e "SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA='$MOS_DB' AND TABLE_NAME='brands' AND COLUMN_NAME='brandVoice';" 2>/dev/null)
              if [ "$HAS" = "0" ]; then
                $MOS -e "ALTER TABLE brands ADD COLUMN brandVoice TEXT DEFAULT NULL COMMENT '品牌聲音';"
                echo "  + brands.brandVoice added"
              else
                echo "  = brands.brandVoice already exists"
              fi

              # brands: positioningSummary
              HAS=$($MOS -N -B -e "SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA='$MOS_DB' AND TABLE_NAME='brands' AND COLUMN_NAME='positioningSummary';" 2>/dev/null)
              if [ "$HAS" = "0" ]; then
                $MOS -e "ALTER TABLE brands ADD COLUMN positioningSummary TEXT DEFAULT NULL COMMENT '品牌定位摘要';"
                echo "  + brands.positioningSummary added"
              else
                echo "  = brands.positioningSummary already exists"
              fi

              echo ""
              echo "=== mos_db missions post-migration schema ==="
              $MOS -e "DESCRIBE missions;" 2>&1

              echo ""
              echo "======================================================"
              echo "STEP 2: Delete missions from sowork_db (Azure)"
              echo "======================================================"

              if [ -n "$SOWORK" ]; then
                SOWORK_COUNT=$($SOWORK -N -B -e "SELECT COUNT(*) FROM missions;" 2>/dev/null || echo "0")
                echo "  Deleting $SOWORK_COUNT missions from sowork_db..."
                $SOWORK -e "DELETE FROM missions;" 2>&1
                echo "  sowork_db missions deleted."

                REMAINING=$($SOWORK -N -B -e "SELECT COUNT(*) FROM missions;" 2>/dev/null || echo "?")
                echo "  Remaining rows in sowork_db.missions: $REMAINING"
              else
                echo "  [SKIP] sowork_db credentials not available — nothing deleted from Azure."
              fi

              echo ""
              echo "======================================================"
              echo "STEP 3: Restart pm2"
              echo "======================================================"
              pm2 restart marketing-os 2>&1 || pm2 restart all 2>&1
              echo "pm2 restart triggered"

              echo ""
              echo "======================================================"
              echo "Migration complete."
              echo "======================================================"
            else
              echo ""
              echo "DRY_RUN only. Run again with confirm=MIGRATE to apply."
              echo "======================================================"
            fi
