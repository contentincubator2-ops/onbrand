name: "Admin — Create brand with positioning (from a supplied positioning book)"

# 2026-07-28 (CJ「協助新用戶設立品牌」): mirrors brand.create's INSERT shape
# exactly (brands + brand_members), then writes the full positioning JSON
# in one shot — used when the user has already authored a positioning
# document externally and wants it imported verbatim rather than re-run
# through the AI pipeline (which would overwrite hand-authored content).
#
# Payload is base64 JSON (avoids all shell-quoting hazards with CJK text)
# shaped as:
#   { "brand": { name, website, industry, targetAudience, competitors,
#                targetMarket, contentLanguage, targetCountry, outputLanguage },
#     "positioning": { <BRAND_SEGMENTS ids as keys> } }

on:
  workflow_dispatch:
    inputs:
      user_email:
        description: "Owner's email (must already have an account)"
        required: true
        type: string
      payload_b64:
        description: "Base64-encoded JSON payload ({brand, positioning})"
        required: true
        type: string

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create brand + write positioning
        uses: appleboy/ssh-action@v1.0.3
        env:
          USER_EMAIL: ${{ inputs.user_email }}
          PAYLOAD_B64: ${{ inputs.payload_b64 }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 90s
          envs: USER_EMAIL,PAYLOAD_B64
          script: |
            set -e
            cd /opt/onbrand/app/skills/ai-talent
            set -a; source .env 2>/dev/null; set +a
            node --import tsx -e "
              const mysql = require('mysql2/promise');
              (async () => {
                const raw = Buffer.from(process.env.PAYLOAD_B64, 'base64').toString('utf8');
                const payload = JSON.parse(raw);
                const conn = await mysql.createConnection({
                  host: process.env.LOCAL_DB_HOST || '127.0.0.1',
                  port: Number(process.env.LOCAL_DB_PORT || 3306),
                  user: process.env.LOCAL_DB_USER || 'mos_user',
                  password: process.env.LOCAL_DB_PASSWORD,
                  database: process.env.LOCAL_DB_NAME || 'mos_db',
                });
                const [uRows] = await conn.execute('SELECT id FROM users WHERE email = ? LIMIT 1', [process.env.USER_EMAIL]);
                const userId = uRows[0]?.id;
                if (!userId) { console.error('NO SUCH USER:', process.env.USER_EMAIL); process.exit(1); }

                const b = payload.brand;
                const slugBase = String(b.name).toLowerCase().trim()
                  .normalize('NFKD').replace(/[̀-ͯ]/g, '')
                  .replace(/[^a-z0-9-]+/g, '-').replace(/-+/g, '-').replace(/^-|-\$/g, '')
                  .slice(0, 80) || 'brand';
                const slug = slugBase + '-' + Math.random().toString(36).slice(2, 7);
                const soworkAnalysis = JSON.stringify({
                  competitors: b.competitors ?? null,
                  targetMarket: b.targetMarket ?? 'Taiwan',
                  contentLanguage: b.contentLanguage ?? 'zh-TW',
                });

                const [ins] = await conn.execute(
                  \`INSERT INTO brands
                    (userId, createdBy, slug, name, website, industry, targetAudience,
                     soworkAnalysis, targetCountry, outputLanguage, dataSource, isDefault, createdAt, updatedAt)
                   VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, 'manual', 0, NOW(3), NOW(3))\`,
                  [userId, userId, slug, b.name, b.website ?? null, b.industry ?? null, b.targetAudience ?? null,
                   soworkAnalysis, b.targetCountry ?? null, b.outputLanguage ?? null],
                );
                const brandId = ins.insertId;

                await conn.execute(
                  \`INSERT INTO brand_members (brandId, userId, role, addedBy) VALUES (?, ?, 'owner', ?)\`,
                  [brandId, userId, userId],
                );

                await conn.execute('UPDATE brands SET positioning = ? WHERE id = ?', [JSON.stringify(payload.positioning), brandId]);

                console.log('BRAND_CREATED id=' + brandId + ' slug=' + slug + ' userId=' + userId);
                const [check] = await conn.execute('SELECT id, name, slug, JSON_LENGTH(positioning) as segCount FROM brands WHERE id = ?', [brandId]);
                console.log(JSON.stringify(check[0]));
                await conn.end();
              })().catch(e => { console.error('FAILED:', e); process.exit(1); });
            "
