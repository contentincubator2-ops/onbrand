name: Admin — Deep trace recent image.generate result

on:
  workflow_dispatch:

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            LOG_OUT=/home/$(whoami)/.pm2/logs/marketing-os-out.log
            LOG_ERR=/home/$(whoami)/.pm2/logs/marketing-os-error.log

            echo "── last 200 lines of OUT log (everything image-related) ─────"
            tail -500 "$LOG_OUT" 2>/dev/null | grep -iE "image\.generate|piapi|flux|qubico|gen.?image|generateImage|imageGen|provider not implemented|/static/covers" | tail -60

            echo
            echo "── last 200 lines of ERROR log (FULL) ─────"
            tail -200 "$LOG_ERR" 2>/dev/null

            echo
            echo "── most recent tRPC errors per path ─────"
            tail -2000 "$LOG_ERR" 2>/dev/null | python3 -c "
            import sys, re
            from collections import OrderedDict
            text = sys.stdin.read()
            blocks = re.split(r'\[trpc\] Error: ', text)
            by_path = OrderedDict()
            for b in blocks[1:]:
                m = re.search(r\"path: '([^']+)'\", b)
                e = re.search(r\"errorMessage: ['\\\"]([^'\\\"]+)\", b)
                t = re.search(r\"ts: '([^']+)'\", b)
                if m and e:
                    by_path.setdefault(m.group(1), []).append((t.group(1) if t else '?', e.group(1)[:200]))
            for p, errs in by_path.items():
                last = errs[-1]
                print(f'  {p}: {last[0]}  {last[1]}')
            "
