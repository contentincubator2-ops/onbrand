name: Admin — data consistency audit (12 risks)

# Read-only audit. Lists actual broken rows for each of the 12
# inconsistency risks CJ identified 2026-04-30. No mutations.
# Use the per-risk results to decide what's worth fixing vs theoretical.

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 300s
          script: |
            set +e
            cd /opt/marketing-os/app/skills/ai-talent 2>/dev/null || cd /opt/marketing-os/skills/ai-talent
            set -a
            [ -f .env ] && . .env
            [ -f /opt/marketing-os/.env ] && . /opt/marketing-os/.env
            set +a
            DB_HOST_V=${DB_HOST:-127.0.0.1}
            DB_USER_V=${DB_USER:-root}
            DB_NAME_V=${DB_NAME:-mos_db}
            run_sql() {
              MYSQL_PWD="$DB_PASSWORD" mysql -h"$DB_HOST_V" -u"$DB_USER_V" "$DB_NAME_V" -t "$@"
            }
            section() { echo ""; echo "===== $1 ====="; }

            section "RISK #1: Brand orphan (no brand_members) — should be 0 after backfill"
            run_sql -e "
              SELECT COUNT(*) AS n_orphans
                FROM brands b
                LEFT JOIN brand_members bm ON bm.brandId = b.id AND bm.userId = b.userId
               WHERE bm.id IS NULL;"

            section "RISK #2: Mission list filter drift — by status across procedures"
            # If procedures filter status differently they'll show different counts
            run_sql -e "
              SELECT status, COUNT(*) AS n FROM missions GROUP BY status ORDER BY n DESC;"

            section "RISK #3: Squad list — what filters could drift"
            run_sql -e "
              SELECT
                SUM(CASE WHEN is_active = 1 THEN 1 ELSE 0 END) AS active,
                SUM(CASE WHEN is_active = 0 THEN 1 ELSE 0 END) AS inactive,
                SUM(CASE WHEN tier = 'core' THEN 1 ELSE 0 END) AS core_tier,
                SUM(CASE WHEN strategy_layer IS NULL THEN 1 ELSE 0 END) AS no_layer,
                COUNT(*) AS total
              FROM squads;"
            echo ""
            echo "→ check if any column already exists for approval governance:"
            run_sql -e "
              SELECT COLUMN_NAME, DATA_TYPE
                FROM information_schema.COLUMNS
               WHERE TABLE_SCHEMA = DATABASE()
                 AND TABLE_NAME = 'squads'
                 AND COLUMN_NAME IN ('is_approved','approved_by','approved_at','status');"

            section "RISK #4: Agent skills 3-source drift"
            # Compare agents.skills JSON length vs agent_skill_assignments count
            run_sql -e "
              SELECT
                COUNT(*) AS total_agents,
                SUM(CASE WHEN skills IS NOT NULL AND JSON_LENGTH(skills) > 0 THEN 1 ELSE 0 END) AS json_filled,
                SUM(CASE WHEN skills IS NULL OR JSON_LENGTH(skills) = 0 THEN 1 ELSE 0 END) AS json_empty
              FROM agents;"
            echo ""
            echo "→ agents in JSON but with NO entry in agent_skill_assignments table:"
            run_sql -e "
              SELECT a.id, a.name, JSON_LENGTH(a.skills) AS json_skills,
                     (SELECT COUNT(*) FROM agent_skill_assignments asa WHERE asa.agentId = a.id) AS asgmt_skills
                FROM agents a
               WHERE JSON_LENGTH(a.skills) > 0
                 AND (SELECT COUNT(*) FROM agent_skill_assignments asa WHERE asa.agentId = a.id) = 0
               LIMIT 20;"
            echo ""
            echo "→ agents with assignments rows that the JSON doesn't reflect:"
            run_sql -e "
              SELECT a.id, a.name, JSON_LENGTH(a.skills) AS json_skills,
                     (SELECT COUNT(*) FROM agent_skill_assignments asa WHERE asa.agentId = a.id) AS asgmt_skills
                FROM agents a
               WHERE (SELECT COUNT(*) FROM agent_skill_assignments asa WHERE asa.agentId = a.id) > 0
                 AND (a.skills IS NULL OR JSON_LENGTH(a.skills) = 0)
               LIMIT 20;"

            section "RISK #5: Squad → agent linkage (JSON vs lead_agent_id FK)"
            # Squads where lead_agent_id doesn't appear in the agents JSON members
            run_sql -e "
              SELECT s.id, s.slug, s.lead_agent_id, JSON_LENGTH(s.agents) AS json_member_count
                FROM squads s
               WHERE s.lead_agent_id IS NOT NULL
                 AND s.is_active = 1
               LIMIT 5;"
            echo ""
            echo "→ squads with NO members JSON but lead_agent_id set:"
            run_sql -e "
              SELECT COUNT(*) AS broken
                FROM squads
               WHERE lead_agent_id IS NOT NULL
                 AND (agents IS NULL OR JSON_LENGTH(agents) = 0);"

            section "RISK #6: Pipeline dual-bus (positioning vs mission_step_progress)"
            run_sql -e "
              SELECT
                (SELECT COUNT(*) FROM mission_step_progress) AS step_progress_rows,
                (SELECT COUNT(*) FROM mission_step_progress WHERE canonical_message IS NOT NULL) AS canonical_filled,
                (SELECT COUNT(*) FROM brands WHERE positioning IS NOT NULL) AS brand_positioning_rows,
                (SELECT COUNT(*) FROM products WHERE positioning IS NOT NULL) AS product_positioning_rows,
                (SELECT COUNT(*) FROM events WHERE positioning IS NOT NULL) AS event_positioning_rows;"

            section "RISK #7: Award framework JOIN — case names without framework match"
            run_sql -e "
              SELECT cc.award_name, COUNT(*) AS n_cases
                FROM creative_cases cc
                LEFT JOIN award_frameworks af
                  ON cc.award_name LIKE CONCAT('%', SUBSTRING_INDEX(af.name, ' (', 1), '%')
               WHERE af.id IS NULL
               GROUP BY cc.award_name
               ORDER BY n_cases DESC
               LIMIT 10;"
            echo ""
            echo "→ frameworks with ZERO cases (RAG injection will be empty for these):"
            run_sql -e "
              SELECT af.name, af.category
                FROM award_frameworks af
                LEFT JOIN creative_cases cc
                  ON cc.award_name LIKE CONCAT('%', SUBSTRING_INDEX(af.name, ' (', 1), '%')
               WHERE cc.id IS NULL;"

            section "RISK #8: mediaModels vs mediaGen — drift detection"
            echo "(client mediaModels.ts model IDs to cross-check against server dispatchGenerate switch)"
            grep -E '^\s+id: "' client/src/v2/lib/mediaModels.ts | sed 's/.*id: //;s/,$//' | sort > /tmp/client_models.txt 2>&1
            grep -E 'case "[a-z\-]+/' server/_core/mediaGen.ts | sed 's/.*case //;s/:.*//' | sort > /tmp/server_models.txt 2>&1
            echo "client models:"; wc -l /tmp/client_models.txt
            echo "server case branches:"; wc -l /tmp/server_models.txt
            echo "in client but missing in server (would 400):"
            comm -23 /tmp/client_models.txt /tmp/server_models.txt
            echo "in server but not in client registry (orphan):"
            comm -13 /tmp/client_models.txt /tmp/server_models.txt

            section "RISK #9: Asset URL vs filesystem"
            COVERS=${COVERS_DIR:-/opt/marketing-os/covers}
            echo "files on disk:"; ls "$COVERS" 2>&1 | wc -l
            echo "(no DB-vs-filesystem cross check yet — needs a script to walk positioning JSON _assets)"

            section "RISK #10: Scope state — already unified via useScopeState (frontend only, not in DB)"
            echo "(skipped — no DB risk)"

            section "RISK #11: Product / Event direct query — count vs scope.options"
            run_sql -e "
              SELECT 'products' AS t, COUNT(*) AS n FROM products
              UNION ALL SELECT 'events', COUNT(*) FROM events;"

            section "RISK #12: Duplicate brand names (Pokemon GO etc)"
            run_sql -e "
              SELECT name, COUNT(*) AS n, GROUP_CONCAT(id ORDER BY id) AS ids
                FROM brands
               GROUP BY name
              HAVING COUNT(*) > 1
               ORDER BY n DESC
               LIMIT 20;"

            echo ""
            echo "===== Audit complete ====="
