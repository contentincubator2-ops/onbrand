name: Admin — Set Perplexity LLM env

# One-shot: write PERPLEXITY_API_KEY to VM .env, then restart PM2.
# Used by brandIntel.feedAuto for web-grounded auto intel.
# Key is passed as masked workflow input — never stored in git.

on:
  workflow_dispatch:
    inputs:
      perplexityApiKey:
        description: 'Perplexity API key (will be masked)'
        required: true
        type: string

jobs:
  set-env:
    runs-on: ubuntu-latest
    steps:
      - name: Mask API key in logs
        run: echo "::add-mask::${{ inputs.perplexityApiKey }}"

      - uses: appleboy/ssh-action@v1.0.3
        env:
          PPLX_KEY: ${{ inputs.perplexityApiKey }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          envs: PPLX_KEY
          script: |
            set -e
            ENV_FILE=/opt/marketing-os/app/skills/ai-talent/.env
            test -f "$ENV_FILE" || { echo ".env not found"; exit 1; }
            cp "$ENV_FILE" "$ENV_FILE.bak.$(date +%Y%m%d%H%M)" 2>/dev/null || true

            upsert() {
              local key="$1" val="$2"
              if grep -q "^${key}=" "$ENV_FILE"; then
                sed -i "s|^${key}=.*|${key}=${val}|" "$ENV_FILE"
                echo "updated ${key}"
              else
                echo "${key}=${val}" >> "$ENV_FILE"
                echo "added ${key}"
              fi
            }

            upsert PERPLEXITY_API_KEY "$PPLX_KEY"

            echo ""
            echo "===== Verification ====="
            grep -E '^(PERPLEXITY_API_KEY)=' "$ENV_FILE" \
              | sed -E 's/(PERPLEXITY_API_KEY=).{8,}/\1***REDACTED***/'

            echo ""
            echo "===== Live probe: Perplexity /chat/completions ====="
            set -a; source "$ENV_FILE"; set +a
            curl -sS -w "\nHTTP %{http_code}\n" \
              -H "authorization: Bearer $PERPLEXITY_API_KEY" \
              -H "content-type: application/json" \
              -d '{"model":"sonar-pro","messages":[{"role":"user","content":"ping"}],"max_tokens":10}' \
              https://api.perplexity.ai/chat/completions | head -30

            echo ""
            echo "===== Restart PM2 ====="
            pm2 restart marketing-os --update-env 2>&1 | tail -10 || true
            sleep 2
            pm2 status | head -10
            echo "Done."
