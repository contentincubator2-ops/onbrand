name: Admin — Finish final 3 agents (60035 60036 60038)

# These 3 agents have workingPrinciples + experienceDetail both filled but
# other fields are too short so they plateau at 1951. Bump them by filling
# specialtySummary (~400 chars) which puts each over 2300.

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 300s
          script: |
            set -e
            cd /opt/marketing-os/app/skills/ai-talent
            set -a; . ./.env; set +a
            export MYSQL_PWD="mos_secure_2026"

            python3 - <<'PYEOF'
            import os, json, subprocess, urllib.request, time
            KEY = os.environ["ANTHROPIC_API_KEY"]
            TARGETS = [60035, 60036, 60038]

            def mysql(sql):
                env = os.environ.copy(); env["MYSQL_PWD"]="mos_secure_2026"
                r = subprocess.run(["mysql","-h","localhost","-u","mos_user","mos_db",
                    "--batch","--skip-column-names","--default-character-set=utf8mb4","-e",sql],
                    capture_output=True, text=True, env=env, timeout=20)
                if r.returncode != 0: raise RuntimeError(r.stderr)
                return r.stdout

            def call(prompt):
                body = json.dumps({"model":"claude-haiku-4-5","max_tokens":600,
                    "messages":[{"role":"user","content":prompt}]}).encode()
                req = urllib.request.Request("https://api.anthropic.com/v1/messages", data=body,
                    headers={"x-api-key":KEY,"anthropic-version":"2023-06-01","content-type":"application/json"},
                    method="POST")
                return json.loads(urllib.request.urlopen(req,timeout=60).read())["content"][0]["text"].strip()

            for aid in TARGETS:
                row = mysql(f"SELECT IFNULL(name,''), IFNULL(title,''), IFNULL(LEFT(bio,400),''), IFNULL(LEFT(specialty,500),'') FROM agents WHERE id={aid}").strip().split("\t")
                if len(row) < 4: print(f"  skip {aid}: row malformed"); continue
                name, title, bio, spec = row[0], row[1], row[2], row[3]
                prompt = (f"Write a specialtySummary (Traditional Chinese, 350-450 字) for:\n"
                          f"- Name: {name}\n- Title: {title}\n- Bio: {bio}\n- Specialty: {spec}\n\n"
                          "Tight executive summary of what they uniquely bring. Niche + edge + signature method. No clichés. Output ONLY the summary text.")
                txt = call(prompt)
                safe = txt.replace("\\","\\\\").replace("'","''")
                mysql(f"UPDATE agents SET specialtySummary='{safe}' WHERE id={aid}")
                print(f"  OK {aid} {name}: +{len(txt)} chars specialtySummary")
                time.sleep(0.3)
            PYEOF

            echo
            echo "── Final audit ─────"
            export AGENT_IDS=$(grep -ohE 'agent_id:\s*[0-9]+' server/_core/quickTask*.ts | awk '{print $2}' | sort -u | paste -sd,)
            mysql -h localhost -u mos_user mos_db -t --default-character-set=utf8mb4 -e "
              SELECT
                COUNT(*) AS total,
                SUM(CASE WHEN tc >= 2000 THEN 1 ELSE 0 END) AS aplus,
                SUM(CASE WHEN tc <  2000 THEN 1 ELSE 0 END) AS sub_aplus,
                MIN(tc) AS min_chars
              FROM (
                SELECT id,
                  (CHAR_LENGTH(IFNULL(bio,''))+CHAR_LENGTH(IFNULL(specialty,''))
                  +CHAR_LENGTH(IFNULL(methodology,''))+CHAR_LENGTH(IFNULL(taskSystemPrompt,''))
                  +CHAR_LENGTH(IFNULL(experienceDetail,''))+CHAR_LENGTH(IFNULL(workingPrinciples,''))
                  +CHAR_LENGTH(IFNULL(specialtySummary,''))+CHAR_LENGTH(IFNULL(tool_instructions,''))
                  +CHAR_LENGTH(IFNULL(bio_zh,''))) AS tc
                FROM agents WHERE id IN ($AGENT_IDS)
              ) x;
            "
