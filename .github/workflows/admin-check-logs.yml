name: Admin — Check PM2 logs

on:
  workflow_dispatch:

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 30s
          script: |
            echo "===== PM2 status ====="
            pm2 list

            echo ""
            echo "===== PM2 error log (last 60 lines) ====="
            pm2 logs marketing-os --err --nostream --lines 60 2>/dev/null || \
              cat ~/.pm2/logs/marketing-os-error.log 2>/dev/null | tail -60

            echo ""
            echo "===== PM2 out log (last 20 lines) ====="
            pm2 logs marketing-os --out --nostream --lines 20 2>/dev/null || \
              cat ~/.pm2/logs/marketing-os-out.log 2>/dev/null | tail -20

            echo ""
            echo "===== tsx available? ====="
            ls /opt/marketing-os/app/skills/ai-talent/node_modules/.bin/tsx 2>/dev/null && echo "tsx OK" || echo "tsx NOT FOUND"

            echo ""
            echo "===== .env exists? ====="
            ls -la /opt/marketing-os/app/skills/ai-talent/.env 2>/dev/null || echo "NO .env"
