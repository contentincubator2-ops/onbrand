name: "Ops (DEV) — probe gpt-image-2 image edit with a real product photo"

# 2026-09-21 (CJ「直接用 chatgpt image 2 的 model 應該就可以了，你試試看」).
#
# 我們所有呼叫 OpenAI 的地方都是 /v1/images/generations（純文字），不能帶產品照片；
# 帶真實產品照的生圖一律走 Nano Banana。ChatGPT 那張自然的圖是「產品照片＋提示詞」
# 一起送進圖片編輯端點的結果。這裡用 DEV VM 上的金鑰、同一張產品照片，實際打
# /v1/images/edits，看 gpt-image-2 的結果跟 ChatGPT 網頁版差多少。
#
# 只在 DEV VM 跑（environment: dev）。不寫任何 .env、不動應用程式資料；只在 /tmp/probe
# 產生檔案，跑完拉回 artifact 並刪除。金鑰只在 VM 上讀取，不印出。
#
# 用法（這個 repo 的 dev 探測慣例：改這個檔案再 push，就會觸發）：
#   PROBE_MODE=list  → 把最近上傳的 30 張產品／品牌照片縮圖拉回來，用來認出要用哪一張
#   PROBE_MODE=angles → 在 dev VM 用真實模型跑 fb-30-caption-short，印出三個版本全文（驗證版本名稱與內文切角對得上）
#   PROBE_MODE=diagnose → 比對「GitHub secret 的 key」與「dev VM .env 的 key」的指紋（不印 key），各打一次最小生圖呼叫，並列出 dev 最近的生圖失敗與點數
#   PROBE_MODE=edit  → 用 PROBE_PHOTO 跑兩個變體（自然提示詞對照 vs 上線用的 PRODUCT_FAITHFUL 提示詞），把結果圖拉回來
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/op-probe-dev-image-edit.yml'

jobs:
  probe:
    runs-on: ubuntu-24.04
    environment: dev
    timeout-minutes: 20
    env:
      PROBE_MODE: angles
      PROBE_PHOTO: "/opt/onbrand/shared/storage/asset-photos/product/261/1789987951094-5w8aw5.webp"
      SSH_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
      PROBE_OPENAI_KEY: ${{ secrets.OPEN_API_KEY }}
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
    steps:
      - name: Write the remote script
        run: |
          cat > remote.sh <<'EOS'
          set -u
          AI=/opt/onbrand/current/skills/ai-talent
          STORE=/opt/onbrand/shared/storage/asset-photos
          rm -rf /tmp/probe; mkdir -p /tmp/probe/thumbs /tmp/probe/out
          cd "$AI"
          envval() { grep -m1 "^$1=" .env | cut -d= -f2- | sed 's/^"//; s/"$//' | sed "s/^'//; s/'$//"; }
          SECRET_KEY="${KEY:-}"; VM_KEY="$(envval OPENAI_API_KEY)"
          if [ -n "${KEY:-}" ]; then echo "openai key source: GitHub secret OPEN_API_KEY"; else export KEY="$(envval OPENAI_API_KEY)"; echo "openai key source: VM .env"; fi
          echo "host=$(hostname)  node=$(node -v)  app=$(readlink -f /opt/onbrand/current)"
          echo "IMAGE_GEN_MODEL_OPENAI=$(envval IMAGE_GEN_MODEL_OPENAI)  IMAGE_GEN_PROVIDER_PRIMARY=$(envval IMAGE_GEN_PROVIDER_PRIMARY)"
          [ -z "$KEY" ] && echo "OPENAI_API_KEY missing on the dev VM"

          if [ "$MODE" = "disk" ]; then
            echo "--- df ---"; df -h / /opt /tmp 2>&1 | head -8
            echo "--- inodes ---"; df -i / 2>&1 | tail -2
            echo "--- /opt/onbrand top-level sizes ---"; du -sh /opt/onbrand/* 2>/dev/null | sort -rh | head -12
            echo "--- releases (newest first): size + name ---"
            ls -1dt /opt/onbrand/releases/* 2>/dev/null | head -40 | while read d; do echo "$(du -sh "$d" 2>/dev/null | cut -f1)  $(basename "$d")  $( [ "$(readlink -f /opt/onbrand/current)" = "$d" ] && echo '<= CURRENT')"; done
            echo "release count: $(ls -1d /opt/onbrand/releases/* 2>/dev/null | wc -l)"
            echo "--- other big dirs ---"; du -sh /var/log /var/lib/docker /home /root /var/cache /tmp 2>/dev/null | sort -rh | head -8
            echo "--- pm2 logs ---"; du -sh ~/.pm2/logs 2>/dev/null
            exit 0
          fi

          if [ "$MODE" = "angles" ]; then
            echo "--- 情感版／理性版／數據版：真實模型跑兩次 fb-30-caption-short（第二次素材有價格與時數，看數字有沒有被編）---"
            cd "$AI" && ./node_modules/.bin/tsx scripts/probe-variant-angles.ts 2>&1 | tail -60
            echo; echo "=========== 第二次：換一組有價格的素材 ==========="
            TASK_INPUT='洛蒙德湖系列 No. 01：空間噴霧 100ml 售價 NT$1,280；擴香 200ml 售價 NT$1,680；香氛蠟燭 180g 燃燒約 40 小時，售價 NT$980。' ./node_modules/.bin/tsx scripts/probe-variant-angles.ts 2>&1 | tail -40
            exit 0
          fi

          if [ "$MODE" = "diagnose" ]; then
            cat > /tmp/probe/diag.js <<'JS'
          const crypto = require("crypto");
          const cp = require("child_process");
          const fp = (k) => k ? { len: k.length, prefix: k.slice(0, 7), sha8: crypto.createHash("sha256").update(k).digest("hex").slice(0, 8) } : null;
          const redact = (t) => String(t).replace(/sk-[A-Za-z0-9_*\-]{6,}/g, "[key]");
          const secret = process.env.SECRET_KEY || "", vm = process.env.VM_KEY || "";
          console.log("GitHub secret OPEN_API_KEY :", JSON.stringify(fp(secret)));
          console.log("dev VM .env OPENAI_API_KEY :", JSON.stringify(fp(vm)));
          console.log("same key?", secret && vm ? secret === vm : "n/a");
          try {
            const j = JSON.parse(cp.execSync("pm2 jlist", { encoding: "utf8", maxBuffer: 64e6 }));
            for (const p of j) {
              const e = p.pm2_env || {};
              if (/onbrand/.test(p.name)) console.log("pm2", p.name, "status=" + e.status, "restarts=" + e.restart_time, "uptimeStart=" + new Date(e.pm_uptime || 0).toISOString(), "OPENAI_API_KEY=" + JSON.stringify(fp(e.OPENAI_API_KEY || "")), "IMAGE_GEN_MODEL_OPENAI=" + (e.IMAGE_GEN_MODEL_OPENAI || null));
            }
          } catch (e) { console.log("pm2 read failed:", redact(e.message).slice(0, 120)); }
          async function tryKey(name, key) {
            if (!key) { console.log(name, "-> no key"); return; }
            const t0 = Date.now();
            try {
              const r = await fetch("https://api.openai.com/v1/images/generations", {
                method: "POST", headers: { Authorization: "Bearer " + key, "Content-Type": "application/json" },
                body: JSON.stringify({ model: "gpt-image-2", prompt: "a plain white square", size: "1024x1024", quality: "low", n: 1 }),
                signal: AbortSignal.timeout(90000),
              });
              const b = await r.json().catch(() => ({}));
              const ok = b && b.data && b.data[0] && b.data[0].b64_json;
              console.log(name, "-> HTTP", r.status, ok ? "IMAGE OK" : "", b.error ? ("code=" + b.error.code + " type=" + b.error.type + " msg=" + redact(b.error.message).slice(0, 220)) : "", (Date.now() - t0) + "ms");
            } catch (e) { console.log(name, "-> FAILED", redact(e.message).slice(0, 120)); }
          }
          (async () => {
            await tryKey("call with GitHub-secret key", secret);
            if (vm && vm !== secret) await tryKey("call with dev-VM .env key ", vm);
            try {
              const mysql = require("/opt/onbrand/current/skills/ai-talent/node_modules/mysql2/promise");
              const c = await mysql.createConnection({ host: process.env.DB_HOST || "localhost", port: +(process.env.DB_PORT || 3306), user: process.env.DB_USER || "mos_user", password: process.env.DB_PASS, database: process.env.DB_NAME || "mos_db" });
              const [rows] = await c.execute("SELECT id, provider, model, status, LEFT(errorMsg, 200) AS err FROM generated_images ORDER BY id DESC LIMIT 8");
              console.log("--- latest generated_images ---");
              for (const r of rows) console.log(r.id, r.provider, r.model, r.status, redact(r.err || ""));
              try {
                const [u] = await c.execute("SELECT id, planCode, pointsBalance FROM users ORDER BY id DESC LIMIT 6");
                console.log("--- users (id, plan, points) ---");
                for (const r of u) console.log(r.id, r.planCode, r.pointsBalance);
              } catch (e) { console.log("users query failed:", redact(e.message).slice(0, 100)); }
              await c.end();
            } catch (e) { console.log("db read failed:", redact(e.message).slice(0, 140)); }
          })();
          JS
            DB_HOST="$(envval LOCAL_DB_HOST)" DB_PORT="$(envval LOCAL_DB_PORT)" DB_USER="$(envval LOCAL_DB_USER)" DB_PASS="$(envval LOCAL_DB_PASSWORD)" DB_NAME="$(envval LOCAL_DB_NAME)" SECRET_KEY="$SECRET_KEY" VM_KEY="$VM_KEY" node /tmp/probe/diag.js
            echo "--- recent app log lines about images (dev pm2) ---"
            pm2 logs --nostream --lines 500 2>&1 | grep -iE "genOneImage|OpenAI|quota|insufficient|generateImage|image.generate" | sed -E 's/sk-[A-Za-z0-9_*-]{6,}/[key]/g' | tail -14
            exit 0
          fi

          if [ "$MODE" = "list" ]; then
            find "$STORE" -type f -printf '%T@ %s %p\n' 2>/dev/null | sort -nr | head -30 > /tmp/probe/manifest.txt
            echo "--- newest uploaded photos (n, size, path) ---"
            awk '{printf "%02d  %9d  %s\n", NR-1, $2, $3}' /tmp/probe/manifest.txt
            cat > /tmp/probe/thumbs.js <<'JS'
          const sharp = require("/opt/onbrand/current/skills/ai-talent/node_modules/sharp");
          const fs = require("fs");
          (async () => {
            const lines = fs.readFileSync("/tmp/probe/manifest.txt", "utf8").trim().split("\n");
            for (let i = 0; i < lines.length; i++) {
              const p = lines[i].split(" ").slice(2).join(" ");
              try {
                await sharp(p).rotate().resize(260, 260, { fit: "inside" }).jpeg({ quality: 70 })
                  .toFile("/tmp/probe/thumbs/" + String(i).padStart(2, "0") + ".jpg");
              } catch (e) { console.log("thumb failed", i, String(e.message).slice(0, 80)); }
            }
          })();
          JS
            node /tmp/probe/thumbs.js
            exit 0
          fi

          echo "photo: $PHOTO"
          test -f "$PHOTO" || { echo "photo not found"; exit 0; }
          cat > /tmp/probe/edit.js <<'JS'
          const sharp = require("/opt/onbrand/current/skills/ai-talent/node_modules/sharp");
          const fs = require("fs");
          const PHOTO = process.env.PHOTO;
          const KEY = process.env.KEY || "";
          const PROMPT =
            "Place this exact perfume bottle on a mossy rock at the edge of Loch Lomond in Scotland, " +
            "late morning sunlight, calm lake and green mountains in the background, purple heather in the foreground. " +
            "Photorealistic commercial product photography with natural lighting, realistic reflections, and light refracting " +
            "through the glass. Keep the bottle exactly as in the photo: the cut-glass pattern, the round wooden cap, " +
            "and the label text and layout must not change.";
          const FAITHFUL = "PRODUCT REFERENCE OVERRIDES ALL CONFLICTING TEXT \u2014 the attached reference image is the sole source of truth for the product or garment. If any scene text conflicts with the reference image about the product, clothing, color, style, cut, shape, proportions, material, pattern, details, label, or logo, ignore that conflicting text and follow the reference image. Use scene text only for the environment, lighting, composition, pose, and atmosphere; never replace the referenced product or garment with one described by the scene. PRODUCT FIDELITY \u2014 the attached image is the REAL product; this is the most important rule: reproduce the product EXACTLY as shown \u2014 identical shape, proportions, materials, colors, and every printed label, logo and text on the product itself must remain letter-perfect and unaltered. Do NOT redraw, restyle, re-color or re-label the product. Place it naturally into the scene: lighting direction consistent with the environment, correct perspective and scale, realistic contact shadows and reflections \u2014 it must look photographed in place, never pasted on. TEXT \u2014 closed rule: the ONLY characters allowed anywhere in the output are the ones already visibly printed on the attached product photo, copied pixel-for-pixel. Do not invent, extend, translate, re-letter or repeat them. Do NOT render or repeat the brand name anywhere except where it is already printed on the product itself. Do not add a watermark (including large translucent or tiled brand marks), signage, captions, badges, stickers or any Chinese / Japanese / Korean characters elsewhere in the frame \u2014 not on the background, surfaces, props, or as an overlay. If the attached photo itself carries a watermark, leave it out. Every surface other than the product is blank.";
          const MIRROR = "Do NOT include a mirror, reflective surface, reflection, or any shot composed as \"person looking at their own reflection\" \u2014 reflections never stay physically consistent with the subject's actual pose/hair/head angle. Show the subject directly instead.";
          const SCENE = "Place the perfume bottle on a mossy rock at the edge of Loch Lomond in Scotland, late morning sunlight, calm lake and green mountains in the background, purple heather in the foreground.";
          // The exact text imageGen.buildPrompt() sends when a product photo is attached (no brand context).
          const FAITHFUL_PROMPT = [
            FAITHFUL, "",
            "Scene (environment, lighting, composition, pose, and atmosphere only):", SCENE, "",
            MIRROR, "",
            "Rendering: editorial product photography, natural light, realistic contact shadows, clean composition, no watermarks.",
          ].join("\n");
          console.log("openai key present: " + (KEY.length > 0));
          const VARIANTS = [
            { id: "A", model: "gpt-image-2", label: "control: natural prompt", prompt: PROMPT, extra: {} },
            { id: "F", model: "gpt-image-2", label: "production prompt (PRODUCT_FAITHFUL block + scene)", prompt: FAITHFUL_PROMPT, extra: {} },
          ];
          (async () => {
            const input = await sharp(PHOTO).rotate().resize(2048, 2048, { fit: "inside", withoutEnlargement: true }).png().toBuffer();
            fs.writeFileSync("/tmp/probe/out/input.png", input);
            const meta = await sharp(input).metadata();
            console.log("input " + meta.width + "x" + meta.height + " " + input.length + " bytes");
            for (const v of VARIANTS) {
              const t0 = Date.now();
              try {
                const form = new FormData();
                form.append("model", v.model);
                form.append("prompt", v.prompt);
                form.append("size", "1536x1024");
                form.append("n", "1");
                for (const [k, val] of Object.entries(v.extra)) form.append(k, val);
                form.append("image[]", new Blob([input], { type: "image/png" }), "product.png");
                const res = await fetch("https://api.openai.com/v1/images/edits", {
                  method: "POST", headers: { Authorization: "Bearer " + KEY }, body: form,
                  signal: AbortSignal.timeout(170000),
                });
                const ms = Date.now() - t0;
                const body = await res.json().catch(() => ({}));
                const b64 = body && body.data && body.data[0] && body.data[0].b64_json;
                if (b64) {
                  fs.writeFileSync("/tmp/probe/out/" + v.id + ".png", Buffer.from(b64, "base64"));
                  console.log(v.id + " " + v.label + "  HTTP " + res.status + "  " + ms + "ms  IMAGE OK  usage=" + JSON.stringify(body.usage || null));
                } else {
                  const msg = (body && body.error && body.error.message) || JSON.stringify(body).slice(0, 200);
                  console.log(v.id + " " + v.label + "  HTTP " + res.status + "  " + ms + "ms  ERROR — " + String(msg).slice(0, 260));
                }
              } catch (e) {
                console.log(v.id + " " + v.label + "  FAILED after " + (Date.now() - t0) + "ms — " + String(e.message).slice(0, 160));
              }
            }
          })();
          JS
            node /tmp/probe/edit.js
          EOS

      - name: Run on the DEV VM and pull results back
        run: |
          set -u
          mkdir -p ~/.ssh out
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          SSH_OPTS="-i $HOME/.ssh/id -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR"
          {
            if [ -n "$PROBE_OPENAI_KEY" ]; then printf 'export KEY=%q\n' "$PROBE_OPENAI_KEY"; fi
            cat remote.sh
          } | ssh $SSH_OPTS "$VM_USER@$VM_HOST" "MODE='$PROBE_MODE' PHOTO='$PROBE_PHOTO' bash -s" | tee out/log.txt
          scp -r $SSH_OPTS "$VM_USER@$VM_HOST:/tmp/probe/." out/ || true
          ssh $SSH_OPTS "$VM_USER@$VM_HOST" 'rm -rf /tmp/probe' || true
          ls -la out out/thumbs out/out 2>/dev/null | head -60

      - uses: actions/upload-artifact@v4
        with:
          name: probe-${{ github.run_id }}
          path: out
          retention-days: 3
