name: Admin — Expand Dunford to 10 Steps

on:
  workflow_dispatch:

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -e
            MOS_USER="mos_user"
            MOS_PASS="mos_secure_2026"
            MOS_DB="mos_db"

            echo "=== Backup current Dunford steps ==="
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -N -e "
              SELECT steps FROM squad_workflow_templates WHERE taskType = 'brand-dunford-positioning';
            " > /tmp/dunford_backup_$(date +%s).json
            echo "Backup saved"

            echo ""
            echo "=== Write new 10-step definition ==="
            cat > /tmp/dunford_10steps.json << 'JSONEOF'
            [
              {"order":1,"name":"理解熱愛你產品的客戶 (Understand Product Lovers)","description":"深度訪談 5-8 位最愛這產品的客戶，找出他們真正選擇的原因 — 這些是定位的真實錨點。","tool":"internal","outputType":"customer_love_insights","requiredSkills":["brand-dna","market-research-agent"],"assignedAgentId":26,"assignedAgentSlug":"pm-meta-ads-expert","assignedAgentName":"吳佳穎"},
              {"order":2,"name":"組建定位團隊 (Form Positioning Team)","description":"組建跨部門定位團隊（Product、Marketing、Sales、CS），確保多元觀點融合、避免行銷部門孤立決策。","tool":"internal","outputType":"positioning_team_roster","requiredSkills":["mbb-strategist","brand-dna"],"assignedAgentId":25,"assignedAgentSlug":"pm-seo-ecommerce","assignedAgentName":"李承翰"},
              {"order":3,"name":"對齊願景、揭露偏見 (Align Vision & Bias Out)","description":"與團隊對齊品牌願景，揭露內部偏見（如『我們是更便宜的 X』），清空既定認知以便重新定位。","tool":"internal","outputType":"vision_bias_audit","requiredSkills":["mbb-strategist","brand-dna"],"assignedAgentId":25,"assignedAgentSlug":"pm-seo-ecommerce","assignedAgentName":"李承翰"},
              {"order":4,"name":"盤點競爭替代選項 (Competitive Alternatives Audit)","description":"找出客戶在沒有你產品時會用什麼 — 這些是真實競爭替代品（含人工執行、Excel、其他工具），不只是同類產品。","tool":"internal","outputType":"competitive_audit","requiredSkills":["brand-dna","mbb-strategist"],"assignedAgentId":25,"assignedAgentSlug":"pm-seo-ecommerce","assignedAgentName":"李承翰"},
              {"order":5,"name":"識別獨特屬性 (Isolate Unique Attributes)","description":"列出真正獨特的屬性（不是功能）。這些屬性必須是競爭替代品缺乏、且為客戶在意的能力。","tool":"internal","outputType":"unique_attributes","requiredSkills":["market-research-agent","marketing-analytics"],"assignedAgentId":26,"assignedAgentSlug":"pm-meta-ads-expert","assignedAgentName":"吳佳穎"},
              {"order":6,"name":"映射屬性到顧客價值 (Map Attributes to Value)","description":"將每個獨特屬性映射到可驗證的客戶價值，並指出這個價值對誰最重要（who cares）。","tool":"internal","outputType":"value_mapping","requiredSkills":["market-research-agent","marketing-analytics"],"assignedAgentId":26,"assignedAgentSlug":"pm-meta-ads-expert","assignedAgentName":"吳佳穎"},
              {"order":7,"name":"定義最佳契合客戶 (Find Best-Fit Customers)","description":"精確刻畫最佳契合客戶的特徵（ICP），使他們一眼就能認出你是為他們而設計。用 MEDDIC 或類似框架驗證。","tool":"internal","outputType":"ideal_customer_profile","requiredSkills":["market-research-agent","brand-dna"],"assignedAgentId":26,"assignedAgentSlug":"pm-meta-ads-expert","assignedAgentName":"吳佳穎"},
              {"order":8,"name":"釘牢市場分類 (Nail Market Category)","description":"選擇最能凸顯價值的市場分類（避免紅海分類陷阱，必要時創造新品類）。分類決定客戶如何理解你。","tool":"internal","outputType":"market_category","requiredSkills":["copywriting-pro","hook-copywriter"],"assignedAgentId":29,"assignedAgentSlug":"pm-pr-saas","assignedAgentName":"蘇雅玲"},
              {"order":9,"name":"疊加趨勢加分 (Layer on a Trend)","description":"疊加相關的宏觀趨勢（例如 AI 浪潮、遠端工作、永續），讓定位乘風而起。可選但強化訊息共鳴。","tool":"internal","outputType":"trend_overlay","requiredSkills":["content-marketing","social-media-marketing"],"assignedAgentId":32,"assignedAgentSlug":"exec-copywriter-senior","assignedAgentName":"許雅芳"},
              {"order":10,"name":"定位宣言 + 組織固化 (Positioning Statement & Capture)","description":"撰寫精準定位宣言（For/Who/Is/That/Unlike/Our Product），並制定視覺識別、Sales Enablement、內容策略，讓全組織一致表達。","tool":"internal","outputType":"positioning_statement_and_gtm","requiredSkills":["copywriting-pro","brand-identity","visual-content-creator"],"assignedAgentId":29,"assignedAgentSlug":"pm-pr-saas","assignedAgentName":"蘇雅玲"}
            ]
            JSONEOF

            echo "=== Validate JSON ==="
            python3 -c "import json; d=json.load(open('/tmp/dunford_10steps.json')); print(f'✓ Valid JSON with {len(d)} steps')"

            echo ""
            echo "=== Update mos_db ==="
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
              UPDATE squad_workflow_templates
              SET steps = LOAD_FILE('/tmp/dunford_10steps.json')
              WHERE taskType = 'brand-dunford-positioning';
            " 2>&1 || {
              # LOAD_FILE may fail due to MySQL permissions; use direct SQL instead
              echo "LOAD_FILE failed, using inline UPDATE..."
              STEPS_JSON=$(cat /tmp/dunford_10steps.json | python3 -c "import sys, json; print(json.dumps(json.load(sys.stdin)))")
              mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
                UPDATE squad_workflow_templates
                SET steps = '$STEPS_JSON'
                WHERE taskType = 'brand-dunford-positioning';
              " 2>&1
            }

            echo ""
            echo "=== Verify update ==="
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
              SELECT taskType, JSON_LENGTH(steps) as step_count, name
              FROM squad_workflow_templates WHERE taskType='brand-dunford-positioning';
            " 2>&1
