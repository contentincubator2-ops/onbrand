name: Admin — Classify skills (LLM → task_type + recommended_models)

# Runs scripts/classifySkills.ts on the VM. Uses Azure Foundry gpt-4o-mini
# via AZURE_AI_API_KEY + AZURE_AI_ENDPOINT (already in .env from prior
# admin-set-azure-foundry-env runs).
#
# Modes:
#   sample=true       → 5 skills, dry-run, prints to stdout (no DB write)
#   reclassify=true   → also re-process skills that already have classified_at
#   limit=NUMBER      → only the first N unclassified skills

on:
  workflow_dispatch:
    inputs:
      sample:
        description: 'Type "true" for 5-skill dry-run preview'
        required: false
        default: 'false'
      limit:
        description: 'Limit (blank = all unclassified)'
        required: false
      batch:
        description: 'Skills per LLM call (default 25, max 50)'
        required: false
        default: '25'
      reclassify:
        description: 'Type "true" to also re-classify already-classified rows'
        required: false
        default: 'false'

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - name: Run on VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SAMPLE: ${{ github.event.inputs.sample }}
          LIMIT:  ${{ github.event.inputs.limit }}
          BATCH:  ${{ github.event.inputs.batch }}
          RECLS:  ${{ github.event.inputs.reclassify }}
          AZURE_AI_API_KEY:  ${{ secrets.AZURE_AI_API_KEY }}
          AZURE_AI_ENDPOINT: ${{ secrets.AZURE_AI_ENDPOINT }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 1800s
          envs: GH_TOKEN,SAMPLE,LIMIT,BATCH,RECLS,AZURE_AI_API_KEY,AZURE_AI_ENDPOINT
          script: |
            set -e
            APP=/opt/marketing-os/app
            cd "$APP"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/contentincubator2-ops/Marketing-OS.git"
            git fetch origin main && git reset --hard origin/main

            ENV_FILE=$APP/skills/ai-talent/.env
            set -a; source "$ENV_FILE"; set +a
            cd $APP/skills/ai-talent

            ARGS=""
            [ "$SAMPLE" = "true" ] && ARGS="$ARGS --sample"
            [ -n "$LIMIT" ]        && ARGS="$ARGS --limit=$LIMIT"
            [ -n "$BATCH" ]        && ARGS="$ARGS --batch=$BATCH"
            [ "$RECLS"  = "true" ] && ARGS="$ARGS --reclassify"

            echo "===== tsx scripts/classifySkills.ts $ARGS ====="
            ./node_modules/.bin/tsx scripts/classifySkills.ts $ARGS
