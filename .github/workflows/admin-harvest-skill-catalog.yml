name: Admin — Harvest skill catalog

# Builds skills/ai-talent/data/skill-catalog.json by cloning external
# skill libraries (anthropics/skills, zai-org/GLM-skills,
# VoltAgent/awesome-agent-skills) and parsing built-in tool wrappers
# (fal.ai / tavily / browserbase / meta / cohere / manus).

on:
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 240s
          envs: GH_TOKEN
          script: |
            set -e
            APP=/opt/marketing-os/app
            REPO="https://x-access-token:${GH_TOKEN}@github.com/contentincubator2-ops/Marketing-OS.git"
            cd "$APP"
            git remote set-url origin "$REPO"
            git fetch origin main
            git reset --hard origin/main
            cd "$APP/skills/ai-talent"
            if [ ! -d node_modules ]; then npm install --legacy-peer-deps --no-audit --no-fund 2>&1 | tail -5; fi
            echo "════════════════════════════════════════════════════════════════"
            echo "  📚 Harvest skill catalog"
            echo "════════════════════════════════════════════════════════════════"
            npm run db:harvest-skill-catalog
