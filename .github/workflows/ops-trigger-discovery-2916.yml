name: "Ops — Trigger fresh product discovery for brand 2916"
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: [self-hosted, linux, vm-onbrand]
    timeout-minutes: 5
    steps:
      - name: Insert fresh discovery job
        run: |
          source /opt/onbrand/app/skills/ai-talent/.env 2>/dev/null || true
          H="${LOCAL_DB_HOST:-127.0.0.1}"; U="${LOCAL_DB_USER:-mos_user}"
          P="${LOCAL_DB_PASSWORD:-mos_secure_2026}"; D="${LOCAL_DB_NAME:-mos_db}"
          USERID=$(mysql -h"$H" -u"$U" -p"$P" "$D" -se "SELECT userId FROM brands WHERE id=2916 LIMIT 1;")
          echo "Brand userId: $USERID"
          mysql -h"$H" -u"$U" -p"$P" "$D" -e \
            "INSERT INTO product_discovery_jobs (brandId, userId, websiteUrl, status, phase)
             VALUES (2916, $USERID, 'https://www.laurel.com.tw', 'pending', 'crawl');"
          JOB_ID=$(mysql -h"$H" -u"$U" -p"$P" "$D" -se "SELECT LAST_INSERT_ID();")
          echo "Created job ID: $JOB_ID"
          echo "JOB_ID=$JOB_ID" >> $GITHUB_ENV

      - name: Wait 90s for worker to process
        run: |
          for i in $(seq 1 9); do
            sleep 10
            source /opt/onbrand/app/skills/ai-talent/.env 2>/dev/null || true
            H="${LOCAL_DB_HOST:-127.0.0.1}"; U="${LOCAL_DB_USER:-mos_user}"
            P="${LOCAL_DB_PASSWORD:-mos_secure_2026}"; D="${LOCAL_DB_NAME:-mos_db}"
            STATUS=$(mysql -h"$H" -u"$U" -p"$P" "$D" -se \
              "SELECT CONCAT(status,'/',phase,'/found=',COALESCE(totalFound,0),'/pos=',COALESCE(totalPositioned,0)) FROM product_discovery_jobs WHERE id=$JOB_ID;")
            echo "[$((i*10))s] job $JOB_ID: $STATUS"
            if echo "$STATUS" | grep -qE "^done|^failed"; then break; fi
          done

      - name: Final result
        run: |
          source /opt/onbrand/app/skills/ai-talent/.env 2>/dev/null || true
          H="${LOCAL_DB_HOST:-127.0.0.1}"; U="${LOCAL_DB_USER:-mos_user}"
          P="${LOCAL_DB_PASSWORD:-mos_secure_2026}"; D="${LOCAL_DB_NAME:-mos_db}"
          echo "=== Job result ==="
          mysql -h"$H" -u"$U" -p"$P" "$D" -e \
            "SELECT id, status, phase, totalFound, totalPositioned, LEFT(errorLog,800) AS errors FROM product_discovery_jobs WHERE id=$JOB_ID;"
          echo "=== Products in DB ==="
          mysql -h"$H" -u"$U" -p"$P" "$D" -e \
            "SELECT id, name FROM products WHERE brandId=2916 ORDER BY createdAt DESC LIMIT 20;"
