name: Admin — Phase-7 model fit (④ model mismatch)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false

jobs:
  phase7:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 1800s
          envs: GH_TOKEN,DRY_RUN
          script: |
            set -e
            APP=/opt/marketing-os/app
            REPO="https://x-access-token:${GH_TOKEN}@github.com/contentincubator2-ops/Marketing-OS.git"
            cd "$APP"
            git remote set-url origin "$REPO"
            git fetch origin main
            git reset --hard origin/main
            cd "$APP/skills/ai-talent"
            DRY=""
            if [ "$DRY_RUN" = "true" ]; then DRY="--dry-run"; fi
            echo "════ Phase-7 model fit ════"
            npx tsx scripts/phase7-model-fit.ts $DRY
            echo ""
            echo "════ Final 6-axis verify ════"
            npx tsx scripts/audit-full-coverage-verification.ts
