name: Admin — Dump mos_db (for local dev)

# Exports a mysqldump of mos_db from the VM as a workflow artifact.
# Safe: read-only on the VM. The artifact is downloadable for 7 days
# and only by repo members. Tenant data is included — do NOT run this
# on untrusted machines.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DUMP to confirm (production data will be exported)'
        required: true
        type: string

jobs:
  dump:
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm == 'DUMP' }}
    steps:
      - name: SSH & mysqldump to /tmp
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 300s
          script: |
            set -e
            TS=$(date -u +%Y%m%dT%H%M%SZ)
            OUT=/tmp/mos_db_${TS}.sql.gz
            echo "[dump] writing to ${OUT}"
            # Read creds from the app's .env
            cd /home/azureuser/marketing-os
            DB_USER=$(grep -E '^LOCAL_DB_USER=' skills/ai-talent/.env | cut -d= -f2- | tr -d '"')
            DB_PASS=$(grep -E '^LOCAL_DB_PASSWORD=' skills/ai-talent/.env | cut -d= -f2- | tr -d '"')
            DB_NAME=$(grep -E '^LOCAL_DB_NAME=' skills/ai-talent/.env | cut -d= -f2- | tr -d '"')
            DB_USER=${DB_USER:-mos_user}
            DB_NAME=${DB_NAME:-mos_db}
            # Dump: schema + data, no routines/triggers, single-tx, quick (streams large tables)
            mysqldump \
              --host=127.0.0.1 \
              --user="${DB_USER}" \
              --password="${DB_PASS}" \
              --single-transaction \
              --quick \
              --skip-lock-tables \
              --default-character-set=utf8mb4 \
              --set-gtid-purged=OFF \
              --no-tablespaces \
              --column-statistics=0 \
              "${DB_NAME}" 2>/tmp/mysqldump.err | gzip -9 > "${OUT}"
            ls -lh "${OUT}"
            # Copy to a predictable path for scp-download
            cp "${OUT}" /tmp/mos_db_latest.sql.gz
            echo "[dump] done: /tmp/mos_db_latest.sql.gz"

      - name: SCP dump file back to runner
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          source: "/tmp/mos_db_latest.sql.gz"
          target: "."
          strip_components: 1

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mos_db_dump
          path: tmp/mos_db_latest.sql.gz
          retention-days: 7

      - name: Cleanup dump from VM
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            rm -f /tmp/mos_db_*.sql.gz
            echo "[cleanup] removed dumps from VM"
