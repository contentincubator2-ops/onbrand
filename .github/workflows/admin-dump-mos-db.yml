name: Admin — Dump mos_db (for local dev)

# Exports a mysqldump of mos_db from the VM as a workflow artifact.
# Safe: read-only on the VM. The artifact is downloadable for 7 days
# and only by repo members. Tenant data is included — do NOT run this
# on untrusted machines.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DUMP to confirm (production data will be exported)'
        required: true
        type: string

jobs:
  dump:
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm == 'DUMP' }}
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          echo "[ssh] key ready"

      - name: Probe VM mysqldump options
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" bash <<'ENDSSH'
          set -e
          which mysqldump
          mysqldump --version
          cd /home/azureuser/marketing-os
          echo "--- .env db lines ---"
          grep -E '^(LOCAL_DB_|DB_)' skills/ai-talent/.env | sed 's/=.*/=<redacted>/'
          ENDSSH

      - name: Dump mos_db on VM
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" bash <<'ENDSSH'
          set -e
          cd /home/azureuser/marketing-os
          DB_HOST=$(grep -E '^LOCAL_DB_HOST=' skills/ai-talent/.env | cut -d= -f2- | tr -d '"')
          DB_PORT=$(grep -E '^LOCAL_DB_PORT=' skills/ai-talent/.env | cut -d= -f2- | tr -d '"')
          DB_USER=$(grep -E '^LOCAL_DB_USER=' skills/ai-talent/.env | cut -d= -f2- | tr -d '"')
          DB_PASS=$(grep -E '^LOCAL_DB_PASSWORD=' skills/ai-talent/.env | cut -d= -f2- | tr -d '"')
          DB_NAME=$(grep -E '^LOCAL_DB_NAME=' skills/ai-talent/.env | cut -d= -f2- | tr -d '"')
          DB_HOST=${DB_HOST:-127.0.0.1}
          DB_PORT=${DB_PORT:-3306}
          DB_USER=${DB_USER:-mos_user}
          DB_NAME=${DB_NAME:-mos_db}
          echo "[vm] dumping ${DB_NAME} as ${DB_USER} from ${DB_HOST}:${DB_PORT}"

          # Write dump WITHOUT piping to gzip first, so we can see exit status
          mysqldump \
            --host="${DB_HOST}" \
            --port="${DB_PORT}" \
            --user="${DB_USER}" \
            --password="${DB_PASS}" \
            --single-transaction \
            --quick \
            --skip-lock-tables \
            --default-character-set=utf8mb4 \
            --set-gtid-purged=OFF \
            --no-tablespaces \
            "${DB_NAME}" > /tmp/mos_db_latest.sql 2>/tmp/mysqldump.err
          DUMP_STATUS=$?
          echo "[vm] mysqldump exit=${DUMP_STATUS}"
          if [ -s /tmp/mysqldump.err ]; then
            echo "[vm] stderr from mysqldump:"
            cat /tmp/mysqldump.err
          fi
          ls -lh /tmp/mos_db_latest.sql
          head -20 /tmp/mos_db_latest.sql || true
          gzip -9f /tmp/mos_db_latest.sql
          ls -lh /tmp/mos_db_latest.sql.gz
          echo "[vm] dump done"
          ENDSSH

      - name: SCP dump from VM to runner
        run: |
          mkdir -p dump
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/tmp/mos_db_latest.sql.gz" \
            dump/mos_db_latest.sql.gz
          ls -lh dump/

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mos_db_dump
          path: dump/mos_db_latest.sql.gz
          retention-days: 7

      - name: Cleanup dump from VM
        if: always()
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
            "rm -f /tmp/mos_db_*.sql /tmp/mos_db_*.sql.gz /tmp/mysqldump.err && echo '[vm] cleaned'"
