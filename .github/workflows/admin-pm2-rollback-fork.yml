name: Admin — Rollback onbrand pm2 to fork mode
on: { workflow_dispatch: {} }
jobs:
  rollback:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 5
    steps:
      - name: Diagnose current state
        run: |
          set +e
          pm2 list
          echo "── pm2 describe ──"
          pm2 describe onbrand 2>&1 | head -40
          echo "── recent logs ──"
          pm2 logs onbrand --lines 60 --nostream 2>&1 | tail -80
          echo "── port 3101 listening? ──"
          ss -ltnp | grep :3101 || echo "nothing on 3101"

      - name: Force fork mode + restart
        run: |
          set -e
          ECO=/opt/onbrand/app/skills/ai-talent/ecosystem.config.cjs
          python3 <<'PY'
          import re, pathlib
          p = pathlib.Path("/opt/onbrand/app/skills/ai-talent/ecosystem.config.cjs")
          s = p.read_text()
          s = re.sub(r"instances:\s*\d+", "instances: 1", s)
          s = re.sub(r"exec_mode:\s*'cluster'", "exec_mode: 'fork'", s)
          p.write_text(s)
          print(s)
          PY
          pm2 delete onbrand 2>/dev/null || true
          cd /opt/onbrand/app/skills/ai-talent
          pm2 start ecosystem.config.cjs
          pm2 save
          sleep 3
          pm2 list

      - name: Smoke
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -sk -o /dev/null -w "%{http_code}" https://marketing-os.sowork.ai/api/healthz 2>/dev/null)
            echo "try $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 3
          done
          echo "still down after rollback"
          pm2 logs onbrand --lines 80 --nostream
          exit 1
