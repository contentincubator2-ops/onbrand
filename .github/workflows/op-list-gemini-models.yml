name: "Op — List available Gemini models (read-only)"

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List models
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 3m
          script: |
            set -e
            source /opt/onbrand/app/skills/ai-talent/.env 2>/dev/null || true
            K="${GEMINI_API_KEY:-${GOOGLE_AI_API_KEY:-$GOOGLE_API_KEY}}"
            curl -s "https://generativelanguage.googleapis.com/v1beta/models?key=$K&pageSize=200" \
              | grep -o '"name": *"models/[^"]*"' \
              | sed 's/.*models\///; s/"//' \
              | sort
