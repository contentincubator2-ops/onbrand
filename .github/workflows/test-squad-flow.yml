name: Squad Flow 自動化測試 (10輪)

on:
  workflow_dispatch:   # 手動觸發
  schedule:
    - cron: "0 2 * * *"  # 每天 UTC 02:00（台灣時間 10:00）自動跑

jobs:
  run-squad-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Run squad flow test on VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /home/azureuser/marketing-os
            echo "=== 拉最新代碼 ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== 讀取 JWT_SECRET（從 PM2 運行中的 server process）==="
            # 優先從 PM2 的 running process 環境取得 JWT_SECRET（與 server 完全一致）
            export JWT_SECRET=$(pm2 jlist 2>/dev/null | node -e "
              let d=''; process.stdin.on('data',c=>d+=c);
              process.stdin.on('end',()=>{
                try{
                  const procs=JSON.parse(d);
                  const p=procs.find(x=>x.pm2_env&&x.pm2_env.JWT_SECRET);
                  if(p) process.stdout.write(p.pm2_env.JWT_SECRET);
                }catch(e){}
              });
            " 2>/dev/null)
            # Fallback: 從 .env 讀取
            if [ -z "$JWT_SECRET" ]; then
              echo "⚠️  PM2 無 JWT_SECRET，嘗試 .env"
              export JWT_SECRET=$(grep -E '^JWT_SECRET=' skills/ai-talent/.env | head -1 | cut -d= -f2-)
            fi
            if [ -z "$JWT_SECRET" ]; then
              echo "❌ JWT_SECRET 未找到，無法測試"
              exit 1
            fi
            echo "✅ JWT_SECRET 已設定（長度：${#JWT_SECRET}）"

            echo "=== 執行 10 輪 Squad Flow 測試 ==="
            npm run test:squad --prefix skills/ai-talent 2>&1
