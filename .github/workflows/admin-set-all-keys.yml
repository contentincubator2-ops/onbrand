name: Admin — Push all API keys from GH Secrets to VM .env

# One-shot writer that takes every API key stored in GitHub Repo Secrets
# and merges them into /opt/marketing-os/app/skills/ai-talent/.env on the VM.
#
# Idempotent: replaces existing lines, appends new ones, never duplicates.
# Backs up the existing .env to .env.bak.<timestamp> before editing.
#
# Pri: Azure Foundry is already set on VM (do not touch). This workflow only
# adds the OTHER providers so squad agents can fall back across providers.

on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          # LLM providers
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_API_KEY_DEFAULT:   ${{ secrets.CLAUDE_API_KEY_DEFAULT }}
          CLAUDE_API_KEY_1:         ${{ secrets.CLAUDE_API_KEY_1 }}
          CLAUDE_API_KEY_2:         ${{ secrets.CLAUDE_API_KEY_2 }}
          OPENAI_API_KEY:           ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEY_1:         ${{ secrets.OPENAI_API_KEY_1 }}
          OPENAI_API_KEY_2:         ${{ secrets.OPENAI_API_KEY_2 }}
          OPENAI_API_KEY_3:         ${{ secrets.OPENAI_API_KEY_3 }}
          DEEPSEEK_API_KEY_2:       ${{ secrets.DEEPSEEK_API_KEY_2 }}
          DEEPSEEK_API_KEY_3:       ${{ secrets.DEEPSEEK_API_KEY_3 }}
          DEEPSEEK_API_KEY_4:       ${{ secrets.DEEPSEEK_API_KEY_4 }}
          DEEPSEEK_API_KEY_7:       ${{ secrets.DEEPSEEK_API_KEY_7 }}
          DEEPSEEK_API_KEY_8:       ${{ secrets.DEEPSEEK_API_KEY_8 }}
          DEEPSEEK_API_KEY_9:       ${{ secrets.DEEPSEEK_API_KEY_9 }}
          DEEPSEEK_API_KEY_10:      ${{ secrets.DEEPSEEK_API_KEY_10 }}
          QWEN_API_KEY:             ${{ secrets.QWEN_API_KEY }}
          ZHIPU_API_KEY:            ${{ secrets.ZHIPU_API_KEY }}
          PERPLEXITY_API_KEY_1:     ${{ secrets.PERPLEXITY_API_KEY_1 }}
          PERPLEXITY_API_KEY_2:     ${{ secrets.PERPLEXITY_API_KEY_2 }}
          PERPLEXITY_API_KEY_3:     ${{ secrets.PERPLEXITY_API_KEY_3 }}
          PERPLEXITY_API_KEY_4:     ${{ secrets.PERPLEXITY_API_KEY_4 }}
          GOOGLE_API_KEY_1:         ${{ secrets.GOOGLE_API_KEY_1 }}
          GOOGLE_API_KEY_3:         ${{ secrets.GOOGLE_API_KEY_3 }}
          GOOGLE_API_KEY_4:         ${{ secrets.GOOGLE_API_KEY_4 }}
          GOOGLE_API_KEY_5:         ${{ secrets.GOOGLE_API_KEY_5 }}
          COHERE_API_KEY:           ${{ secrets.COHERE_API_KEY }}
          # Image / video / voice
          FAL_AI_API_KEY_1:         ${{ secrets.FAL_AI_API_KEY_1 }}
          FAL_AI_API_KEY_2:         ${{ secrets.FAL_AI_API_KEY_2 }}
          FAL_AI_API_KEY_3:         ${{ secrets.FAL_AI_API_KEY_3 }}
          FAL_AI_API_KEY_4:         ${{ secrets.FAL_AI_API_KEY_4 }}
          # Agent platforms
          MANUS_API_KEY_1:          ${{ secrets.MANUS_API_KEY_1 }}
          MANUS_API_KEY_2:          ${{ secrets.MANUS_API_KEY_2 }}
          MANUS_API_KEY_3:          ${{ secrets.MANUS_API_KEY_3 }}
          MANUS_API_KEY_4:          ${{ secrets.MANUS_API_KEY_4 }}
          HAILUO_API_KEY:           ${{ secrets.HAILUO_API_KEY }}
          # Optional (may be empty)
          BROWSERBASE_API_KEY:      ${{ secrets.BROWSERBASE_API_KEY }}
          TAVILY_API_KEY_1:         ${{ secrets.TAVILY_API_KEY_1 }}
          TAVILY_API_KEY_2:         ${{ secrets.TAVILY_API_KEY_2 }}
          OPENROUTER_API_KEY:       ${{ secrets.OPENROUTER_API_KEY }}
          META_ACCESS_TOKEN_1:      ${{ secrets.META_ACCESS_TOKEN_1 }}
          META_ACCESS_TOKEN_2:      ${{ secrets.META_ACCESS_TOKEN_2 }}
          META_APP_SECRET:          ${{ secrets.META_APP_SECRET }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          envs: ANTHROPIC_API_KEY,CLAUDE_API_KEY_DEFAULT,CLAUDE_API_KEY_1,CLAUDE_API_KEY_2,OPENAI_API_KEY,OPENAI_API_KEY_1,OPENAI_API_KEY_2,OPENAI_API_KEY_3,DEEPSEEK_API_KEY_2,DEEPSEEK_API_KEY_3,DEEPSEEK_API_KEY_4,DEEPSEEK_API_KEY_7,DEEPSEEK_API_KEY_8,DEEPSEEK_API_KEY_9,DEEPSEEK_API_KEY_10,QWEN_API_KEY,ZHIPU_API_KEY,PERPLEXITY_API_KEY_1,PERPLEXITY_API_KEY_2,PERPLEXITY_API_KEY_3,PERPLEXITY_API_KEY_4,GOOGLE_API_KEY_1,GOOGLE_API_KEY_3,GOOGLE_API_KEY_4,GOOGLE_API_KEY_5,COHERE_API_KEY,FAL_AI_API_KEY_1,FAL_AI_API_KEY_2,FAL_AI_API_KEY_3,FAL_AI_API_KEY_4,MANUS_API_KEY_1,MANUS_API_KEY_2,MANUS_API_KEY_3,MANUS_API_KEY_4,HAILUO_API_KEY,BROWSERBASE_API_KEY,TAVILY_API_KEY_1,TAVILY_API_KEY_2,OPENROUTER_API_KEY,META_ACCESS_TOKEN_1,META_ACCESS_TOKEN_2,META_APP_SECRET
          script: |
            set -e
            ENV=/opt/marketing-os/app/skills/ai-talent/.env
            cp "$ENV" "${ENV}.bak.$(date +%s)"
            BEFORE=$(wc -l < "$ENV")

            upsert() {
              local KEY="$1"
              local VAL="$2"
              if [ -z "$VAL" ]; then
                echo "  ⊘ $KEY (empty in secrets, skipped)"
                return
              fi
              if grep -qE "^${KEY}=" "$ENV"; then
                # replace existing line (use | as sed delimiter to avoid / in values)
                sed -i "s|^${KEY}=.*|${KEY}=${VAL}|" "$ENV"
                echo "  ↻ $KEY (updated)"
              else
                echo "${KEY}=${VAL}" >> "$ENV"
                echo "  + $KEY (added)"
              fi
            }

            echo "════════════════════════════════════════════════════════════════"
            echo "  🔑 Pushing keys from GH Secrets to VM .env"
            echo "  Backup: ${ENV}.bak.<ts>"
            echo "════════════════════════════════════════════════════════════════"

            # Picked primary key for each provider; numbered duplicates kept as
            # backup pool for round-robin fallback in multiModelRouter.
            # Anthropic: prefer ANTHROPIC_API_KEY, fall back to user's
            # CLAUDE_API_KEY_DEFAULT secret (renewed key lives there).
            upsert ANTHROPIC_API_KEY        "${ANTHROPIC_API_KEY:-$CLAUDE_API_KEY_DEFAULT}"
            upsert CLAUDE_API_KEY_DEFAULT   "$CLAUDE_API_KEY_DEFAULT"
            upsert ANTHROPIC_API_KEY_BACKUP_1 "$CLAUDE_API_KEY_1"
            upsert ANTHROPIC_API_KEY_BACKUP_2 "$CLAUDE_API_KEY_2"
            upsert OPENAI_API_KEY           "${OPENAI_API_KEY:-$OPENAI_API_KEY_1}"
            upsert OPENAI_API_KEY_BACKUP_1  "$OPENAI_API_KEY_2"
            upsert OPENAI_API_KEY_BACKUP_2  "$OPENAI_API_KEY_3"
            upsert DEEPSEEK_API_KEY         "$DEEPSEEK_API_KEY_7"
            upsert DEEPSEEK_API_KEY_BACKUP_1 "$DEEPSEEK_API_KEY_8"
            upsert DEEPSEEK_API_KEY_BACKUP_2 "$DEEPSEEK_API_KEY_9"
            upsert DEEPSEEK_API_KEY_BACKUP_3 "$DEEPSEEK_API_KEY_10"
            upsert QWEN_API_KEY             "$QWEN_API_KEY"
            upsert ZHIPU_API_KEY            "$ZHIPU_API_KEY"
            upsert PERPLEXITY_API_KEY       "$PERPLEXITY_API_KEY_1"
            upsert PERPLEXITY_API_KEY_BACKUP_1 "$PERPLEXITY_API_KEY_3"
            upsert PERPLEXITY_API_KEY_BACKUP_2 "$PERPLEXITY_API_KEY_4"
            upsert GOOGLE_API_KEY           "$GOOGLE_API_KEY_1"
            upsert GEMINI_API_KEY           "$GOOGLE_API_KEY_1"
            upsert GOOGLE_API_KEY_BACKUP_1  "$GOOGLE_API_KEY_3"
            upsert GOOGLE_API_KEY_BACKUP_2  "$GOOGLE_API_KEY_4"
            upsert GOOGLE_API_KEY_BACKUP_3  "$GOOGLE_API_KEY_5"
            upsert COHERE_API_KEY           "$COHERE_API_KEY"
            upsert FAL_API_KEY              "$FAL_AI_API_KEY_1"
            upsert FAL_AI_API_KEY           "$FAL_AI_API_KEY_1"
            upsert FAL_AI_API_KEY_BACKUP_1  "$FAL_AI_API_KEY_2"
            upsert FAL_AI_API_KEY_BACKUP_2  "$FAL_AI_API_KEY_3"
            upsert FAL_AI_API_KEY_BACKUP_3  "$FAL_AI_API_KEY_4"
            upsert MANUS_API_KEY            "${MANUS_API_KEY_4:-${MANUS_API_KEY_1}}"
            upsert MANUS_API_KEY_BACKUP_1   "$MANUS_API_KEY_1"
            upsert MANUS_API_KEY_BACKUP_2   "$MANUS_API_KEY_2"
            upsert MANUS_API_KEY_BACKUP_3   "$MANUS_API_KEY_3"
            upsert HAILUO_API_KEY           "$HAILUO_API_KEY"
            upsert MINIMAX_API_KEY          "$HAILUO_API_KEY"
            upsert BROWSERBASE_API_KEY      "$BROWSERBASE_API_KEY"
            upsert TAVILY_API_KEY           "$TAVILY_API_KEY_1"
            upsert TAVILY_API_KEY_BACKUP_1  "$TAVILY_API_KEY_2"
            upsert OPENROUTER_API_KEY       "$OPENROUTER_API_KEY"
            upsert META_ACCESS_TOKEN        "$META_ACCESS_TOKEN_1"
            upsert META_ACCESS_TOKEN_BACKUP "$META_ACCESS_TOKEN_2"
            upsert META_APP_SECRET          "$META_APP_SECRET"

            AFTER=$(wc -l < "$ENV")
            echo ""
            echo "════════════════════════════════════════════════════════════════"
            echo "  ✅ .env lines: $BEFORE → $AFTER"
            echo "  Restarting pm2 marketing-os to pick up new env..."
            echo "════════════════════════════════════════════════════════════════"
            pm2 restart marketing-os --update-env 2>&1 | tail -3 || echo "(pm2 restart skipped)"
