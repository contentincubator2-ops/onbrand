name: "Admin — Import social-listening export into listening_mentions"

# Loads a normalised social-listening export (e.g. an OpView xlsx run through
# scripts/opview-xlsx-to-json.py, committed under scripts/imports/) into the
# accumulating store for a brand/scope, so it shows on the 品牌聲量 / 競品聲量
# pages. Idempotent — upsertMention dedups by URL hash, safe to re-run.
# Default: IRIS (2956) 品牌聲量 from scripts/imports/iris-listening.json, on DEV.

on:
  # Auto-import when the IRIS fixture changes on dev (workflow_dispatch needs the
  # file on the default branch, which this isn't yet — so a path-scoped push runs
  # it here without touching prod). Uses the defaults below on push.
  push:
    branches: [dev]
    paths:
      - "skills/ai-talent/scripts/imports/iris-listening.json"
      - ".github/workflows/admin-import-listening.yml"
  workflow_dispatch:
    inputs:
      brandId:
        description: "Brand id (IRIS = 2956)"
        type: string
        default: "2956"
      scope:
        description: "Listening scope to import into"
        type: choice
        default: "listening.own_brand"
        options:
          - "listening.own_brand"
          - "listening.competitors"
          - "listening.industry_talk"
          - "listening.market_hotspots"
      file:
        description: "Normalised JSON path (relative to skills/ai-talent)"
        type: string
        default: "scripts/imports/iris-listening.json"
      appRoot:
        description: "Which deployment to import into (current = dev, app = prod)"
        type: choice
        default: "current"
        options: ["current", "app"]

jobs:
  import:
    runs-on: ubuntu-latest
    # environment: dev → secrets.VM_HOST/VM_USER/VM_SSH_PRIVATE_KEY resolve to the
    # DEV VM (where deploy-dev ships /opt/onbrand/current), not prod.
    environment: dev
    steps:
      - name: Import listening export on the VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -e
            BRAND="${{ github.event.inputs.brandId }}"; BRAND="${BRAND:-2956}"
            SCOPE="${{ github.event.inputs.scope }}"; SCOPE="${SCOPE:-listening.own_brand}"
            FILE="${{ github.event.inputs.file }}"; FILE="${FILE:-scripts/imports/iris-listening.json}"
            ROOT="${{ github.event.inputs.appRoot }}"; ROOT="${ROOT:-current}"
            cd "/opt/onbrand/$ROOT/skills/ai-talent"
            test -f "$FILE" || { echo "missing file: $FILE — has dev been deployed with this fixture?"; exit 1; }
            set -a; source .env; set +a
            echo "importing $FILE → brand $BRAND / $SCOPE (from /opt/onbrand/$ROOT)"
            npx tsx scripts/import-listening-json.ts --brand="$BRAND" --scope="$SCOPE" --file="$FILE"
