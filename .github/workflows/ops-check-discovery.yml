name: "Ops — Check product discovery (brand 2916)"
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: [self-hosted, linux, vm-onbrand]
    steps:
      - name: Check discovery jobs + brand website
        run: |
          source /opt/onbrand/app/skills/ai-talent/.env 2>/dev/null || true
          H="${LOCAL_DB_HOST:-127.0.0.1}"
          U="${LOCAL_DB_USER:-mos_user}"
          P="${LOCAL_DB_PASSWORD:-${LOCAL_DB_PASSWORD}}"
          D="${LOCAL_DB_NAME:-mos_db}"
          echo "=== product_discovery_jobs for brand 2916 ==="
          mysql -h"$H" -u"$U" -p"$P" "$D" -e \
            "SELECT id, brandId, status, phase, totalFound, totalPositioned, websiteUrl, errorLog, createdAt
             FROM product_discovery_jobs WHERE brandId=2916 ORDER BY createdAt DESC LIMIT 5;"
          echo "=== brands.website ==="
          mysql -h"$H" -u"$U" -p"$P" "$D" -e \
            "SELECT id, name, website FROM brands WHERE id=2916;"
          echo "=== pm2 last 40 lines for productDiscovery ==="
          pm2 logs onbrand --nostream --lines 200 2>/dev/null | grep -i "product\|discovery\|crawl" | tail -40 || true
