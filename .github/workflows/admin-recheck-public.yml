name: Admin — Recheck public/ after deploy

on:
  workflow_dispatch:

jobs:
  recheck:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 2
    steps:
      - run: |
          set -e
          AI=/opt/marketing-os/app/skills/ai-talent
          echo "── ls -la $AI/public ──"
          ls -la "$AI/public"
          echo ""
          echo "── ls -la $AI/public/assets ──"
          ls -la "$AI/public/assets" | head -10
          echo ""
          echo "── cat $AI/public/index.html ──"
          cat "$AI/public/index.html"
          echo ""
          echo ""
          echo "── pm2 status ──"
          pm2 list | grep marketing-os
          echo ""
          echo "── curl localhost:3101/ ──"
          curl -s "http://localhost:3101/" -w "\n[size=%{size_download}]\n"
