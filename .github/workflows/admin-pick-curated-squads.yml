name: Admin — Pick 30 curated squads (L1×5 L2×3 L3×4 L4×10 L5×6 L6×2)

# Phase 3 of curated-30 + skill ingest plan.
#
# Selection logic:
#   1. Candidate = squads where is_active=1 AND has steps (>=3) AND has methodology data.
#   2. Score = step_count_weight (0.4) + member_count_weight (0.2)
#            + has_methodology_author (0.2) + has_description (0.1) + has_lead (0.1)
#   3. Per layer, take top-N by score where N = market-demand quota.
#   4. Tag winners squads.is_curated = 1; clear all others to 0 first.
#   5. INSERT into methodology one row per winner squad
#      (linking back via methodology_id and methodology.default_squad_id).
#
# Re-runnable: clears is_curated + methodology rows it created (by source_url
# prefix \"local:squad/\") before re-tagging.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "PICK" to apply tagging'
        required: true
        default: ''

jobs:
  pick:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'PICK' }}
    steps:
      - uses: actions/checkout@v4
      - name: Run picker on VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 300s
          envs: GH_TOKEN
          script: |
            set -e
            APP=/opt/marketing-os/app
            cd "$APP"
            REPO="https://x-access-token:${GH_TOKEN}@github.com/contentincubator2-ops/Marketing-OS.git"
            git remote set-url origin "$REPO"
            git fetch origin main && git reset --hard origin/main

            ENV_FILE=$APP/skills/ai-talent/.env
            set -a; source "$ENV_FILE"; set +a
            cd $APP/skills/ai-talent
            ./node_modules/.bin/tsx scripts/pickCuratedSquads.ts
