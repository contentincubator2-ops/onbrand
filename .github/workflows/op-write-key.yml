name: Ops — Write single key to VM .env (one-shot, delete after use)

on:
  workflow_dispatch:
    inputs:
      key_name:
        description: "Key name (e.g. AZURE_FOUNDRY_API_KEY)"
        required: true
        type: string
      key_value:
        description: "Key value"
        required: true
        type: string

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          KEY_NAME:  ${{ github.event.inputs.key_name }}
          KEY_VALUE: ${{ github.event.inputs.key_value }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 30s
          envs: KEY_NAME,KEY_VALUE
          script: |
            # Mask value from logs immediately
            echo "::add-mask::${KEY_VALUE}"
            set -e
            ENV=/opt/onbrand/app/skills/ai-talent/.env
            touch "$ENV"
            cp "$ENV" "${ENV}.bak.$(date +%s)"
            if grep -qE "^${KEY_NAME}=" "$ENV"; then
              sed -i "s|^${KEY_NAME}=.*|${KEY_NAME}=${KEY_VALUE}|" "$ENV"
              echo "  ↻ ${KEY_NAME} updated"
            else
              echo "${KEY_NAME}=${KEY_VALUE}" >> "$ENV"
              echo "  + ${KEY_NAME} added"
            fi
            # Verify key is present (masked)
            echo "  ✅ .env now has $(wc -l < "$ENV") lines"
            # Restart server to pick up new env
            pm2 restart onbrand --update-env 2>&1 | tail -2
            echo "  ✅ onbrand restarted"
