name: Admin — Probe Google Vertex AI

# Verify the VM can call Google Vertex AI (gemini + imagen + veo).
# Reads VERTEX_PROJECT_ID / VERTEX_LOCATION / GOOGLE_APPLICATION_CREDENTIALS
# from /opt/marketing-os/app/skills/ai-talent/.env and runs three probes:
#   1. gemini-2.5-flash (text)
#   2. imagen-4 (image gen) — metadata only
#   3. veo-3 (video gen) — metadata only

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 120s
          script: |
            set +e
            cd /opt/marketing-os/app/skills/ai-talent
            ENV=$(grep -E '^(VERTEX_|GOOGLE_|GCP_)' .env 2>/dev/null | sed 's/^/export /')
            eval "$ENV"

            echo "════════════════════════════════════════════════════════════════"
            echo "  🛰  Vertex AI probe"
            echo "════════════════════════════════════════════════════════════════"
            echo "VERTEX_PROJECT_ID  = ${VERTEX_PROJECT_ID:-(unset)}"
            echo "VERTEX_LOCATION    = ${VERTEX_LOCATION:-(unset)}"
            echo "GOOGLE_APPLICATION_CREDENTIALS = ${GOOGLE_APPLICATION_CREDENTIALS:-(unset)}"
            echo "GCP_SERVICE_ACCOUNT_JSON length = ${#GCP_SERVICE_ACCOUNT_JSON}"
            echo ""

            # Get access token via gcloud or service account JSON
            if [ -n "$GOOGLE_APPLICATION_CREDENTIALS" ] && [ -f "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
              echo "▼ Using service-account file at $GOOGLE_APPLICATION_CREDENTIALS"
              SA_FILE="$GOOGLE_APPLICATION_CREDENTIALS"
            elif [ -n "$GCP_SERVICE_ACCOUNT_JSON" ]; then
              echo "▼ Using inline GCP_SERVICE_ACCOUNT_JSON env var"
              SA_FILE=/tmp/gcp-sa.json
              echo "$GCP_SERVICE_ACCOUNT_JSON" > "$SA_FILE"
            else
              echo "❌ No Vertex credentials found. Need GOOGLE_APPLICATION_CREDENTIALS path or GCP_SERVICE_ACCOUNT_JSON."
              exit 1
            fi

            # Get token via Python (no gcloud needed)
            TOKEN=$(python3 - <<EOF
            import json, time, base64, hashlib, hmac, urllib.request
            try:
                from cryptography.hazmat.primitives import hashes, serialization
                from cryptography.hazmat.primitives.asymmetric import padding
            except ImportError:
                import subprocess; subprocess.check_call(['pip','install','-q','cryptography'])
                from cryptography.hazmat.primitives import hashes, serialization
                from cryptography.hazmat.primitives.asymmetric import padding

            sa = json.load(open('$SA_FILE'))
            now = int(time.time())
            header = base64.urlsafe_b64encode(json.dumps({"alg":"RS256","typ":"JWT"}).encode()).rstrip(b'=')
            claims = {
                "iss": sa["client_email"],
                "scope": "https://www.googleapis.com/auth/cloud-platform",
                "aud": "https://oauth2.googleapis.com/token",
                "exp": now + 3600,
                "iat": now,
            }
            payload = base64.urlsafe_b64encode(json.dumps(claims).encode()).rstrip(b'=')
            signing_input = header + b'.' + payload
            key = serialization.load_pem_private_key(sa["private_key"].encode(), password=None)
            sig = key.sign(signing_input, padding.PKCS1v15(), hashes.SHA256())
            jwt = (signing_input + b'.' + base64.urlsafe_b64encode(sig).rstrip(b'=')).decode()
            req = urllib.request.Request(
                "https://oauth2.googleapis.com/token",
                data=("grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion="+jwt).encode(),
                headers={"Content-Type":"application/x-www-form-urlencoded"})
            print(json.load(urllib.request.urlopen(req))["access_token"])
            EOF
            )

            if [ -z "$TOKEN" ] || [ "${#TOKEN}" -lt 50 ]; then
              echo "❌ Failed to mint access token"
              exit 1
            fi
            echo "✅ Got access token (length=${#TOKEN})"
            echo ""

            PROJECT="${VERTEX_PROJECT_ID:-${GCP_PROJECT_ID}}"
            LOC="${VERTEX_LOCATION:-us-central1}"

            echo "▼ Probe 1 — gemini-2.5-flash text generation"
            curl -s -o /tmp/gem.json -w "HTTP %{http_code}\n" \
              "https://${LOC}-aiplatform.googleapis.com/v1/projects/${PROJECT}/locations/${LOC}/publishers/google/models/gemini-2.5-flash:generateContent" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"contents":[{"role":"user","parts":[{"text":"Say: vertex-probe-ok"}]}]}'
            echo "  ↳ $(head -c 400 /tmp/gem.json)"
            echo ""

            echo "▼ Probe 2 — imagen-4.0-generate-001 (metadata only, no actual gen)"
            curl -s -o /tmp/img.json -w "HTTP %{http_code}\n" \
              "https://${LOC}-aiplatform.googleapis.com/v1/projects/${PROJECT}/locations/${LOC}/publishers/google/models/imagen-4.0-generate-001"
            echo "  ↳ $(head -c 200 /tmp/img.json)"
            echo ""

            echo "▼ Probe 3 — veo-3.0-generate-preview (metadata only)"
            curl -s -o /tmp/veo.json -w "HTTP %{http_code}\n" \
              -H "Authorization: Bearer ${TOKEN}" \
              "https://${LOC}-aiplatform.googleapis.com/v1/projects/${PROJECT}/locations/${LOC}/publishers/google/models/veo-3.0-generate-preview"
            echo "  ↳ $(head -c 200 /tmp/veo.json)"
            echo ""

            echo "════════════════════════════════════════════════════════════════"
            echo "  ✅ Done. If Probe 1 returned candidates, Vertex text is live."
            echo "  Image/video probes return 403 if quota not granted to project."
            echo "════════════════════════════════════════════════════════════════"
