name: Admin — Migrate (modelStack + skill_catalog + agent_skill_assignments)

# Adds three pieces of schema needed for the orphan-agent skill plan:
#   - agents.modelStack (JSON) — per-agent multi-modal model declaration
#   - skill_catalog table — harvested skill registry (provider-bound)
#   - agent_skill_assignments table — orphan agent ↔ skill_catalog binding
# All idempotent; safe to re-run.

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 180s
          envs: GH_TOKEN
          script: |
            set -e
            APP=/opt/marketing-os/app
            REPO="https://x-access-token:${GH_TOKEN}@github.com/contentincubator2-ops/Marketing-OS.git"
            cd "$APP"
            git remote set-url origin "$REPO"
            git fetch origin main
            git reset --hard origin/main
            cd "$APP/skills/ai-talent"
            if [ ! -d node_modules ]; then npm install --legacy-peer-deps --no-audit --no-fund 2>&1 | tail -5; fi
            echo "════════════════════════════════════════════════════════════════"
            echo "  🗃️  Run idempotent migrations (modelStack + catalog tables)"
            echo "════════════════════════════════════════════════════════════════"
            npm run db:migrate
