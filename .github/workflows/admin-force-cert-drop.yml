name: Admin — Force re-issue cert with drop included

on:
  workflow_dispatch:

jobs:
  cert:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 120s
          script: |
            set -e

            echo "════════ STEP A: 看現在 marketing-os 那張 cert 的 SAN（包含哪些域名）════════"
            sudo openssl x509 -in /etc/letsencrypt/live/marketing-os.sowork.ai/fullchain.pem -noout -text | grep -A1 "Subject Alternative Name"

            echo ""
            echo "════════ STEP B: nginx server_name 與 listen 完整內容 ════════"
            sudo cat /etc/nginx/sites-enabled/marketing-os | grep -nE "server_name|listen|ssl_certificate" | head -10

            echo ""
            echo "════════ STEP C: 用 webroot challenge 強制重簽（避免 nginx auto-config 弄壞）════════"
            # 找一個 nginx 已經服務 / 的目錄當 webroot
            WEBROOT=$(sudo grep -E "^\s*root\s+" /etc/nginx/sites-enabled/marketing-os | head -1 | awk '{print $2}' | sed 's/;//')
            echo "Detected webroot: $WEBROOT"
            if [ -z "$WEBROOT" ] || [ ! -d "$WEBROOT" ]; then
              echo "(webroot not found, using /var/www/html as fallback)"
              WEBROOT="/var/www/html"
              sudo mkdir -p "$WEBROOT"
            fi

            # 用 --force-renewal 強制重新簽發（不在 expand check 範圍內）
            sudo certbot certonly --webroot -w "$WEBROOT" \
              --non-interactive --agree-tos \
              --email contentincubator2@gmail.com \
              -d marketing-os.sowork.ai -d drop.sowork.ai \
              --expand --force-renewal 2>&1 | tail -15

            echo ""
            echo "════════ STEP D: 驗證新 cert 的 SAN ════════"
            sudo openssl x509 -in /etc/letsencrypt/live/marketing-os.sowork.ai/fullchain.pem -noout -text | grep -A1 "Subject Alternative Name"

            echo ""
            echo "════════ STEP E: nginx reload + SNI 重測 ════════"
            sudo nginx -s reload
            sleep 1
            echo "── SNI=drop.sowork.ai 看到哪張 cert ──"
            echo | openssl s_client -connect localhost:443 -servername drop.sowork.ai 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName 2>&1 | head -5

            echo ""
            echo "════════ STEP F: HTTPS smoke test ════════"
            curl -sS -I --max-time 10 https://drop.sowork.ai/ 2>&1 | head -5
