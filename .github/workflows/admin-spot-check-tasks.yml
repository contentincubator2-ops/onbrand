name: Admin — Spot-check task deliverables vs label promise

on:
  workflow_dispatch:

jobs:
  spotcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 600s
          script: |
            COOKIE='session=eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxOTkiLCJvcGVuSWQiOiJoUGRNTXBNOWpNRDdEUXZBR19QUk9TYi1zRGw4bFRmYyIsImlhdCI6MTc3Nzk0Nzk3MywiZXhwIjoxODA5NDgzOTczfQ.ffZWP9Ajog__s5xC4e8fuFjruX1zm89Trg42Ayw4BCA'

            run_task() {
              local TID=$1; local KEY=$2; local INPUT=$3; local CHECK=$4
              echo ""
              echo "════════ $TID ($KEY) — expect: $CHECK ════════"
              local BODY=$(printf '{"0":{"taskId":"%s","inputs":{"%s":"%s"},"brandId":2832}}' "$TID" "$KEY" "$INPUT")
              local RESP=$(curl -sS --max-time 90 -X POST \
                "http://localhost:3101/trpc/quickTask.runOrchestra?batch=1" \
                -H "Content-Type: application/json" -H "Cookie: $COOKIE" \
                -d "$BODY")
              python3 -c "
            import sys, json
            try:
                d = json.loads('''$RESP''')
                r = d[0].get('result',{}).get('data') or {}
                err = d[0].get('error') or {}
                if err: print(f'  ✗ ERROR: {err.get(\"message\",\"\")[:120]}'); sys.exit(0)
                vs = r.get('variants', [])
                ok = sum(1 for v in vs if (v.get('caption') or '').strip())
                print(f'  variants: {ok}/{len(vs)}, latency {r.get(\"totalLatencyMs\",0)/1000:.1f}s')
                for v in vs[:5]:
                    cap = (v.get('caption') or '').strip()
                    print(f'    [{v.get(\"label\")}] len={len(cap)}: {cap[:80]}')
            except Exception as e:
                print(f'  ✗ parse error: {e}')
                print('  raw:', '''$RESP'''[:200])
            "
            }

            # Brand archetype - was good per CJ audit
            run_task "br-30-archetype" "context" "桂冠營養研究室：科學驗證的家庭營養品" "3 archetype 角度"
            # The freshly-fixed tagline tasks
            run_task "br-30-tagline" "context" "桂冠營養研究室：科學驗證的家庭營養品" "5 條 6-15 字 tagline"
            run_task "br-30-positioning" "context" "桂冠營養研究室" "3 種定位敘事"
            # Was failing PR
            run_task "pr-30-headline" "event" "桂冠營養研究室 5/9 花博粉紅健走應援站" "新聞稿標題 50 字內"
            # IG bio
            run_task "ig-30-bio-rewrite" "context" "桂冠營養研究室 - 科學驗證的家庭營養品牌" "IG bio 150 字內"
            # FB ad
            run_task "fb-30-ad-headline" "goal" "推廣健力湯試喝活動" "FB 廣告 headline"
            # YT title
            run_task "yt-30-title-strategies" "topic" "煮一鍋健力湯的科學" "YT 影片標題"
            # Email subject
            run_task "em-30-subject-line" "topic" "本月會員專屬：免費試喝券" "Email 主旨 < 50 字"
            # LI insight
            run_task "li-30-insight-post" "context" "做品牌 10 年的觀察：消費者要的不是行銷" "LinkedIn 觀點貼文"
            # TikTok hook
            run_task "tt-30-opening-hook" "topic" "你以為健康餐很難煮嗎？" "TikTok 開場 3 秒 hook"

            echo ""
            echo "════════ DONE — review per-task output ════════"
