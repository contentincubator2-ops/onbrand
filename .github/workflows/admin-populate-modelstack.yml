name: Admin — Populate agents.modelStack

# Fills agents.modelStack JSON for every agent based on their primary aiModel
# family. Maps each family to a multi-modal toolkit:
#   - Azure Foundry / OpenAI → openai/gpt-image-1, openai/tts-1, openai/whisper-1
#   - Google Gemini          → google/imagen-3, google/tts-chirp
#   - everyone else          → fal.ai universal (flux-pro / kling-2 / elevenlabs)
# Cohere embed v4 default; Tavily web_search; Browserbase browser; Meta social.
#
# Idempotent. Re-running overwrites with freshest mapping.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Show stats only (no UPDATE)"
        type: boolean
        default: false

jobs:
  populate:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 600s
          envs: GH_TOKEN,DRY_RUN
          script: |
            set -e
            APP=/opt/marketing-os/app
            REPO="https://x-access-token:${GH_TOKEN}@github.com/contentincubator2-ops/Marketing-OS.git"
            cd "$APP"
            git remote set-url origin "$REPO"
            git fetch origin main
            git reset --hard origin/main
            cd "$APP/skills/ai-talent"
            if [ ! -d node_modules ]; then npm install --legacy-peer-deps --no-audit --no-fund 2>&1 | tail -5; fi
            echo "════════════════════════════════════════════════════════════════"
            echo "  🧰 Populate agents.modelStack (dry_run=${DRY_RUN})"
            echo "════════════════════════════════════════════════════════════════"
            if [ "$DRY_RUN" = "true" ]; then
              npm run db:populate-modelstack-dry
            else
              npm run db:populate-modelstack
            fi
