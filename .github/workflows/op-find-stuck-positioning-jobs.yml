name: Ops — Find currently-stuck positioning jobs (read-only)

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: [self-hosted, linux, vm-onbrand]
    timeout-minutes: 3
    steps:
      - run: |
          set -e
          ENV=/opt/onbrand/app/skills/ai-talent/.env
          set -a; source "$ENV"; set +a
          export MYSQL_PWD="$LOCAL_DB_PASSWORD"
          MYSQL="mysql -h localhost -u mos_user mos_db -B -t"

          echo "════ All running/pending jobs right now ════"
          $MYSQL -e "
            SELECT pj.id, pj.entityKind, pj.entityId,
                   COALESCE(b.brandName, b.name, p.name, e.name) AS entityName,
                   pj.status, pj.currentStep, pj.totalSteps, pj.retryCount,
                   TIMESTAMPDIFF(MINUTE, pj.startedAt, NOW()) AS ageMin,
                   LEFT(IFNULL(pj.lastError,''), 200) AS lastErr
              FROM positioning_jobs pj
              LEFT JOIN brands   b ON pj.entityKind='brand'   AND b.id = pj.entityId
              LEFT JOIN products p ON pj.entityKind='product' AND p.id = pj.entityId
              LEFT JOIN events   e ON pj.entityKind='event'   AND e.id = pj.entityId
             WHERE pj.status IN ('pending','running')
             ORDER BY pj.startedAt DESC
             LIMIT 20;
          " 2>&1

          echo ""
          echo "════ pm2 status ════"
          pm2 list 2>&1 | head -10

          echo ""
          echo "════ pm2 error log (last 40 lines) ════"
          tail -40 ~/.pm2/logs/onbrand-error.log 2>/dev/null || echo "(no error log)"

          echo ""
          echo "════ pm2 out log — positioning-related (last 30) ════"
          grep -a "positioningJob\|positioning_job" ~/.pm2/logs/onbrand-out.log 2>/dev/null | tail -30 || echo "(none)"
