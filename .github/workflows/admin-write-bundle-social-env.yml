name: Admin — Write bundle.social env vars to VM

# Push the bundle.social API key + per-platform publish switches to the VM .env
# and restart pm2.
#
# The API key comes from a GitHub Secret, never from a workflow input —
# workflow_dispatch inputs are recorded in the run metadata in plaintext.
#
# Prerequisites (USER ACTION):
#   1. Sign up at https://bundle.social and create an API key in the dashboard
#      (Settings → API Keys). It looks like `pk_live_...`.
#   2. Store it as a repo secret — this prompts, so the key never lands in
#      shell history:
#        gh secret set BUNDLE_SOCIAL_API_KEY
#   3. Run THIS workflow and pick which platforms route to bundle.social.
#
# Rollback: re-run with every platform set to "pipedream". The Pipedream code
# path is untouched, so publishing reverts immediately after the restart.

on:
  workflow_dispatch:
    inputs:
      facebook:
        description: "Facebook 發布走哪個供應商"
        required: true
        default: "pipedream"
        type: choice
        options: [pipedream, bundle]
      instagram:
        description: "Instagram 發布走哪個供應商"
        required: true
        default: "pipedream"
        type: choice
        options: [pipedream, bundle]
      linkedin:
        description: "LinkedIn 發布走哪個供應商"
        required: true
        default: "pipedream"
        type: choice
        options: [pipedream, bundle]

jobs:
  write-env:
    runs-on: ubuntu-latest
    steps:
      - name: Write bundle.social env to VM and restart
        uses: appleboy/ssh-action@v1.0.3
        env:
          BUNDLE_SOCIAL_API_KEY: ${{ secrets.BUNDLE_SOCIAL_API_KEY }}
          PROVIDER_FACEBOOK:     ${{ inputs.facebook }}
          PROVIDER_INSTAGRAM:    ${{ inputs.instagram }}
          PROVIDER_LINKEDIN:     ${{ inputs.linkedin }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 90s
          envs: BUNDLE_SOCIAL_API_KEY,PROVIDER_FACEBOOK,PROVIDER_INSTAGRAM,PROVIDER_LINKEDIN
          script: |
            set -e
            ENV=/opt/onbrand/app/skills/ai-talent/.env
            if [ ! -f "$ENV" ]; then
              echo "❌ .env not found at $ENV"; exit 1
            fi
            cp "$ENV" "${ENV}.bak.$(date +%s)"

            upsert() {
              local KEY="$1"; local VAL="$2"
              if [ -z "$VAL" ]; then
                echo "  ⊘ $KEY (empty, skipped)"; return
              fi
              if grep -qE "^${KEY}=" "$ENV"; then
                sed -i "s|^${KEY}=.*|${KEY}=${VAL}|" "$ENV"
                echo "  ↻ $KEY (updated)"
              else
                echo "${KEY}=${VAL}" >> "$ENV"
                echo "  + $KEY (added)"
              fi
            }

            echo "════════════════════════════════════════════════════════"
            echo "  Writing bundle.social config to $ENV"
            echo "════════════════════════════════════════════════════════"

            if [ -z "$BUNDLE_SOCIAL_API_KEY" ]; then
              echo "❌ BUNDLE_SOCIAL_API_KEY secret is empty."
              echo "   Run: gh secret set BUNDLE_SOCIAL_API_KEY"
              exit 1
            fi
            # Length only — never echo the key itself.
            echo "  API key received (${#BUNDLE_SOCIAL_API_KEY} chars)"
            upsert BUNDLE_SOCIAL_API_KEY "$BUNDLE_SOCIAL_API_KEY"

            upsert PUBLISH_PROVIDER_FACEBOOK  "$PROVIDER_FACEBOOK"
            upsert PUBLISH_PROVIDER_INSTAGRAM "$PROVIDER_INSTAGRAM"
            upsert PUBLISH_PROVIDER_LINKEDIN  "$PROVIDER_LINKEDIN"

            echo ""
            echo "──── Effective switches ────"
            grep -E "^PUBLISH_PROVIDER" "$ENV" || echo "  (none)"

            echo ""
            echo "  Restarting pm2 onbrand..."
            pm2 restart onbrand --update-env 2>&1 | tail -3

            sleep 3
            curl -s -o /dev/null -w "  Health: HTTP %{http_code}\n" http://127.0.0.1:3101/health || true

            echo ""
            echo "✓ Done."
            echo "  Test at https://onbrand.sowork.ai/calendar?b=2958 —"
            echo "  connect should open a bundle.social portal tab, not a Pipedream iframe."
