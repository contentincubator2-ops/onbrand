name: Admin — fix 渠道→管道 in DB

# One-shot SQL UPDATE on existing rows where the squad seed wrote 渠道
# (China term) instead of 管道 (Taiwan term). Updates: squads.description,
# squads.name, agents.bio, workflows steps JSON. Source code already fixed
# in scripts/seed-local-squads.ts; this catches what's already in DB.
#
# Safe to re-run — only touches rows where 渠道 substring exists.

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 120s
          script: |
            set +e
            cd /opt/marketing-os/app/skills/ai-talent 2>/dev/null || cd /opt/marketing-os/skills/ai-talent
            set -a
            [ -f .env ] && . .env
            [ -f /opt/marketing-os/.env ] && . /opt/marketing-os/.env
            set +a
            DB_HOST_V=${DB_HOST:-127.0.0.1}
            DB_USER_V=${DB_USER:-root}
            DB_NAME_V=${DB_NAME:-mos_db}

            run_sql() {
              MYSQL_PWD="$DB_PASSWORD" mysql -h"$DB_HOST_V" -u"$DB_USER_V" "$DB_NAME_V" -t "$@"
            }

            echo "===== Audit: count of rows containing 渠道 ====="
            run_sql -e "
              SELECT 'squads.description' AS col, COUNT(*) AS n FROM squads WHERE description LIKE '%渠道%'
              UNION ALL
              SELECT 'squads.name',         COUNT(*) FROM squads WHERE name        LIKE '%渠道%'
              UNION ALL
              SELECT 'agents.bio',          COUNT(*) FROM agents WHERE bio         LIKE '%渠道%'
              UNION ALL
              SELECT 'agents.title',        COUNT(*) FROM agents WHERE title       LIKE '%渠道%'
              UNION ALL
              SELECT 'agents.primarySkill', COUNT(*) FROM agents WHERE primarySkill LIKE '%渠道%';
            "

            echo ""
            echo "===== Apply UPDATE (replace 渠道 → 管道) ====="
            run_sql -e "
              UPDATE squads SET description = REPLACE(description, '渠道', '管道') WHERE description LIKE '%渠道%';
              UPDATE squads SET name        = REPLACE(name,        '渠道', '管道') WHERE name        LIKE '%渠道%';
              UPDATE agents SET bio         = REPLACE(bio,         '渠道', '管道') WHERE bio         LIKE '%渠道%';
              UPDATE agents SET title       = REPLACE(title,       '渠道', '管道') WHERE title       LIKE '%渠道%';
              UPDATE agents SET primarySkill = REPLACE(primarySkill, '渠道', '管道') WHERE primarySkill LIKE '%渠道%';
            "

            echo ""
            echo "===== Audit AFTER ====="
            run_sql -e "
              SELECT 'squads.description' AS col, COUNT(*) AS remaining FROM squads WHERE description LIKE '%渠道%'
              UNION ALL
              SELECT 'squads.name',         COUNT(*) FROM squads WHERE name        LIKE '%渠道%'
              UNION ALL
              SELECT 'agents.bio',          COUNT(*) FROM agents WHERE bio         LIKE '%渠道%'
              UNION ALL
              SELECT 'agents.title',        COUNT(*) FROM agents WHERE title       LIKE '%渠道%'
              UNION ALL
              SELECT 'agents.primarySkill', COUNT(*) FROM agents WHERE primarySkill LIKE '%渠道%';
            "

            echo ""
            echo "===== Done ====="
