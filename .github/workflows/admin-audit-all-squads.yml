name: Admin — Audit All Squads (Lead-Methodology Alignment)

# Dumps every squad's id/slug/methodology + current Lead agent's
# name/primarySkill/specialty to stdout. Used to identify squads whose
# Lead is a mismatch (e.g. SEO strategist leading brand-positioning).
#
# Read-only — no DB writes.

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 600s
          envs: GH_TOKEN
          script: |
            set -e
            APP=/opt/marketing-os/app
            AI=$APP/skills/ai-talent

            echo "===== Step 1: Pull latest main ====="
            REPO="https://x-access-token:${GH_TOKEN}@github.com/contentincubator2-ops/Marketing-OS.git"
            cd "$APP"
            git remote set-url origin "$REPO"
            git fetch origin main
            git reset --hard origin/main
            echo "Commit: $(git log --oneline -1)"

            echo ""
            echo "===== Step 2: Run audit ====="
            cd "$AI"
            npx tsx scripts/audit-all-squad-leads.ts 2>&1 | tail -400

            echo ""
            echo "===== Done ====="
