name: Admin - seed FB monthly calendar squad
on:
  workflow_dispatch:
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 120s
          script: |
            set -a
            [ -f /opt/marketing-os/.env ] && . /opt/marketing-os/.env
            [ -f /opt/marketing-os/app/skills/ai-talent/.env ] && . /opt/marketing-os/app/skills/ai-talent/.env
            set +a
            cd /opt/marketing-os/app/skills/ai-talent 2>/dev/null || cd /opt/marketing-os/skills/ai-talent

            echo "=== Pre-flight: confirm 6 agents exist ==="
            DB_HOST_V=${DB_HOST:-127.0.0.1}
            DB_USER_V=${DB_USER:-root}
            DB_NAME_V=${DB_NAME:-mos_db}
            MYSQL_PWD="$DB_PASSWORD" mysql -h"$DB_HOST_V" -u"$DB_USER_V" "$DB_NAME_V" -t -e "
              SELECT id, slug, name, englishName, layer, aiModel
                FROM agents
               WHERE id IN (180159, 239180, 239181, 239182, 239183, 239184)
               ORDER BY id;"

            echo ""
            echo "=== Run squad seeder ==="
            timeout 90 npx tsx scripts/seed-fb-monthly-calendar-squad.ts 2>&1

            echo ""
            echo "=== Inspect inserted squad ==="
            MYSQL_PWD="$DB_PASSWORD" mysql -h"$DB_HOST_V" -u"$DB_USER_V" "$DB_NAME_V" -t -e "
              SELECT id, slug, name, tier, strategy_layer, is_active, is_approved,
                     JSON_LENGTH(agents) AS agent_count,
                     JSON_LENGTH(steps) AS step_count
                FROM squads
               WHERE slug = 'fb-monthly-calendar-pulizzi';"

            echo ""
            echo "=== Steps overview ==="
            MYSQL_PWD="$DB_PASSWORD" mysql -h"$DB_HOST_V" -u"$DB_USER_V" "$DB_NAME_V" -t -e "
              SELECT
                JSON_EXTRACT(steps, CONCAT('\$[', n.idx, '].order')) AS \`order\`,
                JSON_UNQUOTE(JSON_EXTRACT(steps, CONCAT('\$[', n.idx, '].name'))) AS step_name,
                JSON_UNQUOTE(JSON_EXTRACT(steps, CONCAT('\$[', n.idx, '].outputKind'))) AS output_kind,
                JSON_UNQUOTE(JSON_EXTRACT(steps, CONCAT('\$[', n.idx, '].assignedAgentName'))) AS agent,
                JSON_UNQUOTE(JSON_EXTRACT(steps, CONCAT('\$[', n.idx, '].aiModel'))) AS model
                FROM squads s,
                     (SELECT 0 AS idx UNION SELECT 1 UNION SELECT 2 UNION SELECT 3 UNION SELECT 4 UNION SELECT 5 UNION SELECT 6) n
               WHERE s.slug = 'fb-monthly-calendar-pulizzi'
                 AND n.idx < JSON_LENGTH(s.steps);"

            echo "Done"
