name: "Ops — Training demo stats (read-only)"

# 2026-07-23 (CJ: IRIS/iris girl 教育訓練 7/27): pull citable, non-sensitive
# aggregates + the Lativ showcase inventory for the 3-hour course deck.
# Read-only. No client PII, no output bodies beyond short previews.

on:
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Demo stats
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 90s
          script: |
            set +e
            source /opt/onbrand/app/skills/ai-talent/.env 2>/dev/null || true
            H="${LOCAL_DB_HOST:-127.0.0.1}"; U="${LOCAL_DB_USER:-mos_user}"
            P="${LOCAL_DB_PASSWORD}"; D="${LOCAL_DB_NAME:-mos_db}"
            Q() { mysql -h"$H" -u"$U" -p"$P" "$D" -e "$1"; }

            echo "===== 1. AI agent 總數（課堂可引用）====="
            Q "SELECT COUNT(*) AS total_agents FROM agents;"
            Q "SELECT COUNT(DISTINCT title) AS distinct_roles FROM agents;"

            echo "===== 2. 品牌清單 + 定位完成度（挑示範品牌用；名字截短）====="
            Q "DESCRIBE brands;" | head -25
            Q "SELECT id, LEFT(name,20) AS name,
                      positioning IS NOT NULL AS has_positioning,
                      brand_colors IS NOT NULL AS has_colors
               FROM brands ORDER BY id DESC LIMIT 12;"

            echo "===== 3. 產出總量 + 近 7 天（展示活躍度）====="
            Q "SELECT COUNT(*) AS total_outputs FROM mission_outputs;"
            Q "SELECT COUNT(*) AS last7d FROM mission_outputs
               WHERE createdAt >= NOW() - INTERVAL 7 DAY;"

            echo "===== 4. Lativ 示範素材盤點（定位段落 + 有圖產出）====="
            Q "SELECT id, LEFT(name,20) AS name FROM brands WHERE name LIKE '%Lativ%' OR name LIKE '%lativ%';"
            Q "SELECT mo.id, mo.createdAt, LEFT(mo.content,60) AS preview,
                      mo.metadata LIKE '%imageUrl%' AS has_image
               FROM mission_outputs mo
               JOIN missions m ON m.id = mo.missionId
               JOIN brands b ON b.id = m.brandId
               WHERE (b.name LIKE '%Lativ%' OR b.name LIKE '%lativ%')
                 AND mo.status != 'archived'
               ORDER BY mo.id DESC LIMIT 6;"

            echo "===== 5. 品牌色展示（Lativ palette hex）====="
            Q "SELECT LEFT(name,20) AS name,
                      LEFT(JSON_EXTRACT(brand_colors,'\$'), 400) AS colors
               FROM brands WHERE name LIKE '%Lativ%' OR name LIKE '%lativ%' LIMIT 1\G"

            echo "===== 6. IRIS / Iris Girls 抓取的產品清單（品質檢查）====="
            Q "SELECT p.id, b.name AS brand, LEFT(p.name,40) AS product,
                      JSON_EXTRACT(p.positioning,'\$.imageUrl') IS NOT NULL AS hasImg,
                      JSON_EXTRACT(p.positioning,'\$.core') IS NOT NULL AS hasDeepPositioning
               FROM products p JOIN brands b ON b.id = p.brandId
               WHERE p.brandId IN (2956, 2957)
               ORDER BY p.brandId, p.id;"
            Q "SELECT brandId, status, phase FROM product_discovery_jobs
               WHERE brandId IN (2956, 2957) ORDER BY id DESC LIMIT 4;"

            echo "===== 7. IRIS / Iris Girls 定位品質核對（課前審閱用）====="
            for BID in 2956 2957; do
              echo "--- brand $BID ---"
              Q "SELECT name,
                        LEFT(JSON_UNQUOTE(JSON_EXTRACT(positioning,'\$.goldenCircle.why')),200)  AS why,
                        LEFT(JSON_UNQUOTE(JSON_EXTRACT(positioning,'\$.goldenCircle.how')),200)  AS how,
                        LEFT(JSON_UNQUOTE(JSON_EXTRACT(positioning,'\$.goldenCircle.what')),150) AS what
                 FROM brands WHERE id = $BID\G"
              Q "SELECT LEFT(JSON_UNQUOTE(JSON_EXTRACT(positioning,'\$.tagline.zhTagline')),80)          AS tagline,
                        LEFT(JSON_UNQUOTE(JSON_EXTRACT(positioning,'\$.differentiation.summary')),260)   AS diff,
                        LEFT(JSON_UNQUOTE(JSON_EXTRACT(positioning,'\$.voice.tone')),200)                AS voice_tone,
                        LEFT(JSON_UNQUOTE(JSON_EXTRACT(positioning,'\$.audience.secondary')),200)        AS audience_secondary
                 FROM brands WHERE id = $BID\G"
            done
            exit 0
