name: Admin — Write LINE + agent API secrets to the VM

# 2026-09-18：LINE Official Account 串接用的兩個憑證。
#
# 為什麼不用既有的 admin-write-env-vars.yml：那支是 workflow_dispatch + 純文字
# input，輸入值會原樣顯示在 Actions 的執行頁面，任何有 repo 讀權限的人都看得到。
# 對 PIAPI_KEY 這類還可以，對「能冒充整個官方帳號對所有好友發訊息」的憑證不行。
#
# 這支改成從 GitHub repository secrets 讀，GitHub 會在 log 裡自動遮成 ***，
# 值從頭到尾不經過對話、不進 repo、不出現在執行紀錄。
#
# 先做這件事（Settings → Secrets and variables → Actions → New repository secret）：
#   LINE_CHANNEL_ACCESS_TOKEN   ← Messaging API 分頁，長效 token
#   LINE_CHANNEL_SECRET         ← Basic settings 分頁，webhook 驗簽用（跟上面不同組）
# 兩個都設好之後再推這個檔案，push 就會執行。
#
# 沒設 secret 就跑：會明講缺哪一個然後停下，不會寫入半套。

on:
  push:
    paths:
      - '.github/workflows/admin-write-line-secrets.yml'

jobs:
  write:
    name: prod VM
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check both secrets are set
        env:
          TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
        run: |
          missing=""
          [ -z "$TOKEN" ]  && missing="$missing LINE_CHANNEL_ACCESS_TOKEN"
          [ -z "$SECRET" ] && missing="$missing LINE_CHANNEL_SECRET"
          if [ -n "$missing" ]; then
            echo "✗ 尚未設定 repository secret:$missing"
            echo "  Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "✓ both secrets present (values masked by GitHub)"

      - name: Write to VM .env and restart pm2
        uses: appleboy/ssh-action@v1.0.3
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          AGENT_API_KEY_INPUT: ${{ secrets.AGENT_API_KEY }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 3m
          envs: LINE_CHANNEL_ACCESS_TOKEN,LINE_CHANNEL_SECRET,AGENT_API_KEY_INPUT
          script: |
            set -e
            ENV_FILE=/opt/onbrand/app/skills/ai-talent/.env
            [ -f "$ENV_FILE" ] || { echo "✗ .env not found at $ENV_FILE"; exit 1; }

            # upsert：有就換值，沒有就附加。用 printf %s 寫，避免 token 裡的
            # 反斜線 / 斜線被 shell 或 sed 當成跳脫字元 —— LINE 的 token 是
            # base64，一定會出現 / 和 +。
            upsert() {
              key="$1"; val="$2"
              tmp="$(mktemp)"
              grep -v "^${key}=" "$ENV_FILE" > "$tmp" || true
              printf '%s=%s\n' "$key" "$val" >> "$tmp"
              mv "$tmp" "$ENV_FILE"
            }
            upsert LINE_CHANNEL_ACCESS_TOKEN "$LINE_CHANNEL_ACCESS_TOKEN"
            upsert LINE_CHANNEL_SECRET       "$LINE_CHANNEL_SECRET"
            # 這兩個不是憑證，是「這個 OA 代表哪個品牌、用誰的額度計費」。
            # 明碼寫在這裡是刻意的：出錯時要能一眼看出綁到誰。
            # 2964 = 媽爹講故事，1238976 = marketing@momdadstory.com
            upsert LINE_BIND_BRAND_ID 2964
            upsert LINE_BIND_USER_ID  1238976

            # 2026-09-18 Hermes → OnBrand 任務 API 的金鑰。
            #
            # 就地產生、就地留著：這把金鑰從頭到尾不經過對話、不進 GitHub
            # secret、不出現在任何 log。Hermes 跟 OnBrand 跑在同一台機器上，
            # 沒有任何理由讓它離開這台機器。
            #
            # 兩種來源，優先吃 repository secret：
            #   有 secret → 用它（輪替就是更新 secret 再重跑這支）
            #   沒 secret → VM 上就地產生，誰都不必看到
            # 兩條路都不會把金鑰寫進 Actions log：secret 由 GitHub 自動遮罩，
            # 就地產生的那把根本沒離開過這台機器。
            if [ -n "$AGENT_API_KEY_INPUT" ]; then
              upsert AGENT_API_KEY "$AGENT_API_KEY_INPUT"
              echo "AGENT_API_KEY: 取自 repository secret"
            elif grep -q "^AGENT_API_KEY=" "$ENV_FILE"; then
              echo "AGENT_API_KEY: 已存在，保留不動"
            else
              upsert AGENT_API_KEY "$(openssl rand -hex 32)"
              echo "AGENT_API_KEY: 已在 VM 上產生（64 字元）"
            fi
            # 品牌白名單。沒有這道閘門，金鑰外流就能把帳記到任何品牌頭上。
            upsert AGENT_API_BRAND_IDS 2964
            chmod 600 "$ENV_FILE"

            # 只印長度與尾四碼，足以確認「寫進去的是我剛設的那一組」，
            # 又不會把憑證留在執行紀錄裡。
            for k in LINE_CHANNEL_ACCESS_TOKEN LINE_CHANNEL_SECRET AGENT_API_KEY; do
              v="$(grep "^${k}=" "$ENV_FILE" | head -1 | cut -d= -f2-)"
              echo "$k: ${#v} chars, ends …${v: -4}"
            done

            pm2 restart onbrand --update-env >/dev/null 2>&1 || pm2 restart all --update-env
            echo "✓ written and pm2 restarted"
