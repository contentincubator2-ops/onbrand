name: Ops — Find KOL specialist agents
on: { workflow_dispatch: {} }
jobs:
  q:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 3
    steps:
      - name: query agents
        run: |
          set -e
          cd /opt/onbrand/app/skills/ai-talent
          set -a; source .env 2>/dev/null; set +a
          node --import tsx -e "
            (async () => {
              const { default: pool } = await import('./server/localDb.ts');
              const [rows] = await pool.execute(
                \`SELECT id, name, title,
                        CHAR_LENGTH(COALESCE(specialty,'')) AS spLen
                   FROM agents
                  WHERE title LIKE '%KOL%' OR title LIKE '%Influencer%'
                     OR title LIKE '%Word-of-Mouth%' OR title LIKE '%網紅%'
                     OR title LIKE '%Creator%' OR title LIKE '%Community%'
                     OR specialty LIKE '%KOL%' OR specialty LIKE '%influencer%'
                     OR specialty LIKE '%網紅%' OR specialty LIKE '%口碑%'
                  ORDER BY id LIMIT 60\`);
              for (const r of rows) console.log('AGENT', r.id, '|', r.name, '|', r.title, '| spLen', r.spLen);
              console.log('TOTAL', rows.length);
            })().catch(e => { console.error(e); process.exit(1); });
          "
