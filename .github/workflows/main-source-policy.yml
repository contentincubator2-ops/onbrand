name: Main Source Policy

# Production promotions may originate from the shared dev branch or an
# explicitly named release/hotfix branch. Review and CI requirements remain
# enforced separately by the main branch rules.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-source:
    name: Validate main source
    runs-on: ubuntu-24.04
    steps:
      - name: Reject unsupported source branches
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            dev|release/*|hotfix/*)
              echo "Allowed source branch: $HEAD_REF"
              ;;
            *)
              echo "Only dev, release/*, or hotfix/* pull requests may merge into main."
              exit 1
              ;;
          esac
