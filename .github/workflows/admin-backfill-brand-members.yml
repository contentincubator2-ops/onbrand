name: Admin — backfill brand_members for orphan brands

# One-shot: every brand without a brand_members row gets one
# (creator as 'owner'). Caused by brand.create historically not
# auto-inserting into brand_members; CJ caught 2026-04-30 when the
# event-create modal had empty brand picker.
#
# Idempotent — only inserts where missing.

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            set +e
            cd /opt/marketing-os/app/skills/ai-talent 2>/dev/null || cd /opt/marketing-os/skills/ai-talent
            set -a
            [ -f .env ] && . .env
            [ -f /opt/marketing-os/.env ] && . /opt/marketing-os/.env
            set +a
            DB_HOST_V=${DB_HOST:-127.0.0.1}
            DB_USER_V=${DB_USER:-root}
            DB_NAME_V=${DB_NAME:-mos_db}

            run_sql() {
              MYSQL_PWD="$DB_PASSWORD" mysql -h"$DB_HOST_V" -u"$DB_USER_V" "$DB_NAME_V" -t "$@"
            }

            echo "===== Audit: orphan brands (no brand_members row) ====="
            run_sql -e "
              SELECT b.id, b.name, b.userId AS creatorId, b.createdAt
                FROM brands b
                LEFT JOIN brand_members bm
                  ON bm.brandId = b.id AND bm.userId = b.userId
               WHERE bm.id IS NULL
               ORDER BY b.createdAt DESC
               LIMIT 50;
            "

            echo ""
            echo "===== Backfill: insert creator as 'owner' for each orphan ====="
            run_sql -e "
              INSERT INTO brand_members (brandId, userId, role, addedBy)
              SELECT b.id, b.userId, 'owner', b.userId
                FROM brands b
                LEFT JOIN brand_members bm
                  ON bm.brandId = b.id AND bm.userId = b.userId
               WHERE bm.id IS NULL;
            "

            echo ""
            echo "===== Audit AFTER ====="
            run_sql -e "
              SELECT 'remaining orphans' AS metric, COUNT(*) AS n
                FROM brands b
                LEFT JOIN brand_members bm
                  ON bm.brandId = b.id AND bm.userId = b.userId
               WHERE bm.id IS NULL;
            "

            echo ""
            echo "===== Done ====="
