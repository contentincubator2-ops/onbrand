name: Admin - Add tagline + savedSquadFlow to missions (mos_db)

# Adds columns to `missions` table in mos_db (localhost):
#   - tagline        VARCHAR(255)  品牌定位標語
#   - subTagline     VARCHAR(255)  品牌定位副標語
#   - savedSquadFlow TEXT          User-customized squad steps JSON
#
# mos_db is now the single source of truth (sowork_db dependency removed).
# Safe to re-run: uses INFORMATION_SCHEMA idempotency check.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type MIGRATE to add columns (anything else = DRY_RUN DESCRIBE only)'
        required: true
        default: 'DRY_RUN'

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and apply migration
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -e
            cd /home/azureuser/marketing-os

            # mos_db — always localhost
            MOS="mysql -h localhost -u mos_user -pmos_secure_2026 mos_db"
            CONFIRM="${{ github.event.inputs.confirm }}"

            echo "======================================================"
            echo "Mission Extras Migration → mos_db (mode=$CONFIRM)"
            echo "======================================================"
            echo ""
            echo "=== Current missions table schema ==="
            $MOS -e "DESCRIBE missions;" 2>&1

            if [ "$CONFIRM" = "MIGRATE" ]; then
              echo ""
              echo "=== Applying migration ==="

              # tagline
              HAS_TAGLINE=$($MOS -N -B -e "SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA='mos_db' AND TABLE_NAME='missions' AND COLUMN_NAME='tagline';" 2>/dev/null)
              if [ "$HAS_TAGLINE" = "0" ]; then
                $MOS -e "ALTER TABLE missions ADD COLUMN tagline VARCHAR(255) DEFAULT NULL COMMENT '品牌定位標語';" 2>&1
                echo "  + tagline column added"
              else
                echo "  = tagline already exists, skipping"
              fi

              # subTagline
              HAS_SUB=$($MOS -N -B -e "SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA='mos_db' AND TABLE_NAME='missions' AND COLUMN_NAME='subTagline';" 2>/dev/null)
              if [ "$HAS_SUB" = "0" ]; then
                $MOS -e "ALTER TABLE missions ADD COLUMN subTagline VARCHAR(255) DEFAULT NULL COMMENT '品牌定位副標語';" 2>&1
                echo "  + subTagline column added"
              else
                echo "  = subTagline already exists, skipping"
              fi

              # savedSquadFlow
              HAS_FLOW=$($MOS -N -B -e "SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA='mos_db' AND TABLE_NAME='missions' AND COLUMN_NAME='savedSquadFlow';" 2>/dev/null)
              if [ "$HAS_FLOW" = "0" ]; then
                $MOS -e "ALTER TABLE missions ADD COLUMN savedSquadFlow TEXT DEFAULT NULL COMMENT 'User-customized squad steps JSON';" 2>&1
                echo "  + savedSquadFlow column added"
              else
                echo "  = savedSquadFlow already exists, skipping"
              fi

              echo ""
              echo "=== Post-migration schema ==="
              $MOS -e "DESCRIBE missions;" 2>&1

              echo ""
              echo "=== Restarting pm2 ==="
              pm2 restart marketing-os 2>&1 || pm2 restart all 2>&1
              echo "pm2 restart triggered"

              echo ""
              echo "======================================================"
              echo "Migration complete."
              echo "======================================================"
            else
              echo ""
              echo "DRY_RUN only. Run with confirm=MIGRATE to apply."
              echo "======================================================"
            fi
