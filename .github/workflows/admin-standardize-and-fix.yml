name: Admin — Standardize (vendor harvest) + fix all gaps

# 4-stage:
#   ① Harvest SKILL.md from anthropics/skills + google/skills (open standard)
#   ② Normalize orphan slugs (alias) + expand marketing canon
#   ③ Realign leads + step-aware skill backfill + residual
#   ④ Final 6-axis verify

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (preview only)"
        type: boolean
        default: true

jobs:
  standardize:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 1800s
          envs: GH_TOKEN,DRY_RUN
          script: |
            set -e
            APP=/opt/marketing-os/app
            REPO="https://x-access-token:${GH_TOKEN}@github.com/contentincubator2-ops/Marketing-OS.git"
            cd "$APP"
            git remote set-url origin "$REPO"
            git fetch origin main
            git reset --hard origin/main
            cd "$APP/skills/ai-talent"
            if [ ! -d node_modules ]; then npm install --legacy-peer-deps --no-audit --no-fund 2>&1 | tail -5; fi
            DRY=""
            if [ "$DRY_RUN" = "true" ]; then DRY="--dry-run"; fi

            echo "════════════════════════════════════════════════════════════════"
            echo "  ① Harvest vendor SKILL.md (anthropics + google)  ${DRY}"
            echo "════════════════════════════════════════════════════════════════"
            GH_TOKEN="${GH_TOKEN}" npx tsx scripts/harvest-vendor-skills.ts $DRY
            echo ""
            echo "════════════════════════════════════════════════════════════════"
            echo "  ② Normalize + expand catalog + lead realign + step backfill"
            echo "════════════════════════════════════════════════════════════════"
            npx tsx scripts/normalize-skills-and-fix-gaps.ts $DRY
            echo ""
            echo "════════════════════════════════════════════════════════════════"
            echo "  ③ Final 6-axis verify"
            echo "════════════════════════════════════════════════════════════════"
            npx tsx scripts/audit-full-coverage-verification.ts
