name: Admin — Audit Brand-Type Squads

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            MOS_USER="mos_user"
            MOS_PASS="mos_secure_2026"
            MOS_DB="mos_db"

            echo "=== 1. 10 個 brand-workspace squads 完整欄位狀態（每欄位空值計數）==="
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
              SELECT
                COUNT(*) as total,
                SUM(slug IS NULL OR slug='') as miss_slug,
                SUM(name IS NULL OR name='') as miss_name,
                SUM(name_en IS NULL OR name_en='') as miss_name_en,
                SUM(description IS NULL OR description='') as miss_desc,
                SUM(industry_key IS NULL OR industry_key='') as miss_industry,
                SUM(market IS NULL OR market='') as miss_market,
                SUM(agents IS NULL OR JSON_LENGTH(agents)=0) as miss_agents,
                SUM(use_cases IS NULL OR JSON_LENGTH(use_cases)=0) as miss_usecases,
                SUM(tags IS NULL OR JSON_LENGTH(tags)=0) as miss_tags,
                SUM(missionType IS NULL OR missionType='') as miss_missionType,
                SUM(industry_focus IS NULL OR industry_focus='') as miss_industry_focus,
                SUM(deliverable_format IS NULL OR deliverable_format='') as miss_deliverable,
                SUM(workspace IS NULL OR workspace='') as miss_workspace,
                SUM(methodology IS NULL OR methodology='') as miss_method,
                SUM(output_formats IS NULL OR output_formats='') as miss_output_fmt,
                SUM(required_integrations IS NULL OR required_integrations='') as miss_integrations,
                SUM(token=0) as miss_token,
                SUM(showcases IS NULL OR showcases='' OR showcases='[]') as miss_showcases,
                SUM(embedding IS NULL) as miss_embedding,
                SUM(steps IS NULL OR JSON_LENGTH(steps)=0) as miss_steps
              FROM squads WHERE is_active=1 AND workspace LIKE '%brand%'\G
            " 2>&1 | head -40

            echo ""
            echo "=== 2. Per-squad 狀態（名稱+每欄位有無）==="
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
              SELECT slug,
                CASE WHEN name_en='' OR name_en IS NULL THEN '❌' ELSE '✓' END as name_en,
                CASE WHEN use_cases IS NULL OR JSON_LENGTH(use_cases)=0 THEN '❌' ELSE '✓' END as use_cases,
                CASE WHEN tags IS NULL OR JSON_LENGTH(tags)=0 THEN '❌' ELSE '✓' END as tags,
                CASE WHEN industry_focus='' OR industry_focus IS NULL THEN '❌' ELSE '✓' END as industry_focus,
                CASE WHEN deliverable_format='' OR deliverable_format IS NULL THEN '❌' ELSE '✓' END as deliverable,
                CASE WHEN output_formats='' OR output_formats IS NULL THEN '❌' ELSE '✓' END as output_fmt,
                CASE WHEN required_integrations='' OR required_integrations IS NULL THEN '❌' ELSE '✓' END as integrations,
                CASE WHEN showcases IS NULL OR showcases='[]' THEN '❌' ELSE '✓' END as showcases,
                CASE WHEN embedding IS NULL THEN '❌' ELSE '✓' END as embedding,
                JSON_LENGTH(steps) as steps
              FROM squads WHERE is_active=1 AND workspace LIKE '%brand%'
              ORDER BY id;
            " 2>&1
