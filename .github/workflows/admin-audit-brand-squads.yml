name: Admin — Audit Brand-Type Squads

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            MOS_USER="mos_user"
            MOS_PASS="mos_secure_2026"
            MOS_DB="mos_db"

            echo "=== 1. 所有 brand-positioning workspace 的 squads ==="
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
              SELECT id, slug, name, JSON_LENGTH(steps) as step_count,
                     CASE WHEN methodology IS NULL OR methodology='' THEN 'EMPTY' ELSE 'OK' END as method_status
              FROM squads
              WHERE is_active=1 AND workspace LIKE '%brand%'
              ORDER BY step_count DESC NULLS LAST, id;
            " 2>&1 | head -40

            echo ""
            echo "=== 2. Steps 完整度統計 ==="
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
              SELECT
                CASE
                  WHEN steps IS NULL OR JSON_LENGTH(steps) = 0 THEN 'NO_STEPS'
                  WHEN JSON_LENGTH(steps) < 3 THEN 'TOO_FEW_<3'
                  WHEN JSON_LENGTH(steps) < 5 THEN '3-4'
                  WHEN JSON_LENGTH(steps) < 8 THEN '5-7'
                  ELSE '8+'
                END as step_range,
                COUNT(*) as squads
              FROM squads
              WHERE is_active=1 AND workspace LIKE '%brand%'
              GROUP BY step_range
              ORDER BY step_range;
            " 2>&1

            echo ""
            echo "=== 3. Brand squads 完整欄位狀態 ==="
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
              SELECT
                SUM(CASE WHEN name IS NULL OR name='' THEN 1 ELSE 0 END) as missing_name,
                SUM(CASE WHEN description IS NULL OR description='' THEN 1 ELSE 0 END) as missing_desc,
                SUM(CASE WHEN methodology IS NULL OR methodology='' THEN 1 ELSE 0 END) as missing_method,
                SUM(CASE WHEN agents IS NULL OR JSON_LENGTH(agents) = 0 THEN 1 ELSE 0 END) as missing_agents,
                SUM(CASE WHEN steps IS NULL OR JSON_LENGTH(steps) = 0 THEN 1 ELSE 0 END) as missing_steps,
                SUM(CASE WHEN showcases IS NULL OR showcases='' OR showcases='[]' THEN 1 ELSE 0 END) as missing_showcases,
                COUNT(*) as total_brand_squads
              FROM squads
              WHERE is_active=1 AND workspace LIKE '%brand%';
            " 2>&1
