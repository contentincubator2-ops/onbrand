name: Admin — Audit 12k agents + upgrade L1/L2 lead aiModel

# 1. Scan all 12,441 agents — per-field NULL/empty counts
# 2. Confirm agents is the canonical table (list sibling tables + FK refs)
# 3. Patch 20 L1+L2 lead agents: aiModel = claude-opus-4-6
#    (plus Mary Allen id=180797 for consistency)
# 4. Verify skills JSON depth on the 20 + Mary Allen

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY to patch aiModel on 21 lead agents. Type AUDIT for read-only scan.'
        required: true
        type: string
        default: 'AUDIT'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 180s
          script: |
            set -e
            cd /home/azureuser/marketing-os/skills/ai-talent
            DB_USER=$(grep -E '^DB_USER=' .env | cut -d= -f2- | tr -d '"' | tr -d "'")
            DB_PASS=$(grep -E '^DB_PASSWORD=' .env | cut -d= -f2- | tr -d '"' | tr -d "'")
            DB_NAME=$(grep -E '^DB_NAME=' .env | cut -d= -f2- | tr -d '"' | tr -d "'")
            CONFIRM="${{ inputs.confirm }}"

            mysql --host=127.0.0.1 --user="${DB_USER}" --password="${DB_PASS}" --default-character-set=utf8mb4 "${DB_NAME}" <<SQL
            SELECT '========== 1. agents schema (actual columns on VM) ==========' AS info;
            SELECT COLUMN_NAME, COLUMN_TYPE, IS_NULLABLE, COLUMN_DEFAULT
            FROM information_schema.COLUMNS
            WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'agents'
            ORDER BY ORDINAL_POSITION;

            SELECT '========== 2. all "agent-ish" tables (canonical = agents) ==========' AS info;
            SELECT TABLE_NAME, TABLE_ROWS
            FROM information_schema.TABLES
            WHERE TABLE_SCHEMA = DATABASE()
              AND (TABLE_NAME = 'agents'
                   OR TABLE_NAME LIKE 'agent_%'
                   OR TABLE_NAME LIKE '%_agents'
                   OR TABLE_NAME LIKE '%_agent')
            ORDER BY TABLE_NAME;

            SELECT '========== 3. FKs pointing at agents.id (downstream consumers) ==========' AS info;
            SELECT TABLE_NAME, COLUMN_NAME, CONSTRAINT_NAME
            FROM information_schema.KEY_COLUMN_USAGE
            WHERE TABLE_SCHEMA = DATABASE() AND REFERENCED_TABLE_NAME = 'agents'
            ORDER BY TABLE_NAME;

            SELECT '========== 4. 12k agents: per-field NULL/empty count ==========' AS info;
            SELECT
              COUNT(*)                                                                                AS total_agents,
              SUM(CASE WHEN isAvailable = 1 THEN 1 ELSE 0 END)                                        AS available,
              -- required / identity
              SUM(CASE WHEN slug IS NULL OR slug = '' THEN 1 ELSE 0 END)                              AS null_slug,
              SUM(CASE WHEN name IS NULL OR name = '' THEN 1 ELSE 0 END)                              AS null_name,
              SUM(CASE WHEN title IS NULL OR title = '' THEN 1 ELSE 0 END)                            AS null_title,
              SUM(CASE WHEN layer IS NULL THEN 1 ELSE 0 END)                                          AS null_layer,
              -- identity polish
              SUM(CASE WHEN englishName IS NULL OR englishName = '' THEN 1 ELSE 0 END)                AS null_english_name,
              SUM(CASE WHEN bio IS NULL OR bio = '' THEN 1 ELSE 0 END)                                AS null_bio,
              SUM(CASE WHEN avatarUrl IS NULL OR avatarUrl = '' THEN 1 ELSE 0 END)                    AS null_avatar,
              -- capability (the important ones)
              SUM(CASE WHEN primarySkill IS NULL OR primarySkill = '' THEN 1 ELSE 0 END)              AS null_primary_skill,
              SUM(CASE WHEN specialty IS NULL OR specialty = '' THEN 1 ELSE 0 END)                    AS null_specialty,
              SUM(CASE WHEN skills IS NULL OR skills = '' OR skills = '[]' THEN 1 ELSE 0 END)         AS null_skills,
              SUM(CASE WHEN aiModel IS NULL OR aiModel = '' THEN 1 ELSE 0 END)                        AS null_ai_model,
              -- context
              SUM(CASE WHEN industry IS NULL OR industry = '' THEN 1 ELSE 0 END)                      AS null_industry,
              SUM(CASE WHEN jobLevel IS NULL OR jobLevel = '' THEN 1 ELSE 0 END)                      AS null_job_level
            FROM agents;

            SELECT '========== 5. aiModel distribution across 12k agents ==========' AS info;
            SELECT COALESCE(NULLIF(aiModel, ''), '(NULL or empty)') AS aiModel,
                   COUNT(*) AS cnt
            FROM agents GROUP BY aiModel ORDER BY cnt DESC;

            SELECT '========== 6. 21 L1/L2 lead agents — BEFORE patch ==========' AS info;
            SELECT id, slug, name, primarySkill,
                   COALESCE(NULLIF(aiModel, ''), '(NULL)') AS aiModel,
                   JSON_LENGTH(skills) AS skill_count,
                   jobLevel,
                   CASE WHEN avatarUrl IS NULL OR avatarUrl='' THEN '(NULL)' ELSE 'has' END AS avatar
            FROM agents
            WHERE id IN (180797, 238844, 238845, 238846, 238847, 238848, 238849, 238850,
                         238851, 238852, 238853, 238854, 238855, 238856, 238857, 238858,
                         238859, 238860, 238861, 238862, 238843)
            ORDER BY id;
            SQL

            if [ "${CONFIRM}" = "APPLY" ]; then
              echo ""
              echo "========== PATCH: set aiModel='claude-opus-4-6' on L1/L2 leads + Mary Allen =========="
              mysql --host=127.0.0.1 --user="${DB_USER}" --password="${DB_PASS}" --default-character-set=utf8mb4 "${DB_NAME}" <<'SQL'
              UPDATE agents SET aiModel = 'claude-opus-4-6'
              WHERE id IN (
                180797,                                            -- Mary Allen (brand-archetype lead)
                238844, 238845, 238846, 238847, 238848,            -- L1 leads (5)
                238849, 238850, 238851, 238852,                    -- L1 leads (4)
                238853, 238854, 238855, 238856, 238857,            -- L2 leads (5)
                238858, 238859, 238860, 238861, 238862             -- L2 leads (5)
              );
              SELECT ROW_COUNT() AS leads_upgraded_to_opus;

              SELECT '========== AFTER patch: verify ==========' AS info;
              SELECT id, slug, name, primarySkill, aiModel, JSON_LENGTH(skills) AS skill_count
              FROM agents
              WHERE id IN (180797, 238844, 238845, 238846, 238847, 238848, 238849, 238850,
                           238851, 238852, 238853, 238854, 238855, 238856, 238857, 238858,
                           238859, 238860, 238861, 238862)
              ORDER BY id;
SQL
              echo ""
              echo "[vm] L1/L2 lead aiModel upgraded to claude-opus-4-6."
            else
              echo ""
              echo "[vm] AUDIT mode only (confirm=AUDIT). Re-run with confirm=APPLY to patch."
            fi
