name: "Ops — Check deployed shot-list contract (one-shot)"

# 2026-08-23: VM probe 顯示機制卡的分格腳本被黏成一行，但本機同一份程式碼
# 修得掉。這支把「VM 上到底跑的是什麼」抓回來：部署的 commit、合約檔是否
# 存在、偵測用的指紋字串是否真的在 template 裡、以及 orchestra 有沒有接線。
# 判斷完就可以刪。

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: [self-hosted, linux, vm-onbrand]
    timeout-minutes: 3
    steps:
      - name: Inspect deployed source
        run: |
          set +e
          APP=/opt/onbrand/app
          CORE=$APP/skills/ai-talent/server/_core

          echo "═══ 1. deployed commit ═══"
          cd $APP && git log --oneline -3

          echo ""
          echo "═══ 2. shotListContract.ts present? ═══"
          ls -la $CORE/shotListContract.ts 2>&1

          echo ""
          echo "═══ 3. orchestra wiring (expect 4+ hits) ═══"
          grep -n "isShotListTemplate\|normalizeShotList\|repairShotList\|shotListTask" \
            $CORE/quickTaskOrchestra.ts 2>&1 | head -20

          echo ""
          echo "═══ 4. marker string present in the TikTok pool? ═══"
          grep -c "每一格都照這五行寫" $CORE/quickTaskTikTok.ts 2>&1
          grep -n "每一格都照這五行寫" $CORE/shotListContract.ts 2>&1

          echo ""
          echo "═══ 5. does the contract actually fire for the 5 cards? ═══"
          cd $APP/skills/ai-talent
          node --import tsx -e '
            const { TT_30S_TASKS } = await import("./server/_core/quickTaskTikTok.ts");
            const { isShotListTemplate, normalizeShotList, countShots } =
              await import("./server/_core/shotListContract.ts");
            for (const id of ["tt-30-visual-illusion","tt-30-process-payoff","tt-30-beat-sync","tt-30-scale-reveal","tt-30-real-reaction"]) {
              const t = TT_30S_TASKS.find((x) => x.id === id);
              console.log(id, "found=" + !!t, "isShotList=" + (t ? isShotListTemplate(t) : "n/a"));
            }
            const glued = "[0.0-0.5s] 開場\n畫面：a\n動作：b\n聲音：c\n字卡：d [0.5-1.0s] 第二格\n畫面：e\n動作：f\n聲音：g\n字卡：h";
            console.log("glued shots=" + countShots(glued) + " → normalised shots=" + countShots(normalizeShotList(glued)));
          ' 2>&1

          echo ""
          echo "═══ 6. stale compiled artefacts that could shadow source? ═══"
          ls -la $APP/skills/ai-talent/dist/server/_core/quickTaskOrchestra.js 2>&1 || echo "no dist (good)"
