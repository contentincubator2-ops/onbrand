name: Admin — Probe Azure Foundry models (which actually work?)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 180s
          script: |
            set -e
            cd /opt/marketing-os/app/skills/ai-talent
            set -a; . ./.env; set +a

            ENDPOINT="${AZURE_FOUNDRY_PROJECT_ENDPOINT%/}/openai/v1/chat/completions"
            echo "endpoint: $ENDPOINT"
            echo

            for MODEL in "gpt-4o" "gpt-4o-mini" "gpt-4.1" "gpt-4.1-mini" "gpt-5.4-mini" "Kimi-K2.5" "DeepSeek-V3.2" "Mistral-Large-3"; do
              echo "── $MODEL ─────"
              RESP=$(curl -s --max-time 20 -X POST "$ENDPOINT" \
                -H "api-key: $AZURE_FOUNDRY_API_KEY" \
                -H "Content-Type: application/json" \
                -d "{\"model\":\"$MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"用 15 字內回答：母親節最好的禮物是什麼？\"}],\"max_tokens\":120}")
              # Show first 400 chars of response
              echo "$RESP" | head -c 400
              echo
              echo
            done
