name: Admin — Generate OG cover image

# CJ「幫我產一張具備 SoWork.ai 風格的 OG 圖」.
# Uses PiAPI Ideogram (best at in-image text) to produce a 1200×630
# share card. Saves to /opt/marketing-os/covers/og-onbrand-cover.png
# (served at /static/covers/og-onbrand-cover.png via the existing
# coversPrefix static handler).

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Variant seed (try a different one to regenerate)"
        required: false
        default: "1"

jobs:
  gen:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 5
    steps:
      - run: |
          set -e
          AI=/opt/marketing-os/app/skills/ai-talent
          set -a; source "$AI/.env" 2>/dev/null; set +a
          KEY="${PIAPI_KEY:-$PIAPI_API_KEY}"
          if [ -z "$KEY" ]; then echo "PIAPI_KEY missing"; exit 1; fi

          PROMPT='Editorial magazine cover banner, 1200×630 ratio, ultra-clean minimalist Notion-style design. Off-white background #FAFAFA with subtle warm cream paper texture. Generous negative space. Left side: large bold sans-serif text "OnBrand AI" in deep charcoal #171717 with the letter "O" rendered as a vivid linear gradient from purple #7C3AED to teal #00B4BC. Below "OnBrand AI" a smaller italic serif tagline "every post · on-brand" in muted graphite gray #525252. Right side: an elegant orbital constellation of 14 small dots arranged in a clean circular pattern, with one prominent featured dot at the top filled with the same purple-to-teal gradient and the other 13 dots in soft neutral gray. Tiny watermark "by SoWork" in deep gray at the bottom-right corner. Premium design-agency aesthetic, sophisticated typography hierarchy, no people, no photos, no decorative noise. Style references: Apple keynote slide, Linear product page, Notion landing page. Pure graphic design, vector-clean, print-quality.'

          echo "── submit Ideogram task ──"
          RESP=$(curl -s --max-time 30 -X POST "https://api.piapi.ai/api/v1/task" \
            -H "x-api-key: $KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc \
              --arg p "$PROMPT" \
              --arg seed "${{ github.event.inputs.seed }}" \
              '{model: "Qubico/flux1-schnell", task_type: "txt2img", input: {prompt: $p, width: 1216, height: 640, steps: 4, seed: ($seed | tonumber)}}')")
          echo "$RESP" | head -c 400
          echo ""

          TASK_ID=$(echo "$RESP" | jq -r '.data.task_id // .task_id // empty')
          if [ -z "$TASK_ID" ]; then echo "submit failed"; exit 1; fi
          echo "task_id: $TASK_ID"

          echo ""
          echo "── poll for completion ──"
          REMOTE_URL=""
          for i in $(seq 1 60); do
            sleep 2
            POLL=$(curl -s --max-time 10 "https://api.piapi.ai/api/v1/task/$TASK_ID" -H "x-api-key: $KEY")
            STATUS=$(echo "$POLL" | jq -r '.data.status // empty')
            echo "  attempt $i status=$STATUS"
            if [ "$STATUS" = "completed" ] || [ "$STATUS" = "success" ]; then
              REMOTE_URL=$(echo "$POLL" | jq -r '.data.output.image_url // .data.output.images[0].url // .data.output.images[0] // empty')
              break
            fi
            if [ "$STATUS" = "failed" ] || [ "$STATUS" = "error" ]; then
              echo "  ❌ task failed:"
              echo "$POLL" | head -c 600
              exit 1
            fi
          done

          if [ -z "$REMOTE_URL" ]; then echo "no image url returned"; exit 1; fi
          echo "  remote: $REMOTE_URL"

          echo ""
          echo "── download to /opt/marketing-os/covers/og-onbrand-cover.png ──"
          sudo mkdir -p /opt/marketing-os/covers
          sudo curl -sL "$REMOTE_URL" -o /opt/marketing-os/covers/og-onbrand-cover.png
          sudo chown azureuser:azureuser /opt/marketing-os/covers/og-onbrand-cover.png
          ls -la /opt/marketing-os/covers/og-onbrand-cover.png

          echo ""
          echo "── verify served via /static/covers/ ──"
          curl -s -o /dev/null -w "  http=%{http_code} size=%{size_download}\n" "http://localhost:3101/static/covers/og-onbrand-cover.png"

          echo ""
          echo "✓ OG image live at: https://onbrand.sowork.ai/static/covers/og-onbrand-cover.png"
