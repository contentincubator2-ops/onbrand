name: Admin — Rotate DB password
# 2026-07-02 (security): rotate LOCAL_DB_PASSWORD (mos_user) with zero SSH.
#
# HOW TO USE (all in browser):
#   1. Settings → Secrets and variables → Actions → New repository secret
#        Name:  NEW_DB_PASSWORD
#        Value: a strong password — USE ALPHANUMERIC ONLY (letters+digits),
#               no quotes / backslash / spaces (keeps SQL + .env safe).
#   2. Actions → this workflow → Run workflow.
#   3. After it succeeds, DELETE the NEW_DB_PASSWORD secret.
#
# The new password is read from the masked secret and is NEVER echoed.
# Order is fail-safe: ALTER → verify new password connects → update .env →
# restart pm2 → health check. If the verify step fails, .env/pm2 are left
# untouched so the app keeps running on its current pooled connections.
on: { workflow_dispatch: {} }

jobs:
  rotate:
    runs-on: [self-hosted, linux, vm-onbrand]
    timeout-minutes: 5
    env:
      NEWPASS: ${{ secrets.NEW_DB_PASSWORD }}
      ENV_FILE: /opt/onbrand/app/skills/ai-talent/.env
    steps:
      - name: Rotate
        run: |
          set -e
          # Belt-and-braces: mask the value in logs even though secrets are
          # auto-masked.
          echo "::add-mask::$NEWPASS"

          if [ -z "$NEWPASS" ]; then
            echo "❌ NEW_DB_PASSWORD secret is empty. Set it in Settings → Secrets first."
            exit 1
          fi
          case "$NEWPASS" in
            *[\'\"\\\ ]*)
              echo "❌ Password contains a quote/backslash/space. Use alphanumeric only and re-run."
              exit 1 ;;
          esac

          echo "── 1. ALTER USER (root via unix_socket) ──"
          printf "ALTER USER 'mos_user'@'localhost' IDENTIFIED BY '%s'; FLUSH PRIVILEGES;\n" "$NEWPASS" | sudo mysql
          echo "  ✓ password changed on DB"

          echo "── 2. Verify new password actually connects ──"
          if ! MYSQL_PWD="$NEWPASS" mysql -h localhost -u mos_user -e "SELECT 1;" >/dev/null 2>&1; then
            echo "❌ New password does NOT connect. .env NOT touched, pm2 NOT restarted."
            echo "   App still runs on existing connections. Re-run with a clean alphanumeric password."
            exit 1
          fi
          echo "  ✓ new password verified"

          echo "── 3. Update .env (backup first) ──"
          cp "$ENV_FILE" "${ENV_FILE}.bak.$(date +%s)"
          python3 - <<'PY'
          import os
          path = os.environ["ENV_FILE"]; p = os.environ["NEWPASS"]
          lines = open(path, encoding="utf-8").read().splitlines()
          out, found = [], False
          for ln in lines:
              if ln.startswith("LOCAL_DB_PASSWORD="):
                  out.append("LOCAL_DB_PASSWORD=" + p); found = True
              else:
                  out.append(ln)
          if not found:
              out.append("LOCAL_DB_PASSWORD=" + p)
          open(path, "w", encoding="utf-8").write("\n".join(out) + "\n")
          print("  ✓ .env LOCAL_DB_PASSWORD line", "replaced" if found else "appended")
          PY

          echo "── 4. Restart pm2 with new env ──"
          set -a; source "$ENV_FILE"; set +a
          pm2 restart onbrand --update-env
          sleep 6

          echo "── 5. Health check ──"
          curl -s http://127.0.0.1:3101/health || true
          echo ""
          if curl -s http://127.0.0.1:3101/health | grep -q '"db":"ok"'; then
            echo "✅ ROTATION COMPLETE — db:ok. Now delete the NEW_DB_PASSWORD secret."
          else
            echo "⚠️ Health check did not report db:ok. Check: pm2 logs onbrand --lines 30"
            echo "   .env already has the new password; try: pm2 restart onbrand --update-env"
            exit 1
          fi
