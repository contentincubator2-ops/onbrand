name: Admin — Check email config (Resend domain verification status)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 30s
          script: |
            cd /opt/marketing-os/app/skills/ai-talent
            echo "════════ Email env vars ════════"
            grep -E "^(RESEND_API_KEY|SENDGRID_API_KEY|EMAIL_FROM|EMAIL_SERVICE)" .env | sed 's/_API_KEY=.*/_API_KEY=<set>/' | sed 's/RESEND_API_KEY=.*/RESEND_API_KEY=<set>/'

            echo ""
            echo "════════ Resend API: list verified domains ════════"
            RESEND_KEY=$(grep "^RESEND_API_KEY=" .env | head -1 | cut -d= -f2-)
            if [ -n "$RESEND_KEY" ]; then
              curl -sS --max-time 10 \
                https://api.resend.com/domains \
                -H "Authorization: Bearer $RESEND_KEY" | python3 -m json.tool 2>&1 | head -40
            else
              echo "(no Resend key found)"
            fi

            echo ""
            echo "════════ pm2 recent email errors ════════"
            pm2 logs marketing-os --lines 100 --nostream --raw 2>&1 | grep -iE "resend|email.*fail|sendEmail" | tail -10
