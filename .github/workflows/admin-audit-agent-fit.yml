name: Admin — audit agent-fit (LLM judge)

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 600s
          envs: GH_TOKEN
          script: |
            set +e
            APP=/opt/marketing-os/app
            AI=$APP/skills/ai-talent
            cd "$APP"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/contentincubator2-ops/Marketing-OS.git"
            git fetch origin main 2>&1 | tail -3
            git reset --hard origin/main 2>&1 | tail -3
            cd "$AI"
            set -a; [ -f "$AI/.env" ] && . "$AI/.env"; set +a

            echo "===== Agent-fit audit ====="
            timeout 540 npx tsx scripts/audit-agent-fit.ts 2>&1 | tail -150

            echo ""
            echo "===== Full report (markdown) ====="
            cat /tmp/agent-fit-audit.md 2>/dev/null
