name: Admin — Full audit of all 146 task-assigned agents

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 120s
          script: |
            export MYSQL_PWD="mos_secure_2026"
            MYSQLT="mysql -h localhost -u mos_user mos_db -t --default-character-set=utf8mb4"

            IDS="24,26,29,32,35,30002,30003,30004,30005,30006,30008,30009,30011,30013,30014,30015,30016,30017,30018,30019,30020,60002,60005,60011,60012,60021,60022,60029,60030,60031,60033,60035,60036,60037,60038,60048,60055,60056,60060,60061,60063,60066,60068,60072,60073,90004,90005,90006,90031,90032,180003,180009,180039,180054,180062,180068,180143,180150,180157,180158,180159,180166,180167,180168,180172,180173,180175,180176,180186,180193,180196,180197,180199,180203,180797,210001,210011,210173,210252,210266,210303,210310,220001,220164,220506,220507,220508,220528,220529,220583,220584,220751,220752,220755,220862,220869,220870,220871,220915,220927,220949,221080,222204,222206,222211,222311,222392,222504,222638,222665,223197,223253,223755,223993,223995,223996,224000,224001,224005,224007,224054,224056,224059,224061,224067,224071,224079,224081,224086,224089,224094,224101,224114,224116,224121,224154,224156,224159,224161,224167,224171,224179,224196,238853,239023,239024"

            echo
            echo "════════════════════════════════════════════════════════"
            echo "  DISTRIBUTION — 146 task-assigned agents"
            echo "════════════════════════════════════════════════════════"
            $MYSQLT -e "
              SELECT
                CASE
                  WHEN tc >= 2000 THEN 'A+ (>= 2000)'
                  WHEN tc >= 1500 THEN 'A  (1500-1999)'
                  WHEN tc >= 800  THEN 'B  (800-1499)'
                  WHEN tc >= 400  THEN 'C  (400-799)'
                  ELSE                  'D  (<400)'
                END AS grade,
                COUNT(*) AS agents
              FROM (
                SELECT id,
                  (CHAR_LENGTH(IFNULL(bio,''))
                  + CHAR_LENGTH(IFNULL(specialty,''))
                  + CHAR_LENGTH(IFNULL(methodology,''))
                  + CHAR_LENGTH(IFNULL(taskSystemPrompt,''))) AS tc
                FROM agents WHERE id IN ($IDS)
              ) x GROUP BY grade ORDER BY grade;
            "

            echo
            echo "════════════════════════════════════════════════════════"
            echo "  taskSystemPrompt coverage on 146 agents"
            echo "════════════════════════════════════════════════════════"
            $MYSQLT -e "
              SELECT
                SUM(CASE WHEN CHAR_LENGTH(IFNULL(taskSystemPrompt,'')) >= 300 THEN 1 ELSE 0 END) AS with_tsp,
                SUM(CASE WHEN CHAR_LENGTH(IFNULL(taskSystemPrompt,'')) < 300  THEN 1 ELSE 0 END) AS missing_tsp,
                AVG(CHAR_LENGTH(IFNULL(taskSystemPrompt,''))) AS avg_tsp_chars
              FROM agents WHERE id IN ($IDS);
            "

            echo
            echo "════════════════════════════════════════════════════════"
            echo "  Already A+ agents in our pool (good — don't touch)"
            echo "════════════════════════════════════════════════════════"
            $MYSQLT -e "
              SELECT id, LEFT(name, 14) AS name, LEFT(title, 30) AS title,
                CHAR_LENGTH(IFNULL(bio,'')) AS bio,
                CHAR_LENGTH(IFNULL(specialty,'')) AS spec,
                CHAR_LENGTH(IFNULL(methodology,'')) AS meth,
                CHAR_LENGTH(IFNULL(taskSystemPrompt,'')) AS tsp,
                (CHAR_LENGTH(IFNULL(bio,''))
                + CHAR_LENGTH(IFNULL(specialty,''))
                + CHAR_LENGTH(IFNULL(methodology,''))
                + CHAR_LENGTH(IFNULL(taskSystemPrompt,''))) AS total
              FROM agents
              WHERE id IN ($IDS)
              HAVING total >= 2000
              ORDER BY total DESC;
            "

            echo
            echo "════════════════════════════════════════════════════════"
            echo "  Agents NOT YET A+ (these need upgrade — bio + tsp)"
            echo "════════════════════════════════════════════════════════"
            $MYSQLT -e "
              SELECT COUNT(*) AS need_upgrade FROM agents
              WHERE id IN ($IDS)
              HAVING (CHAR_LENGTH(IFNULL(bio,''))
                + CHAR_LENGTH(IFNULL(specialty,''))
                + CHAR_LENGTH(IFNULL(methodology,''))
                + CHAR_LENGTH(IFNULL(taskSystemPrompt,''))) < 2000;
            "
