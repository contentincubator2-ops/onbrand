name: Admin — Free port 3101 + restart OnBrand cleanly

# Diagnoses why port 3101 is already in use, kills the orphan, then
# brings PM2 process up cleanly. Should break the restart loop.

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 120s
          script: |
            set +e

            echo "════ What is on port 3101? ════"
            sudo ss -tlnp 2>/dev/null | grep ":3101" || echo "  (ss not available or nothing on 3101)"
            echo ""
            sudo lsof -i :3101 2>/dev/null || echo "  (lsof not available or nothing on 3101)"
            echo ""

            echo "════ All tsx / node processes ════"
            ps -ef | grep -E "tsx|node " | grep -v grep | head -20

            echo ""
            echo "════ Stop marketing-os PM2 process ════"
            pm2 stop marketing-os 2>&1 | tail -3
            sleep 2

            echo ""
            echo "════ Kill anything holding 3101 ════"
            # Find PIDs bound to 3101 (any user) and kill
            PIDS=$(sudo lsof -t -i :3101 2>/dev/null)
            if [ -n "$PIDS" ]; then
              echo "  Killing PIDs on 3101: $PIDS"
              sudo kill -9 $PIDS 2>/dev/null
              sleep 2
            else
              echo "  (no PIDs found on 3101)"
            fi

            echo ""
            echo "════ Verify port 3101 is free ════"
            sudo ss -tlnp 2>/dev/null | grep ":3101" && echo "  STILL IN USE" || echo "  ✓ port free"

            echo ""
            echo "════ Start marketing-os fresh ════"
            pm2 start marketing-os --update-env 2>&1 | tail -5
            sleep 6

            echo ""
            echo "════ Health check ════"
            curl -s -o /dev/null -w "Health: HTTP %{http_code}\n" http://127.0.0.1:3101/health

            echo ""
            echo "════ Process state after fix ════"
            pm2 jlist 2>/dev/null | python3 -c "
            import sys, json, time
            data = json.loads(sys.stdin.read())
            for p in data:
                if p['name'] == 'marketing-os':
                    age_s = (time.time() * 1000 - p['pm2_env']['pm_uptime']) / 1000
                    print(f'  pid={p[\"pid\"]}  age={age_s:.1f}s  status={p[\"pm2_env\"][\"status\"]}  restarts={p[\"pm2_env\"][\"restart_time\"]}')" 2>/dev/null
