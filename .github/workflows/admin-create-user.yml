name: Admin — Create User Account

# Provisions a new user account on the VM via scripts/create-user.ts.
# Idempotent: if the email already exists, prints the existing row and
# exits 0 without touching it (use a separate reset-password flow to
# change the password).
#
# Account defaults:
#   - bcrypt password hash (rounds=10, matches passwordUtils.ts)
#   - isActive=1 (skips email verification — admin-provisioned)
#   - role='user', credits=1000 signup bonus

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Email address (will be lower-cased)'
        required: true
        type: string
      password:
        description: 'Password (min 8 chars). Sent as masked secret to the VM, never logged.'
        required: true
        type: string
      name:
        description: 'Display name (optional, defaults to email local-part)'
        required: false
        type: string

jobs:
  create-user:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          EMAIL_INPUT: ${{ inputs.email }}
          PASSWORD_INPUT: ${{ inputs.password }}
          NAME_INPUT: ${{ inputs.name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 300s
          envs: EMAIL_INPUT,PASSWORD_INPUT,NAME_INPUT,GH_TOKEN
          script: |
            set -e
            APP=/opt/marketing-os/app
            AI=$APP/skills/ai-talent

            echo "===== Step 1: Pull latest main ====="
            REPO="https://x-access-token:${GH_TOKEN}@github.com/contentincubator2-ops/Marketing-OS.git"
            cd "$APP"
            git remote set-url origin "$REPO"
            git fetch origin main
            git reset --hard origin/main
            echo "Commit: $(git log --oneline -1)"

            echo ""
            echo "===== Step 2: Ensure dependencies ====="
            cd "$AI"
            npm install --legacy-peer-deps 2>&1 | tail -5

            echo ""
            echo "===== Step 3: Create user (password not echoed) ====="
            EMAIL="$EMAIL_INPUT" PASSWORD="$PASSWORD_INPUT" NAME="$NAME_INPUT" \
              npx tsx scripts/create-user.ts

            echo ""
            echo "===== Done ====="
