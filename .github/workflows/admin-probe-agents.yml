name: Admin — Probe agent avatar samples

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          script: |
            set -e
            ENV_FILE=/opt/marketing-os/app/skills/ai-talent/.env
            set -a; source "$ENV_FILE"; set +a
            DB_HOST="${DB_HOST:-127.0.0.1}"; DB_USER="${DB_USER:-root}"; DB_NAME="${DB_NAME:-mos_db}"

            run_sql() { MYSQL_PWD="$DB_PASSWORD" mysql -h"$DB_HOST" -u"$DB_USER" "$DB_NAME" -t -e "$1"; }

            echo "===== Agent count by avatar status ====="
            run_sql "
              SELECT
                CASE
                  WHEN avatarUrl IS NULL OR avatarUrl='' THEN 'no avatar'
                  WHEN avatarUrl LIKE 'http%' THEN 'external URL'
                  WHEN avatarUrl LIKE '/static/covers/agent-%' THEN 'illustrated (ours)'
                  WHEN avatarUrl LIKE '/%' THEN 'relative URL (other)'
                  ELSE 'data: or other'
                END AS kind,
                COUNT(*) AS n
              FROM agents
              GROUP BY kind
            "

            echo "===== Sample 5 avatarUrl values ====="
            run_sql "SELECT id, slug, LEFT(avatarUrl, 100) AS avatar FROM agents WHERE avatarUrl IS NOT NULL AND avatarUrl != '' LIMIT 5;"

            echo "===== Skill count ====="
            run_sql "SELECT COUNT(*) AS total, SUM(CASE WHEN cover_image_url IS NOT NULL AND cover_image_url != '' THEN 1 ELSE 0 END) AS with_cover, SUM(CASE WHEN task_type IS NOT NULL THEN 1 ELSE 0 END) AS classified FROM skills WHERE is_active = 1;"

            echo "===== Top 5 highest quality skills ====="
            run_sql "SELECT id, slug, name, task_type, ROUND(quality_score, 1) AS q FROM skills WHERE is_active = 1 ORDER BY quality_score DESC, id LIMIT 5;"
