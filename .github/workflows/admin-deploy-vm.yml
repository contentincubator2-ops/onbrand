name: Admin — Deploy to VM (self-hosted runner)

# Self-hosted-runner version of admin-deploy.yml. Runs directly on the
# VM (no SSH wrapper, no docker container, no GH-hosted minutes consumed).
# Once verified, the original admin-deploy.yml can be deprecated.

on:
  workflow_dispatch:

# 2026-05-19 (CJ 驗收 deploy 連續失敗根因): the self-hosted runner shares
# ONE /opt tree. Concurrent deploy runs (multiple sessions dispatching)
# stomp each other's node_modules mid-install → ENOTEMPTY / missing
# typescript lib / @heroui/system-rsc resolve fail. Serialize: only one
# deploy at a time; queue the rest (never cancel a half-done install).
concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 30
    steps:
      - name: Pull latest main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APP=/opt/onbrand/app
          cd "$APP"
          REPO="https://x-access-token:${GH_TOKEN}@github.com/contentincubator2-ops/Marketing-OS.git"
          git remote set-url origin "$REPO"
          git fetch origin main
          git reset --hard origin/main
          echo "Commit: $(git log --oneline -1)"

      - name: Server install + DB migrations
        run: |
          set -e
          APP=/opt/onbrand/app
          AI=$APP/skills/ai-talent
          cd "$AI"
          npm install --legacy-peer-deps 2>&1 | tail -5
          npx tsx scripts/migrate.ts 2>&1 | tail -30 || {
            echo "[deploy] migrations failed — continuing anyway"
          }

      - name: Client build
        run: |
          set -eo pipefail
          APP=/opt/onbrand/app
          AI=$APP/skills/ai-talent
          cd "$AI/client"
          # 2026-05-16: was `npm install --legacy-peer-deps` which drifts
          # from package-lock and drops transitive peers (e.g.
          # @heroui/system-rsc) → vite "failed to resolve import" build
          # failure. `npm ci` installs the EXACT locked tree
          # reproducibly. Fallback to install only if ci fails (no/old
          # lockfile) so a bad lock never hard-blocks deploys.
          # 2026-05-17: the VM has NODE_ENV=production, under which
          # `npm ci` OMITS devDependencies → build tooling (vite,
          # @vitejs/plugin-react) missing → "Cannot find package" build
          # failure. Force-include dev deps for the build, and pin
          # NODE_ENV=development for the install step only.
          # 2026-05-19 (CJ 驗收 deploy 連續 ENOTEMPTY → @heroui/system-rsc
          # resolve fail): `npm ci` rmdir's the existing node_modules; a
          # concurrent/locked partial tree → ENOTEMPTY → fallback npm
          # install drifts & drops the transitive peer → vite build fail.
          # Wipe node_modules FIRST so npm ci installs the exact locked
          # tree from clean (slower by ~30s but deterministic; no drift).
          rm -rf node_modules
          (NODE_ENV=development npm ci --include=dev 2>&1 | tail -5) \
            || (echo "npm ci failed → fallback npm install" && rm -rf node_modules && NODE_ENV=development npm install --legacy-peer-deps --include=dev 2>&1 | tail -5)
          # 2026-05-14 (white-screen post-mortem): purge public/assets/ before
          # build. Vite writes new hashed chunks but doesn't delete old ones —
          # so over multiple builds, public/assets/ accumulates stale .js/.css.
          # If any process snapshots index.html separately from assets/ (rsync,
          # static-serve caching), drift = white-screen. Wipe-then-build keeps
          # the dir in sync with index.html every time.
          if [ -d "$AI/public/assets" ]; then
            rm -rf "$AI/public/assets"
            echo "[deploy] purged old assets/"
          fi
          # 2026-05-13: previous version masked tsc/vite failures with
          # `2>&1 | tail -10` — when tsc errored, build silently succeeded
          # and public/ stayed stale. set -eo pipefail makes pipe failures
          # surface; tee preserves logs without swallowing exit codes.
          npm run build 2>&1 | tee /tmp/client-build.log | tail -30
          # Sanity: index.html must reference a bundle that EXISTS in assets/
          BUNDLE=$(grep -oE 'index-[A-Za-z0-9_-]+\.js' "$AI/public/index.html" | head -1)
          if [ -z "$BUNDLE" ] || [ ! -f "$AI/public/assets/$BUNDLE" ]; then
            echo "❌ public/index.html references $BUNDLE but file missing in assets/"
            ls "$AI/public/assets/" | head
            exit 1
          fi
          # Sanity 2: verify the bundle is real JS, not the nginx fallback stub.
          # (78 bytes = "asset not found — your bundle is stale, please hard-refresh")
          BUNDLE_SIZE=$(stat -c%s "$AI/public/assets/$BUNDLE")
          if [ "$BUNDLE_SIZE" -lt 1000 ]; then
            echo "❌ bundle $BUNDLE is suspiciously small ($BUNDLE_SIZE bytes) — likely the stub"
            head -c 200 "$AI/public/assets/$BUNDLE"
            exit 1
          fi
          echo "✓ index.html → $BUNDLE ($BUNDLE_SIZE bytes)"
          stat -c '%y %s bytes' "$AI/public/index.html"

      - name: Restart pm2
        run: |
          set -e
          pm2 restart onbrand --update-env 2>&1 | tail -5 || \
            pm2 restart all --update-env 2>&1 | tail -5
          pm2 save
