name: Admin — Deploy to VM (self-hosted runner)

# Self-hosted-runner version of admin-deploy.yml. Runs directly on the
# VM (no SSH wrapper, no docker container, no GH-hosted minutes consumed).
# Once verified, the original admin-deploy.yml can be deprecated.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 30
    steps:
      - name: Pull latest main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APP=/opt/marketing-os/app
          cd "$APP"
          REPO="https://x-access-token:${GH_TOKEN}@github.com/contentincubator2-ops/Marketing-OS.git"
          git remote set-url origin "$REPO"
          git fetch origin main
          git reset --hard origin/main
          echo "Commit: $(git log --oneline -1)"

      - name: Server install + DB migrations
        run: |
          set -e
          APP=/opt/marketing-os/app
          AI=$APP/skills/ai-talent
          cd "$AI"
          npm install --legacy-peer-deps 2>&1 | tail -5
          npx tsx scripts/migrate.ts 2>&1 | tail -30 || {
            echo "[deploy] migrations failed — continuing anyway"
          }

      - name: Client build
        run: |
          set -eo pipefail
          APP=/opt/marketing-os/app
          AI=$APP/skills/ai-talent
          cd "$AI/client"
          npm install --legacy-peer-deps 2>&1 | tail -5
          # 2026-05-13: previous version masked tsc/vite failures with
          # `2>&1 | tail -10` — when tsc errored, build silently succeeded
          # and public/ stayed stale. set -eo pipefail makes pipe failures
          # surface; tee preserves logs without swallowing exit codes.
          npm run build 2>&1 | tee /tmp/client-build.log | tail -30
          # Sanity: index.html must reference a bundle that EXISTS in assets/
          BUNDLE=$(grep -oE 'index-[A-Za-z0-9_-]+\.js' "$AI/public/index.html" | head -1)
          if [ -z "$BUNDLE" ] || [ ! -f "$AI/public/assets/$BUNDLE" ]; then
            echo "❌ public/index.html references $BUNDLE but file missing in assets/"
            ls "$AI/public/assets/" | head
            exit 1
          fi
          echo "✓ index.html → $BUNDLE ($(stat -c%s $AI/public/assets/$BUNDLE) bytes)"
          stat -c '%y %s bytes' "$AI/public/index.html"

      - name: Restart pm2
        run: |
          set -e
          pm2 restart marketing-os --update-env 2>&1 | tail -5 || \
            pm2 restart all --update-env 2>&1 | tail -5
          pm2 save
