name: Admin — Snapshot current taxonomy (squads / agents / skills)

# Pulls counts + distribution to answer "if we shrink to 50 squads /
# 300 agents / 800 skills, can we still cover the work?"

on:
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 90s
          script: |
            set +e
            export MYSQL_PWD="mos_secure_2026"
            MYSQL="mysql -h localhost -u mos_user mos_db -B -N --silent"

            echo "════════════════════════════════════════"
            echo "  Marketing OS taxonomy snapshot"
            echo "  $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "════════════════════════════════════════"

            echo ""
            echo "── Total counts ──"
            echo "squads (active+approved):  $($MYSQL -e 'SELECT COUNT(*) FROM squads WHERE is_active=1 AND is_approved=1')"
            echo "squads (active total):     $($MYSQL -e 'SELECT COUNT(*) FROM squads WHERE is_active=1')"
            echo "squads (all rows):         $($MYSQL -e 'SELECT COUNT(*) FROM squads')"
            echo "agents (available):        $($MYSQL -e 'SELECT COUNT(*) FROM agents WHERE isAvailable=1')"
            echo "agents (all rows):         $($MYSQL -e 'SELECT COUNT(*) FROM agents')"

            # skill_catalog table — name varies by deployment
            for tbl in skill_catalog skills agent_skills; do
              CNT=$($MYSQL -e "SELECT COUNT(*) FROM $tbl" 2>/dev/null)
              [ -n "$CNT" ] && echo "$tbl rows:               $CNT"
            done

            echo ""
            echo "── Squads by workspace (top 15) ──"
            $MYSQL -e "
              SELECT workspace, COUNT(*) AS n
                FROM squads
               WHERE is_active=1 AND is_approved=1
               GROUP BY workspace
               ORDER BY n DESC
               LIMIT 15
            " 2>/dev/null | head -20

            echo ""
            echo "── Squads by strategy_layer ──"
            $MYSQL -e "
              SELECT strategy_layer, COUNT(*) AS n
                FROM squads
               WHERE is_active=1 AND is_approved=1
               GROUP BY strategy_layer
               ORDER BY n DESC
            " 2>/dev/null

            echo ""
            echo "── Squads by missionType (top 20) ──"
            $MYSQL -e "
              SELECT missionType, COUNT(*) AS n
                FROM squads
               WHERE is_active=1 AND is_approved=1 AND missionType IS NOT NULL
               GROUP BY missionType
               ORDER BY n DESC
               LIMIT 20
            " 2>/dev/null

            echo ""
            echo "── Agents by primarySkill (top 25) ──"
            $MYSQL -e "
              SELECT primarySkill, COUNT(*) AS n
                FROM agents
               WHERE isAvailable=1 AND primarySkill IS NOT NULL
               GROUP BY primarySkill
               ORDER BY n DESC
               LIMIT 25
            " 2>/dev/null

            echo ""
            echo "── Agents by layer ──"
            $MYSQL -e "
              SELECT layer, COUNT(*) AS n
                FROM agents
               WHERE isAvailable=1
               GROUP BY layer
               ORDER BY n DESC
            " 2>/dev/null

            echo ""
            echo "── Skill catalog by category (top 25) ──"
            $MYSQL -e "
              SELECT category, COUNT(*) AS n
                FROM skill_catalog
               WHERE category IS NOT NULL
               GROUP BY category
               ORDER BY n DESC
               LIMIT 25
            " 2>/dev/null | head -30

            echo ""
            echo "── Most-used squads (last 30 days, by mission count) ──"
            $MYSQL -e "
              SELECT s.slug, s.name, COUNT(m.id) AS missions
                FROM squads s
           LEFT JOIN missions m ON m.squadSlug = s.slug
                                AND m.createdAt > DATE_SUB(NOW(), INTERVAL 30 DAY)
               WHERE s.is_active=1 AND s.is_approved=1
               GROUP BY s.slug, s.name
               ORDER BY missions DESC
               LIMIT 20
            " 2>/dev/null | head -25

            echo ""
            echo "── Squads with zero missions (candidates to cut) ──"
            $MYSQL -e "
              SELECT COUNT(*)
                FROM squads s
           LEFT JOIN missions m ON m.squadSlug = s.slug
               WHERE s.is_active=1 AND s.is_approved=1 AND m.id IS NULL
            " 2>/dev/null
            echo "(↑ count of squads that have NEVER been used)"

            echo ""
            echo "════════════════════════════════════════"
            echo "  Done."
            echo "════════════════════════════════════════"
