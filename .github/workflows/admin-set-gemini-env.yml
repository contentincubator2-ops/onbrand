name: Admin — Set Gemini LLM env

# One-shot: write/update GEMINI_API_KEY + LLM_DEFAULT_PROVIDER in the VM .env
# so the backend routes LLM calls to Google Gemini (AI Studio / Generative
# Language API, OpenAI-compatible endpoint).
#
# The API key is passed as workflow_dispatch input (masked by GitHub) so it
# never lands in git.

on:
  workflow_dispatch:
    inputs:
      geminiApiKey:
        description: 'Gemini API key (will be masked in logs)'
        required: true
        type: string
      defaultProvider:
        description: 'Default LLM provider (set to gemini to route through this)'
        required: true
        type: choice
        default: gemini
        options:
          - gemini
          - azure-foundry
          - openrouter

jobs:
  set-env:
    runs-on: ubuntu-latest
    steps:
      - name: Mask API key in logs
        run: echo "::add-mask::${{ inputs.geminiApiKey }}"

      - uses: appleboy/ssh-action@v1.0.3
        env:
          GEMINI_KEY: ${{ inputs.geminiApiKey }}
          DEFAULT_PROVIDER: ${{ inputs.defaultProvider }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          envs: GEMINI_KEY,DEFAULT_PROVIDER
          script: |
            set -e
            ENV_FILE=/opt/marketing-os/app/skills/ai-talent/.env
            test -f "$ENV_FILE" || { echo ".env not found at $ENV_FILE"; exit 1; }

            cp "$ENV_FILE" "$ENV_FILE.bak.$(date +%Y%m%d)" 2>/dev/null || true

            upsert() {
              local key="$1" val="$2"
              if grep -q "^${key}=" "$ENV_FILE"; then
                sed -i "s|^${key}=.*|${key}=${val}|" "$ENV_FILE"
                echo "updated ${key}"
              else
                echo "${key}=${val}" >> "$ENV_FILE"
                echo "added ${key}"
              fi
            }

            upsert GEMINI_API_KEY "$GEMINI_KEY"
            upsert LLM_DEFAULT_PROVIDER "$DEFAULT_PROVIDER"

            echo ""
            echo "===== Verification ====="
            grep -E '^(GEMINI_API_KEY|LLM_DEFAULT_PROVIDER)=' "$ENV_FILE" \
              | sed 's/\(GEMINI_API_KEY=\).*/\1***REDACTED***/'

            echo ""
            echo "Restarting PM2 to pick up env changes…"
            cd /opt/marketing-os/app/skills/ai-talent
            pm2 restart marketing-os --update-env 2>&1 | tail -10 || true
            sleep 2
            pm2 status | head -10

            echo ""
            echo "Live smoke test against Gemini…"
            curl -s -m 20 -X POST \
              "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions" \
              -H "Authorization: Bearer $GEMINI_KEY" \
              -H "Content-Type: application/json" \
              -d '{"model":"gemini-2.5-flash","messages":[{"role":"user","content":"say ok"}],"max_tokens":10}' \
              | head -c 500
            echo ""

            echo ""
            echo "Done."
