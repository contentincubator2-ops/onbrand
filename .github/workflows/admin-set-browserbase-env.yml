name: Admin — Set Browserbase env

# One-shot: write/update BROWSERBASE_API_KEY + BROWSERBASE_PROJECT_ID +
# BROWSER_PROVIDER in the VM .env so the Batch 2-2 browser runtime can
# delegate headless Chromium sessions to Browserbase (avoid datacenter IP
# risk control when scraping Similarweb / Opview / Meltwater / GWI).
#
# Keys are workflow_dispatch inputs (masked by GitHub) so they never land in git.

on:
  workflow_dispatch:
    inputs:
      browserbaseApiKey:
        description: 'Browserbase API key (bb_live_* — will be masked in logs)'
        required: true
        type: string
      browserbaseProjectId:
        description: 'Browserbase project ID (UUID)'
        required: true
        type: string
      browserProvider:
        description: 'Browser provider (browserbase = cloud, local = VM Playwright for dev)'
        required: true
        type: choice
        default: browserbase
        options:
          - browserbase
          - local

jobs:
  set-env:
    runs-on: ubuntu-latest
    steps:
      - name: Mask secrets in logs
        run: |
          echo "::add-mask::${{ inputs.browserbaseApiKey }}"
          echo "::add-mask::${{ inputs.browserbaseProjectId }}"

      - uses: appleboy/ssh-action@v1.0.3
        env:
          BB_KEY: ${{ inputs.browserbaseApiKey }}
          BB_PROJECT: ${{ inputs.browserbaseProjectId }}
          BB_PROVIDER: ${{ inputs.browserProvider }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          envs: BB_KEY,BB_PROJECT,BB_PROVIDER
          script: |
            set -e
            ENV_FILE=/opt/marketing-os/app/skills/ai-talent/.env
            test -f "$ENV_FILE" || { echo ".env not found at $ENV_FILE"; exit 1; }

            cp "$ENV_FILE" "$ENV_FILE.bak.$(date +%Y%m%d)" 2>/dev/null || true

            upsert() {
              local key="$1" val="$2"
              if grep -q "^${key}=" "$ENV_FILE"; then
                sed -i "s|^${key}=.*|${key}=${val}|" "$ENV_FILE"
                echo "updated ${key}"
              else
                echo "${key}=${val}" >> "$ENV_FILE"
                echo "added ${key}"
              fi
            }

            upsert BROWSERBASE_API_KEY "$BB_KEY"
            upsert BROWSERBASE_PROJECT_ID "$BB_PROJECT"
            upsert BROWSER_PROVIDER "$BB_PROVIDER"

            echo ""
            echo "===== Verification ====="
            grep -E '^(BROWSERBASE_API_KEY|BROWSERBASE_PROJECT_ID|BROWSER_PROVIDER)=' "$ENV_FILE" \
              | sed 's/\(BROWSERBASE_API_KEY=\).*/\1***REDACTED***/' \
              | sed 's/\(BROWSERBASE_PROJECT_ID=\).*/\1***REDACTED***/'

            echo ""
            echo "Restarting PM2 to pick up env changes…"
            cd /opt/marketing-os/app/skills/ai-talent
            pm2 restart marketing-os --update-env 2>&1 | tail -10 || true
            sleep 2
            pm2 status | head -10

            echo ""
            echo "Live smoke test — list Browserbase sessions (should return [] or recent ones)…"
            curl -s -m 20 \
              "https://api.browserbase.com/v1/sessions?projectId=$BB_PROJECT&status=RUNNING" \
              -H "X-BB-API-Key: $BB_KEY" \
              | head -c 400
            echo ""

            echo ""
            echo "Done. Browserbase ready for Batch 2-2 browser runtime."
