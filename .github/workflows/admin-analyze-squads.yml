name: Admin — Analyze Existing Squads

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: SSH & run squad analysis
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 120s
          script: |
            set -e
            cd /home/azureuser/marketing-os
            npm run db:analyze-squads --prefix skills/ai-talent
