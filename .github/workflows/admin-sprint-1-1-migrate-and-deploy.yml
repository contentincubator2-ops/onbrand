name: Admin — Sprint 1.1 migrate new backend files + run DB migration + deploy

# Migrates Sprint 1.1 backend files to /opt Backend repo, runs DB migration,
# deploys backend. Verifies brand_reports + brand_report_sections tables exist.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to migrate + run migration + deploy backend'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm == 'DEPLOY' }}
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 360s
          script: |
            set -e
            OLD=/home/azureuser/marketing-os
            BE=/opt/marketing-os/marketing-os-backend

            echo "===== Step 1: sync CJ's workspace to latest main ====="
            cd "$OLD"
            git fetch origin main && git reset --hard origin/main

            echo ""
            echo "===== Step 2: copy Sprint 1.1 files to Backend repo ====="
            # migrate.ts (overwrite — includes brand_reports migration)
            cp -v "$OLD/skills/ai-talent/scripts/migrate.ts" \
                  "$BE/ai-talent-scripts/migrate.ts"

            # reportPersistence.ts (new)
            mkdir -p "$BE/ai-talent-server/_core"
            cp -v "$OLD/skills/ai-talent/server/_core/reportPersistence.ts" \
                  "$BE/ai-talent-server/_core/reportPersistence.ts"

            # reportRouter.ts (new) + routers/index.ts (modified)
            cp -v "$OLD/skills/ai-talent/server/routers/reportRouter.ts" \
                  "$BE/ai-talent-server/routers/reportRouter.ts"
            cp -v "$OLD/skills/ai-talent/server/routers/index.ts" \
                  "$BE/ai-talent-server/routers/index.ts"

            # missionChatRouter.ts (dual-write hooks)
            cp -v "$OLD/skills/ai-talent/server/routes/missionChatRouter.ts" \
                  "$BE/ai-talent-server/routes/missionChatRouter.ts"

            echo ""
            echo "===== Step 3: commit + push Backend repo ====="
            cd "$BE"
            git add ai-talent-scripts/migrate.ts \
                    ai-talent-server/_core/reportPersistence.ts \
                    ai-talent-server/routers/reportRouter.ts \
                    ai-talent-server/routers/index.ts \
                    ai-talent-server/routes/missionChatRouter.ts
            git status --short

            cat > /tmp/sprint_1_1_msg.txt <<'MSGEOF'
            feat: Sprint 1.1 brand_reports schema + dual-write + reportRouter

            - Migration: brand_reports + brand_report_sections tables
            - reportPersistence helper writes full untruncated agent outputs
            - missionChatRouter dual-writes alongside saveStepResultOnly
            - tRPC reportRouter exposes getByMission / getSection / updateSection
            MSGEOF
            git -c user.name="CJ Migration Bot" -c user.email="cjwang@sowork.tw" \
              commit -F /tmp/sprint_1_1_msg.txt
            git push origin main

            echo ""
            echo "===== Step 4: run DB migration ====="
            npm run db:migrate

            echo ""
            echo "===== Step 5: verify tables ====="
            DB_USER=$(grep -E '^DB_USER=' .env | cut -d= -f2- | tr -d '"' | tr -d "'")
            DB_PASS=$(grep -E '^DB_PASSWORD=' .env | cut -d= -f2- | tr -d '"' | tr -d "'")
            DB_NAME=$(grep -E '^DB_NAME=' .env | cut -d= -f2- | tr -d '"' | tr -d "'")
            mysql --host=127.0.0.1 --user="${DB_USER}" --password="${DB_PASS}" --default-character-set=utf8mb4 "${DB_NAME}" \
              -e "SHOW TABLES LIKE 'brand_report%';"
            mysql --host=127.0.0.1 --user="${DB_USER}" --password="${DB_PASS}" --default-character-set=utf8mb4 "${DB_NAME}" \
              -e "DESCRIBE brand_reports;"
            mysql --host=127.0.0.1 --user="${DB_USER}" --password="${DB_PASS}" --default-character-set=utf8mb4 "${DB_NAME}" \
              -e "DESCRIBE brand_report_sections;"

            echo ""
            echo "===== Step 6: deploy backend ====="
            bash ./deploy-dev.sh 2>&1 | tail -25

            echo ""
            echo "===== Step 7: final status ====="
            pm2 list | head -6
            curl -s -o /dev/null -w "Backend /health: HTTP %{http_code}\n" http://127.0.0.1:3101/health
