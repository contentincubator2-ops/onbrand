name: "Ops — Probe IRIS/vmdirisfamily state (read-only)"
# 2026-08-21 round 2 (CJ): competitor list must be reset to the official
# brand-book set (Master Max/五銅/TOP-DO/Half half/GINKOO/銀穗/JOAN).
# Dump brand 2983's positioning competition + audience segments so the
# rewrite keeps every surface (workbench / four-zone notes / 定位書詳情)
# consistent.
on:
  push:
    branches: [ops/iris-vmd-probe]
jobs:
  probe:
    runs-on: [self-hosted, linux, vm-onbrand]
    timeout-minutes: 5
    steps:
      - name: Read-only DB probe
        run: |
          set -a; source /opt/onbrand/app/skills/ai-talent/.env 2>/dev/null || true; set +a
          H="${LOCAL_DB_HOST:-127.0.0.1}"; U="${LOCAL_DB_USER:-mos_user}"; P="${LOCAL_DB_PASSWORD}"; D="${LOCAL_DB_NAME:-mos_db}"
          echo "=== A. positioning top-level keys (brand 2983) ==="
          mysql -h"$H" -u"$U" -p"$P" "$D" --raw -N -e \
            "SELECT JSON_KEYS(positioning) FROM brands WHERE id=2983;"
          echo "=== B. competition segment ==="
          mysql -h"$H" -u"$U" -p"$P" "$D" --raw -N -e \
            "SELECT JSON_PRETTY(JSON_EXTRACT(positioning,'$.competition')) FROM brands WHERE id=2983;"
          echo "=== C. audience segment ==="
          mysql -h"$H" -u"$U" -p"$P" "$D" --raw -N -e \
            "SELECT JSON_PRETTY(JSON_EXTRACT(positioning,'$.audience')) FROM brands WHERE id=2983;"
          echo "=== D. differentiation segment ==="
          mysql -h"$H" -u"$U" -p"$P" "$D" --raw -N -e \
            "SELECT JSON_PRETTY(JSON_EXTRACT(positioning,'$.differentiation')) FROM brands WHERE id=2983;"
