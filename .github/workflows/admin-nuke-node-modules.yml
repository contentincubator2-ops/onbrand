name: Admin — Nuke client node_modules + rebuild
on: { workflow_dispatch: {} }
jobs:
  fix:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 20
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          AI=/opt/marketing-os/app/skills/ai-talent
          APP=/opt/marketing-os/app
          cd "$APP"

          echo "── git reset to latest main ──"
          REPO="https://x-access-token:${GH_TOKEN}@github.com/contentincubator2-ops/Marketing-OS.git"
          git remote set-url origin "$REPO"
          git fetch origin main
          git reset --hard origin/main
          echo "Commit: $(git log --oneline -1)"

          echo ""
          echo "── nuke client/node_modules ──"
          cd "$AI/client"
          rm -rf node_modules package-lock.json
          echo ""
          echo "── npm install ──"
          npm install --legacy-peer-deps 2>&1 | tail -10

          echo ""
          echo "── npm run build ──"
          npm run build 2>&1 | tail -20

          echo ""
          echo "── verify ──"
          BUNDLE=$(grep -oE 'index-[A-Za-z0-9_-]+\.js' "$AI/public/index.html" | head -1)
          if [ -f "$AI/public/assets/$BUNDLE" ]; then
            echo "✓ $BUNDLE ($(stat -c%s $AI/public/assets/$BUNDLE) bytes)"
          else
            echo "❌ $BUNDLE missing"; exit 1
          fi

          echo ""
          echo "── changelog.md present? ──"
          ls -la "$AI/public/static/changelog.md" 2>&1 || echo "MISSING"

          echo ""
          echo "── restart pm2 ──"
          pm2 restart marketing-os --update-env
