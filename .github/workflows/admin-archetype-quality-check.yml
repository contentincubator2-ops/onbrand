name: Admin - Archetype Quality Check

on:
  workflow_dispatch:
    inputs:
      brand_name:
        description: 'Brand name'
        required: true
        default: 'SoWork AI'
      brand_desc:
        description: 'Brand description'
        required: true
        default: 'AI marketing OS for enterprise teams'

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and run 6-turn test
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 25m
          script: |
            cd /home/azureuser/marketing-os
            git fetch origin main && git reset --hard origin/main
            echo "=== Archetype Quality Check: ${{ github.event.inputs.brand_name }} ==="
            PM2_JWT=$(pm2 jlist 2>/dev/null | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const p=JSON.parse(d).find(x=>x.pm2_env&&x.pm2_env.JWT_SECRET);if(p)process.stdout.write(p.pm2_env.JWT_SECRET);}catch(e){}});" 2>/dev/null)
            if [ -z "$PM2_JWT" ]; then echo "Cannot read JWT_SECRET from pm2"; else echo "Got JWT_SECRET from pm2 (len=${#PM2_JWT})"; fi
            cd skills/ai-talent
            JWT_SECRET="${PM2_JWT:-}" npx tsx scripts/test-squad-flow.ts 2>&1
            echo "=== Test complete ==="
