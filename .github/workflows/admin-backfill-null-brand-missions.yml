name: Admin — Backfill NULL brandId on a user's missions

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: "userId whose NULL-brand missions to backfill"
        required: true
        default: "199"
      brand_id:
        description: "Target brandId (must be user's brand)"
        required: true
        default: "2819"
      confirm:
        description: "Type BACKFILL to proceed"
        required: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'BACKFILL' }}
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 3m
          script: |
            set -e
            cd /home/azureuser/marketing-os

            eval "$(pm2 jlist 2>/dev/null | node -e "
              let d=''; process.stdin.on('data',c=>d+=c);
              process.stdin.on('end',()=>{
                try{
                  const procs=JSON.parse(d);
                  const p=procs.find(x=>x.pm2_env&&x.pm2_env.DB_HOST);
                  if(!p) process.exit(0);
                  const e=p.pm2_env;
                  console.log('export DB_HOST=' + JSON.stringify(e.DB_HOST));
                  console.log('export DB_USER=' + JSON.stringify(e.DB_USER));
                  console.log('export DB_PASSWORD=' + JSON.stringify(e.DB_PASSWORD));
                  console.log('export DB_NAME=' + JSON.stringify(e.DB_NAME));
                }catch(e){}
              });
            ")"
            [ -z "$DB_HOST" ] && { set -a; source skills/ai-talent/.env; set +a; }

            UID_IN="${{ github.event.inputs.user_id }}"
            BID_IN="${{ github.event.inputs.brand_id }}"
            MYSQL="mysql --ssl-mode=REQUIRED -h $DB_HOST -u $DB_USER -p$DB_PASSWORD $DB_NAME -e"

            echo "=== 前置檢查: 確認 user=$UID_IN 是 brand=$BID_IN 的成員 ==="
            MEMBER_CHECK=$($MYSQL "SELECT COUNT(*) AS n FROM brand_members WHERE userId=$UID_IN AND brandId=$BID_IN;" -sN 2>/dev/null)
            echo "membership rows: $MEMBER_CHECK"
            if [ "$MEMBER_CHECK" != "1" ]; then
              echo "❌ user $UID_IN 不是 brand $BID_IN 的成員，拒絕 backfill"
              exit 1
            fi

            echo ""
            echo "=== Backfill 前: user=$UID_IN brandId=NULL missions ==="
            $MYSQL "SELECT id, LEFT(title,40) AS title, workspace, squadSlug FROM missions WHERE userId=$UID_IN AND brandId IS NULL;" 2>&1

            echo ""
            echo "=== 執行 UPDATE ==="
            $MYSQL "UPDATE missions SET brandId=$BID_IN WHERE userId=$UID_IN AND brandId IS NULL;" 2>&1

            echo ""
            echo "=== Backfill 後: 該用戶所有 missions 分群 ==="
            $MYSQL "
              SELECT COALESCE(brandId,'NULL') AS brandId, workspace, COUNT(*) AS n
              FROM missions WHERE userId=$UID_IN
              GROUP BY brandId, workspace
              ORDER BY workspace, brandId;
            " 2>&1

            echo ""
            echo "✅ Backfill 完成"
