name: Admin — Create ALL missing tables in mos_db (direct SQL)

# Directly runs CREATE TABLE IF NOT EXISTS SQL against mos_db.
# Does NOT use drizzle-kit — pure mysql CLI, 100% reliable.
# Safe to re-run multiple times.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to apply. Anything else = dry run (SHOW TABLES only).'
        required: true
        default: 'DRY_RUN'

jobs:
  create-tables:
    runs-on: ubuntu-latest
    steps:
      - name: SSH — direct SQL schema apply to mos_db
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e
            MOS="mysql -h localhost -u mos_user -pmos_secure_2026 mos_db"
            CONFIRM="${{ github.event.inputs.confirm }}"

            echo "=== mos_db BEFORE: tables ==="
            $MOS -e "SHOW TABLES;" 2>&1

            if [ "$CONFIRM" != "YES" ]; then
              echo "DRY_RUN — pass confirm=YES to apply."
              exit 0
            fi

            echo ""
            echo "=== Applying schema ==="

            $MOS << 'SQL'

            CREATE TABLE IF NOT EXISTS `agent_learnings` (
              `id` int AUTO_INCREMENT NOT NULL,
              `agentId` int NOT NULL,
              `userId` int NOT NULL,
              `brandId` int,
              `taskId` int,
              `subscriptionPlan` enum('per_task','monthly','team') NOT NULL,
              `isPrivate` boolean NOT NULL DEFAULT false,
              `taskTitle` varchar(255) NOT NULL,
              `taskDescription` text,
              `taskType` varchar(64),
              `outputSummary` text,
              `fullOutput` longtext,
              `userRating` int,
              `userFeedback` text,
              `feedbackAt` timestamp NULL,
              `brandContext` json,
              `createdAt` timestamp NOT NULL DEFAULT (now()),
              `updatedAt` timestamp NOT NULL DEFAULT (now()) ON UPDATE CURRENT_TIMESTAMP,
              PRIMARY KEY (`id`)
            );

            CREATE TABLE IF NOT EXISTS `agent_memories` (
              `id` int AUTO_INCREMENT NOT NULL,
              `userId` int NOT NULL,
              `agentSlug` varchar(64) NOT NULL,
              `brandId` int,
              `memoryType` enum('preference','forbidden','audience','style','other') DEFAULT 'other',
              `content` text NOT NULL,
              `isActive` boolean NOT NULL DEFAULT true,
              `createdAt` timestamp NOT NULL DEFAULT (now()),
              `updatedAt` timestamp NOT NULL DEFAULT (now()) ON UPDATE CURRENT_TIMESTAMP,
              PRIMARY KEY (`id`)
            );

            CREATE TABLE IF NOT EXISTS `brands` (
              `id` int AUTO_INCREMENT NOT NULL,
              `userId` int NOT NULL,
              `name` varchar(255) NOT NULL,
              `industry` varchar(128),
              `description` text,
              `targetAudience` text,
              `website` varchar(512),
              `logoUrl` text,
              `tagline` varchar(255),
              `brandVoice` text,
              `positioningSummary` text,
              `soworkAnalysis` json,
              `dataSource` varchar(64),
              `companyId` int,
              `createdAt` timestamp NOT NULL DEFAULT (now()),
              `updatedAt` timestamp NOT NULL DEFAULT (now()) ON UPDATE CURRENT_TIMESTAMP,
              PRIMARY KEY (`id`)
            );

            CREATE TABLE IF NOT EXISTS `users` (
              `id` int AUTO_INCREMENT NOT NULL,
              `openId` varchar(64) NOT NULL,
              `name` text,
              `email` varchar(320),
              `role` enum('user','admin') NOT NULL DEFAULT 'user',
              `isActive` int NOT NULL DEFAULT 0,
              `credits` int NOT NULL DEFAULT 1000,
              `hasUnlimitedCredits` int NOT NULL DEFAULT 0,
              `companyId` int,
              `departmentId` int,
              `orgRole` enum('owner','admin','member') DEFAULT 'member',
              `createdAt` timestamp NOT NULL DEFAULT (now()),
              `updatedAt` timestamp NOT NULL DEFAULT (now()) ON UPDATE CURRENT_TIMESTAMP,
              PRIMARY KEY (`id`),
              UNIQUE KEY `users_openId_unique` (`openId`)
            );

            CREATE TABLE IF NOT EXISTS `tasks` (
              `id` int AUTO_INCREMENT NOT NULL,
              `userId` int NOT NULL,
              `agentId` int NOT NULL,
              `brandId` int,
              `missionId` int,
              `title` varchar(255) NOT NULL,
              `description` text,
              `status` enum('pending','running','done','failed') NOT NULL DEFAULT 'pending',
              `priority` int DEFAULT 0,
              `output` longtext,
              `errorMessage` text,
              `tokensUsed` int DEFAULT 0,
              `creditsCharged` int DEFAULT 0,
              `subscriptionPlan` enum('per_task','monthly','team') DEFAULT 'per_task',
              `workspaceType` varchar(64),
              `metadata` json,
              `createdAt` timestamp NOT NULL DEFAULT (now()),
              `updatedAt` timestamp NOT NULL DEFAULT (now()) ON UPDATE CURRENT_TIMESTAMP,
              PRIMARY KEY (`id`)
            );

            CREATE TABLE IF NOT EXISTS `task_executions` (
              `id` int AUTO_INCREMENT NOT NULL,
              `taskId` int NOT NULL,
              `agentId` int NOT NULL,
              `userId` int NOT NULL,
              `step` int DEFAULT 0,
              `status` enum('running','done','failed') NOT NULL DEFAULT 'running',
              `output` longtext,
              `tokensIn` int DEFAULT 0,
              `tokensOut` int DEFAULT 0,
              `createdAt` timestamp NOT NULL DEFAULT (now()),
              PRIMARY KEY (`id`)
            );

            CREATE TABLE IF NOT EXISTS `task_workflows` (
              `id` int AUTO_INCREMENT NOT NULL,
              `taskId` int NOT NULL,
              `stepIndex` int NOT NULL DEFAULT 0,
              `agentId` int,
              `agentSlug` varchar(64),
              `agentName` varchar(128),
              `label` varchar(255),
              `status` enum('pending','running','done','failed') NOT NULL DEFAULT 'pending',
              `output` longtext,
              `tokensUsed` int DEFAULT 0,
              `createdAt` timestamp NOT NULL DEFAULT (now()),
              `updatedAt` timestamp NOT NULL DEFAULT (now()) ON UPDATE CURRENT_TIMESTAMP,
              PRIMARY KEY (`id`)
            );

            CREATE TABLE IF NOT EXISTS `subscriptions` (
              `id` int AUTO_INCREMENT NOT NULL,
              `userId` int NOT NULL,
              `agentId` int NOT NULL,
              `plan` enum('per_task','monthly','team') NOT NULL DEFAULT 'per_task',
              `status` enum('active','cancelled','expired') NOT NULL DEFAULT 'active',
              `startDate` timestamp NOT NULL DEFAULT (now()),
              `endDate` timestamp NULL,
              `createdAt` timestamp NOT NULL DEFAULT (now()),
              `updatedAt` timestamp NOT NULL DEFAULT (now()) ON UPDATE CURRENT_TIMESTAMP,
              PRIMARY KEY (`id`)
            );

            CREATE TABLE IF NOT EXISTS `user_credits` (
              `id` int AUTO_INCREMENT NOT NULL,
              `userId` int NOT NULL,
              `balance` int NOT NULL DEFAULT 0,
              `lifetimeEarned` int NOT NULL DEFAULT 0,
              `lifetimeSpent` int NOT NULL DEFAULT 0,
              `updatedAt` timestamp NOT NULL DEFAULT (now()) ON UPDATE CURRENT_TIMESTAMP,
              PRIMARY KEY (`id`),
              UNIQUE KEY `user_credits_userId_unique` (`userId`)
            );

            CREATE TABLE IF NOT EXISTS `credits_usage_log` (
              `id` int AUTO_INCREMENT NOT NULL,
              `userId` int NOT NULL,
              `agentId` int,
              `taskId` int,
              `missionId` int,
              `amount` int NOT NULL,
              `balanceBefore` int NOT NULL,
              `balanceAfter` int NOT NULL,
              `reason` varchar(255),
              `metadata` json,
              `createdAt` timestamp NOT NULL DEFAULT (now()),
              PRIMARY KEY (`id`)
            );

            CREATE TABLE IF NOT EXISTS `token_usage_logs` (
              `id` int AUTO_INCREMENT NOT NULL,
              `userId` int NOT NULL,
              `agentId` int,
              `taskId` int,
              `missionId` int,
              `model` varchar(128),
              `tokensIn` int DEFAULT 0,
              `tokensOut` int DEFAULT 0,
              `totalTokens` int DEFAULT 0,
              `costUsd` decimal(10,6) DEFAULT 0,
              `provider` varchar(64),
              `createdAt` timestamp NOT NULL DEFAULT (now()),
              PRIMARY KEY (`id`)
            );

            CREATE TABLE IF NOT EXISTS `user_api_keys` (
              `id` int AUTO_INCREMENT NOT NULL,
              `userId` int NOT NULL,
              `provider` varchar(64) NOT NULL,
              `encryptedKey` text NOT NULL,
              `label` varchar(128),
              `isActive` boolean NOT NULL DEFAULT true,
              `createdAt` timestamp NOT NULL DEFAULT (now()),
              `updatedAt` timestamp NOT NULL DEFAULT (now()) ON UPDATE CURRENT_TIMESTAMP,
              PRIMARY KEY (`id`)
            );

            CREATE TABLE IF NOT EXISTS `notifications` (
              `id` int AUTO_INCREMENT NOT NULL,
              `userId` int NOT NULL,
              `type` varchar(64) NOT NULL,
              `title` varchar(255) NOT NULL,
              `body` text,
              `isRead` boolean NOT NULL DEFAULT false,
              `metadata` json,
              `createdAt` timestamp NOT NULL DEFAULT (now()),
              PRIMARY KEY (`id`)
            );

            CREATE TABLE IF NOT EXISTS `notification_preferences` (
              `id` int AUTO_INCREMENT NOT NULL,
              `userId` int NOT NULL,
              `emailEnabled` boolean NOT NULL DEFAULT true,
              `inAppEnabled` boolean NOT NULL DEFAULT true,
              `taskComplete` boolean NOT NULL DEFAULT true,
              `weeklyReport` boolean NOT NULL DEFAULT false,
              `createdAt` timestamp NOT NULL DEFAULT (now()),
              `updatedAt` timestamp NOT NULL DEFAULT (now()) ON UPDATE CURRENT_TIMESTAMP,
              PRIMARY KEY (`id`),
              UNIQUE KEY `notification_preferences_userId_unique` (`userId`)
            );

            CREATE TABLE IF NOT EXISTS `chat_messages` (
              `id` int AUTO_INCREMENT NOT NULL,
              `userId` int NOT NULL,
              `missionId` int,
              `sessionId` varchar(128),
              `role` enum('user','assistant','system') NOT NULL,
              `content` longtext NOT NULL,
              `agentSlug` varchar(64),
              `tokensUsed` int DEFAULT 0,
              `metadata` json,
              `createdAt` timestamp NOT NULL DEFAULT (now()),
              PRIMARY KEY (`id`)
            );

            CREATE TABLE IF NOT EXISTS `missions` (
              `id` int AUTO_INCREMENT NOT NULL,
              `userId` int NOT NULL,
              `brandId` int,
              `workspace` varchar(50) NOT NULL,
              `title` varchar(255) NOT NULL,
              `objective` text,
              `audience` text,
              `offer` text,
              `successMetrics` text,
              `constraints` text,
              `methodology` text,
              `description` text,
              `squadSlug` varchar(64),
              `welcomeMessage` text,
              `tagline` varchar(255),
              `subTagline` varchar(255),
              `savedSquadFlow` text,
              `status` enum('inactive','active','completed','archived') NOT NULL DEFAULT 'inactive',
              `isRecurring` boolean NOT NULL DEFAULT false,
              `recurringSchedule` varchar(64),
              `companyId` int,
              `brandId2` int,
              `departmentId` int,
              `workspaceId` int,
              `createdAt` timestamp NOT NULL DEFAULT (now()),
              `updatedAt` timestamp NOT NULL DEFAULT (now()) ON UPDATE CURRENT_TIMESTAMP,
              PRIMARY KEY (`id`)
            );

            CREATE TABLE IF NOT EXISTS `mission_task_units` (
              `id` int AUTO_INCREMENT NOT NULL,
              `missionId` int NOT NULL,
              `agentId` int,
              `label` varchar(255) NOT NULL,
              `status` enum('not_started','running','needs_input','review','approved') NOT NULL DEFAULT 'not_started',
              `sortOrder` int DEFAULT 0,
              `taskId` int,
              `createdAt` timestamp NOT NULL DEFAULT (now()),
              `updatedAt` timestamp NOT NULL DEFAULT (now()) ON UPDATE CURRENT_TIMESTAMP,
              PRIMARY KEY (`id`)
            );

            CREATE TABLE IF NOT EXISTS `mission_resources` (
              `id` int AUTO_INCREMENT NOT NULL,
              `missionId` int NOT NULL,
              `status` varchar(20) DEFAULT 'pending',
              `agents` int DEFAULT 0,
              `skills` int DEFAULT 0,
              `providers` int DEFAULT 0,
              `skillList` text,
              `providerList` text,
              `topAgents` text,
              `createdAt` timestamp NOT NULL DEFAULT (now()),
              PRIMARY KEY (`id`),
              UNIQUE KEY `mission_resources_missionId_unique` (`missionId`)
            );

            CREATE TABLE IF NOT EXISTS `user_workspaces` (
              `id` int AUTO_INCREMENT NOT NULL,
              `userId` int NOT NULL,
              `wsKey` varchar(64) NOT NULL,
              `label` varchar(64) NOT NULL,
              `sortOrder` int DEFAULT 0,
              `companyId` int,
              `brandId` int,
              `createdAt` timestamp NOT NULL DEFAULT (now()),
              PRIMARY KEY (`id`)
            );

            CREATE TABLE IF NOT EXISTS `mos_companies` (
              `id` int AUTO_INCREMENT NOT NULL,
              `name` varchar(255) NOT NULL,
              `industry` varchar(128),
              `size` varchar(64),
              `website` varchar(512),
              `logoUrl` text,
              `createdAt` timestamp NOT NULL DEFAULT (now()),
              `updatedAt` timestamp NOT NULL DEFAULT (now()) ON UPDATE CURRENT_TIMESTAMP,
              PRIMARY KEY (`id`)
            );

            CREATE TABLE IF NOT EXISTS `mos_departments` (
              `id` int AUTO_INCREMENT NOT NULL,
              `companyId` int NOT NULL,
              `name` varchar(128) NOT NULL,
              `createdAt` timestamp NOT NULL DEFAULT (now()),
              PRIMARY KEY (`id`)
            );

            CREATE TABLE IF NOT EXISTS `mos_company_agents` (
              `id` int AUTO_INCREMENT NOT NULL,
              `companyId` int NOT NULL,
              `agentId` int NOT NULL,
              `isActive` boolean NOT NULL DEFAULT true,
              `createdAt` timestamp NOT NULL DEFAULT (now()),
              PRIMARY KEY (`id`)
            );

            CREATE TABLE IF NOT EXISTS `mission_sops` (
              `id` int AUTO_INCREMENT NOT NULL,
              `missionId` int NOT NULL,
              `title` varchar(255) NOT NULL,
              `description` text,
              `createdAt` timestamp NOT NULL DEFAULT (now()),
              `updatedAt` timestamp NOT NULL DEFAULT (now()) ON UPDATE CURRENT_TIMESTAMP,
              PRIMARY KEY (`id`)
            );

            CREATE TABLE IF NOT EXISTS `mission_sop_steps` (
              `id` int AUTO_INCREMENT NOT NULL,
              `sopId` int NOT NULL,
              `stepIndex` int NOT NULL DEFAULT 0,
              `title` varchar(255) NOT NULL,
              `description` text,
              `agentSlug` varchar(64),
              `status` enum('pending','done') DEFAULT 'pending',
              `createdAt` timestamp NOT NULL DEFAULT (now()),
              `updatedAt` timestamp NOT NULL DEFAULT (now()) ON UPDATE CURRENT_TIMESTAMP,
              PRIMARY KEY (`id`)
            );

            CREATE TABLE IF NOT EXISTS `mission_outputs` (
              `id` int AUTO_INCREMENT NOT NULL,
              `missionId` int NOT NULL,
              `userId` int NOT NULL,
              `taskId` int,
              `type` varchar(64),
              `title` varchar(255),
              `content` longtext,
              `metadata` json,
              `createdAt` timestamp NOT NULL DEFAULT (now()),
              PRIMARY KEY (`id`)
            );

            CREATE TABLE IF NOT EXISTS `mission_knowledge_files` (
              `id` int AUTO_INCREMENT NOT NULL,
              `missionId` int NOT NULL,
              `userId` int NOT NULL,
              `filename` varchar(255) NOT NULL,
              `fileUrl` text,
              `fileSize` int,
              `mimeType` varchar(128),
              `status` enum('pending','processed','failed') DEFAULT 'pending',
              `createdAt` timestamp NOT NULL DEFAULT (now()),
              PRIMARY KEY (`id`)
            );

            CREATE TABLE IF NOT EXISTS `mission_knowledge_chunks` (
              `id` int AUTO_INCREMENT NOT NULL,
              `fileId` int NOT NULL,
              `chunkIndex` int NOT NULL DEFAULT 0,
              `content` text NOT NULL,
              `embedding` json,
              `createdAt` timestamp NOT NULL DEFAULT (now()),
              PRIMARY KEY (`id`)
            );

            CREATE TABLE IF NOT EXISTS `mission_review_queue` (
              `id` int AUTO_INCREMENT NOT NULL,
              `missionId` int NOT NULL,
              `taskId` int,
              `userId` int NOT NULL,
              `agentSlug` varchar(64),
              `content` longtext,
              `status` enum('pending','approved','rejected') DEFAULT 'pending',
              `reviewNote` text,
              `createdAt` timestamp NOT NULL DEFAULT (now()),
              `updatedAt` timestamp NOT NULL DEFAULT (now()) ON UPDATE CURRENT_TIMESTAMP,
              PRIMARY KEY (`id`)
            );

            CREATE TABLE IF NOT EXISTS `session_event_logs` (
              `id` int AUTO_INCREMENT NOT NULL,
              `sessionId` varchar(128),
              `userId` int,
              `missionId` int,
              `eventType` varchar(64),
              `payload` json,
              `createdAt` timestamp NOT NULL DEFAULT (now()),
              PRIMARY KEY (`id`)
            );

            CREATE TABLE IF NOT EXISTS `artifacts` (
              `id` int AUTO_INCREMENT NOT NULL,
              `missionId` int,
              `taskId` int,
              `userId` int NOT NULL,
              `type` varchar(64),
              `title` varchar(255),
              `content` longtext,
              `metadata` json,
              `createdAt` timestamp NOT NULL DEFAULT (now()),
              `updatedAt` timestamp NOT NULL DEFAULT (now()) ON UPDATE CURRENT_TIMESTAMP,
              PRIMARY KEY (`id`)
            );

            CREATE TABLE IF NOT EXISTS `artifact_reviews` (
              `id` int AUTO_INCREMENT NOT NULL,
              `artifactId` int NOT NULL,
              `userId` int NOT NULL,
              `rating` int,
              `feedback` text,
              `createdAt` timestamp NOT NULL DEFAULT (now()),
              PRIMARY KEY (`id`)
            );

            CREATE TABLE IF NOT EXISTS `enterprise_credits_pool` (
              `id` int AUTO_INCREMENT NOT NULL,
              `companyId` int NOT NULL,
              `totalCredits` int NOT NULL DEFAULT 0,
              `usedCredits` int NOT NULL DEFAULT 0,
              `updatedAt` timestamp NOT NULL DEFAULT (now()) ON UPDATE CURRENT_TIMESTAMP,
              PRIMARY KEY (`id`),
              UNIQUE KEY `enterprise_credits_pool_companyId_unique` (`companyId`)
            );

            CREATE TABLE IF NOT EXISTS `enterprise_members` (
              `id` int AUTO_INCREMENT NOT NULL,
              `companyId` int NOT NULL,
              `userId` int NOT NULL,
              `role` enum('owner','admin','member') DEFAULT 'member',
              `joinedAt` timestamp NOT NULL DEFAULT (now()),
              PRIMARY KEY (`id`)
            );

            CREATE TABLE IF NOT EXISTS `enterprise_credits_allocation` (
              `id` int AUTO_INCREMENT NOT NULL,
              `companyId` int NOT NULL,
              `userId` int NOT NULL,
              `allocated` int NOT NULL DEFAULT 0,
              `used` int NOT NULL DEFAULT 0,
              `updatedAt` timestamp NOT NULL DEFAULT (now()) ON UPDATE CURRENT_TIMESTAMP,
              PRIMARY KEY (`id`)
            );

            CREATE TABLE IF NOT EXISTS `enterprise_credits_tx` (
              `id` int AUTO_INCREMENT NOT NULL,
              `companyId` int NOT NULL,
              `userId` int,
              `amount` int NOT NULL,
              `type` varchar(64),
              `note` text,
              `createdAt` timestamp NOT NULL DEFAULT (now()),
              PRIMARY KEY (`id`)
            );

            CREATE TABLE IF NOT EXISTS `tenant_markets` (
              `id` int AUTO_INCREMENT NOT NULL,
              `userId` int NOT NULL,
              `market` varchar(128) NOT NULL,
              `createdAt` timestamp NOT NULL DEFAULT (now()),
              PRIMARY KEY (`id`)
            );

            CREATE TABLE IF NOT EXISTS `video_jobs` (
              `id` int AUTO_INCREMENT NOT NULL,
              `userId` int NOT NULL,
              `brandId` int,
              `topic` varchar(500) NOT NULL,
              `platform` enum('youtube','instagram','tiktok','facebook') NOT NULL DEFAULT 'youtube',
              `language` enum('zh-TW','zh-CN','en') NOT NULL DEFAULT 'zh-TW',
              `duration` int NOT NULL DEFAULT 60,
              `style` varchar(50) NOT NULL DEFAULT 'professional',
              `status` enum('pending','processing','completed','failed') NOT NULL DEFAULT 'pending',
              `progress` int NOT NULL DEFAULT 0,
              `script` json,
              `videoUrl` text,
              `thumbnailUrl` text,
              `falRequestId` varchar(255),
              `errorMessage` text,
              `createdAt` timestamp NOT NULL DEFAULT (now()),
              `updatedAt` timestamp NOT NULL DEFAULT (now()) ON UPDATE CURRENT_TIMESTAMP,
              PRIMARY KEY (`id`)
            );

            CREATE TABLE IF NOT EXISTS `brand_integrations` (
              `id` int AUTO_INCREMENT NOT NULL,
              `brandId` int NOT NULL,
              `platform` varchar(64) NOT NULL,
              `accessToken` text,
              `refreshToken` text,
              `expiresAt` timestamp NULL,
              `metadata` json,
              `createdAt` timestamp NOT NULL DEFAULT (now()),
              `updatedAt` timestamp NOT NULL DEFAULT (now()) ON UPDATE CURRENT_TIMESTAMP,
              PRIMARY KEY (`id`)
            );

            SQL

            echo ""
            echo "=== mos_db AFTER: tables ==="
            $MOS -e "SHOW TABLES;" 2>&1

            echo ""
            echo "=== user_workspaces schema ==="
            $MOS -e "DESCRIBE user_workspaces;" 2>&1

            echo ""
            echo "=== missions schema (key columns) ==="
            $MOS -e "SELECT COLUMN_NAME FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA='mos_db' AND TABLE_NAME='missions' ORDER BY ORDINAL_POSITION;" 2>&1

            echo ""
            echo "=== Restarting pm2 ==="
            pm2 restart marketing-os 2>&1 || pm2 restart all 2>&1
            echo "Done."
