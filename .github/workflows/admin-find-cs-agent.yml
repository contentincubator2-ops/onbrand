name: Admin — Find customer-success agent
on: { workflow_dispatch: {} }
jobs:
  find:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 2
    steps:
      - run: |
          set -e
          AI=/opt/marketing-os/app/skills/ai-talent
          set -a; source "$AI/.env" 2>/dev/null; set +a
          export MYSQL_PWD="${LOCAL_DB_PASSWORD}"
          MYSQL="mysql -h ${LOCAL_DB_HOST:-localhost} -u ${LOCAL_DB_USER:-mos_user} ${LOCAL_DB_NAME:-mos_db}"

          echo "── agents with CS / Success / Manager / Concierge in title ──"
          $MYSQL -e "
            SELECT id, name, title, LEFT(bio_zh, 80) AS bio, avatarUrl
              FROM agents
             WHERE title REGEXP 'Customer|Success|Manager|Concierge|Support|Account|客戶|客服|關係|顧問'
             ORDER BY id ASC LIMIT 15
          " -t 2>&1 | head -30

          echo ""
          echo "── any agent with 'Mia' or '客戶' in name ──"
          $MYSQL -e "
            SELECT id, name, title, avatarUrl FROM agents
             WHERE name LIKE '%Mia%' OR name LIKE '%客戶%'
             ORDER BY id ASC LIMIT 10
          " -t 2>&1 | head -20
