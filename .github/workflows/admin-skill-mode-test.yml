name: Admin — Skill-mode Architecture Test (Squad Lead gate)

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Number of test runs (default 3)"
        required: false
        default: "3"
      lead_model:
        description: "Squad Lead model (intake + review gates)"
        required: false
        default: "anthropic/claude-sonnet-4-6"
      final_model:
        description: "Final synthesis model (Lead)"
        required: false
        default: "anthropic/claude-opus-4-5"
      skill_1_model:
        description: "Step 1 現有品牌人格診斷（研究軌跡 + 4 軸光譜）"
        required: false
        default: "deepseek/deepseek-r1"
      skill_2_model:
        description: "Step 2 原型選擇與組合（競品地圖 + 4 層邏輯鏈）"
        required: false
        default: "anthropic/claude-opus-4-5"
      skill_3_model:
        description: "Step 3 品牌聲音指南（詞庫 + Playbooks）"
        required: false
        default: "anthropic/claude-sonnet-4-6"
      skill_4_model:
        description: "Step 4 視覺識別系統（配色 + 字型 + 攝影）"
        required: false
        default: "anthropic/claude-sonnet-4-6"
      skill_5_model:
        description: "Step 5 全通路一致性稽核（評分卡 + P0/P1/P2）"
        required: false
        default: "deepseek/deepseek-r1"

jobs:
  run-skill-mode-test:
    runs-on: ubuntu-latest
    steps:
      - name: Run skill-mode test on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key:      ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /home/azureuser/marketing-os
            echo "=== 拉最新代碼 ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== 執行 skill-mode 測試 ==="
            cd skills/ai-talent
            RUNS="${{ github.event.inputs.runs }}" \
            LEAD_MODEL="${{ github.event.inputs.lead_model }}" \
            FINAL_MODEL="${{ github.event.inputs.final_model }}" \
            SKILL_1_MODEL="${{ github.event.inputs.skill_1_model }}" \
            SKILL_2_MODEL="${{ github.event.inputs.skill_2_model }}" \
            SKILL_3_MODEL="${{ github.event.inputs.skill_3_model }}" \
            SKILL_4_MODEL="${{ github.event.inputs.skill_4_model }}" \
            SKILL_5_MODEL="${{ github.event.inputs.skill_5_model }}" \
            npx tsx scripts/test-skill-mode.ts 2>&1 | tee /tmp/skill-mode-result.log

            echo ""
            echo "=== 測試完成 — log 位於 VM:/tmp/skill-mode-result.log ==="
