name: Ops — Brand brain positioning diag
on:
  workflow_dispatch:
    inputs:
      brand_name:
        description: brand name LIKE
        default: "家扶"
jobs:
  d:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 4
    steps:
      - name: dump brand positioning + job state
        run: |
          set -e
          cd /opt/onbrand/app/skills/ai-talent
          set -a; source .env 2>/dev/null; set +a
          node --import tsx -e "
            (async () => {
              const { default: pool } = await import('./server/localDb.ts');
              const [b] = await pool.query(
                \"SELECT id, userId, name, brandName, positioningStatus, onboardingStep, isEstimate, CHAR_LENGTH(COALESCE(positioning,'')) AS posLen, CHAR_LENGTH(COALESCE(soworkAnalysis,'')) AS swLen, LEFT(COALESCE(tagline,''),60) AS tagline FROM brands WHERE name LIKE '%${{ github.event.inputs.brand_name }}%' OR brandName LIKE '%${{ github.event.inputs.brand_name }}%' ORDER BY id DESC LIMIT 5\");
              for (const r of b) {
                console.log('BRAND', JSON.stringify(r));
                let posKeys = '(none)', assetKeys = '(none)';
                try {
                  const [[full]] = await pool.query('SELECT positioning FROM brands WHERE id=?',[r.id]);
                  if (full && full.positioning) {
                    const p = typeof full.positioning === 'string' ? JSON.parse(full.positioning) : full.positioning;
                    posKeys = Object.keys(p||{}).join(',');
                    assetKeys = Object.keys((p&&p._assets)||{}).join(',');
                  }
                } catch(e){ posKeys='PARSE_ERR '+String(e.message).slice(0,80); }
                console.log('  positioning keys:', posKeys);
                console.log('  _assets keys    :', assetKeys);
                const [j] = await pool.query(
                  \"SELECT id, status, currentStep, totalSteps, LEFT(COALESCE(lastError,''),120) AS lastError, startedAt, finishedAt FROM positioning_jobs WHERE entityKind='brand' AND entityId=? ORDER BY id DESC LIMIT 3\",[r.id]);
                for (const job of j) console.log('  JOB', JSON.stringify(job));
              }
            })().catch(e => { console.error(e); process.exit(1); });
          "
