name: Admin — migrate task_category + bind FB tasks

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 240s
          envs: GH_TOKEN
          script: |
            set -e
            APP=/opt/marketing-os/app
            AI=$APP/skills/ai-talent
            cd "$APP"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/contentincubator2-ops/Marketing-OS.git"
            git fetch origin main 2>&1 | tail -3
            git reset --hard origin/main 2>&1 | tail -3
            cd "$AI"
            set -a; [ -f "$AI/.env" ] && . "$AI/.env"; set +a

            echo "===== 1. Run migrate.ts (creates task_category + ALTER task_catalog) ====="
            npx tsx scripts/migrate.ts 2>&1 | tail -15

            echo ""
            echo "===== 2. Seed FB categories + bind tasks ====="
            npx tsx scripts/seed-task-categories-fb.ts

            echo ""
            echo "===== 3. Final state ====="
            MYSQL_PWD="$DB_PASSWORD" mysql -h"${DB_HOST:-127.0.0.1}" -u"${DB_USER:-root}" "${DB_NAME:-mos_db}" -t -e "
              SELECT c.id, c.slug, c.name_zh, c.category_kind, c.default_mockup,
                     COUNT(t.id) AS methods
                FROM task_category c
           LEFT JOIN task_catalog t ON t.category_id = c.id
               WHERE c.workspace = 'facebook'
            GROUP BY c.id
            ORDER BY c.category_kind, c.slug;
            "
