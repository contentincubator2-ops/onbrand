name: Admin - Test Archetype Full Output

on:
  workflow_dispatch:
    inputs:
      brand_name:
        description: 'Brand name to analyze'
        required: true
        default: 'SoWork AI'
      brand_desc:
        description: 'Brand description'
        required: true
        default: 'AI marketing OS for enterprise teams'

jobs:
  test-archetype-output:
    runs-on: ubuntu-latest
    steps:
      - name: Run 6-turn archetype test via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 25m
          script: |
            set -e
            cd /home/azureuser/marketing-os
            git fetch origin main && git reset --hard origin/main

            BRAND="${{ github.event.inputs.brand_name }}"
            DESC="${{ github.event.inputs.brand_desc }}"
            PORT=3001
            MOS_USER="mos_user"
            MOS_PASS="mos_secure_2026"
            MOS_DB="mos_db"

            echo "======================================================"
            echo "brand-archetype-positioning Full Output Test"
            echo "Brand: $BRAND"
            echo "======================================================"

            export JWT_SECRET=$(pm2 jlist 2>/dev/null | node -e "
              let d=''; process.stdin.on('data',c=>d+=c);
              process.stdin.on('end',()=>{
                try{ const p=JSON.parse(d).find(x=>x.pm2_env&&x.pm2_env.JWT_SECRET);
                  if(p) process.stdout.write(p.pm2_env.JWT_SECRET); }catch(e){}
              });
            " 2>/dev/null)
            if [ -z "$JWT_SECRET" ]; then
              export JWT_SECRET=$(grep -E '^JWT_SECRET=' skills/ai-talent/.env | head -1 | cut -d= -f2-)
            fi
            echo "JWT_SECRET ready (len=${#JWT_SECRET})"

            MISSION_ID=$(mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -sN -e "
              SELECT m.id FROM missions m
              WHERE m.brandId IS NOT NULL AND m.brandId > 0
              ORDER BY m.updatedAt DESC LIMIT 1;
            " 2>/dev/null)
            if [ -z "$MISSION_ID" ]; then echo "No mission found"; exit 1; fi

            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
              UPDATE missions SET squadSlug = 'brand-archetype-positioning' WHERE id = $MISSION_ID;
            " 2>/dev/null
            echo "Mission #$MISSION_ID -> squadSlug = brand-archetype-positioning"

            set +e
            TOKEN=$(cd /home/azureuser/marketing-os/skills/ai-talent && npx tsx -e "
              import { SignJWT } from 'jose';
              const secret = new TextEncoder().encode(process.env.JWT_SECRET);
              const tok = await new SignJWT({ sub: '199' })
                .setProtectedHeader({ alg: 'HS256' })
                .setIssuedAt()
                .setExpirationTime('4h')
                .sign(secret);
              process.stdout.write(tok);
            " 2>/dev/null)
            set -e
            if [ -z "$TOKEN" ]; then echo "JWT signing failed"; exit 1; fi
            echo "JWT signed (len=${#TOKEN})"

            curl -sk -X POST "https://localhost:$PORT/api/chat/reset-squad-session" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $TOKEN" \
              -d "{\"missionId\": $MISSION_ID}" > /dev/null 2>&1 || true
            sleep 2

            run_turn() {
              local LABEL="$1"
              local MSG="$2"

              echo ""
              echo "======================================================"
              echo "$LABEL"
              echo "======================================================"

              BODY=$(python3 -c "
            import json
            body = {
              'userMessage': '$MSG',
              'conversationHistory': [],
              'missionId': $MISSION_ID,
              'squadSlug': 'brand-archetype-positioning'
            }
            print(json.dumps(body), end='')
            ")

              curl -sk -X POST "https://localhost:$PORT/api/chat" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Accept: text/event-stream" \
                -d "$BODY" \
                --max-time 180 2>/dev/null | node -e "
                  let buf='', agent='', model='', content='';
                  let curEvent='';
                  process.stdin.on('data', chunk => {
                    buf += chunk.toString();
                    const lines = buf.split('\n');
                    buf = lines.pop() || '';
                    for (const line of lines) {
                      if (line.startsWith('event: ')) { curEvent = line.slice(7).trim(); }
                      else if (line.startsWith('data: ')) {
                        try {
                          const d = JSON.parse(line.slice(6));
                          if (curEvent === 'relay_step' && d.status === 'running') {
                            agent = d.agentName || agent;
                            model = d.agentModel || model;
                          } else if (curEvent === 'delta' && d.text) {
                            content += d.text;
                          }
                        } catch {}
                      }
                    }
                  });
                  process.stdin.on('end', () => {
                    console.log('Agent  :', agent || '(unknown)');
                    console.log('Model  :', model || '(unknown)');
                    console.log('Length :', content.length, 'chars');
                    console.log('');
                    console.log('--- OUTPUT ---');
                    console.log(content || '(empty)');
                    console.log('--- END ---');
                  });
                "
            }

            INTAKE_MSG="${BRAND}，${DESC}請用品牌原型定位法開始分析。"

            run_turn "Turn 1 - Squad Lead Intake" "$INTAKE_MSG"
            sleep 3
            run_turn "Turn 2 - Step 1: Brand Personality Audit" "繼續"
            sleep 3
            run_turn "Turn 3 - Step 2: Archetype Selection" "繼續"
            sleep 3
            run_turn "Turn 4 - Step 3: Brand Voice Guide" "繼續"
            sleep 3
            run_turn "Turn 5 - Step 4: Visual Experience Direction" "繼續"
            sleep 3
            run_turn "Turn 6 - Step 5: Omnichannel Consistency Audit" "繼續"

            echo ""
            echo "======================================================"
            echo "brand-archetype-positioning full output test complete"
            echo "======================================================"
