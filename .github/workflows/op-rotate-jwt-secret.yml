name: Ops — Rotate JWT_SECRET (forces all users to re-login)
# 2026-05-14 (P0-4): JWT_SECRET was committed to git history pre-rotation.
# Anyone who saw git log could forge tokens. Generate a fresh 64-byte
# random secret, write to prod .env, reload onbrand. All active sessions
# become invalid → users see "session expired" → re-login.
#
# When to run: before 100-user trial open. NOT during peak usage.
on: { workflow_dispatch: {} }
jobs:
  rotate:
    runs-on: [self-hosted, linux, vm-onbrand]
    timeout-minutes: 2
    steps:
      - name: Generate + write new secret
        run: |
          set -e
          ENV=/opt/onbrand/app/skills/ai-talent/.env
          [ -f "$ENV" ] || { echo "missing $ENV"; exit 1; }

          NEW_SECRET=$(openssl rand -base64 64 | tr -d '\n' | tr -d '=' | head -c 86)
          [ -z "$NEW_SECRET" ] && { echo "secret generation failed"; exit 1; }
          echo "::add-mask::$NEW_SECRET"

          cp "$ENV" "${ENV}.bak.$(date +%s)"

          # Replace existing JWT_SECRET line or append
          if grep -q '^JWT_SECRET=' "$ENV"; then
            # Use a delimiter that won't collide with the secret's base64 chars
            python3 -c "
          import re, sys, pathlib
          p = pathlib.Path('$ENV')
          s = p.read_text()
          new = re.sub(r'^JWT_SECRET=.*$', 'JWT_SECRET=$NEW_SECRET', s, flags=re.M)
          p.write_text(new)
          "
          else
            echo "JWT_SECRET=$NEW_SECRET" >> "$ENV"
          fi
          chmod 600 "$ENV"
          echo "── confirm JWT_SECRET line exists (value masked) ──"
          grep -c '^JWT_SECRET=' "$ENV"

      - name: Reload onbrand pm2 (graceful)
        run: |
          set -e
          pm2 reload onbrand --update-env
          sleep 2
          pm2 list 2>&1 | grep onbrand

      - name: Smoke
        run: |
          set +e
          for i in 1 2 3 4 5; do
            code=$(curl -sk -o /dev/null -w "%{http_code}" https://onbrand.sowork.ai/health 2>/dev/null)
            echo "try $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          echo "health didn't pass after rotation"
          exit 1
