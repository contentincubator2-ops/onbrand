name: Admin — Fix skills/methodology table collation

# Root cause of "Illegal mix of collations" error:
# skills + methodology tables created with utf8mb4_unicode_ci, but the
# rest of mos_db (and the connection default) uses utf8mb4_0900_ai_ci.
# Any string comparison crashes the whole tRPC call.
#
# Fix: convert skills + methodology to match the DB default collation.

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          script: |
            set -e
            ENV_FILE=/opt/marketing-os/app/skills/ai-talent/.env
            set -a; source "$ENV_FILE"; set +a
            DB_HOST="${DB_HOST:-127.0.0.1}"; DB_USER="${DB_USER:-root}"; DB_NAME="${DB_NAME:-mos_db}"

            run_sql() { MYSQL_PWD="$DB_PASSWORD" mysql -h"$DB_HOST" -u"$DB_USER" "$DB_NAME" -e "$1"; }

            echo "===== 1. Detect DB default collation ====="
            run_sql "SELECT DEFAULT_CHARACTER_SET_NAME, DEFAULT_COLLATION_NAME FROM information_schema.SCHEMATA WHERE SCHEMA_NAME='$DB_NAME';"

            echo "===== 2. Detect tables collation ====="
            run_sql "
              SELECT TABLE_NAME, TABLE_COLLATION
                FROM information_schema.TABLES
               WHERE TABLE_SCHEMA='$DB_NAME'
                 AND TABLE_NAME IN ('skills','methodology','squads','agents')
            "

            echo "===== 3. Convert skills + methodology to utf8mb4_0900_ai_ci ====="
            run_sql "ALTER TABLE skills CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"
            run_sql "ALTER TABLE methodology CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"

            echo "===== 4. Verify ====="
            run_sql "
              SELECT TABLE_NAME, TABLE_COLLATION
                FROM information_schema.TABLES
               WHERE TABLE_SCHEMA='$DB_NAME'
                 AND TABLE_NAME IN ('skills','methodology')
            "

            echo "===== 5. Restart pm2 marketing-os ====="
            pm2 restart marketing-os
            sleep 2
            pm2 list | grep marketing-os
