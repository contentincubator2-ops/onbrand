name: Ops — Find user celine (read-only)
on: { workflow_dispatch: {} }
jobs:
  find:
    runs-on: [self-hosted, linux, vm-onbrand]
    timeout-minutes: 2
    steps:
      - run: |
          set -e
          source /opt/onbrand/app/skills/ai-talent/.env 2>/dev/null || true
          export MYSQL_PWD="${LOCAL_DB_PASSWORD:?set LOCAL_DB_PASSWORD}"
          MYSQL="mysql -h localhost -u ${LOCAL_DB_USER:-mos_user} ${LOCAL_DB_NAME:-mos_db} -B -t"
          echo "════ users matching 'celine' ════"
          $MYSQL -e "
            SELECT id, email, role, isActive, hasUnlimitedCredits, planCode, planStatus,
                   planEndsAt, createdAt,
                   (SELECT COUNT(*) FROM brands b WHERE b.userId=u.id) AS brandCount
            FROM users u
            WHERE email LIKE '%celine%'
            ORDER BY createdAt DESC;" 2>&1
          echo ""
          echo "════ all @sowork.ai accounts (workflow only grants @sowork.tw) ════"
          $MYSQL -e "
            SELECT id, email, role, hasUnlimitedCredits, planCode
            FROM users WHERE email LIKE '%@sowork.ai' ORDER BY email;" 2>&1
