name: "Op — Probe OpenAI image models (read-only)"

# 2026-09-01 (CJ「open ai 我指定使用 gpt image 2」).
#
# ops-diagnose-image-gen.yml only ever tests gpt-image-1, so nothing proved
# that the key can open gpt-image-2 — model access is per-account on OpenAI,
# and a key with credits can still be denied a specific model. Verify before
# making gpt-image-2 the default, or the OpenAI path breaks again the moment
# it is actually used.
#
# Read-only: two small generations, no .env writes. Prints status, latency and
# image size — never the key.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, linux, vm-onbrand]
    timeout-minutes: 8
    steps:
      - name: Probe gpt-image-1 and gpt-image-2
        run: |
          set +e
          ENV=/opt/onbrand/app/skills/ai-talent/.env
          KEY=$(grep -m1 "^OPENAI_API_KEY=" "$ENV" | cut -d= -f2-)
          CURRENT=$(grep -m1 "^IMAGE_GEN_MODEL_OPENAI=" "$ENV" | cut -d= -f2-)
          echo "IMAGE_GEN_MODEL_OPENAI on the VM: ${CURRENT:-(unset — code default applies)}"
          if [ -z "$KEY" ]; then echo "OPENAI_API_KEY missing"; exit 0; fi
          echo

          probe_model() {
            M="$1"; Q="$2"
            START=$(date +%s%3N)
            CODE=$(curl -s -o /tmp/oi.json -w '%{http_code}' --max-time 180 \
              -X POST https://api.openai.com/v1/images/generations \
              -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
              -d "{\"model\":\"$M\",\"prompt\":\"a red circle on a white background\",\"n\":1,\"size\":\"1024x1024\"${Q}}")
            MS=$(( $(date +%s%3N) - START ))
            if grep -q '"b64_json"' /tmp/oi.json; then
              N=$(tr -d '\n' < /tmp/oi.json | sed 's/.*"b64_json"[[:space:]]*:[[:space:]]*"//; s/".*//' | wc -c)
              printf '  %-14s HTTP %s %7sms  IMAGE OK (%s b64 chars)\n' "$M" "$CODE" "$MS" "$N"
              return 0
            fi
            if grep -q '"url"' /tmp/oi.json; then
              printf '  %-14s HTTP %s %7sms  IMAGE OK (url form)\n' "$M" "$CODE" "$MS"
              return 0
            fi
            MSG=$(tr -d '\n' < /tmp/oi.json | sed -n 's/.*"message"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | cut -c1-140)
            printf '  %-14s HTTP %s %7sms  ERROR — %s\n' "$M" "$CODE" "$MS" "${MSG:-no image in response}"
            return 1
          }

          for M in gpt-image-1 gpt-image-2; do
            # `quality` is model-specific; if the low-quality request is
            # rejected as a bad param, retry without it before concluding the
            # model itself is unavailable.
            probe_model "$M" ',"quality":"low"'
            if [ $? -ne 0 ]; then
              if grep -qi "quality\|invalid_value\|unsupported" /tmp/oi.json; then
                echo "    ↳ retrying without the quality parameter"
                probe_model "$M" ""
              fi
            fi
          done

          echo
          echo "── how to read this ──"
          echo "IMAGE OK on gpt-image-2 → safe to make it the OpenAI default."
          echo "model_not_found / must be verified → the account cannot open that model yet."
