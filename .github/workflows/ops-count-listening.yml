name: "Ops — Count listening_mentions on dev"

# Read-only sanity: how many mentions are stored per scope for a brand on dev,
# with publish-date ranges. Confirms imports landed + explains time-window views.
on:
  push:
    branches: [dev]
    paths: [".github/workflows/ops-count-listening.yml"]
  workflow_dispatch:
    inputs:
      brandId:
        description: "Brand id"
        type: string
        default: "2956"

jobs:
  count:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Count on the dev VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -e
            BRAND="${{ github.event.inputs.brandId }}"; BRAND="${BRAND:-2956}"
            cd /opt/onbrand/current/skills/ai-talent
            set -a; source .env; set +a
            node -e "
              const m=require('mysql2/promise');
              (async()=>{
                const c=await m.createConnection({host:process.env.LOCAL_DB_HOST,port:+(process.env.LOCAL_DB_PORT||3306),user:process.env.LOCAL_DB_USER,password:process.env.LOCAL_DB_PASSWORD,database:process.env.LOCAL_DB_NAME});
                const [r]=await c.query('SELECT scope, COUNT(*) n, MIN(publishedAt) mn, MAX(publishedAt) mx, SUM(publishedAt >= DATE_FORMAT(NOW()-INTERVAL 30 DAY,\"%Y-%m-%d\")) last30 FROM listening_mentions WHERE brandId=? GROUP BY scope', [$BRAND]);
                console.log('brand $BRAND listening_mentions by scope:'); console.table(r);
                process.exit(0);
              })().catch(e=>{console.error(e);process.exit(1);});
            "
