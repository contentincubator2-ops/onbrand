name: Admin — Generate agent avatars (DiceBear notionists)

# Batch-generates DiceBear "notionists" PNG avatars for all agents.
# Stores 4 size variants (64/128/256/512px) per agent on disk and
# writes agents.avatarUrl to the database.
#
# Background colour is automatically keyed by agent platform/specialty:
#   Facebook=#4267B2, Instagram=#C13584, LinkedIn=#0077B5, YouTube=#CC0000,
#   Strategy=#6548C6, Research=#0891B2, Writer=#059669, Visual=#E11D48,
#   Analytics=#D97706, PR=#7C3AED, Calendar=#0369A1, Ads=#B45309
#
# Uses DiceBear free public API — no API key required.
# Throughput: ~0.8 agents/second (300ms delay per size variant).
# 1000 agents ≈ 20 minutes.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Type "true" to preview URLs only (no writes)'
        required: false
        default: 'false'
      reuse:
        description: 'Type "true" to skip agents already with avatarUrl'
        required: false
        default: 'false'
      limit:
        description: 'Max agents to process (blank = all)'
        required: false
      slug:
        description: 'Only process this agent slug'
        required: false

jobs:
  generate:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 120
    steps:
      - name: Pull latest main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd /opt/marketing-os/app
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/contentincubator2-ops/Marketing-OS.git"
          git fetch origin main && git reset --hard origin/main
          echo "Commit: $(git log --oneline -1)"

      - name: Install deps
        run: |
          cd /opt/marketing-os/app/skills/ai-talent
          npm install --legacy-peer-deps 2>&1 | tail -3

      - name: Generate avatars
        env:
          DRY:   ${{ github.event.inputs.dry_run }}
          REUSE: ${{ github.event.inputs.reuse }}
          LIMIT: ${{ github.event.inputs.limit }}
          SLUG:  ${{ github.event.inputs.slug }}
        run: |
          set -e
          AI=/opt/marketing-os/app/skills/ai-talent
          mkdir -p /opt/marketing-os/covers

          ARGS=""
          [ "$DRY"   = "true" ] && ARGS="$ARGS --dry-run"
          [ "$REUSE" = "true" ] && ARGS="$ARGS --reuse"
          [ -n "$LIMIT" ]       && ARGS="$ARGS --limit=$LIMIT"
          [ -n "$SLUG"  ]       && ARGS="$ARGS --slug=$SLUG"

          echo "Running: generateAgentAvatars.ts $ARGS"
          cd "$AI"
          npx tsx scripts/generateAgentAvatars.ts $ARGS
