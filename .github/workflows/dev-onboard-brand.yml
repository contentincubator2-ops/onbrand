name: "DEV — Onboard brand(s) from payload files"

# Lives on the `dev` branch only, and runs on the DEV VM.
#
# Why a path-scoped push trigger instead of workflow_dispatch:
# GitHub only exposes workflow_dispatch for workflows that exist on the
# DEFAULT branch. This one is intentionally dev-only, so it is driven the
# same way the team already drives dev-side imports — push a payload file
# and the push runs it.
#
# To onboard a brand: add/edit a JSON file under ops/onboard-dev/ and push
# to dev. Re-running is safe: a brand whose name already exists for that
# user is skipped, not duplicated.
#
# Environment separation matters here and is easy to get wrong:
#   prod : /opt/onbrand/app     · pm2 onbrand     · repo-level secrets
#   dev  : /opt/onbrand/current · pm2 onbrand-dev · `dev` environment secrets
# `environment: dev` is what actually swaps the SSH target — a path-only
# change would still land on production.

on:
  push:
    branches: [dev]
    paths:
      - "ops/onboard-dev/**.json"

permissions:
  contents: read

concurrency:
  group: dev-onboard-brand
  cancel-in-progress: false

jobs:
  onboard:
    runs-on: ubuntu-24.04
    environment: dev
    timeout-minutes: 30
    steps:
      - name: Check out dev
        uses: actions/checkout@v4

      - name: Collect payloads
        id: payload
        run: |
          set -e
          if ! ls ops/onboard-dev/*.json >/dev/null 2>&1; then
            echo "no payload files found"; exit 1
          fi
          # Pack every payload into one base64 blob — keeps CJK safe through
          # the shell the same way the other admin workflows do.
          jq -s '.' ops/onboard-dev/*.json > /tmp/payloads.json
          echo "count=$(jq 'length' /tmp/payloads.json)" >> "$GITHUB_OUTPUT"
          echo "b64=$(base64 -w0 /tmp/payloads.json)" >> "$GITHUB_OUTPUT"
          jq -r '.[].name' /tmp/payloads.json | sed 's/^/  payload: /'

      - name: Create brand(s) + run positioning on the DEV VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          PAYLOADS_B64: ${{ steps.payload.outputs.b64 }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 28m
          envs: PAYLOADS_B64
          script: |
            set -e
            cd /opt/onbrand/current/skills/ai-talent
            set -a; source .env 2>/dev/null; set +a

            echo "=== target check — this MUST be dev, not prod ==="
            echo "host    : $(hostname)"
            echo "release : $(readlink -f /opt/onbrand/current)"
            echo "database: ${LOCAL_DB_NAME:-mos_db} @ ${LOCAL_DB_HOST:-127.0.0.1}"
            pm2 list 2>/dev/null | grep -oE "onbrand[-a-z]*" | sort -u || true
            echo "================================================"

            node --import tsx -e "
              const mysql = require('mysql2/promise');
              Promise.all([
                import('./server/_core/positioningJobRunner.ts'),
                import('./server/_core/positioningSteps.ts'),
              ]).then(async ([jobRunner, stepsMod]) => {
                const { startPositioningJob } = jobRunner;
                const { buildBrandPositioningSteps } = stepsMod;
                const payloads = JSON.parse(Buffer.from(process.env.PAYLOADS_B64, 'base64').toString('utf8'));

                const conn = await mysql.createConnection({
                  host: process.env.LOCAL_DB_HOST || '127.0.0.1',
                  port: Number(process.env.LOCAL_DB_PORT || 3306),
                  user: process.env.LOCAL_DB_USER || 'mos_user',
                  password: process.env.LOCAL_DB_PASSWORD,
                  database: process.env.LOCAL_DB_NAME || 'mos_db',
                });

                const started = [];
                for (const b of payloads) {
                  const [uRows] = await conn.execute('SELECT id FROM users WHERE email = ? LIMIT 1', [b.ownerEmail]);
                  const userId = uRows[0]?.id;
                  if (!userId) { console.log('SKIP ' + b.name + ' — no such user in DEV db: ' + b.ownerEmail); continue; }

                  const [dupe] = await conn.execute('SELECT id FROM brands WHERE userId = ? AND name = ? LIMIT 1', [userId, b.name]);
                  if (dupe[0]) { console.log('SKIP ' + b.name + ' — already exists id=' + dupe[0].id); continue; }

                  const slug = (b.slugBase || 'brand') + '-' + Math.random().toString(36).slice(2, 7);
                  const [ins] = await conn.execute(
                    'INSERT INTO brands (userId, createdBy, slug, name, website, industry, targetAudience, targetCountry, outputLanguage, dataSource, isDefault, positioningStatus, createdAt, updatedAt) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, \"manual\", 0, \"in_progress\", NOW(), NOW())',
                    [userId, userId, slug, b.name, b.website || null, b.industry || null, b.targetAudience || null, b.targetCountry || null, b.outputLanguage || null],
                  );
                  const brandId = ins.insertId;
                  await conn.execute('INSERT INTO brand_members (brandId, userId, role, addedBy) VALUES (?, ?, \"owner\", ?)', [brandId, userId, userId]);
                  console.log('BRAND_CREATED id=' + brandId + ' slug=' + slug + ' name=' + b.name);

                  const steps = buildBrandPositioningSteps({ lang: 'zh-TW', outputLanguage: b.outputLanguage || 'zh-TW' });
                  startPositioningJob({
                    userId, entityKind: 'brand', entityId: brandId,
                    brandName: b.name, industry: b.industry || '',
                    description: b.description, steps,
                  });
                  started.push({ brandId, name: b.name, totalSteps: steps.length });
                }

                if (started.length === 0) { console.log('nothing to do'); process.exit(0); }

                const ids = started.map((s) => s.brandId);
                const deadline = Date.now() + 24 * 60 * 1000;
                while (Date.now() < deadline) {
                  const [rows] = await conn.execute(
                    'SELECT entityId, status, currentStep, totalSteps FROM positioning_jobs WHERE entityKind=\"brand\" AND entityId IN (' + ids.map(() => '?').join(',') + ') ORDER BY id DESC',
                    ids,
                  );
                  const latest = {};
                  for (const r of rows) if (!(r.entityId in latest)) latest[r.entityId] = r;
                  const statuses = ids.map((id) => latest[id] || { status: 'pending' });
                  console.log('POLL ' + JSON.stringify(statuses));
                  if (statuses.every((s) => s.status === 'done' || s.status === 'failed')) break;
                  await new Promise((res) => setTimeout(res, 10000));
                }

                // 'done' is NOT proof the content exists: the pipeline's callJSON
                // writes an empty default when a step's LLM call or JSON parse
                // fails, and the job still completes. A prod run finished 10/10
                // with an entirely blank audience segment. Surface blanks.
                for (const id of ids) {
                  const [seg] = await conn.execute(
                    'SELECT name, JSON_LENGTH(positioning) AS segCount, JSON_UNQUOTE(JSON_EXTRACT(positioning, \"\$.audience.primary\")) AS aud, JSON_UNQUOTE(JSON_EXTRACT(positioning, \"\$.differentiation.summary\")) AS diff, JSON_UNQUOTE(JSON_EXTRACT(positioning, \"\$.tagline.zhTagline\")) AS tag, JSON_UNQUOTE(JSON_EXTRACT(positioning, \"\$.goldenCircle.why\")) AS why FROM brands WHERE id = ?',
                    [id],
                  );
                  const r = seg[0] || {};
                  console.log('--- brand ' + id + ' (' + r.name + ') segments=' + r.segCount);
                  for (const k of ['aud', 'diff', 'tag', 'why']) {
                    const v = (r[k] == null || r[k] === 'null') ? '' : String(r[k]);
                    console.log('    ' + k + ' len=' + v.length + (v.length === 0 ? '  <== EMPTY' : '  ' + v.slice(0, 70)));
                  }
                  console.log('    https://dev.onbrand.sowork.ai/brands/edit?b=' + id + '&cat=positioning');
                }
                process.exit(0);
              }).catch((e) => { console.error('FAILED:', e && e.message || e); process.exit(1); });
            "
