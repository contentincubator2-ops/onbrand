name: "Ops — Write REPLICATE_API_TOKEN to prod .env"

# 2026-07-01 (CJ「跟 riverflow 一樣」gap #2): write the Replicate API token
# into prod .env so productImageCutout.ts calls BiRefNet for real transparent
# background removal instead of the passthrough fallback.
#
# Pre-req: in GitHub repo Settings → Secrets and variables → Actions, add a
# Repository Secret named exactly  REPLICATE_API_TOKEN  (starts with "r8_"),
# OR paste the token into the run input for one-shot use.
#
# After running, pm2 restarts onbrand so the new env is picked up.
# Safe to re-run.

on:
  workflow_dispatch:
    inputs:
      token_override:
        description: "Optional: paste Replicate token here (otherwise reads secrets.REPLICATE_API_TOKEN)"
        required: false
        default: ""

jobs:
  write-replicate-token:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve token (input or secret)
        id: resolve
        env:
          INPUT_KEY: ${{ inputs.token_override }}
          SECRET_KEY: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          if [ -n "$INPUT_KEY" ]; then
            echo "Using workflow input override (length: $(printf '%s' "$INPUT_KEY" | wc -c) chars)"
            echo "::add-mask::$INPUT_KEY"
            echo "key_present=1" >> "$GITHUB_OUTPUT"
          elif [ -n "$SECRET_KEY" ]; then
            echo "Using secrets.REPLICATE_API_TOKEN (length: $(printf '%s' "$SECRET_KEY" | wc -c) chars)"
            echo "key_present=1" >> "$GITHUB_OUTPUT"
          else
            echo "❌ no token provided. Add secrets.REPLICATE_API_TOKEN or paste token_override input."
            exit 1
          fi

      - name: Write to prod .env via SSH + restart pm2
        if: steps.resolve.outputs.key_present == '1'
        uses: appleboy/ssh-action@v1.0.3
        env:
          KEY_VALUE: ${{ inputs.token_override != '' && inputs.token_override || secrets.REPLICATE_API_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 120s
          envs: KEY_VALUE
          script: |
            set -e
            ENV_FILE=/opt/onbrand/app/skills/ai-talent/.env

            if [ ! -f "$ENV_FILE" ]; then
              echo "❌ .env not found at $ENV_FILE"
              exit 1
            fi

            # Upsert REPLICATE_API_TOKEN without printing the value
            if grep -qE "^REPLICATE_API_TOKEN=" "$ENV_FILE"; then
              awk -v val="$KEY_VALUE" '
                /^REPLICATE_API_TOKEN=/ { print "REPLICATE_API_TOKEN=" val; next }
                { print }
              ' "$ENV_FILE" > "${ENV_FILE}.tmp" && mv "${ENV_FILE}.tmp" "$ENV_FILE"
              echo "✓ updated REPLICATE_API_TOKEN"
            else
              echo "REPLICATE_API_TOKEN=$KEY_VALUE" >> "$ENV_FILE"
              echo "✓ appended REPLICATE_API_TOKEN"
            fi

            # Verify format without printing the secret
            if grep -qE "^REPLICATE_API_TOKEN=r8_" "$ENV_FILE"; then
              echo "  REPLICATE_API_TOKEN = (set, format ok)"
            else
              echo "  ⚠ REPLICATE_API_TOKEN format unexpected — should start with r8_"
            fi

            # Restart pm2 with refreshed env so cutout picks it up
            AI=/opt/onbrand/app/skills/ai-talent
            TSX=$AI/node_modules/.bin/tsx
            set -a; source "$ENV_FILE"; set +a
            pm2 delete onbrand 2>/dev/null || true
            pm2 start "$TSX" --name onbrand --cwd "$AI" --update-env -- server/index.ts
            pm2 save --force
            sleep 5
            curl -s -o /dev/null -w "health: HTTP %{http_code}\n" http://127.0.0.1:3101/health || true
