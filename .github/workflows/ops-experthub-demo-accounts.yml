name: "Ops — ExpertHub demo viewer accounts (one-off)"

# 2026-10-05: create/reset two demo-viewer logins for
# https://experthub.onbrand.sowork.ai so people outside SoWork can log in
# and see the Sales Hub demo.
#
# Both emails are @sowork.tw, which already passes the Hub's existing
# adminProcedure check (role='admin' OR email domain sowork.tw/.ai) — no
# code change needed. Reuses scripts/hub-admin.ts, already shipped on the
# VM as part of every experthub deploy; it's idempotent (upserts the user,
# resets the password if the account already exists) and only ever touches
# the experthub_demo database — never production (mos_db).
#
# Branch-push triggered (not workflow_dispatch) so it runs without landing
# on main first; the branch name itself is the trigger, picked so this
# never collides with release/experthub-demo's own deploy trigger.
#
# 2026-10-05 (attempt 2): attempt 1 assumed app_root=/opt/onbrand-demo per
# deploy-experthub-demo.yml's own script, but that path didn't exist on
# the VM ("No such file or directory") — find it for real before retrying.

on:
  push:
    branches: [ops/experthub-demo-accounts]

jobs:
  create-accounts:
    runs-on: ubuntu-latest
    steps:
      - name: locate the experthub release on the VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            echo "== pm2 =="; pm2 ls 2>/dev/null | grep -i experthub || echo "(no match)"
            echo "== pm2 describe =="; pm2 describe onbrand-experthub 2>/dev/null | grep -iE "cwd|script path" || echo "(no match)"
            echo "== /opt =="; ls -la /opt/ 2>&1
            echo "== find =="; sudo find /opt -maxdepth 2 \( -iname "*onbrand*" -o -iname "*experthub*" \) 2>&1
