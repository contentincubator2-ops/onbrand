name: Admin — Diagnose 401 on /api/chat

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            BE=/opt/marketing-os/marketing-os-backend

            echo "===== Backend .env has JWT_SECRET? ====="
            grep -c "^JWT_SECRET=" "$BE/.env" || echo "0"

            echo ""
            echo "===== JWT_SECRET first 8 chars (masked) ====="
            grep "^JWT_SECRET=" "$BE/.env" | head -1 | cut -c1-24
            echo "(above should start with JWT_SECRET=... then 8 masked chars)"

            echo ""
            echo "===== Backend running? ====="
            pm2 list | grep -E "backend|marketing-os" | head -5
            echo ""
            echo "===== Last 20 lines of backend error log ====="
            pm2 logs marketing-os-backend-dev --lines 20 --nostream 2>&1 | tail -30

            echo ""
            echo "===== Hit /api/chat without token to confirm 401 ====="
            curl -s -o /dev/null -w "HTTP %{http_code}\n" -X POST -H "Content-Type: application/json" -d '{}' http://127.0.0.1:3101/api/chat

            echo ""
            echo "===== Hit /api/auth/me to see if jwt verify path works ====="
            curl -s -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:3101/api/auth/me

            echo ""
            echo "===== Diff .env JWT_SECRET between old /home repo and /opt backend ====="
            if [ -f /home/azureuser/marketing-os/skills/ai-talent/.env ]; then
              OLD=$(grep '^JWT_SECRET=' /home/azureuser/marketing-os/skills/ai-talent/.env 2>/dev/null | md5sum | cut -c1-8)
              NEW=$(grep '^JWT_SECRET=' "$BE/.env" 2>/dev/null | md5sum | cut -c1-8)
              echo "OLD .env JWT_SECRET md5 (first 8): $OLD"
              echo "NEW .env JWT_SECRET md5 (first 8): $NEW"
              if [ "$OLD" = "$NEW" ]; then
                echo "  ✓ JWT_SECRETs match"
              else
                echo "  ⚠ JWT_SECRETs DIFFER — tokens signed by old server will fail on new"
              fi
            fi
