name: Admin — Cleanup Template Squads (workspace IS NULL)

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: SSH & deactivate template squads
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 120s
          script: |
            set -e
            cd /home/azureuser/marketing-os
            npm run db:cleanup-templates --prefix skills/ai-talent
