name: Admin — Classify squad tasks (LLM → task_label + mockup variant)

# Runs scripts/classifySquadTasks.ts on the VM. For each squad, asks
# Azure Foundry gpt-4o-mini for a clean human-readable task label
# (e.g. "Facebook 月度行事曆", "品牌定位書") + mockup variant tag
# (platform + format from the 35-variant enum). Auto-migrates the
# 6 new columns on first run.
#
# Modes:
#   sample=true       → 5 squads, dry-run, prints to stdout (no DB write)
#   reclassify=true   → also re-process squads with classified_task_at set
#   limit=NUMBER      → only first N unclassified squads
#   batch=NUMBER      → squads per LLM call (default 20, max 30)

on:
  workflow_dispatch:
    inputs:
      sample:
        description: 'Type "true" for 5-squad dry-run preview'
        required: false
        default: 'false'
      limit:
        description: 'Limit (blank = all unclassified)'
        required: false
      batch:
        description: 'Squads per LLM call (default 20, max 30)'
        required: false
        default: '20'
      reclassify:
        description: 'Type "true" to also re-classify already-classified rows'
        required: false
        default: 'false'

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - name: Run on VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SAMPLE: ${{ github.event.inputs.sample }}
          LIMIT:  ${{ github.event.inputs.limit }}
          BATCH:  ${{ github.event.inputs.batch }}
          RECLS:  ${{ github.event.inputs.reclassify }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 3600s
          envs: GH_TOKEN,SAMPLE,LIMIT,BATCH,RECLS
          script: |
            set -e
            APP=/opt/marketing-os/app
            cd "$APP"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/contentincubator2-ops/Marketing-OS.git"
            git fetch origin main && git reset --hard origin/main

            ENV_FILE=$APP/skills/ai-talent/.env
            set -a; source "$ENV_FILE"; set +a
            cd $APP/skills/ai-talent

            ARGS=""
            [ "$SAMPLE" = "true" ] && ARGS="$ARGS --sample"
            [ -n "$LIMIT" ]        && ARGS="$ARGS --limit=$LIMIT"
            [ -n "$BATCH" ]        && ARGS="$ARGS --batch=$BATCH"
            [ "$RECLS"  = "true" ] && ARGS="$ARGS --reclassify"

            echo "===== tsx scripts/classifySquadTasks.ts $ARGS ====="
            ./node_modules/.bin/tsx scripts/classifySquadTasks.ts $ARGS
