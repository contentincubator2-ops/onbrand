name: Admin — Write Google OAuth credentials to prod .env

# 2026-05-08: write GOOGLE_CLIENT_ID + GOOGLE_CLIENT_SECRET so the
# /api/auth/google flow works.
#
# Prerequisites — do these BEFORE running this workflow:
#
# (A) Google Cloud Console
#   1. Project → APIs & Services → Credentials
#   2. Create OAuth 2.0 Client ID (type: Web application)
#   3. Authorized JavaScript origins: https://marketing-os.sowork.ai
#   4. Authorized redirect URIs:    https://marketing-os.sowork.ai/api/auth/google/callback
#   5. Copy the Client ID + Client Secret
#
# (B) GitHub repo secrets — Settings → Secrets and variables → Actions
#   - Name:  GOOGLE_CLIENT_ID      Value: ...apps.googleusercontent.com
#   - Name:  GOOGLE_CLIENT_SECRET  Value: GOCSPX-...
#
# Then run this workflow once. Safe to re-run.

on:
  workflow_dispatch:

jobs:
  write-google-oauth:
    runs-on: ubuntu-latest
    steps:
      - name: Verify secrets exist
        run: |
          ok=1
          if [ -z "${{ secrets.GOOGLE_CLIENT_ID }}" ]; then
            echo "❌ GOOGLE_CLIENT_ID secret not set"; ok=0
          else
            echo "✓ GOOGLE_CLIENT_ID present"
          fi
          if [ -z "${{ secrets.GOOGLE_CLIENT_SECRET }}" ]; then
            echo "❌ GOOGLE_CLIENT_SECRET secret not set"; ok=0
          else
            echo "✓ GOOGLE_CLIENT_SECRET present"
          fi
          if [ "$ok" = "0" ]; then
            echo ""
            echo "Add at: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

      - name: Write to prod .env via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GSEC: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          envs: GID,GSEC
          script: |
            set -e
            ENV_FILE=/opt/marketing-os/app/skills/ai-talent/.env

            if [ ! -f "$ENV_FILE" ]; then
              echo "❌ .env not found at $ENV_FILE"
              exit 1
            fi

            upsert_kv() {
              local k="$1"; local v="$2"
              if grep -qE "^${k}=" "$ENV_FILE"; then
                # awk replaces, no sed escape headaches with secrets
                awk -v key="$k" -v val="$v" '
                  $0 ~ "^"key"=" { print key "=" val; next }
                  { print }
                ' "$ENV_FILE" > "${ENV_FILE}.tmp" && mv "${ENV_FILE}.tmp" "$ENV_FILE"
                echo "  ✓ updated ${k}"
              else
                echo "${k}=${v}" >> "$ENV_FILE"
                echo "  ✓ appended ${k}"
              fi
            }

            upsert_kv "GOOGLE_CLIENT_ID"     "$GID"
            upsert_kv "GOOGLE_CLIENT_SECRET" "$GSEC"

            # Make sure APP_URL is set — needed for the callback URL build
            if ! grep -qE "^APP_URL=" "$ENV_FILE"; then
              echo "APP_URL=https://marketing-os.sowork.ai" >> "$ENV_FILE"
              echo "  ✓ appended APP_URL (was missing)"
            fi

            # Verify (without printing secrets)
            echo ""
            echo "── Verify ──"
            if grep -qE "^GOOGLE_CLIENT_ID=.+\.apps\.googleusercontent\.com" "$ENV_FILE"; then
              echo "  GOOGLE_CLIENT_ID = (set, format ok)"
            else
              echo "  ⚠ GOOGLE_CLIENT_ID format unexpected — should end in .apps.googleusercontent.com"
            fi
            if grep -qE "^GOOGLE_CLIENT_SECRET=GOCSPX-" "$ENV_FILE"; then
              echo "  GOOGLE_CLIENT_SECRET = (set, format ok)"
            else
              echo "  ⚠ GOOGLE_CLIENT_SECRET format unexpected — should start with GOCSPX-"
            fi
            v=$(grep -E "^APP_URL=" "$ENV_FILE" | head -1 | cut -d= -f2-)
            echo "  APP_URL = $v"
            echo "  → Google must allow this redirect URI:"
            echo "      $v/api/auth/google/callback"

            # Restart so PM2 picks up new env
            echo ""
            echo "── Restarting marketing-os ──"
            pm2 restart marketing-os --update-env 2>&1 | tail -5
            sleep 3
            curl -s -o /dev/null -w "Health: HTTP %{http_code}\n" http://127.0.0.1:3101/health || true

            echo ""
            echo "✓ Done. Test:  open  $v/auth/login  →  click Google login button"
