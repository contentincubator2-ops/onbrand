name: Ops — probe Gemini search grounding response shape (read-only, no VM)

# Gemini 在 AI 搜尋比對裡回答有出來，但檢索詞與引用是空的。印出回應的結構（只印欄位名與少量內容），
# 試三種工具寫法，找出哪一種真的會上網查。金鑰不印。
on:
  push:
    paths:
      - '.github/workflows/op-probe-gemini-grounding.yml'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Try tool spellings
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > /tmp/g.mjs <<'JS'
          const q = "行銷報表自動化工具有哪些？請上網查最新資料並附來源。";
          const variants = { google_search: [{ google_search: {} }], googleSearch: [{ googleSearch: {} }], google_search_retrieval: [{ google_search_retrieval: {} }] };
          for (const model of ["gemini-3.8-flash"]) for (const [name, tools] of Object.entries(variants)) {
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${process.env.GEMINI_KEY}`, {
              method: "POST", headers: { "content-type": "application/json" },
              body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: q }] }], tools }),
            });
            const t = await r.text();
            if (!r.ok) { console.log(`--- ${model} / ${name}: HTTP ${r.status} ${t.slice(0, 200)}`); continue; }
            const d = JSON.parse(t); const c = d.candidates?.[0] ?? {};
            const g = c.groundingMetadata ?? c.grounding_metadata ?? null;
            console.log(`--- ${model} / ${name}: candidate keys=${Object.keys(c).join(",")}`);
            console.log(`    groundingMetadata keys=${g ? Object.keys(g).join(",") : "(none)"}`);
            if (g) console.log(`    queries=${JSON.stringify(g.webSearchQueries ?? g.web_search_queries ?? null)}  chunks=${(g.groundingChunks ?? g.grounding_chunks ?? []).length}  firstChunk=${JSON.stringify((g.groundingChunks ?? [])[0] ?? null).slice(0, 200)}`);
            console.log(`    part kinds=${(c.content?.parts ?? []).map((p) => Object.keys(p).join("+")).join(" | ")}`);
          }
          JS
          node /tmp/g.mjs
