name: Ops - Emergency env rebuild

on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 10
    steps:
      - name: Check for backup and restore or create
        env:
          SK: ${{ secrets.STRIPE_SECRET_KEY }}
          WS: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          RK: ${{ secrets.RESEND_API_KEY }}
          ANT: ${{ secrets.ANTHROPIC_API_KEY }}
          OAI: ${{ secrets.OPENAI_API_KEY }}
          GEM: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE1: ${{ secrets.CLAUDE_API_KEY_DEFAULT }}
          DSK: ${{ secrets.DEEPSEEK_API_KEY_7 }}
          PPX: ${{ secrets.PERPLEXITY_API_KEY_5 }}
          FAL: ${{ secrets.FAL_AI_API_KEY_1 }}
          AZU: ${{ secrets.AZURE_CLAUDE_SWEDEN_API_KEY }}
        run: |
          set -e
          ENV=/opt/onbrand/app/skills/ai-talent/.env
          DIR=$(dirname "$ENV")
          mkdir -p "$DIR"
          LATEST_BAK=$(ls -t "${ENV}.bak."* 2>/dev/null | head -1 || true)
          if [ -n "$LATEST_BAK" ] && [ -s "$LATEST_BAK" ]; then
            cp "$LATEST_BAK" "$ENV"
            echo "Restored from backup: $LATEST_BAK"
          else
            echo "No backup found, creating from secrets..."
            NEW_JWT=$(openssl rand -base64 64 | tr -d '\n=' | head -c 86)
            echo "::add-mask::$NEW_JWT"
            cat > "$ENV" << EOF
NODE_ENV=production
PORT=3101
APP_URL=https://onbrand.sowork.ai
CORS_ORIGIN=https://onbrand.sowork.ai,https://marketing-os.sowork.ai
EMAIL_FROM=noreply@sowork.ai
JWT_SECRET=${NEW_JWT}
STRIPE_SECRET_KEY=${SK}
STRIPE_WEBHOOK_SECRET=${WS}
RESEND_API_KEY=${RK}
ANTHROPIC_API_KEY=${ANT:-${CLAUDE1}}
CLAUDE_API_KEY_DEFAULT=${CLAUDE1}
OPENAI_API_KEY=${OAI}
GEMINI_API_KEY=${GEM}
GOOGLE_API_KEY=${GEM}
DEEPSEEK_API_KEY=${DSK}
PERPLEXITY_API_KEY=${PPX}
FAL_API_KEY=${FAL}
FAL_AI_API_KEY=${FAL}
AZURE_CLAUDE_SWEDEN_API_KEY=${AZU}
AZURE_CLAUDE_SWEDEN_ENDPOINT=https://proj-claude-sweden-resource.services.ai.azure.com/
EOF
            echo "Created .env with $(wc -l < "$ENV") lines"
          fi
          MOS=/opt/marketing-os/app/skills/ai-talent/.env
          mkdir -p "$(dirname "$MOS")"
          [ -e "$MOS" ] || ln -s "$ENV" "$MOS"
          chown azureuser:azureuser "$ENV"
          chmod 640 "$ENV"
          grep -c '=' "$ENV" && head -3 "$ENV" | sed 's/=.*/=***/'

      - name: Restart onbrand
        run: |
          pm2 restart onbrand --update-env 2>&1 | tail -5
          sleep 8
          ss -tlnp | grep 3101 || echo "port not bound yet"
          curl -sf http://localhost:3101/health && echo "healthy" || echo "no response"
