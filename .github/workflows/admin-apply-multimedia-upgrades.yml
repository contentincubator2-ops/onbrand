name: Admin — Apply multimedia step upgrades

# Splits each `multi`/`image`/`video`/`audio` step in squads.steps JSON
# into 2-3 sub-steps with proper tool + aiModel:
#   multi  → caption (gpt-4o), image (fal/flux-pro-1.1), video (fal/kling-2)
#   image  → fal/flux-pro-1.1
#   video  → fal/kling-2
#   audio  → fal/elevenlabs-tts
#
# Source: data/multimedia-upgrade-proposals.json (LLM reclassify output)
# Idempotent: skips steps whose outputType already ends in _image/_video/_audio/_caption

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Show planned mutations only"
        type: boolean
        default: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 240s
          envs: GH_TOKEN,DRY_RUN
          script: |
            set -e
            APP=/opt/marketing-os/app
            REPO="https://x-access-token:${GH_TOKEN}@github.com/contentincubator2-ops/Marketing-OS.git"
            cd "$APP"
            git remote set-url origin "$REPO"
            git fetch origin main
            git reset --hard origin/main
            cd "$APP/skills/ai-talent"
            if [ ! -d node_modules ]; then npm install --legacy-peer-deps --no-audit --no-fund 2>&1 | tail -5; fi
            echo "════════════════════════════════════════════════════════════════"
            echo "  🎬 Apply multimedia upgrades (dry_run=${DRY_RUN})"
            echo "════════════════════════════════════════════════════════════════"
            if [ "$DRY_RUN" = "true" ]; then
              npm run db:apply-multimedia-upgrades-dry
            else
              npm run db:apply-multimedia-upgrades
            fi
