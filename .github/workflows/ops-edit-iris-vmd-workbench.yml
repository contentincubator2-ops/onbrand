name: "Ops — IRIS(2983) round 4: verify tagline intact, polish scrubbed prose"
# 2026-08-21 (CJ): round-3 scrub left two awkward sentences, AND revealed a
# concurrent UI edit (tagline.competitorDiff now references 「穿見最好的自己」
# — someone ran tagline generation in the UI between rounds). Guard:
#   IF zhTagline is still 優雅・精緻・女性化 → polish the two sentences
#   ELSE → report DRIFT DETECTED and change nothing (CJ decides).
on:
  push:
    branches: [ops/iris-vmd-edit]
jobs:
  edit:
    runs-on: [self-hosted, linux, vm-onbrand]
    timeout-minutes: 10
    steps:
      - name: Write one-off script
        run: |
          cat > /opt/onbrand/app/skills/ai-talent/scripts/_tmp-iris-polish.ts <<'TSEOF'
          import * as dotenv from "dotenv";
          dotenv.config();
          import localPool from "../server/localDb";

          const BRAND = 2983, USER = 1238991;
          const ZH = "優雅・精緻・女性化";

          async function main() {
            const [rows]: any = await localPool.execute(
              `SELECT positioning, tagline FROM brands WHERE id = ? AND userId = ? LIMIT 1`, [BRAND, USER]);
            const row = (rows as any[])[0];
            if (!row) { console.error("ABORT: brand not found"); process.exit(1); }
            let pos: any = typeof row.positioning === "string" ? JSON.parse(row.positioning) : (row.positioning ?? {});

            console.log("STATE brands.tagline column:", row.tagline);
            console.log("STATE pos.tagline.zhTagline:", pos.tagline?.zhTagline);
            console.log("STATE _bookTagline:", JSON.stringify(pos._bookTagline));
            console.log("STATE currentTaglineSpot:", pos._workbench?.scenarios?.[0]?.derived?.currentTaglineSpot);
            console.log("STATE competitorDiff head:", String(pos.tagline?.competitorDiff ?? "").slice(0, 80));

            const intact = pos.tagline?.zhTagline === ZH && row.tagline === ZH;
            if (!intact) {
              console.log("DRIFT DETECTED — tagline is no longer the finalized one; making NO changes.");
              process.exit(0);
            }

            // Polish 1: tagline.competitorDiff — clean rewrite for the 三詞 tagline,
            // consistent with the official brand-book competitive frame.
            pos.tagline.competitorDiff =
              "優雅帶專櫃競品（Master Max、五銅、TOP-DO、Half half）多以單一風格或價位帶競爭；休閒帶（GINKOO、銀穗、JOAN）訴求輕鬆百搭；快時尚與低價電商則以款多價低取勝。IRIS 用「優雅・精緻・女性化」三詞同時鎖定風格、工藝與設計語彙，形成更完整、不易被單點模仿的品牌識別。";
            console.log("POLISHED competitorDiff");

            // Polish 2: trends risk sentence — drop brand-name list entirely.
            const risks = pos.trends?.risks;
            if (Array.isArray(risks) && typeof risks[0]?.body === "string") {
              risks[0].body = risks[0].body.replace(
                /^.*?持續搶占台灣市場/,
                "國際快時尚與低價電商平台以低價高速上新持續搶占台灣市場");
              console.log("POLISHED trends.risks[0].body:", risks[0].body.slice(0, 120));
            }

            await localPool.execute(
              `UPDATE brands SET positioning = ? WHERE id = ? AND userId = ?`,
              [JSON.stringify(pos), BRAND, USER]);
            console.log("DONE — polish applied");
            process.exit(0);
          }
          main().catch((e) => { console.error("FATAL:", e); process.exit(1); });
          TSEOF
          echo "script written"

      - name: Run polish
        run: |
          cd /opt/onbrand/app/skills/ai-talent
          set -a; source .env 2>/dev/null || true; set +a
          npx tsx scripts/_tmp-iris-polish.ts

      - name: Cleanup
        if: always()
        run: rm -f /opt/onbrand/app/skills/ai-talent/scripts/_tmp-iris-polish.ts
