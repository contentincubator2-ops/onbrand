name: admin · DB Audit (squads & agents)

on:
  workflow_dispatch:

jobs:
  db-audit:
    name: Query mos_db on VM
    runs-on: [self-hosted, linux, vm-marketing-os]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps (server)
        working-directory: skills/ai-talent/server
        run: npm ci --prefer-offline 2>/dev/null || npm install

      - name: Install tsx if needed
        run: npm install -g tsx 2>/dev/null || true

      - name: Run DB audit
        working-directory: skills/ai-talent
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: mos_user
          DB_PASSWORD: mos_secure_2026
          DB_NAME: mos_db
        run: |
          npx tsx scripts/db-audit-squads.ts 2>&1
