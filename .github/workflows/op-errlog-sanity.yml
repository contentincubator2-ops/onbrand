name: Ops — error_log sanity (does it have ANY rows)
on: { workflow_dispatch: {} }
jobs:
  s:
    runs-on: [self-hosted, linux, vm-onbrand]
    timeout-minutes: 1
    steps:
      - run: |
          set +e
          AI=/opt/onbrand/app/skills/ai-talent
          set -a; source "$AI/.env" 2>/dev/null; set +a
          export MYSQL_PWD="${LOCAL_DB_PASSWORD}"
          MYSQL="mysql -h ${LOCAL_DB_HOST:-localhost} -u ${LOCAL_DB_USER:-mos_user} ${LOCAL_DB_NAME:-mos_db}"
          echo "── total rows + newest/oldest ──"
          $MYSQL -t -e "SELECT COUNT(*) AS total, MIN(createdAt) AS oldest, MAX(createdAt) AS newest FROM error_log" 2>&1
          echo "── last 10 rows any age ──"
          $MYSQL -t -e "SELECT id, source, LEFT(message,70) AS m, createdAt FROM error_log ORDER BY id DESC LIMIT 10" 2>&1
          echo "── pm2 log files present ──"
          ls -la /home/azureuser/.pm2/logs/ | grep -E "onbrand|task-runs" 2>&1
          echo "── any [trpc] Error ever in current err log ──"
          grep -ac "\[trpc\] Error:" /home/azureuser/.pm2/logs/onbrand-error.log 2>/dev/null
          echo "── pm2 onbrand-error.log size + last 3 lines ──"
          wc -l /home/azureuser/.pm2/logs/onbrand-error.log 2>/dev/null
          tail -3 /home/azureuser/.pm2/logs/onbrand-error.log 2>&1 | cut -c1-160
