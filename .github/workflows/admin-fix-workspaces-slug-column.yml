name: Admin — Add workspaces.slug column (narrow schema fix)

# Production workspaces table is missing the `slug` column that the
# tenantRouter SELECT references. CJ confirmed via /theater hitting
# "Unknown column 'w.slug' in 'field list'".
#
# Scope: 1 ALTER TABLE adding ONE nullable column + backfill existing
# rows with a generated slug. No data inserted, no orphan-user bootstrap,
# no other tables touched.

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            set -e
            export MYSQL_PWD="mos_secure_2026"
            MYSQLT="mysql -h localhost -u mos_user mos_db -t --default-character-set=utf8mb4"

            echo "── 1. Inspect current schema ─────"
            $MYSQLT -e "DESCRIBE workspaces;" || echo "(table missing)"

            echo
            echo "── 2. Add slug column if missing ─────"
            EXISTS=$(mysql -h localhost -u mos_user mos_db --skip-column-names -e "
              SELECT COUNT(*) FROM information_schema.COLUMNS
              WHERE TABLE_SCHEMA='mos_db' AND TABLE_NAME='workspaces' AND COLUMN_NAME='slug'
            ")
            if [ "$EXISTS" = "0" ]; then
              echo "  + adding slug column"
              mysql -h localhost -u mos_user mos_db --default-character-set=utf8mb4 -e "
                ALTER TABLE workspaces ADD COLUMN slug VARCHAR(64) NULL;
              "
            else
              echo "  = slug column already present"
            fi

            echo
            echo "── 3. Backfill NULL slug values ─────"
            mysql -h localhost -u mos_user mos_db --default-character-set=utf8mb4 -e "
              UPDATE workspaces
              SET slug = CONCAT('ws-', id, '-', SUBSTRING(MD5(CONCAT(id, RAND())), 1, 6))
              WHERE slug IS NULL OR slug = '';
            "
            BACKFILLED=$(mysql -h localhost -u mos_user mos_db --skip-column-names -e "
              SELECT COUNT(*) FROM workspaces WHERE slug IS NOT NULL AND slug != ''
            ")
            echo "  rows with slug now: $BACKFILLED"

            echo
            echo "── 4. Final schema verification ─────"
            $MYSQLT -e "DESCRIBE workspaces;"
            $MYSQLT -e "SELECT id, slug, name, planCode FROM workspaces LIMIT 10;" 2>&1 | head -20
