name: Ops — Rename infra (marketing-os → onbrand)

# 2026-05-14 (CJ「統一命名為 onbrand」).
#
# One-shot infrastructure rename:
#   1. Create /opt/onbrand symlink to /opt/marketing-os (zero-downtime)
#   2. pm2 stop + delete 'marketing-os', restart same script under 'onbrand'
#   3. Health-check /health on port 3101
#   4. pm2 save so the new name persists across reboot
#
# After this runs successfully, every other op-*/admin-* workflow (which
# already references the new names in source) will work correctly.
#
# Safety: filesystem files are NEVER moved — the old path /opt/marketing-os
# remains physical. /opt/onbrand is a symlink. This means a rollback is
# just "rename pm2 back to marketing-os" — no data migration involved.
#
# Run this ONCE, then ignore. If it succeeded once, re-running is a no-op
# (it detects already-renamed state and exits clean).

on:
  workflow_dispatch:

jobs:
  rename:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 5
    steps:
      - name: 1. Ensure /opt/onbrand symlink
        run: |
          set -e
          if [ -L /opt/onbrand ]; then
            echo "✓ /opt/onbrand symlink already exists → $(readlink /opt/onbrand)"
          elif [ -e /opt/onbrand ]; then
            echo "❌ /opt/onbrand exists but is NOT a symlink — aborting (manual review needed)"
            exit 1
          else
            sudo ln -s /opt/marketing-os /opt/onbrand
            echo "✓ created symlink /opt/onbrand → /opt/marketing-os"
          fi
          ls -la /opt/onbrand | head -1
          test -f /opt/onbrand/app/skills/ai-talent/.env && echo "  ✓ .env reachable via new path"

      - name: 2. Rename pm2 process
        run: |
          set -e
          echo "── BEFORE ──"
          pm2 list 2>&1 | tail -15

          # Already renamed? idempotent guard
          if pm2 jlist 2>/dev/null | grep -q '"name":"onbrand"'; then
            echo "✓ pm2 process already named 'onbrand' — nothing to do"
            exit 0
          fi

          # Hardcoded start command — same as ci.yml. Safer than trying to
          # extract from pm_exec_path because tsx-wrapped scripts split
          # interpreter + args in pm2's data and reconstructing is fiddly.
          AI=/opt/onbrand/app/skills/ai-talent
          TSX="$AI/node_modules/.bin/tsx"

          if [ ! -x "$TSX" ]; then
            echo "❌ tsx binary not found at $TSX — refusing to rename without a working start command"
            exit 1
          fi

          echo "── CUTOVER (downtime ~5s) ──"
          pm2 stop marketing-os 2>/dev/null || true
          pm2 delete marketing-os 2>/dev/null || true
          pm2 start "$TSX" --name onbrand --cwd "$AI" --update-env -- server/index.ts
          pm2 save

          sleep 3
          echo "── AFTER ──"
          pm2 list 2>&1 | tail -10

      - name: 3. Health check
        run: |
          set -e
          for i in 1 2 3 4 5 6 7 8; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3101/health || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "✓ /health → 200 (attempt $i)"
              curl -s http://localhost:3101/health | head -c 250; echo
              exit 0
            fi
            echo "  attempt $i: HTTP $CODE — waiting 2s..."
            sleep 2
          done
          echo "❌ health check failed after 8 attempts — dumping last 40 log lines"
          pm2 logs onbrand --lines 40 --nostream 2>&1 || true
          echo ""
          echo "ROLLBACK HINT: 'pm2 stop onbrand && pm2 delete onbrand && pm2 start $SCRIPT --name marketing-os --cwd $CWD && pm2 save'"
          exit 1

      - name: 4. Summary
        run: |
          echo ""
          echo "════════════════════════════════════"
          echo "  RENAME COMPLETE"
          echo "════════════════════════════════════"
          echo "  pm2 name:   marketing-os → onbrand"
          echo "  symlink:    /opt/onbrand → /opt/marketing-os"
          echo "  filesystem: NOT moved (rollback-safe)"
          echo ""
          echo "  All future op-*/admin-* workflows reference the new"
          echo "  names and will work without further action."
          echo ""
          echo "  /health: $(curl -s -w ' [HTTP %{http_code}]' http://localhost:3101/health | head -c 150)"
