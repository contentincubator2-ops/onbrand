name: Admin — Set Pipedream Connect env vars on VM

# One-time setup: writes PIPEDREAM_* credentials into the ai-talent .env
# file on the self-hosted runner so the platformConnectRouter can issue
# OAuth tokens for Facebook / Instagram / LinkedIn / YouTube.
#
# How to get these values:
#   1. Log in at https://pipedream.com/
#   2. Go to Projects → your project → Settings → OAuth Credentials
#   3. Copy Client ID, Client Secret, Project ID

on:
  workflow_dispatch:
    inputs:
      client_id:
        description: 'Pipedream OAuth Client ID'
        required: true
      client_secret:
        description: 'Pipedream OAuth Client Secret'
        required: true
      project_id:
        description: 'Pipedream Project ID'
        required: true
      env:
        description: 'Environment: production or development'
        required: false
        default: 'production'
      dry_run:
        description: 'Type "true" to preview only (no writes)'
        required: false
        default: 'false'

jobs:
  set-env:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 5
    steps:
      - name: Pull latest main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd /opt/marketing-os/app
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/contentincubator2-ops/Marketing-OS.git"
          git fetch origin main && git reset --hard origin/main

      - name: Write Pipedream vars to .env
        env:
          CLIENT_ID:     ${{ github.event.inputs.client_id }}
          CLIENT_SECRET: ${{ github.event.inputs.client_secret }}
          PROJECT_ID:    ${{ github.event.inputs.project_id }}
          PD_ENV:        ${{ github.event.inputs.env }}
          DRY:           ${{ github.event.inputs.dry_run }}
        run: |
          set -e
          ENV_FILE=/opt/marketing-os/app/skills/ai-talent/.env

          if [ "$DRY" = "true" ]; then
            echo "[dry-run] Would write to $ENV_FILE:"
            echo "  PIPEDREAM_CLIENT_ID=***"
            echo "  PIPEDREAM_CLIENT_SECRET=***"
            echo "  PIPEDREAM_PROJECT_ID=${PROJECT_ID}"
            echo "  PIPEDREAM_PROJECT_ENV=${PD_ENV}"
            exit 0
          fi

          # Remove any existing PIPEDREAM_ lines then append fresh values
          sed -i '/^PIPEDREAM_/d' "$ENV_FILE" 2>/dev/null || true

          printf '\nPIPEDREAM_CLIENT_ID=%s\nPIPEDREAM_CLIENT_SECRET=%s\nPIPEDREAM_PROJECT_ID=%s\nPIPEDREAM_PROJECT_ENV=%s\n' \
            "$CLIENT_ID" "$CLIENT_SECRET" "$PROJECT_ID" "$PD_ENV" >> "$ENV_FILE"

          echo "✓ Pipedream credentials written to $ENV_FILE"
          # Show non-secret lines to confirm
          grep "^PIPEDREAM_PROJECT" "$ENV_FILE" || true
