name: Admin — Check public/static
on: { workflow_dispatch: {} }
jobs:
  check:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 2
    steps:
      - run: |
          AI=/opt/marketing-os/app/skills/ai-talent
          echo "── client/public ──"
          ls -la "$AI/client/public" 2>&1 | head
          echo ""
          echo "── client/public/static ──"
          ls -la "$AI/client/public/static" 2>&1 | head
          echo ""
          echo "── deployed public ──"
          ls -la "$AI/public" | head
          echo ""
          echo "── deployed public/static ──"
          ls -la "$AI/public/static" 2>&1 | head
