name: Admin — Force rebuild frontend

on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 900s
          envs: GH_TOKEN
          script: |
            set -e
            APP=/opt/marketing-os/app
            AI=$APP/skills/ai-talent

            echo "════ Pull latest ════"
            cd "$APP"
            REPO="https://x-access-token:${GH_TOKEN}@github.com/contentincubator2-ops/Marketing-OS.git"
            git remote set-url origin "$REPO"
            git fetch origin main
            git reset --hard origin/main

            echo ""
            echo "════ Client install ════"
            cd "$AI/client"
            npm install --legacy-peer-deps --no-audit --no-fund 2>&1 | tail -10

            echo ""
            echo "════ FULL build → temp dir (atomic swap) ════"
            BUILD_TMP="$AI/public_build_tmp"
            rm -rf "$BUILD_TMP"
            npx vite build --outDir "$BUILD_TMP" --emptyOutDir

            echo ""
            echo "════ Verify ════"
            HASH_INDEX=$(grep -oE 'index-[A-Za-z0-9_-]+\.js' "$BUILD_TMP/index.html" | head -1)
            echo "index.html references: $HASH_INDEX"
            if [ -z "$HASH_INDEX" ]; then
              echo "❌ Build failed — no index.html produced"
              rm -rf "$BUILD_TMP"
              exit 1
            fi
            if [ -f "$BUILD_TMP/assets/$HASH_INDEX" ]; then
              echo "✅ Asset present: $HASH_INDEX"
            else
              echo "❌ MISSING: $HASH_INDEX"
              rm -rf "$BUILD_TMP"
              exit 1
            fi

            echo ""
            echo "════ Atomic swap into public/ ════"
            rm -rf "$AI/public/assets" "$AI/public/index.html"
            cp -a "$BUILD_TMP/." "$AI/public/"
            rm -rf "$BUILD_TMP"
            echo "✅ public/ updated"

            echo ""
            echo "════ Restart pm2 ════"
            pm2 restart marketing-os --update-env 2>&1 | tail -5
            pm2 save
