name: Admin — Find data architect candidate for squad 678

on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            cd /home/azureuser/marketing-os/skills/ai-talent
            DB_USER=$(grep -E '^DB_USER=' .env | cut -d= -f2- | tr -d '"' | tr -d "'")
            DB_PASS=$(grep -E '^DB_PASSWORD=' .env | cut -d= -f2- | tr -d '"' | tr -d "'")
            DB_NAME=$(grep -E '^DB_NAME=' .env | cut -d= -f2- | tr -d '"' | tr -d "'")

            echo "===== Agents with data/engineering/architecture in title ====="
            mysql --host=127.0.0.1 --user="${DB_USER}" --password="${DB_PASS}" --default-character-set=utf8mb4 "${DB_NAME}" \
              -e "SELECT id, name, title, primarySkill, jobLevel
                  FROM agents WHERE isAvailable = 1
                    AND primarySkill NOT LIKE '%recruit%' AND primarySkill NOT LIKE 'chro%'
                    AND primarySkill NOT LIKE '%hr-%' AND primarySkill NOT LIKE 'hris%'
                    AND primarySkill NOT LIKE 'linkedin-recruiter%' AND primarySkill NOT LIKE 'employee-onboarding%'
                    AND primarySkill NOT LIKE 'training-%' AND primarySkill NOT LIKE 'talent-%'
                    AND (title LIKE '%Data%Engineer%' OR title LIKE '%Data%Architect%'
                         OR title LIKE '%Marketing Ops%' OR title LIKE '%MarTech%'
                         OR title LIKE '%Analytics Engineer%' OR title LIKE '%ETL%'
                         OR title LIKE '%資料工程%' OR title LIKE '%數據工程%'
                         OR title LIKE '%行銷技術%' OR title LIKE '%MarTech%')
                  ORDER BY rating DESC, id DESC LIMIT 20;"

            echo ""
            echo "===== Fallback: marketing-analytics leads / data-analysis seniors ====="
            mysql --host=127.0.0.1 --user="${DB_USER}" --password="${DB_PASS}" --default-character-set=utf8mb4 "${DB_NAME}" \
              -e "SELECT id, name, title, primarySkill, jobLevel
                  FROM agents WHERE isAvailable = 1
                    AND primarySkill IN ('marketing-analytics','data-analysis','marketing-ops','data-engineering','revops')
                    AND jobLevel IN ('vp','ad','sae','am')
                  ORDER BY FIELD(jobLevel,'vp','ad','am','sae'), rating DESC, id DESC
                  LIMIT 15;"
