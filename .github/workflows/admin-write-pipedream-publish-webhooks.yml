name: Admin — Write Pipedream Publish Webhook URLs to VM

# Sets the platform-specific Pipedream publish webhook URLs in the VM .env.
#
# HOW TO SET UP (one-time, CJ does this in Pipedream UI):
# ─────────────────────────────────────────────────────────
# For each platform you want to enable direct publishing:
#
#   1. Go to https://pipedream.com → New Workflow
#   2. Trigger: HTTP Webhook (note the URL, e.g. https://eo1a2b.m.pipedream.net)
#   3. Add step: "Run Node.js code" or use a pre-built Facebook/IG/etc action
#      The workflow receives: { caption, pageId, brandId, secret, outputId }
#   4. Add the Facebook (or other platform) "Create Post" step
#   5. Copy the workflow's HTTP webhook URL
#   6. Add it as a GitHub Secret (see secrets list below)
#   7. Run THIS workflow to push it to the VM
#
# GitHub Secrets required (set via: gh secret set <NAME>):
#   PIPEDREAM_FB_PUBLISH_WEBHOOK   — Facebook publish workflow URL
#   PIPEDREAM_IG_PUBLISH_WEBHOOK   — Instagram publish workflow URL (optional)
#   PIPEDREAM_LI_PUBLISH_WEBHOOK   — LinkedIn publish workflow URL (optional)
#   PIPEDREAM_YT_PUBLISH_WEBHOOK   — YouTube publish workflow URL (optional)
#   PIPEDREAM_TT_PUBLISH_WEBHOOK   — TikTok publish workflow URL (optional)
#   PIPEDREAM_WEBHOOK_SECRET       — Shared secret for webhook auth (any random string)
#
# After running: test by clicking "立即發布" on a scheduled post in /calendar.

on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          PIPEDREAM_FB_PUBLISH_WEBHOOK: ${{ secrets.PIPEDREAM_FB_PUBLISH_WEBHOOK }}
          PIPEDREAM_IG_PUBLISH_WEBHOOK: ${{ secrets.PIPEDREAM_IG_PUBLISH_WEBHOOK }}
          PIPEDREAM_LI_PUBLISH_WEBHOOK: ${{ secrets.PIPEDREAM_LI_PUBLISH_WEBHOOK }}
          PIPEDREAM_YT_PUBLISH_WEBHOOK: ${{ secrets.PIPEDREAM_YT_PUBLISH_WEBHOOK }}
          PIPEDREAM_TT_PUBLISH_WEBHOOK: ${{ secrets.PIPEDREAM_TT_PUBLISH_WEBHOOK }}
          PIPEDREAM_WEBHOOK_SECRET:     ${{ secrets.PIPEDREAM_WEBHOOK_SECRET }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          envs: PIPEDREAM_FB_PUBLISH_WEBHOOK,PIPEDREAM_IG_PUBLISH_WEBHOOK,PIPEDREAM_LI_PUBLISH_WEBHOOK,PIPEDREAM_YT_PUBLISH_WEBHOOK,PIPEDREAM_TT_PUBLISH_WEBHOOK,PIPEDREAM_WEBHOOK_SECRET
          script: |
            set -e
            ENV=/opt/onbrand/app/skills/ai-talent/.env
            touch "$ENV"
            cp "$ENV" "${ENV}.bak.$(date +%s)"

            upsert() {
              local KEY="$1"; local VAL="$2"
              if [ -z "$VAL" ]; then
                echo "  ⊘ $KEY (empty — skipped)"; return
              fi
              if grep -qE "^${KEY}=" "$ENV"; then
                sed -i "s|^${KEY}=.*|${KEY}=${VAL}|" "$ENV"
                echo "  ↻ $KEY (updated)"
              else
                echo "${KEY}=${VAL}" >> "$ENV"
                echo "  + $KEY (added)"
              fi
            }

            echo "════════════════════════════════════════════════"
            echo "  Writing Pipedream publish webhook URLs"
            echo "════════════════════════════════════════════════"
            upsert PIPEDREAM_FB_PUBLISH_WEBHOOK "$PIPEDREAM_FB_PUBLISH_WEBHOOK"
            upsert PIPEDREAM_IG_PUBLISH_WEBHOOK "$PIPEDREAM_IG_PUBLISH_WEBHOOK"
            upsert PIPEDREAM_LI_PUBLISH_WEBHOOK "$PIPEDREAM_LI_PUBLISH_WEBHOOK"
            upsert PIPEDREAM_YT_PUBLISH_WEBHOOK "$PIPEDREAM_YT_PUBLISH_WEBHOOK"
            upsert PIPEDREAM_TT_PUBLISH_WEBHOOK "$PIPEDREAM_TT_PUBLISH_WEBHOOK"
            upsert PIPEDREAM_WEBHOOK_SECRET     "$PIPEDREAM_WEBHOOK_SECRET"

            echo
            pm2 restart onbrand --update-env 2>&1 | tail -3 || echo "(pm2 restart skipped)"
            echo "✓ Done. Test by clicking 立即發布 on /calendar."
