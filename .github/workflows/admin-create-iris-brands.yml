name: "Admin — Create IRIS/Iris Girls brands (sowork@sowork.tw)"

# 2026-07-23 (CJ: 7/27 教育訓練): one-shot brand creation grounded on the
# official 品牌手冊. Script is idempotent — safe to re-run; waits in-process
# for the positioning pipelines to finish (up to ~25 min).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full = 建品牌+定位+抓產品；discovery-only = 只清雜訊+重抓產品；seed-products = 種入分類頁商品+跑產品定位"
        type: choice
        default: "full"
        options: ["full", "discovery-only", "seed-products", "irisgirls-competition"]

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create brands + run positioning
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 35m
          script: |
            set -e
            cd /opt/onbrand/app/skills/ai-talent
            set -a; source .env; set +a
            if [ "${{ github.event.inputs.mode }}" = "irisgirls-competition" ]; then
              npx tsx scripts/admin-update-irisgirls-competition.ts
            elif [ "${{ github.event.inputs.mode }}" = "seed-products" ]; then
              npx tsx scripts/admin-seed-iris-products.ts
            else
              FLAG=""
              if [ "${{ github.event.inputs.mode }}" = "discovery-only" ]; then FLAG="--discovery-only"; fi
              npx tsx scripts/admin-create-iris-brands.ts $FLAG
            fi
