name: Ops — Probe OpenAI key validity (read-only)
# 2026-07-02: after the user revoked some OpenAI keys, confirm the prod
# OPENAI_API_KEY in .env still authenticates. Prints ONLY the HTTP status +
# whether gpt-image models are visible. Never prints the key.
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: [self-hosted, linux, vm-onbrand]
    timeout-minutes: 2
    steps:
      - run: |
          set +e
          set -a; source /opt/onbrand/app/skills/ai-talent/.env 2>/dev/null; set +a
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "❌ OPENAI_API_KEY is not set in .env"; exit 0
          fi
          echo "OPENAI_API_KEY present (length: ${#OPENAI_API_KEY} chars)"
          echo ""
          echo "── Auth check: GET https://api.openai.com/v1/models ──"
          CODE=$(curl -s -o /tmp/oai_models.json -w "%{http_code}" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            https://api.openai.com/v1/models)
          echo "HTTP $CODE"
          if [ "$CODE" = "200" ]; then
            echo "✅ Key is VALID"
            echo "── image models visible ──"
            grep -oE '"id"\s*:\s*"gpt-image[^"]*"' /tmp/oai_models.json | sort -u || echo "(no gpt-image models listed for this key)"
          elif [ "$CODE" = "401" ]; then
            echo "❌ Key is INVALID / REVOKED (401 Unauthorized) — this is the one you cancelled."
          else
            echo "⚠️ Unexpected status $CODE. Body (first 300 chars):"
            head -c 300 /tmp/oai_models.json; echo ""
          fi
          rm -f /tmp/oai_models.json
