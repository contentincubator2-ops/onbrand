name: Admin — One-off — fix Pokemon Go event brand

# Direct UPDATE: event id 1 (Pokémon GO 2026年5月單首龍經典社群日)
# has brandId=NULL and no event_products → attach to brand 2830
# (Pokemon GO 台灣社群).

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 2
    steps:
      - name: Run
        run: |
          set -e
          AI=/opt/marketing-os/app/skills/ai-talent
          set -a; source "$AI/.env" 2>/dev/null; set +a
          export MYSQL_PWD="${LOCAL_DB_PASSWORD}"
          MYSQL="mysql -h ${LOCAL_DB_HOST:-localhost} -u ${LOCAL_DB_USER:-mos_user} ${LOCAL_DB_NAME:-mos_db}"

          echo "Before:"
          $MYSQL -B -N --silent -e "SELECT id, name, brandId FROM events WHERE userId=199" | sed 's/\t/ | /g'

          $MYSQL -e "UPDATE events SET brandId = 2830 WHERE userId = 199 AND id = 1 AND brandId IS NULL;"

          echo ""
          echo "After:"
          $MYSQL -B -N --silent -e "SELECT id, name, brandId FROM events WHERE userId=199" | sed 's/\t/ | /g'
