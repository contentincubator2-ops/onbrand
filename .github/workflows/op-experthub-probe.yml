name: "OP — ExpertHub demo probe (read-mostly)"

# Runs scripts/hub-probe.ts against the live demo database on the dev VM, so we
# know the Dallas booth demo actually works before standing in front of it.
# workflow_dispatch is unavailable off the default branch, so this is triggered
# the same way the other ops jobs are: touch the trigger file and push.
#
# The probe cleans up every row it writes (see the script's Cleanup section).
# Put "--generate" in ops/experthub-probe/TRIGGER to also write one real post
# through the LLM; leave it out for a free, instant run.

on:
  push:
    branches: [release/experthub-demo]
    paths:
      - "ops/experthub-probe/**"

permissions:
  contents: read

# 2026-09-23: 本來跟 deploy 共用 group，想讓部署中的時候探針排隊等。但加了
# 「等這次 commit 上線」那一步之後，共用 group 變成**死結**：探針佔著位子等
# 部署，部署在後面排隊等探針放手，結果等滿 15 分鐘逾時（實測過一次）。
#
# 排序現在由那個等待步驟負責，而且比排隊精確——它等的是這個版本真的上線。
# 所以探針要有自己的 group。cancel-in-progress 開著：新的探針蓋掉還在等的舊的。
concurrency:
  group: experthub-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    environment: dev
    # 等待上限 15 分鐘 + 探針本身（--generate 約 1 分鐘），留足餘裕。
    timeout-minutes: 30
    steps:
      # 需要完整歷史才能比對這次推送動了哪些路徑（見下面那一步）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read trigger options
        id: opts
        run: |
          flags="$(grep -oE '\-\-generate' ops/experthub-probe/TRIGGER 2>/dev/null | head -1 || true)"
          echo "flags=$flags" >> "$GITHUB_OUTPUT"
          echo "probe flags: ${flags:-none}"

      # 2026-09-23 (CJ「探針等部署後再跑」)。
      #
      # 兩支工作流程共用 concurrency group，會排隊，但 GitHub 不保證誰先。實際
      # 上探針搶先跑了兩次，量到的是上一個版本（12 個方案的那次回報 8 個），
      # 每次都得再推一次空的 trigger 重跑。
      #
      # 判斷「這次推送有沒有同時觸發部署」不必查 API：deploy 的 paths-ignore 是
      # ops/**，所以只要看這次推送有沒有動到 ops/ 以外的檔案就知道。
      - name: Does this push also deploy?
        id: gate
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            # 算不出來就當成會部署 —— 等待本來就有上限，寧可多等也不要又量到舊版。
            echo "deploys=yes" >> "$GITHUB_OUTPUT"
            echo "can't resolve the previous commit; assuming a deploy is coming"
            exit 0
          fi
          changed="$(git diff --name-only "$before" "${{ github.sha }}" | grep -v '^ops/' || true)"
          if [ -n "$changed" ]; then
            echo "deploys=yes" >> "$GITHUB_OUTPUT"
            echo "this push touches code, so a deploy is running:"
            printf '%s\n' "$changed" | head -10
          else
            echo "deploys=no" >> "$GITHUB_OUTPUT"
            echo "ops-only push — nothing to wait for"
          fi

      - name: Configure SSH
        env:
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_SSH_HOST_KEY: ${{ secrets.VM_SSH_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > ~/.ssh/onbrand-dev && chmod 600 ~/.ssh/onbrand-dev
          printf '%s\n' "$VM_SSH_HOST_KEY" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

      # 等到 VM 上的 current 指向這一次的 commit 為止。比「睡個幾分鐘」精確：
      # 它等的是這個版本真的上線，不是等一段猜出來的時間。
      - name: Wait for this commit to be live
        if: steps.gate.outputs.deploys == 'yes'
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          for i in $(seq 1 60); do
            live="$(ssh -i ~/.ssh/onbrand-dev -o ConnectTimeout=10 "$VM_USER@$VM_HOST" \
                      'readlink -f /opt/onbrand-demo/current 2>/dev/null || true' | tr -d '\r')"
            case "$live" in
              *"${GITHUB_SHA}") echo "live after ${i} check(s): $live"; exit 0 ;;
            esac
            [ "$i" = 1 ] && echo "waiting for ${GITHUB_SHA:0:8}; currently live: ${live:-unknown}"
            sleep 15
          done
          # 超時不當成失敗：部署可能真的壞了，那是 deploy 那支工作流程要回報的事。
          # 但要把「我量的是哪一版」講清楚，不要讓結果看起來像是新版的。
          echo "::warning::gave up waiting after 15 min — the probe below measured whatever release is live, not ${GITHUB_SHA:0:8}"

      - name: Probe the demo
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          FLAGS: ${{ steps.opts.outputs.flags }}
        run: |
          ssh -i ~/.ssh/onbrand-dev "$VM_USER@$VM_HOST" "PROBE_FLAGS='${FLAGS}' bash -s" <<'REMOTE'
          set -uo pipefail
          ai=/opt/onbrand-demo/current/skills/ai-talent

          echo "════ host ════"
          df -h / | tail -1
          pm2 ls 2>/dev/null | grep -E "onbrand-experthub" || echo "pm2: onbrand-experthub NOT RUNNING"
          echo "release: $(readlink -f /opt/onbrand-demo/current)"
          echo "releases kept: $(ls -1 /opt/onbrand-demo/releases 2>/dev/null | wc -l)  ($(du -sh /opt/onbrand-demo/releases 2>/dev/null | cut -f1))"

          echo ""
          echo "════ what is using the disk ════"
          sudo du -xh --max-depth=1 / 2>/dev/null | sort -rh | head -12
          echo "  --- /opt ---"
          sudo du -xh --max-depth=2 /opt 2>/dev/null | sort -rh | head -12
          echo "  --- pm2 logs ---"
          du -sh ~/.pm2/logs 2>/dev/null || true
          echo "  --- mysql ---"
          sudo du -sh /var/lib/mysql 2>/dev/null || true

          echo ""
          echo "════ health ════"
          curl -s --max-time 10 http://127.0.0.1:3201/health || echo "health endpoint did not answer"
          echo ""
          for path in /for-sales /hub /login; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://127.0.0.1:3201$path")"
            echo "  $path -> $code"
          done

          echo ""
          echo "════ probe ════"
          cd "$ai" || exit 20
          ./node_modules/.bin/tsx scripts/hub-probe.ts $PROBE_FLAGS
          status=$?
          echo "probe exit: $status"
          exit $status
          REMOTE
