name: Admin — Set ANTHROPIC_MODEL + verify

on:
  workflow_dispatch:

jobs:
  setmodel:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 90s
          script: |
            cd /opt/onbrand/app/skills/ai-talent

            echo "════════ BEFORE ════════"
            grep "^ANTHROPIC_MODEL=" .env || echo "(not set)"

            # Confirmed working model (from earlier curl test):
            # claude-haiku-4-5-20251001 → 200 in 0.6s
            sed -i '/^ANTHROPIC_MODEL=/d' .env
            echo "ANTHROPIC_MODEL=claude-haiku-4-5-20251001" >> .env

            echo ""
            echo "════════ AFTER ════════"
            grep "^ANTHROPIC_MODEL=" .env

            echo ""
            echo "════════ pm2 restart with new env ════════"
            pm2 restart onbrand --update-env
            sleep 3
            pm2 status | grep onbrand

            echo ""
            echo "════════ Smoke test direct curl with new model ════════"
            curl --max-time 15 -s -w "\nHTTP %{http_code} · time %{time_total}s\n" \
              https://api.anthropic.com/v1/messages \
              -H "x-api-key: $(grep -E '^ANTHROPIC_API_KEY=' .env | head -1 | cut -d'=' -f2-)" \
              -H "anthropic-version: 2023-06-01" \
              -H "content-type: application/json" \
              -d '{"model":"claude-haiku-4-5-20251001","max_tokens":100,"messages":[{"role":"user","content":"用繁體中文說一句話"}]}' 2>&1 | tail -5
