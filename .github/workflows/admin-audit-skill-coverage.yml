name: Admin — Audit skill coverage

# Runs scripts/audit-skill-coverage.ts on the VM.
# Read-only. Produces three reports:
#   PART 1 — squad-assigned agent coverage (step ↔ skill ↔ aiModel)
#   PART 2 — orphan agent clustering
#   PART 3 — layer × outputType capability matrix

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 240s
          envs: GH_TOKEN
          script: |
            set -e
            APP=/opt/marketing-os/app
            REPO="https://x-access-token:${GH_TOKEN}@github.com/contentincubator2-ops/Marketing-OS.git"
            cd "$APP"
            git remote set-url origin "$REPO"
            git fetch origin main
            git reset --hard origin/main
            cd "$APP/skills/ai-talent"
            if [ ! -d node_modules ]; then npm install --legacy-peer-deps --no-audit --no-fund 2>&1 | tail -5; fi
            echo "════════════════════════════════════════════════════════════════"
            echo "  📊  Audit skill coverage"
            echo "  $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "════════════════════════════════════════════════════════════════"
            npm run db:audit-skill-coverage
