name: Admin — Probe Pipedream Connect integration

# Verify Pipedream env + actually try the connect-token flow used by the
# FB Pages OAuth handshake. Does NOT initiate any OAuth on user accounts;
# only fetches a short-lived connect token from the Pipedream API.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 90s
          script: |
            set -e
            cd /opt/marketing-os/app/skills/ai-talent
            set -a; . ./.env; set +a

            echo "════════════════════════════════════════════════════════"
            echo "  PIPEDREAM CONNECT PROBE"
            echo "════════════════════════════════════════════════════════"

            echo
            echo "── 1. Env vars present? ─────"
            for k in PIPEDREAM_API_KEY PIPEDREAM_CLIENT_ID PIPEDREAM_CLIENT_SECRET PIPEDREAM_PROJECT_ID PIPEDREAM_PROJECT_ENV; do
              v=$(printenv "$k" || true)
              if [ -z "$v" ]; then
                echo "  $k = (MISSING)"
              else
                len=${#v}
                head=$(echo "$v" | cut -c1-6)
                echo "  $k = ${head}... (${len} chars)"
              fi
            done

            echo
            echo "── 2. OAuth token exchange (api.pipedream.com/v1/oauth/token) ─────"
            if [ -n "$PIPEDREAM_CLIENT_ID" ] && [ -n "$PIPEDREAM_CLIENT_SECRET" ]; then
              TOKEN_RESP=$(curl -s --max-time 15 -X POST "https://api.pipedream.com/v1/oauth/token" \
                -H "Content-Type: application/json" \
                -d "{\"grant_type\":\"client_credentials\",\"client_id\":\"$PIPEDREAM_CLIENT_ID\",\"client_secret\":\"$PIPEDREAM_CLIENT_SECRET\"}")
              echo "  raw: $(echo "$TOKEN_RESP" | head -c 400)"
              ACCESS=$(echo "$TOKEN_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('access_token',''))" 2>/dev/null || true)
              if [ -n "$ACCESS" ]; then
                echo "  ✓ access_token acquired (${#ACCESS} chars)"
              else
                echo "  ✗ no access_token in response"
              fi
            else
              # Fall back to legacy PIPEDREAM_API_KEY (bearer auth) path
              echo "  client_credentials missing — trying PIPEDREAM_API_KEY bearer mode"
              ACCESS="$PIPEDREAM_API_KEY"
            fi

            echo
            echo "── 3. Connect-token request for facebook_pages ─────"
            if [ -z "$PIPEDREAM_PROJECT_ID" ]; then
              echo "  ✗ PIPEDREAM_PROJECT_ID missing — cannot proceed"
              exit 0
            fi
            if [ -z "$ACCESS" ]; then
              echo "  ✗ no auth token — cannot proceed"
              exit 0
            fi

            PD_ENV="${PIPEDREAM_PROJECT_ENV:-production}"
            EXTERNAL_USER_ID="probe-$(date +%s)"

            CONNECT_RESP=$(curl -s --max-time 20 -X POST \
              "https://api.pipedream.com/v1/connect/${PIPEDREAM_PROJECT_ID}/tokens" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $ACCESS" \
              -H "X-PD-Environment: $PD_ENV" \
              -d "{\"external_user_id\":\"$EXTERNAL_USER_ID\",\"allowed_origins\":[\"https://marketing-os.sowork.ai\"]}")
            echo "  raw: $(echo "$CONNECT_RESP" | head -c 600)"
            echo
            HAS_TOKEN=$(echo "$CONNECT_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print('YES' if d.get('token') else 'NO')" 2>/dev/null || echo "PARSE_FAIL")
            echo "  Connect token present: $HAS_TOKEN"

            echo
            echo "── 4. Tail recent app log for pipedream errors ─────"
            sudo journalctl -u pm2-marketing-os -n 100 --no-pager 2>/dev/null | grep -iE "pipedream|connect.token|facebook_pages" | tail -20 || \
              tail -200 /home/contentincubator2/.pm2/logs/marketing-os-out.log 2>/dev/null | grep -iE "pipedream|connect.token|facebook_pages" | tail -20 || \
              echo "  (no pipedream lines in recent log)"

            echo
            echo "✓ Probe complete"
