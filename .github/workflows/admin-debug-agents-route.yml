name: Admin — Debug sowork-ai-v2 /agents route 404

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            V2=/opt/sowork-ai-v2
            SRC=$V2/client/src

            echo "===== PM2 list ====="
            pm2 list

            echo ""
            echo "===== Does /opt/sowork-ai-v2 exist? ====="
            ls $V2 2>/dev/null || echo "MISSING"

            echo ""
            echo "===== App.tsx — Router/Switch route order ====="
            grep -n "Route\|Switch\|path=\|component=\|NotFound\|Redirect\|catch" $SRC/App.tsx 2>/dev/null | head -80

            echo ""
            echo "===== App.tsx Router function body (lines 150-280) ====="
            sed -n '150,280p' $SRC/App.tsx 2>/dev/null

            echo ""
            echo "===== aiTalentRouter — exported procedures ====="
            grep -n "procedure\|\.query\|\.mutation\|getAgentTasks\|list\b\|chat\b" $SRC/../server/routers/aiTalentRouter.ts 2>/dev/null | head -40

            echo ""
            echo "===== AgentsPage — does it compile-error? first 30 lines ====="
            head -30 $SRC/pages/AgentsPage.tsx 2>/dev/null || echo "FILE MISSING"

            echo ""
            echo "===== Browser-visible: curl /agents (HTML response?) ====="
            curl -s -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:$(pm2 info sowork-dev 2>/dev/null | grep 'exec cwd\|port' | head -3 | tr '\n' ' ')
            curl -s -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:5173/agents 2>/dev/null || true
            curl -s -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:3000/agents 2>/dev/null || true
            curl -s -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:4173/agents 2>/dev/null || true

            echo ""
            echo "===== sowork-dev PM2 detail ====="
            pm2 info sowork-dev 2>/dev/null || pm2 show sowork-dev 2>/dev/null || echo "sowork-dev process not found in pm2"

            echo ""
            echo "===== dist/public index.html — SPA shell? ====="
            head -5 $V2/dist/public/index.html 2>/dev/null || head -5 $V2/dist/index.html 2>/dev/null || echo "index.html not found"

            echo ""
            echo "===== nginx config serving sowork-ai-v2 ====="
            grep -r "sowork-ai-v2\|dev-app\|sowork.ai" /etc/nginx/sites-enabled/ 2>/dev/null | head -20
