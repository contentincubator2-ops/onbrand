name: "Admin — Verify C3 zh-TW language guard on dev"

# Two checks against the DEPLOYED dev release:
#  A. Deterministic heuristic (looksNonChineseForZhTWBrand) — cheap, no LLM.
#     Confirms it flags fully-English text and does NOT false-positive on
#     normal zh-TW captions with mixed English brand names/hashtags.
#  B. Live LLM re-ask (reaskInZhTW) — feeds it the exact "off-brand URL"
#     English reply pattern from the bug report and confirms the rewritten
#     caption is now Chinese-dominant (re-checked with the same heuristic).
#
# workflow_dispatch needs the file on the default branch (main); this lives
# on dev, so a path-scoped push runs it here without touching prod.
on:
  push:
    branches: [dev]
    paths: [".github/workflows/admin-verify-c3-language.yml"]
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Verify deployed zh-TW language guard on the dev VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -e
            cd /opt/onbrand/current/skills/ai-talent
            set -a; source .env; set +a
            echo "=== deployed release ==="
            basename "$(readlink -f /opt/onbrand/current)" 2>/dev/null || echo "(sha unknown)"
            echo "=== running C3 language-guard verification ==="
            node --import tsx -e '
            const guard = setTimeout(() => { console.error("timeout"); process.exit(3); }, 90000);
            import("./server/_core/quickTaskOrchestra").then(async (m) => {
              const detect = m.looksNonChineseForZhTWBrand;
              if (typeof detect !== "function") { console.error("looksNonChineseForZhTWBrand NOT exported on deployed build"); clearTimeout(guard); process.exit(2); }

              console.log("=== A. deterministic heuristic ===");
              const detCases = [
                { name: "normal zh-TW caption", input: "今天想跟你分享這款保養品的溫和配方，敏感肌也能安心使用。#保養 #敏感肌", wantFlag: false },
                { name: "zh-TW with English brand name", input: "OnBrand 幫你把品牌內容自動化，從貼文到圖片一次搞定。立即體驗 AI 行銷夥伴。", wantFlag: false },
                { name: "fully English (the actual bug)", input: "This link does not appear to be related to your brand. Please share a URL relevant to your products or services.", wantFlag: true },
                { name: "zh-TW with hashtag+handle in English", input: "新品上市囉！這次跟 @influencer 合作，用最溫和的方式呵護肌膚。#新品上市 #敏感肌友善", wantFlag: false },
              ];
              let detFail = 0;
              for (const c of detCases) {
                const got = detect(c.input);
                const ok = got === c.wantFlag;
                if (!ok) detFail++;
                console.log((ok ? "PASS  " : "FAIL  ") + c.name + " (flagged=" + got + ", want=" + c.wantFlag + ")");
              }

              console.log("=== B. live LLM re-ask (calling the DEPLOYED reaskInZhTW directly, incl. its own retry) ===");
              const wrongLangCaption = "This link does not appear to be related to your brand. Please share a URL that connects to your products, services, or brand story so we can craft the right post for you.";
              const reask = m.reaskInZhTW;
              if (typeof reask !== "function") { console.error("reaskInZhTW NOT exported on deployed build"); clearTimeout(guard); process.exit(2); }
              const rewritten = await reask(wrongLangCaption);
              const stillFlagged = detect(rewritten);
              console.log("before: " + JSON.stringify(wrongLangCaption));
              console.log("before flagged: " + detect(wrongLangCaption));
              console.log("after:  " + JSON.stringify(rewritten));
              console.log("after flagged: " + stillFlagged);
              const bOk = detect(wrongLangCaption) === true && stillFlagged === false && rewritten.length > 0;
              console.log(bOk ? "PASS  live re-ask converts English → zh-TW" : "FAIL  live re-ask did not fix language");

              clearTimeout(guard);
              const fail = detFail + (bOk ? 0 : 1);
              console.log("----");
              console.log(fail === 0 ? "ALL PASS — deployed C3 language guard verified on dev" : (fail + " CASE(S) FAILED"));
              process.exit(fail === 0 ? 0 : 1);
            }).catch((e) => { clearTimeout(guard); console.error("import/run error:", e && e.message ? e.message : e); process.exit(2); });
            '
