name: Admin — Test theater.generateImage end-to-end

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 120s
          script: |
            cd /opt/marketing-os/app/skills/ai-talent
            COOKIE='session=eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxOTkiLCJvcGVuSWQiOiJoUGRNTXBNOWpNRDdEUXZBR19QUk9TYi1zRGw4bFRmYyIsImlhdCI6MTc3Nzk0Nzk3MywiZXhwIjoxODA5NDgzOTczfQ.ffZWP9Ajog__s5xC4e8fuFjruX1zm89Trg42Ayw4BCA'

            echo "════════ ENV check: piapi key present? ════════"
            grep -E "^(PIAPI|FLUX|REPLICATE|STABILITY)_" .env | sed 's/=.*/=<set>/' || echo "(none)"

            echo ""
            echo "════════ Direct piapi/flux-schnell call ════════"
            BODY='{"0":{"brandId":2832,"platform":"facebook","caption":"粉紅健走 5/9 花博公園 健力湯試喝活動","brandTagline":"桂冠營養研究室"}}'
            curl -sS --max-time 90 -X POST \
              "http://localhost:3101/trpc/theater.generateImage?batch=1" \
              -H "Content-Type: application/json" \
              -H "Cookie: $COOKIE" \
              -d "$BODY" \
              -w "\n══ HTTP %{http_code} time %{time_total}s ══\n" \
              -o /tmp/img.txt 2>&1
            head -c 1500 /tmp/img.txt
            echo ""
            echo ""
            python3 -c "
            import json
            d = json.load(open('/tmp/img.txt'))
            r = d[0].get('result',{}).get('data',{}) or {}
            e = d[0].get('error', {})
            print('ok:', r.get('ok'))
            print('imageUrl present:', bool(r.get('imageUrl')))
            print('imageUrl preview:', (r.get('imageUrl') or '')[:120])
            print('brief:', (r.get('brief') or '')[:150])
            print('error:', r.get('error') or e.get('message',''))
            "

            echo ""
            echo "════════ pm2 logs around theater image (last 30) ════════"
            pm2 logs marketing-os --lines 100 --nostream --raw 2>&1 | grep -iE "theater|piapi|flux|dispatchGenerate|image gen" | tail -20
