name: Admin — Deploy auth-fix + URL fix to /opt

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm == 'DEPLOY' }}
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 300s
          script: |
            set -e
            OLD=/home/azureuser/marketing-os
            BE=/opt/marketing-os/marketing-os-backend
            FE=/opt/marketing-os/marketing-os-frontend

            cd "$OLD"
            git fetch origin main && git reset --hard origin/main

            echo "===== Backend: verifyToken accepts cookie ====="
            cp -v "$OLD/skills/ai-talent/server/routes/missionChatRouter.ts" \
                  "$BE/ai-talent-server/routes/missionChatRouter.ts"
            cd "$BE"
            git add ai-talent-server/routes/missionChatRouter.ts
            cat > /tmp/be_msg.txt <<'MSGEOF'
            fix: verifyToken accepts both Authorization header and session cookie

            Old Login.tsx sets localStorage authToken; new LoginPage.tsx sets
            HTTP-only session cookie. /api/chat now accepts either.
            MSGEOF
            git -c user.name="CJ Migration Bot" -c user.email="cjwang@sowork.tw" \
              commit -F /tmp/be_msg.txt || echo "(no changes)"
            git push origin main || echo "(nothing to push)"

            echo ""
            echo "===== Frontend: AppShell MissionModal wiring + MissionChatCore cookie ====="
            cp -v "$OLD/skills/ai-talent/client/src/components/AppShell.tsx" \
                  "$FE/ai-talent-client/src/components/AppShell.tsx"
            cp -v "$OLD/skills/ai-talent/client/src/components/MissionChatCore.tsx" \
                  "$FE/ai-talent-client/src/components/MissionChatCore.tsx"
            cd "$FE"
            git add ai-talent-client/src/components/AppShell.tsx \
                    ai-talent-client/src/components/MissionChatCore.tsx
            cat > /tmp/fe_msg.txt <<'MSGEOF'
            fix: new-mission URL + 401 reconciliation

            - AppShell: MissionModal.onCreated now passes (id, brandId, workspace)
              so router builds /b/:brandId/:workspace/m/:id
            - MissionChatCore: fetch sends credentials:"include" + token optional
            MSGEOF
            git -c user.name="CJ Migration Bot" -c user.email="cjwang@sowork.tw" \
              commit -F /tmp/fe_msg.txt || echo "(no changes)"
            git push origin main || echo "(nothing to push)"

            echo ""
            echo "===== Deploy backend ====="
            cd "$BE" && bash ./deploy-dev.sh 2>&1 | tail -6

            echo ""
            echo "===== Deploy frontend ====="
            cd "$FE" && bash ./deploy-dev.sh 2>&1 | tail -6

            echo ""
            echo "===== Final check ====="
            pm2 list | head -5
            curl -s -o /dev/null -w "Backend /health: HTTP %{http_code}\n" http://127.0.0.1:3101/health
            stat -c 'Frontend build: %y' /opt/marketing-os/marketing-os-backend/public/index.html
