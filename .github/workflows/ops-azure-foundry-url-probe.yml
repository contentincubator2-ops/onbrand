name: Ops — Azure Foundry URL format probe
# 2026-05-19: Tests all known Azure AI Foundry URL patterns to find which works.
# Run once, check logs, update llm.ts accordingly.
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: [self-hosted, linux, vm-onbrand]
    timeout-minutes: 3
    steps:
      - run: |
          set +e
          AI=/opt/onbrand/app/skills/ai-talent
          set -a; source "$AI/.env" 2>/dev/null; set +a

          KEY="${AZURE_FOUNDRY_API_KEY}"
          RAW_ENDPOINT="${AZURE_FOUNDRY_PROJECT_ENDPOINT}"
          MODEL="${AZURE_FOUNDRY_MODEL:-gpt-4.1}"

          # Strip /api/projects/... to get resource root
          BASE=$(echo "$RAW_ENDPOINT" | sed 's|/api/projects/[^/]*/*$||' | sed 's|/$||')

          echo "════ Config ════"
          echo "RAW_ENDPOINT = $RAW_ENDPOINT"
          echo "BASE (stripped) = $BASE"
          echo "MODEL = $MODEL"
          echo "KEY present: $([ -n "$KEY" ] && echo YES || echo NO)"
          echo ""

          BODY=$(cat <<JSON
          {"model":"$MODEL","messages":[{"role":"user","content":"hi"}],"max_tokens":5}
          JSON
          )

          probe() {
            local label="$1"
            local url="$2"
            local auth_header="$3"
            echo "════ $label ════"
            echo "URL: $url"
            HTTP=$(curl -s -o /tmp/probe_resp.json -w "%{http_code}" \
              -X POST "$url" \
              -H "Content-Type: application/json" \
              -H "$auth_header" \
              -d "$BODY" \
              --max-time 15)
            echo "HTTP: $HTTP"
            cat /tmp/probe_resp.json | head -c 400
            echo ""
            echo ""
          }

          # Pattern 1: Azure OpenAI Service format — deployment name in URL, api-key header
          probe "1. /openai/deployments/{model}/... + api-key" \
            "${BASE}/openai/deployments/${MODEL}/chat/completions?api-version=2024-12-01-preview" \
            "api-key: $KEY"

          # Pattern 2: Azure AI Inference API (new unified) — model in body, Bearer
          probe "2. /models/chat/completions + Bearer" \
            "${BASE}/models/chat/completions?api-version=2024-05-01-preview" \
            "Authorization: Bearer $KEY"

          # Pattern 3: Azure AI Inference API — model in body, api-key
          probe "3. /models/chat/completions + api-key" \
            "${BASE}/models/chat/completions?api-version=2024-05-01-preview" \
            "api-key: $KEY"

          # Pattern 4: Old openai/v1 format (what the code used before)
          probe "4. /openai/v1/chat/completions + api-key" \
            "${BASE}/openai/v1/chat/completions" \
            "api-key: $KEY"

          # Pattern 5: openai/v1 with newer api-version
          probe "5. /openai/v1/chat/completions?api-version=2024-12-01-preview + api-key" \
            "${BASE}/openai/v1/chat/completions?api-version=2024-12-01-preview" \
            "api-key: $KEY"

          # Pattern 6: Using the full project endpoint (not stripped)
          probe "6. full project endpoint /openai/deployments/{model}/... + api-key" \
            "${RAW_ENDPOINT%/}/openai/deployments/${MODEL}/chat/completions?api-version=2024-12-01-preview" \
            "api-key: $KEY"

          # Pattern 7: full project endpoint /models/... + Bearer
          probe "7. full project endpoint /models/chat/completions + Bearer" \
            "${RAW_ENDPOINT%/}/models/chat/completions?api-version=2024-05-01-preview" \
            "Authorization: Bearer $KEY"

          # Pattern 8: Azure AI inference with specific deployment path from project endpoint
          probe "8. full project endpoint /openai/v1/chat/completions + Bearer" \
            "${RAW_ENDPOINT%/}/openai/v1/chat/completions" \
            "Authorization: Bearer $KEY"

          echo "════ Done ════"
