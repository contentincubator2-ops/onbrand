name: Ops — Diagnose Pipedream Facebook OAuth (for specific user)

# Use this when a user says "Facebook授權成功後按下去卻又顯示不成功".
# Enter the OnBrand user ID (number shown in DB / logs) and this workflow will:
#   1. Check env vars
#   2. Get a fresh Bearer token
#   3. List ALL accounts connected by sowork-{user_id} — NO app filter
#   4. Show each account's app slug, name, ID
#   5. Then try to list with ?app=facebook_pages filter (old behavior)
#   6. Check whether brands table has fbPageId column
#
# Compare outputs to find slug mismatches or missing OAuth connections.

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: "OnBrand user ID (integer from users table)"
        required: true
        type: string

jobs:
  diagnose:
    runs-on: [self-hosted, linux, vm-onbrand]
    timeout-minutes: 3
    steps:
      - name: Diagnose Pipedream FB OAuth for user
        run: |
          set -e
          AI=/opt/onbrand/app/skills/ai-talent
          set -a; source "$AI/.env" 2>/dev/null; set +a

          USER_ID="${{ github.event.inputs.user_id }}"
          EXTERNAL_USER="sowork-${USER_ID}"
          PD_ENV="${PIPEDREAM_PROJECT_ENV:-production}"

          echo "════════════════════════════════════════════════════"
          echo "  Target: ${EXTERNAL_USER}  (env: ${PD_ENV})"
          echo "════════════════════════════════════════════════════"
          echo ""

          echo "──── 1. Env check ────"
          [ -z "$PIPEDREAM_CLIENT_ID" ]     && echo "❌ PIPEDREAM_CLIENT_ID missing"     && exit 1
          [ -z "$PIPEDREAM_CLIENT_SECRET" ] && echo "❌ PIPEDREAM_CLIENT_SECRET missing" && exit 1
          [ -z "$PIPEDREAM_PROJECT_ID" ]    && echo "❌ PIPEDREAM_PROJECT_ID missing"    && exit 1
          echo "  CLIENT_ID    : ${PIPEDREAM_CLIENT_ID:0:10}... (${#PIPEDREAM_CLIENT_ID} chars)"
          echo "  CLIENT_SECRET: ${PIPEDREAM_CLIENT_SECRET:0:6}... (${#PIPEDREAM_CLIENT_SECRET} chars)"
          echo "  PROJECT_ID   : $PIPEDREAM_PROJECT_ID"
          echo "  ENV          : $PD_ENV"
          echo ""

          echo "──── 2. OAuth token exchange ────"
          BASIC=$(echo -n "${PIPEDREAM_CLIENT_ID}:${PIPEDREAM_CLIENT_SECRET}" | base64 -w0)
          HTTP=$(curl -s -o /tmp/pd_tok.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Basic $BASIC" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials" \
            "https://api.pipedream.com/v1/oauth/token")
          echo "  HTTP: $HTTP"
          if [ "$HTTP" != "200" ]; then
            echo "❌ Token exchange failed"; cat /tmp/pd_tok.json; exit 1
          fi
          ACCESS_TOKEN=$(python3 -c "import json; print(json.load(open('/tmp/pd_tok.json'))['access_token'])")
          echo "  ✅ access_token: ${ACCESS_TOKEN:0:12}... (${#ACCESS_TOKEN} chars)"
          echo ""

          echo "──── 3. List ALL accounts for ${EXTERNAL_USER} (no app filter) ────"
          HTTP=$(curl -s -o /tmp/pd_all.json -w "%{http_code}" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "X-PD-Environment: $PD_ENV" \
            -H "x-pd-project-id: $PIPEDREAM_PROJECT_ID" \
            "https://api.pipedream.com/v1/connect/${PIPEDREAM_PROJECT_ID}/users/${EXTERNAL_USER}/accounts?limit=50")
          echo "  HTTP: $HTTP"
          if [ "$HTTP" != "200" ]; then
            echo "❌ Accounts list failed"; cat /tmp/pd_all.json; exit 1
          fi
          echo "  Raw response:"
          cat /tmp/pd_all.json | python3 -m json.tool 2>/dev/null || cat /tmp/pd_all.json
          echo ""

          TOTAL=$(python3 -c "
          import json
          d = json.load(open('/tmp/pd_all.json'))
          accs = d if isinstance(d, list) else (d.get('data') or [])
          print(len(accs))
          " 2>/dev/null || echo "0")
          echo "  Total connected accounts: $TOTAL"

          python3 -c "
          import json
          d = json.load(open('/tmp/pd_all.json'))
          accs = d if isinstance(d, list) else (d.get('data') or [])
          if not accs:
              print('  ⚠️  No accounts found at all — user has not completed any OAuth')
          else:
              for a in accs:
                  app = a.get('app', '?')
                  slug = app.get('name_slug', '?') if isinstance(app, dict) else app
                  print(f\"  • app={slug:30s}  id={a.get('id','?'):20s}  name={a.get('name','?')}\")
          " 2>/dev/null || true
          echo ""

          echo "──── 4. List accounts with ?app=facebook_pages filter (OLD code behavior) ────"
          HTTP=$(curl -s -o /tmp/pd_fb.json -w "%{http_code}" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "X-PD-Environment: $PD_ENV" \
            -H "x-pd-project-id: $PIPEDREAM_PROJECT_ID" \
            "https://api.pipedream.com/v1/connect/${PIPEDREAM_PROJECT_ID}/users/${EXTERNAL_USER}/accounts?app=facebook_pages&limit=10")
          echo "  HTTP: $HTTP"
          FB_COUNT=$(python3 -c "
          import json
          d = json.load(open('/tmp/pd_fb.json'))
          accs = d if isinstance(d, list) else (d.get('data') or [])
          print(len(accs))
          " 2>/dev/null || echo "0")
          echo "  Accounts with app=facebook_pages filter: $FB_COUNT"
          echo ""

          echo "──── 5. DB check — brands.fbPageId column ────"
          export MYSQL_PWD="${LOCAL_DB_PASSWORD}"
          MYSQL="mysql -h ${LOCAL_DB_HOST:-localhost} -u ${LOCAL_DB_USER:-mos_user} ${LOCAL_DB_NAME:-mos_db} -N -s --silent"

          COL=$($MYSQL -e "SELECT COLUMN_NAME FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='brands' AND COLUMN_NAME='fbPageId'" 2>/dev/null || echo "")
          if [ -n "$COL" ]; then
            echo "  ✅ brands.fbPageId column exists"
            # Show existing FB bindings for this user
            $MYSQL -e "SELECT id, name, fbPageId, fbPageName, fbConnectedAt FROM brands WHERE userId = $USER_ID ORDER BY id" 2>/dev/null || true
          else
            echo "  ❌ brands.fbPageId column MISSING — run op-migrate workflow!"
          fi
          echo ""

          echo "════ SUMMARY ════"
          if [ "$TOTAL" = "0" ]; then
            echo "🔴 User has 0 connected Pipedream accounts."
            echo "   → User needs to complete the Facebook OAuth popup."
            echo "   → Check that the Connect URL has ?app=facebook_pages embedded."
          elif [ "$FB_COUNT" = "0" ] && [ "$TOTAL" -gt "0" ]; then
            echo "🟡 User has $TOTAL account(s) but NONE matched app=facebook_pages."
            echo "   → The old code was filtering too strictly."
            echo "   → The NEW code (no app filter + client-side FB_SLUGS filter) should fix this."
            echo "   → Check the app slugs listed above and add them to FB_SLUGS in publishRouter.ts if needed."
          else
            echo "✅ User has $FB_COUNT Facebook account(s). OAuth is working."
            echo "   → If still failing, check that fbPageId column exists (see step 5 above)."
          fi
