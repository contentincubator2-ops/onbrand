name: Admin — Site health (HTML + bundle)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 2
    steps:
      - name: Run
        run: |
          set -e
          echo "── /  (index.html) ──"
          curl -s -w "\n[http_code=%{http_code} size=%{size_download}]\n" "http://localhost:3000/" | tail -10

          echo ""
          echo "── built bundle ──"
          BUNDLE=$(curl -s "http://localhost:3000/" | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)
          echo "bundle path: $BUNDLE"
          if [ -n "$BUNDLE" ]; then
            curl -s -o /tmp/b.js -w "[http_code=%{http_code} size=%{size_download}]\n" "http://localhost:3000$BUNDLE"
            head -c 300 /tmp/b.js
            echo ""
            echo "  ... (file size $(wc -c < /tmp/b.js) bytes)"
            # Detect obvious build errors that get baked into the bundle
            if grep -qE 'SyntaxError|Unexpected token|Cannot find' /tmp/b.js; then
              echo "  ⚠ ERROR PATTERN FOUND IN BUNDLE"
              grep -oE 'SyntaxError[^"]{0,200}|Unexpected token[^"]{0,200}|Cannot find[^"]{0,200}' /tmp/b.js | head -5
            fi
          fi

          echo ""
          echo "── pm2 status ──"
          pm2 list 2>/dev/null | grep -E "marketing-os|name|status"

          echo ""
          echo "── last 30 error log lines ──"
          tail -30 ~/.pm2/logs/marketing-os-error.log 2>/dev/null
