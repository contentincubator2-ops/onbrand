name: Admin - revert squad approval + find FB calendar candidates
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 120s
          script: |
            set -a
            [ -f /opt/marketing-os/.env ] && . /opt/marketing-os/.env
            [ -f /opt/marketing-os/app/skills/ai-talent/.env ] && . /opt/marketing-os/app/skills/ai-talent/.env
            set +a
            DB_HOST_V=${DB_HOST:-127.0.0.1}
            DB_USER_V=${DB_USER:-root}
            DB_NAME_V=${DB_NAME:-mos_db}
            run_sql() { MYSQL_PWD="$DB_PASSWORD" mysql -h"$DB_HOST_V" -u"$DB_USER_V" "$DB_NAME_V" -t "$@"; }

            echo "STEP 1: Revert all squad approvals (CJ correction - all drafts)"
            run_sql -e "UPDATE squads SET is_approved = 0, approved_at = NULL, approved_by = NULL;"
            run_sql -e "SELECT SUM(CASE WHEN is_approved = 1 THEN 1 ELSE 0 END) AS approved, SUM(CASE WHEN is_approved = 0 THEN 1 ELSE 0 END) AS draft, COUNT(*) AS total FROM squads;"

            echo ""
            echo "STEP 2: Find FB calendar / monthly / schedule related squads"
            echo ""
            echo "--- by name (Chinese) ---"
            run_sql -e "SELECT id, slug, name, tier, strategy_layer FROM squads WHERE (name LIKE '%行事曆%' OR name LIKE '%月曆%' OR name LIKE '%排程%' OR name LIKE '%月度%') AND is_active = 1 ORDER BY tier, id LIMIT 50;"

            echo ""
            echo "--- by name (English) ---"
            run_sql -e "SELECT id, slug, name, tier, strategy_layer FROM squads WHERE (LOWER(name) LIKE '%calendar%' OR LOWER(name) LIKE '%monthly%' OR LOWER(name) LIKE '%schedule%' OR LOWER(name) LIKE '%planning%') AND is_active = 1 ORDER BY tier, id LIMIT 50;"

            echo ""
            echo "--- by workspace=facebook + content engine type ---"
            run_sql -e "SELECT id, slug, name, tier, workspace, strategy_layer FROM squads WHERE (workspace LIKE '%facebook%' OR workspace LIKE '%FB%' OR slug LIKE '%facebook%' OR slug LIKE '%fb-%') AND is_active = 1 ORDER BY tier, id LIMIT 30;"

            echo ""
            echo "--- by tags JSON contains facebook or content-calendar ---"
            run_sql -e "SELECT id, slug, name, tier, JSON_EXTRACT(tags, '$') AS tags FROM squads WHERE JSON_SEARCH(tags, 'all', '%facebook%') IS NOT NULL OR JSON_SEARCH(tags, 'all', '%calendar%') IS NOT NULL OR JSON_SEARCH(tags, 'all', '%content-calendar%') IS NOT NULL ORDER BY tier, id LIMIT 30;"

            echo ""
            echo "--- gary vee jab jab jab right hook (existing FB squad reference) ---"
            run_sql -e "SELECT id, slug, name, tier, methodology FROM squads WHERE name LIKE '%GaryVee%' OR name LIKE '%Gary Vee%' OR slug LIKE '%gary%' OR name LIKE '%Jab%' OR name LIKE '%Right Hook%' LIMIT 10;"

            echo ""
            echo "STEP 3: Show schema of squads table for reference"
            run_sql -e "DESCRIBE squads;" | head -50

            echo "Done"
