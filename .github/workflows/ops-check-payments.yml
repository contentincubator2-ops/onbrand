name: "Ops — Check payments"
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: [self-hosted, linux, vm-onbrand]
    steps:
      - name: Check payment tables and recent transactions
        run: |
          source /opt/onbrand/app/skills/ai-talent/.env 2>/dev/null || true
          H="${LOCAL_DB_HOST:-127.0.0.1}"; U="${LOCAL_DB_USER:-mos_user}"
          P="${LOCAL_DB_PASSWORD:-${LOCAL_DB_PASSWORD}}"; D="${LOCAL_DB_NAME:-mos_db}"
          echo "=== Payment-related tables ==="
          mysql -h"$H" -u"$U" -p"$P" "$D" -e \
            "SHOW TABLES LIKE '%pay%';" 2>/dev/null
          mysql -h"$H" -u"$U" -p"$P" "$D" -e \
            "SHOW TABLES LIKE '%order%';" 2>/dev/null
          mysql -h"$H" -u"$U" -p"$P" "$D" -e \
            "SHOW TABLES LIKE '%stripe%';" 2>/dev/null
          mysql -h"$H" -u"$U" -p"$P" "$D" -e \
            "SHOW TABLES LIKE '%invoice%';" 2>/dev/null
          mysql -h"$H" -u"$U" -p"$P" "$D" -e \
            "SHOW TABLES LIKE '%subscription%';" 2>/dev/null
          mysql -h"$H" -u"$U" -p"$P" "$D" -e \
            "SHOW TABLES LIKE '%billing%';" 2>/dev/null
          echo "=== All tables ==="
          mysql -h"$H" -u"$U" -p"$P" "$D" -e "SHOW TABLES;" 2>/dev/null
