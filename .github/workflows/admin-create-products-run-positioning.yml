name: "Admin — Create products + run real AI positioning pipeline"

# 2026-07-28 (CJ「要你執行好他的產品定位」): unlike brand/event (which
# import an already-authored positioning book verbatim), CJ explicitly
# wants PRODUCT positioning to run through the real AI pipeline
# (buildProductPositioningSteps + startPositioningJob) — same code path
# positioningJobsRouter.start uses. Since products.positioning has no
# `description` COLUMN, loadEntity() falls back to positioning.description
# JSON — so real scraped facts about each product go there, giving the
# pipeline honest grounding instead of hallucinating from the name alone.

on:
  workflow_dispatch:
    inputs:
      brand_id:
        description: "Owning brand id"
        required: true
        type: string
      user_email:
        description: "Owner's email"
        required: true
        type: string
      products_b64:
        description: "Base64 JSON array: [{name, slug, website, description, industry}]"
        required: true
        type: string

jobs:
  run:
    runs-on: [self-hosted, linux, vm-onbrand]
    timeout-minutes: 10
    steps:
      - run: |
          set -e
          cd /opt/onbrand/app/skills/ai-talent
          set -a; source .env 2>/dev/null; set +a
          BRAND_ID="${{ inputs.brand_id }}" USER_EMAIL="${{ inputs.user_email }}" PRODUCTS_B64="${{ inputs.products_b64 }}" \
          node --import tsx -e "
            const mysql = require('mysql2/promise');
            Promise.all([
              import('./server/_core/positioningJobRunner.ts'),
              import('./server/_core/positioningSteps.ts'),
            ]).then(async ([jobRunner, stepsMod]) => {
              const { startPositioningJob } = jobRunner;
              const { buildProductPositioningSteps } = stepsMod;

              const brandId = Number(process.env.BRAND_ID);
              const products = JSON.parse(Buffer.from(process.env.PRODUCTS_B64, 'base64').toString('utf8'));

              const conn = await mysql.createConnection({
                host: process.env.LOCAL_DB_HOST || '127.0.0.1',
                port: Number(process.env.LOCAL_DB_PORT || 3306),
                user: process.env.LOCAL_DB_USER || 'mos_user',
                password: process.env.LOCAL_DB_PASSWORD,
                database: process.env.LOCAL_DB_NAME || 'mos_db',
              });

              const [uRows] = await conn.execute('SELECT id FROM users WHERE email = ? LIMIT 1', [process.env.USER_EMAIL]);
              const userId = uRows[0]?.id;
              if (!userId) { console.error('NO SUCH USER:', process.env.USER_EMAIL); process.exit(1); }

              const ids = [];
              for (const p of products) {
                const positioning = JSON.stringify({ website: p.website, description: p.description });
                const [ins] = await conn.execute(
                  'INSERT INTO products (userId, brandId, slug, name, positioning) VALUES (?, ?, ?, ?, ?)',
                  [userId, brandId, p.slug, p.name, positioning],
                );
                const id = ins.insertId;
                ids.push(id);
                const steps = buildProductPositioningSteps({ lang: 'zh-TW', outputLanguage: 'zh-TW' });
                startPositioningJob({
                  userId, entityKind: 'product', entityId: id,
                  brandName: p.name, industry: p.industry || '兒童教育 / 兒童有聲內容',
                  description: p.description, steps,
                });
                console.log('CREATED product id=' + id + ' name=' + p.name);
              }

              const deadline = Date.now() + 8 * 60 * 1000;
              while (Date.now() < deadline) {
                const [rows] = await conn.execute(
                  'SELECT entityId, status, currentStep, totalSteps FROM positioning_jobs WHERE entityKind=\"product\" AND entityId IN (' + ids.map(() => '?').join(',') + ') ORDER BY id DESC',
                  ids,
                );
                const latest = {};
                for (const r of rows) if (!(r.entityId in latest)) latest[r.entityId] = r;
                const statuses = ids.map((id) => latest[id] || { status: 'pending' });
                console.log('POLL ' + JSON.stringify(statuses));
                if (statuses.every((s) => s.status === 'done' || s.status === 'failed')) break;
                await new Promise((res) => setTimeout(res, 8000));
              }

              const [final] = await conn.execute(
                'SELECT id, name, JSON_LENGTH(positioning) as segCount FROM products WHERE id IN (' + ids.map(() => '?').join(',') + ')',
                ids,
              );
              console.log('FINAL: ' + JSON.stringify(final));
              await conn.end();
            }).catch((e) => { console.error('FAILED:', e); process.exit(1); });
          "
