name: Admin — Trace recent caption failure full stack

on:
  workflow_dispatch:

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            cd /opt/marketing-os/app/skills/ai-talent

            echo "════════ pm2 status ════════"
            pm2 status | grep marketing-os

            echo ""
            echo "════════ Last 200 pm2 lines, ALL — searching for caption errors ════════"
            pm2 logs marketing-os --lines 300 --nostream --raw 2>&1 | tail -150

            echo ""
            echo "════════ Direct test: 資訊式 label suggests rs/yt/li task. Test all anthropic models ════════"
            ANTHROPIC_KEY=$(grep -E "^ANTHROPIC_API_KEY=" .env | head -1 | cut -d'=' -f2-)
            for MODEL in "claude-haiku-4-5-20251001" "claude-sonnet-4-6" "claude-haiku-4-5" "claude-sonnet-4-5"; do
              echo "── model: $MODEL ──"
              curl --max-time 10 -s -o /dev/null -w "HTTP %{http_code} time %{time_total}s\n" \
                https://api.anthropic.com/v1/messages \
                -H "x-api-key: $ANTHROPIC_KEY" \
                -H "anthropic-version: 2023-06-01" \
                -H "content-type: application/json" \
                -d "{\"model\":\"$MODEL\",\"max_tokens\":50,\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}]}"
            done

            echo ""
            echo "════════ DB: which agents are actually wired to which aiModel? Sample ════════"
            export MYSQL_PWD="mos_secure_2026"
            mysql -h localhost -u mos_user mos_db -e "
              SELECT aiModel, COUNT(*) AS n
              FROM agents
              GROUP BY aiModel
              ORDER BY n DESC LIMIT 15
            "
