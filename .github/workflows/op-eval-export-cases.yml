name: Ops (DEV) — export evaluation cases (runs real task cards, text only)

# 2026-10-04（CJ「第一步，我選擇 microsoft foundry」）：在 dev VM 上用真的品牌跑真的任務卡，
# 把「題目＋品牌資料＋產出」印成考卷，交給 scripts/eval/foundry_eval.py 用 Microsoft Foundry 評分。
#
# 會花 LLM 額度（每題一次文字生成；圖片關掉）。不落地、不扣點——runOrchestra 不帶 userId。
#
# 腳本用 base64 帶上 VM 而不是讀 /opt/onbrand/current 裡的那份：這樣不必先合併部署就能跑，
# 改考題的挑法也不用等一輪部署。跑的仍然是 VM 上「已部署的」server 程式——要評的就是它。
on:
  push:
    paths:
      - '.github/workflows/op-eval-export-cases.yml'
      - 'skills/ai-talent/scripts/eval/export-cases.ts'
  workflow_dispatch:
    inputs:
      brandIds:
        description: "Brand ids (comma separated)"
        required: false
        default: '2972'
      perChannel:
        description: "Cards per channel"
        required: false
        default: '0'
      allCards:
        description: "1 = every card in the catalog (all tiers, all channels)"
        required: false
        default: '1'
      suites:
        description: "cards,advisors,rewrite"
        required: false
        default: 'cards'
      concurrency:
        description: "Cards in parallel (1-6)"
        required: false
        default: '3'
      useBranch:
        description: "1 = run this commit's server code from a temp copy; 0 = run the deployed dev code"
        required: false
        default: '1'
      taskIds:
        description: "Only these task ids (comma separated, optional)"
        required: false
        default: ''

# 同一時間只跑一輪：兩輪一起跑會在 dev VM 上搶同一條模型額度，逾時的題目會被當成空白產出。
concurrency:
  group: op-eval-export-cases
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    environment: dev
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Pack the script
        run: echo "SCRIPT_B64=$(base64 -w0 skills/ai-talent/scripts/eval/export-cases.ts)" >> "$GITHUB_ENV"
      - uses: appleboy/ssh-action@v1.0.3
        env:
          SCRIPT_B64: ${{ env.SCRIPT_B64 }}
          BRAND_IDS: ${{ github.event.inputs.brandIds || '2972' }}
          PER_CHANNEL: ${{ github.event.inputs.perChannel || '0' }}
          TASK_IDS: ${{ github.event.inputs.taskIds || '' }}
          ALL_CARDS: ${{ github.event.inputs.allCards || '1' }}
          SUITES: ${{ github.event.inputs.suites || 'cards' }}
          CONCURRENCY: ${{ github.event.inputs.concurrency || '3' }}
          # USE_BRANCH=1：跑「這個 commit」的 server 程式（放在 /tmp 的暫存副本），不是 dev 站已部署的那份。
          # 用來在合併前比較修改前後的分數；不動 /opt/onbrand/current，也不重啟任何服務。
          USE_BRANCH: ${{ github.event.inputs.useBranch || '1' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 320m
          envs: SCRIPT_B64,BRAND_IDS,PER_CHANNEL,TASK_IDS,ALL_CARDS,SUITES,CONCURRENCY,USE_BRANCH,GH_TOKEN,GH_REPO,GH_SHA
          script: |
            set -e
            cd /opt/onbrand/current/skills/ai-talent
            set -a; source .env 2>/dev/null; set +a
            export BRAND_IDS PER_CHANNEL TASK_IDS ALL_CARDS SUITES CONCURRENCY
            echo "commit on box: $(readlink -f /opt/onbrand/current | sed 's#.*/##')"
            if [ "$USE_BRANCH" = "1" ]; then
              LIVE=$(pwd)
              SHADOW=/tmp/onbrand-evalshadow
              rm -rf "$SHADOW" && mkdir -p "$SHADOW"
              trap 'rm -rf /tmp/onbrand-evalshadow' EXIT
              curl -sfL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GH_REPO/tarball/$GH_SHA" \
                | tar -xz -C "$SHADOW" --strip-components=1 --wildcards '*/skills/ai-talent/*'
              cd "$SHADOW/skills/ai-talent"
              ln -s "$LIVE/node_modules" node_modules
              cp "$LIVE/.env" .env
              echo "shadow: branch commit $GH_SHA ($(find server -name '*.ts' | wc -l) server files)"
              ./node_modules/.bin/tsx scripts/eval/export-cases.ts
              exit 0
            fi
            mkdir -p scripts/eval
            F=scripts/eval/.export-cases.run.ts
            echo "$SCRIPT_B64" | base64 -d > "$F"
            trap 'rm -f "$F"' EXIT
            ./node_modules/.bin/tsx "$F"
