name: Ops (DEV) — agent exam run (real task cards on the DEV VM, text only)

# 2026-10-04。用 dev VM 的真品牌、真模型鏈跑任務卡／顧問／重寫寫手，把「題目＋品牌資料＋產出」
# 印成考卷（EVALCASE 行），再由 scripts/eval/foundry_eval.py 用 Microsoft Foundry 評分。
#
# 怎麼觸發：改 skills/ai-talent/scripts/eval/run-request.json 然後 push（任何分支）。
#   workflow 不在 main 上，不能用 workflow_dispatch；而且「改一個檔就是一次評測請求」讓多個
#   agent 各自在自己的分支上送請求，互不干擾（concurrency 以分支為單位）。
#
# 跑的是哪份程式：這個 commit 的 server 程式，放在 VM 的 /tmp 暫存副本（每次一個獨立目錄）。
#   不動 /opt/onbrand/current、不重啟服務。這樣改了任務卡的指令，不必合併部署就能看分數。
#
# 會花 LLM 額度；不落地、不扣點（runOrchestra 不帶 userId）；圖片關掉。
on:
  push:
    paths:
      - 'skills/ai-talent/scripts/eval/run-request.json'

# 同一個分支同時只跑一輪（後送的排隊）。不同分支可以同時跑。
concurrency:
  group: op-eval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    environment: dev
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Read the run request
        run: |
          R=skills/ai-talent/scripts/eval/run-request.json
          cat "$R"
          get() { node -e 'const r=require("./'"$R"'");const v=r[process.argv[1]];process.stdout.write(v===undefined||v===null?process.argv[2]:String(v))' "$1" "$2"; }
          {
            echo "TAG=$(get tag untagged)"
            echo "BRAND_IDS=$(get brandIds 2972)"
            echo "CHANNELS=$(get channels '')"
            echo "ALL_CARDS=$(get allCards 1)"
            echo "TASK_IDS=$(get taskIds '')"
            echo "EXAM_FILE=$(get examFile '')"
            echo "REPEATS=$(get repeats 1)"
            echo "CONCURRENCY=$(get concurrency 3)"
            echo "SUITES=$(get suites cards)"
            echo "DELIVERY_CHECK=$(get deliveryCheck 0)"
          } >> "$GITHUB_ENV"
      - uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 320m
          envs: TAG,BRAND_IDS,CHANNELS,ALL_CARDS,TASK_IDS,EXAM_FILE,REPEATS,CONCURRENCY,SUITES,DELIVERY_CHECK,GH_TOKEN,GH_REPO,GH_SHA,RUN_ID
          script: |
            set -e
            LIVE=/opt/onbrand/current/skills/ai-talent
            cd "$LIVE"
            set -a; source .env 2>/dev/null; set +a
            export BRAND_IDS ALL_CARDS TASK_IDS EXAM_FILE REPEATS CONCURRENCY SUITES DELIVERY_CHECK
            # 空字串的 CHANNELS 不要匯出——腳本用「有沒有設」判斷要不要限制通路。
            if [ -n "$CHANNELS" ]; then export CHANNELS; else unset CHANNELS; fi
            echo "EVALRUN tag=$TAG sha=$GH_SHA deployed=$(readlink -f /opt/onbrand/current | sed 's#.*/##')"
            SHADOW=/tmp/onbrand-evalshadow-$RUN_ID
            rm -rf "$SHADOW" && mkdir -p "$SHADOW"
            trap 'rm -rf "$SHADOW"' EXIT
            curl -sfL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GH_REPO/tarball/$GH_SHA" \
              | tar -xz -C "$SHADOW" --strip-components=1 --wildcards '*/skills/ai-talent/*'
            cd "$SHADOW/skills/ai-talent"
            ln -s "$LIVE/node_modules" node_modules
            cp "$LIVE/.env" .env
            ./node_modules/.bin/tsx scripts/eval/export-cases.ts
