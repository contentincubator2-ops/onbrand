name: Admin — Set OpenAI LLM env

# One-shot: write OPENAI_API_KEY + LLM_DEFAULT_PROVIDER=openai to VM .env,
# then restart PM2. Key is passed as masked workflow input — never in git.

on:
  workflow_dispatch:
    inputs:
      openaiApiKey:
        description: 'OpenAI API key (will be masked)'
        required: true
        type: string
      defaultModel:
        description: 'Default model name'
        required: true
        type: string
        default: 'gpt-4o-mini'

jobs:
  set-env:
    runs-on: ubuntu-latest
    steps:
      - name: Mask API key in logs
        run: echo "::add-mask::${{ inputs.openaiApiKey }}"

      - uses: appleboy/ssh-action@v1.0.3
        env:
          OAI_KEY: ${{ inputs.openaiApiKey }}
          OAI_MODEL: ${{ inputs.defaultModel }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          envs: OAI_KEY,OAI_MODEL
          script: |
            set -e
            ENV_FILE=/opt/marketing-os/app/skills/ai-talent/.env
            test -f "$ENV_FILE" || { echo ".env not found"; exit 1; }
            cp "$ENV_FILE" "$ENV_FILE.bak.$(date +%Y%m%d%H%M)" 2>/dev/null || true

            upsert() {
              local key="$1" val="$2"
              if grep -q "^${key}=" "$ENV_FILE"; then
                sed -i "s|^${key}=.*|${key}=${val}|" "$ENV_FILE"
                echo "updated ${key}"
              else
                echo "${key}=${val}" >> "$ENV_FILE"
                echo "added ${key}"
              fi
            }

            upsert OPENAI_API_KEY "$OAI_KEY"
            upsert LLM_DEFAULT_PROVIDER openai
            upsert LLM_DEFAULT_MODEL "$OAI_MODEL"

            echo ""
            echo "===== Verification ====="
            grep -E '^(OPENAI_API_KEY|LLM_DEFAULT_PROVIDER|LLM_DEFAULT_MODEL)=' "$ENV_FILE" \
              | sed -E 's/(OPENAI_API_KEY=).{8,}/\1***REDACTED***/'

            echo ""
            echo "===== Live probe: OpenAI /v1/chat/completions ====="
            set -a; source "$ENV_FILE"; set +a
            curl -sS -w "\nHTTP %{http_code}\n" \
              -H "authorization: Bearer $OPENAI_API_KEY" \
              -H "content-type: application/json" \
              -d "{\"model\":\"$OAI_MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}],\"max_tokens\":5}" \
              https://api.openai.com/v1/chat/completions | head -30

            echo ""
            echo "===== Restart PM2 ====="
            pm2 restart marketing-os --update-env 2>&1 | tail -10 || true
            sleep 2
            pm2 status | head -10
            echo "Done."
