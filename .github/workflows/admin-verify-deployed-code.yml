name: Admin — Verify deployed code matches main

# Quick check: what commit hash is checked out on prod, and does
# server/index.ts contain the B-03 multi-path .env fix.

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            APP=/opt/onbrand/app
            cd "$APP"
            echo "════ Current commit on VM ════"
            git log -1 --pretty=format:'%h %ad %s' --date=short

            echo ""
            echo ""
            echo "════ Top 35 lines of server/index.ts ════"
            head -35 "$APP/skills/ai-talent/server/index.ts"

            echo ""
            echo "════ db.ts uses LOCAL_DB_PASSWORD throw? ════"
            grep -A 6 "LOCAL_DB_PASSWORD env var is required" "$APP/skills/ai-talent/server/db.ts" 2>&1 | head -10
            echo "(empty above = old code still deployed)"

            echo ""
            echo "════ Process freshness ════"
            pm2 jlist 2>/dev/null | python3 -c "
            import sys, json, time
            data = json.loads(sys.stdin.read())
            for p in data:
                if p['name'] == 'onbrand':
                    age_s = (time.time() * 1000 - p['pm2_env']['pm_uptime']) / 1000
                    print(f'  pid={p[\"pid\"]}')
                    print(f'  status={p[\"pm2_env\"][\"status\"]}')
                    print(f'  age_seconds={age_s:.1f}')
                    print(f'  restarts={p[\"pm2_env\"][\"restart_time\"]}')
            " 2>/dev/null
