name: Admin — Deploy chat consolidation (one flow)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm == 'DEPLOY' }}
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 300s
          script: |
            set -e
            OLD=/home/azureuser/marketing-os
            BE=/opt/marketing-os/marketing-os-backend
            FE=/opt/marketing-os/marketing-os-frontend

            cd "$OLD"
            git fetch origin main && git reset --hard origin/main

            echo "===== Backend: missionSquadRoute + remove positioningRouter ====="
            cp -v "$OLD/skills/ai-talent/server/routes/missionSquadRoute.ts" \
                  "$BE/ai-talent-server/routes/missionSquadRoute.ts"
            cp -v "$OLD/skills/ai-talent/server/routers/index.ts" \
                  "$BE/ai-talent-server/routers/index.ts"
            cd "$BE"
            git add ai-talent-server/routes/missionSquadRoute.ts \
                    ai-talent-server/routers/index.ts
            cat > /tmp/be_msg.txt <<'MSGEOF'
fix: consolidate to one mission chat flow (server)

- missionSquadRoute: remove POSITIONING_SQUAD hardcoded block;
  always read squad members from squads table via mission.squadSlug
- missionSquadRoute: verifyToken now accepts session cookie
- routers/index.ts: remove positioningRouter (dead, no client calls it)
MSGEOF
            git -c user.name="CJ Migration Bot" -c user.email="cjwang@sowork.tw" \
              commit -F /tmp/be_msg.txt || echo "(no changes)"
            git push origin main || echo "(nothing to push)"

            echo ""
            echo "===== Frontend: MissionChatCore + AppShell consolidation ====="
            cp -v "$OLD/skills/ai-talent/client/src/components/MissionChatCore.tsx" \
                  "$FE/ai-talent-client/src/components/MissionChatCore.tsx"
            cp -v "$OLD/skills/ai-talent/client/src/components/AppShell.tsx" \
                  "$FE/ai-talent-client/src/components/AppShell.tsx"
            cd "$FE"
            git add ai-talent-client/src/components/MissionChatCore.tsx \
                    ai-talent-client/src/components/AppShell.tsx
            cat > /tmp/fe_msg.txt <<'MSGEOF'
fix: consolidate to one mission chat flow (client)

- MissionChatCore: when mission+squad is active, always stay in
  squad chat on error — never fall through to executeTask
- MissionChatCore: remove "切換一般模式" from error message
- AppShell: delete PositioningProgress (dead, never rendered)
- AppShell: delete WorkflowNode + Icon{ArrowDown,CheckDone,Spinner,Circle}
  (all only used by the removed PositioningProgress)
MSGEOF
            git -c user.name="CJ Migration Bot" -c user.email="cjwang@sowork.tw" \
              commit -F /tmp/fe_msg.txt || echo "(no changes)"
            git push origin main || echo "(nothing to push)"

            echo ""
            echo "===== Deploy backend ====="
            cd "$BE" && bash ./deploy-dev.sh 2>&1 | tail -6

            echo ""
            echo "===== Deploy frontend ====="
            cd "$FE" && bash ./deploy-dev.sh 2>&1 | tail -6

            echo ""
            echo "===== Final check ====="
            pm2 list | head -5
            curl -s -o /dev/null -w "Backend /health: HTTP %{http_code}\n" http://127.0.0.1:3101/health
            stat -c 'Frontend build: %y' /opt/marketing-os/marketing-os-backend/public/index.html
