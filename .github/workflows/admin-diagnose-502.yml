name: Admin — Diagnose recent 502 (crash / OOM / timeout?)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            LOG_OUT=/home/$(whoami)/.pm2/logs/marketing-os-out.log
            LOG_ERR=/home/$(whoami)/.pm2/logs/marketing-os-error.log

            echo "── pm2 list (restarts? uptime?) ─────"
            pm2 list 2>&1 | tail -10

            echo
            echo "── pm2 marketing-os describe ─────"
            pm2 describe marketing-os 2>&1 | grep -E "restarts|uptime|memory|status|exec mode|created at" | head -15

            echo
            echo "── error log last 100 lines ─────"
            tail -100 "$LOG_ERR" 2>/dev/null

            echo
            echo "── nginx upstream errors (last 30 min) ─────"
            sudo tail -200 /var/log/nginx/error.log 2>/dev/null | grep -iE "upstream|timeout|502|504|connect" | tail -30 || echo "(no nginx errors)"

            echo
            echo "── out log lines mentioning yt-100 / 100s / generate60 ─────"
            tail -2000 "$LOG_OUT" 2>/dev/null | grep -iE "yt-100|yt-60|runOrchestra100|orchestraRun|generate60|theatre.*pack" | tail -30

            echo
            echo "── memory (any OOM?) ─────"
            free -h
            dmesg 2>&1 | grep -i "oom\|killed" | tail -5 || echo "(no OOM)"
