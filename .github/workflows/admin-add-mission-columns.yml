name: Admin — Add tagline + subTagline + savedSquadFlow to missions

# Adds 3 new columns to the missions table in the main DB.
# Safe to run multiple times (uses IF NOT EXISTS guard).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type MIGRATE to add columns'
        required: true
        type: string

jobs:
  migrate:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'MIGRATE'
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -e
            MOS_USER="mos_user"
            MOS_PASS="mos_secure_2026"
            MOS_DB="mos_db"

            add_col() {
              local COL=$1 TYPE=$2 COMMENT=$3
              EXISTS=$(mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -sN -e "
                SELECT COUNT(*) FROM information_schema.COLUMNS
                WHERE TABLE_SCHEMA='$MOS_DB' AND TABLE_NAME='missions' AND COLUMN_NAME='$COL';
              " 2>/dev/null)
              if [ "$EXISTS" = "0" ]; then
                echo "  Adding $COL..."
                mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
                  ALTER TABLE missions ADD COLUMN \`$COL\` $TYPE DEFAULT NULL COMMENT '$COMMENT';
                " 2>&1
              else
                echo "  $COL already exists — skipped"
              fi
            }

            echo "=== 1. tagline ==="
            add_col "tagline" "VARCHAR(255)" "品牌定位標語"

            echo "=== 2. subTagline ==="
            add_col "subTagline" "VARCHAR(255)" "品牌定位副標語"

            echo "=== 3. savedSquadFlow ==="
            add_col "savedSquadFlow" "LONGTEXT" "用戶自訂 squad steps JSON"

            echo ""
            echo "=== Verify ==="
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
              SELECT COLUMN_NAME, COLUMN_TYPE
              FROM information_schema.COLUMNS
              WHERE TABLE_SCHEMA='$MOS_DB'
                AND TABLE_NAME='missions'
                AND COLUMN_NAME IN ('tagline','subTagline','savedSquadFlow');
            " 2>&1

            echo ""
            echo "✅ Mission columns migration complete"
