name: Admin — Reset agent avatarUrl (clear old line-art PNGs)

# Clears agents.avatarUrl for all agents so the frontend falls back to
# the DiceBear notionists avatar style (specialty-keyed background colours).
# The old gpt-image-2 generated avatars (black ink line art) do not match
# the product-wide avatar standard set by CJ on 2026-05-02.
#
# After running this, the frontend AgentAvatar component will render
# DiceBear notionists SVGs for all agents automatically.
#
# To regenerate AI avatars in the new style later, update the prompt in
# scripts/generateAgentAvatars.ts and re-run admin-generate-agent-avatars.yml.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Type "true" to preview SQL only (no writes)'
        required: false
        default: 'false'

jobs:
  reset:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 5
    steps:
      - name: Pull latest main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd /opt/marketing-os/app
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/contentincubator2-ops/Marketing-OS.git"
          git fetch origin main && git reset --hard origin/main

      - name: Count agents with avatarUrl
        run: |
          set -e
          AI=/opt/marketing-os/app/skills/ai-talent
          source "$AI/.env" 2>/dev/null || true
          mysql -h "${DB_HOST:-127.0.0.1}" -u "${DB_USER:-root}" -p"${DB_PASSWORD}" "${DB_NAME:-sowork}" \
            -e "SELECT COUNT(*) as agents_with_avatar FROM agents WHERE avatarUrl IS NOT NULL AND avatarUrl != '';" \
            2>/dev/null || \
          node -e "
            const mysql = require('mysql2/promise');
            (async () => {
              const pool = await mysql.createPool({
                host: process.env.DB_HOST || '127.0.0.1',
                user: process.env.DB_USER || 'root',
                password: process.env.DB_PASSWORD,
                database: process.env.DB_NAME || 'sowork',
              });
              const [rows] = await pool.execute(\"SELECT COUNT(*) as cnt FROM agents WHERE avatarUrl IS NOT NULL AND avatarUrl != ''\");
              console.log('Agents with avatarUrl:', rows[0].cnt);
              await pool.end();
            })().catch(e => { console.error(e); process.exit(1); });
          " -r /opt/marketing-os/app/skills/ai-talent/node_modules/mysql2 2>/dev/null || \
          npx --yes tsx -e "
            import pool from '/opt/marketing-os/app/skills/ai-talent/server/localDb.js';
            const [rows] = await pool.execute(\"SELECT COUNT(*) as cnt FROM agents WHERE avatarUrl IS NOT NULL AND avatarUrl != ''\");
            console.log('Agents with avatarUrl:', (rows as any[])[0].cnt);
            process.exit(0);
          " || echo "Count query done"

      - name: Reset avatarUrl (set to NULL)
        env:
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          set -e
          AI=/opt/marketing-os/app/skills/ai-talent
          cd "$AI"
          if [ "$DRY" = "true" ]; then
            echo "[dry-run] Would run: UPDATE agents SET avatarUrl = NULL WHERE avatarUrl IS NOT NULL"
            exit 0
          fi
          # Write temp script to avoid inline top-level-await issues
          cat > /tmp/reset-avatars.mts << 'SCRIPT'
          import pool from "/opt/marketing-os/app/skills/ai-talent/server/localDb.js";
          const [result] = await (pool as any).execute(
            "UPDATE agents SET avatarUrl = NULL WHERE avatarUrl IS NOT NULL AND avatarUrl != ''"
          );
          console.log("✓ Cleared avatarUrl for", (result as any).affectedRows, "agents");
          await (pool as any).end?.();
          process.exit(0);
          SCRIPT
          npx tsx /tmp/reset-avatars.mts
          echo "✓ avatarUrl reset complete — frontend will now show DiceBear notionists style"
