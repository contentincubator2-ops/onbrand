name: Ops — Probe image gen health (recent runs)

# 2026-05-14 (CJ「圖片還是跑很久」). Read-only diagnostic:
#  - Scans last 20 mission_outputs for image.status in variant metadata
#  - Counts ready / failed / timeout / skipped
#  - Shows the 5 slowest tasks by orchestra totalLatencyMs
#  - Hits PiAPI Flux directly with a tiny prompt to measure baseline latency
#
# Run when users complain about slow / failed images.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 3
    steps:
      - name: 1. Read recent variant image statuses
        run: |
          set -e
          export MYSQL_PWD="mos_secure_2026"
          MYSQL="mysql -h localhost -u mos_user mos_db --default-character-set=utf8mb4 -B"

          echo "═══════════════════════════════════════════════════════"
          echo "  Last 20 task runs — image status distribution"
          echo "═══════════════════════════════════════════════════════"

          $MYSQL -e "
            SELECT
              mo.id,
              mo.createdAt,
              m.title AS task,
              JSON_EXTRACT(mo.metadata, '\$.latencyMs') AS latency_ms,
              JSON_LENGTH(mo.content) AS variant_count,
              CAST(JSON_UNQUOTE(JSON_EXTRACT(mo.content, '\$[0].image.status')) AS CHAR) AS v0_status,
              CAST(JSON_UNQUOTE(JSON_EXTRACT(mo.content, '\$[1].image.status')) AS CHAR) AS v1_status,
              CAST(JSON_UNQUOTE(JSON_EXTRACT(mo.content, '\$[2].image.status')) AS CHAR) AS v2_status,
              CAST(JSON_UNQUOTE(JSON_EXTRACT(mo.content, '\$[0].image.errorMsg')) AS CHAR) AS v0_err
            FROM mission_outputs mo
            JOIN missions m ON m.id = mo.missionId
            WHERE mo.createdAt >= NOW() - INTERVAL 2 DAY
            ORDER BY mo.id DESC
            LIMIT 20
          " 2>&1 | head -25 || true

          echo ""
          echo "═══════════════════════════════════════════════════════"
          echo "  Image status counts (last 24h)"
          echo "═══════════════════════════════════════════════════════"

          for STATUS in ready failed timeout skipped; do
            COUNT=$($MYSQL -N -e "
              SELECT COUNT(*)
              FROM mission_outputs mo,
                   JSON_TABLE(mo.content, '\$[*]' COLUMNS (
                     img_status VARCHAR(20) PATH '\$.image.status'
                   )) j
              WHERE mo.createdAt >= NOW() - INTERVAL 24 HOUR
                AND j.img_status = '$STATUS'
            " 2>/dev/null || echo 0)
            printf "  %-10s %s\n" "$STATUS" "$COUNT"
          done

      - name: 2. Direct PiAPI Flux latency probe
        run: |
          set -e
          ENV_FILE=/opt/onbrand/app/skills/ai-talent/.env
          set -a; source "$ENV_FILE" 2>/dev/null; set +a

          if [ -z "$PIAPI_API_KEY" ]; then
            echo "⚠ PIAPI_API_KEY not in env — can't run direct probe"
            exit 0
          fi

          echo ""
          echo "═══════════════════════════════════════════════════════"
          echo "  Direct PiAPI Flux Schnell probe (baseline latency)"
          echo "═══════════════════════════════════════════════════════"

          START=$(date +%s)
          RESP=$(curl -s -X POST https://api.piapi.ai/api/v1/task \
            -H "x-api-key: $PIAPI_API_KEY" \
            -H "Content-Type: application/json" \
            --data '{"model":"Qubico/flux1-schnell","task_type":"txt2img","input":{"prompt":"a simple red circle on white background","width":512,"height":512}}' \
            --max-time 30)
          END=$(date +%s)
          ELAPSED=$((END - START))

          echo "  Submission RTT: ${ELAPSED}s"
          TASK_ID=$(echo "$RESP" | jq -r '.data.task_id // empty')
          if [ -z "$TASK_ID" ]; then
            echo "  ❌ no task_id returned — response:"
            echo "$RESP" | head -c 500
            exit 0
          fi
          echo "  task_id: $TASK_ID"

          # Poll for completion
          for i in $(seq 1 12); do
            sleep 2
            POLL=$(curl -s -H "x-api-key: $PIAPI_API_KEY" "https://api.piapi.ai/api/v1/task/$TASK_ID" --max-time 10)
            STATUS=$(echo "$POLL" | jq -r '.data.status // "unknown"')
            ELAPSED=$(($(date +%s) - START))
            echo "  [${ELAPSED}s] status=$STATUS"
            if [ "$STATUS" = "completed" ] || [ "$STATUS" = "Completed" ]; then
              URL=$(echo "$POLL" | jq -r '.data.output.image_url // .data.output.image_urls[0] // empty')
              echo "  ✓ done in ${ELAPSED}s · url=${URL:0:80}..."
              exit 0
            fi
            if [ "$STATUS" = "failed" ] || [ "$STATUS" = "Failed" ]; then
              echo "  ✗ failed: $(echo "$POLL" | jq -r '.data.error.message // .data.error // "unknown"' | head -c 200)"
              exit 0
            fi
          done
          echo "  ⏱ still pending after 24s — PiAPI is slow today"
