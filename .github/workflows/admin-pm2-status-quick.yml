name: Admin — PM2 status + restart if needed

on:
  workflow_dispatch:
    inputs:
      force_restart:
        description: "restart pm2 onbrand"
        required: false
        default: "no"

jobs:
  fix:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 3
    steps:
      - run: |
          set -e
          echo "── pm2 list ──"
          pm2 list

          echo ""
          echo "── pm2 describe onbrand ──"
          pm2 describe onbrand 2>/dev/null | grep -E "status|uptime|restarts|pid|exec cwd" | head -10

          echo ""
          echo "── last 40 ERROR log ──"
          tail -40 ~/.pm2/logs/onbrand-error.log 2>/dev/null

          echo ""
          echo "── last 20 OUT log ──"
          tail -20 ~/.pm2/logs/onbrand-out.log 2>/dev/null

          echo ""
          echo "── direct curl localhost:3101 ──"
          curl -s -o /dev/null -w "  http=%{http_code} size=%{size_download} time=%{time_total}s\n" "http://localhost:3101/" || echo "  CONNECTION FAILED"

          if [ "${{ github.event.inputs.force_restart }}" = "yes" ]; then
            echo ""
            echo "── forcing pm2 restart ──"
            pm2 restart onbrand --update-env
            sleep 5
            pm2 list | grep onbrand
          fi
