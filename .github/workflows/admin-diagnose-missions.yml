name: Admin — Diagnose Missions (read-only)

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: "userId to inspect (default 199)"
        required: false
        default: "199"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 3m
          script: |
            set -e
            cd /home/azureuser/marketing-os

            eval "$(pm2 jlist 2>/dev/null | node -e "
              let d=''; process.stdin.on('data',c=>d+=c);
              process.stdin.on('end',()=>{
                try{
                  const procs=JSON.parse(d);
                  const p=procs.find(x=>x.pm2_env&&x.pm2_env.DB_HOST);
                  if(!p) process.exit(0);
                  const e=p.pm2_env;
                  console.log('export DB_HOST=' + JSON.stringify(e.DB_HOST));
                  console.log('export DB_USER=' + JSON.stringify(e.DB_USER));
                  console.log('export DB_PASSWORD=' + JSON.stringify(e.DB_PASSWORD));
                  console.log('export DB_NAME=' + JSON.stringify(e.DB_NAME));
                }catch(e){}
              });
            ")"
            [ -z "$DB_HOST" ] && { set -a; source skills/ai-talent/.env; set +a; }

            UID_IN="${{ github.event.inputs.user_id }}"
            MYSQL="mysql --ssl-mode=REQUIRED -h $DB_HOST -u $DB_USER -p$DB_PASSWORD $DB_NAME -e"

            echo "=== 查 userId=$UID_IN 的資訊 ==="
            $MYSQL "SELECT id, email, name, isActive FROM users WHERE id = $UID_IN;" 2>&1

            echo ""
            echo "=== brand_members 表結構 ==="
            $MYSQL "DESCRIBE brand_members;" 2>&1

            echo ""
            echo "=== userId=$UID_IN 在 brand_members 的身份 ==="
            $MYSQL "
              SELECT bm.brandId, b.name AS brand_name, bm.role
              FROM brand_members bm
              LEFT JOIN brands b ON b.id = bm.brandId
              WHERE bm.userId = $UID_IN;
            " 2>&1

            echo ""
            echo "=== userId=$UID_IN 的 missions（依 brandId 分群） ==="
            $MYSQL "
              SELECT COALESCE(brandId, 'NULL') AS brandId, workspace, COUNT(*) AS n,
                     MIN(id) AS first_id, MAX(id) AS last_id, MAX(updatedAt) AS last_update
              FROM missions
              WHERE userId = $UID_IN
              GROUP BY brandId, workspace
              ORDER BY last_update DESC;
            " 2>&1

            echo ""
            echo "=== userId=$UID_IN brandId=NULL 的 mission 列表 ==="
            $MYSQL "
              SELECT id, LEFT(title,40) AS title, workspace, LEFT(squadSlug,30) AS squad, updatedAt
              FROM missions
              WHERE userId = $UID_IN AND brandId IS NULL
              ORDER BY updatedAt DESC;
            " 2>&1

            echo ""
            echo "=== 診斷完成 ==="
