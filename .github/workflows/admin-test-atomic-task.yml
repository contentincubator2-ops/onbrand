name: Admin — test atomic task end-to-end

on:
  workflow_dispatch:
    inputs:
      task_slug:
        required: false
        default: "fb-single-post-text"
      brand_name:
        required: false
        default: "Pokémon GO"
      event_name:
        required: false
        default: "單首龍經典社群日"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          TASK_SLUG: ${{ github.event.inputs.task_slug }}
          BRAND_NAME: ${{ github.event.inputs.brand_name }}
          EVENT_NAME: ${{ github.event.inputs.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 180s
          envs: TASK_SLUG,BRAND_NAME,EVENT_NAME,GH_TOKEN
          script: |
            set +e
            APP=/opt/marketing-os/app
            AI=$APP/skills/ai-talent
            cd "$APP"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/contentincubator2-ops/Marketing-OS.git"
            git fetch origin main 2>&1 | tail -3
            git reset --hard origin/main 2>&1 | tail -3
            cd "$AI"
            set -a; [ -f "$AI/.env" ] && . "$AI/.env"; set +a
            timeout 90 env TASK_SLUG="$TASK_SLUG" BRAND_NAME="$BRAND_NAME" EVENT_NAME="$EVENT_NAME" \
              npx tsx scripts/test-atomic-task.ts 2>&1
