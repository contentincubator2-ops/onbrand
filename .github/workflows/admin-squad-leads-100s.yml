name: Admin — Reassign 18 100s squad leads (distinct)
on:
  workflow_dispatch:

jobs:
  reassign:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            export MYSQL_PWD="mos_secure_2026"
            cat > /tmp/reassign.sql <<'SQL'
            -- 18 distinct domain-matched leads for /100s squad cards.
            -- Targets only the 18 squads we surface in quickTask100Squads.ts.

            -- FB 11 squads → 11 distinct leads
            UPDATE squads SET lead_agent_id = 180159 WHERE slug = 'fb-monthly-calendar-pulizzi';
            UPDATE squads SET lead_agent_id = 60068  WHERE slug = 'fb-monthly-calendar-product-promo';
            UPDATE squads SET lead_agent_id = 31     WHERE slug = 'fb-garyvee-jab-hook';
            UPDATE squads SET lead_agent_id = 60007  WHERE slug = 'fb-countdown-series';
            UPDATE squads SET lead_agent_id = 180030 WHERE slug = 'fb-account-reposition';
            UPDATE squads SET lead_agent_id = 180186 WHERE slug = 'fb-quarterly-strategy';
            UPDATE squads SET lead_agent_id = 60030  WHERE slug = 'fb-monthly-analytics';
            UPDATE squads SET lead_agent_id = 224294 WHERE slug = 'fb-deiss-cvo';
            UPDATE squads SET lead_agent_id = 60029  WHERE slug = 'fb-hormozi-offer-first';
            UPDATE squads SET lead_agent_id = 40     WHERE slug = 'fb-kennedy-magnetic';
            UPDATE squads SET lead_agent_id = 239185 WHERE slug = 'fb-kern-mass-control';

            -- IG 7 squads → 7 distinct leads (no overlap with FB list)
            UPDATE squads SET lead_agent_id = 180166 WHERE slug = 'ig-monthly-calendar-pulizzi';
            UPDATE squads SET lead_agent_id = 30005  WHERE slug = 'ig-baer-youtility';
            UPDATE squads SET lead_agent_id = 220751 WHERE slug = 'ig-chrisdo-visual-story';
            UPDATE squads SET lead_agent_id = 180168 WHERE slug = 'ig-fanzo-live-first';
            UPDATE squads SET lead_agent_id = 60072  WHERE slug = 'ig-garyvee-document';
            UPDATE squads SET lead_agent_id = 180170 WHERE slug = 'ig-hollis-radical-transparency';
            UPDATE squads SET lead_agent_id = 60056  WHERE slug = 'ig-hormozi-save-worthy';

            SELECT '=== Verify 18 squads — should be 18 distinct leads ===' AS step;
            SELECT s.slug, a.id, a.name, a.title
              FROM squads s
              LEFT JOIN agents a ON a.id = s.lead_agent_id
             WHERE s.slug IN (
               'fb-monthly-calendar-pulizzi','fb-monthly-calendar-product-promo',
               'fb-garyvee-jab-hook','fb-countdown-series','fb-account-reposition',
               'fb-quarterly-strategy','fb-monthly-analytics','fb-deiss-cvo',
               'fb-hormozi-offer-first','fb-kennedy-magnetic','fb-kern-mass-control',
               'ig-monthly-calendar-pulizzi','ig-baer-youtility','ig-chrisdo-visual-story',
               'ig-fanzo-live-first','ig-garyvee-document','ig-hollis-radical-transparency',
               'ig-hormozi-save-worthy'
             )
             ORDER BY s.slug;

            SELECT '=== Diversity ===' AS step;
            SELECT COUNT(DISTINCT lead_agent_id) AS distinct_leads, COUNT(*) AS total
              FROM squads
             WHERE slug IN (
               'fb-monthly-calendar-pulizzi','fb-monthly-calendar-product-promo',
               'fb-garyvee-jab-hook','fb-countdown-series','fb-account-reposition',
               'fb-quarterly-strategy','fb-monthly-analytics','fb-deiss-cvo',
               'fb-hormozi-offer-first','fb-kennedy-magnetic','fb-kern-mass-control',
               'ig-monthly-calendar-pulizzi','ig-baer-youtility','ig-chrisdo-visual-story',
               'ig-fanzo-live-first','ig-garyvee-document','ig-hollis-radical-transparency',
               'ig-hormozi-save-worthy'
             );
            SQL
            mysql -h localhost -u mos_user mos_db < /tmp/reassign.sql 2>&1
