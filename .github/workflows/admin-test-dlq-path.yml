name: Admin — Test DLQ path (simulate failing task save)
# Forces a recordTaskRun failure to verify:
#   1. 3-tier fallback actually triggers
#   2. DLQ file gets written to ~/.pm2/logs/task-runs-failed.jsonl
#   3. admin-replay-failed-task-runs workflow can recover the entry
#
# Test strategy: call recordTaskRun with content that exceeds MEDIUMTEXT
# row-packet limit (~4MB default max_allowed_packet) — this is the most
# likely real-world failure mode now that utf8mb4 isn't the suspect.
on: { workflow_dispatch: {} }
jobs:
  simulate:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 5
    steps:
      - name: Show pre-state of DLQ
        run: |
          set +e
          DLQ=/home/azureuser/.pm2/logs/task-runs-failed.jsonl
          echo "── DLQ file before ──"
          if [ -f "$DLQ" ]; then
            wc -l "$DLQ"
            tail -3 "$DLQ"
          else
            echo "  (file does not exist yet — expected for fresh deploy)"
          fi
          echo ""
          echo "── max_allowed_packet (DB) ──"
          AI=/opt/onbrand/app/skills/ai-talent
          set -a; source "$AI/.env" 2>/dev/null; set +a
          export MYSQL_PWD="${LOCAL_DB_PASSWORD}"
          mysql -h ${LOCAL_DB_HOST:-localhost} -u ${LOCAL_DB_USER:-mos_user} ${LOCAL_DB_NAME:-mos_db} -e "SHOW VARIABLES LIKE 'max_allowed_packet'"

      - name: Pick a real test user (last admin/CJ login)
        id: pickuser
        run: |
          set -e
          AI=/opt/onbrand/app/skills/ai-talent
          set -a; source "$AI/.env" 2>/dev/null; set +a
          export MYSQL_PWD="${LOCAL_DB_PASSWORD}"
          TEST_UID=$(mysql -h ${LOCAL_DB_HOST:-localhost} -u ${LOCAL_DB_USER:-mos_user} ${LOCAL_DB_NAME:-mos_db} -B -N -e "SELECT id FROM users ORDER BY id ASC LIMIT 1")
          echo "test userId: $UID"
          echo "userId=$UID" >> $GITHUB_OUTPUT

      - name: Call recordTaskRun with three escalating failure cases
        run: |
          set -e
          cd /opt/onbrand/app/skills/ai-talent
          USER_ID=${{ steps.pickuser.outputs.userId }}

          cat > /tmp/dlq-test.mjs <<EOF
          // Force 3 failure modes and check each handles correctly
          const { recordTaskRun } = await import('/opt/onbrand/app/skills/ai-talent/server/_core/recordTaskRun.ts');

          // CASE 1: oversized content (5MB string) — should trigger size cap
          //         in pre-flight + still land in DB. Expect outputId != null.
          const huge = 'A'.repeat(5_000_000);
          console.log('CASE 1: oversized content (5MB)');
          const r1 = await recordTaskRun({
            userId: ${USER_ID},
            brandId: null,
            workspace: 'facebook',
            taskId: '__dlq_test_oversized__',
            taskLabel: 'DLQ test: oversized',
            tier: '30s',
            content: huge,
            metadata: { _test: 'oversized' },
          });
          console.log('  result:', JSON.stringify(r1));

          // CASE 2: invalid platform enum — should fall to 'other' whitelist
          console.log('CASE 2: invalid platform');
          const r2 = await recordTaskRun({
            userId: ${USER_ID},
            brandId: null,
            workspace: 'facebook',
            taskId: '__dlq_test_bad_enum__',
            taskLabel: 'DLQ test: bad enum',
            tier: '30s',
            content: 'normal sized content',
            platform: 'not_a_real_platform',
            metadata: { _test: 'bad_enum' },
          });
          console.log('  result:', JSON.stringify(r2));

          // CASE 3: emoji/4-byte chars — should land in tier=normal (utf8mb4)
          console.log('CASE 3: emoji content');
          const r3 = await recordTaskRun({
            userId: ${USER_ID},
            brandId: null,
            workspace: 'facebook',
            taskId: '__dlq_test_emoji__',
            taskLabel: 'DLQ test: emoji 😀🎉',
            tier: '30s',
            content: 'hello 🌍 world 🚀 with emoji and 𠮷 supplementary plane char',
            metadata: { _test: 'emoji' },
          });
          console.log('  result:', JSON.stringify(r3));

          process.exit(0);
          EOF

          node --import tsx /tmp/dlq-test.mjs 2>&1 | tee /tmp/dlq-test.log

      - name: Show post-state of DLQ + matching DB rows
        run: |
          set +e
          AI=/opt/onbrand/app/skills/ai-talent
          set -a; source "$AI/.env" 2>/dev/null; set +a
          export MYSQL_PWD="${LOCAL_DB_PASSWORD}"
          MYSQL="mysql -h ${LOCAL_DB_HOST:-localhost} -u ${LOCAL_DB_USER:-mos_user} ${LOCAL_DB_NAME:-mos_db}"

          DLQ=/home/azureuser/.pm2/logs/task-runs-failed.jsonl
          echo "── DLQ file after ──"
          if [ -f "$DLQ" ]; then
            wc -l "$DLQ"
            echo "── last 3 entries ──"
            tail -3 "$DLQ"
          else
            echo "  (file still missing — all 3 cases succeeded in DB, which is GOOD)"
          fi

          echo ""
          echo "── matching mission rows ──"
          $MYSQL -t -e "
            SELECT id, title, description, workspace, status, createdAt
              FROM missions
             WHERE description LIKE '%__dlq_test_%'
             ORDER BY id DESC LIMIT 10"

          echo ""
          echo "── matching mission_outputs ──"
          $MYSQL -t -e "
            SELECT mo.id, mo.missionId, mo.platform, mo.outputType,
                   LEFT(mo.title, 50) AS title_head,
                   CHAR_LENGTH(mo.content) AS content_len,
                   mo.status, mo.createdAt
              FROM mission_outputs mo
              JOIN missions m ON m.id = mo.missionId
             WHERE m.description LIKE '%__dlq_test_%'
             ORDER BY mo.id DESC LIMIT 10"

          echo ""
          echo "── pm2 onbrand errors from recordTaskRun (last 5 min) ──"
          tail -500 /home/azureuser/.pm2/logs/onbrand-error.log 2>/dev/null | grep -E "recordTaskRun|tier=" | tail -20 || echo "  (no recordTaskRun warnings)"

      - name: Cleanup test rows
        run: |
          set +e
          AI=/opt/onbrand/app/skills/ai-talent
          set -a; source "$AI/.env" 2>/dev/null; set +a
          export MYSQL_PWD="${LOCAL_DB_PASSWORD}"
          MYSQL="mysql -h ${LOCAL_DB_HOST:-localhost} -u ${LOCAL_DB_USER:-mos_user} ${LOCAL_DB_NAME:-mos_db}"
          # Delete outputs first, then missions
          $MYSQL -e "DELETE mo FROM mission_outputs mo JOIN missions m ON m.id=mo.missionId WHERE m.description LIKE '%__dlq_test_%'"
          $MYSQL -e "DELETE FROM missions WHERE description LIKE '%__dlq_test_%'"
          echo "cleanup done"
