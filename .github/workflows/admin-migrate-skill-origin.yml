name: Admin — Migrate skill origin_model + tested_models

# Phase 2.5 — clarify the AI model relationship per CJ:
#
# - origin_model      VARCHAR(32)  "claude" | "openai" | "gemini" | "deepseek"
#                                  | "qwen" | "cohere" | "cross" | …
#                                  Where the skill was DESIGNED FOR. Not a
#                                  runtime restriction.
#
# - tested_models     JSON         Optional list of models the community has
#                                  verified actually run this skill well.
#                                  Purely informational — does not gate runs.
#
# `compatible_models` stays for backward compatibility but is treated as
# deprecated alias of tested_models.
#
# Idempotent.

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Apply on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          script: |
            set -e
            ENV_FILE=/opt/marketing-os/app/skills/ai-talent/.env
            set -a; source "$ENV_FILE"; set +a
            DB_HOST="${DB_HOST:-127.0.0.1}"; DB_USER="${DB_USER:-root}"; DB_NAME="${DB_NAME:-mos_db}"

            run_sql() { MYSQL_PWD="$DB_PASSWORD" mysql -h"$DB_HOST" -u"$DB_USER" "$DB_NAME" -e "$1"; }
            has_col() {
              MYSQL_PWD="$DB_PASSWORD" mysql -h"$DB_HOST" -u"$DB_USER" -N -B -e \
                "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='$DB_NAME' AND table_name='$1' AND column_name='$2'" "$DB_NAME"
            }

            if [ "$(has_col skills origin_model)" = "0" ]; then
              run_sql "ALTER TABLE skills ADD COLUMN origin_model VARCHAR(32) NOT NULL DEFAULT 'cross', ADD INDEX idx_skills_origin (origin_model);"
              echo "  + added origin_model"
            else
              echo "  = origin_model present"
            fi

            if [ "$(has_col skills tested_models)" = "0" ]; then
              run_sql "ALTER TABLE skills ADD COLUMN tested_models JSON NULL;"
              echo "  + added tested_models"
            else
              echo "  = tested_models present"
            fi

            run_sql "DESCRIBE skills" | grep -E "origin_model|tested_models|compatible_models"
