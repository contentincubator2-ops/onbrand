name: Admin — Seed L1 Brand Squads

# Seeds 9 L1 brand-strategy squads (#2–#10 per master spec) to the VM DB.
# Squad #1 (brand-archetype-positioning, id=11) is the golden reference and
# is NOT touched.
#
# Each squad gets:
#   - 1 newly-created lead agent (primarySkill matches methodology)
#   - 5 existing agents resolved by primarySkill + fallback chain
#   - 6 workflow steps, each with assignedAgentId (enables per-phase routing)
#
# After apply, runs audit-methodology to verify lead-skill alignment.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run (preview) or apply (write to DB)'
        required: true
        type: choice
        options:
          - dry-run
          - apply
      slug:
        description: 'Only build one squad (optional, e.g. mind-positioning)'
        required: false
        type: string

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          MODE: ${{ inputs.mode }}
          ONLY_SLUG: ${{ inputs.slug }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 600s
          envs: MODE,ONLY_SLUG,GH_TOKEN
          script: |
            set -e
            APP=/opt/marketing-os/app
            AI=$APP/skills/ai-talent

            echo "===== Step 1: Pull latest main ====="
            REPO="https://x-access-token:${GH_TOKEN}@github.com/contentincubator2-ops/Marketing-OS.git"
            cd "$APP"
            git remote set-url origin "$REPO"
            git fetch origin main
            git reset --hard origin/main
            echo "Commit: $(git log --oneline -1)"

            echo ""
            echo "===== Step 2: Ensure dependencies ====="
            cd "$AI"
            npm install --legacy-peer-deps 2>&1 | tail -5

            echo ""
            echo "===== Step 3: Run squad-builder (mode=$MODE) ====="
            CMD_ARGS="L1-brand"
            if [ "$MODE" = "dry-run" ]; then
              CMD_ARGS="$CMD_ARGS --dry-run"
            fi
            if [ -n "$ONLY_SLUG" ]; then
              CMD_ARGS="$CMD_ARGS --slug=$ONLY_SLUG"
            fi
            echo "Running: npx tsx scripts/squad-builder/index.ts $CMD_ARGS"
            npx tsx scripts/squad-builder/index.ts $CMD_ARGS

            if [ "$MODE" = "apply" ]; then
              echo ""
              echo "===== Step 4: Audit methodology alignment ====="
              npx tsx scripts/audit-methodology-squads.ts 2>&1 | tail -60 || true

              echo ""
              echo "===== Step 5: Verify mind-positioning squad has assignedAgentId ====="
              # Spot-check one squad's steps JSON to confirm new format
              mysql -u"$DB_USER" -p"$DB_PASSWORD" -h"$DB_HOST" "$DB_NAME" -e "
                SELECT id, slug, JSON_LENGTH(steps) AS n_steps,
                       JSON_EXTRACT(steps, '$[0].assignedAgentId') AS step1_agent_id,
                       JSON_EXTRACT(steps, '$[0].assignedAgentName') AS step1_agent_name
                FROM squads
                WHERE slug IN ('mind-positioning','category-design-positioning','blue-ocean-positioning')
                ORDER BY id;
              " 2>&1 | head -20 || echo "(mysql spot-check skipped — env vars not available here)"
            fi

            echo ""
            echo "===== Done ====="
