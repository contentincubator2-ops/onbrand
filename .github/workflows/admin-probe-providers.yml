name: Admin — Probe LLM providers on VM

# Sends a tiny "say hi in 5 words" completion to each configured LLM provider
# using the .env file on the VM. Reports:
#   provider | key_exists | http_status | works(yes/no)
#
# Does NOT log actual key values — only presence check + HTTP status.
# Safe to run at any time; read-only w.r.t. the .env file.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 120s
          script: |
            set -e
            ENV_FILE=/opt/marketing-os/app/skills/ai-talent/.env

            # ── Load .env (no export to shell, just read values) ──────────────
            get_key() {
              local varname="$1"
              grep -E "^${varname}=" "$ENV_FILE" 2>/dev/null | head -1 | cut -d= -f2- | tr -d '\r\n' || echo ""
            }

            key_exists() {
              local val="$1"
              if [ -n "$val" ]; then echo "YES"; else echo "NO "; fi
            }

            # ── Minimal completion probe ──────────────────────────────────────
            # Returns "HTTP_STATUS ok|fail"
            probe_openai_compat() {
              local label="$1"
              local base_url="$2"
              local model="$3"
              local api_key="$4"
              local auth_header="$5"   # "Authorization" or "api-key"

              if [ -z "$api_key" ]; then
                echo "${label}|NO |N/A   |NO  (no key)"
                return
              fi

              local payload
              payload=$(cat <<JSON
            {"model":"${model}","messages":[{"role":"user","content":"say hi in 5 words"}],"max_tokens":20}
            JSON
            )

              local http_status
              http_status=$(curl -s -o /tmp/probe_out.txt -w "%{http_code}" \
                -X POST "${base_url}/chat/completions" \
                -H "Content-Type: application/json" \
                -H "${auth_header}: ${api_key}" \
                --max-time 15 \
                --data "$payload" 2>/dev/null || echo "000")

              local works="NO "
              if [ "$http_status" = "200" ]; then works="YES"; fi
              printf "%-22s | %-3s | %-6s | %s\n" "$label" "YES" "$http_status" "$works"
            }

            probe_anthropic() {
              local api_key="$1"
              if [ -z "$api_key" ]; then
                echo "anthropic              | NO  | N/A    | NO  (no key)"
                return
              fi

              local payload
              payload=$(cat <<JSON
            {"model":"claude-haiku-3-5","max_tokens":20,"messages":[{"role":"user","content":"say hi in 5 words"}]}
            JSON
            )

              local http_status
              http_status=$(curl -s -o /tmp/probe_out.txt -w "%{http_code}" \
                -X POST "https://api.anthropic.com/v1/messages" \
                -H "Content-Type: application/json" \
                -H "x-api-key: ${api_key}" \
                -H "anthropic-version: 2023-06-01" \
                --max-time 15 \
                --data "$payload" 2>/dev/null || echo "000")

              local works="NO "
              if [ "$http_status" = "200" ]; then works="YES"; fi
              printf "%-22s | %-3s | %-6s | %s\n" "anthropic" "YES" "$http_status" "$works"
            }

            probe_gemini_native() {
              local label="$1"
              local api_key="$2"
              if [ -z "$api_key" ]; then
                printf "%-22s | %-3s | %-6s | %s\n" "$label" "NO " "N/A" "NO  (no key)"
                return
              fi

              local http_status
              http_status=$(curl -s -o /tmp/probe_out.txt -w "%{http_code}" \
                -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${api_key}" \
                -H "Content-Type: application/json" \
                --max-time 15 \
                --data '{"contents":[{"role":"user","parts":[{"text":"say hi in 5 words"}]}],"generationConfig":{"maxOutputTokens":20}}' \
                2>/dev/null || echo "000")

              local works="NO "
              if [ "$http_status" = "200" ]; then works="YES"; fi
              printf "%-22s | %-3s | %-6s | %s\n" "$label" "YES" "$http_status" "$works"
            }

            echo ""
            echo "════════════════════════════════════════════════════════════════════"
            echo "  LLM Provider Probe — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "  .env: $ENV_FILE"
            echo "════════════════════════════════════════════════════════════════════"
            echo ""
            printf "%-22s | %-3s | %-6s | %s\n" "PROVIDER" "KEY" "STATUS" "WORKS"
            printf "%-22s-+-%s-+-%s-+-%s\n" "----------------------" "---" "------" "---"

            # ── Azure Foundry ─────────────────────────────────────────────────
            AZURE_KEY=$(get_key AZURE_FOUNDRY_API_KEY)
            AZURE_ENDPOINT=$(get_key AZURE_FOUNDRY_PROJECT_ENDPOINT)
            AZURE_ENDPOINT="${AZURE_ENDPOINT:-https://sowork-foundry-claw-api-router.services.ai.azure.com/api/projects/proj-mkt-agent-law}"
            AZURE_BASE="${AZURE_ENDPOINT%/}/openai/v1"
            if [ -z "$AZURE_KEY" ]; then
              printf "%-22s | %-3s | %-6s | %s\n" "azure-foundry" "NO " "N/A" "NO  (no key)"
            else
              http_status=$(curl -s -o /tmp/probe_out.txt -w "%{http_code}" \
                -X POST "${AZURE_BASE}/chat/completions" \
                -H "Content-Type: application/json" \
                -H "api-key: ${AZURE_KEY}" \
                --max-time 15 \
                --data '{"model":"gpt-4o","messages":[{"role":"user","content":"say hi in 5 words"}],"max_tokens":20}' \
                2>/dev/null || echo "000")
              works="NO "; [ "$http_status" = "200" ] && works="YES"
              printf "%-22s | %-3s | %-6s | %s\n" "azure-foundry (gpt-4o)" "YES" "$http_status" "$works"

              # Also probe Kimi-K2.5 (default for zh)
              http_status2=$(curl -s -o /tmp/probe_out.txt -w "%{http_code}" \
                -X POST "${AZURE_BASE}/chat/completions" \
                -H "Content-Type: application/json" \
                -H "api-key: ${AZURE_KEY}" \
                --max-time 15 \
                --data '{"model":"Kimi-K2.5","messages":[{"role":"user","content":"say hi in 5 words"}],"max_tokens":20}' \
                2>/dev/null || echo "000")
              works2="NO "; [ "$http_status2" = "200" ] && works2="YES"
              printf "%-22s | %-3s | %-6s | %s\n" "azure-foundry (Kimi-K2.5)" "YES" "$http_status2" "$works2"
            fi

            # ── Azure: sowork-ai-position-resource (claude-sonnet-4-6, gpt-5.4-pro) ──
            AZ_POS_KEY=$(get_key AZURE_POSITION_API_KEY)
            AZ_POS_EP=$(get_key AZURE_POSITION_ENDPOINT)
            AZ_POS_EP="${AZ_POS_EP:-https://sowork-ai-position-resource.cognitiveservices.azure.com}"
            probe_openai_compat "azure-position (claude)" "${AZ_POS_EP%/}/openai/v1" "claude-sonnet-4-6" "$AZ_POS_KEY" "api-key"

            # ── Azure: proj-claude-sweden-resource (claude variants) ───────────
            AZ_CL_KEY=$(get_key AZURE_CLAUDE_SWEDEN_API_KEY)
            AZ_CL_EP=$(get_key AZURE_CLAUDE_SWEDEN_ENDPOINT)
            AZ_CL_EP="${AZ_CL_EP:-https://proj-claude-sweden-resource.cognitiveservices.azure.com}"
            probe_openai_compat "azure-claude (sweden)" "${AZ_CL_EP%/}/openai/v1" "claude-sonnet-4-6" "$AZ_CL_KEY" "api-key"

            # ── Azure: cjwan-mnykipqt-northcentralus (DeepSeek-R1, Mistral) ───
            AZ_NC_KEY=$(get_key AZURE_NORTHCENTRAL_API_KEY)
            AZ_NC_EP=$(get_key AZURE_NORTHCENTRAL_ENDPOINT)
            AZ_NC_EP="${AZ_NC_EP:-https://cjwan-mnykipqt-northcentralus.cognitiveservices.azure.com}"
            probe_openai_compat "azure-northcentral (DS)" "${AZ_NC_EP%/}/openai/v1" "DeepSeek-V3.2" "$AZ_NC_KEY" "api-key"

            # ── Azure: cjwan-mnynpm8k-canadacentral (transcribe) ──────────────
            AZ_CA_KEY=$(get_key AZURE_CANADA_API_KEY)
            AZ_CA_EP=$(get_key AZURE_CANADA_ENDPOINT)
            AZ_CA_EP="${AZ_CA_EP:-https://cjwan-mnynpm8k-canadacentral.cognitiveservices.azure.com}"
            probe_openai_compat "azure-canada (transc)" "${AZ_CA_EP%/}/openai/v1" "gpt-4o-mini-transcribe" "$AZ_CA_KEY" "api-key"

            # ── Anthropic ─────────────────────────────────────────────────────
            ANTHROPIC_KEY=$(get_key ANTHROPIC_API_KEY)
            probe_anthropic "$ANTHROPIC_KEY"

            # ── OpenAI ────────────────────────────────────────────────────────
            OPENAI_KEY=$(get_key OPENAI_API_KEY)
            probe_openai_compat "openai" "https://api.openai.com/v1" "gpt-4o-mini" "$OPENAI_KEY" "Authorization"

            # ── Gemini (AI Studio OpenAI-compat shim) ─────────────────────────
            GEMINI_KEY=$(get_key GEMINI_API_KEY)
            probe_openai_compat "gemini (openai-compat)" "https://generativelanguage.googleapis.com/v1beta/openai" "gemini-2.0-flash" "$GEMINI_KEY" "Authorization"

            # ── Gemini native API (what perplexityScout uses) ─────────────────
            probe_gemini_native "gemini (native API)" "$GEMINI_KEY"

            # ── Qwen ──────────────────────────────────────────────────────────
            QWEN_KEY=$(get_key QWEN_API_KEY)
            probe_openai_compat "qwen" "https://dashscope-intl.aliyuncs.com/compatible-mode/v1" "qwen-plus" "$QWEN_KEY" "Authorization"

            # ── Zhipu ─────────────────────────────────────────────────────────
            ZHIPU_KEY=$(get_key ZHIPU_API_KEY)
            probe_openai_compat "zhipu" "https://open.bigmodel.cn/api/paas/v4" "glm-4-flash" "$ZHIPU_KEY" "Authorization"

            # ── Perplexity ────────────────────────────────────────────────────
            PERPLEXITY_KEY=$(get_key PERPLEXITY_API_KEY)
            probe_openai_compat "perplexity" "https://api.perplexity.ai" "sonar-pro" "$PERPLEXITY_KEY" "Authorization"

            # ── Cohere (force-disabled; 401 in prod) ──────────────────────────
            COHERE_KEY=$(get_key COHERE_API_KEY)
            probe_openai_compat "cohere (disabled)" "https://api.cohere.com/compatibility/v1" "command-r-plus" "$COHERE_KEY" "Authorization"

            # ── Forge/Manus ───────────────────────────────────────────────────
            FORGE_KEY=$(get_key BUILT_IN_FORGE_API_KEY)
            FORGE_URL=$(get_key BUILT_IN_FORGE_API_URL)
            FORGE_BASE="${FORGE_URL:-https://forge.manus.im}/v1"
            FORGE_BASE="${FORGE_BASE%/v1}/v1"  # normalize double /v1
            probe_openai_compat "forge/manus" "$FORGE_BASE" "gemini-2.5-flash" "$FORGE_KEY" "Authorization"

            # ── Tavily (search, not LLM completion) ───────────────────────────
            TAVILY_KEY=$(get_key TAVILY_API_KEY)
            if [ -z "$TAVILY_KEY" ]; then
              printf "%-22s | %-3s | %-6s | %s\n" "tavily (search)" "NO " "N/A" "NO  (no key)"
            else
              tavily_status=$(curl -s -o /tmp/probe_out.txt -w "%{http_code}" \
                -X POST "https://api.tavily.com/search" \
                -H "Content-Type: application/json" \
                --max-time 15 \
                --data "{\"api_key\":\"${TAVILY_KEY}\",\"query\":\"test\",\"max_results\":1}" \
                2>/dev/null || echo "000")
              works_t="NO "; [ "$tavily_status" = "200" ] && works_t="YES"
              printf "%-22s | %-3s | %-6s | %s\n" "tavily (search)" "YES" "$tavily_status" "$works_t"
            fi

            echo ""
            echo "════════════════════════════════════════════════════════════════════"
            echo "  Notes:"
            echo "  - google/cohere are force-disabled in multiModelRouter.ts"
            echo "    (Google 403 service policy block; Cohere 401 bad key in prod)"
            echo "  - azure-foundry is primary for all task types"
            echo "  - gpt-5-nano was removed from Foundry; default is now Kimi-K2.5 (zh) / gpt-4o (en)"
            echo "  - gemini (native API) is used by perplexityScout for web grounding"
            echo "════════════════════════════════════════════════════════════════════"
