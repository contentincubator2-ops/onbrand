name: Admin — Seed brand positioning for Theater

# For every brand whose soworkAnalysis lacks `differentiators`, generate
# a positioning packet via Haiku and persist it. Theater (內容企劃台)
# runStart reads exactly this field — once seeded, the brain bar stops
# falling back to the placeholder USP.
#
# Idempotent: brands already containing differentiators are skipped.

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 30
    steps:
      - name: Run seed script
        run: |
          set -e
          APP=/opt/marketing-os/app
          AI=$APP/skills/ai-talent
          cd "$AI"
          # Pull latest first so the script reflects what's on main
          cd "$APP" && git fetch origin main && git reset --hard origin/main
          cd "$AI"
          npx tsx scripts/seed-brand-positioning-for-theater.ts 2>&1 | tee /tmp/seed-positioning.log
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Tail summary
        if: always()
        run: |
          echo "=== Last 25 lines ==="
          tail -25 /tmp/seed-positioning.log || true
