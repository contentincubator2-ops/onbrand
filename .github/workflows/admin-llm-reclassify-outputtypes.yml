name: Admin — LLM reclassify unknown outputTypes

# Re-classifies the 300 outputType strings that the rule-based classifier
# couldn't categorize. Uses Azure Foundry gpt-4o (priority) with OpenAI
# gpt-4o-mini as fallback. Then generates multimedia upgrade proposals.

on:
  workflow_dispatch:

jobs:
  reclassify:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 600s
          envs: GH_TOKEN
          script: |
            set -e
            APP=/opt/marketing-os/app
            REPO="https://x-access-token:${GH_TOKEN}@github.com/contentincubator2-ops/Marketing-OS.git"
            cd "$APP"
            git remote set-url origin "$REPO"
            git fetch origin main
            git reset --hard origin/main
            cd "$APP/skills/ai-talent"
            if [ ! -d node_modules ]; then npm install --legacy-peer-deps --no-audit --no-fund 2>&1 | tail -5; fi

            # Make sure rule-based taxonomy exists first (it writes data/outputtype-taxonomy.json)
            if [ ! -f data/outputtype-taxonomy.json ]; then
              echo "▼ rule-based taxonomy missing, running first..."
              npm run db:classify-outputtypes
            fi

            echo "════════════════════════════════════════════════════════════════"
            echo "  🤖 LLM reclassify (Azure Foundry gpt-4o priority)"
            echo "════════════════════════════════════════════════════════════════"
            npm run db:llm-reclassify-outputtypes
