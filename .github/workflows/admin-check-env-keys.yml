name: Admin — Check env key names on VM
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 30s
          script: |
            ENV=/opt/marketing-os/app/skills/ai-talent/.env
            echo "=== .env key names (values hidden) ==="
            grep -v '^#' "$ENV" | grep '=' | cut -d= -f1 | sort
            echo "=== total lines ==="
            wc -l < "$ENV"
