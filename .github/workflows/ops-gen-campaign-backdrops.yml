name: "Ops — 活動頁底圖模板產圖（gpt-image-2）"

# 2026-09-30（CJ「左邊和右邊的底圖，我們有固定模板，但用戶也可以自己選擇」）。
# 跟 ops-gen-task-illustrations.yml 同一套做法：在 GitHub runner 上跑
# scripts/gen-campaign-backdrops.ts，用 GitHub secret OPEN_API_KEY（有額度的那把），
# 產出的圖 commit 回觸發的那條分支，再由人開 PR 進 dev——圖要看過才進站。
#
# 觸發：改 ops/campaign-backdrops/request 再 push 到 hotfix/campaign-backdrops*。
# 那個檔用 KEY=VALUE 一行一個（IDS / FORCE，意思見腳本開頭）。空檔＝把還沒有圖的模板畫完。
on:
  push:
    branches: ["hotfix/campaign-backdrops*"]
    paths:
      - "ops/campaign-backdrops/**"

permissions:
  contents: write

concurrency:
  group: gen-campaign-backdrops
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --prefix skills/ai-talent --legacy-peer-deps 2>&1 | tail -3
      - name: Generate
        working-directory: skills/ai-talent
        env:
          OPENAI_API_KEY: ${{ secrets.OPEN_API_KEY }}
          COVERS_DIR: /tmp/covers
          # env.ts 在 import 期驗證，這支腳本不連 DB、不發 JWT，給形狀對的假值即可。
          JWT_SECRET: runner-only-placeholder-not-a-real-secret-000
          DB_HOST: localhost
          DB_USER: none
          DB_PASSWORD: none
          DB_NAME: none
          LOCAL_DB_HOST: localhost
          LOCAL_DB_USER: none
          LOCAL_DB_PASSWORD: none
          LOCAL_DB_NAME: none
        run: |
          set -a
          if [ -f ../../ops/campaign-backdrops/request ]; then
            grep -E '^(IDS|FORCE)=' ../../ops/campaign-backdrops/request > /tmp/req.env || true
            cat /tmp/req.env
            . /tmp/req.env
          fi
          set +a
          npx tsx scripts/gen-campaign-backdrops.ts
      - name: Commit results back to the branch
        run: |
          git config user.name "onbrand-illustrations-bot"
          git config user.email "ops@contentincubator2.com"
          git add skills/ai-talent/client/public/campaign-backdrops \
                  skills/ai-talent/client/src/v2/strategy/lib/campaignBackdropIds.json
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "ops(backdrops): gpt-image-2 產出活動頁底圖模板（run ${{ github.run_id }}）"
          git push origin HEAD:${{ github.ref_name }}
