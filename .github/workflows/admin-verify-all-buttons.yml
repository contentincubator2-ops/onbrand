name: Admin — Verify P2/P3/P4/P5 + every button end-to-end

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 240s
          script: |
            cd /opt/marketing-os/app/skills/ai-talent
            COOKIE='session=eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxOTkiLCJvcGVuSWQiOiJoUGRNTXBNOWpNRDdEUXZBR19QUk9TYi1zRGw4bFRmYyIsImlhdCI6MTc3Nzk0Nzk3MywiZXhwIjoxODA5NDgzOTczfQ.ffZWP9Ajog__s5xC4e8fuFjruX1zm89Trg42Ayw4BCA'
            BASE='http://localhost:3101/trpc'

            HIT() {
              local METHOD=$1; local PATH=$2; local BODY=$3
              if [ "$METHOD" = "GET" ]; then
                local INPUT_ENC=$(printf '%s' "$BODY" | jq -sRr @uri)
                curl -sS --max-time 60 -X GET "$BASE/$PATH?batch=1&input=$INPUT_ENC" -H "Cookie: $COOKIE"
              else
                curl -sS --max-time 60 -X POST "$BASE/$PATH?batch=1" -H "Cookie: $COOKIE" -H "Content-Type: application/json" -d "$BODY"
              fi
            }

            echo "════════ STEP 1: Create fresh output (fb-30-caption-short) ════════"
            CREATE=$(HIT POST quickTask.runOrchestra '{"0":{"taskId":"fb-30-caption-short","inputs":{"topic":"驗收測試貼文：粉紅健走 5/9 花博"},"brandId":2832}}')
            OUT_ID=$(echo "$CREATE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0].get('result',{}).get('data',{}).get('outputId',''))")
            echo "Created outputId=$OUT_ID"
            echo ""

            if [ -z "$OUT_ID" ]; then
              echo "✗ STOP: outputId not created. Response:"
              echo "$CREATE" | head -c 500
              exit 1
            fi

            echo "════════ STEP 2 (P2 agent timeline): metadata.stages persisted? ════════"
            export MYSQL_PWD="mos_secure_2026"
            mysql -h localhost -u mos_user mos_db -BN -e "
              SELECT
                JSON_EXTRACT(metadata, '\$.stages') AS stages_json,
                JSON_LENGTH(JSON_EXTRACT(metadata, '\$.stages')) AS stage_count,
                JSON_EXTRACT(metadata, '\$.captionAgent.name') AS caption_agent_name,
                JSON_EXTRACT(metadata, '\$.imageAgent.name')   AS image_agent_name
              FROM mission_outputs WHERE id=$OUT_ID
            " | head -1
            STAGES=$(mysql -h localhost -u mos_user mos_db -BN -e "SELECT JSON_LENGTH(JSON_EXTRACT(metadata, '\$.stages')) FROM mission_outputs WHERE id=$OUT_ID")
            echo "  stage_count=$STAGES (expect ≥2)"
            [ "$STAGES" -ge "2" ] && echo "  ✓ P2 PASS" || echo "  ✗ P2 FAIL"
            echo ""

            echo "════════ STEP 3 (getById): returns mission.taskId? ════════"
            GETBY=$(HIT GET output.getById "{\"0\":{\"id\":$OUT_ID}}")
            TID=$(echo "$GETBY" | python3 -c "import sys,json; d=json.load(sys.stdin); print((d[0].get('result',{}).get('data') or {}).get('mission',{}).get('taskId',''))")
            echo "  mission.taskId=$TID (expect fb-30-caption-short)"
            [ "$TID" = "fb-30-caption-short" ] && echo "  ✓ getById PASS" || echo "  ✗ getById FAIL"
            echo ""

            echo "════════ STEP 4 (P3 regen): regenerate variant 0 ════════"
            REGEN=$(HIT POST quickTask.regenerateVariant "{\"0\":{\"outputId\":$OUT_ID,\"variantIndex\":0}}")
            OK=$(echo "$REGEN" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0].get('result',{}).get('data',{}).get('ok',False))")
            echo "  ok=$OK"
            [ "$OK" = "True" ] && echo "  ✓ P3 PASS" || echo "  ✗ P3 FAIL — resp: $(echo $REGEN | head -c 300)"
            echo ""

            echo "════════ STEP 5 (P4 image regen): output.updateVariantImage ════════"
            UPD=$(HIT POST output.updateVariantImage "{\"0\":{\"id\":$OUT_ID,\"variantIndex\":0,\"imageUrl\":\"https://placehold.co/1024x1024/png\",\"style\":\"test placeholder\"}}")
            OK=$(echo "$UPD" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0].get('result',{}).get('data',{}).get('ok',False))")
            echo "  ok=$OK"
            [ "$OK" = "True" ] && echo "  ✓ P4 (updateVariantImage) PASS" || echo "  ✗ P4 FAIL — resp: $(echo $UPD | head -c 300)"
            echo ""

            echo "════════ STEP 6 (P5 publish): expected PRECONDITION_FAILED until env set ════════"
            PUB=$(HIT POST publish.toFacebook "{\"0\":{\"outputId\":$OUT_ID,\"variantIndex\":0}}")
            CODE=$(echo "$PUB" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0].get('error',{}).get('data',{}).get('code',''))")
            MSG=$(echo "$PUB" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0].get('error',{}).get('message','')[:80])")
            echo "  code=$CODE  msg=$MSG"
            if [ "$CODE" = "PRECONDITION_FAILED" ]; then
              echo "  ✓ P5 wiring PASS (server returns clear hint to set Pipedream env)"
            elif [ -z "$CODE" ]; then
              echo "  ✓ P5 PASS (Pipedream actually configured! published)"
            else
              echo "  ✗ P5 FAIL — unexpected error code"
            fi
            echo ""

            echo "════════ STEP 7 (Schedule): output.scheduleIcs ════════"
            SCH=$(HIT POST output.scheduleIcs "{\"0\":{\"id\":$OUT_ID,\"variantIndex\":0,\"scheduledAt\":\"2026-05-15T10:00:00Z\",\"durationMinutes\":30}}")
            ICS_LEN=$(echo "$SCH" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d[0].get('result',{}).get('data',{}).get('ics','')))")
            echo "  ics body length=$ICS_LEN (expect >100)"
            [ "$ICS_LEN" -gt "100" ] && echo "  ✓ Schedule PASS" || echo "  ✗ Schedule FAIL"
            echo ""

            echo "════════ STEP 8 (Save mission): output.updateStatus to approved ════════"
            STAT=$(HIT POST output.updateStatus "{\"0\":{\"id\":$OUT_ID,\"status\":\"approved\"}}")
            OK=$(echo "$STAT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0].get('result',{}).get('data',{}).get('success',False))")
            echo "  success=$OK"
            [ "$OK" = "True" ] && echo "  ✓ Save Mission PASS" || echo "  ✗ Save Mission FAIL"
            echo ""

            echo "════════ STEP 9 (Update caption — direct edit save): output.updateVariantCaption ════════"
            UPDC=$(HIT POST output.updateVariantCaption "{\"0\":{\"id\":$OUT_ID,\"variantIndex\":0,\"caption\":\"驗收測試覆寫\"}}")
            OK=$(echo "$UPDC" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0].get('result',{}).get('data',{}).get('ok',False))")
            echo "  ok=$OK"
            [ "$OK" = "True" ] && echo "  ✓ Edit save PASS" || echo "  ✗ Edit save FAIL"
            echo ""

            echo "════════ STEP 10 (PR task that was failing): pr-30-headline ════════"
            PR=$(HIT POST quickTask.runOrchestra '{"0":{"taskId":"pr-30-headline","inputs":{"event":"桂冠營養研究室於 2026 年 5 月 9 日花博公園粉紅健走應援"},"brandId":2832}}')
            PR_OK=$(echo "$PR" | python3 -c "
            import sys, json
            d=json.load(sys.stdin)
            r=(d[0].get('result',{}).get('data')) or {}
            vs=r.get('variants', [])
            ok=sum(1 for v in vs if (v.get('caption') or '').strip())
            print(f'{ok}/{len(vs)}')
            ")
            echo "  PR variants: $PR_OK"
            [ "$PR_OK" = "3/3" ] && echo "  ✓ PR PASS" || echo "  ⚠ PR partial (was 0/3 before timeout fix)"
            echo ""

            echo "════════ FINAL SUMMARY ════════"
            echo "outputId used for tests: $OUT_ID"
            mysql -h localhost -u mos_user mos_db -e "
              SELECT id, status, version, JSON_EXTRACT(metadata, '\$.lastRegenAt') AS last_regen, JSON_LENGTH(JSON_EXTRACT(metadata, '\$.stages')) AS stages
              FROM mission_outputs WHERE id=$OUT_ID
            "
