name: Admin — Rematch brand-archetype-positioning Squad Agents

# Writes 6-agent configuration to squads.agents + squads.steps
#
# Final confirmed config:
#   Lead (180797 Mary Allen)   — Intake + Synthesis ONLY, does NOT execute steps
#   Step 1 (30003  王志豪)     — brand_perception_analyst
#   Step 2 (180299 陳怡君)     — archetype_selector (原型選擇與組合)
#   Step 3 (220839 陳哲宇)     — brand_voice_specialist
#   Step 4 (229484 余佳穎)     — creative_director
#   Step 5 (39     徐俊偉)     — consistency_auditor (全通路原型一致性稽核)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'AUDIT = verify agent info | APPLY = write to DB'
        required: true
        default: 'AUDIT'

jobs:
  rematch:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            MOS_USER="mos_user"
            MOS_PASS="mos_secure_2026"
            MOS_DB="mos_db"
            MODE="${{ github.event.inputs.mode }}"
            SLUG="brand-archetype-positioning"

            # ── Confirmed IDs ────────────────────────────────────────────
            LEAD_ID=180797    # Mary Allen  — Intake + Synthesis
            S1_ID=30003       # 王志豪      — brand_perception_analyst
            S2_ID=180299      # 陳怡君      — archetype_selector
            S3_ID=220839      # 陳哲宇      — brand_voice_specialist
            S4_ID=229484      # 余佳穎      — creative_director
            S5_ID=39          # 徐俊偉      — consistency_auditor

            echo "======================================================"
            echo "brand-archetype-positioning — Agent Rematch ($MODE)"
            echo "======================================================"

            echo ""
            echo "=== Verifying all 6 agents ==="
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
              SELECT id, name, slug, primarySkill, aiModel
              FROM agents
              WHERE id IN ($LEAD_ID, $S1_ID, $S2_ID, $S3_ID, $S4_ID, $S5_ID)
              ORDER BY FIELD(id, $LEAD_ID, $S1_ID, $S2_ID, $S3_ID, $S4_ID, $S5_ID);
            " 2>&1

            if [ "$MODE" = "APPLY" ]; then

              echo ""
              echo "=== Fetching slugs + names ==="
              get_slug() { mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -sN -e "SELECT COALESCE(slug,'') FROM agents WHERE id=$1 LIMIT 1;" 2>/dev/null; }
              get_name() { mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -sN -e "SELECT COALESCE(name,'') FROM agents WHERE id=$1 LIMIT 1;" 2>/dev/null; }

              LEAD_SLUG=$(get_slug $LEAD_ID); LEAD_NAME=$(get_name $LEAD_ID)
              S1_SLUG=$(get_slug $S1_ID);    S1_NAME=$(get_name $S1_ID)
              S2_SLUG=$(get_slug $S2_ID);    S2_NAME=$(get_name $S2_ID)
              S3_SLUG=$(get_slug $S3_ID);    S3_NAME=$(get_name $S3_ID)
              S4_SLUG=$(get_slug $S4_ID);    S4_NAME=$(get_name $S4_ID)
              S5_SLUG=$(get_slug $S5_ID);    S5_NAME=$(get_name $S5_ID)

              echo "  Lead  : $LEAD_NAME ($LEAD_ID / $LEAD_SLUG)"
              echo "  Step1 : $S1_NAME ($S1_ID / $S1_SLUG)"
              echo "  Step2 : $S2_NAME ($S2_ID / $S2_SLUG)"
              echo "  Step3 : $S3_NAME ($S3_ID / $S3_SLUG)"
              echo "  Step4 : $S4_NAME ($S4_ID / $S4_SLUG)"
              echo "  Step5 : $S5_NAME ($S5_ID / $S5_SLUG)"

              # ── 1. Update squads.agents ─────────────────────────────
              echo ""
              echo "=== 1. Updating squads.agents (6 members) ==="
              mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
                UPDATE squads SET agents = JSON_ARRAY(
                  JSON_OBJECT('agent_id', $LEAD_ID, 'is_lead', 1, 'role', 'archetype_strategist',   'order', 1),
                  JSON_OBJECT('agent_id', $S1_ID,   'is_lead', 0, 'role', 'brand_perception_analyst','order', 2),
                  JSON_OBJECT('agent_id', $S2_ID,   'is_lead', 0, 'role', 'archetype_selector',      'order', 3),
                  JSON_OBJECT('agent_id', $S3_ID,   'is_lead', 0, 'role', 'brand_voice_specialist',  'order', 4),
                  JSON_OBJECT('agent_id', $S4_ID,   'is_lead', 0, 'role', 'creative_director',       'order', 5),
                  JSON_OBJECT('agent_id', $S5_ID,   'is_lead', 0, 'role', 'consistency_auditor',     'order', 6)
                )
                WHERE slug = '$SLUG' AND is_active = 1;
              " 2>&1
              echo "✅ squads.agents updated (6 members)"

              # ── 2. Update squads.steps ──────────────────────────────
              echo ""
              echo "=== 2. Updating squads.steps assignments ==="
              mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
                UPDATE squads sq
                SET sq.steps = (
                  SELECT JSON_ARRAYAGG(
                    CASE
                      WHEN CAST(JSON_EXTRACT(jt.sv, '\$.order') AS UNSIGNED) = 1
                        THEN JSON_SET(jt.sv,
                          '\$.assignedAgentId',   $S1_ID,
                          '\$.assignedAgentSlug', '$S1_SLUG',
                          '\$.assignedAgentName', '$S1_NAME')
                      WHEN CAST(JSON_EXTRACT(jt.sv, '\$.order') AS UNSIGNED) = 2
                        THEN JSON_SET(jt.sv,
                          '\$.assignedAgentId',   $S2_ID,
                          '\$.assignedAgentSlug', '$S2_SLUG',
                          '\$.assignedAgentName', '$S2_NAME')
                      WHEN CAST(JSON_EXTRACT(jt.sv, '\$.order') AS UNSIGNED) = 3
                        THEN JSON_SET(jt.sv,
                          '\$.assignedAgentId',   $S3_ID,
                          '\$.assignedAgentSlug', '$S3_SLUG',
                          '\$.assignedAgentName', '$S3_NAME')
                      WHEN CAST(JSON_EXTRACT(jt.sv, '\$.order') AS UNSIGNED) = 4
                        THEN JSON_SET(jt.sv,
                          '\$.assignedAgentId',   $S4_ID,
                          '\$.assignedAgentSlug', '$S4_SLUG',
                          '\$.assignedAgentName', '$S4_NAME')
                      WHEN CAST(JSON_EXTRACT(jt.sv, '\$.order') AS UNSIGNED) = 5
                        THEN JSON_SET(jt.sv,
                          '\$.assignedAgentId',   $S5_ID,
                          '\$.assignedAgentSlug', '$S5_SLUG',
                          '\$.assignedAgentName', '$S5_NAME')
                      ELSE jt.sv
                    END
                  )
                  FROM JSON_TABLE(sq.steps, '\$[*]' COLUMNS (sv JSON PATH '\$')) AS jt
                )
                WHERE sq.slug = '$SLUG' AND sq.is_active = 1;
              " 2>&1
              echo "✅ squads.steps updated"

              # ── 3. Clear stale squad session ───────────────────────
              echo ""
              echo "=== 3. Clearing stale squad_chat_sessions ==="
              mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
                DELETE FROM squad_chat_sessions WHERE squadSlug = '$SLUG';
              " 2>&1
              echo "✅ squad_chat_sessions cleared"

              # ── 4. Final verification ───────────────────────────────
              echo ""
              echo "=== 4. Final verification ==="
              mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
                SELECT
                  st.step_order,
                  LEFT(st.step_name, 28)                   AS step_name,
                  st.assigned_agent_id                      AS agent_id,
                  COALESCE(a.name,        '(UNASSIGNED)')   AS agent_name,
                  COALESCE(a.primarySkill,'—')              AS primary_skill,
                  COALESCE(a.aiModel,     '—')              AS ai_model
                FROM squads s,
                  JSON_TABLE(s.steps, '\$[*]' COLUMNS (
                    step_order        INT          PATH '\$.order',
                    step_name         VARCHAR(200) PATH '\$.name',
                    assigned_agent_id INT          PATH '\$.assignedAgentId'
                  )) AS st
                LEFT JOIN agents a ON a.id = st.assigned_agent_id
                WHERE s.slug = '$SLUG' AND s.is_active = 1
                ORDER BY st.step_order;
              " 2>&1

              echo ""
              echo "======================================================"
              echo "✅ Rematch COMPLETE for $SLUG"
              echo "   Lead $LEAD_NAME handles: Intake (step 0) + Synthesis only"
              echo "   All steps now assigned to specialist agents"
              echo "======================================================"

            else
              echo ""
              echo "AUDIT only — run APPLY to write to DB."
              echo "======================================================"
            fi
