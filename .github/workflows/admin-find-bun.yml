name: Admin — Find bun on VM

on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            echo "── PATH ──"
            echo $PATH
            echo "── User ──"
            whoami
            echo "── Find bun ──"
            find /home /usr -name "bun" -type f 2>/dev/null | head -10
            find / -name "bun" -type f 2>/dev/null | head -10
            echo "── PM2 / node ──"
            which node npm pm2
            node --version 2>&1 | head -1
