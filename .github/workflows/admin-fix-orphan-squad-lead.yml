name: Admin — fix squad with lead_agent_id but empty members JSON

# CJ caught 2026-04-30 audit: 1 squad has lead_agent_id set but
# squads.agents JSON is null/empty — picker can't render leader chip,
# downstream code that reads members will skip this squad.
#
# Fix: prepend the lead agent into the empty members array so JSON has
# at least 1 entry. Skips squads that already have non-empty agents JSON.

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            set +e
            cd /opt/marketing-os/app/skills/ai-talent 2>/dev/null || cd /opt/marketing-os/skills/ai-talent
            set -a
            [ -f .env ] && . .env
            [ -f /opt/marketing-os/.env ] && . /opt/marketing-os/.env
            set +a
            DB_HOST_V=${DB_HOST:-127.0.0.1}
            DB_USER_V=${DB_USER:-root}
            DB_NAME_V=${DB_NAME:-mos_db}
            run_sql() { MYSQL_PWD="$DB_PASSWORD" mysql -h"$DB_HOST_V" -u"$DB_USER_V" "$DB_NAME_V" -t "$@"; }

            echo "===== BEFORE: orphan squads (lead set but no members) ====="
            run_sql -e "
              SELECT s.id, s.slug, s.lead_agent_id, a.name AS lead_name,
                     JSON_LENGTH(s.agents) AS member_count
                FROM squads s
           LEFT JOIN agents a ON a.id = s.lead_agent_id
               WHERE s.lead_agent_id IS NOT NULL
                 AND (s.agents IS NULL OR JSON_LENGTH(s.agents) = 0);"

            echo ""
            echo "===== APPLY FIX ====="
            # Synthesize a 1-entry members array containing the lead agent.
            # Format mirrors what seed-local-squads.ts writes: object with
            # id / name / role / is_lead.
            run_sql -e "
              UPDATE squads s
                JOIN agents a ON a.id = s.lead_agent_id
                 SET s.agents = JSON_ARRAY(JSON_OBJECT(
                       'id',      a.id,
                       'name',    a.name,
                       'role',    'Squad Lead',
                       'is_lead', TRUE
                     ))
               WHERE s.lead_agent_id IS NOT NULL
                 AND (s.agents IS NULL OR JSON_LENGTH(s.agents) = 0);"

            echo ""
            echo "===== AFTER: should be 0 orphans ====="
            run_sql -e "
              SELECT COUNT(*) AS remaining
                FROM squads s
               WHERE s.lead_agent_id IS NOT NULL
                 AND (s.agents IS NULL OR JSON_LENGTH(s.agents) = 0);"

            echo ""
            echo "===== Done ====="
