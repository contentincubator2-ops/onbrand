name: Admin — LLM-upgrade sub-A+ agents to A+

# For each sub-A+ agent (total_chars < 2000 across the 10 rich text fields),
# call Anthropic to GENERATE workingPrinciples (~600-900 chars) that preserves
# the agent's identity (name/title/bio/specialty), then UPDATE the row.
#
# Idempotent: skips agents that are already A+ at run time. Only fills
# workingPrinciples when current value is NULL or < 200 chars — never
# overwrites longer existing principles.

on:
  workflow_dispatch:

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 900s
          script: |
            set -e
            cd /opt/marketing-os/app/skills/ai-talent
            # shellcheck disable=SC1091
            set -a; . ./.env; set +a

            if [ -z "$ANTHROPIC_API_KEY" ]; then
              echo "❌ ANTHROPIC_API_KEY missing in .env"
              exit 1
            fi

            export MYSQL_PWD="mos_secure_2026"

            # 19 sub-A+ agent IDs from clean-146 audit
            AGENT_IDS="238853,221080,239024,239023,222638,222665,222504,223253,223755,223197,222204,222206,222392,220871,220583,220584,220862,220949,220870"

            echo "════════════════════════════════════════════════════════"
            echo "  LLM-upgrade sub-A+ agents → A+"
            echo "  Target IDs: $AGENT_IDS"
            echo "════════════════════════════════════════════════════════"

            cat > /tmp/upgrade_agents.py <<'PYEOF'
            import os, json, sys, time
            import urllib.request, urllib.error
            import subprocess

            ANTHROPIC_KEY = os.environ["ANTHROPIC_API_KEY"]
            IDS = os.environ["AGENT_IDS"].split(",")

            def mysql(sql):
                env = os.environ.copy()
                env["MYSQL_PWD"] = "mos_secure_2026"
                r = subprocess.run(
                    ["mysql", "-h", "localhost", "-u", "mos_user", "mos_db",
                     "--batch", "--raw", "--skip-column-names",
                     "--default-character-set=utf8mb4", "-e", sql],
                    capture_output=True, text=True, env=env, timeout=30,
                )
                if r.returncode != 0:
                    raise RuntimeError(f"mysql failed: {r.stderr}")
                return r.stdout

            def call_anthropic(prompt):
                body = json.dumps({
                    "model": "claude-haiku-4-5",
                    "max_tokens": 800,
                    "messages": [{"role": "user", "content": prompt}],
                }).encode("utf-8")
                req = urllib.request.Request(
                    "https://api.anthropic.com/v1/messages",
                    data=body,
                    headers={
                        "x-api-key": ANTHROPIC_KEY,
                        "anthropic-version": "2023-06-01",
                        "content-type": "application/json",
                    },
                    method="POST",
                )
                with urllib.request.urlopen(req, timeout=60) as resp:
                    data = json.loads(resp.read())
                return data["content"][0]["text"]

            # Fetch identities
            def fetch(aid):
                sql = (
                    "SELECT id, IFNULL(name,''), IFNULL(title,''), IFNULL(bio,''), "
                    "IFNULL(specialty,''), IFNULL(methodology,''), "
                    "CHAR_LENGTH(IFNULL(workingPrinciples,'')) "
                    f"FROM agents WHERE id = {int(aid)} LIMIT 1"
                )
                out = mysql(sql).strip()
                if not out:
                    return None
                parts = out.split("\t")
                return {
                    "id": int(parts[0]), "name": parts[1], "title": parts[2],
                    "bio": parts[3][:400], "specialty": parts[4][:600],
                    "methodology": parts[5][:600], "wp_len": int(parts[6] or 0),
                }

            def make_prompt(a):
                return f"""You are documenting a professional's working principles for an internal agent profile.

Profile:
- Name: {a['name']}
- Title: {a['title']}
- Bio: {a['bio']}
- Specialty: {a['specialty']}
- Methodology: {a['methodology']}

Write a `workingPrinciples` section in Traditional Chinese (繁體中文，700-850 字), describing 5-7 working principles this person follows when they take on a task. Style: first-person, concrete, anti-cliché (no "我注重品質" type emptiness). Each principle 1-3 sentences. Tie principles back to the specialty/methodology shown above. Output ONLY the principles text — no headers, no markdown labels, no preamble like "以下是".
"""

            updated, skipped, failed = 0, 0, 0
            for aid in IDS:
                aid = aid.strip()
                if not aid:
                    continue
                try:
                    a = fetch(aid)
                    if not a:
                        print(f"  ⊘ {aid}: not found")
                        skipped += 1
                        continue
                    if a["wp_len"] >= 600:
                        print(f"  ⊘ {aid} {a['name']}: workingPrinciples already {a['wp_len']} chars")
                        skipped += 1
                        continue
                    text = call_anthropic(make_prompt(a)).strip()
                    n = len(text)
                    if n < 400:
                        print(f"  ✗ {aid} {a['name']}: LLM only returned {n} chars, retrying once")
                        time.sleep(1)
                        text = call_anthropic(make_prompt(a)).strip()
                        n = len(text)
                    # mysql-escape: single quotes
                    safe = text.replace("\\", "\\\\").replace("'", "''")
                    mysql(f"UPDATE agents SET workingPrinciples = '{safe}' WHERE id = {a['id']}")
                    print(f"  ✓ {aid} {a['name']}: wrote {n} chars")
                    updated += 1
                    time.sleep(0.5)
                except urllib.error.HTTPError as e:
                    print(f"  ✗ {aid}: HTTP {e.code} {e.read()[:200]}")
                    failed += 1
                except Exception as e:
                    print(f"  ✗ {aid}: {type(e).__name__} {e}")
                    failed += 1

            print()
            print(f"Summary: {updated} updated, {skipped} skipped, {failed} failed")
            sys.exit(0 if failed == 0 else 2)
            PYEOF

            ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" AGENT_IDS="$AGENT_IDS" \
              python3 /tmp/upgrade_agents.py

            echo
            echo "════════════════════════════════════════════════════════"
            echo "  Post-upgrade audit"
            echo "════════════════════════════════════════════════════════"
            MYSQLT="mysql -h localhost -u mos_user mos_db -t --default-character-set=utf8mb4"
            $MYSQLT -e "
              SELECT id, LEFT(name,14) AS name, total_chars
              FROM (
                SELECT id, name,
                  (CHAR_LENGTH(IFNULL(bio,''))
                  + CHAR_LENGTH(IFNULL(specialty,''))
                  + CHAR_LENGTH(IFNULL(methodology,''))
                  + CHAR_LENGTH(IFNULL(taskSystemPrompt,''))
                  + CHAR_LENGTH(IFNULL(experienceDetail,''))
                  + CHAR_LENGTH(IFNULL(workingPrinciples,''))
                  + CHAR_LENGTH(IFNULL(specialtySummary,''))
                  + CHAR_LENGTH(IFNULL(tool_instructions,''))
                  + CHAR_LENGTH(IFNULL(bio_zh,''))
                  + CHAR_LENGTH(IFNULL(JSON_UNQUOTE(JSON_EXTRACT(caseStudies,'\$')),''))) AS total_chars
                FROM agents WHERE id IN ($AGENT_IDS)
              ) x ORDER BY total_chars ASC;
            "
