name: Admin — Consolidate VM to single monorepo folder

# Migrates VM from guo.chen's split-repo setup to a single Marketing-OS monorepo.
#
# Before: PM2 id=0 (broken monorepo) + id=4 (split backend at /opt/marketing-os-backend)
# After:  PM2 id=0 (single app at /opt/marketing-os/app/skills/ai-talent)
#
# Nginx stays unchanged (already proxies localhost:3101).
# .env is copied from the old backend so all secrets are preserved.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CONSOLIDATE'
        required: true
        type: string

jobs:
  consolidate:
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm == 'CONSOLIDATE' }}
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 600s
          script: |
            set -e
            APP=/opt/marketing-os/app
            AI=$APP/skills/ai-talent
            OLD_BE=/opt/marketing-os/marketing-os-backend
            OLD_ENV=$OLD_BE/.env

            echo "===== Step 1: Clone or update Marketing-OS monorepo ====="
            if [ -d "$APP/.git" ]; then
              echo "Repo exists — pulling latest..."
              cd "$APP"
              git fetch origin main && git reset --hard origin/main
            else
              echo "Fresh clone..."
              mkdir -p /opt/marketing-os
              git clone https://github.com/contentincubator2-ops/Marketing-OS.git "$APP"
            fi
            echo "Latest commit: $(cd $APP && git log --oneline -1)"

            echo ""
            echo "===== Step 2: Copy .env from old backend ====="
            if [ -f "$OLD_ENV" ]; then
              cp -v "$OLD_ENV" "$AI/.env"
              echo ".env copied OK"
            else
              echo "WARNING: no .env found at $OLD_ENV — server may not start"
            fi

            echo ""
            echo "===== Step 3: Install backend dependencies ====="
            cd "$AI"
            npm install --legacy-peer-deps 2>&1 | tail -5

            echo ""
            echo "===== Step 4: Build frontend ====="
            cd "$AI/client"
            npm install --legacy-peer-deps 2>&1 | tail -5
            npm run build 2>&1 | tail -8
            echo "Frontend build done. public/index.html:"
            stat -c '%y %s bytes' "$AI/public/index.html"

            echo ""
            echo "===== Step 5: Switch PM2 to single process ====="
            # Stop old processes
            pm2 stop marketing-os 2>/dev/null || true
            pm2 delete marketing-os 2>/dev/null || true
            pm2 stop marketing-os-backend-dev 2>/dev/null || true
            pm2 delete marketing-os-backend-dev 2>/dev/null || true

            # Start single process from monorepo
            cd "$AI"
            pm2 start "npx tsx server/index.ts" \
              --name marketing-os \
              --cwd "$AI" \
              2>&1 | tail -5
            pm2 save

            echo ""
            echo "===== Step 6: Health check ====="
            sleep 4
            pm2 list | head -6
            curl -s -o /dev/null -w "Backend /health: HTTP %{http_code}\n" http://127.0.0.1:3101/health
            stat -c 'Frontend build: %y' "$AI/public/index.html"

            echo ""
            echo "===== Done — old split repos still at /opt/marketing-os/marketing-os-backend|frontend ====="
            echo "You can remove them manually once you confirm the site works."
