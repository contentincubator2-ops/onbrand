name: Admin — Generate agent-assignments.json (offline, deterministic)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 300s
          script: |
            set -e
            cd /opt/marketing-os/skills/ai-talent
            git pull --rebase origin main
            echo "── Running generate-agent-assignments.ts ──"
            bun run scripts/generate-agent-assignments.ts
            echo ""
            echo "── data/agent-assignments.json head ──"
            head -30 data/agent-assignments.json
            echo ""
            echo "── Committing JSON ──"
            git add data/agent-assignments.json
            git -c user.email='deploy@marketing-os' -c user.name='admin-bot' \
              commit -m 'Generate agent-assignments.json (deterministic 1:1 B+ pool)' || echo "nothing to commit"
            git push origin main
