name: Admin — Generate agent-assignments.json (offline, deterministic)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Push latest script to VM
        run: |
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            skills/ai-talent/scripts/generate-agent-assignments.ts \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/opt/marketing-os/app/skills/ai-talent/scripts/"

      - name: Run generator on VM (DB available)
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
            'export PATH="$HOME/.bun/bin:$HOME/.npm-global/bin:/usr/local/bin:/usr/bin:/bin:$PATH"; which bun || ls -la $HOME/.bun/bin/ 2>/dev/null; cd /opt/marketing-os/app/skills/ai-talent && $HOME/.bun/bin/bun run scripts/generate-agent-assignments.ts'

      - name: Pull generated JSON back to runner
        run: |
          mkdir -p skills/ai-talent/data
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/opt/marketing-os/app/skills/ai-talent/data/agent-assignments.json" \
            skills/ai-talent/data/agent-assignments.json
          echo "── Generated JSON header ──"
          head -20 skills/ai-talent/data/agent-assignments.json

      - name: Commit + push JSON
        run: |
          git config user.email 'deploy@marketing-os'
          git config user.name 'admin-bot'
          git add skills/ai-talent/data/agent-assignments.json
          git diff --cached --stat
          git commit -m 'Generate agent-assignments.json (deterministic B+ pool 1:1)' || echo "no changes"
          git push origin main
