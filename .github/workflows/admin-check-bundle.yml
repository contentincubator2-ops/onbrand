name: Admin — check live bundle for taskCatalog refs

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            AI=/opt/marketing-os/app/skills/ai-talent
            echo "===== current bundle ====="
            grep -oE 'index-[A-Za-z0-9_-]+\.js' "$AI/public/index.html" | head -1
            BUNDLE=$(grep -oE 'index-[A-Za-z0-9_-]+\.js' "$AI/public/index.html" | head -1)

            echo ""
            echo "===== taskCatalog string presence ====="
            grep -c "taskCatalog" "$AI/public/assets/$BUNDLE" || echo "0"

            echo ""
            echo "===== CatalogTaskCard / ComingSoonDrawer presence ====="
            grep -oE "CatalogTaskCard|ComingSoonDrawer|listForPicker" "$AI/public/assets/$BUNDLE" | sort -u

            echo ""
            echo "===== last 10 commits ====="
            cd /opt/marketing-os/app && git log --oneline -10
