name: Admin — Find sub-A+ agents + replacement candidates for dupes

on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 120s
          script: |
            export MYSQL_PWD="mos_secure_2026"
            MYSQLT="mysql -h localhost -u mos_user mos_db -t --default-character-set=utf8mb4"

            IDS_USED="24,26,29,32,35,30002,30003,30004,30005,30006,30008,30009,30011,30013,30014,30015,30016,30017,30018,30019,30020,60002,60005,60011,60012,60021,60022,60029,60030,60031,60033,60035,60036,60037,60038,60048,60055,60056,60060,60061,60063,60066,60068,60072,60073,90004,90005,90006,90031,90032,180003,180009,180039,180054,180062,180068,180143,180150,180157,180158,180159,180166,180167,180168,180172,180173,180175,180176,180186,180193,180196,180197,180199,180203,180797,210001,210011,210173,210252,210266,210301,210302,220164,220504,220506,220507,220508,220869,220887,220890,220896,222204,222206,222211,222311,222504,222638,222665,222727,222814,222932,222933,222934,223197,223253,223755,223993,223995,223996,224001,224005,224054,224056,224059,224061,224067,224071,224079,224081,224086,224089,224094,224101,224114,224116,224117,224121,224136,224144,224154,224155,224156,224159,224161,224167,224171,224176,224179,224189,224196,224219,224220,224251"

            echo "════════════════════════════════════════════════════════"
            echo "  AGENTS STILL SUB-A+ AFTER EXTENDED FIELD READ"
            echo "════════════════════════════════════════════════════════"
            $MYSQLT -e "
              SELECT id, LEFT(name,14) AS name, LEFT(title,30) AS title, total_chars
              FROM (
                SELECT id, name, title,
                  (CHAR_LENGTH(IFNULL(bio,''))
                  + CHAR_LENGTH(IFNULL(specialty,''))
                  + CHAR_LENGTH(IFNULL(methodology,''))
                  + CHAR_LENGTH(IFNULL(taskSystemPrompt,''))
                  + CHAR_LENGTH(IFNULL(experienceDetail,''))
                  + CHAR_LENGTH(IFNULL(workingPrinciples,''))
                  + CHAR_LENGTH(IFNULL(specialtySummary,''))
                  + CHAR_LENGTH(IFNULL(tool_instructions,''))
                  + CHAR_LENGTH(IFNULL(bio_zh,''))
                  + CHAR_LENGTH(IFNULL(JSON_UNQUOTE(JSON_EXTRACT(caseStudies,'\$')),''))) AS total_chars
                FROM agents WHERE id IN ($IDS_USED)
              ) x WHERE total_chars < 2000 ORDER BY total_chars ASC;
            "

            echo
            echo "════════════════════════════════════════════════════════"
            echo "  UNUSED A+ AGENTS (≥2000) to replace duplicates"
            echo "  18 dupes need unique replacements"
            echo "════════════════════════════════════════════════════════"
            $MYSQLT -e "
              SELECT id, LEFT(name,14) AS name, LEFT(title,35) AS title,
                LEFT(IFNULL(primarySkill,''),20) AS skill,
                (CHAR_LENGTH(IFNULL(bio,''))
                + CHAR_LENGTH(IFNULL(specialty,''))
                + CHAR_LENGTH(IFNULL(methodology,''))
                + CHAR_LENGTH(IFNULL(taskSystemPrompt,''))
                + CHAR_LENGTH(IFNULL(experienceDetail,''))
                + CHAR_LENGTH(IFNULL(workingPrinciples,''))
                + CHAR_LENGTH(IFNULL(specialtySummary,''))
                + CHAR_LENGTH(IFNULL(tool_instructions,''))) AS total
              FROM agents
              WHERE id NOT IN ($IDS_USED)
                AND reviewStatus = 'approved'
              HAVING total >= 2000
              ORDER BY total DESC
              LIMIT 60;
            "
