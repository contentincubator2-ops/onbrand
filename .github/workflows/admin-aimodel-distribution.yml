name: Admin — aiModel distribution

on:
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 60s
          script: |
            set +e
            cd /opt/marketing-os/app/skills/ai-talent
            DBE=$(grep -E '^DB_' .env | sed 's/^/export /')
            eval "$DBE"
            DB_HOST_V=${DB_HOST:-127.0.0.1}
            DB_USER_V=${DB_USER:-root}
            DB_NAME_V=${DB_NAME:-mos_db}

            run_sql() {
              MYSQL_PWD="$DB_PASSWORD" mysql -h"$DB_HOST_V" -u"$DB_USER_V" "$DB_NAME_V" -t -e "$1" 2>&1
            }

            echo "===== agents table column check ====="
            run_sql "SHOW COLUMNS FROM agents WHERE Field IN ('aiModel','primarySkill','layer');"

            echo ""
            echo "===== Total agents ====="
            run_sql "SELECT COUNT(*) AS total_agents FROM agents;"

            echo ""
            echo "===== aiModel NULL vs set ====="
            run_sql "SELECT
              SUM(CASE WHEN aiModel IS NULL OR aiModel = '' THEN 1 ELSE 0 END) AS unset,
              SUM(CASE WHEN aiModel IS NOT NULL AND aiModel <> '' THEN 1 ELSE 0 END) AS set_val
              FROM agents;"

            echo ""
            echo "===== Top 30 aiModel values (whole agents table) ====="
            run_sql "SELECT COALESCE(NULLIF(aiModel,''),'(empty)') AS ai_model, COUNT(*) AS n
              FROM agents
              GROUP BY ai_model
              ORDER BY n DESC LIMIT 30;"

            echo ""
            echo "===== aiModel distribution by layer ====="
            run_sql "SELECT layer, COALESCE(NULLIF(aiModel,''),'(empty)') AS ai_model, COUNT(*) AS n
              FROM agents
              GROUP BY layer, ai_model
              ORDER BY layer, n DESC;"

            echo ""
            echo "===== Squad lead aiModel distribution (only agents that lead a squad) ====="
            run_sql "SELECT COALESCE(NULLIF(a.aiModel,''),'(empty)') AS ai_model, COUNT(*) AS n
              FROM agents a
              JOIN squads s ON s.lead_agent_id = a.id
              WHERE s.is_active = 1
              GROUP BY ai_model
              ORDER BY n DESC;"

            echo ""
            echo "===== Squad lead aiModel by strategy_layer ====="
            run_sql "SELECT s.strategy_layer, COALESCE(NULLIF(a.aiModel,''),'(empty)') AS ai_model, COUNT(*) AS n
              FROM squads s
              JOIN agents a ON s.lead_agent_id = a.id
              WHERE s.is_active = 1 AND s.strategy_layer IS NOT NULL
              GROUP BY s.strategy_layer, ai_model
              ORDER BY s.strategy_layer, n DESC;"

            echo ""
            echo "===== tier='core' squad leads — what aiModel ====="
            run_sql "SELECT s.strategy_layer, s.slug, a.name AS lead_name,
              COALESCE(NULLIF(a.aiModel,''),'(empty)') AS ai_model
              FROM squads s
              JOIN agents a ON s.lead_agent_id = a.id
              WHERE s.is_active = 1 AND s.tier = 'core'
              ORDER BY s.strategy_layer, s.id;"
