name: Admin — Create Brand Squad Test Missions

# Creates 5 test missions (one per remaining brand squad) so UI tests can be run.
# Each mission gets squadSlug set, triggering squad-first routing in missionChatRouter.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CREATE to insert test missions'
        required: true
        type: string

jobs:
  create:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'CREATE'
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -e
            MOS_USER="mos_user"
            MOS_PASS="mos_secure_2026"
            MOS_DB="mos_db"

            echo "=== 1. Get SoWork AI brandId ==="
            BRAND_ID=$(mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -sN -e "
              SELECT id FROM brands WHERE name LIKE '%SoWork%' LIMIT 1;
            " 2>/dev/null)
            echo "Brand ID: $BRAND_ID"

            echo ""
            echo "=== 2. Check missions table schema (squadSlug column) ==="
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
              SELECT COLUMN_NAME, COLUMN_TYPE
              FROM information_schema.COLUMNS
              WHERE TABLE_SCHEMA = DATABASE()
                AND TABLE_NAME = 'missions'
                AND COLUMN_NAME = 'squadSlug';
            " 2>&1

            echo ""
            echo "=== 3. Skip if test missions already exist ==="
            EXISTING=$(mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -sN -e "
              SELECT COUNT(*) FROM missions
              WHERE squadSlug IN (
                'segmentation-based-positioning',
                'competitive-perceptual-mapping',
                'category-design-positioning',
                'mind-positioning',
                'purpose-driven-positioning'
              );
            " 2>/dev/null)
            echo "Existing test missions: $EXISTING"

            echo ""
            echo "=== 3b. Get userId for cjwang@sowork.tw ==="
            USER_ID=$(mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -sN -e "
              SELECT id FROM users WHERE email='cjwang@sowork.tw' LIMIT 1;
            " 2>/dev/null)
            echo "User ID: $USER_ID"

            echo ""
            echo "=== 4. Insert test missions ==="
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
              INSERT INTO missions (userId, title, description, workspace, brandId, squadSlug)
              VALUES
                (${USER_ID}, 'SoWork AI 市場分群定位分析',
                 '市場分群定位分析，建立消費品牌的 ICP Profile，識別最佳客群，制定市場區隔策略',
                 'strategy', ${BRAND_ID}, 'segmentation-based-positioning'),
                (${USER_ID}, 'SoWork AI 競品知覺地圖',
                 '品牌知覺地圖分析，找出競品定位空間，建立差異化定位',
                 'strategy', ${BRAND_ID}, 'competitive-perceptual-mapping'),
                (${USER_ID}, 'SoWork AI 新品類設計定位',
                 '新品類設計定位，建立 Point-of-View 宣言，Category Design 方法論',
                 'strategy', ${BRAND_ID}, 'category-design-positioning'),
                (${USER_ID}, 'SoWork AI 心智定位分析',
                 '心智定位分析（里斯特勞特 One-Word Positioning），建立品牌心智佔有率',
                 'strategy', ${BRAND_ID}, 'mind-positioning'),
                (${USER_ID}, 'SoWork AI 目的驅動定位',
                 '目的驅動品牌定位（Sinek Golden Circle），建立使命宣言與品牌故事',
                 'strategy', ${BRAND_ID}, 'purpose-driven-positioning');
            " 2>&1

            echo ""
            echo "=== 5. Verify: show new mission IDs ==="
            mysql -u "$MOS_USER" -p"$MOS_PASS" "$MOS_DB" -e "
              SELECT id, title, workspace, squadSlug
              FROM missions
              WHERE squadSlug IN (
                'segmentation-based-positioning',
                'competitive-perceptual-mapping',
                'category-design-positioning',
                'mind-positioning',
                'purpose-driven-positioning'
              )
              ORDER BY id;
            " 2>&1

            echo ""
            echo "✅ Test missions created. Navigate to /m/{id} to test each squad."
