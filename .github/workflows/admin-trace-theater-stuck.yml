name: Admin — Trace theater stuck on day 2
on: { workflow_dispatch: {} }
jobs:
  trace:
    runs-on: [self-hosted, linux, vm-marketing-os]
    timeout-minutes: 2
    steps:
      - run: |
          set +e
          AI=/opt/onbrand/app/skills/ai-talent
          set -a; source "$AI/.env" 2>/dev/null; set +a
          export MYSQL_PWD="${LOCAL_DB_PASSWORD}"
          MYSQL="mysql -h ${LOCAL_DB_HOST:-localhost} -u ${LOCAL_DB_USER:-mos_user} ${LOCAL_DB_NAME:-mos_db}"

          echo "════ theater_runs / theater_days for brand 2830 ════"
          $MYSQL -e "SHOW TABLES LIKE 'theater%'" -t

          echo ""
          for t in theater_runs theater_days theater_pieces theater_jobs; do
            EXISTS=$($MYSQL -B -N --silent -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name='$t'")
            if [ "$EXISTS" = "1" ]; then
              echo "── $t (last 10 rows for brandId=2830 or any) ──"
              $MYSQL -e "DESCRIBE $t" -t 2>&1 | head -20
              echo ""
              $MYSQL -e "SELECT * FROM $t WHERE brandId=2830 ORDER BY id DESC LIMIT 10" -t 2>&1 | head -25
              echo ""
            fi
          done

          echo "════ Last 400 ERROR log lines mentioning theater ════"
          LOG_ERR=/home/$(whoami)/.pm2/logs/onbrand-error.log
          [ ! -f "$LOG_ERR" ] && LOG_ERR=/home/$(whoami)/.pm2/logs/marketing-os-error.log
          tail -600 "$LOG_ERR" 2>/dev/null | grep -iE "theater|theaterRouter|theaterRun|day 2|caption writer|7-day" | tail -40

          echo ""
          echo "════ Last 100 OUT log lines mentioning theater ════"
          LOG_OUT=/home/$(whoami)/.pm2/logs/onbrand-out.log
          [ ! -f "$LOG_OUT" ] && LOG_OUT=/home/$(whoami)/.pm2/logs/marketing-os-out.log
          tail -1500 "$LOG_OUT" 2>/dev/null | grep -iE "theater" | tail -30

          echo ""
          echo "════ Active pm2 processes ════"
          pm2 list | head -10
