name: Ops (DEV) — probe doctor inspire demo end to end (read-only)

# 醫師自媒體示範頁（/inspire）整條流程在 DEV VM 上實跑一次，不經過瀏覽器：
#   幾位創作者 agent 各自想三個點子 → 挑兩個寫成稿 → 逐組條文審查（只提建議、不改稿）
#   → 另外拿一篇故意違規的稿子確認審查抓得到、建議套得回去。
# 用「這個分支」的 content/core/inspire/*.ts（題庫、agent 人設、條文、提示詞與解析）＋ VM 上的模型金鑰，
# 所以改提示詞、人設或條文可以在合併前先看產出。不讀寫資料庫。
# 100 位的人設檔很大，只把這次要跑的幾位打包上去（PROBE_KEYS）。
# 第 2 次跑：改成每位 agent 各自呼叫＋審查附建議之後。
# 第 3 次跑：CJ 補了 DEV 的模型額度之後（確認實際回覆的是哪個模型）。
# 第 7 次跑：審查每一組都帶白名單、照白名單寫的句子不算違規之後（上一次把「前期可以逆轉」判成保證療效）。
# 第 6 次跑：加上糖尿病與脂肪肝兩個領域之後（一半的 agent 跑糖尿病前期、一半跑脂肪肝）。
# 第 5 次跑：議題從高血壓換成體重管理（肥胖症），規則加上不提任何藥品名之後。
# 第 4 次跑：審查每組上限 6→20、同一句一組只報一次之後（上一次漏了「私訊我預約」那一句）。
# 花費：約 20 次模型呼叫。
# Path-scoped push，跟 op-probe-dev-influencer.yml 同一個做法（environment: dev 才會連到 DEV VM）。
on:
  push:
    paths:
      - '.github/workflows/op-probe-dev-inspire.yml'

env:
  PROBE_KEYS: "tw-fb-02,us-yt-01,tw-yt-04,us-ig-01,tw-tt-13,us-tt-12"

jobs:
  probe:
    runs-on: ubuntu-24.04
    environment: dev
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pack this branch's inspire core files (only the probed agents)
        run: |
          D=skills/ai-talent/server/content/core/inspire
          mkdir -p /tmp/pack && cp "$D/doctorInspire.ts" "$D/inspirePersonas.ts" "$D/inspireRegulations.ts" /tmp/pack/
          cat > /tmp/slim.mts <<'TS'
          import { writeFileSync } from "node:fs";
          const { PERSONA_DATA } = await import(process.cwd() + "/skills/ai-talent/server/content/core/inspire/inspirePersonaData.ts");
          const keys = String(process.env.PROBE_KEYS).split(",");
          const picked = PERSONA_DATA.filter((p: any) => keys.includes(p.key));
          console.log(`total=${PERSONA_DATA.length} picked=${picked.map((p: any) => p.key).join(",")}`);
          writeFileSync("/tmp/pack/inspirePersonaData.ts", `export const PERSONA_DATA: any[] = ${JSON.stringify(picked)};\n`);
          TS
          npx --yes tsx /tmp/slim.mts
          echo "CORE_B64=$(tar -czf - -C /tmp/pack . | base64 -w0)" >> "$GITHUB_ENV"
      - name: Ideate, write, review
        uses: appleboy/ssh-action@v1.0.3
        env:
          CORE_B64: ${{ env.CORE_B64 }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 12m
          envs: CORE_B64
          script: |
            set +e
            cd /opt/onbrand/current/skills/ai-talent
            set -a; source .env 2>/dev/null; set +a
            echo "host=$(hostname)  app=$(readlink -f /opt/onbrand/current)  now=$(date -u +%FT%TZ)"
            D=server/content/core/_probe_inspire
            mkdir -p "$D"
            echo "$CORE_B64" | base64 -d | tar -xzf - -C "$D"
            cat > "$D/_probe_tmp.ts" <<'TS'
            import { invokeLLM } from "../../../platform/core/llm/llm";
            import { finalizeDraft, inspireWritePrompt, parseIdeas, parseReviewIssues, personaIdeationPrompt, resolveTopic, reviewPrompt } from "./doctorInspire";
            import { INSPIRE_PERSONAS, leaksPersona } from "./inspirePersonas";
            import { REGULATION_GROUPS, itemsOfGroup, scanRiskTerms } from "./inspireRegulations";

            const MODEL = process.env.INSPIRE_MODEL || "claude-sonnet-4-6";
            // 直接看實際回覆的是哪個 provider／模型（callModel 回的是「要求的」那個，退到別家時看不出來）。
            const ask = async (system: string, user: string) => {
              const t0 = Date.now();
              const r: any = await invokeLLM({ provider: "anthropic", model: MODEL, messages: [{ role: "system", content: system }, { role: "user", content: user }] } as any);
              const c = r?.choices?.[0]?.message?.content;
              return { text: typeof c === "string" ? c : "", s: ((Date.now() - t0) / 1000).toFixed(1), via: String(r?.model ?? "?") };
            };
            const review = async (text: string) => {
              const hits = scanRiskTerms(text);
              const all: any[] = [];
              for (const g of REGULATION_GROUPS) {
                const items = itemsOfGroup(g.id);
                const r = await ask(reviewPrompt(items, hits), `# 待審查的成稿\n${text}`);
                const issues = parseReviewIssues(r.text, { ids: items.map((x) => x.id), text });
                console.log(`  [${g.label}] ${r.s}s ${r.via} → ${issues === null ? `PARSE FAILED: ${r.text.slice(0, 200)}` : issues.length ? "有疑慮" : "通過"}`);
                for (const i of issues ?? []) console.log(`      ${i.regulationId}｜原句：${i.quote}\n        原因：${i.detail}\n        建議：${i.suggestion || "（拿掉這一句）"}`);
                all.push(...(issues ?? []));
              }
              return all;
            };
            (async () => {
              const doctor = "王小明";
              const topics = [resolveTopic({ topicId: "dm-reverse" })!, resolveTopic({ topicId: "liver-weight" })!];
              console.log(`agents: ${INSPIRE_PERSONAS.map((p) => `${p.key}(${p.agentPrompt.length}字)`).join(" ")}`);
              const rounds = await Promise.all(INSPIRE_PERSONAS.map(async (p, i) => {
                const topic = topics[i % 2]!;
                const r = await ask(personaIdeationPrompt({ doctor, topic, persona: p, count: 3 }), "請開始想。");
                return { p, r, topic, ideas: parseIdeas(r.text, p, 3) };
              }));
              for (const { p, r, topic, ideas } of rounds) {
                console.log(`\n=== 議題：${topic.label}｜${p.key}｜${p.label}｜${p.reference}（${r.s}s，${r.via}）${ideas.length}/3`);
                if (!ideas.length) console.log(`NO USABLE IDEAS. raw:\n${r.text.slice(0, 600)}`);
                for (const a of ideas) console.log(`・${a.title}\n    開場：${a.hook}\n    怎麼做：${a.concept}\n    為什麼：${a.why}`);
              }
              for (const { p, ideas, topic } of rounds.filter((x) => x.ideas.length).slice(0, 2)) {
                const a = ideas[0]!;
                const w = await ask(inspireWritePrompt({ doctor, topic, persona: p, idea: a }), "請開始寫。");
                const text = finalizeDraft(w.text);
                console.log(`\n=== 成稿 ${p.key}「${a.title}」（${w.s}s，${w.via}，${text.length} 字，露出人名：${leaksPersona(text, p) ?? "沒有"}）\n${text}\n--- 逐條審查（只提建議）`);
                await review(text);
              }
              const bad = finalizeDraft([
                "很多人問我怎麼瘦最快。",
                "我的門診有一套獨門療程，搭配瘦瘦針，保證三個月瘦 10 公斤，而且不復胖。",
                "上個月 38 歲、在內湖科學園區當工程師的陳小姐，三個月從 82 公斤瘦到 65 公斤，她說這是她遇過最有效的方法。",
                "研究顯示每天喝兩杯黑咖啡可以多燃燒 30% 的脂肪，比運動還有用。",
                "血糖穩定之後就可以自己停藥，降血糖藥不用吃一輩子。",
                "每天一杯保肝茶，三個月脂肪肝消失。",
                "現在私訊我預約，本月前十名免費諮詢。",
              ].join("\n"));
              console.log(`\n=== 對照組：故意違規的稿子\n${bad}\n--- 逐條審查（只提建議）`);
              const found = await review(bad);
              let fixed = bad;
              const done = new Set<string>();
              for (const i of found) if (!done.has(i.quote) && fixed.includes(i.quote)) { fixed = fixed.replace(i.quote, i.suggestion); done.add(i.quote); }
              console.log(`抓到 ${found.length} 筆、${done.size} 句；涵蓋條文: ${Array.from(new Set(found.map((x) => x.regulationId))).join(", ")}\n--- 全部照建議改之後\n${fixed}`);
              process.exit(0);
            })().catch((e) => { console.log("probe failed:", e?.message); process.exit(1); });
            TS
            timeout 660 ./node_modules/.bin/tsx "$D/_probe_tmp.ts"
            echo "probe exit=$?"
            rm -rf "$D"
