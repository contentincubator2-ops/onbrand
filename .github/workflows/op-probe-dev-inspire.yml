name: Ops (DEV) — probe doctor inspire demo end to end (read-only)

# 醫師自媒體示範頁（/inspire）整條流程在 DEV VM 上實跑一次，不經過瀏覽器：
#   四種風格各想一個切角 → 挑兩個寫成稿 → 逐組條文審查 → 另外拿一篇故意違規的稿子確認審查抓得到。
# 用「這個分支」的 content/core/inspire/*.ts（題庫、風格、條文、提示詞與解析）＋ VM 上的模型金鑰，
# 所以改提示詞或條文可以在合併前先看產出。不讀寫資料庫。
# 花費：約 14 次模型呼叫。
# Path-scoped push，跟 op-probe-dev-influencer.yml 同一個做法（environment: dev 才會連到 DEV VM）。
on:
  push:
    paths:
      - '.github/workflows/op-probe-dev-inspire.yml'

jobs:
  probe:
    runs-on: ubuntu-24.04
    environment: dev
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Pack this branch's inspire core files
        run: |
          D=skills/ai-talent/server/content/core/inspire
          echo "CORE_B64=$(tar -czf - -C "$D" doctorInspire.ts inspirePersonas.ts inspireRegulations.ts | base64 -w0)" >> "$GITHUB_ENV"
      - name: Ideate, write, review
        uses: appleboy/ssh-action@v1.0.3
        env:
          CORE_B64: ${{ env.CORE_B64 }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          command_timeout: 10m
          envs: CORE_B64
          script: |
            set +e
            cd /opt/onbrand/current/skills/ai-talent
            set -a; source .env 2>/dev/null; set +a
            echo "host=$(hostname)  app=$(readlink -f /opt/onbrand/current)  now=$(date -u +%FT%TZ)"
            D=server/content/core/_probe_inspire
            mkdir -p "$D"
            echo "$CORE_B64" | base64 -d | tar -xzf - -C "$D"
            cat > "$D/_probe_tmp.ts" <<'TS'
            import { callModel } from "../../../platform/core/llm/multiModelRouter";
            import { finalizeDraft, fixPrompt, inspireIdeationPrompt, inspireWritePrompt, parseIdeas, parseReviewIssues, rejectFix, resolveTopic, reviewPrompt } from "./doctorInspire";
            import { personaOf } from "./inspirePersonas";
            import { ALL_REVIEW_ITEMS, REGULATION_GROUPS, itemsOfGroup, scanRiskTerms } from "./inspireRegulations";

            const MODEL = process.env.INSPIRE_MODEL || "claude-sonnet-4-6";
            const ask = async (system: string, user: string) => {
              const t0 = Date.now();
              const r = await callModel([{ role: "system", content: system }, { role: "user", content: user }], "creative_writing", "anthropic", MODEL);
              return { text: String(r.content ?? ""), s: ((Date.now() - t0) / 1000).toFixed(1), via: `${r.provider}/${r.model}` };
            };
            const review = async (text: string) => {
              const hits = scanRiskTerms(text);
              const all: any[] = [];
              for (const g of REGULATION_GROUPS) {
                const items = itemsOfGroup(g.id);
                const r = await ask(reviewPrompt(items, hits), `# 待審查的成稿\n${text}`);
                const issues = parseReviewIssues(r.text, { ids: items.map((x) => x.id), text });
                console.log(`  [${g.label}] ${r.s}s → ${issues === null ? `PARSE FAILED: ${r.text.slice(0, 200)}` : issues.length ? "有疑慮" : "通過"}`);
                for (const i of issues ?? []) console.log(`      ${i.regulationId}｜${i.quote}｜${i.detail}`);
                all.push(...(issues ?? []));
              }
              return all;
            };
            (async () => {
              const doctor = "王小明";
              const topic = resolveTopic({ topicId: "722" })!;
              const keys = ["fb-tw-neighborhood", "yt-us-challenge", "ig-us-routine", "tt-tw-result-first"];
              const i = await ask(inspireIdeationPrompt({ doctor, topic, personas: keys.map((k) => personaOf(k)!), count: 1 }), "請開始想。");
              const ideas = parseIdeas(i.text, { keys, perPersona: 1 });
              console.log(`\n=== 切角（${i.s}s，${i.via}）${ideas.length}/${keys.length}`);
              if (!ideas.length) console.log(`PARSE FAILED. raw:\n${i.text.slice(0, 800)}`);
              for (const a of ideas) console.log(`[${a.persona}｜${personaOf(a.persona)!.label}｜${a.format}]\n  答: ${a.answer}\n  切角(${a.title.length}): ${a.title}\n  開場(${a.hook.length}): ${a.hook}\n  為什麼(${a.why.length}): ${a.why}`);
              for (const a of ideas.filter((x) => ["fb-tw-neighborhood", "tt-tw-result-first"].includes(x.persona))) {
                const w = await ask(inspireWritePrompt({ doctor, topic, persona: personaOf(a.persona)!, idea: a }), "請開始寫。");
                const text = finalizeDraft(w.text);
                console.log(`\n=== 成稿 ${a.persona}（${w.s}s，${text.length} 字）\n${text}\n--- 逐條審查`);
                const issues = await review(text);
                if (issues.length) {
                  const withLaw = issues.map((x) => ({ ...x, law: ALL_REVIEW_ITEMS.find((r) => r.id === x.regulationId)?.law ?? "" }));
                  const f = await ask(fixPrompt(withLaw), `# 原稿\n${text}`);
                  const revised = finalizeDraft(f.text);
                  console.log(`--- 改寫（${f.s}s）拒收原因: ${rejectFix(text, revised, issues) ?? "無，收下"}\n${revised}`);
                }
              }
              const bad = finalizeDraft([
                "很多人問我血壓藥是不是要吃一輩子。",
                "我的門診有一套獨門療程，照著做保證三個月根治高血壓，從此不用吃藥。",
                "上個月 52 歲、在內湖科學園區當工程師的陳先生，血壓從 180 降到 110，他說這是他遇過最有效的方法。",
                "研究顯示每天喝兩杯芹菜汁可以降血壓 20%，比吃藥還好。",
                "現在私訊我預約，本月前十名免費諮詢。",
              ].join("\n"));
              console.log(`\n=== 對照組：故意違規的稿子\n${bad}\n--- 關鍵字掃描`);
              for (const h of scanRiskTerms(bad)) console.log(`  ${h.regulationId}｜${h.why}｜${h.quote}`);
              console.log(`--- 逐條審查`);
              const found = await review(bad);
              console.log(`抓到 ${found.length} 句；涵蓋條文: ${Array.from(new Set(found.map((x) => x.regulationId))).join(", ")}`);
              process.exit(0);
            })().catch((e) => { console.log("probe failed:", e?.message); process.exit(1); });
            TS
            timeout 540 ./node_modules/.bin/tsx "$D/_probe_tmp.ts"
            echo "probe exit=$?"
            rm -rf "$D"
